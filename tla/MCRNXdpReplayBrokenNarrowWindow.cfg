\* MCRNXdpReplay reversed witness: the kernel window is one short of the
\* userspace replay window (the shape of ROCKETNET_XDP_REPLAY_WINDOW 16
\* against ROCKETNET_REPLAY_WINDOW_BITS 4096). Must fail
\* FreshGenuineNeverDropped: a genuine packet reordered behind the mark,
\* inside the userspace window, is dropped in the kernel
\* (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1           = A1
    Addresses    = {A1}
    MaxSeq       = 5
    W            = 2
    Sessions     = 2
    MaxInFlight  = 2
    ForgetCapacity = 1
    KernelWindow <- KernelWindowBroken

INVARIANTS
    TypeOK
    MarkNeverAhead
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    NewSessionNeverDroppedByOldMark

PROPERTIES
    KernelNeverWrites
