\* MCRNServerStats: the sent side. In-order writes with gaps and jumps up to
\* sequence 14 over a ring of 6, acks in any order, spans from sequence
\* bounds. README-RNServerStats.md gives the reversed witnesses.
SPECIFICATION Spec

CONSTANTS
    N              = 6
    MaxSeq         = 14
    MaxWrites      = 8
    Late           = FALSE
    Reorder        = FALSE
    SeqTimes       = TRUE
    BrokenEntering = FALSE
    BrokenCrossing = FALSE

INVARIANTS
    TypeOK
    BaseFollowsHighest
    CountedIsWindow
    EligibleExact
    BoundsExact
    OrderedByTime
    PublishedSpanExact
    AckedSpanExact
