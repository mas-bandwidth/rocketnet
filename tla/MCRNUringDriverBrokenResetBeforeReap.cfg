\* MCRNUringDriver reversed witness: send_packets resets the reservation
\* index right after Submit, before the send CQEs are reaped.  Must fail
\* NoReuseWhileKernelOwned: the next start_packet reserves a slot whose
\* frame and msghdr the kernel still owns.
SPECIFICATION Spec

CONSTANTS
    Slots             = 2
    Buffers           = 2
    MaxSteps          = 2
    ResetWaitsForReap = FALSE
    ReapIntoFill      = TRUE

INVARIANTS
    TypeOK
    NoReuseWhileKernelOwned
    ExposedStable
    BufferReturnedAfterCopy
    FreedOnlyWhenDrained
