\* MCLinkReconfigure: the live setting takes effect at once.  A packet sent
\* after the change is held to the new setting, and the change drops nothing
\* that was already in flight.
SPECIFICATION Spec

CONSTANTS
    Packets         = {a, b}
    Capacity        = 2
    MaxDelay        = 1
    Duplication     = FALSE
    Reordering      = FALSE
    Pattern         = "none"
    BurstStart      = 1
    BurstLen        = 2
    Reconfigurable  = TRUE
    MaxVersions     = 2
    Fault           = "none"

INVARIANTS
    MCTypeOK
    LiveSettingHolds
    InFlightBounded
