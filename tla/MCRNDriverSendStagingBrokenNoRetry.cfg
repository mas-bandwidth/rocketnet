\* MCRNDriverSendStaging reversed witness: the equal-counter re-flush removed.
\* send_packets flushes only when the staged and flushed counters differ;
\* the retained generation leaves the counters equal, so after the worker
\* retires nothing publishes it and RetryFlushPublishes falls.  Must fail.
SPECIFICATION Spec
CONSTANTS
    MaxFrames = 4
    MaxStaged = 3
    MaxBurst = 2
    DisconnectAdvancesStaged = TRUE
    RetainProducer = TRUE
    RetryFlushWhenEqual = FALSE
INVARIANTS
    TypeOK
    RetryFlushPublishes
