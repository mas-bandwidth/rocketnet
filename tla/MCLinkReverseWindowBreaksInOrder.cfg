\* MCLinkReverseWindowBreaksInOrder.cfg: a model relying on in-order delivery (SurvivorsInOrder) breaks under the window reversal.
SPECIFICATION SpecReverseWindow
CONSTANTS
    Packets     = {1, 2, 3, 4, 5, 6}
    Capacity    = 6
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = TRUE
    Pattern     = "none"
    BurstStart  = 1
    BurstLen    = 3
    MaxSeq      = 6
    Defect      = "none"
INVARIANTS
    MCPatternsTypeOK
    InFlightBounded
    SurvivorsInOrder
