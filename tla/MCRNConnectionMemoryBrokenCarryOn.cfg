\* Reversed witness: MCRNConnectionMemory.cfg with CarryOn = TRUE (an exhausted
\* connection keeps taking room: Use and UseSpan, the small send and the span
\* of a large send). TLC must fail ExhaustionOnlyLeadsToDisconnect.
SPECIFICATION Spec

CONSTANTS
    Slots    = {s1, s2, s3}
    Clients  = {c1, c2, c3, c4}
    Capacity = 3
    Reset    = TRUE
    CarryOn  = TRUE

INVARIANTS
    TypeOK
    UsedBounded
    ExhaustedReasonNamed
    ReusedSlotStartsClean

PROPERTIES
    ExhaustionOnlyLeadsToDisconnect
    NoCrossSlotEffect
    ExhaustedEventuallyFree
