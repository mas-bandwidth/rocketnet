\* MCRNClientIo reversed witness: the send is held in the I/O step until it
\* completes (BlockingSend, the synchronous sendto the Windows kernel held
\* for 0.94 s), so the I/O thread sits in a blocking send step and
\* IoNeverBlocksOnSend falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    NumSlots           = 2
    BufferCap          = 1
    MaxDatagrams       = 3
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = FALSE
    SwapNeedsReady     = FALSE
    HandOffWaits       = FALSE
    FullWaitReadable   = FALSE
    StepDriven          = FALSE
    StepModeStartsThread = FALSE
    BlockingSend <- MCTrue

INVARIANTS
    TypeOK
    NoReuseBeforeSent
    ExposedStable
    FreedOnlyAfterJoin
    HandOffNeverWaits
    FullWaitsOnWake
    NoReceiveStall
    IoNeverBlocksOnSend
    NoFreeBeforeComplete
