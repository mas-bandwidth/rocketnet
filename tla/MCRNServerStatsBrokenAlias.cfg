\* MCRNServerStats reversed witness: the received write before its floor.
\* A late write more than a ring behind the high-water mark replaces the
\* newer, counted record sharing its slot. Must fail RetainedIsNewest. The
\* committed MCRNServerStatsAlias.cfg with one constant flipped.
SPECIFICATION Spec

CONSTANTS
    N              = 4
    MaxSeq         = 9
    MaxWrites      = 4
    Late           = TRUE
    Reorder        = FALSE
    SeqTimes       = FALSE
    BrokenEntering = FALSE
    BrokenCrossing = FALSE
    BrokenAlias    = TRUE

INVARIANTS
    RetainedIsNewest
