\* MCRNClientIoDecrypt reversed witness: the I/O thread reads the retired
\* epoch and keeps its copy of the open key.  Must fail NoOpenWithoutKeys.
SPECIFICATION Spec

CONSTANTS
    BufferCap        = 2
    MaxDatagrams     = 4
    MaxSeq           = 3
    W                = 1
    MaxReplays       = 1
    MaxForged        = 1
    IntegrityLimit   = 1
    OpenBeforeReplay = FALSE
    SharedWindow     = FALSE
    NoRetire         = TRUE
    CountOnIo        = FALSE

INVARIANTS
    TypeOK
    CheapRefusalsFirst
    NoOpenWithoutKeys
    MirrorAgrees
    AcceptedOnce
    SingleWriter
    ExposedStable
    NoReceiveStall
