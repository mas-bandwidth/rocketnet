\* MCFragmentsAndAcksFindStale: the shipped stale rule with counts {2, 3}.
\* IdSpace is 16 so the quarter-space reach contains the honest ids. Data loss
\* is a finite burst, the ack link is lossless, and duplication and reordering are
\* off, so the pass finishes inside the budget. Expected to pass
\* StaleOnlyIfOlder.
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq       = 6
    SentRing     = 4
    AggRing      = 2
    BatchCap     = 1
    Window       = 4
    MaxRanges    = 2
    Slots        = 1
    IdSpace      = 16
    FirstId      = 1
    StaleAhead   = 1
    StaleRule    = "code"
    MaxGen       = 3
    MaxCount     = 3
    Counts       = {2, 3}
    Stride       = 2
    FinalBytes   = 1
    MaxPayload   = 5
    MaxFragment  = 3
    DrainCap     = 4
    DeliveredCap = 2
    DefectIds    = {}
    Burns        = TRUE
    Witness      = "none"
    D2RPattern   = "burst"
    R2DPattern   = "none"
    Capacity     = 1
    MaxDelay     = 0
    Duplication  = FALSE
    Reordering   = FALSE
    BurstStart   = 3
    BurstLen     = 2

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    DeliveredExact
    DeliveredOnce
    CompleteDelivers
    ArenaBounded
    StaleOnlyIfOlder
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked
