\* MCFragmentsAndAcksFindStale: find-stale, finding D1. The code's stale test at
\* StaleAhead 1 refuses an honest id after one payload is lost whole; expected to
\* violate StaleOnlyIfOlder (README-FragmentsAndAcks.md).
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq       = 6
    SentRing     = 4
    AggRing      = 2
    BatchCap     = 1
    Window       = 4
    MaxRanges    = 2
    Slots        = 1
    IdSpace      = 8
    FirstId      = 1
    StaleAhead   = 1
    StaleRule    = "code"
    MaxGen       = 3
    MaxCount     = 3
    Counts       = {2, 3}
    Stride       = 2
    FinalBytes   = 1
    MaxPayload   = 5
    MaxFragment  = 3
    DrainCap     = 4
    DeliveredCap = 2
    DefectIds    = {}
    Burns        = TRUE
    Witness      = "none"
    D2RPattern   = "arbitrary"
    R2DPattern   = "arbitrary"
    Capacity     = 2
    MaxDelay     = 0
    Duplication  = TRUE
    Reordering   = TRUE
    BurstStart   = 3
    BurstLen     = 2

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    DeliveredExact
    DeliveredOnce
    CompleteDelivers
    ArenaBounded
    StaleOnlyIfOlder
