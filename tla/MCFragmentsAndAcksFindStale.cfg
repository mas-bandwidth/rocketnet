\* MCFragmentsAndAcksFindStale: the shipped stale rule, on a terrain that
\* exercises the REACH comparison. IdSpace is 16, so Reach is 4; FirstId is 3 and
\* MaxGen is 3, so the honest ids are 3, 4 and 5, and id 5 is farther than
\* Reach from the initial reference 0. MaxSeq is 6 and counts is {2}, so an
\* update that issues all three fragmented payloads spends every sequence;
\* the finite burst drops the fourth send, payload 4's final fragment.
\* Payload 3 completes and moves the reference to 3; payload 4's first
\* fragment then occupies the slot, and payload 5 arrives against that
\* lower-generation occupant. With the reference advancing, id 5 is within
\* Reach and accepted; with AdvanceCompleted a no-op the reference stays 0,
\* id 5 is farther than Reach and refused as stale, and StaleOnlyIfOlder
\* fails. The ack link is lossless and duplication and reordering are off,
\* so the pass finishes inside the budget. Expected to pass StaleOnlyIfOlder.
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq       = 6
    SentRing     = 4
    AggRing      = 2
    BatchCap     = 1
    Window       = 4
    MaxRanges    = 2
    Slots        = 1
    IdSpace      = 16
    FirstId      = 3
    StaleAhead   = 1
    StaleRule    = "code"
    MaxGen       = 3
    MaxCount     = 3
    Counts       = {2}
    Stride       = 2
    FinalBytes   = 1
    MaxPayload   = 5
    MaxFragment  = 3
    DrainCap     = 4
    DeliveredCap = 2
    DefectIds    = {}
    Burns        = FALSE
    Witness      = "none"
    D2RPattern   = "burst"
    R2DPattern   = "none"
    Capacity     = 1
    MaxDelay     = 0
    Duplication  = FALSE
    Reordering   = FALSE
    BurstStart   = 4
    BurstLen     = 1

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    DeliveredExact
    DeliveredOnce
    CompleteDelivers
    ArenaBounded
    StaleOnlyIfOlder
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked
