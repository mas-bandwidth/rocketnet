\* MCRNClientIo reversed witness: a ring is reopened to the game threads
\* while the I/O thread is still sending it (Reopen before IoFinishRing).
\* A game thread then writes a slot of a ring the I/O thread owns, and
\* NoReuseBeforeSent falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    NumSlots           = 2
    MaxHandOffs        = 3
    MaxDatagrams       = 2
    ReopenBeforeSent   = TRUE
    ReceiveIntoExposed = FALSE

INVARIANTS
    TypeOK
    NoReuseBeforeSent
    ExposedStable
    FreedOnlyAfterJoin
