\* MCRNRioDriver reversed witness: RetryRefused = FALSE restores the old
\* rule that a refused re-post retires its slice.  A transient refusal
\* while the socket runs leaves the slice Copied instead of in the retry
\* list, and ReceiveDepthNeverShrinks falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Slots            = 2
    Slices           = 2
    MaxSteps         = 1
    SwitchWaitsDrain = TRUE
    FreeWaitsDrain   = TRUE
    ReceiveBounded   = TRUE
    RetryRefused     = FALSE
    RunRetiresAll    = TRUE

INVARIANTS
    TypeOK
    ReceiveCallBound
    NoReserveIntoPostedPhase
    OutstandingCounts
    RunPostedTogether
    CompletionsOwned
    ExposedStable
    RepostOnlyAfterCopy
    ReceiveDepthNeverShrinks
    FreedOnlyWhenDrained
