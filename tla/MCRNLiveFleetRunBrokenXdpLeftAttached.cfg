\* MCRNLiveFleetRun reversed witness: teardown skips the detach on the
\* crash path (it trusts the server's destroy, which a crashed server never
\* ran). Must fail TeardownDetaches: the run reaches done with XDP still
\* attached.
SPECIFICATION Spec

CONSTANTS
    C1            = C1
    C2            = C2
    S1            = S1
    Clients       = {C1, C2}
    TestServer    = S1
    Cycles        = 2
    T             = 1
    WatchdogBound = 2
    DeadmanBound  = 5
    MaxClients    = 2
    MaxFaults     = 1
    TeardownDetachesOnCrash <- TeardownDetachesOnCrashBroken

INVARIANTS
    TypeOK
    XdpNeverOrphaned
    TeardownDetaches
    XdpOnlyUnderDeadman
    NoClientBeforeListen
    NoBenchServer
    ReconnectAfterTwoTimeouts
    ReconnectIntoFreedSlot
    NeverDenied
