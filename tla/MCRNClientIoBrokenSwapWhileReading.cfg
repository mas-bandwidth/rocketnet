\* MCRNClientIo reversed witness: the I/O thread writes a datagram into
\* the buffer update has exposed.  The exposed buffer changes between two
\* Swaps, and ExposedStable falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    NumSlots           = 2
    MaxHandOffs        = 3
    MaxDatagrams       = 2
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = TRUE

INVARIANTS
    TypeOK
    NoReuseBeforeSent
    ExposedStable
    FreedOnlyAfterJoin
