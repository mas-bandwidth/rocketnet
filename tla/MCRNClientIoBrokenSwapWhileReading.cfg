\* MCRNClientIo reversed witness: the I/O thread writes a datagram into
\* the buffer update has exposed.  The exposed buffer changes between Expose
\* and Return, and ExposedStable falls.  BufferCap is 2 here: the exposed
\* buffer holds at least one datagram, so a buffer of one has no room
\* for the defect's write.  Must fail.
SPECIFICATION Spec

CONSTANTS
    NumSlots           = 2
    BufferCap          = 2
    MaxDatagrams       = 3
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = TRUE
    SwapNeedsReady     = FALSE
    HandOffWaits       = FALSE
    FullWaitReadable   = FALSE
    StepDriven          = FALSE
    StepModeStartsThread = FALSE

INVARIANTS
    TypeOK
    NoReuseBeforeSent
    ExposedStable
    FreedOnlyAfterJoin
    HandOffNeverWaits
    FullWaitsOnWake
    NoReceiveStall
