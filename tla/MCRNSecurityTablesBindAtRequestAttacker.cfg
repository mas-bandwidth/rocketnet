\* Reversed witness: BindAtRequest = TRUE, checked against NoBindToNonHolder
\* alone: the attacker's replay from an address that holds no keys binds the
\* token, which is the denial of service the binding at response removes.
SPECIFICATION Spec

CONSTANTS
    None = None
    Addrs = {"A", "B"}
    Tokens = {"th", "te", "tf"}
    Expire <- MCExpire
    Cid <- MCCid
    MaxClock = 4
    CookieLife = 1
    RotatePeriod = 2
    MaxClients = 2
    HistoryCap = 2
    AdmittedCap = 2
    VerifyBudget = 2
    HandshakeDeadline = 4
    Rotation = TRUE
    AcceptPrevious = TRUE
    RefuseAdmittedAtResponse = TRUE
    AdmitExpiredAtResponse = FALSE
    EvictLiveHistory = FALSE
    DeniedConsumesToken = FALSE
    CapVerifyBudget = TRUE
    PreviousOutlivesWindow = FALSE
    BindAtRequest = TRUE
    Holds <- MCHolds
    HoldUntilExpire = FALSE
    CheckCidAtResponse = TRUE

INVARIANTS
    NoBindToNonHolder

PROPERTIES
    DeniedTokenStaysUsable
    RotationWindow
    PreviousBoundedToOnePeriod
    InFlightCookieSurvivesRotation

CHECK_DEADLOCK FALSE
