CONSTANTS
    Packets     = {1, 2, 3, 4, 5, 6}
    Capacity    = 6
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = FALSE
    Pattern     = "everynth"
    BurstStart  = 1
    BurstLen    = 3
    MaxSeq      = 6
    Defect      = "wrong_period"
INVARIANTS
    MCPatternsTypeOK
    InFlightBounded
    EveryNthDropped
    SurvivorsInOrder
