\* MCRNResendTiming reversed witness: the two delay classes in one resend
\* FIFO ordered by last send, walked from its head and stopped at the first
\* record not due (the defaults, one tick is 100 ms). Must fail
\* SmallNeverHeldByChunk: the chunk and the small record are both sent at 0,
\* the chunk first; a sample moves rto to 200 ms (any rto above 100 ms); at 100 ms the small record
\* is due (min(rto, resend_interval)) but the chunk at the head is not (rto),
\* so the walk stops and the update ends with the small record unsent.
SPECIFICATION Spec

CONSTANTS
    Interval    = 1
    RtoInitial  = 1
    RtoMin      = 1
    RtoMax      = 3
    Timeout     = 100
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    OneFifo     <- OneFifoTwoDelays

INVARIANTS
    TypeOK
    SmallNeverHeldByChunk
