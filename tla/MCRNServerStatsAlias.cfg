\* MCRNServerStats: the received side over a ring of 4 (a window of 2),
\* sequences to 9, so a late write can land more than a ring behind the
\* high-water mark on the slot of a newer counted record. The write below
\* the base is refused; the newer record stays retained and counted.
SPECIFICATION Spec

CONSTANTS
    N              = 4
    MaxSeq         = 9
    MaxWrites      = 4
    Late           = TRUE
    Reorder        = FALSE
    SeqTimes       = FALSE
    BrokenEntering = FALSE
    BrokenCrossing = FALSE
    BrokenAlias    = FALSE

INVARIANTS
    TypeOK
    BaseFollowsHighest
    CountedIsWindow
    BoundsExact
    OrderedByTime
    PublishedSpanExact
    RetainedIsNewest

PROPERTIES
    LateNeverShrinks
