\* MCRNXdpReplay: the reconnect control. Two addresses, three sessions (so
\* a reconnect at one address can meet a second release at the other) and
\* one pending-forget entry, refused up to twice: a reconnect may arrive
\* before the walk queues the old forget, while the buffer is full of the
\* other address's forget, or while the kernel refuses the old delete.
\* There is no settle guard on Connect and no trace suppression; the new
\* session's first mark, zero included, replaces the old entry in the
\* commit before its first keep-alive. Sequences are 1..3, the replay
\* window is 2, and at most one packet is in flight. The reversed witness
\* is MCRNXdpReplayBrokenReconnectFreshness.cfg (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1          = A1
    A2          = A2
    Addresses   = {A1, A2}
    MaxSeq      = 3
    W           = 2
    Sessions    = 3
    MaxInFlight = 1
    ForgetCapacity = 1
    ForgetFailureBudget <- ForgetFailureBudgetTwo

INVARIANTS
    TypeOK
    ForgetOwedUntilApplied
    MarkNeverAhead
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    NewSessionNeverDroppedByOldMark
    ReleasedSlotForgetsItsReplyMac
    RetryNeverDeletesNewerMark

PROPERTIES
    KernelNeverWrites
