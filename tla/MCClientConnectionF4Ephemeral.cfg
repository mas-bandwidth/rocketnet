\* MCClientConnectionF4Ephemeral.cfg: EphemeralErasedOutsideHandshake holds.
\* The old counterexample is connect, two ticks, state -2 with the ephemeral
\* still live. A deadline or a timeout zeroes it, as does a denial. This
\* instance is that trace: a silent server and the idle timeout. The full
\* environment does not finish once the property holds.
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 2
    Deadline         = 0
    ServerDeadline   = 0
    MaxAttempts      = 1
    MaxNonces        = 1
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = TRUE
    ServerPayloads   = FALSE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    EphemeralErasedOutsideHandshake
