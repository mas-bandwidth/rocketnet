\* MCRNClientIoDecrypt: the committed run, every rule on.  Checks the
\* safety invariants and, under the fairness of SpecFair (the I/O thread's
\* receive, check, open, publish, owe, epoch reads and wakes; update's
\* Expose, record consumption, PublishKeys and Return), the liveness
\* properties.
SPECIFICATION SpecFair

CONSTANTS
    BufferCap        = 2
    MaxDatagrams     = 4
    MaxSeq           = 3
    W                = 1
    MaxReplays       = 1
    MaxForged        = 1
    IntegrityLimit   = 1
    OpenBeforeReplay = FALSE
    SharedWindow     = FALSE
    NoRetire         = FALSE
    CountOnIo        = FALSE

INVARIANTS
    TypeOK
    CheapRefusalsFirst
    NoOpenWithoutKeys
    MirrorAgrees
    AcceptedOnce
    SingleWriter
    ExposedStable
    NoReceiveStall

PROPERTIES
    GenuineEventuallyAccepted
    RetiredEventuallyZeroed
