\* MCRNRioDriver reversed witness: RunRetiresAll = FALSE lets a USO run's
\* one completion free only its first slot, as a retire that read the
\* request context as one datagram would.  The run's second slot stays
\* Posted with no post left to complete it, and RunPostedTogether falls.
\* Must fail.
SPECIFICATION Spec

CONSTANTS
    Slots            = 2
    Slices           = 1
    MaxSteps         = 0
    SwitchWaitsDrain = TRUE
    FreeWaitsDrain   = TRUE
    ReceiveBounded   = TRUE
    RetryRefused     = TRUE
    RunRetiresAll    = FALSE

INVARIANTS
    TypeOK
    ReceiveCallBound
    NoReserveIntoPostedPhase
    OutstandingCounts
    RunPostedTogether
    CompletionsOwned
    ExposedStable
    RepostOnlyAfterCopy
    ReceiveDepthNeverShrinks
    FreedOnlyWhenDrained
