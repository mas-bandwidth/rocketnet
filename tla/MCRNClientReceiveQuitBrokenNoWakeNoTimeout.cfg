\* MCRNClientReceiveQuit reversed witness: a wait with no timeout and no
\* wake (thread_wake a no-op on linux, the wait never timing out).  A
\* thread that entered its wait before destroy never returns from it, so
\* the join never returns: DestroyCompletes falls.  Must fail.
SPECIFICATION SpecFair

CONSTANTS
    Platform       = "linux"
    WaitTimeout    = "none"
    WakeBeforeQuit = FALSE
    NoWake         = TRUE

INVARIANTS
    TypeOK
    NoJoinBeforeExit
    WokenSeesQuit

PROPERTIES
    DestroyCompletes
