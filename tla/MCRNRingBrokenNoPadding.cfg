\* MCRNRing reversed witness: no padding at the boundary. Must fail
\* SpanInsideRing: a span crosses a multiple of B and wraps. The committed
\* MCRNRing.cfg with one line changed.
SPECIFICATION Spec

CONSTANTS
    B              = 64
    Lengths        = {1, 32, 48}
    FragBytes      = 16
    BlockFragments = 2
    MaxBlocks      = 1
    MaxNumbers     = 6
    FloorAtUPrime  = TRUE
    PadAtBoundary  = FALSE
    IdleFloorAtP   = TRUE
    Round16        = TRUE

INVARIANTS
    TypeOK
    LiveSpansDisjoint
    SpanInsideRing
    Aligned
    IdleAdmitsAnyMessage

PROPERTIES
    EveryAdmissibleMessagePlaced
    NoRecordWaitsForever
