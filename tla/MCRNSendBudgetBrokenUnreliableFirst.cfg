\* Reversed witness: MCRNSendBudget.cfg with ReliableFirst = FALSE (the writer
\* offers unreliable items before the reliable classes). Under a steady
\* unreliable load each update's refill is spent before a 2-byte reliable item
\* fits. TLC must fail EveryReliableEventuallySent. ClassOrder is the safety
\* face of the same flaw and is left out, so the failure checked is the
\* liveness one.

SPECIFICATION Spec

CONSTANTS
    W             = 2
    Rate          = 1
    Depth         = 2
    MaxPkt        = 2
    RelSize       = 2
    UnrelSize     = 1
    UPerTick      = 2
    MaxRel        = 2
    MaxLoss       = 1
    CheckBudget   = TRUE
    ReliableFirst = FALSE
    RefundOnFail  = TRUE
    MaxFail       = 1

INVARIANTS
    TypeOK
    FailedSendCostsNothing
    NeverOverspend
    ReliableNeverDropped
    UnreliableDroppedOnlyOverBudget

PROPERTIES
    EveryReliableEventuallySent
