\* MCRNSendSpans reversed witness: a free repairs its predecessor's next link
\* but not its successor's prev. Must fail ListInAllocationOrder.
\* The committed MCRNSendSpans.cfg with one constant changed.
SPECIFICATION Spec

CONSTANTS
    SR            = 96
    Lengths       = {1, 32, 48, 96}
    Q             = 4
    FloorAtOldest = TRUE
    PadOnWrap     = TRUE
    SpliceBoth    = FALSE

INVARIANTS
    TypeOK
    LiveSpansDisjoint
    SpanInsideRing
    Aligned
    HeadIsOldestStart
    ListInAllocationOrder
    EmptyIsZero
    FullAdmitsNothing
    IdleAdmitsAnyMessage
    LiveBetweenHeadAndTail
