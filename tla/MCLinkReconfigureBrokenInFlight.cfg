\* MCLinkReconfigureBrokenInFlight: the reversed witness for the second half
\* of LiveSettingHolds.  The change drops the copies that were already in
\* flight, which the change must never do.
SPECIFICATION Spec

CONSTANTS
    Packets         = {a, b}
    Capacity        = 2
    MaxDelay        = 1
    Duplication     = FALSE
    Reordering      = FALSE
    Pattern         = "none"
    BurstStart      = 1
    BurstLen        = 2
    Reconfigurable  = TRUE
    MaxVersions     = 2
    Fault           = "drops_in_flight"

INVARIANTS
    MCTypeOK
    LiveSettingHolds
    InFlightBounded
