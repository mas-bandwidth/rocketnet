\* MCClientConnectionSDelay.cfg: MCClientConnection safety with KindLoss "none", C2SPattern "first", S2CPattern "first", latency.
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 2
    Deadline         = 4
    ServerDeadline   = 3
    MaxAttempts      = 1
    MaxNonces        = 2
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "first"
    S2CPattern       = "first"
    Capacity         = 2
    MaxDelay         = 1
    Duplication      = TRUE
    Reordering       = TRUE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    SafetyInvariants
PROPERTIES
    StepsForwardOrFails
    DisconnectIsTerminal
    TimeoutPairing
    AcceptedUnderLiveKeys
    NoSendOnArrival
