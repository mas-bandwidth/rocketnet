\* MCRNClientIoDecrypt reversed witness: the I/O thread's open also
\* advances replay_session (mainWin), which update owns and the fill
\* threads read.  Must fail SingleWriter.
SPECIFICATION Spec

CONSTANTS
    BufferCap        = 2
    MaxDatagrams     = 4
    MaxSeq           = 3
    W                = 1
    MaxReplays       = 1
    MaxForged        = 1
    IntegrityLimit   = 1
    OpenBeforeReplay = FALSE
    SharedWindow     = TRUE
    NoRetire         = FALSE
    CountOnIo        = FALSE

INVARIANTS
    TypeOK
    CheapRefusalsFirst
    NoOpenWithoutKeys
    MirrorAgrees
    AcceptedOnce
    SingleWriter
    ExposedStable
    NoReceiveStall
