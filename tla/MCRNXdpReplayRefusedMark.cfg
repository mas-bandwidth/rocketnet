\* MCRNXdpReplay: the refused-mark control, two addresses and one
\* pending-forget entry. The kernel may refuse up to two
\* marks and one forget over the run, so a reconnect's zero mark can be
\* refused, kept, refused again and then applied. A refused mark stays
\* pending until it lands or a newer mark or a queued forget of its address
\* replaces it. The client is greeted after the commit whatever the kernel
\* did, so a new session's packets may meet the old entry until the retry
\* lands: NewSessionDroppedOnlyWhileMarkOwed and MarkOwedUntilApplied hold
\* here in place of NewSessionNeverDroppedByOldMark, which assumes every
\* mark applies (it holds in MCRNXdpReplay.cfg and
\* MCRNXdpReplayReconnect.cfg). The reversed witnesses are
\* MCRNXdpReplayBrokenRefusedMarkDropped.cfg and
\* MCRNXdpReplayBrokenKeptMarkAfterForget.cfg (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1                = A1
    A2                = A2
    Addresses         = {A1, A2}
    MaxSeq            = 3
    W                 = 2
    Sessions          = 2
    MaxInFlight       = 1
    ForgetCapacity    = 1
    MarkFailureBudget <- MarkFailureBudgetTwo

INVARIANTS
    TypeOK
    ForgetOwedUntilApplied
    MarkNeverAhead
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    NewSessionDroppedOnlyWhileMarkOwed
    ReleasedSlotForgetsItsReplyMac
    RetryNeverDeletesNewerMark
    MarkOwedUntilApplied

PROPERTIES
    KernelNeverWrites
