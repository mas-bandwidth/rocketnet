\* MCRNXdpReplay: the refused-mark control, two addresses and one
\* pending-forget entry. The kernel may refuse up to two
\* marks and one forget over the run, so a reconnect's zero mark can be
\* refused (by the kernel or by a full pending buffer), kept or owed,
\* refused again and then applied. A refused mark stays pending until it
\* lands or a newer mark or a queued forget of its address replaces it; a
\* mark the buffer refused leaves the walk's cache where it was, so the next
\* walk takes it again. A new session is greeted only once its zero mark is
\* applied, so NewSessionNeverDroppedByOldMark holds here as in the other
\* controls, beside MarkOwedUntilApplied. The reversed witnesses are
\* MCRNXdpReplayBrokenRefusedMarkDropped.cfg,
\* MCRNXdpReplayBrokenKeptMarkAfterForget.cfg,
\* MCRNXdpReplayBrokenGreetBeforeMark.cfg and
\* MCRNXdpReplayBrokenQueueRefusedAdvances.cfg (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1                = A1
    A2                = A2
    Addresses         = {A1, A2}
    MaxSeq            = 3
    W                 = 2
    Sessions          = 2
    MaxInFlight       = 1
    ForgetCapacity    = 1
    MarkFailureBudget <- MarkFailureBudgetTwo

INVARIANTS
    TypeOK
    ForgetOwedUntilApplied
    MarkNeverAhead
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    NewSessionNeverDroppedByOldMark
    ReleasedSlotForgetsItsReplyMac
    RetryNeverDeletesNewerMark
    MarkOwedUntilApplied

PROPERTIES
    KernelNeverWrites
