\* MCRNXdpReplay: the held-reply control, two addresses and one
\* pending-forget entry. The link holds up to two replies over the run: a
\* handshake reply to a frame from an address with no session, a live
\* session's reply, or a reply to an address no frame came from, and each
\* leaves later with no frame in hand. A held reply to an address a frame
\* came from finds its MAC before the learn and after the forget
\* (HeldReplyFindsItsMac), and no reply with no frame in hand goes to an
\* address no frame came from (NeverSeenNeverSentTo), beside every replay
\* invariant of the design. The reversed witnesses are
\* MCRNXdpReplayBrokenAnsweredNotKept.cfg,
\* MCRNXdpReplayBrokenForgetDropsAnswered.cfg and
\* MCRNXdpReplayBrokenAnswerAnyAddress.cfg (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1              = A1
    A2              = A2
    Addresses       = {A1, A2}
    MaxSeq          = 3
    W               = 2
    Sessions        = 2
    MaxInFlight     = 1
    ForgetCapacity  = 1
    HeldReplyBudget <- HeldReplyBudgetTwo

INVARIANTS
    TypeOK
    ForgetOwedUntilApplied
    MarkNeverAhead
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    NewSessionNeverDroppedByOldMark
    ReleasedSlotForgetsItsReplyMac
    RetryNeverDeletesNewerMark
    MarkOwedUntilApplied
    NeverSeenNeverSentTo
    HeldReplyFindsItsMac
    AnsweredOnlyHeard

PROPERTIES
    KernelNeverWrites
