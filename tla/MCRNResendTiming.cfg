\* MCRNResendTiming: the committed run, the rule at the defaults (one tick is
\* 100 ms): a small record waits min(rto, resend_interval), a chunk of a
\* block waits rto alone (capped at reliable_timeout / 4), one resend FIFO per
\* class, no back-off. The reversed witnesses are
\* MCRNResendTimingBrokenBackoff.cfg (the first version's back-off to 8) and
\* MCRNResendTimingBrokenOneFifo.cfg (both classes in one FIFO) beside this one.
SPECIFICATION Spec

CONSTANTS
    Interval    = 1
    RtoInitial  = 1
    RtoMin      = 1
    RtoMax      = 3
    Timeout     = 100
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight

INVARIANTS
    TypeOK
    ConfigAccepted
    AttemptsBeforeTimeout
    ResendGapBounded
    SmallNeverHeldByChunk
