\* MCRNResendTiming: the committed run, the rule at the defaults (one tick is
\* 100 ms): delay = min(rto, resend_interval), no back-off. The reversed
\* witness (the first version's back-off to 8) is
\* MCRNResendTimingBrokenBackoff.cfg beside this one.
SPECIFICATION Spec

CONSTANTS
    Interval    = 1
    RtoInitial  = 1
    RtoMin      = 1
    RtoMax      = 3
    Timeout     = 100
    MaxBackoff  = 1
    MinAttempts = 4

INVARIANTS
    TypeOK
    ConfigAccepted
    AttemptsBeforeTimeout
    ResendGapBounded
