\* MCRNXdpReplay reversed witness: the walk never forgets a released slot.
\* Must fail ReleasedSlotForgetsItsReplyMac: the released address's learned
\* reply MAC is never dropped. A reconnect no longer depends on the forget,
\* since the new session's first mark replaces the old entry, so
\* NewSessionNeverDroppedByOldMark holds here too and stays listed.
\* MarkNeverAhead restates the forget rule and is left out so the run
\* reaches the harm (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1          = A1
    Addresses   = {A1}
    MaxSeq      = 5
    W           = 2
    Sessions    = 2
    MaxInFlight = 2
    ForgetCapacity = 1
    WalkForgets <- WalkForgetsBroken

INVARIANTS
    TypeOK
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    NewSessionNeverDroppedByOldMark
    ReleasedSlotForgetsItsReplyMac

PROPERTIES
    KernelNeverWrites
