\* MCRNXdpReplay reversed witness: the walk never forgets a released slot.
\* Must fail NewSessionNeverDroppedByOldMark: the old session's mark
\* survives the reconnect and drops the new session's first packets.
\* MarkNeverAhead restates the forget rule and is broken at the reconnect
\* itself, before any drop; it is left out so the run reaches the harm
\* (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1          = A1
    Addresses   = {A1}
    MaxSeq      = 5
    W           = 2
    Sessions    = 2
    MaxInFlight = 2
    ForgetCapacity = 1
    WalkForgets <- WalkForgetsBroken

INVARIANTS
    TypeOK
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    NewSessionNeverDroppedByOldMark

PROPERTIES
    KernelNeverWrites
