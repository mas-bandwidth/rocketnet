\* MCRNClientIo reversed witness: the hand-off that overwrites the Filling
\* ring's destination on every attempt.  Disconnect commits its burst
\* while the other ring is still HandedOff, so its hand-off is deferred
\* with the saved server address; the reset has zeroed the server address,
\* and the next hand-off (destroy's) overwrites the deferred ring's
\* destination with it before the I/O thread sends the burst:
\* SentToCommitted falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    NumSlots           = 2
    BufferCap          = 1
    MaxDatagrams       = 3
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = FALSE
    SwapNeedsReady     = FALSE
    HandOffWaits       = FALSE
    FullWaitReadable   = FALSE
    StepDriven          = FALSE
    StepModeStartsThread = FALSE
    DestinationOverwrite <- DestinationOverwriteOn

INVARIANTS
    TypeOK
    NoReuseBeforeSent
    ExposedStable
    FreedOnlyAfterJoin
    HandOffNeverWaits
    FullWaitsOnWake
    NoReceiveStall
    SentToCommitted
