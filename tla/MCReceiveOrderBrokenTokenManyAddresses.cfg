\* MCReceiveOrderBrokenTokenManyAddresses: BASE behaviour: no token claim, so one token admitted from a second address holds a second half-open mapping. OneHalfOpenPerToken must fail.
SPECIFICATION MCSpec

CONSTANTS
    PosVersion   = 1
    PosTimestamps = 2
    PosCompares  = 3
    PosCookie    = 4
    PosUsed      = 5
    PosAdmitted  = 6
    PosRestart   = 7
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 10
    PosKeypair   = 11
    ClaimCheck   <- MCClaimCheckOff

INVARIANTS
    TypeOK
    CheapRefusalsFirst
    OneHalfOpenPerToken
    MapBounded
