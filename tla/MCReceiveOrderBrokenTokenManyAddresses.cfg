\* MCReceiveOrderBrokenTokenManyAddresses: the request-time token claim removed. BASE defect: one token is admitted from many source addresses until the map is full. OneHalfOpenPerToken must fail on the second admitted address.
SPECIFICATION MCSpecBrokenTokenManyAddresses

CONSTANTS
    PosVersion   = 1
    PosTimestamps = 2
    PosCompares  = 3
    PosCookie    = 4
    PosUsed      = 5
    PosAdmitted  = 6
    PosRestart   = 7
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 10
    PosKeypair   = 11

INVARIANTS
    TypeOK
    TokenTypeOK
    MapBounded
    OneHalfOpenPerToken
