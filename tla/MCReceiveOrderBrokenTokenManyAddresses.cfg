\* MCReceiveOrderBrokenTokenManyAddresses: the reversed witness for the
\* request-time token claim. The token-to-address claim rung is removed
\* (TokenRequestBroken), so one token buys one half-open mapping per address
\* until the map is full. OneHalfOpenPerToken must fail with TLC's
\* counterexample.
SPECIFICATION MCSpecBrokenTokenManyAddresses

CONSTANTS
    PosVersion   = 1
    PosTimestamps = 2
    PosCompares  = 3
    PosCookie    = 4
    PosUsed      = 5
    PosAdmitted  = 6
    PosRestart   = 7
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 10
    PosKeypair   = 11

INVARIANTS
    TypeOK
    TokenTypeOK
    OneHalfOpenPerToken
