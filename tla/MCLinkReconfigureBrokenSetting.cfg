\* MCLinkReconfigureBrokenSetting.cfg: the reversed witness for
\* SendUsesForce. A change updates the setting the caller asked for but not
\* the one a send acts on, so a packet sent after the change is held to the
\* old setting.
SPECIFICATION Spec

CONSTANTS
    Packets     = {a, b}
    Capacity    = 2
    MaxDelay    = 1
    Duplication = FALSE
    Reordering  = FALSE
    Pattern     = "none"
    BurstStart  = 1
    BurstLen    = 2
    MaxSends    = 3
    Defect      = "stale"

INVARIANTS
    RCTypeOK
    SendUsesForce
