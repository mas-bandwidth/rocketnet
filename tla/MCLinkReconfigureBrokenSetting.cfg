\* MCLinkReconfigureBrokenSetting: the reversed witness for the first half of
\* LiveSettingHolds.  The link keeps the setting it started with, so a copy
\* sent after a change to "lossy" goes out while the setting in force says
\* "lossy": the send was not held to the setting in force.
SPECIFICATION Spec

CONSTANTS
    Packets         = {a, b}
    Capacity        = 2
    MaxDelay        = 1
    Duplication     = FALSE
    Reordering      = FALSE
    Pattern         = "none"
    BurstStart      = 1
    BurstLen        = 2
    Reconfigurable  = TRUE
    MaxVersions     = 2
    Fault           = "holds_old_setting"

INVARIANTS
    MCTypeOK
    LiveSettingHolds
    InFlightBounded
