\* MCRNServerSendFairWalk: the rotation walks its cursor across a wider ring.
\* Five clients share two frames per update; ceil(5 / 2) = 3 updates is the
\* bound every client meets.
SPECIFICATION Spec

CONSTANTS
    N        = 5
    K        = 2
    Mode     = "fair"
    MaxTicks = 12


INVARIANTS
    TypeOK
    FairService
