\* MCRNServerSendFair, the walk alone: five connections, two frames per
\* update, no in-place starts. Every waiting connection is served within
\* ceil(N / K) = 3 updates.
SPECIFICATION Spec

CONSTANTS
    N                      = 5
    K                      = 2
    InPlaceStarts          = FALSE
    RotateStart            = TRUE
    InPlaceWhenConstrained = FALSE

INVARIANTS
    FairWalk
    Fair
    TypeOK
