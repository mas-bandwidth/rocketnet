\* MCRNMsgxPause reversed witness: the clear stores 0 whether or not the
\* slot still holds the observed expiry. Must fail FreshPauseSurvives.
\* A worker loads an expired value, the other worker publishes a later
\* expiry, and the first worker's clear wipes that later expiry.
SPECIFICATION Spec

CONSTANTS
    Workers                = {1, 2}
    MaxTime                = 4
    Retry                  = 2
    CasClearsOnlyObserved  = FALSE

INVARIANTS
    TypeOK
    FreshPauseSurvives
