\* MCRNMsgxPause reversed witness: an expired pause is cleared by an
\* unconditional store of 0, so a worker that observed the old expiry can
\* remove a pause the other worker published after it.  Must fail
\* FreshPauseSurvives.
SPECIFICATION Spec

CONSTANTS
    Workers   = {tx, rx}
    MaxTime   = 4
    Retry     = 2
    StoreZero = TRUE

INVARIANTS
    TypeOK
    FreshPauseSurvives
