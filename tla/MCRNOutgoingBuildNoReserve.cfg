\* MCRNOutgoingBuild reversed witness: no packet of the allowance kept for
\* due reliable work, so in-place packets can spend it and leave a due
\* reliable record queued past send_packets. Must fail
\* ReliableSentWithinOneUpdate.
SPECIFICATION Spec

CONSTANTS
    N         = 6
    Cap       = 3
    NumFrames = 2
    MaxPackets = 1
    MaxAcks   = 1
    MaxFaults = 1
    Kind      <- MCKind
    Fits      <- MCFits
    Decl      <- MCDecl
    CopyStep  <- CopyStepDesign
    SharedQuota = TRUE
    Reserve   = FALSE
    MovePrior = FALSE
    ReuseCommitted = FALSE

INVARIANTS
    TypeOK
    PacketQuota
    BytesUnchangedInPlace
    NoCopy
    AcksNeverLost
    ModeOrder

PROPERTIES
    ReliableSentWithinOneUpdate
    PriorRecordsUnmoved
    FrameClosedOnlyByFullOrFlush
