\* MCReceiveOrder: the committed run, the ruled order. CheapRefusalsFirst,
\* OneLiveMappingPerToken and ClaimOnlyAfterSignature hold while requests
\* repeat and claims expire.
SPECIFICATION MCSpec

CONSTANTS
    PosRestart   = 1
    PosVersion   = 2
    PosTimestamps = 3
    PosCompares  = 4
    PosCookie    = 5
    PosUsed      = 6
    PosAdmitted  = 7
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 10
    PosKeypair   = 11

INVARIANTS
    TypeOK
    CheapRefusalsFirst
    OneLiveMappingPerToken
    ClaimOnlyAfterSignature
