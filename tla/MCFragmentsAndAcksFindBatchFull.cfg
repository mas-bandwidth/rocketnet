\* MCFragmentsAndAcksFindBatchFull: find-batchfull, finding D2. A completion dropped
\* at the delivered bound with nothing lost on the wire; expected to violate
\* BatchFullNeverFires (README-FragmentsAndAcks.md).
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq       = 6
    SentRing     = 4
    AggRing      = 2
    BatchCap     = 1
    Window       = 4
    MaxRanges    = 2
    Slots        = 2
    IdSpace      = 8
    FirstId      = 1
    StaleAhead   = 2
    StaleRule    = "serial"
    MaxGen       = 3
    MaxCount     = 3
    Counts       = {2}
    Stride       = 2
    FinalBytes   = 1
    MaxPayload   = 5
    MaxFragment  = 3
    DrainCap     = 4
    DeliveredCap = 2
    DefectIds    = {}
    Burns        = FALSE
    Witness      = "none"
    D2RPattern   = "none"
    R2DPattern   = "none"
    Capacity     = 2
    MaxDelay     = 0
    Duplication  = FALSE
    Reordering   = TRUE
    BurstStart   = 3
    BurstLen     = 2

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    DeliveredExact
    DeliveredOnce
    CompleteDelivers
    ArenaBounded
    BatchFullNeverFires
