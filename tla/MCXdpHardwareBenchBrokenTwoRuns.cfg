\* MCXdpHardwareBench reversed witness: hold without the lock. Must fail
\* OneRunAtATime: two runs hold the machine at once. The committed cfg
\* with UseLock = FALSE.
SPECIFICATION Spec

CONSTANTS
    Runs      = {r1, r2}
    UseLock   = FALSE
    MarkCrash = TRUE

INVARIANTS
    TypeOK
    OneRunAtATime
    AttachOnlyAfterVerify
    FreeMeansRestored

PROPERTIES
    EveryHoldEndsFree
