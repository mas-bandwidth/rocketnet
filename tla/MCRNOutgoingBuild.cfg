\* MCRNOutgoingBuild control: the packed in-place build of
\* docs/OUTGOING-BUILD.md. Must pass every invariant, ReliableSentWithinOneUpdate,
\* PriorRecordsUnmoved and FrameClosedOnlyByFullOrFlush.
SPECIFICATION Spec

CONSTANTS
    N         = 6
    Cap       = 3
    NumFrames = 2
    MaxPackets = 1
    MaxAcks   = 1
    MaxFaults = 1
    Kind      <- MCKind
    Fits      <- MCFits
    Decl      <- MCDecl
    CopyStep  <- CopyStepDesign
    SharedQuota = TRUE
    Reserve   = TRUE
    MovePrior = FALSE
    ReuseCommitted = FALSE

INVARIANTS
    TypeOK
    PacketQuota
    BytesUnchangedInPlace
    NoCopy
    AcksNeverLost
    ModeOrder

PROPERTIES
    ReliableSentWithinOneUpdate
    PriorRecordsUnmoved
    FrameClosedOnlyByFullOrFlush
