\* MCRNFilterEpochs reversed witness: a keyed receiver that falls back to
\* the unkeyed constant at epoch 0. Must fail NeverKeyedAtZero: the first
\* check of epoch 0 is accepted, a fallback an attacker selects.
SPECIFICATION Spec

CONSTANTS
    N           = 4
    Live        = 3
    MaxInstalls = 9
    AcceptZero  <- AcceptZeroBroken

INVARIANTS
    TypeOK
    NeverKeyedAtZero
    WrapSkipsZero
    AtLeastTwoLiveAfterRotation
    DeadEpochRefusedWithoutMac
    OneMacPerLiveEpoch
    LegitimateNeverRefused
    OldKeyRefused
    LiveGenerationsDistinct
