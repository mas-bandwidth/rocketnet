\* MCRNSentMap reversed witness: a resend delay below the round trip
\* (RTO = 1 < RTT = 2) with P = W. Must fail NoLiveEviction: a resend inside
\* the round trip evicts the first send before its ack lands. The committed
\* MCRNSentMap.cfg with RTO changed.
SPECIFICATION Spec

CONSTANTS
    W            = 3
    P            = 3
    RTT          = 2
    RTO          = 1
    MaxNum       = 4
    MaxTime      = 6
    MaxPerPacket = 2

INVARIANTS
    TypeOK
    MapBounded
    WindowBounded
    NoLiveEviction
