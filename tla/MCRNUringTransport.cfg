\* MCRNUringTransport: the committed run, the rule.  Two slots, two ring
\* buffers, two datagrams, two swaps and a budget of one CQE per call;
\* invariants plus the liveness properties under weak fairness of the
\* kernel, the reaps, the call ends and the drain.  The reversed witnesses
\* are MCRNUringTransportBrokenResetBeforeReap.cfg,
\* MCRNUringTransportBrokenOneBank.cfg and
\* MCRNUringTransportBrokenUnboundedReap.cfg beside this one.
SPECIFICATION SpecFair

CONSTANTS
    Slots             = 2
    Buffers           = 2
    MaxSteps          = 2
    Budget            = 1
    ResetWaitsForReap = TRUE
    ReapIntoFill      = TRUE
    BoundedReap       = TRUE
    RearmOnReceive    = TRUE

INVARIANTS
    TypeOK
    NoReuseWhileKernelOwned
    ExposedStable
    BufferReturnedAfterCopy
    FreedOnlyWhenDrained
    ReapWithinBudget

PROPERTIES
    SubmittedEventuallyFree
    DestroyEventuallyFrees
    ReceiveLiveness
