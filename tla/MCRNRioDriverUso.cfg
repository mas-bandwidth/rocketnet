\* MCRNRioDriver USO instance: two slots per send phase, so Post can group
\* them into one run (one RIOSendEx carrying both) or post each alone; one
\* receive slice and no datagram keep the receive side small.  Checks the
\* safety invariants, RunPostedTogether among them, and PostedEventuallyFree
\* and CloseEventuallyFrees under weak fairness: a run's one completion frees
\* both of its slots.
SPECIFICATION SpecFair

CONSTANTS
    Slots            = 2
    Slices           = 1
    MaxSteps         = 0
    SwitchWaitsDrain = TRUE
    FreeWaitsDrain   = TRUE
    ReceiveBounded   = TRUE
    RetryRefused     = TRUE
    RunRetiresAll    = TRUE

INVARIANTS
    TypeOK
    ReceiveCallBound
    NoReserveIntoPostedPhase
    OutstandingCounts
    RunPostedTogether
    CompletionsOwned
    ExposedStable
    RepostOnlyAfterCopy
    ReceiveDepthNeverShrinks
    FreedOnlyWhenDrained

PROPERTIES
    PostedEventuallyFree
    CloseEventuallyFrees
