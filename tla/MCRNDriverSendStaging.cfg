\* MCRNDriverSendStaging: the committed run, the rule on.  Checks
\* StagedDisconnectFlushed as an invariant and StagedFramesEventuallySent
\* as a property under weak fairness of send_packets.
SPECIFICATION SpecFair

CONSTANTS
    MaxFrames                = 4
    MaxStaged                = 3
    MaxBurst                 = 2
    DisconnectAdvancesStaged = TRUE
    XdpBuffers               = 3

INVARIANTS
    NoRefusedSend
    RetryFlushPublishes
    TypeOK
    StagedDisconnectFlushed
    FlushedNeverAhead
    DiscOwedTracked

PROPERTIES
    StagedFramesEventuallySent
    XdpStagedEventuallyPublished
