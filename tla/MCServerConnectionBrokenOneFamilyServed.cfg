\* MCServerConnectionBrokenOneFamilyServed.cfg: the reversed witness.
\* The config names both families, and ServeFirstFamilyOnly makes the server
\* serve only the first (today's one-family rule). The IPv6-only client never
\* reaches the server, so BothFamiliesConnect fails.
SPECIFICATION Spec

CONSTANTS
    NumClients          = 2
    NumAddrs            = 2
    NumTokens           = 2
    MaxSlots            = 2
    MapCap              = 2
    HeldCapacity        = 2
    MaxAttempts         = 1
    MaxNonces           = 2
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 0
    HandshakeDeadline   = 0
    Disconnects         = FALSE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "own"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2
    TokenFamilies       <- MCTokenBothFamilies
    ClientHost          <- MCHostSplit
    ConfiguredFamilies  <- MCConfiguredBoth
    ServeFirstFamilyOnly <- MCServeFirstOnly

INVARIANTS
    SafetyInvariants

PROPERTIES
    BothFamiliesConnect
