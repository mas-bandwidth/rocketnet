\* MCRNPortableRx: the rule.  Three banks, a socket read of up to two
\* datagrams, a receive budget of one (so the consumer tail is retained
\* across calls) and four datagrams.  Invariants and both liveness
\* properties under SpecFair with no wait timeout.
SPECIFICATION SpecFair

CONSTANTS
    NumBanks       = 3
    Cap            = 2
    Budget         = 1
    MaxDatagrams   = 4
    HoldOnFull     = TRUE
    ReturnWhenRead = TRUE
    QuitBeforeWake = TRUE
    WakeOnReturn   = TRUE
    Timeout        = FALSE

INVARIANTS
    TypeOK
    ExclusiveOwnership
    CursorInBank
    ExactDelivery
    MainLockIsBrief

PROPERTIES
    EveryDatagramDelivered
    StopCompletes
