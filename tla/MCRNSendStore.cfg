\* MCRNSendStore: the committed run, both rules on. README-RNSendStore.md
\* gives the reversed witnesses (GuardDoubleFree = FALSE, AllOrNone = FALSE)
\* as edits to the CONSTANTS lines of this file.
SPECIFICATION Spec

CONSTANTS
    Chunks          = 4
    Senders         = {s1, s2, s3}
    MaxBlock        = 3
    GuardDoubleFree = TRUE
    AllOrNone       = TRUE

INVARIANTS
    TypeOK
    NoDoubleAllocate
    NoLeak
    RefuseOnlyWhenNoRun
    ChainsBounded

    HeldGenerationPositive
