\* MCRNSentHistory: the committed run, the split rule on and no throttling.
\* README-RNSentHistory.md gives the reversed witnesses (CountEveryUnacked,
\* RefuseWhenFull each TRUE in turn) as the MCRNSentHistoryBroken*.cfg files
\* beside this one.
SPECIFICATION Spec

CONSTANTS
    N                 = 4
    Threshold         = 2
    MaxSeq            = 7
    MaxLoss           = 2
    Flight            = 2
    AckRange          = 4
    AckSlots          = 2
    CountEveryUnacked = FALSE
    RefuseWhenFull    = FALSE

INVARIANTS
    TypeOK
    EveryEvictionClassified
    LostImpliesLaterAcked
    LargestAckedIsMaximum
    NoOverflowUnderBoundedLoss
    SendNeverRefused
