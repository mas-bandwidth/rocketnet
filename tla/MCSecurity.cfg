\* MCSecurity: the committed run. Safety with the attacker on, holding all
\* four tokens (the honest client's captured one, a foreign one, a forged one
\* and an expired one), both links losing their first send.
\* README-Security.md defines the larger base instance the other runs use
\* and lists each run as edits to this file.
SPECIFICATION Spec

CONSTANTS
    None = None
    Zero = Zero
    Bad  = Bad
    Addrs         = {"H", "A"}
    HonestAddr    = "H"
    Tokens        = {"th", "tx", "tf", "te"}
    Signed        = {"th", "tx", "te"}
    ForThisServer = {"th", "tf", "te"}
    Cid    <- MCCid
    Expire <- MCExpire
    HonestToken   = "th"
    HonestExpire  = 0
    MaxClock      = 2
    CookieLife    = 2
    Deadline      = 0
    Timeout       = 0
    MaxClients    = 1
    MapCap        = 2
    HistoryCap    = 2
    AdmittedCap   = 2
    MaxNonces     = 1
    Others        = 0
    OthersMayJoin  = FALSE
    OthersMayLeave = FALSE
    Attacker       = TRUE
    Rotation       = FALSE
    RotatePeriod   = 2
    AcceptPrevious = TRUE
    Words         = 2
    WordBits      = 2
    ClearWords    = 2
    MaxSeq        = 1
    RepeatKeepAlive = TRUE
    KindLoss      = "none"
    C2SPattern    = "first"
    S2CPattern    = "first"
    Capacity      = 1
    MaxDelay      = 0
    Duplication   = FALSE
    Reordering    = FALSE
    BurstStart    = 1
    BurstLen      = 2

INVARIANTS
    SafetyInvariants

PROPERTIES
    AdmittedNeverEvictedUnexpired
    DeniedTokenStaysUsable
    JunkTouchesNothing
    MappingCreatedOnce

CHECK_DEADLOCK FALSE
