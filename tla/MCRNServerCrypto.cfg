\* RNServerCrypto: three banks, two jobs each, three jobs submitted.
\* The game never waits and a published bank is not rewritten.
SPECIFICATION Spec

CONSTANTS
    NumBanks = 3
    Cap = 2
    MaxJobs = 3
    NeverWaits = TRUE
    BrokenOverwrite = FALSE

INVARIANTS
    TypeOK
    Exclusive
    Accounted
    Order
    WaitedStaysClear
    NoWorkUnderLock
