    Slots    = {s1, s2, s3}
    Clients  = {c1, c2, c3, c4}
    Capacity = 3
    Reset    = FALSE
    CarryOn  = FALSE

INVARIANTS
    TypeOK
    UsedBounded
    ExhaustedReasonNamed
    ReusedSlotStartsClean

PROPERTIES
    ExhaustionOnlyLeadsToDisconnect
    NoCrossSlotEffect
    ExhaustedEventuallyFree
