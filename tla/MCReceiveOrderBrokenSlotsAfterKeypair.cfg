\* MCReceiveOrderBrokenSlotsAfterKeypair: BASE order: slots checked after the keypair. CheapRefusalsFirst must fail.
SPECIFICATION MCSpec

CONSTANTS
    PosVersion   = 1
    PosTimestamps = 2
    PosCompares  = 3
    PosCookie    = 4
    PosUsed      = 5
    PosAdmitted  = 6
    PosRestart   = 7
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 11
    PosKeypair   = 10

INVARIANTS
    TypeOK
    CheapRefusalsFirst
