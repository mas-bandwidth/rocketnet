\* Step-driven mode at the full instance (two slots, three datagrams): one
\* liveness property of MCRNClientIoStepDriven.cfg under unchanged SpecStepFair.
SPECIFICATION SpecStepFair

CONSTANTS
    NumSlots           = 2
    BufferCap          = 1
    MaxDatagrams       = 3
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = FALSE
    SwapNeedsReady     = FALSE
    HandOffWaits       = FALSE
    FullWaitReadable   = FALSE
    StepDriven          = TRUE
    StepModeStartsThread = FALSE

INVARIANTS
    TypeOK
    NoReuseBeforeSent
    ExposedStable
    FreedOnlyAfterJoin
    HandOffNeverWaits
    FullWaitsOnWake
    NoReceiveStall
    DroppedAtDeadline
    NoIoThreadActionInStepMode

PROPERTIES
    ArrivedEventuallyDelivered
