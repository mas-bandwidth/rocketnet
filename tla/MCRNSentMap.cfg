\* MCRNSentMap: the committed run. P = W and RTO = RTT, the tightest sizes
\* the rule allows; no entry is evicted while its ack is on its way.
SPECIFICATION Spec

CONSTANTS
    W            = 3
    P            = 3
    RTT          = 2
    RTO          = 2
    MaxNum       = 4
    MaxTime      = 6
    MaxPerPacket = 2

INVARIANTS
    TypeOK
    MapBounded
    WindowBounded
    NoLiveEviction
