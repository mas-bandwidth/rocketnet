\* MCRNUringDriver: the committed run, the rule.  Two slots, two ring
\* buffers, two datagrams and two swaps; invariants plus the liveness
\* properties under weak fairness of the kernel, the reaps and the drain.
\* The reversed witnesses are MCRNUringDriverBrokenResetBeforeReap.cfg and
\* MCRNUringDriverBrokenOneBank.cfg beside this one.
SPECIFICATION SpecFair

CONSTANTS
    Slots             = 2
    Buffers           = 2
    MaxSteps          = 2
    ResetWaitsForReap = TRUE
    ReapIntoFill      = TRUE

INVARIANTS
    TypeOK
    NoReuseWhileKernelOwned
    ExposedStable
    BufferReturnedAfterCopy
    FreedOnlyWhenDrained

PROPERTIES
    SubmittedEventuallyFree
    DestroyEventuallyFrees
