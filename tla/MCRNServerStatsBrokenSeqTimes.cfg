\* MCRNServerStats reversed witness: the received side reads its span from
\* the lowest and highest counted sequences instead of the time-ordered
\* list, so a late or duplicate arrival gives the wrong span. Must fail
\* PublishedSpanExact. The committed MCRNServerStatsReceived.cfg with one
\* constant flipped.
SPECIFICATION Spec

CONSTANTS
    N              = 6
    MaxSeq         = 9
    MaxWrites      = 7
    Late           = TRUE
    SeqTimes       = TRUE
    BrokenEntering = FALSE

INVARIANTS
    PublishedSpanExact
