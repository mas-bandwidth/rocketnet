\* MCRNLiveFleetRun: the committed run, the design. Two clients, two
\* reconnects each (one clean disconnect, one silent drop, then the final
\* clean disconnect), a timeout of one tick (a wait of two), a watchdog
\* bound of two ticks, a dead-man timer of five, max_clients equal to the
\* client count, one outside event per run. The reversed witnesses are
\* MCRNLiveFleetRunBrokenXdpLeftAttached.cfg and
\* MCRNLiveFleetRunBrokenServerOrphaned.cfg beside this one.
SPECIFICATION Spec

CONSTANTS
    C1            = C1
    C2            = C2
    S1            = S1
    Clients       = {C1, C2}
    TestServer    = S1
    Cycles        = 2
    T             = 1
    WatchdogBound = 2
    DeadmanBound  = 5
    MaxClients    = 2
    MaxFaults     = 1

INVARIANTS
    TypeOK
    XdpNeverOrphaned
    TeardownDetaches
    XdpOnlyUnderDeadman
    NoClientBeforeListen
    NoBenchServer
    ReconnectAfterTwoTimeouts
    ReconnectIntoFreedSlot
    NeverDenied

PROPERTIES
    EndsStoppedAndDetached
