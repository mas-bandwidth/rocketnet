\* Reversed witness: MCClientConnection.cfg plus the pre-fix early
\* fragment (accepted in sending-connection-response). TLC must fail
\* FragmentOnlyWhenConnected.

\* MCClientConnection: the committed run. The hang check under "the first
\* packet of every kind is dropped", with the code's keep-alive behaviour.
\* README-ClientConnection.md lists the other runs as edits to this file.
SPECIFICATION SpecEarlyFragment

CONSTANTS
    SendInterval     = 1
    Timeout          = 0
    Deadline         = 0
    ServerDeadline   = 0
    MaxAttempts      = 1
    MaxNonces        = 1
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "firstkind"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2

INVARIANTS
    SafetyInvariants
    FragmentOnlyWhenConnected

PROPERTIES
    StepsForwardOrFails
    DisconnectIsTerminal
    TimeoutPairing
    AcceptedUnderLiveKeys
    NoSendOnArrival
    Connects
    ServerNotStranded
