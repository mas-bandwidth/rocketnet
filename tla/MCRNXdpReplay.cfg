\* MCRNXdpReplay: the scoped retention control. Two addresses, two
\* sessions, and one retained delete entry (refused up to twice, so a
\* kept forget can be refused again in the commit that lands a newer
\* session's mark of the same address) exercise a full pending-forget
\* buffer while another released address remains owed. Sequences are 1..3,
\* the replay window is 2, and at most one packet is in flight.
\* The reversed witnesses are
\* MCRNXdpReplayBrokenKernelAdvances.cfg, MCRNXdpReplayBrokenNoForget.cfg and
\* MCRNXdpReplayBrokenNarrowWindow.cfg, MCRNXdpReplayBrokenFailedForgetDropped.cfg,
\* MCRNXdpReplayBrokenUnmarkedNotForgotten.cfg,
\* MCRNXdpReplayBrokenSupersededForget.cfg and
\* MCRNXdpReplayBrokenReconnectFreshness.cfg. There is no settle guard: a
\* reconnect may arrive before the walk queues the old forget or while the
\* kernel refuses it, and the new session's first mark, zero included,
\* replaces the old entry in the commit before its first keep-alive, so
\* MarkNeverAhead and NewSessionNeverDroppedByOldMark hold
\* (README-RNXdpReplay.md). MCRNXdpReplayReconnect.cfg is the reconnect
\* control with a third session.
SPECIFICATION Spec

CONSTANTS
    A1          = A1
    A2          = A2
    Addresses   = {A1, A2}
    MaxSeq      = 3
    W           = 2
    Sessions    = 2
    MaxInFlight = 1
    ForgetCapacity = 1
    ForgetFailureBudget <- ForgetFailureBudgetTwo

INVARIANTS
    TypeOK
    ForgetOwedUntilApplied
    MarkNeverAhead
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    NewSessionNeverDroppedByOldMark
    ReleasedSlotForgetsItsReplyMac
    RetryNeverDeletesNewerMark
    MarkOwedUntilApplied

PROPERTIES
    KernelNeverWrites
