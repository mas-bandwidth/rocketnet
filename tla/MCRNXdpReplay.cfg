\* MCRNXdpReplay: the scoped retention control. Two addresses, four
\* sessions, and one retained delete entry exercise a full pending-forget
\* buffer while another released address remains owed. Sequences are 1..3,
\* the replay window is 2, and at most one packet is in flight.
\* The reversed witnesses are
\* MCRNXdpReplayBrokenKernelAdvances.cfg, MCRNXdpReplayBrokenNoForget.cfg and
\* MCRNXdpReplayBrokenNarrowWindow.cfg beside this one.
SPECIFICATION Spec

CONSTANTS
    A1          = A1
    A2          = A2
    Addresses   = {A1, A2}
    MaxSeq      = 3
    W           = 2
    Sessions    = 2
    MaxInFlight = 1
    ForgetCapacity = 1

INVARIANTS
    TypeOK
    MarkNeverAhead
    ForgetOwedUntilApplied
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    ReleasedSlotForgetsItsReplyMac

PROPERTIES
    KernelNeverWrites
