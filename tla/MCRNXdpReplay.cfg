\* MCRNXdpReplay: the committed run, the design. One address, two
\* sessions over the run (a reconnect from one address is reachable),
\* sequences 1..5, a replay window of 2 (the kernel window equal to it),
\* two packets in flight. The reversed witnesses are
\* MCRNXdpReplayBrokenKernelAdvances.cfg, MCRNXdpReplayBrokenNoForget.cfg and
\* MCRNXdpReplayBrokenNarrowWindow.cfg beside this one.
SPECIFICATION Spec

CONSTANTS
    A1          = A1
    Addresses   = {A1}
    MaxSeq      = 5
    W           = 2
    Sessions    = 2
    MaxInFlight = 2

INVARIANTS
    TypeOK
    MarkNeverAhead
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    NewSessionNeverDroppedByOldMark
    ReleasedSlotForgetsItsReplyMac

PROPERTIES
    KernelNeverWrites
