\* MCRNBufferHandoff reversed witness: the game thread writes a packet while it holds the handoff mutex. NoWorkUnderLock falls. Must fail.
SPECIFICATION SpecFair

CONSTANTS
    N                 = 3
    Cap               = 2
    MaxItems          = 5
    MaxReady          = 2
    Direction         = "send"
    MainBlocks        = FALSE
    WorkUnderLock     = TRUE
    WriteAfterPublish = FALSE
    SkipWake          = FALSE
    ReleaseBeforeSent = FALSE
    DropFinal         = FALSE

INVARIANTS
    TypeOK
    OneOwner
    FreeIsEmpty
    ViewStable
    InOrder
    NoWorkUnderLock
    MainNeverWaits
    ExitSentAll

PROPERTIES
    StopSendsAll
