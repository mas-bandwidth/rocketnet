\* MCRNRing reversed witness: the floor is ring_start(U) instead of
\* ring_start(U'). Must fail LiveSpansDisjoint: a partly acked block's held
\* fragment is overwritten. The committed MCRNRing.cfg with one line changed.
SPECIFICATION Spec

CONSTANTS
    B              = 64
    Lengths        = {1, 32, 48}
    FragBytes      = 16
    BlockFragments = 2
    MaxBlocks      = 1
    MaxNumbers     = 6
    FloorAtUPrime  = FALSE
    PadAtBoundary  = TRUE
    IdleFloorAtP   = TRUE
    Round16        = TRUE

INVARIANTS
    TypeOK
    LiveSpansDisjoint
    SpanInsideRing
    Aligned
    IdleAdmitsAnyMessage

PROPERTIES
    EveryAdmissibleMessagePlaced
    NoRecordWaitsForever
