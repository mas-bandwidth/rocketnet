\* MCRNClientIo reversed witness: the hand-off of the second draft, which
\* waits for the other ring to be Sent.  A packet sent by send_packet and
\* the hand-off at the end of update in the same frame find the first ring
\* still HandedOff, and the main thread blocks on the I/O thread:
\* HandOffNeverWaits falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    NumSlots           = 2
    BufferCap          = 1
    MaxDatagrams       = 3
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = FALSE
    SwapNeedsReady     = FALSE
    HandOffWaits       = TRUE
    FullWaitReadable   = FALSE
    StepDriven          = FALSE
    StepModeStartsThread = FALSE

INVARIANTS
    TypeOK
    NoReuseBeforeSent
    ExposedStable
    FreedOnlyAfterJoin
    HandOffNeverWaits
    FullWaitsOnWake
    NoReceiveStall
