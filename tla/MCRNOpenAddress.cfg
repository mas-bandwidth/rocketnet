\* MCRNOpenAddress: the committed run of the clear-first erase (the
\* encryption map, the token index). Four keys in four cells, so the index
\* fills, as the encryption map's may; homes chosen at Init from every map.
\* The reversed witness MCRNOpenAddressBrokenNoWrapTest.cfg is this file with
\* NoWrapTest TRUE.
SPECIFICATION Spec

CONSTANTS
    Keys       = {1, 2, 3, 4}
    N          = 4
    NoWrapTest = FALSE
    ClearLast  = FALSE
    MaxLive    = 4

INVARIANTS
    TypeOK
    Findable
    Unique
    EraseEnds
