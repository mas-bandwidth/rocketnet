\* MCRNSendBudget: the committed case. Every guarding rule on, a window of
\* W = 2 ticks at 1 byte per tick, a bucket of one maximum packet (2), reliable
\* items of 2 bytes, up to 2 unreliable items of 1 byte per update, 2 reliable
\* arrivals and 1 transport loss: every safety invariant, and
\* EveryReliableEventuallySent under Spec. The two MCRNSendBudgetBroken*.cfg
\* are this file with one constant flipped.

SPECIFICATION Spec

CONSTANTS
    W             = 2
    Rate          = 1
    Depth         = 2
    MaxPkt        = 2
    RelSize       = 2
    UnrelSize     = 1
    UPerTick      = 2
    MaxRel        = 2
    MaxLoss       = 1
    CheckBudget   = TRUE
    ReliableFirst = TRUE

INVARIANTS
    TypeOK
    NeverOverspend
    ReliableNeverDropped
    UnreliableDroppedOnlyOverBudget
    ClassOrder

PROPERTIES
    EveryReliableEventuallySent
