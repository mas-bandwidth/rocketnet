\* MCRNXdpReceiveRing: the design. Three frames, an RX ring of two, a peek
\* of up to two, a staging buffer of one packet, so a pass stops with a
\* peeked descriptor not taken. The reversed witness is
\* MCRNXdpReceiveRingBrokenNoCancel.cfg beside this one.
SPECIFICATION Spec

CONSTANTS
    F1       = F1
    F2       = F2
    F3       = F3
    Frames   = {F1, F2, F3}
    RingSize = 2
    PeekMax  = 2
    StageCap = 1

INVARIANTS
    TypeOK
    FrameConservation
    ConsumerNotBehind

PROPERTIES
    ReceiveNeverStalls
