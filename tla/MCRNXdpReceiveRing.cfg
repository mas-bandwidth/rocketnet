\* MCRNXdpReceiveRing: the receive loop. Two frames, a ring of two, a
\* staging buffer of one. CancelUnconsumed stays TRUE. Every frame sits in
\* the fill ring, the visible RX ring, the staging buffer or the
\* application, and a free frame does not sit in the fill ring or the
\* visible RX ring forever.
SPECIFICATION Spec

CONSTANTS
    RingSize    = 2
    StagingCap  = 1
    FrameCount  = 2

INVARIANTS
    TypeOK
    FramePartition

PROPERTIES
    ReceiveNeverStalls
