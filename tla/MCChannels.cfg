\* MCChannels: the committed safety run.  Pattern "arbitrary", loss
\* unbounded, every invariant.  Liveness is MCChannelsLive.cfg; the
\* reversed witnesses are edits to the knobs below (README-Channels.md).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
VIEW View

CONSTANTS
    NumChannels = 2
    Window      = 4
    QueueCap    = 4
    SentMapCap  = 4
    PidCap      = 6
    NumMsgs     = 2
    Enabled     = {0, 3}
    BoundedLoss = FALSE
    MaxDrops    = 0
    MaxAckLoss  = 0
    PidDedupe   = TRUE
    NumDedupe   = TRUE
    CountBound  = TRUE
    ChannelFifo = TRUE
    SpuriousResend = FALSE
    Capacity    = 2
    MaxDelay    = 0
    Duplication = TRUE
    Reordering  = TRUE
    Pattern     = "arbitrary"
    BurstStart  = 1
    BurstLen    = 2

INVARIANTS
    TypeOK
    NoDoubleDelivery
    OrderedInSendOrder
    ReceiverNeverOutsideWindow
    OrderedNeverBehind
    AllocatorPromise
    OnlyEnabledOnWire
    UnreliableNeverNumbered
    DeliveredWereSent
    HeldAreWaiting
    OpenedOnWire
    MapMatchesWire
