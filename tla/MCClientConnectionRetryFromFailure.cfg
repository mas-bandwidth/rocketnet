\* MCClientConnectionRetryFromFailure.cfg: FreshAttemptFromFailure holds.
\* A connect from a failure state starts a fresh attempt and carries no key,
\* cookie, client index, reassembly, replay or timer state of the earlier
\* one. A responsive server of one slot that another client may take, the
\* idle timeout and the total deadline on, and a second connect: the client
\* reaches the denied state and the timeout and deadline states and connects
\* again from each (README-ClientConnection.md lists the states reached).
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 2
    Deadline         = 3
    ServerDeadline   = 0
    MaxAttempts      = 2
    MaxNonces        = 2
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = TRUE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = FALSE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    SafetyInvariants
PROPERTIES
    FreshAttemptFromFailure
    DisconnectIsTerminal
    TerminalAbsorbing
    StepsForwardOrFails
