\* MCRNWindowSafety: the committed safety case. W = 2, numbers 0..5 with
\* NumMod = 4 (4 and 5 wrap), capacity 2, "arbitrary" loss both ways, every
\* safety invariant under Spec.

SPECIFICATION Spec

CONSTANTS
    W              = 2
    MaxNum         = 5
    NumMod         = 4
    BlockFirst     = 1
    BlockLen       = 2
    Ordered        = {0, 1, 2, 4}
    P              = 2
    MaxPerPacket   = 1
    MaxPid         = 3
    BlockUPrime    = TRUE
    KeepP6         = TRUE
    HalfRange      = TRUE
    HoldOrdered    = TRUE
    DropDuplicates = TRUE
    FwdPattern     = "arbitrary"
    RevPattern     = "arbitrary"
    Capacity       = 2
    MaxDelay       = 0
    Duplication    = FALSE
    Reordering     = FALSE
    BurstStart     = 1
    BurstLen       = 2

INVARIANTS
    TypeOK
    TablesBounded
    ReceiverNeverOutsideWindow
    NoSlotCollision
    AckedImpliesReceived
    DeliveredOnce
    OrderedDeliveredInOrder
    WireNumberReconstructs
    HeldIsUnreleasable

