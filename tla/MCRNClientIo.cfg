\* MCRNClientIo: the committed run, every rule on.  Checks the safety
\* invariants with NoReceiveStall and, under weak fairness of the I/O
\* thread, the join and update's Expose and Return steps,
\* HandedOffEventuallySent, StopEventuallyJoins, FilledEventuallyExposed
\* and ArrivedEventuallyDelivered.
SPECIFICATION SpecFair

CONSTANTS
    NumSlots           = 2
    MaxHandOffs        = 3
    MaxDatagrams       = 2
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = FALSE
    SwapNeedsReady     = FALSE

INVARIANTS
    TypeOK
    NoReuseBeforeSent
    ExposedStable
    FreedOnlyAfterJoin
    NoReceiveStall

PROPERTIES
    HandedOffEventuallySent
    StopEventuallyJoins
    FilledEventuallyExposed
    ArrivedEventuallyDelivered
