\* MCRNClientIo: the committed run, both rules on.  Checks the safety
\* invariants and, under weak fairness of the I/O thread and the join,
\* HandedOffEventuallySent and StopEventuallyJoins.
SPECIFICATION SpecFair

CONSTANTS
    NumSlots           = 2
    MaxHandOffs        = 3
    MaxDatagrams       = 2
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = FALSE

INVARIANTS
    TypeOK
    NoReuseBeforeSent
    ExposedStable
    FreedOnlyAfterJoin

PROPERTIES
    HandedOffEventuallySent
    StopEventuallyJoins
