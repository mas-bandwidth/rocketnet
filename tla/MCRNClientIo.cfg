\* MCRNClientIo: the committed run, every rule on.  Checks the safety
\* invariants and, under the fairness of SpecFair (the I/O thread, the
\* join, a game thread finishing its packet, the reopen, the hand-off and
\* update's Expose and Return steps, the kernel's completion of a posted
\* send and the free), the liveness properties, with the overlapped send's
\* IoNeverBlocksOnSend and NoFreeBeforeComplete.
SPECIFICATION SpecFair

CONSTANTS
    NumSlots           = 2
    BufferCap          = 1
    MaxDatagrams       = 3
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = FALSE
    SwapNeedsReady     = FALSE
    HandOffWaits       = FALSE
    FullWaitReadable   = FALSE
    StepDriven          = FALSE
    StepModeStartsThread = FALSE

INVARIANTS
    TypeOK
    NoReuseBeforeSent
    ExposedStable
    FreedOnlyAfterJoin
    HandOffNeverWaits
    FullWaitsOnWake
    NoReceiveStall
    IoNeverBlocksOnSend
    NoFreeBeforeComplete

PROPERTIES
    HandedOffEventuallySent
    CommittedEventuallyHandedOff
    FilledEventuallyExposed
    ArrivedEventuallyDelivered
    StopEventuallyFrees
