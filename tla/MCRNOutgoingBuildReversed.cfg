\* MCRNOutgoingBuild reversed witness: the copy step put back. A fitting
\* unreliable message is written into its region record and copied into a
\* frame at send_packets. Must fail NoCopy.
SPECIFICATION Spec

CONSTANTS
    N         = 6
    Cap       = 3
    NumFrames = 2
    MaxPackets = 1
    MaxAcks   = 1
    MaxFaults = 1
    Kind      <- MCKind
    Fits      <- MCFits
    Decl      <- MCDecl
    CopyStep  <- CopyStepReversed
    SharedQuota = TRUE
    Reserve   = TRUE
    MovePrior = FALSE
    ReuseCommitted = FALSE

INVARIANTS
    TypeOK
    PacketQuota
    BytesUnchangedInPlace
    NoCopy
    AcksNeverLost
    ModeOrder
