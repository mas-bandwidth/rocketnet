\* MCRNClientReceiveQuit on Windows: the wait is the 1 ms sleep, which
\* always returns, and the wake is a no-op, so the thread sees quit within
\* one sleep.  Every rule on.
SPECIFICATION SpecFair

CONSTANTS
    Platform       = "windows"
    WaitTimeout    = "fair"
    WakeBeforeQuit = FALSE
    NoWake         = FALSE

INVARIANTS
    TypeOK
    NoJoinBeforeExit
    WokenSeesQuit

PROPERTIES
    NoUseAfterJoin
    DestroyCompletes
