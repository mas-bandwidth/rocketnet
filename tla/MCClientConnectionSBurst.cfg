\* MCClientConnectionSBurst.cfg: MCClientConnection safety with C2SPattern
\* "burst", S2CPattern "burst".  The state space is over the 110 s per-
\* commit budget; the reduced replacement MCClientConnectionReachSBurst.cfg
\* reaches CONNECTED with a payload under the same constants.
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 0
    Deadline         = 0
    ServerDeadline   = 0
    MaxAttempts      = 1
    MaxNonces        = 2
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = TRUE
    Disconnects      = TRUE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "burst"
    S2CPattern       = "burst"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = TRUE
    Reordering       = TRUE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    SafetyInvariants
PROPERTIES
    StepsForwardOrFails
    DisconnectIsTerminal
    TimeoutPairing
    AcceptedUnderLiveKeys
    NoSendOnArrival
