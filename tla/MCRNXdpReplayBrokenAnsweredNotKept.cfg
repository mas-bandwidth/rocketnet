\* MCRNXdpReplay reversed witness: a direct response keeps no answered
\* entry, the table before it. Must fail HeldReplyFindsItsMac: the link
\* holds the handshake reply to a frame from an address with no session, and
\* when it leaves with no frame in hand no MAC is known, so it is refused
\* (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1              = A1
    A2              = A2
    Addresses       = {A1, A2}
    MaxSeq          = 2
    W               = 2
    Sessions        = 2
    MaxInFlight     = 1
    ForgetCapacity  = 1
    HeldReplyBudget <- HeldReplyBudgetTwo
    KeepAnswered    <- KeepAnsweredBroken

INVARIANTS
    TypeOK
    HeldReplyFindsItsMac
