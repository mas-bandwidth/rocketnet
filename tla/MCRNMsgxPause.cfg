\* MCRNMsgxPause: the rule. Two workers, four ticks, a retry of two.
\* The clear stores 0 only when the slot still holds the observed expiry.
\* Invariants and ExpiredPauseSettled.
SPECIFICATION Spec

CONSTANTS
    Workers                = {1, 2}
    MaxTime                = 4
    Retry                  = 2
    CasClearsOnlyObserved  = TRUE

INVARIANTS
    TypeOK
    FreshPauseSurvives

PROPERTIES
    ExpiredPauseSettled
