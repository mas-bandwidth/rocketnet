\* MCRNMsgxPause: the rule.  Two workers on one socket, time bounded to
\* four ticks, a retry of two.  The expired clear is the compare-and-swap.
\* Every invariant and ExpiredPauseResolved under SpecFair.
SPECIFICATION SpecFair

CONSTANTS
    Workers   = {tx, rx}
    MaxTime   = 4
    Retry     = 2
    StoreZero = FALSE

INVARIANTS
    TypeOK
    FreshPauseSurvives
    PauseHasGeneration

PROPERTIES
    ExpiredPauseResolved
