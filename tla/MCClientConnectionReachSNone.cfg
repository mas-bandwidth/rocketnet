\* the reversed reachability witness for the full safety environment with
\* latency (KindLoss "none", MaxDelay 1, duplication and reordering), all
\* constants unchanged from MCClientConnectionSNone.cfg.  SPECIFICATION
\* SpecReach adds ClientRecvPayloadWitness, so the ghost cPayloadDelivered
\* is set once the connected application is handed a payload; NotReached is
\* its negation.  TLC must violate NotReached: a run that completes without
\* a violation would mean connected with a payload delivered is unreachable
\* under these constants.
SPECIFICATION SpecReach
CONSTANTS
    SendInterval     = 1
    Timeout          = 2
    Deadline         = 4
    ServerDeadline   = 3
    MaxAttempts      = 1
    MaxNonces        = 2
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = TRUE
    Disconnects      = TRUE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 1
    Duplication      = TRUE
    Reordering       = TRUE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    NotReached
