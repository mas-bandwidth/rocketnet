\* MCChannelsLive: the committed liveness run.  Loss bounded (two drops,
\* two lost acks), SpecFair, every reliable message delivered and acked.
\* Safety is MCChannels.cfg.  See README-Channels.md.
SPECIFICATION SpecFair
CHECK_DEADLOCK FALSE

CONSTANTS
    NumChannels = 2
    Window      = 4
    QueueCap    = 4
    SentMapCap  = 2
    PidCap      = 4
    NumMsgs     = 2
    Enabled     = {0, 3}
    BoundedLoss = TRUE
    MaxDrops    = 2
    MaxAckLoss  = 2
    PidDedupe   = TRUE
    NumDedupe   = TRUE
    CountBound  = TRUE
    ChannelFifo = TRUE
    SpuriousResend = FALSE
    Capacity    = 2
    MaxDelay    = 0
    Duplication = TRUE
    Reordering  = TRUE
    Pattern     = "arbitrary"
    BurstStart  = 1
    BurstLen    = 2

INVARIANTS
    TypeOK
    NoDoubleDelivery
    OrderedInSendOrder
    ReceiverNeverOutsideWindow
    OrderedNeverBehind
    AllocatorPromise
    OnlyEnabledOnWire
    UnreliableNeverNumbered
    DeliveredWereSent
    HeldAreWaiting
    MapMatchesWire

PROPERTIES
    EveryReliableDelivered
    EveryReliableAcked
