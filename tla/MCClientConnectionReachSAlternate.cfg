\* the reversed reachability witness for the "alternate" loss pattern on
\* both links, all constants unchanged from MCClientConnectionSAlternate.cfg
\* (Timeout 0: off).  SPECIFICATION SpecReach adds ClientRecvPayloadWitness,
\* so the ghost cPayloadDelivered is set once the connected application is
\* handed a payload; NotReached is its negation.  TLC must violate
\* NotReached: a run that completes without a violation would mean connected
\* with a payload delivered is unreachable under these constants.
SPECIFICATION SpecReach
CONSTANTS
    SendInterval     = 1
    Timeout          = 0
    Deadline         = 0
    ServerDeadline   = 0
    MaxAttempts      = 1
    MaxNonces        = 2
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = TRUE
    Disconnects      = TRUE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "alternate"
    S2CPattern       = "alternate"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = TRUE
    Reordering       = TRUE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    NotReached
