\* MCRNRioDriver: the committed run, all rules on.  Checks the safety
\* invariants and PostedEventuallyFree and CloseEventuallyFrees under weak
\* fairness of the kernel send completions, the dequeues, Drain and Free.
\* One slot per send phase: Slots = 2 with Slices = 2 and the retry state
\* exceeded the 110-second budget.  Two receive slices stay.
SPECIFICATION SpecFair

CONSTANTS
    Slots            = 1
    Slices           = 2
    MaxSteps         = 1
    SwitchWaitsDrain = TRUE
    FreeWaitsDrain   = TRUE
    ReceiveBounded   = TRUE
    RetryRefused     = TRUE
    RunRetiresAll    = TRUE

INVARIANTS
    TypeOK
    ReceiveCallBound
    NoReserveIntoPostedPhase
    OutstandingCounts
    RunPostedTogether
    CompletionsOwned
    ExposedStable
    RepostOnlyAfterCopy
    ReceiveDepthNeverShrinks
    FreedOnlyWhenDrained

PROPERTIES
    PostedEventuallyFree
    CloseEventuallyFrees
