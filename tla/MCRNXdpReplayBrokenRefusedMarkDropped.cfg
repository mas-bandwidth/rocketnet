\* MCRNXdpReplay reversed witness: a mark the kernel refused is dropped at
\* the end of the commit instead of kept pending, the rule before refused
\* marks were retried. Must fail MarkOwedUntilApplied: the walk's cache has
\* advanced, so nothing takes the mark again and the entry stays behind it.
\* MarkNeverAhead restates the rule for a reconnect's zero mark and is left
\* out so the run names the rule this shape removes (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1                = A1
    Addresses         = {A1}
    MaxSeq            = 3
    W                 = 2
    Sessions          = 2
    MaxInFlight       = 1
    ForgetCapacity    = 1
    MarkFailureBudget <- MarkFailureBudgetOne
    KeepRefusedMarks  <- KeepRefusedMarksBroken

INVARIANTS
    TypeOK
    ForgetOwedUntilApplied
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    MarkOwedUntilApplied

PROPERTIES
    KernelNeverWrites
