\* MCRNScheduler: the committed case. Every guarding rule on: two channels,
\* a LOW then an IMMEDIATE item on channel 0, a HIGH item on channel 1,
\* IMMEDIATE unreliable items arriving one per update, a window of 2, a budget
\* of 1 item per update and 1 transport loss: every safety invariant, and
\* NoStarvation under Spec. The two MCRNSchedulerBroken*.cfg are this file
\* with one constant flipped.

SPECIFICATION Spec

CONSTANTS
    NC             = 2
    Msgs           <- MCMsgs
    ULevel         = 0
    W              = 2
    Cap            = 1
    UPerTick       = 1
    MaxLoss        = 1
    ChannelFIFO    = TRUE
    UnreliableLast = TRUE

INVARIANTS
    TypeOK
    FirstWriteInOrderPerChannel
    UnreliableNotBlockedByWindow
    ClassOrderBeforePriority

PROPERTIES
    NoStarvation
