\* MCRNWindow: the committed run. Every guarding rule on, W = 2, the wire
\* modulus NumMod = 4 with numbers 0..4 (4 is sent as 0), a FIFO link of capacity 1 under
\* "arbitrary" loss both ways: every safety invariant, and
\* EveryReliableAckedAndDelivered under SpecTyped. README-RNWindow.md lists
\* the other runs as edits to this file.

SPECIFICATION SpecTyped

CONSTANTS
    W              = 2
    MaxNum         = 4
    NumMod         = 4
    BlockFirst     = 1
    BlockLen       = 2
    Ordered        = {0, 1, 2, 4}
    P              = 2
    MaxPerPacket   = 1
    MaxPid         = 3
    BlockUPrime    = TRUE
    KeepP6         = TRUE
    HalfRange      = TRUE
    HoldOrdered    = TRUE
    DropDuplicates = TRUE
    FwdPattern     = "arbitrary"
    RevPattern     = "arbitrary"
    Capacity       = 1
    MaxDelay       = 0
    Duplication    = FALSE
    Reordering     = FALSE
    BurstStart     = 1
    BurstLen       = 2

INVARIANTS
    TypeOK
    TablesBounded
    ReceiverNeverOutsideWindow
    NoSlotCollision
    AckedImpliesReceived
    DeliveredOnce
    OrderedDeliveredInOrder
    WireNumberReconstructs
    HeldIsUnreleasable

PROPERTIES
    EveryReliableAckedAndDelivered
