\* MCRNOutgoingBuild reversed witness: in-place packets draw on an
\* allowance of their own instead of the write pass's (the defect of the
\* first attempt). Must fail PacketQuota.
SPECIFICATION Spec

CONSTANTS
    N         = 6
    NumFrames = 2
    MaxPackets = 1
    MaxAcks   = 1
    MaxFaults = 1
    Kind      <- MCKind
    Fits      <- MCFits
    CopyStep  <- CopyStepDesign
    SharedQuota = FALSE
    Reserve   = TRUE

INVARIANTS
    TypeOK
    PacketQuota
    BytesUnchangedInPlace
    NoCopy
    AcksNeverLost
    ModeOrder
