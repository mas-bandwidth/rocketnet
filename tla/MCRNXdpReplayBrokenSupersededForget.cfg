\* MCRNXdpReplay reversed witness: a forget the kernel refused is kept even
\* when a newer session's mark of the same address was applied in the same
\* commit. Must fail RetryNeverDeletesNewerMark: Release(A1), the forget
\* refused, Connect(A1) as session 2, its zero mark and then its first
\* nonzero mark applied while the kept forget is refused again (three
\* refusals), and the forget is still pending over session 2's entry, so
\* the retry that succeeds deletes it (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1                    = A1
    Addresses             = {A1}
    MaxSeq                = 2
    W                     = 2
    Sessions              = 2
    MaxInFlight           = 1
    ForgetCapacity        = 1
    ForgetFailureBudget   <- ForgetFailureBudgetThree
    SupersedeStaleForgets <- SupersedeStaleForgetsBroken

INVARIANTS
    TypeOK
    ForgetOwedUntilApplied
    MarksTakenFromTheTruth
    RetryNeverDeletesNewerMark

PROPERTIES
    KernelNeverWrites
