\* MCSendHandoff: the committed run, every rule on.  Checks the safety
\* invariants and, under the fairness of SpecFair (publish, take the front,
\* retire), that every queued generation completes.
SPECIFICATION SpecFair

CONSTANTS
    NumBuffers   = 3
    MaxPackets   = 3
    ReopenNewest = TRUE
    FinishBase   = TRUE

INVARIANTS
    TypeOK
    ReopenedPrivate
    FrontNeverReopened
    PublishedPacketsStable

PROPERTIES
    EveryQueuedGenerationCompletes
