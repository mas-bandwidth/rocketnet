\* Reversed witness: release without cancel. A receive peeks both
\* frames while the staging buffer has room for one, releases the one it
\* consumed, and does not cancel the other. That frame leaves the visible
\* RX ring and is not in the fill ring, the staging buffer or the
\* application. TLC must fail FramePartition.
SPECIFICATION Spec

CONSTANTS
    RingSize             = 2
    StagingCap           = 1
    FrameCount           = 2
    CancelUnconsumed <- CancelBroken

INVARIANTS
    TypeOK
    FramePartition
