\* MCRNSendSpans reversed witness: no padding on wrap; a span that does not
\* fit before the end goes at tail and crosses it. Must fail SpanInsideRing.
\* The committed MCRNSendSpans.cfg with one constant changed.
SPECIFICATION Spec

CONSTANTS
    SR            = 96
    Lengths       = {1, 32, 48, 96}
    Q             = 4
    FloorAtOldest = TRUE
    PadOnWrap     = FALSE

INVARIANTS
    TypeOK
    LiveSpansDisjoint
    SpanInsideRing
    Aligned
    HeadIsOldestStart
    TicketOrder
    EmptyIsZero
    FullAdmitsNothing
    IdleAdmitsAnyMessage
    LiveBetweenHeadAndTail
