\* MCRNServerStats: the received side. Any sequence up to 9 written at any
\* time over a ring of 6 (reordered, late, duplicate, older than the
\* window), spans from the time-ordered list.
SPECIFICATION Spec

CONSTANTS
    N              = 6
    MaxSeq         = 9
    MaxWrites      = 7
    Late           = TRUE
    Reorder        = FALSE
    SeqTimes       = FALSE
    BrokenEntering = FALSE
    BrokenCrossing = FALSE

INVARIANTS
    TypeOK
    BaseFollowsHighest
    CountedIsWindow
    BoundsExact
    OrderedByTime
    PublishedSpanExact
