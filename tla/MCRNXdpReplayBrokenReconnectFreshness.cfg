\* MCRNXdpReplay reversed witness: a forget the kernel refused is dropped
\* at the end of the commit, so a reconnect from the same address is
\* dropped by the stale kernel entry. Expected to fail until
\* rn-fix-xdp-reconnect-freshness lands; witness only here.
SPECIFICATION Spec

CONSTANTS
    A1                = A1
    Addresses         = {A1}
    MaxSeq            = 5
    W                 = 2
    Sessions          = 2
    MaxInFlight       = 2
    KeepFailedForgets <- KeepFailedForgetsBroken

INVARIANTS
    TypeOK
    ForgetOwedUntilApplied
    NewSessionNeverDroppedByOldMark

PROPERTIES
    KernelNeverWrites
