\* Reconnects may arrive while a retained delete is still owed. The current
\* transport has no admission rule for that interval, so the stale kernel
\* high-water may reject the new session's first packets.
SPECIFICATION Spec

CONSTANTS
    A1 = A1
    Addresses = {A1}
    MaxSeq = 5
    W = 2
    Sessions = 2
    MaxInFlight = 2
    ForgetCapacity = 1

INVARIANTS
    TypeOK
    NewSessionNeverDroppedByOldMark

PROPERTIES
    KernelNeverWrites
