\* MCRNXdpReplay reversed witness: the walk marks only a nonzero
\* highest_opened, the rule before reconnect freshness. Must fail
\* NewSessionNeverDroppedByOldMark: Release(A1), Connect(A1) as session 2
\* before the walk queues the old forget, the walk takes no mark for it
\* (nothing opened yet), the commit greets it with session 1's entry still
\* in the map, and its sequence 1 is dropped against that entry.
\* MarkNeverAhead restates the rule and is broken at the greeting commit,
\* before any drop; it is left out so the run reaches the harm
\* (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1              = A1
    Addresses       = {A1}
    MaxSeq          = 5
    W               = 2
    Sessions        = 2
    MaxInFlight     = 2
    ForgetCapacity  = 1
    MarkNewSessions <- MarkNewSessionsBroken

INVARIANTS
    TypeOK
    ForgetOwedUntilApplied
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    NewSessionNeverDroppedByOldMark

PROPERTIES
    KernelNeverWrites
