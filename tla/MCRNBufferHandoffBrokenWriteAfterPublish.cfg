\* MCRNBufferHandoff reversed witness: the I/O thread writes a datagram into a buffer it already published, which update holds. ViewStable falls. Must fail.
SPECIFICATION SpecFair

CONSTANTS
    N                 = 3
    Cap               = 2
    MaxItems          = 5
    MaxReady          = 1
    Direction         = "receive"
    MainBlocks        = FALSE
    WorkUnderLock     = FALSE
    WriteAfterPublish = TRUE
    SkipWake          = FALSE
    ReleaseBeforeSent = FALSE
    DropFinal         = FALSE

INVARIANTS
    TypeOK
    OneOwner
    FreeIsEmpty
    ViewStable
    InOrder
    NoWorkUnderLock
    MainNeverWaits
    ExitSentAll

PROPERTIES
    StopSendsAll
    ArrivedDelivered
