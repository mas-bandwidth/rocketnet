\* MCRNServerStats reversed witness: the counted survivors crossing into the
\* loss-eligible part are never counted there, so loss is taken over too
\* few sends while the ring fills. Must fail EligibleExact. The committed
\* MCRNServerStats.cfg with one constant flipped.
SPECIFICATION Spec

CONSTANTS
    N              = 6
    MaxSeq         = 14
    MaxWrites      = 8
    Late           = FALSE
    Reorder        = FALSE
    SeqTimes       = TRUE
    BrokenEntering = FALSE
    BrokenCrossing = TRUE

INVARIANTS
    EligibleExact
