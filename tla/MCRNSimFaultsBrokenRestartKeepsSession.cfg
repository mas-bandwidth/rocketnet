\* MCRNSimFaults reversed witness: a restarted client reconnects under the
\* generation it held before its crash. Must fail RestartIsFresh: the
\* reconnect's generation was first taken by the session the crash ended.
SPECIFICATION Spec

CONSTANTS
    C1               = C1
    C2               = C2
    S0               = S0
    Clients          = {C1, C2}
    Server           = S0
    MaxSessions      = 6
    MaxClientCrashes = 1
    MaxServerCrashes = 1
    MaxDisconnects   = 1
    MaxTime          = 1
    MaxInFlight      = 2
    Scale            = 200
    Offset           <- MCOffset
    Rate             <- MCRate
    OffsetBound      = 50
    DriftBound       = 1
    FreshOnRestart   <- FreshOnRestartBroken

INVARIANTS
    RestartIsFresh
