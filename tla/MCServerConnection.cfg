\* MCServerConnection: the committed run.  The hang check under "the first
\* packet of every kind is dropped", two slots, two clients, the code's
\* re-sending.  README-ServerConnection.md lists the other runs as edits to
\* this file.
SPECIFICATION Spec

CONSTANTS
    NumClients        = 2
    NumAddrs          = 2
    Slots             = 2
    MapCap            = 4
    HistCap           = 16
    AdmCap            = 4
    MaxAttempts       = 1
    MaxNonces         = 2
    Timeout           = 0
    HsDeadline        = 0
    ClientTimeout     = 0
    DisconnectCopies  = 2
    ClientDisconnects = FALSE
    ServerDisconnects = FALSE
    Vanishes          = FALSE
    Moves             = FALSE
    SharedToken       = FALSE
    Attacker          = FALSE
    KindLoss          = "firstkind"
    RepeatKeepAlive   = TRUE
    ResendChallenge   = TRUE
    ReleaseMapping    = TRUE
    KeyCheck          = TRUE
    C2SPattern        = "none"
    S2CPattern        = "none"
    Capacity          = 2
    MaxDelay          = 0
    Duplication       = FALSE
    Reordering        = FALSE
    BurstStart        = 1
    BurstLen          = 2

INVARIANTS
    SafetyInvariants
    OneAdmissionPerToken

PROPERTIES
    ReleaseRemovesMapping
    Connects
    ServerNotStranded
