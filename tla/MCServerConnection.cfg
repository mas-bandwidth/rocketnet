\* MCServerConnection: the committed run. Two clients contend for one slot
\* and reuse it after a disconnect or a timeout from either side.
\* README-ServerConnection.md lists the other runs as edits to this file.
SPECIFICATION Spec

CONSTANTS
    NumClients          = 2
    NumAddrs            = 2
    NumTokens           = 2
    MaxSlots            = 1
    MapCap              = 2
    AdmittedCap         = 2
    MaxAttempts         = 1
    MaxNonces           = 2
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 2
    HandshakeDeadline   = 2
    Disconnects         = TRUE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "own"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    AdmittedHeld        = TRUE
    ClientIdCheck       = TRUE
    AddressIsIdentity   = TRUE
    RefuseAdmittedAtResponse = FALSE
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 2
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2

INVARIANTS
    SafetyInvariants

PROPERTIES
    PacketsReachOwnSlotOnly
    SessionNeverAnswered
