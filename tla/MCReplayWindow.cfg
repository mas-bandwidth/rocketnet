\* MCReplayWindow: the committed run, the rule. README-ReplayWindow.md
\* gives the reversed witnesses as one-line edits to the CONSTANTS below:
\* ClearedWords = 4 (the defective long skip) and GateBeforeAdvance = FALSE
\* (the reversed advance-then-check witness), each of which TLC must reject.
SPECIFICATION MCSpec

CONSTANTS
    Words             = 6
    WordBits          = 2
    ClearedWords      = 6
    MaxSeq            = 36
    GateBeforeAdvance = TRUE
    GateBeforeOpen    = TRUE

INVARIANTS
    TypeOK
    WindowIsTruth
    GenuineIsAccepted
    AckReportsOnlyReceived
    ReceivedIsRefused
    BelowFloorIsRefused
    HighestIsReceived
    NoAdvanceBeforeConnect
    AckReportsOnlyProcessed
    NoOpenBeforeConnect

PROPERTIES
    Monotone
