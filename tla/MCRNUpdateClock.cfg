\* MCRNUpdateClock: the rule. After a backwards step the clamped time
\* advances by each forward raw step, and it never decreases.
SPECIFICATION MCSpec

CONSTANTS
    Start       = 3
    MaxTime     = 6
    MaxStep     = 2
    MaxUpdates  = 5
    BrokenStall = FALSE

INVARIANTS
    TypeOK
    NeverDecreases
    ResumesExactly
    SeedIdentity
