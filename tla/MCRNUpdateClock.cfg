\* MCRNUpdateClock: the control. Forward raw samples return the caller's
\* own time before any backwards step; a backwards sample holds the clamped
\* time and records the raw one; every later forward sample of d advances
\* the clamped time by exactly d.
SPECIFICATION Spec
CONSTANTS
    Start = 2
    Limit = 6
    GoodLimit = 12
    MaxStep = 2
    Defect = "none"
INVARIANTS
    TypeOK
    OffsetZeroUntilStep
PROPERTIES
    Monotone
    ResumesExactly
