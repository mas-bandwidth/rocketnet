\* Reversed witness: the clamp that holds the last good time until the
\* caller's clock passes it again; after a backwards step a forward raw step
\* advances nothing, so it must violate ResumesExactly.
SPECIFICATION MCSpec

CONSTANTS
    Start       = 3
    MaxTime     = 6
    MaxStep     = 2
    MaxUpdates  = 5
    BrokenStall = TRUE

INVARIANT ResumesExactly
