\* MCRNOpenAddress reversed witness: a clear-last index allowed to fill. The
\* scan finds no empty cell and circles. Must fail EraseEnds.
\* MCRNOpenAddressClearLast.cfg with N = MaxLive = 4.
SPECIFICATION Spec

CONSTANTS
    Keys       = {1, 2, 3, 4}
    N          = 4
    NoWrapTest = FALSE
    ClearLast  = TRUE
    MaxLive    = 4

INVARIANTS
    TypeOK
    Findable
    Unique
    EraseEnds
