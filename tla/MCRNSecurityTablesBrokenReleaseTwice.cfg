\* Reversed witness: ReleaseChecksLive <- MCReleaseChecksLive (FALSE): a
\* release pushes the slot on the free list without unlinking it from its
\* chain, so the released entry is still found: a second release pushes the
\* slot twice, and a later record of the same token rewrites it in place and
\* puts it on the order list while it is still on the free list.
\* FreeAndOrderPartitionSlots fails (the shortest trace is the record).
SPECIFICATION Spec

CONSTANTS
    None = None
    Addrs = {"A", "B"}
    Tokens = {"th", "te", "tf"}
    Expire <- MCExpire
    Cid <- MCCid
    MaxClock = 4
    CookieLife = 1
    RotatePeriod = 2
    MaxClients = 2
    HistoryCap = 2
    AdmittedCap = 2
    VerifyBudget = 2
    HandshakeDeadline = 4
    Rotation = TRUE
    AcceptPrevious = TRUE
    RefuseAdmittedAtResponse = TRUE
    AdmitExpiredAtResponse = FALSE
    EvictLiveHistory = FALSE
    DeniedConsumesToken = FALSE
    CapVerifyBudget = TRUE
    PreviousOutlivesWindow = FALSE
    BindAtRequest = FALSE
    Holds <- MCHolds
    HoldUntilExpire = FALSE
    CheckCidAtResponse = TRUE
    ReleaseChecksLive <- MCReleaseChecksLive

INVARIANTS
    FreeAndOrderPartitionSlots

CHECK_DEADLOCK FALSE
