\* MCRNClientIo reversed witness: the ring is marked Sent once every slot's
\* send is posted, before the kernel completes the posts (IoFinishRing
\* without completed).  The main thread may then reopen a ring the kernel
\* still reads, and NoFreeBeforeComplete falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    NumSlots           = 2
    BufferCap          = 1
    MaxDatagrams       = 3
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = FALSE
    SwapNeedsReady     = FALSE
    HandOffWaits       = FALSE
    FullWaitReadable   = FALSE
    StepDriven          = FALSE
    StepModeStartsThread = FALSE
    SentBeforeComplete <- SentBeforeCompleteOn

INVARIANTS
    TypeOK
    NoFreeBeforeComplete
