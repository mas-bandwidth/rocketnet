\* MCRNClientIo reversed witness: the ring is marked Sent once every slot's
\* send is posted, before the kernel completes them (IoFinishRing on
\* AllPosted).  The main thread then reopens a ring the kernel still reads,
\* and NoFreeBeforeComplete falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    NumSlots           = 2
    BufferCap          = 1
    MaxDatagrams       = 3
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = FALSE
    SwapNeedsReady     = FALSE
    HandOffWaits       = FALSE
    FullWaitReadable   = FALSE
    StepDriven          = FALSE
    StepModeStartsThread = FALSE
    SentBeforeComplete <- MCTrue

INVARIANTS
    TypeOK
    NoReuseBeforeSent
    ExposedStable
    FreedOnlyAfterJoin
    HandOffNeverWaits
    FullWaitsOnWake
    NoReceiveStall
    IoNeverBlocksOnSend
    NoFreeBeforeComplete
