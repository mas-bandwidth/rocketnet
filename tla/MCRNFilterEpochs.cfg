\* MCRNFilterEpochs: the committed run, the rule. N = 4 stands for 255,
\* a table of three generations, nine installs (two wraps). The reversed
\* witnesses are MCRNFilterEpochsBrokenAcceptZero.cfg and
\* MCRNFilterEpochsBrokenWrapToZero.cfg beside this one.
SPECIFICATION Spec

CONSTANTS
    N           = 4
    Live        = 3
    MaxInstalls = 9

INVARIANTS
    TypeOK
    NeverKeyedAtZero
    WrapSkipsZero
    AtLeastTwoLiveAfterRotation
    DeadEpochRefusedWithoutMac
    OneMacPerLiveEpoch
    LegitimateNeverRefused
    OldKeyRefused
    LiveGenerationsDistinct
