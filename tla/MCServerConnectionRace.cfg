\* MCServerConnectionRace.cfg: the family race. A token naming both families on a host
\* with both and a server serving IPv4 only, so IPv6 answers nothing: the
\* client commits to IPv4 at its cookie and connects (Connects), one family
\* per attempt (OneFamilyPerAttempt, CommitsOnAnswer).
SPECIFICATION Spec

CONSTANTS
    NumClients          = 1
    NumAddrs            = 1
    NumTokens           = 1
    MaxSlots            = 1
    MapCap              = 1
    HeldCapacity        = 1
    MaxAttempts         = 1
    MaxNonces           = 1
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 0
    HandshakeDeadline   = 0
    Disconnects         = FALSE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "own"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2
    TokenFamilies       <- MCTokenBothFamilies
    ServedFamily        <- MCServedIpv4
    AddressMatch        <- MCMatchEither

INVARIANTS
    RaceInvariants

PROPERTIES
    Connects
