\* the reversed reachability witness for the "first" loss pattern on both
\* links.  Timeout rises from 2 to the measured 3: the first request and the
\* first cookie are lost, the second cookie reaches the client with the
\* receive clock at 2, and the cookie-carrying request is sent before the
\* clock reaches 3, where the challenge resets it.  Every other constant is
\* MCClientConnectionSFirst.cfg's.  SPECIFICATION SpecReach adds
\* ClientRecvPayloadWitness, so the ghost cPayloadDelivered is set once the
\* connected application is handed a payload; NotReached is its negation.
\* TLC must violate NotReached: a run that completes without a violation
\* would mean connected with a payload delivered is unreachable under these
\* constants.
SPECIFICATION SpecReach
CONSTANTS
    SendInterval     = 1
    Timeout          = 3
    Deadline         = 5
    ServerDeadline   = 3
    MaxAttempts      = 1
    MaxNonces        = 2
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = TRUE
    Disconnects      = TRUE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "first"
    S2CPattern       = "first"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = TRUE
    Reordering       = TRUE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    NotReached
