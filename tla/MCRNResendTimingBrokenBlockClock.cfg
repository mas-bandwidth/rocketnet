\* MCRNResendTimingBrokenBlockClock: the reversed witness of the chunk's
\* clock. The chunk first sent at tick 98 is timed from its block's first
\* send at tick 0 (the code before send_first_sends): at tick 100 it has two
\* sends where MinAttempts are owed. It must fail AttemptsBeforeTimeout.
SPECIFICATION Spec

CONSTANTS
    Interval    = 1
    RtoInitial  = 1
    RtoMin      = 1
    RtoMax      = 3
    Timeout     = 100
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    ChunkFirst  <- ChunkFirstLate
    BlockClock  <- BlockClockOn

INVARIANTS
    TypeOK
    ConfigAccepted
    AttemptsBeforeTimeout
    ResendGapBounded
    SmallNeverHeldByChunk
