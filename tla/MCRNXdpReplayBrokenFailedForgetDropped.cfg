\* MCRNXdpReplay reversed witness: a forget the kernel refused is dropped
\* at the end of the commit instead of kept pending for the next one.
\* Must fail ForgetOwedUntilApplied: the released address's entry stays in
\* the map with nothing left to forget it. MarkNeverAhead carries
\* ForgetOwedUntilApplied as a conjunct and is left out so the run names
\* the rule this shape removes (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1                = A1
    Addresses         = {A1}
    MaxSeq            = 5
    W                 = 2
    Sessions          = 2
    MaxInFlight       = 2
    KeepFailedForgets <- KeepFailedForgetsBroken

INVARIANTS
    TypeOK
    ForgetOwedUntilApplied
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    NewSessionNeverDroppedByOldMark

PROPERTIES
    KernelNeverWrites
