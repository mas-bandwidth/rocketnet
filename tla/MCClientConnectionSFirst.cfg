\* MCClientConnectionSFirst.cfg: MCClientConnection safety with C2SPattern
\* "first" and S2CPattern "first".  At Timeout 2 the idle timeout fires
\* before the cookie-carrying request goes out: the second cookie reaches
\* the client with the receive clock at 1, and the tick that would let the
\* cookie-carrying request go out takes it to 2 and times the attempt out in
\* sending-connection-request.  The case covers the handshake up to that
\* timeout and never CONNECTED.  The connected-with-a-payload reachability
\* witness under these constants is MCClientConnectionReachSFirst.cfg
\* (Timeout 3).
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 2
    Deadline         = 5
    ServerDeadline   = 3
    MaxAttempts      = 1
    MaxNonces        = 2
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = TRUE
    Disconnects      = TRUE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "first"
    S2CPattern       = "first"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = TRUE
    Reordering       = TRUE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    SafetyInvariants
PROPERTIES
    StepsForwardOrFails
    DisconnectIsTerminal
    TimeoutPairing
    AcceptedUnderLiveKeys
    NoSendOnArrival
