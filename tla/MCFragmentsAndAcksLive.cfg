\* MCFragmentsAndAcksLive: the liveness run (Spec: strong fairness on sends and
\* receives, eventual delivery per link; OpenedSurfacesOrLaps) on the committed
\* instance. TLC did not finish it at this size; live-small and live-dup (the
\* reader's MaxSeq 1 instance) are the finished rows (README).
SPECIFICATION Spec

CONSTANTS
    MaxSeq       = 4
    SentRing     = 4
    AggRing      = 2
    BatchCap     = 1
    Window       = 4
    MaxRanges    = 2
    Slots        = 1
    IdSpace      = 8
    FirstId      = 1
    StaleAhead   = 2
    StaleRule    = "code"
    MaxGen       = 2
    MaxCount     = 3
    Counts       = {2, 3}
    Stride       = 2
    FinalBytes   = 1
    MaxPayload   = 5
    MaxFragment  = 3
    DrainCap     = 4
    DeliveredCap = 2
    DefectIds    = {}
    Burns        = TRUE
    Witness      = "none"
    D2RPattern   = "arbitrary"
    R2DPattern   = "arbitrary"
    Capacity     = 2
    MaxDelay     = 0
    Duplication  = TRUE
    Reordering   = TRUE
    BurstStart   = 3
    BurstLen     = 2

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    DeliveredExact
    DeliveredOnce
    CompleteDelivers
    ArenaBounded
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked

PROPERTIES
    CountPinned
    OpenedSurfacesOrLaps
