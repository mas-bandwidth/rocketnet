\* MCFragmentsAndAcksSmallSafety: a smaller safety instance that includes
\* NamedOnlyIfAccepted. MaxSeq=2 gives just enough sequences to exercise
\* fragment reassembly and ack eligibility without exploding state space.
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq       = 2
    SentRing     = 4
    AggRing      = 2
    BatchCap     = 1
    Window       = 4
    MaxRanges    = 2
    Slots        = 1
    IdSpace      = 8
    FirstId      = 1
    StaleAhead   = 2
    StaleRule    = "code"
    MaxGen       = 1
    MaxCount     = 2
    Counts       = {2}
    Stride       = 2
    FinalBytes   = 1
    MaxPayload   = 5
    MaxFragment  = 3
    DrainCap     = 4
    DeliveredCap = 2
    DefectIds    = {}
    Burns        = TRUE
    Witness      = "none"
    D2RPattern   = "arbitrary"
    R2DPattern   = "arbitrary"
    Capacity     = 1
    MaxDelay     = 0
    Duplication  = TRUE
    Reordering   = TRUE
    BurstStart   = 3
    BurstLen     = 2

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    DeliveredExact
    DeliveredOnce
    CompleteDelivers
    ArenaBounded
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked
    NamedOnlyIfAccepted

PROPERTIES
    CountPinned
