\* Reversed witness: FloodSpecWeakHonest, the honest request under weak
\* fairness only, at handshakes_per_update = 1.  A forger takes the one
\* request of every update first; the honest request is enabled after each
\* update and disabled again before it runs, so it is never continuously
\* enabled and HonestConnectsUnderFlood fails.
SPECIFICATION FloodSpecWeakHonest

CONSTANTS
    None = None
    Addrs = {"A", "B"}
    Tokens = {"th", "te", "tf"}
    Expire <- MCExpire
    Cid <- MCCid
    MaxClock = 4
    CookieLife = 1
    RotatePeriod = 2
    MaxClients = 2
    HistoryCap = 2
    AdmittedCap = 2
    VerifyBudget = 1
    HandshakeDeadline = 4
    Rotation = TRUE
    AcceptPrevious = TRUE
    RefuseAdmittedAtResponse = TRUE
    AdmitExpiredAtResponse = FALSE
    EvictLiveHistory = FALSE
    DeniedConsumesToken = FALSE
    CapVerifyBudget = TRUE
    PreviousOutlivesWindow = FALSE
    BindAtRequest = FALSE
    Holds <- MCHolds
    HoldUntilExpire = FALSE
    CheckCidAtResponse = TRUE

INVARIANTS
    FloodInvariants

PROPERTIES
    HonestConnectsUnderFlood

CHECK_DEADLOCK FALSE
