\* MCRNRioWorker: the rule, safety.  Receives and sends together: three
\* datagrams and two staged sends, every invariant.  The liveness controls
\* split by direction so each fits the run budget.
SPECIFICATION Spec

CONSTANTS
    DropHanded      = FALSE
    Slices          = 2
    NumBanks        = 3
    Cap             = 2
    View            = 4
    MaxDatagrams    = 3
    MaxSends        = 2
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    TypeOK
    SlicesAccounted
    ExclusiveOwnership
    ExposedStable
    ExactDelivery
    FillPhaseOwnedByMain
    NoSendDuplicated
    FreedOnlyWhenDrained
    StopSendsHanded
    StopSendsFinished
