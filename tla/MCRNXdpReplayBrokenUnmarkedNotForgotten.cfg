\* MCRNXdpReplay broken witness: the walk forgets only slots that held a
\* mark. A slot connected with highest_opened=0 (no mark) then released
\* leaves its replyMac entry stale, violating the sink saw exactly one
\* forget invariant.
SPECIFICATION Spec

CONSTANTS
    A1          = A1
    Addresses   = {A1}
    MaxSeq      = 5
    W           = 2
    Sessions    = 2
    MaxInFlight = 2
    WalkForgetsOnlyMarked <- FALSE

INVARIANTS
    TypeOK
    MarkNeverAhead
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    NewSessionNeverDroppedByOldMark
