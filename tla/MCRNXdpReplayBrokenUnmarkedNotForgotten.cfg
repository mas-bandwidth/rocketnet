\* MCRNXdpReplay reversed witness: the walk forgets the reply MAC of the
\* marked slots only, so a slot that was seen connected and that left before
\* it ever held a mark keeps the MAC the transport learned when it accepted
\* the client. Must fail ReleasedSlotForgetsItsReplyMac: the reply MAC of
\* the released address is still in the table when the walk that follows the
\* release has run. The kernel mark forgets are unchanged, so the other
\* invariants still hold (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1          = A1
    Addresses   = {A1}
    MaxSeq      = 5
    W           = 2
    Sessions    = 2
    MaxInFlight = 2
    WalkForgetsUnmarked <- WalkForgetsUnmarkedBroken

INVARIANTS
    TypeOK
    MarkNeverAhead
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    NewSessionNeverDroppedByOldMark
    ReleasedSlotForgetsItsReplyMac

PROPERTIES
    KernelNeverWrites
