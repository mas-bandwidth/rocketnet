\* MCRNXdpReplay reversed witness: the walk forgets only a slot that held a
\* mark. Must fail MacForgottenAfterAWalk: a session seen connected by a walk
\* with highest_opened still 0, then released, keeps its reply MAC after the
\* next walk.
SPECIFICATION Spec

CONSTANTS
    A1          = A1
    Addresses   = {A1}
    MaxSeq      = 5
    W           = 2
    Sessions    = 2
    MaxInFlight = 2
    WalkForgetsUnmarked <- WalkForgetsUnmarkedBroken

INVARIANTS
    TypeOK
    MarkNeverAhead
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    NewSessionNeverDroppedByOldMark
    MacForgottenAfterAWalk

PROPERTIES
    KernelNeverWrites
