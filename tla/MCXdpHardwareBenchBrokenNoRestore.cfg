\* MCXdpHardwareBench reversed witness: a crash skips restore (the lock
\* file does not name the dead run, so the next hold does not restore
\* first). Must fail FreeMeansRestored: the machine reads Free with a
\* program still attached. The committed cfg with MarkCrash = FALSE.
SPECIFICATION Spec

CONSTANTS
    Runs      = {r1, r2}
    UseLock   = TRUE
    MarkCrash = FALSE

INVARIANTS
    TypeOK
    OneRunAtATime
    AttachOnlyAfterVerify
    FreeMeansRestored

PROPERTIES
    EveryHoldEndsFree
