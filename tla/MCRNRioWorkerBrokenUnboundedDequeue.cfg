\* MCRNRioWorker reversed witness: the worker dequeues every completion
\* whatever the fill bank has room for and drops the overflow (the old
\* caller-driven bank rule).  Two banks and four datagrams so the fill bank
\* can be partly full with no free bank.  Must fail ExactDelivery.
SPECIFICATION Spec

CONSTANTS
    Slices          = 2
    NumBanks        = 2
    Cap             = 2
    View            = 4
    MaxDatagrams    = 4
    MaxSends        = 0
    SwitchOnIdle    = TRUE
    BoundedDequeue  = FALSE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    TypeOK
    ExactDelivery
