\* MCXdpHardwareBench: the committed run, both rules on. The two
\* MCXdpHardwareBenchBroken*.cfg files beside this one are the reversed
\* witnesses, each this file with one constant flipped.
SPECIFICATION Spec

CONSTANTS
    Runs      = {r1, r2}
    UseLock   = TRUE
    MarkCrash = TRUE

INVARIANTS
    TypeOK
    OneRunAtATime
    AttachOnlyAfterVerify
    FreeMeansRestored

PROPERTIES
    EveryHoldEndsFree
