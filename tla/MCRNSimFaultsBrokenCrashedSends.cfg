\* MCRNSimFaults reversed witness: a crash flips the endpoint's phase but leaves
\* its objects running, so a crashed endpoint still sends and receives. Must
\* fail CrashedEndpointSilent.
SPECIFICATION Spec

CONSTANTS
    C1               = C1
    C2               = C2
    S0               = S0
    Clients          = {C1, C2}
    Server           = S0
    MaxSessions      = 6
    MaxClientCrashes = 1
    MaxServerCrashes = 1
    MaxDisconnects   = 1
    MaxTime          = 1
    MaxInFlight      = 2
    Scale            = 200
    Offset           <- MCOffset
    Rate             <- MCRate
    OffsetBound      = 50
    DriftBound       = 1
    CrashSilences    <- CrashSilencesBroken

INVARIANTS
    CrashedEndpointSilent
