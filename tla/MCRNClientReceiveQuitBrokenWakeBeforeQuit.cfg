\* MCRNClientReceiveQuit reversed witness: destroy wakes the thread before
\* it stores quit, the lost-wake ordering.  The wake ends a wait (or makes
\* the next one return at once) while quit still reads false, so the
\* thread goes round again on a spent wake: WokenSeesQuit falls.  Must
\* fail.
SPECIFICATION Spec

CONSTANTS
    Platform       = "linux"
    WaitTimeout    = "unreliable"
    WakeBeforeQuit = TRUE
    NoWake         = FALSE

INVARIANTS
    TypeOK
    NoJoinBeforeExit
    WokenSeesQuit
