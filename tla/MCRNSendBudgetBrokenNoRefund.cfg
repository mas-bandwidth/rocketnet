    MaxRel        = 2
    MaxLoss       = 1
    CheckBudget   = TRUE
    ReliableFirst = TRUE
    RefundOnFail  = FALSE
    MaxFail       = 1

INVARIANTS
    TypeOK
    FailedSendCostsNothing
