\* MCRNSecurityTablesFloodBudgetOne: FloodSpec at the smallest handshake
\* work budget the server config takes (handshakes_per_update = 1), below
\* the two forgers that want it every update.  Each update admits one
\* request; the honest client's request, dropped while a forger holds the
\* budget and sent again, is admitted in a later update and it connects.
SPECIFICATION FloodSpec

CONSTANTS
    None = None
    Addrs = {"A", "B"}
    Tokens = {"th", "te", "tf"}
    Expire <- MCExpire
    Cid <- MCCid
    MaxClock = 4
    CookieLife = 1
    RotatePeriod = 2
    MaxClients = 2
    HistoryCap = 2
    AdmittedCap = 2
    VerifyBudget = 1
    HandshakeDeadline = 4
    Rotation = TRUE
    AcceptPrevious = TRUE
    RefuseAdmittedAtResponse = TRUE
    AdmitExpiredAtResponse = FALSE
    EvictLiveHistory = FALSE
    DeniedConsumesToken = FALSE
    CapVerifyBudget = TRUE
    PreviousOutlivesWindow = FALSE
    BindAtRequest = FALSE
    Holds <- MCHolds
    HoldUntilExpire = FALSE
    CheckCidAtResponse = TRUE

INVARIANTS
    FloodInvariants

PROPERTIES
    HonestConnectsUnderFlood

CHECK_DEADLOCK FALSE
