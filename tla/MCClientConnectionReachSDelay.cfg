\* the reversed reachability witness for the "first" loss pattern on both
\* links with a tick of latency.  Timeout rises from 2 to the measured 3:
\* the second cookie arrives with the receive clock at 1, the tick that lets
\* the cookie-carrying request go out takes it to 2 where Timeout 2 would
\* fire, and the challenge resets it before 3.  Every other constant is
\* MCClientConnectionSDelay.cfg's.  SPECIFICATION SpecReach adds
\* ClientRecvPayloadWitness, so the ghost cPayloadDelivered is set once the
\* connected application is handed a payload; NotReached is its negation.
\* TLC must violate NotReached: a run that completes without a violation
\* would mean connected with a payload delivered is unreachable under these
\* constants.
SPECIFICATION SpecReach
CONSTANTS
    SendInterval     = 1
    Timeout          = 3
    Deadline         = 4
    ServerDeadline   = 3
    MaxAttempts      = 1
    MaxNonces        = 2
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "first"
    S2CPattern       = "first"
    Capacity         = 2
    MaxDelay         = 1
    Duplication      = TRUE
    Reordering       = TRUE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    NotReached
