\* MCRNClientIo reversed witness: destroy's last hand-off wait has no
\* deadline.  NextNoDeadline is the same next-state relation without the
\* Timeout action; every progress assumption of SpecFair, including the
\* observation that the other ring is Sent (DestroyWaitDone), stays.  The
\* I/O thread stalls the other ring's send (IoStall: the ring stays
\* Sending and never reaches Sent), so the wait has no exit and destroy
\* never reaches Stop, Join or Free: DestroyCompletes falls.  This is the
\* wait the fix bounds (code: the while loop and the time_callback
\* deadline at sdk/rocketnet_client_transport.cpp).  Must fail.
SPECIFICATION SpecNoDeadline

CONSTANTS
    NumSlots           = 2
    BufferCap          = 1
    MaxDatagrams       = 3
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = FALSE
    SwapNeedsReady     = FALSE
    HandOffWaits       = FALSE
    FullWaitReadable   = FALSE
    StepDriven          = FALSE
    StepModeStartsThread = FALSE

INVARIANTS
    TypeOK
    FreedOnlyAfterJoin
    HandOffNeverWaits
    DroppedAtDeadline

PROPERTIES
    DestroyCompletes
