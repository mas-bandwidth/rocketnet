\* MCRNClientIo reversed witness: destroy's hand-off wait has no deadline
\* (DestroyNeverTimesOut restores the unbounded wait, with HandOffWaits
\* blocking the main thread on a ring that is never Sent).  Destroy's wait
\* never ends, so DestroyAlwaysFinishes falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    NumSlots           = 2
    BufferCap          = 1
    MaxDatagrams       = 3
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = FALSE
    SwapNeedsReady     = FALSE
    HandOffWaits       = TRUE
    FullWaitReadable   = FALSE
    StepDriven          = FALSE
    StepModeStartsThread = FALSE
    DestroyDeadline      = 2
    DestroyNeverTimesOut = TRUE

INVARIANTS
    TypeOK

PROPERTIES
    DestroyAlwaysFinishes
