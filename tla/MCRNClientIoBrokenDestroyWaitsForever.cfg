\* MCRNClientIo reversed witness: the deadline of destroy's last hand-off
\* wait is not guaranteed.  SpecNoDeadline keeps the wait's two exits (the
\* observation that the other ring is Sent, and Timeout at the deadline)
\* unfair, so even after the I/O thread finishes the ring the last
\* hand-off's wait never ends, and destroy never reaches Stop, Join or
\* Free: DestroyCompletes falls.  This restores the wait the fix bounds
\* (code: the while loop and the time_callback deadline at
\* sdk/rocketnet_client_transport.cpp).  Must fail.
SPECIFICATION SpecNoDeadline

CONSTANTS
    NumSlots           = 1
    BufferCap          = 1
    MaxDatagrams       = 0
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = FALSE
    SwapNeedsReady     = FALSE
    HandOffWaits       = FALSE
    FullWaitReadable   = FALSE
    StepDriven          = FALSE
    StepModeStartsThread = FALSE

INVARIANTS
    TypeOK
    FreedOnlyAfterJoin
    HandOffNeverWaits
    DroppedAtDeadline

PROPERTIES
    DestroyCompletes
