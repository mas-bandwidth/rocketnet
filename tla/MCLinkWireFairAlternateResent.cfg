\* MCLinkWireFairAlternateResent.cfg: MCLink Pattern "alternate" under SpecWireFair, checking ResentIsDelivered (the reorder-starvation witness).
SPECIFICATION SpecWireFair
CONSTANTS
    Packets     = {a, b}
    Capacity    = 3
    MaxDelay    = 1
    Duplication = TRUE
    Reordering  = TRUE
    Pattern     = "alternate"
    BurstStart  = 1
    BurstLen    = 2
INVARIANTS
    MCTypeOK
    InFlightBounded
    DeliveredWereSent
    WireCarriesOnlySent
    FirstSendLost
PROPERTIES
    ResentIsDelivered
