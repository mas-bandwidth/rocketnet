\* MCRNPortableRx reversed witness: stop signals the RX wake before it
\* sets quit.  With no wait timeout the worker can consume the signal, see
\* quit still clear and wait forever.  Must fail StopCompletes.
SPECIFICATION SpecFair

CONSTANTS
    NumBanks       = 3
    Cap            = 2
    Budget         = 1
    MaxDatagrams   = 4
    HoldOnFull     = TRUE
    ReturnWhenRead = TRUE
    QuitBeforeWake = FALSE
    WakeOnReturn   = TRUE
    Timeout        = FALSE

INVARIANTS
    TypeOK
    ExactDelivery

PROPERTIES
    StopCompletes
