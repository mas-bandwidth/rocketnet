\* Reversed witness: MCRNScheduler.cfg with ChannelFIFO = FALSE (per-message
\* priority: every queued item is offered at its own level, not only its
\* channel's head at the channel's boosted level). Channel 0's IMMEDIATE item
\* is first-written ahead of the LOW item queued before it. TLC must fail
\* FirstWriteInOrderPerChannel.

SPECIFICATION Spec

CONSTANTS
    NC             = 2
    Msgs           <- MCMsgs
    ULevel         = 0
    W              = 2
    Cap            = 1
    UPerTick       = 1
    MaxLoss        = 1
    ChannelFIFO    = FALSE
    UnreliableLast = TRUE

INVARIANTS
    TypeOK
    FirstWriteInOrderPerChannel
    UnreliableNotBlockedByWindow
    ClassOrderBeforePriority
