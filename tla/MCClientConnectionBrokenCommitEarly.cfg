\* MCClientConnectionBrokenCommitEarly.cfg: the reversed witness of the race. The client
\* commits to a family before any answer; committing to the unreachable IPv6
\* violates CommitsOnAnswer.
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 0
    Deadline         = 0
    ServerDeadline   = 0
    MaxAttempts      = 1
    MaxNonces        = 1
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "firstkind"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
    RaceFamilies      <- MCBothFamilies
    ReachableFamilies <- MCIpv4Reachable
    CommitBeforeAnswer <- MCCommitEarly
INVARIANTS
    CommitsOnAnswer
