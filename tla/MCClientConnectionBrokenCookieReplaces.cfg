\* Reversed witness: the pre-fix cookie, which replaces the one stored.
\* TLC must fail HandshakeNeverRewinds: the server's cookie is kept, then a
\* forged cookie delivered in sending connection request (2) replaces it.
SPECIFICATION SpecCookieReplaces
CONSTANTS
    SendInterval     = 1
    Timeout          = 3
    Deadline         = 0
    ServerDeadline   = 0
    MaxAttempts      = 1
    MaxNonces        = 1
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = FALSE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
    Forgery          <- MCForgery
PROPERTIES
    HandshakeNeverRewinds
