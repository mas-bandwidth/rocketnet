\* Reversed witness: MCRNBlocks.cfg with PlaceByIndex = FALSE (a fragment is
\* copied to base + have*F, in arrival order: the study's 8.2 corruption).
\* TLC must fail DeliveredEqualsSent.

SPECIFICATION Spec

CONSTANTS
    W            = 4
    F            = 2
    B            = 8
    Small        = 2
    Units        <- MCUnits
    PlaceByIndex = FALSE
    FwdPattern   = "arbitrary"
    Capacity     = 2
    MaxDelay     = 0
    Duplication  = TRUE
    Reordering   = TRUE
    BurstStart   = 1
    BurstLen     = 2

INVARIANTS
    TypeOK
    SplitConsecutive
    NoPartialDelivery
    OneOrderingSlotPerBlock
    DeliveredEqualsSent
