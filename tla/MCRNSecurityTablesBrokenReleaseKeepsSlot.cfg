\* Reversed witness: ReleaseToFree <- MCReleaseToFree (FALSE), the claim
\* table's code before the free list, without its scan: a release zeroes
\* the claim's deadline and leaves the slot in its chain and in place on the
\* order list.  A released slot behind a live head is then reusable by the
\* scan but not by the O(1) rule: CanRecordMatchesScan fails.
SPECIFICATION Spec

CONSTANTS
    None = None
    Addrs = {"A", "B"}
    Tokens = {"th", "te", "tf"}
    Expire <- MCExpire
    Cid <- MCCid
    MaxClock = 4
    CookieLife = 1
    RotatePeriod = 2
    MaxClients = 2
    HistoryCap = 2
    AdmittedCap = 2
    VerifyBudget = 2
    HandshakeDeadline = 4
    Rotation = TRUE
    AcceptPrevious = TRUE
    RefuseAdmittedAtResponse = TRUE
    AdmitExpiredAtResponse = FALSE
    EvictLiveHistory = FALSE
    DeniedConsumesToken = FALSE
    CapVerifyBudget = TRUE
    PreviousOutlivesWindow = FALSE
    BindAtRequest = FALSE
    Holds <- MCHolds
    ClaimTokens <- MCClaimTokens
    HoldUntilExpire = FALSE
    CheckCidAtResponse = TRUE
    ReleaseToFree <- MCReleaseToFree

INVARIANTS
    CanRecordMatchesScan

CHECK_DEADLOCK FALSE
