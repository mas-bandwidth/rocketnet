\* MCRNUringDriver reversed witness: one bank.  Reap copies a receive CQE
\* into the exposed bank the transport is reading instead of the fill
\* bank.  Must fail ExposedStable: the exposed bank changes between two
\* Swaps.
SPECIFICATION Spec

CONSTANTS
    Slots             = 2
    Buffers           = 2
    MaxSteps          = 2
    ResetWaitsForReap = TRUE
    ReapIntoFill      = FALSE

INVARIANTS
    TypeOK
    NoReuseWhileKernelOwned
    ExposedStable
    BufferReturnedAfterCopy
    FreedOnlyWhenDrained
