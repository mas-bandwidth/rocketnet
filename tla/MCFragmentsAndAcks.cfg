\* MCFragmentsAndAcks: the committed run. The honest sender under the code's
\* rules (Witness "none", StaleRule "code"), burns on, both links "arbitrary",
\* under SpecSafety: the thirteen invariants and CountPinned, no fairness.
\* MCFragmentsAndAcksLive.cfg is the same instance under Spec with the liveness
\* property. README-FragmentsAndAcks.md gives the other runs as edits to this file.
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq       = 4
    SentRing     = 4
    AggRing      = 2
    BatchCap     = 1
    Window       = 4
    MaxRanges    = 2
    Slots        = 1
    IdSpace      = 8
    FirstId      = 1
    StaleAhead   = 2
    StaleRule    = "code"
    MaxGen       = 2
    MaxCount     = 3
    Counts       = {2, 3}
    Stride       = 2
    FinalBytes   = 1
    MaxPayload   = 5
    MaxFragment  = 3
    DrainCap     = 4
    DeliveredCap = 2
    DefectIds    = {}
    Burns        = TRUE
    Witness      = "none"
    D2RPattern   = "arbitrary"
    R2DPattern   = "arbitrary"
    Capacity     = 2
    MaxDelay     = 0
    Duplication  = TRUE
    Reordering   = TRUE
    BurstStart   = 3
    BurstLen     = 2

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    DeliveredExact
    DeliveredOnce
    CompleteDelivers
    ArenaBounded
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked
    NamedOnlyIfAccepted

PROPERTIES
    CountPinned
