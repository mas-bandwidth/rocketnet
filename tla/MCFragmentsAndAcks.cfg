\* MCFragmentsAndAcks: the committed run. Both links "arbitrary" (drop,
\* duplicate, reorder, delay), the honest sender with burns, laps in the
\* sent ring (MaxSeq > SentRing) and the window (MaxSeq > W).
\* README-FragmentsAndAcks.md gives the other runs (the deterministic loss
\* patterns, the liveness run, the forge run and the two expected failures)
\* as edits to this file.
SPECIFICATION Spec

CONSTANTS
    MaxSeq        = 4
    SentRing      = 4
    AggRing       = 2
    BatchCap      = 1
    W             = 4
    Slots         = 2
    IdMod         = 8
    FirstPid      = 7
    PayloadSizes  = {3}
    MaxFragBytes  = 2
    MaxPayload    = 5
    RecvPerUpdate = 2
    DeliveredCap  = 1
    Burns         = TRUE
    Forged        <- MCForgedNone
    C2SPattern    = "arbitrary"
    S2CPattern    = "arbitrary"
    Capacity      = 2
    MaxDelay      = 0
    Duplication   = TRUE
    Reordering    = TRUE
    BurstStart    = 1
    BurstLen      = 2

INVARIANTS
    TypeOK
    AckBatchBounded
    SurfacedOnce
    SurfacedOnlyWhenAllArrived
    BurnedNeverAcked
    ReassemblyBounded
    DeliveredWhole
    DeliveredOnce
