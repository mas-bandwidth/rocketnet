\* Reversed witness: the pre-fix cookie, which restarts the receive clock.
\* TLC must fail OnlyAuthenticatedRefreshes: a cookie accepted after a tick
\* has run sets ticks-since-receive back to zero in state 1 or 2.
SPECIFICATION SpecCookieRefreshes
CONSTANTS
    SendInterval     = 1
    Timeout          = 3
    Deadline         = 0
    ServerDeadline   = 0
    MaxAttempts      = 1
    MaxNonces        = 1
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = FALSE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
PROPERTIES
    OnlyAuthenticatedRefreshes
