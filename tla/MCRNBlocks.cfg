\* MCRNBlocks: the committed run, placement by index. W = 4, F = 2 units,
\* B = 8 units, a single record of 2 units and a 3-fragment block of 5 units,
\* over a link that loses, duplicates and reorders (capacity 2).

SPECIFICATION Spec

CONSTANTS
    W            = 4
    F            = 2
    B            = 8
    Small        = 2
    Units        <- MCUnits
    PlaceByIndex = TRUE
    FwdPattern   = "arbitrary"
    Capacity     = 2
    MaxDelay     = 0
    Duplication  = TRUE
    Reordering   = TRUE
    BurstStart   = 1
    BurstLen     = 2

INVARIANTS
    TypeOK
    SplitConsecutive
    NoPartialDelivery
    OneOrderingSlotPerBlock
    DeliveredEqualsSent
