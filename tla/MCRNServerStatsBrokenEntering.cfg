\* MCRNServerStats reversed witness: the record entering the window's top
\* edge is tested against the window before the base moves, so it is never
\* counted. Must fail CountedIsWindow. The committed MCRNServerStats.cfg with
\* one constant flipped.
SPECIFICATION Spec

CONSTANTS
    N              = 6
    MaxSeq         = 14
    MaxWrites      = 8
    Late           = FALSE
    SeqTimes       = TRUE
    BrokenEntering = TRUE

INVARIANTS
    CountedIsWindow
