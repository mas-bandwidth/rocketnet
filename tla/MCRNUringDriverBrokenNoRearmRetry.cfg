\* MCRNUringDriver reversed witness: receive_packets never re-arms.  A
\* multishot that ends (Term) is left disarmed, and the one-shot re-arm in
\* the CQE handler is modeled as not guaranteed (Term leaves armed FALSE).
\* Must fail ReceiveLiveness: a disarmed running multishot is never re-armed,
\* a silent permanent receive stall.
SPECIFICATION SpecFair

CONSTANTS
    Slots             = 1
    Buffers           = 1
    MaxSteps          = 1
    ResetWaitsForReap = TRUE
    ReapIntoFill      = TRUE
    RearmOnReceive    = FALSE

INVARIANTS
    TypeOK
    NoReuseWhileKernelOwned
    ExposedStable
    BufferReturnedAfterCopy
    FreedOnlyWhenDrained

PROPERTIES
    ReceiveLiveness
