\* MCRNRing reversed witness: len16 is the raw length, not rounded up to
\* 16. Must fail Aligned: the record after a 1-byte record starts at 1. The
\* committed MCRNRing.cfg with one line changed.
SPECIFICATION Spec

CONSTANTS
    B              = 64
    Lengths        = {1, 32, 48}
    FragBytes      = 16
    BlockFragments = 2
    MaxBlocks      = 1
    MaxNumbers     = 6
    FloorAtUPrime  = TRUE
    PadAtBoundary  = TRUE
    IdleFloorAtP   = TRUE
    Round16        = FALSE

INVARIANTS
    TypeOK
    LiveSpansDisjoint
    SpanInsideRing
    Aligned
    IdleAdmitsAnyMessage

PROPERTIES
    EveryAdmissibleMessagePlaced
    NoRecordWaitsForever
