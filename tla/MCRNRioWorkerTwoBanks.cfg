\* MCRNRioWorker with two banks and four datagrams, no sends: the fill bank
\* fills while main holds the only other bank, so the worker stops
\* dequeuing (backpressure) and waits for main's wake.  Every invariant and
\* the receive and stop liveness properties under SpecFair.
SPECIFICATION SpecFair

CONSTANTS
    Slices          = 2
    NumBanks        = 2
    Cap             = 2
    View            = 4
    MaxDatagrams    = 4
    MaxSends        = 0
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    TypeOK
    SlicesAccounted
    ExclusiveOwnership
    ExposedStable
    ExactDelivery
    FillPhaseOwnedByMain
    NoSendDuplicated
    FreedOnlyWhenDrained

PROPERTIES
    EveryDatagramConsumed
    StopCompletes
