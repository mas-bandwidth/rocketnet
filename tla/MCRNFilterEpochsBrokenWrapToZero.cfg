\* MCRNFilterEpochs reversed witness: the generation after N wraps to 0
\* instead of 1. Must fail WrapSkipsZero: the fifth install hands
\* generation 0, which would turn the keyed deployment unkeyed.
SPECIFICATION Spec

CONSTANTS
    N           = 4
    Live        = 3
    MaxInstalls = 9
    WrapTo      <- WrapToZero

INVARIANTS
    TypeOK
    NeverKeyedAtZero
    WrapSkipsZero
    AtLeastTwoLiveAfterRotation
    DeadEpochRefusedWithoutMac
    OneMacPerLiveEpoch
    LegitimateNeverRefused
    OldKeyRefused
    LiveGenerationsDistinct
