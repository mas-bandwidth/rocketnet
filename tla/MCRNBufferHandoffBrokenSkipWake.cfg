\* MCRNBufferHandoff reversed witness: update reads the owed publish but does not wake the I/O thread, asleep on a held batch. ArrivedDelivered falls. Must fail.
SPECIFICATION SpecFair

CONSTANTS
    N                 = 3
    Cap               = 2
    MaxItems          = 5
    MaxReady          = 1
    Direction         = "receive"
    MainBlocks        = FALSE
    WorkUnderLock     = FALSE
    WriteAfterPublish = FALSE
    SkipWake          = TRUE
    ReleaseBeforeSent = FALSE
    DropFinal         = FALSE

INVARIANTS
    TypeOK
    OneOwner
    FreeIsEmpty
    ViewStable
    InOrder
    NoWorkUnderLock
    MainNeverWaits
    ExitSentAll

PROPERTIES
    ArrivedDelivered
