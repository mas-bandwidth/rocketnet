\* MCFragmentsAndAcksFindStaleAhead2: find-stale-ahead2, finding D1 at StaleAhead 2
\* with a tick of jitter: two payloads lost whole poison the slot. Counts {2},
\* duplication and reordering off, a lossless ack link and Capacity 1 keep it in
\* budget; expected to violate StaleOnlyIfOlder (README-FragmentsAndAcks.md).
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq       = 8
    SentRing     = 4
    AggRing      = 2
    BatchCap     = 1
    Window       = 4
    MaxRanges    = 2
    Slots        = 1
    IdSpace      = 8
    FirstId      = 1
    StaleAhead   = 2
    StaleRule    = "code"
    MaxGen       = 4
    MaxCount     = 3
    Counts       = {2}
    Stride       = 2
    FinalBytes   = 1
    MaxPayload   = 5
    MaxFragment  = 3
    DrainCap     = 4
    DeliveredCap = 2
    DefectIds    = {}
    Burns        = TRUE
    Witness      = "none"
    D2RPattern   = "arbitrary"
    R2DPattern   = "none"
    Capacity     = 1
    MaxDelay     = 1
    Duplication  = FALSE
    Reordering   = FALSE
    BurstStart   = 3
    BurstLen     = 2

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    DeliveredExact
    DeliveredOnce
    CompleteDelivers
    ArenaBounded
    StaleOnlyIfOlder
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked
