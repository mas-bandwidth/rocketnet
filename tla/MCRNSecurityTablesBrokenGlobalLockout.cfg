\* Reversed witness: RefuseUnremembered <- MCRefuseUnremembered (TRUE), the
\* code before 2026-10-20 (`if ( empty_slot == -1 ) return 0;` in
\* rocketnet_signature_verify_budget_allow).  Once the forgers spend the
\* budget and fill the table, the honest client is refused before the verify
\* for the rest of the window: HonestConnectsUnderFlood fails.
SPECIFICATION FloodSpec

CONSTANTS
    None = None
    Addrs = {"A", "B"}
    Tokens = {"th", "te", "tf"}
    Expire <- MCExpire
    Cid <- MCCid
    MaxClock = 4
    CookieLife = 1
    RotatePeriod = 2
    MaxClients = 2
    HistoryCap = 2
    AdmittedCap = 2
    VerifyBudget = 2
    HandshakeDeadline = 4
    Rotation = TRUE
    AcceptPrevious = TRUE
    RefuseAdmittedAtResponse = TRUE
    AdmitExpiredAtResponse = FALSE
    EvictLiveHistory = FALSE
    DeniedConsumesToken = FALSE
    CapVerifyBudget = TRUE
    PreviousOutlivesWindow = FALSE
    BindAtRequest = FALSE
    Holds <- MCHolds
    HoldUntilExpire = FALSE
    CheckCidAtResponse = TRUE
    RefuseUnremembered <- MCRefuseUnremembered

INVARIANTS
    FloodInvariants

PROPERTIES
    HonestConnectsUnderFlood

CHECK_DEADLOCK FALSE
