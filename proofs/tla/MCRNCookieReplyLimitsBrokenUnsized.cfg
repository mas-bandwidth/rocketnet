\* The bitmap is sized from the receive bound without the factor: one full update sets more than 1 in Factor of its bits.
SPECIFICATION MCSpec

CONSTANTS
    Sources      = {1, 2, 3}
    Bound        = 2
    Factor       = 2
    WordBits     = 2
    HashRange    = 8
    VerifyBudget = 1
    Broken       = "unsized"

INVARIANT FalseRefusalBound
