\* MCRNAckApplyPhaseOneBlock: the second committed run: one block a client, so
\* every block after the first of a client is a duplicate, with no ranges or
\* one, so the queue can fill before the range store and the early gather a
\* full queue forces runs here (MCRNAckApplyPhase.cfg never fills the queue).
SPECIFICATION Spec

CONSTANTS
    Clients             = {0, 1}
    Threads             = {main, g1, g2}
    Main                = main
    MinBlock            = 1
    MaxBlock            = 1
    MaxRanges           = 1
    RangeCounts         = {0, 1}
    PendingCap          = 3
    RangesCap           = 2
    ExchangeTake        = TRUE
    CloseAppliesUntaken = TRUE
    CloseClearsClaim    = TRUE
    SettleOnlyReceiving = TRUE
    GatherWhenFull      = TRUE
    AdvanceTail         = TRUE
    DupGivesNothing     = TRUE

INVARIANTS
    TypeOK
    OneTaker
    ClaimOnlyOpen
    ClosedEmpty
    Whole
    Published
    ChainWhole
    SegmentInOrder
    InBounds
