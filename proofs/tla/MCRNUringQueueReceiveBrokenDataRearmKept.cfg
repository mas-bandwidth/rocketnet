\* Reversed witness: a data completion without IORING_CQE_F_MORE banks or
\* counts its datagram but leaves the worker's armed set, while an error or
\* cancel ending still clears it; once the completion queue drains no
\* multishot is live in the kernel while the worker thinks it is armed.
\* Must violate ArmedAgrees.
SPECIFICATION MCSpec

CONSTANTS
    S           = 2
    B           = 2
    SockCap     = 1
    MaxArrive   = 4
    DrainMax    = 2
    FullRule    = "lt"
    PublishRule = "after"
    ReleaseRule = "next"
    FullCount   = "count"
    RearmRule   = "end_only"

INVARIANTS
    TypeOK
    ArmedAgrees
