\* MCRNServerSendFairBrokenDueIgnoresHold: the v1.1.0 due test reads the held head alone:
\* the dark slot is due every flush, its frame takes a unit, the walk writes
\* nothing and the frame is aborted, and a healthy slot ends the flush with
\* work left (OtherClientUnaffected).
SPECIFICATION Spec

CONSTANTS
    N       = 3
    K       = 2
    Conn    = {0, 1, 2}
    WorkMax = 2
    Dark    = {2}
    Short   = {}
    Delay   = 2
    DueRule = "head"
    Budget  = "first"
    Mode    = "rounds"
    Q1      = {}
    K1      = 0
    QueueRule = "perqueue"

INVARIANT
    OtherClientUnaffected
