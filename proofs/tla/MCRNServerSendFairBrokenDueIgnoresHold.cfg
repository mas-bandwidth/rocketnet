\* MCRNServerSendFairBrokenDueIgnoresHold: MCRNServerSendFairDark under the
\* due test of v1.1.0, which reads the held FIFO head alone: the dark client
\* is reported due every update, its frame takes a unit and is aborted empty,
\* and a healthy client ends the update with a frame left: OtherClientUnaffected
\* falls.
SPECIFICATION Spec

CONSTANTS
    N       = 3
    K       = 2
    Work    = 2
    Dark    = {3}
    Short   = {}
    Delay   = 2
    DueRule = "head"
    Mode    = "fair"

INVARIANT
    OtherClientUnaffected
