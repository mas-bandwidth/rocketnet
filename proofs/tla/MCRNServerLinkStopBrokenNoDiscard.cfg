\* MCRNServerLinkStop reversed witness: each copy is judged by its own queue
\* but a copy for a jammed queue is never discarded. Must fail StopFinishes.
SPECIFICATION FairSpec
CONSTANTS
    QueueCount = 2
    BankSize = 2
    Copies = 3
    Defect = "nodiscard"
INVARIANTS
    TypeOK
    CopiesAccounted
PROPERTIES
    StopFinishes
