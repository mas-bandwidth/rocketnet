\* MCRNWindowBrokenLiveness: the reversed liveness witness of
\* EveryReliableAckedAndDelivered. MCRNWindow.cfg under the same fair Spec
\* (AcksLand included) with BlockUPrime = FALSE and no invariants: U' ignores
\* the partial block, the receiver's slot check refuses a number whose slot a
\* held number keeps live, the packet is still acked (P2), and that number is
\* never resent and never delivered. The property falls under Spec, so the
\* delivery assumption in Fairness does not make it a tautology.
\* README-RNWindow.md, "Witness 6".

SPECIFICATION Spec

CONSTANTS
    W              = 2
    MaxNum         = 4
    NumMod         = 4
    BlockFirst     = 1
    BlockLen       = 2
    Ordered        = {0, 1, 2, 4}
    P              = 2
    MaxPerPacket   = 1
    MaxPid         = 3
    BlockUPrime    = FALSE
    KeepP6         = TRUE
    HalfRange      = TRUE
    HoldOrdered    = TRUE
    DropDuplicates = TRUE
    FwdPattern     = "alternate"
    RevPattern     = "alternate"
    Capacity       = 2
    MaxDelay       = 0
    Duplication    = FALSE
    Reordering     = FALSE
    BurstStart     = 1
    BurstLen       = 2

PROPERTIES
    EveryReliableAckedAndDelivered
