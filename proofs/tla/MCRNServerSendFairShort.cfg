\* MCRNServerSendFairShort: a slot whose own send budget may refuse its due reliable
\* packet beside two healthy slots sharing two frames. The refusal is decided
\* before a frame (write first, rn_endpoint_write_may_be_refused), so the
\* refused slot takes no unit and no healthy slot ends a flush with work left
\* for it (m1.8 item 3). FIX-PROBE-SLOT section 3, closed by v1.1.2.
SPECIFICATION Spec

CONSTANTS
    N       = 3
    K       = 2
    Conn    = {0, 1, 2}
    WorkMax = 2
    Dark    = {}
    Short   = {2}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "rounds"
    Q1      = {}
    K1      = 0
    QueueRule = "perqueue"

INVARIANTS
    TypeOK
    FairService
    NoUnitWasted
    OtherClientUnaffected
    DarkTakesOnlyItsProbes
    SameOrder
    OnlyLastWriters
    EndedWritesNothing
    CursorAsFullWalk
    VisitsBounded
