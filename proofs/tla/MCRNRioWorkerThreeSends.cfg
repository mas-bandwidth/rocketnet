\* Healthy boundary for BrokenSwitchBeforeIdle: all the same constants,
\* with SwitchOnIdle TRUE and every existing safety invariant.
SPECIFICATION Spec

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 2
    NumBanks        = 3
    Cap             = 2
    View            = 4
    MaxDatagrams    = 0
    MaxSends        = 3
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    TypeOK
    SlicesAccounted
    ExclusiveOwnership
    ExposedStable
    ExactDelivery
    FillPhaseOwnedByMain
    NoSendDuplicated
    FreedOnlyWhenDrained
    StopSendsHanded
    StopSendsFinished
