\* MCRNRioSendSlotLayout: the fixed counter (64 bits, no wrap in reach) at two
\* slots per phase and the code's three phases, with seven start_packet calls
\* per open of a phase (as many as the int witness needs to wrap) and four
\* hands, so the send_ready FIFO wraps.
SPECIFICATION Spec

CONSTANTS
    Q        = 2
    P        = 3
    Width    = 0
    Tries    = 7
    MaxHands = 4

INVARIANTS
    TypeOK
    NoReissue
    ReadyMatches
    OneFill
