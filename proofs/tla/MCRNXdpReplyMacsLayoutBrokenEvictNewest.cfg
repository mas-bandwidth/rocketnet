\* learn evicting the LIVE entry of a full window learned last instead of
\* the one learned longest ago (EvictOnlyOldest).
SPECIFICATION MCSpec
VIEW View

CONSTANTS
    a1                = a1
    a2                = a2
    a3                = a3
    m1                = m1
    m2                = m2
    NOADDR            = NOADDR
    Addrs             = {a1, a2, a3}
    Macs              = {m1, m2}
    N                 = 4
    P                 = 2
    SkipOtherEntries  = TRUE
    EvictOldest       = FALSE
    InsertWindowExact = TRUE

INVARIANT EvictOnlyOldest
