\* Reversed witness: MCRNSendBudget.cfg with UncapHonoured replaced by FALSE
\* (an uncapped connection that still consults the bucket, spending it and
\* dropping what does not fit). TLC must fail UncappedNeverDropsOrWaits.

SPECIFICATION Spec

CONSTANTS
    W             = 2
    Rate          = 1
    Depth         = 2
    MaxPkt        = 2
    RelSize       = 2
    UnrelSize     = 1
    UPerTick      = 2
    MaxRel        = 2
    MaxLoss       = 1
    CheckBudget   = TRUE
    ReliableFirst = TRUE
    RefundOnFail  = TRUE
    MaxFail       = 1
    UncapHonoured <- BrokenUncap

INVARIANTS
    TypeOK
    FailedSendCostsNothing
    UncappedNeverDropsOrWaits
