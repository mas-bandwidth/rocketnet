\* MCServerStopSpread reversed witness: the stop before the spread, every burst sealed in the stop call whatever the room and the I/O told to stop at once. A burst is left unsent at STOPPED. Must fail FullBurstBeforeStopped.
SPECIFICATION Spec

CONSTANTS
    SlotCount   = 2
    MaxSessions = 4
    Burst       = 2
    BankSize    = 3
    RingSize    = 4
    SteadyCap   = 2
    Defect      = "singleshot"

INVARIANT FullBurstBeforeStopped
