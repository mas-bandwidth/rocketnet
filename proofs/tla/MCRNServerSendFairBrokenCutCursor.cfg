\* MCRNServerSendFairBrokenCutCursor: a capacity cut in a later round leaves
\* the cursor where the last visit set it, not where the walk over every
\* connected slot would hold it (CursorAsFullWalk).
SPECIFICATION Spec

CONSTANTS
    N        = 4
    K        = 3
    Mode     = "cutcursor"
    MaxTicks = 3
    Dark     = {}
    Conn     = {0, 1, 3}
    WorkMax  = 2

INVARIANT
    CursorAsFullWalk
