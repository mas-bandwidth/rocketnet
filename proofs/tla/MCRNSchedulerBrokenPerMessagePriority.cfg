\* Reversed witness: MCRNSchedulerReservedLevels.cfg with ChannelFIFO = FALSE
\* (per-message priority: every queued item is offered at its own level, not
\* only its channel's head at the channel's boosted level). Channel 0's
\* IMMEDIATE item is first-written ahead of the LOW item queued before it.
\* TLC must fail FirstWriteInOrderPerChannel. The levels are reserved in
\* v1.1.x, so this guards the builder's boost for a caller that sets them; on
\* the code's instance (all MEDIUM, CONFIG IMMEDIATE at its channel's head)
\* the precondition cannot occur.

SPECIFICATION Spec

CONSTANTS
    NC             = 2
    Msgs           <- MCMsgsReserved
    ULevel         = 0
    W              = 2
    Cap            = 1
    UPerTick       = 1
    MaxLoss        = 1
    ChannelFIFO    = FALSE
    RtxSendOrder   = TRUE
    UnreliableLast = TRUE
    StallEndsPass  = FALSE

INVARIANTS
    TypeOK
    FirstWriteInOrderPerChannel
    UnreliableNotBlockedByWindow
    ClassOrderBeforePriority
