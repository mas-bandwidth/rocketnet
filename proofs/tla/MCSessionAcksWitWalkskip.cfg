\* MCSessionAcksWitWalkskip: wit-walkskip, a reversed witness. Witness "walkskip" on the
\* bits instance: the walk skips the lowest set unacknowledged bit; expected to
\* violate WalkVisitsUnacked.
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq      = 4
    SentRing    = 2
    BatchCap    = 1
    Window      = 4
    MaxRanges   = 2
    DrainCap    = 4
    Burns       = TRUE
    Witness     = "walkskip"
    D2RPattern  = "arbitrary"
    R2DPattern  = "none"
    Capacity    = 1
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = FALSE
    BurstStart  = 3
    BurstLen    = 2

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked
