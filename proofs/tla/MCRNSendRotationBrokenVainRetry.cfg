\* A vain ordered write leaves the reliable path open: the next plan is due
\* again, so another frame is started and aborted in the same flush
\* (AbortsBounded).
SPECIFICATION MCSpec

CONSTANTS
    N           = 2
    Cap         = 3
    MaxFlush    = 2
    EnvStall    = FALSE
    EnvShortAck = FALSE
    EnvRefuse   = FALSE
    EnvVain     = TRUE
    KeepDone    = TRUE
    StallGate   = TRUE
    FitsGate    = TRUE
    WriteFirst  = TRUE
    CursorNext  = TRUE
    CutCursor   = TRUE
    VainEnds    = FALSE

INVARIANT AbortsBounded
