\* A receive_any scan that began at the hint, not at slot 0, sets
\* min_delivery_time from what it saw: a slot below the hint is missed.
SPECIFICATION MCSpec

CONSTANTS
    Cap            = 3
    W              = 2
    SB             = 1
    NShards        = 2
    ND             = 3
    T              = 1
    GenMod         = 2
    LowerHint      = TRUE
    SummaryOnEmpty = TRUE
    KeepBoundLow   = TRUE
    BumpGeneration = TRUE
    AnyBoundFull   <- AnyBoundFullOff

INVARIANT AnyBoundBelowAll
