\* MCRNAckPhaseBrokenResetNoFlush: reversed witness: a reset in the loop leaves the client's
\* deferred blocks, applied later to the reset endpoint. Must fail.
SPECIFICATION Spec

CONSTANTS
    Clients           = {c1, c2}
    Threads           = {t1, t2}
    NoOwner           = none
    NoClient          = noclient
    ClientOrder       <- MCClientOrder
    MaxArrivals       = 3
    MaxUpdates        = 2
    MaxResets         = 1
    Capacity          = 2
    NoOwnerCheck      = FALSE
    GatherByClient    = FALSE
    SweepBeforeGather = FALSE
    ResetNoFlush      = TRUE
    SpillNoFlush      = FALSE
    CountsBeforeApply = FALSE
    DrainTaken        = FALSE
    TakeTwice         = FALSE
    c1 = c1
    c2 = c2
    t1 = t1
    t2 = t2

INVARIANTS
    TypeOK
    PublicOrder
