\* MCRNClientIoDecrypt reversed witness, liveness: the I/O thread's open also
\* advances replay_session, so update's own replay check then refuses the
\* record the I/O thread opened as already received and the genuine
\* sequence is never accepted while the session lives.  Must fail
\* GenuineEventuallyAccepted.
SPECIFICATION SpecFair

CONSTANTS
    BufferCap        = 2
    MaxDatagrams     = 2
    MaxSeq           = 1
    W                = 1
    MaxReplays       = 0
    MaxForged        = 0
    IntegrityLimit   = 1
    OpenBeforeReplay = FALSE
    SharedWindow     = TRUE
    NoRetire         = FALSE
    CountOnIo        = FALSE
    NoPayloadGate    = FALSE

PROPERTIES
    GenuineEventuallyAccepted
