\* MCRNResendTimingBrokenDueIgnoresHoldPaced: MCRNResendTimingPacedOff with the
\* due test of v1.1.0, blind to the hold: once the block's never-sent chunks
\* are gone, a held chunk past its delay is reported due while U is not, and
\* the call's plan is empty (a frame started and aborted): DueMeansWritten
\* falls for a paced call.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 12
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    Room        <- RoomTwo
    Pending     <- PendingShort
    TimeoutOn   <- TimeoutOff
    DueRule     <- DueRuleOff
INVARIANT
    DueMeansWritten
