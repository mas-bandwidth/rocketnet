\* MCRNSentHistory reversed witness: Send is disabled while every record is
\* unacknowledged (throttling to keep history). Must fail SendNeverRefused.
\* The committed MCRNSentHistory.cfg with one line changed.
SPECIFICATION Spec

CONSTANTS
    N                 = 4
    Threshold         = 2
    MaxSeq            = 7
    MaxLoss           = 2
    Flight            = 2
    AckRange          = 4
    AckSlots          = 2
    CountEveryUnacked = FALSE
    RefuseWhenFull    = TRUE

INVARIANTS
    TypeOK
    EveryEvictionClassified
    LostImpliesLaterAcked
    LargestAckedIsMaximum
    NoOverflowUnderBoundedLoss
    SendNeverRefused
