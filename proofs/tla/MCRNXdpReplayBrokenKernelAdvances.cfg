\* MCRNXdpReplay reversed witness: the kernel writes kmap[a] := seq on
\* every pass. Must fail FreshGenuineNeverDropped: a forged sequence far
\* ahead passes and sets the mark, and the next genuine packet of the live
\* session is dropped. KernelNeverWrites, MarkNeverAhead and
\* MarksTakenFromTheTruth restate the rule this shape removes and are
\* broken by the forged pass itself, one step earlier; they are left out
\* so the run reaches the harm (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1             = A1
    Addresses      = {A1}
    MaxSeq         = 5
    W              = 2
    Sessions       = 2
    MaxInFlight    = 2
    ForgetCapacity = 1
    KernelAdvances <- KernelAdvancesBroken

INVARIANTS
    TypeOK
    FreshGenuineNeverDropped
    NewSessionNeverDroppedByOldMark
