\* MCServerStopSpread liveness with two send queues: the same instance as MCServerStopSpreadQueues.cfg under fairness; every stop finishes, also with one queue jammed while the other keeps its room. Must pass.
SPECIFICATION FairSpec

CONSTANTS
    SlotCount   = 2
    MaxSessions = 3
    Burst       = 2
    BankSize    = 2
    QueueCount  = 2
    RingSize    = 4
    SteadyCap   = 2
    Defect      = "none"

INVARIANTS
    TypeOK
    RingHolds
    FullBurstBeforeStopped
    NoSendCutAtStop
    OnlyJammedQueuesDrop

PROPERTIES
    StopFinishes
    StopFinishesWithoutRoom
