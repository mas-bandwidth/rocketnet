\* MCRNClientSendCursorLayout reversed witness: cursor = send_slot + consumed.
\* That count ignores aborted slots the batch walk skipped, so a live slot
\* is sent again.  Must fail AtMostOnce.
SPECIFICATION Spec

CONSTANTS
    C        = 4
    B        = 2
    MaxTake  = 2
    CursorAt = "plus"

INVARIANTS
    TypeOK
    AtMostOnce
