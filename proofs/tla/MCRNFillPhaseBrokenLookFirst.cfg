\* MCRNFillPhaseBrokenLookFirst: reversed witness: each side looks at the
\* other before it announces; a main operation and a fill call both pass
\* their checks, and Sound falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Fillers      = {f1, f2}
    Clients      = {c1, c2}
    NoOwner      = none
    MaxMain      = 2
    MaxFills     = 2
    LookFirst    = TRUE
    LoadStore    = FALSE
    ResetOnLeave = TRUE
    NoEpochLook  = FALSE
    NoRestore    = FALSE
    ScanOne      = FALSE
    OptedAtStart  = TRUE
    ArmedAtCreate = FALSE
    Lines        = {0, 1}
    LineChoice   <- MCLineChoice
    f1 = f1
    f2 = f2
    f3 = f3

INVARIANTS
    TypeOK
    Sound
