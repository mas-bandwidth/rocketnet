\* MCRNFillPhaseBrokenLookFirst: reversed witness: each side looks at the
\* other before it announces; a main operation and a fill call both pass
\* their checks unflagged, and Sound falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Fillers      = {f1, f2}
    Clients      = {c1}
    NoOwner      = none
    MaxMain      = 2
    MaxFills     = 2
    LookFirst    = TRUE
    LoadStore    = FALSE
    ResetOnLeave = TRUE
    StaleClaim   = FALSE
    NoEpochLook  = FALSE

INVARIANTS
    TypeOK
    Sound
