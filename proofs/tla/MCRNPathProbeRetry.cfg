\* The re-try's liveness at MCRNPathProbe.cfg's instance (three candidates on both lists, path capacity 0 .. 2 up and 0 .. 3 down, one loss burst, one attacker send): every wait ends in a re-try (WaitEnds) and a ruled-out size the path carries is reached (RetryReaches), with every invariant; split from MCRNPathProbe.cfg, which keeps the other properties, on 2026-11-26 when the re-try took the one case past the 110 s case budget (the liveness check's cost grows with each property).
SPECIFICATION FairSpec

CONSTANTS
    ClientSet     = {3, 2, 1}
    ServerList    = {3, 2, 1}
    CapsUp        = {0, 1, 2}
    CapsDown      = {0, 1, 2, 3}
    K             = 2
    MaxBursts     = 1
    AttackBudget  = 1
    AttackKinds   = {"replay", "probe", "reply"}
    Forger        = FALSE
    Timed         = TRUE
    LossBound     = TRUE
    MaxReuses     = 0
    ReuseCapsUp   = {}
    ReuseCapsDown = {}
    Broken        = "none"

INVARIANTS
    TypeOK
    RaisedWithinPath
    ServerNeverAhead
    NoWrongRuleOut
    FailOnlyAtP0
    NeverAtRuledOut
    NeverAboveRuled
    RuledIsTheNextStep
    ReplyOnlyConnected
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate

PROPERTIES
    WaitEnds
    RetryReaches
