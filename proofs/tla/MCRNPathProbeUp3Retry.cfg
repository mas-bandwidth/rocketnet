\* The re-try's liveness at MCRNPathProbeUp3.cfg's instance (capacity 3 up and 0 .. 3 down, three candidates on both lists, one loss burst, one attacker send): WaitEnds and RetryReaches, with every invariant; split from MCRNPathProbeUp3.cfg on 2026-11-26, as MCRNPathProbeRetry.cfg from MCRNPathProbe.cfg.
SPECIFICATION FairSpec

CONSTANTS
    ClientSet     = {3, 2, 1}
    ServerList    = {3, 2, 1}
    CapsUp        = {3}
    CapsDown      = {0, 1, 2, 3}
    K             = 2
    MaxBursts     = 1
    AttackBudget  = 1
    AttackKinds   = {"replay", "probe", "reply"}
    Forger        = FALSE
    Timed         = TRUE
    LossBound     = TRUE
    MaxReuses     = 0
    ReuseCapsUp   = {}
    ReuseCapsDown = {}
    Broken        = "none"

INVARIANTS
    TypeOK
    RaisedWithinPath
    ServerNeverAhead
    NoWrongRuleOut
    FailOnlyAtP0
    NeverAtRuledOut
    NeverAboveRuled
    RuledIsTheNextStep
    ReplyOnlyConnected
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate

PROPERTIES
    WaitEnds
    RetryReaches
