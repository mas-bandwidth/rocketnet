\* MCRNClientSendCursorLayout reversed witness: after the commit the drop arm
\* also drops an unstarted packet of the kept family.  Nothing is sent and
\* nothing is owed for that slot, so AtMostOnce and ExactlyOnce hold and the
\* live slot is lost.  Must fail NoneLost.
SPECIFICATION Spec

CONSTANTS
    C        = 4
    B        = 2
    MaxTake  = 2
    CursorAt = "slots"
    DropKept = TRUE

INVARIANTS
    TypeOK
    AtMostOnce
    ExactlyOnce
    InOrder
    NotAfterRelease
    NoneLost
