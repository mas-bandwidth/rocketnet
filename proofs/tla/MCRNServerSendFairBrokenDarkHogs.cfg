\* MCRNServerSendFairBrokenDarkHogs: MCRNServerSendFairDark where the client
\* that never acknowledges takes the whole cap while its resends are due. The
\* first client starves, so OtherClientUnaffected falls.
SPECIFICATION Spec

CONSTANTS
    N        = 2
    K        = 1
    Mode     = "darkhogs"
    MaxTicks = 8
    Dark     = {2}

INVARIANT
    OtherClientUnaffected
