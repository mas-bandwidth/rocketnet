\* MCRNIocpRefQueue reversed witness for NeverRefused: the sizes of MCRNIocpRefQueueOneConsumer.cfg with a second consumer, which is retry_receives under two completion workers or free_sends under two caller threads. One consumer claims position 0 and stalls before freeing the cell, the other pops position 1, and the push at position 4 reads cell 0's sequence 1 and is refused with the queue not full. NeverRefused falls, which is why the code retries the push. Must fail.
SPECIFICATION Spec

CONSTANTS
    Cap         = 4
    PosMod      = 32
    InitSlack   = 0
    Producers   = {p1, p2}
    Consumers   = {c1, c2}
    MaxTok      = 6
    Ops         = 4
    DropRefused = FALSE

INVARIANT NeverRefused
