\* MCRNRttFilterBrokenNoFilterReceiptOnly: MCRNRttFilterReceiptOnlyPoisons.cfg
\* with no silence filter (Rule "none"). A packet that carried a reliable
\* number and waited out an owed outage is sampled, and the sample raises
\* the estimate to outage size: NumberSamplesNeverPoison must fail.
SPECIFICATION Spec
CONSTANTS
    Probe     = 3
    RttLow    = 0
    RttHigh   = 1
    OutageMax = 4
    M         = 1
    P         = 1
    Rule      = "none"
    FirstAck  = FALSE
    DupSample = FALSE
    ReceiptPkts = TRUE
INVARIANTS
    TypeOK
    NumberSamplesNeverPoison
