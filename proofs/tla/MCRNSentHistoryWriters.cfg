\* MCRNSentHistoryWriters: two concurrent fill-phase writers recording their
\* sequences in any order, so a write can find its slot newer and be refused
\* stale (MCRNSentHistoryReachStale.cfg shows it is reached). Every property.
SPECIFICATION Spec

CONSTANTS
    N                 = 4
    Threshold         = 2
    MaxSeq            = 7
    MaxLoss           = 2
    Flight            = 2
    AckRange          = 4
    AckSlots          = 2
    Writers           = 2
    CountEveryUnacked = FALSE
    RefuseWhenFull    = FALSE
    WriteStale        = FALSE

INVARIANTS
    TypeOK
    EveryEvictionClassified
    LostImpliesLaterAcked
    LargestAckedIsMaximum
    NoOverflowUnderBoundedLoss
    SendNeverRefused
    RingHoldsNewest
    EverySendTransmitted
