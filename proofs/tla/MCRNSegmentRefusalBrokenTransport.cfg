\* Reversed witness: the io_uring transport before the per-destination
\* rule. The first refusal turns segmentation off for every destination,
\* so the accepting destination sends plain. Must violate
\* OtherDestinationUnaffected.
SPECIFICATION Spec

CONSTANTS
    Dests          = {g, b}
    Refusing       = {b}
    KernelSegments = TRUE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "transport"
    Slot           <- SlotDistinct
    Queue          <- QueueOne
    AcceptedRule   = "transport"
    FlagScope      = "queue"

INVARIANTS
    TypeOK
    OtherDestinationUnaffected
