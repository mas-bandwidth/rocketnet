\* MCServerConnectionLossy: the committed run (two clients, one slot, disconnects)
\* with both links "arbitrary": any packet may be dropped, duplicated or reordered.
\* "arbitrary" reaches every state the other loss patterns reach (README-Link.md),
\* so the safety table holds under every loss pattern on this instance.
SPECIFICATION Spec

CONSTANTS
    NumClients          = 2
    NumAddrs            = 2
    NumTokens           = 2
    MaxSlots            = 1
    MapCap              = 1
    HeldCapacity        = 2
    MaxAttempts         = 1
    MaxNonces           = 1
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 0
    HandshakeDeadline   = 0
    Disconnects         = TRUE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "any"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "arbitrary"
    S2CPattern          = "arbitrary"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = TRUE
    Reordering          = TRUE
    BurstStart          = 1
    BurstLen            = 2

INVARIANTS
    SafetyInvariants
    ChurnNeverDenied
    ExpiredTokenNeverMapped

PROPERTIES
    PacketsReachOwnSlotOnly
    SessionNeverAnswered
    StoredChallengeResent
