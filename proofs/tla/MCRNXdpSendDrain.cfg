\* MCRNXdpSendDrain: the design under fairness (the worker keeps passing and copying, the stop keeps polling, a live NIC keeps taking); a draining ring is never given up on and every stop finishes, dead NIC, hard errno or not. Six frames on indices modulo 4, so the producer and consumer both wrap. Must pass.
SPECIFICATION FairSpec

CONSTANTS
    RingSize  = 3
    Modulus   = 4
    BatchMax  = 2
    MaxFrames = 6
    Bound     = 3
    SlowGap   = 2
    Defect    = "none"

INVARIANTS
    TypeOK
    NeverAbandonDraining

PROPERTIES
    StopFinishes
