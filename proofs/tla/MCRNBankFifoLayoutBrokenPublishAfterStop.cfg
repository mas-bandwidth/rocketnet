\* MCRNBankFifoLayoutGsoStop reversed witness: main publishes after the
\* worker took the producer at stop (publish_send without its stopping and
\* producer < 0 tests).  The -1 producer goes onto the ready FIFO and a free
\* bank becomes the producer.  Must fail ExactlyOnePlace.
SPECIFICATION Spec

CONSTANTS
    N         = 3
    ArrLen    = 3
    ConsMax   = 1
    MaxReady  = 3
    MaxPub    = 8
    FreeSlack = 0
    HeadMod   = 3
    TailMod   = 3
    PushKind  = "fifo"
    PopKind   = "fifo"
    InitKind  = "literal"
    StopKind  = "publishafter"

INVARIANTS
    TypeOK
    ExactlyOnePlace
