\* MCRNXdpReceiveRing reversed witness: the worker ignores the swap count
\* (receive_swaps) and keeps its old count of the bank. Once it has seen
\* its bank full it never peeks again, although main swapped the bank for
\* an empty one. Must fail ReceiveNeverStalls.
SPECIFICATION Spec

CONSTANTS
    F1         = F1
    F2         = F2
    F3         = F3
    Frames     = {F1, F2, F3}
    RingSize   = 2
    PeekMax    = 2
    StageCap   = 2
    FillSize   = 6
    Budget     = 1
    MaxPackets = 4
    SpinMax    = 2
    TryArrivals = 1
    Stall      = TRUE
    StaleRoom <- StaleRoomBroken

INVARIANTS
    TypeOK

PROPERTIES
    ReceiveNeverStalls
