\* MCRNClientReceiveQuit reversed witness: the wait's timeout may never fire.
\* Stop makes no wake, so the thread stays in its wait and the join never
\* returns. Must fail DestroyCompletes.
SPECIFICATION SpecFair

CONSTANTS
    Platform    = "mac"
    WaitTimeout = "unreliable"

INVARIANTS
    TypeOK

PROPERTIES
    DestroyCompletes
