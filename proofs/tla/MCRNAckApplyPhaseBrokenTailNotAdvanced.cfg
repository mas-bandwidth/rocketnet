\* MCRNAckApplyPhaseBrokenTailNotAdvanced: reversed witness (layout): a queued
\* block is linked after its client's tail but does not become the tail, so
\* the next one overwrites the link and a block falls off the chain.  Must
\* fail ChainWhole.
SPECIFICATION Spec

CONSTANTS
    Clients             = {0, 1}
    Threads             = {main, g1, g2}
    Main                = main
    MaxBlock            = 2
    MaxRanges           = 1
    PendingCap          = 3
    RangesCap           = 2
    ExchangeTake        = TRUE
    CloseAppliesUntaken = TRUE
    CloseClearsClaim    = TRUE
    SettleOnlyReceiving = TRUE
    GatherWhenFull      = TRUE
    AdvanceTail         = FALSE

INVARIANTS
    TypeOK
    ChainWhole
