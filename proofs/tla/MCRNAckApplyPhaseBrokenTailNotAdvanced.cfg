\* MCRNAckApplyPhaseBrokenTailNotAdvanced: reversed witness (layout): a queued
\* block is linked after its client's tail but does not become the tail.  At
\* a client's second block the tail no longer names the last entry of its
\* chain, which is where ChainWhole fails (its tail conjunct); from that
\* state the client's next block would overwrite the link and the second
\* would fall off the chain.  Must fail ChainWhole.
SPECIFICATION Spec

CONSTANTS
    Clients             = {0, 1}
    Threads             = {main, g1, g2}
    Main                = main
    MinBlock            = 1
    MaxBlock            = 2
    MaxRanges           = 1
    RangeCounts         = {0, 1}
    PendingCap          = 3
    RangesCap           = 2
    ExchangeTake        = TRUE
    CloseAppliesUntaken = TRUE
    CloseClearsClaim    = TRUE
    SettleOnlyReceiving = TRUE
    GatherWhenFull      = TRUE
    AdvanceTail         = FALSE
    DupGivesNothing     = TRUE

INVARIANTS
    TypeOK
    ChainWhole
