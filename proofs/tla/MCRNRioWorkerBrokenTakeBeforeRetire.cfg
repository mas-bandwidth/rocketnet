\* MCRNRioWorker reversed witness: the old pass order, which takes and posts a
\* phase before it retires completions, so a drained phase stays posted.
\* Must fail DrainedReturnedAtPost.
SPECIFICATION Spec

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 2
    Cap             = 2
    View            = 4
    MaxDatagrams    = 0
    MaxSends        = 3
    DrainBatch      = 2
    StopDrainWaits  = 2
    InlineStop      = FALSE
    BoundedStopDrain = TRUE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

    RetireFirst <- RetireFirstBroken

INVARIANTS
    TypeOK
    DrainedReturnedAtPost
