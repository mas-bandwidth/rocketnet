\* The mark pass skips a slot whose record names another address and does
\* not mark the slot's new address (the walk before MarkWhileSkipped): the
\* slot's session is greeted after the commit with no kernel entry for its
\* address, so the kernel drops its session packets as no-session
\* (GreetedSlotHasEntry).
SPECIFICATION MCSpec

CONSTANTS
    s1              = s1
    s2              = s2
    a1              = a1
    a2              = a2
    NONE            = NONE
    Slots           = {s1, s2}
    Addrs           = {a1, a2}
    MaxHigh         = 1
    SkipWhileOwed   = TRUE
    ClearOnAccept   = TRUE
    ForgetRefusable = TRUE
    MarkSupersedes  = TRUE
    ForgetSupersedes = TRUE
    OweOnRefusal    = TRUE
    ScanWhenOwedOnly = TRUE
    MarkWhileSkipped <- MCMarkWhileSkippedBroken

INVARIANT GreetedSlotHasEntry
