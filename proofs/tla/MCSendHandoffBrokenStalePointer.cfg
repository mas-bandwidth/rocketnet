\* MCSendHandoff reversed witness: finish_base is not set when reopen hands a
\* generation back, so a finish through a pointer from before the publish
\* rewrites a packet that is already published.  Must fail
\* PublishedPacketsStable.  The committed MCSendHandoff.cfg with one constant
\* changed.
SPECIFICATION Spec

CONSTANTS
    NumBuffers   = 3
    MaxPackets   = 3
    ReopenNewest = TRUE
    FinishBase   = FALSE

INVARIANTS
    TypeOK
    PublishedPacketsStable
