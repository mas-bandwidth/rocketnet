\* MCRNIocpRefQueue at four cells and the code's sizing: at most four operations live, one producer, two consumers, six operations released, so positions pass a whole round of the cells. A push is refused only while a pop has claimed the cell's last round and not freed it; the refused push keeps its operation and retries, and under the threads' fairness every operation is queued and popped. Must pass.
SPECIFICATION SpecFair

CONSTANTS
    Cap         = 4
    PosMod      = 32
    InitSlack   = 0
    Producers   = {p1}
    Consumers   = {c1, c2}
    MaxTok      = 6
    Ops         = 4
    DropRefused = FALSE

INVARIANTS
    TypeOK
    NoOverwrite
    NoPhantom
    WithinCapacity
    CellsMatchPositions
    InqIsCells
    RefusedNeverLost
    RefusalOnlyWhilePopStalled

PROPERTIES
    EveryOperationPopped
