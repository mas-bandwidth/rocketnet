\* The passing control of the window's numbering test: two connections,
\* three frames a flush, windows that stall and acks that clear a stall
\* without making room for the ready message.
SPECIFICATION MCSpec

CONSTANTS
    N           = 2
    Cap         = 3
    MaxFlush    = 3
    EnvStall    = TRUE
    EnvShortAck = TRUE
    EnvRefuse   = FALSE
    EnvVain     = FALSE
    KeepDone    = TRUE
    StallGate   = TRUE
    FitsGate    = TRUE
    WriteFirst  = TRUE
    CursorNext  = TRUE
    CutCursor   = TRUE
    VainEnds    = TRUE

INVARIANTS
    TypeOK
    NoRefusalAbort
    AbortsBounded
    UnlistedPassEnded
    SkippedWritesNothing
    CursorAsFullWalk
    VisitsBounded
    ServedWhenCapacity
    BoundedWait
