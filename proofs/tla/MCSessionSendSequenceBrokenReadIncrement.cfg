\* Reversed witness: the control send reads the counter, seals, then
\* increments it (the code before 2026-10-29); a fill that starts in between
\* takes the same sequence, and SequencesUnique must fail.
SPECIFICATION MCSpec

CONSTANTS
    MaxSeq = 5
    Fills  = {f1, f2}
    Broken = "readinc"

INVARIANT SequencesUnique
