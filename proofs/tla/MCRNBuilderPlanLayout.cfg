\* MCRNBuilderPlanLayout: four writable items over channels 1 and 2 (low and
\* high digits disagree at Radix 2), two classes, two levels, packets of up
\* to two records; any packet may be written or refused, and the call ends
\* after a refusal as the code's break does.
SPECIFICATION Spec

CONSTANTS
    N            = 4
    Radix        = 2
    Channels     = {1, 2}
    Classes      = 2
    Levels       = 2
    MaxRecords   = 2
    Restore      = TRUE
    PrefixSum    = "exclusive"
    ScatterOrder = "forward"

INVARIANTS
    TypeOK
    NoOverlap
    PlanSorted
    GroupsExact
    ClassRanges
    SuffixMinima
    CursorMatchesTaken
    ChannelOrderKept
