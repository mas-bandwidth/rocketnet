\* MCSessionAcksPatFirst: pat-first. The committed run with both links on the "first"
\* Link pattern.
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq      = 4
    SentRing    = 4
    BatchCap    = 1
    Window      = 4
    MaxRanges   = 2
    DrainCap    = 4
    Burns       = TRUE
    Witness     = "none"
    D2RPattern  = "first"
    R2DPattern  = "first"
    Capacity    = 2
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = TRUE
    BurstStart  = 3
    BurstLen    = 2

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked
