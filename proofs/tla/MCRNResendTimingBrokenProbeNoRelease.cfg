\* MCRNResendTimingBrokenProbeNoRelease: MCRNResendTimingOff with a probe that
\* progress does not release: the hold is timed from U's first send alone, so an
\* acknowledgement of a number other than U leaves the others held. It must fail
\* NoDueRecordHeld.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 12
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    Third       <- ThirdOn
    TimeoutOn   <- TimeoutOff
    ProbeMode   <- ProbeNoRelease
INVARIANT
    NoDueRecordHeld
