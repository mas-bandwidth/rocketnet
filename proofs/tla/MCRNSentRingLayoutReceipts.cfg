\* The passing control of the receipt ring and the serial: every rule on,
\* eight events through a ring of three.
SPECIFICATION MCSpec

CONSTANTS
    Part         = "receipt"
    P            = 3
    R            = 2
    MaxRefs      = 4
    Rq           = 3
    SerialMod    = 4
    MaxWrites    = 6
    MaxEvents    = 8
    EvictAtP     = TRUE
    RefTestExact = TRUE
    ResetEmpty   = TRUE
    ReceiptClamp = TRUE
    SerialSkip   = TRUE

INVARIANTS
    TypeOK
    RingBounded
    ReadExact
    SerialNeverZero
