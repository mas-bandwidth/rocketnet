\* unlink that leaves the sent mark on the slot it removes: an acked number
\* that was its class's first number on the wire stays the mark, and the walk
\* starts at a slot no longer in the sequence (MarkMatch).
SPECIFICATION MCSpec

CONSTANTS
    W                 = 4
    SelfTailFix       = TRUE
    TailOnEnd         = TRUE
    UnlinkClearsClass = TRUE
    InsertSetsClass   = TRUE
    MarkOnUnlink      = FALSE
    MarkOnPushTail    = TRUE
    MarkInitNone      = TRUE
    RefusedTakesMark  = TRUE
    RefusedBeforeMark = TRUE
    ParkContract      = TRUE

INVARIANT MarkMatch
