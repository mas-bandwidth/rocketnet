\* MCRNGsoHandoff reversed witness: the stop count (rocketnet_server_gso_count_stopped) forgets the unread tail of the buffer main holds, so datagrams main claimed and never read go uncounted at stop. RxAccounted falls. Must fail.
SPECIFICATION SpecFair

CONSTANTS
    RxCap            = 2
    TxCap            = 2
    MaxRx            = 5
    MaxTx            = 4
    PublishWhileHeld = FALSE
    MainBlocks       = FALSE
    FullDrops        = FALSE
    CarryBehind      = FALSE
    CountTail        <- CountTailBroken

INVARIANTS
    TypeOK
    RxOneOwner
    TxOneOwner
    TxQueuesDistinct
    NoPublishWhileHeld
    RxBacksOff
    FreeIsEmpty
    SentOrHeld
    RxAccounted
    RxInOrder
    TxInOrder
    MainNeverWaits
    StopJoinsBeforeFree
    ExitSentAll
    FullSocketDropsOnlyAfterShutdown
    RefusalsBounded
