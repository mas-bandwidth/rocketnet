\* MCRNXdpSendDrainBrokenNoRing: reversed witness, the stop drain that looks at the handoff and not at the TX ring; frames still on a live ring are cut off. Must fail NeverAbandonDraining.
SPECIFICATION Spec

CONSTANTS
    RingSize  = 3
    Modulus   = 4
    BatchMax  = 2
    MaxFrames = 6
    Bound     = 3
    SlowGap   = 2
    Defect    = "noring"

INVARIANTS
    TypeOK
    NeverAbandonDraining
