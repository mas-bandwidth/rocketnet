\* A free that does not push the chunk on the free stack: a free chunk the find never returns, so the store refuses with it free.
SPECIFICATION MCSpec

CONSTANTS
    N             = 3
    Q             = 4
    GenMod        = 3
    FreshGuard    = TRUE
    PushOnFree    = FALSE
    ScanFind      = FALSE
    ChunkSkipZero = TRUE
    DescSkipZero  = TRUE
    KeepFreeSlot  = TRUE
    CountQueueFull = TRUE
    StartOrder    = "fit"
    CountMod      = 1
    RefuseExhausts = FALSE

INVARIANT RefuseOnlyWhenNoneFree
