\* An expired token is discarded before cookie validation and private-data decryption.
\* MCServerConnection: the committed run. Two clients contend for one slot
\* and reuse it after a disconnect or a timeout from either side.
\* README-ServerConnection.md lists the other runs as edits to this file.
SPECIFICATION Spec

CONSTANTS
    NumClients          = 1
    NumAddrs            = 1
    NumTokens           = 1
    MaxSlots            = 1
    MapCap              = 2
    HeldCapacity        = 2
    MaxAttempts         = 1
    MaxNonces           = 2
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 2
    HandshakeDeadline   = 2
    Disconnects         = TRUE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "own"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {1}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 2
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2

INVARIANTS
    ExpiredTokenNeverMapped

CHECK_DEADLOCK FALSE
