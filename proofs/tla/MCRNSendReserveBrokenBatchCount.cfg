    Fillers   = {f1, f2}
    Reserve   = 2
    MaxFree   = 4
    MaxOwn    = 0
    MaxClaims = 2
    MaxRetire = 1
    MaxPhases = 2
    Chunk     = 2
    GuardWidth = 0
    SharedLine = FALSE
    RoomOnly      = FALSE
    SplitClaim    = FALSE
    RoomFirst     = FALSE
    OwnCountFirst = FALSE
    NoRefresh     = FALSE
    NoReread      = FALSE
    IndexTest     = FALSE
    NoFallback    = FALSE
    BatchCount    = TRUE
    NoTailReturn  = FALSE
    NoRetry       = FALSE
    NameAll       = FALSE

INVARIANTS
    NeverStarved
