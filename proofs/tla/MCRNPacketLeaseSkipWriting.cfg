\* MCRNPacketLease: the code's resolve continues its probe past an entry in phase 1
\* instead of waiting.  Every invariant holds and resolve and insert complete
\* with only thread 1 scheduled.
SPECIFICATION SpecSolo

CONSTANTS
    Capacity          = 4
    Threads           = {1, 2}
    Frames            = {1, 2}
    Vals              = {1}
    HashSpread        = 1
    MaxOps1           = 2
    MaxOps2           = 1
    MaxResets         = 1
    EpochLimit        = 2
    UsedLimit         = 2
    UseCas            = TRUE
    ConsumeCas        = TRUE
    BumpEpoch         = TRUE
    EpochLimited      = TRUE
    RetiredOn         = FALSE
    RetiredValidates  = FALSE
    OnWriting         = {"skip"}
    ValidCallers      = FALSE

INVARIANTS
    TypeOK
    NoWrongSuccess
    TakeOnce
    NoRacyRead
    InsertFindsSlot
    PublishedIntact
    ChainIntact
    ProbeBound

PROPERTIES
    ResolveCompletes
    InsertCompletes
