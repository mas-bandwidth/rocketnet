\* MCRNPacketLease: the code's insert with only thread 1 scheduled.  Insert
\* waits on no other thread (its loop is bounded by the table), so it
\* completes whatever thread 2 does.
SPECIFICATION SpecSolo

CONSTANTS
    Capacity          = 4
    Threads           = {1, 2}
    Frames            = {1, 2}
    Vals              = {1}
    HashSpread        = 1
    MaxOps1           = 2
    MaxOps2           = 1
    MaxResets         = 1
    EpochLimit        = 2
    UsedLimit         = 2
    UseCas            = TRUE
    ConsumeCas        = TRUE
    BumpEpoch         = TRUE
    EpochLimited      = TRUE
    RetiredOn         = FALSE
    RetiredValidates  = FALSE
    OnWriting         = {"skip"}
    ValidCallers      = FALSE

INVARIANTS
    TypeOK

PROPERTIES
    InsertCompletes
