\* Reversed witness of the trace check: the record's drain stores head as
\* the end of what it takes, as code that hands main slots the worker may
\* still write would log.  Must violate TraceConsistent, at record 6.
SPECIFICATION TraceSpec

CONSTANTS
    S           = 3
    B           = 4
    TailWrap    = 8
    MaxArrive   = 5
    MaxSegs     = 2
    DrainMax    = 2
    RoomRule    = "refresh"
    SlotRule    = "mod"
    ReleaseRule = "next"
    CounterWrap = 0
    TraceLog    <- BadLog

INVARIANTS
    TraceConsistent
