\* MCRNXdpReplay reversed witness: a reply with no frame in hand takes any
\* address's answered MAC. Must fail NeverSeenNeverSentTo: a reply held for
\* an address no frame came from leaves to another address's MAC
\* (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1              = A1
    A2              = A2
    Addresses       = {A1, A2}
    MaxSeq          = 2
    W               = 2
    Sessions        = 2
    MaxInFlight     = 1
    ForgetCapacity  = 1
    HeldReplyBudget <- HeldReplyBudgetTwo
    AnswerKeyedByAddress <- AnswerKeyedByAddressBroken

INVARIANTS
    TypeOK
    NeverSeenNeverSentTo
