\* Reversed witness: a data completion without IORING_CQE_F_MORE leaves
\* armed set after banking the buffer, so once posted completions drain the
\* worker believes the multishot is still live while the kernel has ended it.
\* Must violate ArmedAgrees.
SPECIFICATION MCSpec

CONSTANTS
    S             = 3
    B             = 2
    TailWrap      = 4
    MaxArrive     = 4
    MaxSegs       = 2
    DrainMax      = 2
    RoomRule      = "refresh"
    SlotRule      = "mod"
    ReleaseRule   = "next"
    CounterWrap   = 0
    DataRearmRule <- MCDataRearmKeep

INVARIANTS
    TypeOK
    ArmedAgrees
