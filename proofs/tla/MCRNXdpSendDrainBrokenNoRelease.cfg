\* MCRNXdpSendDrainBrokenNoRelease: reversed witness, the stop drain deaf to a stalled ring; a NIC that stops taking descriptors keeps the stop from finishing. Must fail StopFinishes.
SPECIFICATION FairSpec

CONSTANTS
    RingSize  = 3
    Modulus   = 4
    BatchMax  = 2
    MaxFrames = 6
    Bound     = 3
    SlowGap   = 2
    Defect    = "norelease"

INVARIANTS
    TypeOK
    NeverAbandonDraining

PROPERTIES
    StopFinishes
