\* MCRNRttFilterBrokenFirstAck: MCRNRttFilterFirstAck.cfg under v1.1.1's test, which
\* ends no silence before the first ack (has_last_ack): the first ack after
\* an owed outage is sampled (NoSampleAcrossSilence).
SPECIFICATION Spec
CONSTANTS
    Probe     = 3
    RttLow    = 0
    RttHigh   = 1
    OutageMax = 4
    M         = 2
    P         = 2
    Rule      = "owedlast"
    FirstAck  = TRUE
    DupSample = FALSE
    ReceiptPkts = FALSE
INVARIANT
    NoSampleAcrossSilence
