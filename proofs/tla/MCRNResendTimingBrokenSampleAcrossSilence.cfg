\* MCRNResendTimingBrokenSampleAcrossSilence: MCRNResendTimingFilter sampling
\* every ack, the code before the filter. It must fail NoSampleAcrossSilence.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 10
    MaxBackoff  = 1
    MinAttempts = 4
    TimeoutOn   <- TimeoutOff
    Filter      <- FilterOn
    FilterRule  <- FilterRuleOff
INVARIANT
    NoSampleAcrossSilence
