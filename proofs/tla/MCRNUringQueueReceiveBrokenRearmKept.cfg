\* Reversed witness: a completion without IORING_CQE_F_MORE leaves the
\* worker's armed set, so the queue never needs an arm and the ended
\* multishot is never armed again.  Must violate Rearms.
SPECIFICATION MCLiveSpec

CONSTANTS
    S           = 2
    B           = 2
    SockCap     = 1
    MaxArrive   = 4
    DrainMax    = 2
    FullRule    = "lt"
    PublishRule = "after"
    ReleaseRule = "next"
    FullCount   = "count"
    RearmRule   = "keep"

PROPERTIES
    Rearms
