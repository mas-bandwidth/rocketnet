\* Reversed witness (MA018): a stale code-4 block (its epoch closed, or in
\* turn behind the watermark) is dropped with no SEQUENCED_STALE count.
\* Must violate SequencedArrivedAccounted.
SPECIFICATION SafetySpec
CONSTANTS
    Scenario = "blocks"
    Broken = "StaleBlockSilent"
    SendCapacity = 4
    OrderedCapacity = 2
    HoldCapacity = 2
    TransportCaps = {1}
INVARIANTS
    TypeOK
    SequencedArrivedAccounted
CHECK_DEADLOCK FALSE
