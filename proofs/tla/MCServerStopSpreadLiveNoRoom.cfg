\* MCServerStopSpread liveness, its second property: the same instance under fairness; a stop finishes also when the transport loses its room for good. Must pass. Split from MCServerStopSpreadLive.cfg so each run stays within the record budget.
SPECIFICATION FairSpec

CONSTANTS
    SlotCount   = 2
    MaxSessions = 4
    Burst       = 2
    BankSize    = 3
    QueueCount  = 1
    RingSize    = 4
    SteadyCap   = 2
    Defect      = "none"

INVARIANTS
    TypeOK
    RingHolds
    FullBurstBeforeStopped
    NoSendCutAtStop

PROPERTIES
    StopFinishesWithoutRoom
