\* MCRNClientDelivery reversed witness: the protocol counts a payload before
\* the transport looks for its slot, and the update's packet budget is one
\* more than the batch. The fourth payload is counted and never placed.
\* Must fail CountedImpliesHanded.
SPECIFICATION Spec
CONSTANTS
    Cap = 3
    Budget = 4
    MaxIds = 4
    CallerDrains = TRUE
    Defect = "countbeforeplace"
INVARIANTS
    TypeOK
    CountedImpliesHanded
