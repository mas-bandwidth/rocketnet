\* MCRNFillPhaseBrokenScanOne: reversed witness: main_begin looks at one
\* fills_in line, as if one counter served every thread; a filler counted
\* on the other line passes beside the main operation, and Sound falls.
\* Must fail.
SPECIFICATION Spec

CONSTANTS
    Fillers      = {f1, f2}
    Clients      = {c1, c2}
    NoOwner      = none
    MaxMain      = 2
    MaxFills     = 2
    MaxTakes     = 0
    LookFirst    = FALSE
    LoadStore    = FALSE
    ResetOnLeave = TRUE
    NoEpochLook  = FALSE
    NoRestore    = FALSE
    ScanOne      = TRUE
    NoWindow     = FALSE
    NoMainWindow = FALSE
    TakeUncounted = FALSE
    OptedAtStart  = TRUE
    ArmedAtCreate = FALSE
    OwnerAtDecide = FALSE
    KickAll       = FALSE
    FreshKept     = FALSE
    ShutOnEarly   = FALSE
    ScanFirst     = FALSE
    DepthMax      = 2
    Lines        = {0, 1}
    LineChoice   <- MCLineChoice
    f1 = f1
    f2 = f2
    f3 = f3

VIEW View

INVARIANTS
    TypeOK
    Sound
