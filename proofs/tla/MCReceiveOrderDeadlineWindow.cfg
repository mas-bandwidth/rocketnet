\* Reversed witness for the deadline window: the committed constants, with
\* the strict OneLiveMappingPerToken.  A's claim on a token expires as the
\* clock reaches the handshake deadline while A's mapping waits for the
\* update's sweep; B's request for the same token in that receive batch
\* passes the claim rung, claims the token and is accepted, so two
\* addresses map the token and OneLiveMappingPerToken must fail with TLC's
\* counterexample.  OneUnexpiredMappingPerToken still holds.
SPECIFICATION MCSpec

CONSTANTS
    PosRestart   = 1
    PosVersion   = 2
    PosTimestamps = 3
    PosCompares  = 4
    PosCookie    = 5
    PosUsed      = 6
    PosAdmitted  = 7
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 10
    PosKeypair   = 11

INVARIANTS
    TypeOK
    OneUnexpiredMappingPerToken
    OneLiveMappingPerToken
