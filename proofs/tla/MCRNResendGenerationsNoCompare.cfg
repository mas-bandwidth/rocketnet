\* The ack without the generation comparison (unlink_named's descriptor test
\* and the generation-0 branch): every invariant still holds, because a
\* linked entry's stamp is always its live descriptor's generation
\* (StampNamesOwner) and the number comparison carries the stale case.
SPECIFICATION MCSpec

CONSTANTS
    W                 = 4
    N                 = 6
    D                 = 2
    GenMax            = 6
    CheckNumber       = TRUE
    Restamp           = TRUE
    CompareGeneration = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NamedGenerationOnly
    AckedOnlyDelivered
    StampNamesOwner
