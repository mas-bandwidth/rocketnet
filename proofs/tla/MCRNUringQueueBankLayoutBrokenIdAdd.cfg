\* Reversed witness: the packet id is gid + q in place of gid * Q + q, so
\* finish takes the id's remainder by Q for a queue start did not choose.
\* Must violate RouteMatches.
SPECIFICATION MCSpec

CONSTANTS
    Q           = 2
    NB          = 2
    S           = 3
    Stride      = 2
    Threads     = {1, 2}
    Dests       = {1, 2, 3}
    QueueOf     <- MCQueueOf
    Demand      = 4
    MaxFlush    = 2
    Skew        = {-1, 0, 1}
    ClaimCmp    = "ge"
    CounterWrap = 0
    SlotRule    = "check"
    IdRule      = "add"

INVARIANTS
    TypeOK
    RouteMatches
