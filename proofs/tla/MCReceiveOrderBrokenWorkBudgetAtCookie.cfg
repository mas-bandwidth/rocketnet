\* Reversed witness: WorkBudgetAtVerify <- MCWorkBudgetAtCookie (FALSE), the
\* request path before 2026-10-31: the handshake work budget is charged just
\* after the cookie gate, so a request the used, failed-signature-budget,
\* claim or capacity rungs then refuse has spent budget without reaching the
\* signature.  WorkBudgetOnlyForVerify must fail with TLC's counterexample;
\* CheapRefusalsFirst still holds.
SPECIFICATION MCSpec

CONSTANTS
    PosRestart   = 1
    PosVersion   = 2
    PosTimestamps = 3
    PosCompares  = 4
    PosCookie    = 5
    PosUsed      = 6
    PosAdmitted  = 7
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 10
    PosKeypair   = 11
    WorkBudgetAtVerify <- MCWorkBudgetAtCookie

INVARIANTS
    TypeOK
    CheapRefusalsFirst
    WorkBudgetOnlyForVerify
