\* A send capacity of two under the mixed plan: the third send is refused and
\* the connection goes on (standard/MESSAGES.md m1.7). Safety only: the
\* refused sends are never offered again, so the plan does not finish. The
\* transport hands a start a cap of 1 or 2, so a refused unreliable start
\* can move max_payload_bytes.
SPECIFICATION Spec
CONSTANTS
    Scenario = "mixed"
    Broken = "None"
    SendCapacity = 2
    OrderedCapacity = 2
    HoldCapacity = 2
    TransportCaps = {1, 2}
INVARIANTS
    StepPossibleIsEnabled
    TypeOK
    BuffersBounded
    SequencedNeverBackwards
    NoSequencedDuplicate
    ReliableExactlyOnce
    OrderedExactlyOnceInOrder
    OrderedTraceUnchangedBySequenced
    SequencedNewestWins
    EpochWatermark
    TransportAckClearsResend
    AckedImpliesTransportArrival
PROPERTIES
    SendNeverEnds
    RefusalLeavesStateUnchanged
CHECK_DEADLOCK FALSE
