\* MCServerStopSpread liveness with the development link simulator: the instance of MCServerStopSpreadSimulator.cfg under fairness; a stop with no queue jammed finishes (the held copies drain while every queue has room), or a queue jams first. Must pass.
SPECIFICATION FairSpec

CONSTANTS
    SlotCount   = 2
    MaxSessions = 2
    Burst       = 2
    BankSize    = 2
    QueueCount  = 2
    RingSize    = 4
    SteadyCap   = 2
    Simulator   = TRUE
    Defect      = "none"

INVARIANTS
    TypeOK
    NoCopyHeldAtStop

PROPERTIES
    StopFinishesWhileUnjammed
