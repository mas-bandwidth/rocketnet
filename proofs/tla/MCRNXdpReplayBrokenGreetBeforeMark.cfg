\* MCRNXdpReplay reversed witness: the commit greets a new session whose
\* zero mark the kernel refused, the rule before the greeting was held.
\* Must fail NewSessionNeverDroppedByOldMark: the old session's entry still
\* stands when the greeted client sends its sequence 1. MarkNeverAhead
\* restates the hold and is left out so the run reaches the harm
\* (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1                = A1
    Addresses         = {A1}
    MaxSeq            = 3
    W                 = 2
    Sessions          = 2
    MaxInFlight       = 1
    ForgetCapacity    = 1
    MarkFailureBudget <- MarkFailureBudgetOne
    HoldGreetingUntilMarked <- HoldGreetingUntilMarkedBroken

INVARIANTS
    TypeOK
    ForgetOwedUntilApplied
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    NewSessionNeverDroppedByOldMark

PROPERTIES
    KernelNeverWrites
