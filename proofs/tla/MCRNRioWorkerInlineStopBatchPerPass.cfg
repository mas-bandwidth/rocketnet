\* MCRNRioWorker: create's failure path when the cancelled receives reach
\* the drain a batch a pass (DrainLoop FALSE stands for completions that
\* are not all in the queue at once).  Five posted slices, one datagram,
\* batches of two and one wait, so more passes make progress than the
\* bound allows.  A pass that dequeued a completion is not counted
\* (CountStalledOnly), so only stalled passes count: it leaks only after
\* StopDrainWaits + 1 passes that dequeued nothing (a refused closesocket,
\* or cancellations not yet arrived), and stop completes.  The
\* constants of MCRNRioWorkerBrokenOneBatchPerPass.cfg with
\* CountStalledOnly TRUE.  Must pass.
SPECIFICATION SpecFair

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 5
    Cap             = 2
    View            = 2
    MaxDatagrams    = 1
    MaxSends        = 0
    DrainBatch      = 2
    StopDrainWaits  = 1
    InlineStop      = TRUE
    BoundedStopDrain = TRUE
    DrainLoop       = FALSE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    TypeOK
    SlicesAccounted
    FreedOnlyWhenDrained
    StopSendsFinished
    LeakOnlyAfterStalls

PROPERTIES
    StopCompletes
