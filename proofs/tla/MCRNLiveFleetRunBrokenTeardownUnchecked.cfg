\* MCRNLiveFleetRun reversed witness: teardown discards the exit status of
\* "stop server" and "restore" and reports the run complete
\* (scripts/live-xdp-fleet before MM206). Must fail TeardownDetaches: a
\* failed step leaves the run done with the server up or XDP attached.
SPECIFICATION Spec

CONSTANTS
    C1            = C1
    C2            = C2
    S1            = S1
    Clients       = {C1, C2}
    TestServer    = S1
    Cycles        = 2
    T             = 1
    WatchdogBound = 2
    DeadmanBound  = 5
    MaxClients    = 2
    MaxFaults     = 1
    TeardownChecksStatus <- TeardownChecksStatusBroken

INVARIANTS
    TypeOK
    XdpNeverOrphaned
    TeardownDetaches
    WatchdogKillsOnlyOnFault
    XdpOnlyUnderDeadman
    NoClientBeforeListen
    NoBenchServer
    ReconnectAfterTwoTimeouts
    ReconnectIntoFreedSlot
    NeverDenied
