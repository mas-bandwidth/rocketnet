\* A control for the abort's action property (AbortReturnsRoom reads Place
\* for every length the last Alloc admitted, so it runs on the smaller
\* instance of MCRNSendSpansRefuse.cfg): two lengths, three descriptors, and
\* the newest span freed right after its Alloc gives its bytes back.
SPECIFICATION Spec

CONSTANTS
    SR            = 96
    Lengths       = {32, 96}
    Q             = 3
    FloorAtOldest = TRUE
    PadOnWrap     = TRUE
    SpliceBoth    = TRUE
    RefuseExhausts = FALSE
    UndoTail      = TRUE

INVARIANTS
    TypeOK
    LiveSpansDisjoint
    LiveBetweenHeadAndTail

PROPERTIES
    AbortReturnsRoom
