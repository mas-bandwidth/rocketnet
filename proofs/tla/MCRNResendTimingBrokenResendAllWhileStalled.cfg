\* MCRNResendTimingBrokenResendAllWhileStalled: MCRNResendTimingOff with no probe
\* hold, every due number resent while the path acknowledges nothing (the code
\* before probe pacing). It must fail ProbeOnlyU.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 12
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    Third       <- ThirdOn
    TimeoutOn   <- TimeoutOff
    ProbeMode   <- ProbeOff
PROPERTY
    ProbeOnlyU
