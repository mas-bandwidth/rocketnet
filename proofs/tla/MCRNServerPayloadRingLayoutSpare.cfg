\* The passing control on two lines: three threads, two sharing one line and one alone on the other, the guard for two lines, a capacity of four with the ring one slot larger: every rule on, every invariant.
SPECIFICATION MCSpec

CONSTANTS
    Threads       = {t1, t2, t3}
    LineOf        <- MCTwoLines
    Cap           = 4
    RingSize      = 5
    Stride        = 2
    WrongStride   = 1
    Chunk         = 2
    GuardLines    = 2
    MaxCount      = 5
    Clamp         = TRUE
    FullTest      = TRUE
    RecoverStride = TRUE
    ReturnClear   = TRUE
    LostClear     = TRUE

INVARIANTS
    TypeOK
    InBounds
    ExactSend
    HeldExclusive
    ChunksBelowCap
