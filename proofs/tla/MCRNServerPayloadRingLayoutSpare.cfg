\* The passing control at three threads and a capacity of three, the ring one slot larger than the capacity: every rule on, every invariant.
SPECIFICATION MCSpec

CONSTANTS
    Threads       = {t1, t2, t3}
    Cap           = 3
    RingSize      = 4
    Stride        = 2
    WrongStride   = 1
    MaxCount      = 5
    Clamp         = TRUE
    FullTest      = TRUE
    RecoverStride = TRUE

INVARIANTS
    TypeOK
    InBounds
    ExactSend
    HeldExclusive
