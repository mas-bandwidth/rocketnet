\* MCRNPacketLease: the code's rule with retired validated after the read
\* (RetiredValidates).  retired succeeds only for an unconsumed lease of an
\* earlier epoch and never reads an entry that is being rewritten.
SPECIFICATION Spec

CONSTANTS
    Capacity          = 4
    Threads           = {1, 2}
    Frames            = {1, 2}
    Vals              = {1, 2}
    HashSpread        = 1
    MaxOps1           = 2
    MaxOps2           = 1
    MaxResets         = 2
    EpochLimit        = 2
    UsedLimit         = 2
    UseCas            = TRUE
    ConsumeCas        = TRUE
    BumpEpoch         = TRUE
    EpochLimited      = TRUE
    RetiredOn         = TRUE
    RetiredValidates  = TRUE
    OnWriting         = {"skip"}
    ValidCallers      = FALSE

INVARIANTS
    TypeOK
    NoWrongSuccess
    TakeOnce
    NoRacyRead
    InsertFindsSlot
    PublishedIntact
    ChainIntact
    ProbeBound
