\* MCRNPacketLease: the code's rule with retired: the entry's fields are
\* atomic (AtomicFields) and the state is reread after the read
\* (RetiredValidates).  retired succeeds only for an unconsumed lease of an
\* earlier epoch, and its read of an entry an insert rewrites is no data
\* race.
SPECIFICATION Spec

CONSTANTS
    Capacity          = 4
    Threads           = {1, 2}
    Frames            = {1, 2}
    Vals              = {1, 2}
    HashSpread        = 1
    MaxOps1           = 2
    MaxOps2           = 1
    MaxResets         = 2
    EpochLimit        = 2
    UsedLimit         = 2
    UseCas            = TRUE
    ConsumeCas        = TRUE
    BumpEpoch         = TRUE
    EpochLimited      = TRUE
    RetiredOn         = TRUE
    RetiredValidates  = TRUE
    OnWriting         = {"skip"}
    ValidCallers      = FALSE
    AtomicFields      = TRUE

INVARIANTS
    TypeOK
    NoWrongSuccess
    TakeOnce
    NoRacyRead
    InsertFindsSlot
    PublishedIntact
    ChainIntact
    ProbeBound
