\* MCRNResendTiming: the committed run, the code's rule at the defaults (one tick
\* is 500 ms): message_resend_delay_initial and _max 2000 ms (4), the minimum
\* rounded up to one tick, reliable_message_timeout 10 s (20). A small record
\* waits the resend delay alone, a chunk of a block waits it capped at
\* reliable_timeout / 4 (5), one resend FIFO per class, no back-off.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 20
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
INVARIANTS
    TypeOK
    ConfigAccepted
    AttemptsBeforeTimeout
    ResendGapBounded
    NoDueRecordHeld
