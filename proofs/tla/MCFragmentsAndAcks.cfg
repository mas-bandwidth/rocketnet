\* MCFragmentsAndAcks: the committed run, the gate instance. The honest sender
\* under the code's rules (Witness "none", StaleRule "code") under SpecSafety:
\* the thirteen invariants and CountPinned, no fairness. It is the full instance
\* (README-FragmentsAndAcks.md) with five cuts so the pass fits the 110 s budget:
\* both links "none" (no loss), duplication off, MaxCount 2 with counts {2}, and
\* burns off. Reordering stays on with Capacity 2, so a later payload's fragment
\* can overtake an earlier one and reassembly refuses the earlier one as stale:
\* NamedOnlyIfAccepted is reachable here, and MCFragmentsAndAcksWitAckRefused.cfg
\* is this instance with Witness "ackrefused", which violates it.
\* MCFragmentsAndAcksLive.cfg is the full instance under Spec with the liveness
\* property; README-FragmentsAndAcks.md gives the other runs as edits to the
\* full instance.
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq       = 4
    SentRing     = 4
    AggRing      = 2
    BatchCap     = 1
    Window       = 4
    MaxRanges    = 2
    Slots        = 1
    IdSpace      = 8
    FirstId      = 1
    StaleAhead   = 2
    StaleRule    = "code"
    MaxGen       = 2
    MaxCount     = 2
    Counts       = {2}
    Stride       = 2
    FinalBytes   = 1
    MaxPayload   = 5
    MaxFragment  = 3
    DrainCap     = 4
    DeliveredCap = 2
    DefectIds    = {}
    Burns        = FALSE
    Witness      = "none"
    D2RPattern   = "none"
    R2DPattern   = "none"
    Capacity     = 2
    MaxDelay     = 0
    Duplication  = FALSE
    Reordering   = TRUE
    BurstStart   = 3
    BurstLen     = 2

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    DeliveredExact
    DeliveredOnce
    CompleteDelivers
    ArenaBounded
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked
    NamedOnlyIfAccepted

PROPERTIES
    CountPinned
