\* The cookie race resolves: every mapping whose handshake deadline falls
\* inside the clock's range is admitted or swept (CookieRaceResolves), under
\* Spec's weak fairness on Tick. A smaller instance than the code's run
\* (two tokens, MaxClock 3, deadline 2) so the liveness check stays inside
\* the case limit; the switches are the code's.
SPECIFICATION Spec

CONSTANTS
    None = None
    Addrs = {"A", "B"}
    Tokens = {"th", "tf"}
    Expire <- MCExpire
    Cid <- MCCid
    MaxClock = 3
    CookieLife = 1
    RotatePeriod = 2
    MaxClients = 2
    HistoryCap = 2
    AdmittedCap = 2
    VerifyBudget = 2
    HandshakeDeadline = 2
    Rotation = TRUE
    AcceptPrevious = TRUE
    RefuseAdmittedAtResponse = TRUE
    RequestChecksExpiry = TRUE
    EvictLiveHistory = TRUE
    DeniedConsumesToken = FALSE
    CapVerifyBudget = TRUE
    PreviousOutlivesWindow = FALSE
    BindAtRequest = FALSE
    Holds <- MCHolds
    HoldUntilExpire = FALSE
    CheckCidAtResponse = TRUE

INVARIANTS
    SafetyInvariants

PROPERTIES
    CookieRaceResolves

CHECK_DEADLOCK FALSE
