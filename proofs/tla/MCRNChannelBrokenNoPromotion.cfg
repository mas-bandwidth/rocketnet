\* Reversed witness for PromotedNeverUnreliable: the start's route leaves an
\* unreliable send larger than one record at its unreliable source code
\* (Broken = "NoPromotion": rn_endpoint_send_route without the promotion
\* branch). Must violate PromotedNeverUnreliable.
SPECIFICATION SafetySpec
CONSTANTS
    Scenario = "promote"
    Broken = "NoPromotion"
    SendCapacity = 4
    OrderedCapacity = 2
    HoldCapacity = 2
    TransportCaps = {1}
INVARIANTS
    TypeOK
    PromotedNeverUnreliable
CHECK_DEADLOCK FALSE
