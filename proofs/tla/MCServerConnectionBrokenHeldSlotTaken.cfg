\* Reversed witness: ResponseTakesHeldSlot <- MCResponseTakesHeld, a
\* response that takes a slot freed since the last update before
\* rocketnet_client_slots_publish makes it assignable. The committed run
\* with a two-entry map: both clients hold half-open mappings, client 1's
\* response takes the slot, the server disconnects client 1 (the slot is
\* held), and client 2's response, already on the wire, takes the held slot
\* in the same update. HeldSlotNotReused must fail with TLC's
\* counterexample; with the code's assign the response is ignored instead.
SPECIFICATION Spec

CONSTANTS
    NumClients          = 2
    NumAddrs            = 2
    NumTokens           = 2
    MaxSlots            = 1
    MapCap              = 2
    HeldCapacity        = 2
    MaxAttempts         = 1
    MaxNonces           = 2
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 0
    HandshakeDeadline   = 0
    Disconnects         = TRUE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "own"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2
    ResponseTakesHeldSlot <- MCResponseTakesHeld

INVARIANTS
    TypeOK
    HeldSlotNotReused
