\* MCLinkReconfigureBrokenInFlight.cfg: the reversed witness for
\* NoInFlightDrop. A change to "lose" also clears the wire, so packets sent
\* before the change are dropped by it.
SPECIFICATION Spec

CONSTANTS
    Packets     = {a, b}
    Capacity    = 2
    MaxDelay    = 1
    Duplication = FALSE
    Reordering  = FALSE
    Pattern     = "none"
    BurstStart  = 1
    BurstLen    = 2
    MaxSends    = 3
    Defect      = "inflight"

INVARIANTS
    RCTypeOK
    NoInFlightDrop
