\* MCRNXdpReceiveRing reversed witness: the worker lets go of the mutex for
\* main but takes it again without waiting for main to clear its flag, so
\* main's next try finds it held once more. Both threads keep running
\* (Stall FALSE). Must fail ClaimWithinSpin.
SPECIFICATION SpecWeak

CONSTANTS
    F1         = F1
    F2         = F2
    F3         = F3
    Frames     = {F1, F2, F3}
    RingSize   = 3
    PeekMax    = 2
    StageCap   = 2
    FillSize   = 6
    Budget     = 1
    MaxPackets = 5
    SpinMax    = 2
    TryArrivals = 1
    Stall      = FALSE
    GrabWhileWanted <- GrabWhileWantedBroken

INVARIANTS
    TypeOK
    ClaimWithinSpin
