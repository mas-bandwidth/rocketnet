\* The control's budget (2 opens) and cooldown (2) with one BeginUpdate
\* allowed (the control allows none), so marks, forgets and sweeps after the
\* update are explored with a transmit holder and the receive holder inside.
\* One transmit holder: with two the instance is
\* over the 110 s per-case budget (MCRNMsgxSocketTable.cfg keeps two, before
\* any update). MCRNMsgxSocketTableDead.cfg crosses an update too, with ICMP,
\* budget 1 and cooldown 1.
