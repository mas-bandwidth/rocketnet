\* MCServerStopSpread reversed witness: a transport that never drains the link simulator, in the update or the stop step, so with no queue jammed the held copies still never leave and the stop never reaches the I/O stop. Must fail StopFinishesWhileUnjammed.
SPECIFICATION FairSpec

CONSTANTS
    SlotCount   = 2
    MaxSessions = 2
    Burst       = 2
    BankSize    = 2
    QueueCount  = 2
    RingSize    = 4
    SteadyCap   = 2
    Simulator   = TRUE
    Defect      = "nolinkdrain"

PROPERTY StopFinishesWhileUnjammed
