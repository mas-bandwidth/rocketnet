\* The room test one late (count <= C): a full ring writes its next burst
\* over the waiting burst at the head (NoOverwrite).
SPECIFICATION MCSpec

CONSTANTS
    C             = 3
    K             = 2
    Bursts        = 6
    FullTestExact = FALSE
    CursorWrapAt  = TRUE
    CursorDrops   = TRUE

INVARIANT NoOverwrite
