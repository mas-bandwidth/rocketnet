\* MCSessionAcksWitSkipdeferred: wit-skipdeferred, a reversed witness. Witness
\* "skipdeferred" on the bits instance: the block memo is kept after an apply
\* that deferred an id, so a repeat of that block after the batch drains skips
\* the id the full apply would surface; expected to violate RepeatExact.
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq      = 4
    SentRing    = 2
    BatchCap    = 1
    Window      = 4
    MaxRanges   = 2
    DrainCap    = 4
    Burns       = TRUE
    Witness     = "skipdeferred"
    D2RPattern  = "arbitrary"
    R2DPattern  = "none"
    Capacity    = 1
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = FALSE
    BurstStart  = 3
    BurstLen    = 2

INVARIANTS
    TypeOK
    RepeatExact
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked
