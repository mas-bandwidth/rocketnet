\* MCRNSendSpans reversed witness: the floor (head) is the newest live
\* span's start instead of the oldest's. Must fail LiveSpansDisjoint: a wrap
\* to 0 lands on the oldest span, still live. HeadIsOldestStart and
\* LiveBetweenHeadAndTail state the flipped rule itself and fail one step
\* earlier, so this witness checks the damage invariants only. The committed
\* MCRNSendSpans.cfg with one constant changed.
SPECIFICATION Spec

CONSTANTS
    SR            = 96
    Lengths       = {1, 32, 48, 96}
    Q             = 4
    FloorAtOldest = FALSE
    PadOnWrap     = TRUE
    SpliceBoth    = TRUE

INVARIANTS
    TypeOK
    LiveSpansDisjoint
    SpanInsideRing
    Aligned
