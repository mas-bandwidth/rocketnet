\* Three addresses, any sink: every entry owned (KernelEntryOwned) with the
\* slot reused twice while its forgets are refused. GreetedSlotHasEntry
\* needs the XDP sink's rule (MCRNServerReplaySlotsThreeXdpSink.cfg).
SPECIFICATION MCSpec

CONSTANTS
    s1              = s1
    s2              = s2
    a1              = a1
    a2              = a2
    a3              = a3
    NONE            = NONE
    Slots           = {s1, s2}
    Addrs           = {a1, a2, a3}
    MaxHigh         = 0
    SkipWhileOwed   = TRUE
    ClearOnAccept   = TRUE
    ForgetRefusable = TRUE
    MarkSupersedes  = TRUE
    ForgetSupersedes = TRUE
    OweOnRefusal    = TRUE
    ScanWhenOwedOnly = TRUE

INVARIANTS
    TypeOK
    ForgetNeverLost
    OneIdentityPerSlot
    KernelHoldsMark
    DistinctUnlessOwed
    KernelEntryOwned
