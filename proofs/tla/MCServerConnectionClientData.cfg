\* MCServerConnectionClientData.cfg: the committed run (MCServerConnection.cfg)
\* with the connected clients' payloads (type 5) and standalone acks (type 8)
\* on the wire.  Either refreshes and confirms its own slot and moves no
\* slot and no mapping (DataNeverMovesSlot); every rule of the committed run
\* still holds.
SPECIFICATION Spec

CONSTANTS
    NumClients          = 2
    NumAddrs            = 2
    NumTokens           = 2
    MaxSlots            = 1
    MapCap              = 1
    HeldCapacity        = 2
    MaxAttempts         = 1
    MaxNonces           = 1
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 0
    HandshakeDeadline   = 0
    Disconnects         = TRUE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "any"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2
    ClientData          <- MCClientData

INVARIANTS
    SafetyInvariants
    ChurnNeverDenied
    ExpiredTokenNeverMapped

PROPERTIES
    DataNeverMovesSlot
    PacketsReachOwnSlotOnly
    SessionNeverAnswered
