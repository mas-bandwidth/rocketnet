\* The serial wraps to 0, a serial rn_window_ack_receipt_emit drops
\* (SerialNeverZero).
SPECIFICATION MCSpec

CONSTANTS
    Part         = "receipt"
    P            = 3
    R            = 2
    MaxRefs      = 4
    Rq           = 3
    SerialMod    = 4
    MaxWrites    = 6
    MaxEvents    = 8
    EvictAtP     = TRUE
    RefTestExact = TRUE
    ResetEmpty   = TRUE
    ReceiptClamp = TRUE
    SerialSkip   = FALSE

INVARIANT SerialNeverZero
