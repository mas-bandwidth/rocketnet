\* MCRNClientIocp passing control: every rule on.  Two posted receives, two
\* datagrams; the safety invariants and both liveness properties hold.  The
\* kernel completes every receive, and the give-up is off (GiveUp = FALSE)
\* so the liveness properties cannot be met by a leak: the drain itself
\* finishes and destroy frees.  MCRNClientIocpStalls.cfg has the leak.
SPECIFICATION Spec

CONSTANTS
    Buffers        = 2
    MaxDatagrams   = 2
    FreeWaitsDrain = TRUE
    DrainOnlyReady = TRUE
    KernelStalls   = FALSE
    GiveUp         = FALSE

INVARIANTS
    TypeOK
    NeverCopiedWhilePosted
    FreedOnlyWhenDrained

PROPERTIES
    PostedDrainAfterClose
    CloseEventuallyFrees
