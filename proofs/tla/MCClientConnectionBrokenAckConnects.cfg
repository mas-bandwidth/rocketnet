\* Reversed witness: MCClientConnectionServerAcks.cfg plus an ack read as
\* a keep-alive in sending connection response (ClientRecvAckConnects): the
\* client connects without the index only a keep-alive carries.  TLC must
\* fail ConnectedMeansHandshake.
SPECIFICATION SpecAckConnects

CONSTANTS
    SendInterval     = 1
    Timeout          = 0
    Deadline         = 0
    ServerDeadline   = 0
    MaxAttempts      = 1
    MaxNonces        = 1
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "firstkind"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
    ServerAcks       <- MCServerAcks

INVARIANTS
    ConnectedMeansHandshake
