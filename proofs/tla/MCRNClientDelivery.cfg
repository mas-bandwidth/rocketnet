\* MCRNClientDelivery: the reset keeps the batch; a caller that drains every
\* batch gets every payload counted delivered.
SPECIFICATION FairSpec
CONSTANTS
    Cap = 3
    MaxIds = 4
    CallerDrains = TRUE
    Defect = "none"
INVARIANTS
    TypeOK
    CountedImpliesHanded
    OfferedOnce
PROPERTIES
    DeliveredReachesCaller
