\* MCRNResendTimingFilter: the reliable timeout off (one tick is 500 ms), the
\* small record alone, a 5 s horizon (10), the RTT filter tracked: an ack after
\* 1 s (2) in which one was owed and none came ends a silence, srtt is one tick,
\* and an ack may name a packet sent up to 3 ticks before. No RTT sample comes
\* from a packet sent before silence_end - srtt once the estimator has its first,
\* and none is refused but after an owed silence.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 10
    MaxBackoff  = 1
    MinAttempts = 4
    TimeoutOn   <- TimeoutOff
    Filter      <- FilterOn
INVARIANTS
    TypeOK
    NoSampleAcrossSilence
    RefuseOnlyAfterOwedSilence
    NoDueRecordHeld
