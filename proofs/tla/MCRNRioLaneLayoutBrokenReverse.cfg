\* Reversed witness: a lane's worker posts its reserved slots from the last
\* down, not in slot order. Two frames for one destination in one lane leave
\* later first. Must fail InOrder.
SPECIFICATION Spec

CONSTANTS
    L         = 3
    F         = 2
    Hashes    = {0, 1, 4}
    MaxStarts = 5
    Mode      = "Reverse"

INVARIANTS
    TypeOK
    LaneInRange
    FinishOwn
    NoReissue
    OneLanePerDest
    InOrder
