\* MCReceiveOrder: the committed run, the ruled order, a request for another
\* token replacing its address's half-open mapping once accepted. CheapRefusalsFirst,
\* WorkBudgetOnlyForVerify, OneUnexpiredMappingPerToken, ClaimOnlyAfterSignature and ClaimHasMapping hold
\* while requests repeat and claims expire: a live claim names a token some
\* address's mapping holds, so no claim outlives its half-open mapping.
\* OneLiveMappingPerToken does not hold: in the window between a claim's
\* expiry and the sweep of its mapping a second address can take the token
\* (MCReceiveOrderDeadlineWindow.cfg shows it).
SPECIFICATION MCSpec

CONSTANTS
    PosRestart   = 1
    PosVersion   = 2
    PosTimestamps = 3
    PosCompares  = 4
    PosCookie    = 5
    PosUsed      = 6
    PosAdmitted  = 7
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 10
    PosKeypair   = 11

INVARIANTS
    TypeOK
    RequestRungOrder
    CheapRefusalsFirst
    WorkBudgetOnlyForVerify
    OneUnexpiredMappingPerToken
    ClaimOnlyAfterSignature
    ClaimHasMapping
    BoundTypeOK
    BoundHasNoClaim
    RefusalKeepsHalfOpen
