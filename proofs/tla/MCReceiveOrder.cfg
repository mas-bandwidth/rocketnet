\* MCReceiveOrder: the committed run, the ruled order, a request for another
\* token replacing its address's half-open mapping once accepted. CheapRefusalsFirst,
\* WorkBudgetOnlyForVerify, OneUnexpiredMappingPerToken, ClaimOnlyAfterSignature, ClaimHasMapping,
\* ReplaceOnlyUnboundToken and
\* RepeatSpendsNoVerify hold while requests repeat, updates start and claims
\* expire: a token refused past the verify is not verified again in its
\* update, and a live claim names a token some
\* address's mapping holds, so no claim outlives its half-open mapping.
\* OneLiveMappingPerToken does not hold: in the window between a claim's
\* expiry and the sweep of its mapping a second address can take the token
\* (MCReceiveOrderDeadlineWindow.cfg shows it).
SPECIFICATION MCSpec

CONSTANTS
    PosRestart   = 1
    PosVersion   = 2
    PosTimestamps = 3
    PosCompares  = 4
    PosCookie    = 5
    PosUsed      = 6
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 10
    PosKeypair   = 11

INVARIANTS
    TypeOK
    RequestRungOrder
    CheapRefusalsFirst
    WorkBudgetOnlyForVerify
    OneUnexpiredMappingPerToken
    ClaimOnlyAfterSignature
    ClaimHasMapping
    BoundTypeOK
    BoundHasNoOwnClaim
    RefusalKeepsHalfOpen
    ReplaceOnlyUnboundToken
    RepeatSpendsNoVerify
