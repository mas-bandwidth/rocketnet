\* MCRNSendReserveCodeTailsNamed: the code, with chunks of two and no guard, each filler on its own line, checked on TailsNamed alone. It fails: a refusal caused by another filler's chunk is counted SEND_RESERVE_REFUSED while that filler's held frames are on no line word: taken off its tail for a frame the transport refused and not yet given back to the claims (fill_refused's CAS, then its add), or taken with a frame of the tail (Continue) and not yet staged, or already staged by the time the code reads the lines (it reads them after the decision). A code defect handed up (row MM076); this case passes once the code names those refusals.
SPECIFICATION Spec

CONSTANTS
    Fillers   = {f1, f2}
    Reserve   = 2
    MaxFree   = 4
    MaxOwn    = 1
    MaxClaims = 2
    MaxRetire = 2
    MaxPhases = 2
    Chunk     = 2
    GuardWidth = 0
    SharedLine = FALSE
    RoomOnly      = FALSE
    SplitClaim    = FALSE
    RoomFirst     = FALSE
    OwnCountFirst = FALSE
    NoRefresh     = FALSE
    NoReread      = FALSE
    IndexTest     = FALSE
    NoFallback    = FALSE
    BatchCount    = FALSE
    NoTailReturn  = FALSE
    NoRetry       = FALSE
    NameAll       = FALSE

INVARIANTS
    TailsNamed
