\* MCRNSendReserveCodeTailsNamed: the code with chunks of two and no guard, each filler on its own line, with an own frame and one retire, checked on TypeOK and TailsNamed: a refusal is counted SEND_RESERVE_REFUSED_TAILS_HELD exactly when another filler held frames on a line as the code's read reached it. Passes. (Before the counter's meaning was settled under row MM076, this case failed the stronger property that every refusal held frames caused is counted on that row.)
SPECIFICATION Spec

CONSTANTS
    Fillers   = {f1, f2}
    Reserve   = 2
    MaxFree   = 4
    MaxOwn    = 1
    MaxClaims = 2
    MaxRetire = 1
    MaxPhases = 2
    Chunk     = 2
    GuardWidth = 0
    SharedLine = FALSE
    RoomOnly      = FALSE
    SplitClaim    = FALSE
    RoomFirst     = FALSE
    OwnCountFirst = FALSE
    NoRefresh     = FALSE
    NoReread      = FALSE
    IndexTest     = FALSE
    NoFallback    = FALSE
    BatchCount    = FALSE
    NoTailReturn  = FALSE
    NoRetry       = FALSE
    NameAll       = FALSE

INVARIANTS
    TypeOK
    TailsNamed
