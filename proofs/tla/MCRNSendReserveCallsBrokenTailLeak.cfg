\* MCRNSendReserveCallsBrokenTailLeak: a frame the transport refused gives back its own claim and not the tail its thread held, so the claims stay above the frames staged and a later start is refused with room above the reserve (NeverStarved).
SPECIFICATION Spec

CONSTANTS
    Clients   = {0, 1}
    NQ        = 1
    Reserve   = 2
    MaxFree   = 8
    SeenInit  = 100
    Chunk     = 3
    Guard     = 3
    RoomOnly     = FALSE
    NoRefresh    = FALSE
    AbortReturns = FALSE
    TailLeak     = TRUE
    MinRoom      = FALSE
    StickyReserve = FALSE
    OwnUnbounded  = FALSE

CONSTRAINT Bound

INVARIANTS
    NeverStarved
