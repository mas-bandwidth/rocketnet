\* Reversed witness "exit before drain": the worker exits once it sees the
\* stop, with runs or its receive still in the kernel. Must violate ExitDrained.
SPECIFICATION MCSpec

CONSTANTS
    U         = 2
    R         = 2
    K         = 2
    MaxRetry  = 2
    MaxAgain  = 1
    MaxRefuse = 1
    MaxRecvEnd = 1
    ExitRule  = "early"
    RetryRule = "bounded"
    WakeRule  = "armed"
    ShutdownRule = "begin"
    RecvRule  = "backoff"

INVARIANTS
    TypeOK
    ExitDrained
