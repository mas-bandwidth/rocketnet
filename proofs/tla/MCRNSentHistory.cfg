\* MCRNSentHistory: the committed run, the split rule on and no throttling,
\* one in-order writer (MCRNSentHistoryWriters.cfg has two concurrent ones).
\* README-RNSentHistory.md gives the reversed witnesses (CountEveryUnacked,
\* RefuseWhenFull, WriteStale each TRUE in turn) as the
\* MCRNSentHistoryBroken*.cfg files beside this one.
SPECIFICATION Spec

CONSTANTS
    N                 = 4
    Threshold         = 2
    MaxSeq            = 7
    MaxLoss           = 2
    Flight            = 2
    AckRange          = 4
    AckSlots          = 2
    Writers           = 1
    CountEveryUnacked = FALSE
    RefuseWhenFull    = FALSE
    WriteStale        = FALSE

INVARIANTS
    TypeOK
    EveryEvictionClassified
    LostImpliesLaterAcked
    LargestAckedIsMaximum
    NoOverflowUnderBoundedLoss
    SendNeverRefused
    RingHoldsNewest
    EverySendTransmitted
