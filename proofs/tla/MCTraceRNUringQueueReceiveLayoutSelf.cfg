\* The trace check's passing control: a hand-written record of one
\* datagram's way through a queue is a behaviour of RNUringQueueReceiveLayout.
SPECIFICATION TraceSpec

CONSTANTS
    S           = 3
    B           = 4
    TailWrap    = 8
    MaxArrive   = 5
    MaxSegs     = 2
    DrainMax    = 2
    RoomRule    = "refresh"
    SlotRule    = "mod"
    ReleaseRule = "next"
    CounterWrap = 0
    TraceLog    <- GoodLog

INVARIANTS
    TraceConsistent
