\* MCRNSentHistory reversed witness: the rule before the split, every unacked
\* eviction is counted overflow and nothing is counted lost. Must fail
\* NoOverflowUnderBoundedLoss (the w3 finding: path loss relabelled as
\* overflow on a healthy path). The committed MCRNSentHistory.cfg with one
\* line changed.
SPECIFICATION Spec

CONSTANTS
    N                 = 4
    Threshold         = 2
    MaxSeq            = 7
    MaxLoss           = 2
    Flight            = 2
    AckRange          = 4
    AckSlots          = 2
    CountEveryUnacked = TRUE
    RefuseWhenFull    = FALSE

INVARIANTS
    TypeOK
    EveryEvictionClassified
    LostImpliesLaterAcked
    LargestAckedIsMaximum
    NoOverflowUnderBoundedLoss
    SendNeverRefused
