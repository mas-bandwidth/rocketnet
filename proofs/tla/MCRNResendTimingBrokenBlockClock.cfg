\* MCRNResendTimingBrokenBlockClock: the reversed witness of the chunk's clock.
\* The chunk first sent at tick 18 is timed from its block's first send at tick
\* 0 (the code before send_first_sends): at tick 20 it has one send where
\* MinAttempts are owed. It must fail AttemptsBeforeTimeout.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 20
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    ChunkFirst  <- ChunkFirstLate
    BlockClock  <- BlockClockOn
INVARIANTS
    TypeOK
    AttemptsBeforeTimeout
