\* MCRNFillPhaseBrokenTakeUncounted: update_client takes no count on a fills_in line, so update_finish's look cannot see it; must fail TakeSound.
SPECIFICATION Spec

CONSTANTS
    Fillers      = {f1, f2}
    Clients      = {c1, c2}
    NoOwner      = none
    MaxMain      = 2
    MaxFills     = 0
    MaxTakes     = 1
    LookFirst    = FALSE
    LoadStore    = FALSE
    ResetOnLeave = TRUE
    NoEpochLook  = FALSE
    NoRestore    = FALSE
    ScanOne      = FALSE
    NoWindow     = FALSE
    NoMainWindow = FALSE
    TakeUncounted = TRUE
    OptedAtStart  = TRUE
    ArmedAtCreate = FALSE
    OwnerAtDecide = FALSE
    DepthMax      = 2
    Lines        = {0, 1}
    LineChoice   <- MCLineChoice
    f1 = f1
    f2 = f2
    f3 = f3

VIEW View

INVARIANTS
    TakeSound
