\* MCSessionAcksBrokenLiveness: the reversed liveness witness. The "dropfull"
\* defect marks a packet id acknowledged when the batch is full instead of
\* deferring it, so an opened payload that is not the one the batch holds never
\* surfaces while its record is retained. OpenedSurfacesOrLaps falls under the
\* fair Spec, showing the delivery-assumption antecedent is reachable and the
\* property is not a tautology.
SPECIFICATION Spec

CONSTANTS
    MaxSeq      = 2
    SentRing    = 4
    BatchCap    = 1
    Window      = 4
    MaxRanges   = 2
    DrainCap    = 4
    Burns       = FALSE
    Witness     = "dropfull"
    D2RPattern  = "none"
    R2DPattern  = "none"
    Capacity    = 1
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = FALSE
    BurstStart  = 3
    BurstLen    = 2

PROPERTIES
    OpenedSurfacesOrLaps
