\* MCRNReceiveHandoffBrokenReadOnlyLeft: main reads only buffers the worker has left (the old ready-slot rule). Must fail DeliveredByNextCall.
SPECIFICATION Spec

CONSTANTS
    Cap          = 2
    MaxRx        = 5
    Budgets      = {1, 6}
    ReadOnlyLeft = TRUE

INVARIANTS
    TypeOK
    FreeIffShared
    NoSharedSlot
    FreeIsEmpty
    InOrder
    DeliveredByNextCall
