\* MCServerStopSpread reversed witness: the stop step before AbandonNoRoom. A transport that loses its send room for good (an XDP queue in hard send error with a full producer) leaves the waiting bursts unsealable, and the stop never finishes. Must fail StopFinishesWithoutRoom.
SPECIFICATION FairSpec

CONSTANTS
    SlotCount   = 2
    MaxSessions = 4
    Burst       = 2
    BankSize    = 3
    QueueCount  = 1
    RingSize    = 4
    SteadyCap   = 2
    Simulator   = FALSE
    Defect      = "noabandon"

PROPERTY StopFinishesWithoutRoom
