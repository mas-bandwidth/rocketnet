\* MCRNPacketLease reversed witness: retired, as it was, against a copy whose value
\* was changed.  The fields read while an insert rewrites the entry can
\* equal the changed copy.  Must fail NoWrongSuccess.
SPECIFICATION Spec

CONSTANTS
    Capacity          = 4
    Threads           = {1, 2}
    Frames            = {1, 2}
    Vals              = {1, 2}
    HashSpread        = 1
    MaxOps1           = 2
    MaxOps2           = 1
    MaxResets         = 2
    EpochLimit        = 2
    UsedLimit         = 2
    UseCas            = TRUE
    ConsumeCas        = TRUE
    BumpEpoch         = TRUE
    EpochLimited      = TRUE
    RetiredOn         = TRUE
    RetiredValidates  = FALSE
    OnWriting         = {"skip"}
    ValidCallers      = FALSE
    AtomicFields      = TRUE

INVARIANTS
    TypeOK
    NoWrongSuccess
