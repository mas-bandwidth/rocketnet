\* MCRNIocpRetryStop liveness: one operation, two workers, every retry reposted while running and every stop completing under the workers' fairness. Must pass.
\* Gap: a push is refused only with two operations, so this instance never reaches PushClaim's wait for a cell another worker's pass still holds, and liveness is not checked across that wait. The smallest instance that reaches it (MCRNIocpRetryStop.cfg's constants under SpecFair) does not finish its temporal check within the 110 s bounded record, so it is not a case. The wait is checked for safety by MCRNIocpRetryStop.cfg, and the queue's own liveness across a stalled pop by MCRNIocpRefQueueStalledPop.cfg and MCRNIocpRefQueueStalledPopCap4.cfg (EveryOperationPopped).
SPECIFICATION SpecFair

CONSTANTS
    NumOps          = 1
    Workers         = {w1, w2}
    Cap             = 2
    PosMod          = 16
    MaxFail         = 2
    MaxComplete     = 1
    StopSlack       = 0
    ClaimBeforeStop = FALSE
    RefuseRetires   = FALSE

INVARIANTS
    TypeOK
    PassBounded
    RetryOwned
    PendingIsPosted
    RetiredOnlyByStop

PROPERTIES
    RetryResolves
    StopCompletes
