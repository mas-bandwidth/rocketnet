\* the reversed reachability witness for first-of-kind loss on both links
\* with a tick of latency.  First-of-kind loss drops the first request,
\* cookie, challenge, response and payload, so the handshake needs three
\* more ticks than MCClientConnectionSFirstkind.cfg allows: Timeout 5 (the
\* challenge arrives with the receive clock at 4), the server handshake
\* deadline 4 (the first response is lost and the retry is a tick later) and
\* the client deadline 8 (the keep-alive that connects is the second one).
\* Disconnects and other clients are off so the full-environment size does
\* not put the case over the 110 s budget; the loss, latency, duplication
\* and reordering stay.  SPECIFICATION SpecReach adds
\* ClientRecvPayloadWitness, so the ghost cPayloadDelivered is set once the
\* connected application is handed a payload; NotReached is its negation.
\* TLC must violate NotReached: a run that completes without a violation
\* would mean connected with a payload delivered is unreachable under these
\* constants.
SPECIFICATION SpecReach
CONSTANTS
    SendInterval     = 1
    Timeout          = 5
    Deadline         = 8
    ServerDeadline   = 4
    MaxAttempts      = 1
    MaxNonces        = 2
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "firstkind"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 1
    Duplication      = TRUE
    Reordering       = TRUE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    NotReached
