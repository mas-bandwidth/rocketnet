\* MCClientConnectionReachSFirstSmall.cfg: the reachability witness for
\* MCClientConnectionSFirstSmall.cfg.  Same constants; TLC must violate
\* NotEarlyConnected, which shows those constants carry an attempt to
\* connected through both early sends, so the safety case checks the early
\* send and not only the states before it.
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 2
    Deadline         = 5
    ServerDeadline   = 3
    MaxAttempts      = 1
    MaxNonces        = 1
    MaxIds           = 1
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = FALSE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "first"
    S2CPattern       = "first"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = TRUE
    Reordering       = TRUE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    NotEarlyConnected
