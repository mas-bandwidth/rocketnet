\* Reversed witness: the code before the fix, every refused end of the
\* multishot receive armed again at once, so a kernel that refuses every arm
\* has the worker re-arm at completion speed. Must violate RecvNoSpin.
SPECIFICATION MCSpec

CONSTANTS
    U         = 2
    R         = 2
    K         = 2
    MaxRetry  = 2
    MaxAgain  = 1
    MaxRefuse = 1
    MaxRecvEnd = 2
    ExitRule  = "drained"
    RetryRule = "bounded"
    WakeRule  = "armed"
    ShutdownRule = "begin"
    RecvRule  = "immediate"

INVARIANTS
    RecvNoSpin
