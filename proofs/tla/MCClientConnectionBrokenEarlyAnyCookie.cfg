\* MCClientConnectionBrokenEarlyAnyCookie.cfg: the reversed witness of the early
\* send (TRANSPORT.md t11 rule 7). Every accepted cookie arms the early send,
\* not only the advance from requesting cookie (1) to sending connection
\* request (2), so a forger echoing the salt brings a second request forward
\* in sending connection request (2): EarlySendPerAdvance is violated. The
\* constants are MCClientConnectionForgedCookie.cfg, which passes it.
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 3
    Deadline         = 0
    ServerDeadline   = 0
    MaxAttempts      = 1
    MaxNonces        = 1
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = FALSE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
    Forgery          <- MCForgery
    EarlyArmsOnAnyCookie <- MCEarlyAnyCookie
INVARIANTS
    EarlySendPerAdvance
