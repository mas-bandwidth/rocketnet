\* MCServerStopSpread reversed witness: the stop step without its link_empty test, which tells the I/O to stop once the ring is empty and send_idle is true while the link simulator still holds copies. Must fail NoCopyHeldAtStop.
SPECIFICATION Spec

CONSTANTS
    SlotCount   = 2
    MaxSessions = 2
    Burst       = 2
    BankSize    = 2
    QueueCount  = 2
    RingSize    = 4
    SteadyCap   = 2
    Simulator   = TRUE
    Defect      = "stopwithheld"

INVARIANT NoCopyHeldAtStop
