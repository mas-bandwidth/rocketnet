\* The several-queue stop step without its pop loop: the bursts bound for a
\* full queue are marked complete and the complete head stays in the ring
\* (HeadNotComplete). A drain only pops after a seal or an abandon, so a ring
\* left holding complete bursts alone is never emptied and the stop never ends.
SPECIFICATION MCSpec

CONSTANTS
    SteadyCap     = 2
    K             = 2
    Bursts        = 6
    SteadyCapExact = TRUE
    CursorWrapAt  = TRUE
    CursorDrops   = TRUE
    DropResetsCursor = TRUE
    Queues        = 2
    AbandonQueuePops = FALSE

INVARIANT HeadNotComplete
