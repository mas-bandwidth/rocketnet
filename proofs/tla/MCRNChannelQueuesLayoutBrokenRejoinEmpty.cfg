    D                 = 3
    C                 = 2
    TicketMod         = 4
    GenMax            = 2
    PopResetsTail     = TRUE
    PushFrontSetsTail = TRUE
    RemoveUpdatesEnds = TRUE
    RejoinChecksMore  = FALSE

INVARIANT ReadyNonEmpty
