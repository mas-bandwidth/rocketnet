\* MCSessionAcksReachLap: a reach witness on the live-lap constants
\* (MCSessionAcksLiveLap.cfg) under SpecSafety. A payload the receiver opened
\* is lapped in the sent ring before its id surfaces; every other invariant
\* holds on the way. Must fail NoLapBeforeSurface.
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq      = 3
    SentRing    = 2
    BatchCap    = 1
    Window      = 2
    MaxRanges   = 1
    DrainCap    = 3
    Burns       = FALSE
    Witness     = "none"
    D2RPattern  = "arbitrary"
    R2DPattern  = "arbitrary"
    Capacity    = 1
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = FALSE
    BurstStart  = 3
    BurstLen    = 2

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked
    RepeatExact
    NoLapBeforeSurface
