\* MCRNBankFifoLayout: the free FIFO and ready FIFO of three banks with the
\* literal { 1, 2, 0 } initializer and one bank at the consumer: portable_rx_*
\* and portable_tx_* (sdk/rocketnet_driver_builtin.cpp) and the gso transmit
\* banks (sdk/rocketnet_server_gso_linux.cpp).  Eight publishes, so both
\* queues wrap more than twice.
SPECIFICATION Spec

CONSTANTS
    N         = 3
    ArrLen    = 3
    ConsMax   = 1
    MaxReady  = 3
    MaxPub    = 8
    FreeSlack = 0
    HeadMod   = 3
    TailMod   = 3
    PushKind  = "fifo"
    PopKind   = "fifo"
    InitKind  = "literal"

INVARIANTS
    TypeOK
    InBounds
    CountsInRange
    ExactlyOnePlace
    ReadyMatches
