\* rocketnet_loopback_hub_bytes sizing the block without the red zones: create's walk carves
\* 16 bytes per queue, the block holds 24, and the client's carve runs past the block's end.
SPECIFICATION MCSpec

CONSTANTS
    Clients        = 1
    Capacity       = 3
    ServerCapacity = 3
    CounterMod     = 6
    MaxSent        = 8
    FullSlack      = 0
    ResetRestartsIndices = TRUE
    SlotBytes      = 4
    RedZoneBytes   = 4
    AlignBytes     = 4
    RedZoneInCarve = TRUE
    HubBytesRedZone = FALSE

INVARIANT StaysInRegion
