\* MCRNServerSendFairBrokenRevisit: the compaction keeps a slot that wrote nothing, so a
\* later round visits a slot whose pass ended (OnlyLastWriters).
SPECIFICATION Spec

CONSTANTS
    N       = 4
    K       = 3
    Conn    = {0, 1, 3}
    WorkMax = 2
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "revisit"
    Q1      = {}
    K1      = 0
    QueueRule = "perqueue"

INVARIANT
    OnlyLastWriters
