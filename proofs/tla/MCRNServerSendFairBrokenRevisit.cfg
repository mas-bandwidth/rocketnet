\* MCRNServerSendFairBrokenRevisit: the compaction keeps a slot that wrote
\* nothing, so a later round visits a slot whose pass ended (OnlyLastWriters).
SPECIFICATION Spec

CONSTANTS
    N        = 4
    K        = 3
    Mode     = "revisit"
    MaxTicks = 3
    Dark     = {}
    Conn     = {0, 1, 3}
    WorkMax  = 2

INVARIANT
    OnlyLastWriters
