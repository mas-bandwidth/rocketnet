\* MCRNClientIoCompactLayout reversed witness: the record names slot
\* fill_slots + i, where the datagram arrived, instead of fill_slots + accepted.
\* A later datagram's move overwrites it.  Must fail RecordsExact.
SPECIFICATION Spec

CONSTANTS
    C        = 4
    B        = 3
    MaxIds   = 7
    Move     = TRUE
    RecordAt = "source"

INVARIANTS
    TypeOK
    RecordsExact
