\* MCRNBankFifoLayout reversed witness: the tail position taken % ( N - 1 )
\* while the head advances % N.  Must fail ReadyMatches.
SPECIFICATION Spec

CONSTANTS
    N         = 3
    ArrLen    = 3
    ConsMax   = 1
    MaxReady  = 3
    MaxPub    = 8
    FreeSlack = 0
    HeadMod   = 3
    TailMod   = 2
    PushKind  = "fifo"
    PopKind   = "fifo"
    InitKind  = "literal"

INVARIANTS
    TypeOK
    ReadyMatches
