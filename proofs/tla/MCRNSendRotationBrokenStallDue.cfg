\* Ready messages of a stalled window count as due: a frame is started
\* for nothing and aborted (NoAbort).
SPECIFICATION MCSpec

CONSTANTS
    N           = 3
    Cap         = 3
    MaxFlush    = 2
    EnvStall    = TRUE
    EnvShortAck = FALSE
    EnvRefuse   = FALSE
    KeepDone    = TRUE
    StallGate   = FALSE
    FitsGate    = TRUE
    WriteFirst  = TRUE
    CursorNext  = TRUE
    CutCursor   = TRUE

INVARIANT NoAbort
