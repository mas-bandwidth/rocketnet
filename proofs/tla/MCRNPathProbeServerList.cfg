\* The server's own list lacks the client's middle size: a probe of it is refused unanswered, every invariant and the liveness properties.
SPECIFICATION FairSpec

CONSTANTS
    Ceiling      = 3
    CapsUp       = {0, 1, 2, 3}
    CapsDown     = {0, 1, 2, 3}
    W            = 2
    MaxLoss      = 1
    AttackBudget = 1
    ClientSet    = {3, 2, 1}
    ServerList   = {3, 1}
    Timed        = TRUE
    Broken       = "none"

INVARIANTS
    TypeOK
    SlotAgrees
    ChosenIsCandidate
    CarriedBothWays
    CrossedBothWays
    ReplyOnlyProven
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate

PROPERTIES
    Ends
    NoHang
    ConnectsWhenFits
    FailsWhenNoneFits
