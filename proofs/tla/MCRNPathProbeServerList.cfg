\* At the capacities of MCRNPathProbe.cfg ({0, 1, 3} up, {1, 3} down). The lists differ: the server's list lacks the client's middle candidate, so the walk rules it out (the server never answers it) and still reaches the largest size both lists give that the path carries.
SPECIFICATION FairSpec

CONSTANTS
    ClientSet     = {3, 2, 1}
    ServerList    = {3, 1}
    CapsUp        = {0, 1, 3}
    CapsDown      = {1, 3}
    K             = 2
    MaxBursts     = 1
    BurstSpacings = 0
    AttackBudget  = 1
    Forger        = FALSE
    Timed         = TRUE
    Broken        = "none"

INVARIANTS
    TypeOK
    RaisedWithinPath
    ServerNeverAhead
    FailOnlyAtP0
    NeverAtRuledOut
    ReplyOnlyConnected
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate
    NoWrongRuleOut

PROPERTIES
    PNeverDecreases
    StrikeNeedsSmall
    StrikeNeedsSpacing
    ServerRaisesOnConfirm
    ClientRaisesOnAuthLarge
    NoProbeAfterDone
    Converges
    ReachesBest
    FailsWhenP0NotCarried
