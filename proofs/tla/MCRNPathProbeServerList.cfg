\* At every path capacity 0 .. 3 each way, as MCRNPathProbe.cfg. The lists differ: the server's list lacks the client's middle candidate, so the ladder rules it out (the server never answers it) and stops there, never trying the size above it: the top of the ladder is P0, and on a path that does not carry P0 the walk ends -14.
SPECIFICATION FairSpec

CONSTANTS
    ClientSet     = {3, 2, 1}
    ServerList    = {3, 1}
    CapsUp        = {0, 1, 2, 3}
    CapsDown      = {0, 1, 2, 3}
    K             = 2
    MaxBursts     = 1
    AttackBudget  = 1
    AttackKinds   = {"replay", "probe", "reply"}
    Forger        = FALSE
    Timed         = TRUE
    LossBound     = TRUE
    MaxReuses     = 0
    ReuseCapsUp   = {}
    ReuseCapsDown = {}
    Broken        = "none"

INVARIANTS
    TypeOK
    RaisedWithinPath
    ServerNeverAhead
    FailOnlyAtP0
    NeverAtRuledOut
    NeverAboveRuled
    RuledIsTheNextStep
    ReplyOnlyConnected
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate
    NoWrongRuleOut

PROPERTIES
    PNeverDecreases
    StrikeNeedsSmall
    ServerRaisesOnConfirm
    ClientRaisesOnAuthLarge
    NoProbeAfterDone
    NoSkippedStep
    Converges
    ReachesBest
    FailsWhenP0NotCarried
