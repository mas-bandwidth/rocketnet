\* The code with the generation wrapping: GenMax = 2, so a descriptor's
\* third take is generation 1 again (rn_region_send_alloc's wrap to 1 at
\* UINT32_MAX). Every invariant still holds: the number comparison alone
\* keeps a stale ack off a later number under a reused name.
SPECIFICATION MCSpec

CONSTANTS
    W                 = 4
    N                 = 6
    D                 = 2
    GenMax            = 2
    CheckNumber       = TRUE
    WindowSlack       = 0

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NamedGenerationOnly
    AckedOnlyDelivered
    LinkNamesOwner
    WindowOwnsSlots
