\* Reversed witness: MCClientConnectionKeysErased.cfg under SpecDownKeepsKeys,
\* where a timeout or a received disconnect may leave the session keys.
\* TLC must fail KeysErasedWhenDown.
SPECIFICATION SpecDownKeepsKeys
CONSTANTS
    SendInterval     = 1
    Timeout          = 2
    Deadline         = 4
    ServerDeadline   = 3
    MaxAttempts      = 1
    MaxNonces        = 1
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = TRUE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    KeysErasedWhenDown
