\* Reversed witness: the claim refuses only an index past S, so the fourth
\* claim on a bank is handed slot S, one past the array.  Must violate
\* InBounds.
SPECIFICATION MCSpec

CONSTANTS
    Q           = 2
    NB          = 2
    S           = 3
    Stride      = 2
    Threads     = {1, 2}
    Dests       = {1, 2, 3}
    QueueOf     <- MCQueueOf
    Demand      = 4
    MaxFlush    = 2
    Skew        <- MCSkew
    ClaimCmp    = "gt"
    CounterWrap = 0
    SlotRule    = "check"
    IdRule      = "mul"

INVARIANTS
    TypeOK
    InBounds
