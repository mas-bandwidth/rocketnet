\* MCServerConnectionDualFamily.cfg: a token naming both families, a client host with
\* IPv4 only and a server serving IPv4; the server accepts the token's IPv4
\* address and the client connects (OneFamilyHostConnects passes).
SPECIFICATION Spec

CONSTANTS
    NumClients          = 1
    NumAddrs            = 1
    NumTokens           = 1
    MaxSlots            = 1
    MapCap              = 1
    HeldCapacity        = 1
    MaxAttempts         = 1
    MaxNonces           = 1
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 0
    HandshakeDeadline   = 0
    Disconnects         = FALSE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "own"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2
    TokenFamilies       <- MCTokenBothFamilies
    HostFamilies        <- MCHostIpv4Only
    ServedFamily        <- MCServedIpv4
    AddressMatch        <- MCMatchEither

INVARIANTS
    SafetyInvariants

PROPERTIES
    OneFamilyHostConnects
