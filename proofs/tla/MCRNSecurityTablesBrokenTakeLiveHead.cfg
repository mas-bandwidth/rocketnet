\* Reversed witness: HeadMustExpire <- MCHeadLive, the order head reused
\* while its claim is live. TLC must fail LiveClaimNeverReplaced: two
\* tokens hold both slots with live claims, and a third token's record
\* takes the head.
SPECIFICATION ClaimsSpec

CONSTANTS
    None = None
    Addrs = {"A", "B"}
    Tokens = {"th", "te", "tf"}
    Expire <- MCExpire
    Cid <- MCCid
    MaxClock = 4
    CookieLife = 1
    RotatePeriod = 2
    MaxClients = 2
    HistoryCap = 2
    AdmittedCap = 2
    VerifyBudget = 2
    HandshakeDeadline = 2
    Rotation = TRUE
    AcceptPrevious = TRUE
    RefuseAdmittedAtResponse = TRUE
    RequestChecksExpiry = TRUE
    EvictLiveHistory = TRUE
    DeniedConsumesToken = FALSE
    CapVerifyBudget = TRUE
    PreviousOutlivesWindow = FALSE
    BindAtRequest = FALSE
    Holds <- MCHolds
    ClaimTokens <- MCClaimControlTokens
    HoldUntilExpire = FALSE
    CheckCidAtResponse = TRUE
    HeadMustExpire <- MCHeadLive

INVARIANTS
    LiveClaimNeverReplaced

CHECK_DEADLOCK FALSE
