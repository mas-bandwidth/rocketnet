\* A capacity cut in a later round leaves the cursor where the last writer
\* set it, not where a walk over every connection would (CursorAsFullWalk).
SPECIFICATION MCSpec

CONSTANTS
    N           = 3
    Cap         = 4
    MaxFlush    = 2
    EnvStall    = FALSE
    EnvShortAck = FALSE
    EnvRefuse   = FALSE
    EnvVain     = FALSE
    KeepDone    = TRUE
    StallGate   = TRUE
    FitsGate    = TRUE
    WriteFirst  = TRUE
    CursorNext  = TRUE
    CutCursor   = FALSE
    VainEnds    = TRUE

INVARIANT CursorAsFullWalk
