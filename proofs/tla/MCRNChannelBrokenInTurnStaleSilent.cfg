\* Reversed witness for SequencedArrivedAccounted (m7.4, nothing is silent):
\* an in-turn sequenced record behind the epoch's watermark is dropped and
\* not counted (Broken = "InTurnStaleSilent": rn_sequenced_in_turn's stale
\* branch without its rn_sequenced_count). Must violate
\* SequencedArrivedAccounted.
SPECIFICATION SafetySpec
CONSTANTS
    Scenario = "backwards"
    Broken = "InTurnStaleSilent"
    SendCapacity = 4
    OrderedCapacity = 2
    HoldCapacity = 2
    TransportCaps = {1}
INVARIANTS
    TypeOK
    SequencedArrivedAccounted
CHECK_DEADLOCK FALSE
