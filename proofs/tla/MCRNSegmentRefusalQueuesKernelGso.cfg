\* MCRNSegmentRefusalQueuesKernel on the gso transport: a kernel that refuses
\* every segmented send, d1 on lane 0 and d2, d3, d4 on lane 1.  Lane 1
\* counts two refusing destinations and clears the transport's one segment
\* flag (FlagScope "transport"), so lane 0 stops segmenting too, unlike the
\* io_uring transport whose queue 0 keeps its own flag.
SPECIFICATION Spec

CONSTANTS
    Dests          = {"d1", "d2", "d3", "d4"}
    Refusing       = {}
    KernelSegments = FALSE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"
    Slot           <- SlotDistinct
    Queue          <- QueueSplit
    AcceptedRule   = "transport"
    FlagScope      = "transport"

INVARIANTS
    TypeOK
    NoFallbackAfterAccepted
    NothingDropped
    RefusedOnce
    KernelFallback
