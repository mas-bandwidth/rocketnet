\* The walk reads from the current head instead of the head captured at
\* its start: after an unlink's sync moves the head, the walk re-reads
\* from the moved head over its old span and returns one descriptor
\* twice (WalkExact).
SPECIFICATION MCSpec

CONSTANTS
    Q            = 3
    N            = 6
    TicketMod    = 4
    Renumber     = TRUE
    FreshTickets = TRUE
    DropPushed   = TRUE
    WalkSnapshot = FALSE

INVARIANT WalkExact
