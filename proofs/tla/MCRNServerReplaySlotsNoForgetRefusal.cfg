\* The passing control with every forget queued (marks refusable): every
\* invariant, KernelHoldsMark included.
SPECIFICATION MCSpec

CONSTANTS
    s1              = s1
    s2              = s2
    a1              = a1
    a2              = a2
    NONE            = NONE
    Slots           = {s1, s2}
    Addrs           = {a1, a2}
    MaxHigh         = 1
    SkipWhileOwed   = TRUE
    ClearOnAccept   = TRUE
    ForgetRefusable = FALSE
    MarkSupersedes  = TRUE
    ForgetSupersedes = TRUE

INVARIANTS
    TypeOK
    ForgetNeverLost
    OneIdentityPerSlot
    KernelHoldsMark
