\* Reversed witness: an eagain completion marks its run's slots done with no
\* count, as a send path that neither retries nor counts the full socket
\* would.  Must violate Accounted.
SPECIFICATION MCSpec

CONSTANTS
    NB         = 3
    S          = 2
    Dests      = {1, 2}
    MaxSeg     = 2
    Demand     = 3
    MaxFlush   = 3
    MaxEagain  = 1
    RetireRule = "cqe"
    EagainRule = "lost"
    LockRule   = "try"

INVARIANTS
    TypeOK
    Accounted
