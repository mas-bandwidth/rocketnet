\* No bitmap: cookie_reply_sources is NULL (a protocol object made without
\* its transport), so the gate skips the limit and answers every request
\* owed a cookie. OneReplyPerSource and the bitmap invariants are not
\* properties of this configuration; no request is withheld, the bitmap is
\* never read or dirtied, and the work budget is untouched.
SPECIFICATION MCSpec

CONSTANTS
    Sources      = {1, 2, 3}
    Bound        = 2
    Factor       = 2
    WordBits     = 2
    HashRange    = 8
    VerifyBudget = 1
    Broken       = "none"
    Limited     <- MCUnlimited

INVARIANTS
    TypeOK
    CleanIsEmpty
    WorkBudgetOnlyVerifies
    UnlimitedNeverWithholds
