\* MCRNPortableTx reversed witness: stop makes one publish try and counts the
\* producer dropped when it is refused (the worker on the handoff lock, or no
\* free bank while it sends). Must fail StopDropsNothing.
SPECIFICATION Spec

CONSTANTS
    NumBanks          = 3
    Cap               = 2
    Batch             = 2
    MaxPackets        = 6
    FullSlack         = 0
    HeadMod           = 3
    TailMod           = 3
    QuitUnderLock     = TRUE
    PublishBeforeQuit = TRUE
    PublishUntilSent  = FALSE
    RetryOnIdle       = TRUE
    WakeOnPublish     = TRUE
    Timeout           = FALSE

INVARIANTS
    InBounds
    TypeOK
    StopDropsNothing
