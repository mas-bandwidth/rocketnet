\* MCRNXdpGatewayRefreshBrokenFailureWritesTable: reversed witness, a failed resolve writes its unusable answer into the table (no usable-MAC check); must fail StagedMacUsable.
SPECIFICATION Spec

CONSTANTS
    Period            = 2
    MaxTime           = 6
    MaxStep           = 6
    MaxChanges        = 2
    MaxFailures       = 1
    RefreshInFill     = FALSE
    RefreshNever      = FALSE
    FailureKeepsTable = FALSE

INVARIANTS
    TypeOK
    NoTornMac
    StagedMacUsable
