\* MCRNXdpGatewayRefreshBrokenFailureWritesTable: reversed witness, a failed resolve writes its unusable answer into the table (no usable-MAC check); must fail StagedMacUsable (NoTornMac is left out: an unusable MAC is in no resolve's answer set either, the same failure under another name).
SPECIFICATION Spec

CONSTANTS
    Period            = 2
    MaxTime           = 6
    MaxStep           = 6
    MaxChanges        = 2
    MaxFailures       = 1
    RefreshInFill     = FALSE
    RefreshNever      = FALSE
    FailureKeepsTable = FALSE

INVARIANTS
    TypeOK
    StagedMacUsable
