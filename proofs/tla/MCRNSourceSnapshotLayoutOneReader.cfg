\* MCRNSourceSnapshotLayout: one reader, three addresses on four cells (one probe wraps), four updates, every rule on. Must pass.
SPECIFICATION Spec

CONSTANTS
    Readers       = {1}
    Addrs         = {1, 2, 3}
    Cap           = 4
    MaxEntries    = 2
    Home          <- MCHome
    MaxUpdates    = 4
    MaxRefused    = 1
    HalfPublished = FALSE
    NoRecheck     = FALSE
    LookupNoWrap  = FALSE

INVARIANTS
    TypeOK
    TargetUnpublished
    NoTornRead
    WriterNeverWritesAnnounced
    LookupMatchesPublished
    PublishedExact
    ChainIntact
    AtMostHalf
