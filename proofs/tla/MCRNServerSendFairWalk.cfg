\* MCRNServerSendFairWalk: the rotation walks its cursor across a wider ring. Five healthy
\* slots share two frames a flush and offer up to two each; ceil(5 / 2) = 3
\* flushes is the bound every slot meets.
SPECIFICATION Spec

CONSTANTS
    N       = 5
    K       = 2
    Conn    = {0, 1, 2, 3, 4}
    WorkMax = 2
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "rounds"
    Q1      = {}
    K1      = 0
    QueueRule = "perqueue"

INVARIANTS
    TypeOK
    FairService
    NoUnitWasted
    OtherClientUnaffected
    DarkTakesOnlyItsProbes
    SameOrder
    OnlyLastWriters
    EndedWritesNothing
    CursorAsFullWalk
    VisitsBounded
