\* MCRNServerSendFairWalk: the rotation walks its cursor across a wider ring.
\* Five healthy clients share two frames per update and offer up to two each;
\* ceil(5 / 2) = 3 updates is the bound every client meets.
SPECIFICATION Spec

CONSTANTS
    N       = 5
    K       = 2
    Work    = 2
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Mode    = "fair"

INVARIANTS
    TypeOK
    FairService
    NoUnitWasted
    OtherClientUnaffected
