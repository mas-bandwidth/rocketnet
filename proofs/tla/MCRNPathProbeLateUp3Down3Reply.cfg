\* The untimed case, the code's untimed view, at capacity 3 up and 3 down, its one attacker send a forged large reply (MCRNPathProbeLateUp3Down3.cfg the replay, MCRNPathProbeLateUp3Down3Probe.cfg a packet from X or F, MCRNPathProbeLateUp3Down3Reply.cfg a forged reply: with a budget of one send, the three cover every behaviour of the three kinds together; split on 2026-11-26 when the one case took 66.7 s, over 60% of the case budget; one attacker send is 2.4M of its 2.5M distinct states) (MCRNPathProbeLate.cfg has capacity 1 up, MCRNPathProbeLateUp3.cfg 3 up and 1 down; split on 2026-11-26 when the re-try took the one case over 60% of the case budget), one attacker send and no loss burst (MCRNPathProbeLateBurst.cfg has the burst: the two together are over the case budget untimed since the ladder, 107 s on space, and the Timed cases keep the combination); a pair's replies may arrive after it resolved, a late large reply raises P, and every safety property holds (loss-only rule-outs are not claimed here: a reply later than the interval counts as lost).
