\* Reversed witness: start_packet returns the index without the phase base,
\* so the second phase writes the first phase's slots while the kernel owns
\* them.  Must violate NoWriteWhileKernelOwned.
SPECIFICATION MCSpec

CONSTANTS
    Phases       = 2
    Size         = 2
    MaxUpdates   = 4
    LateReap     = FALSE
    BaseRule     = FALSE
    QuotientRule = TRUE

INVARIANTS
    TypeOK
    NoWriteWhileKernelOwned
