\* A queued mark that leaves another slot's record of its address: that slot,
\* back at the address, still holds the mark the queued one replaced
\* (KernelHoldsMark).
SPECIFICATION MCSpec

CONSTANTS
    s1              = s1
    s2              = s2
    a1              = a1
    a2              = a2
    NONE            = NONE
    Slots           = {s1, s2}
    Addrs           = {a1, a2}
    MaxHigh         = 1
    SkipWhileOwed   = TRUE
    ClearOnAccept   = TRUE
    ForgetRefusable = TRUE
    MarkSupersedes  = FALSE
    ForgetSupersedes = TRUE

INVARIANT KernelHoldsMark
