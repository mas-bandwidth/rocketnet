\* MCRNBufferHandoff reversed witness: every hand-off attempt overwrites the Filling ring's destination, so a ring bound by a LATE attempt leaves for the address a later attempt passes. SentToCommitted falls. Must fail.
SPECIFICATION SpecFair

CONSTANTS
    N                 = 3
    Cap               = 2
    MaxItems          = 5
    MaxReady          = 2
    Direction         = "send"
    MainBlocks        = FALSE
    WorkUnderLock     = FALSE
    WriteAfterPublish = FALSE
    SkipWake          = FALSE
    ReleaseBeforeSent = FALSE
    DiscardOnStop     = FALSE
    DropFinal         = FALSE
    DestinationOverwrite = TRUE
    SkipRebind        = FALSE

INVARIANTS
    TypeOK
    OneOwner
    FreeIsEmpty
    ViewStable
    InOrder
    NoWorkUnderLock
    MainNeverWaits
    ExitSentAll
    SentToCommitted

PROPERTIES
    StopSendsAll
