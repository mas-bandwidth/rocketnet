\* The two-client liveness run: the MCServerSessionTwoClients.cfg constants
\* under LiveSpec, HandshakeResolves, one of the two liveness properties (one a run keeps each within
\* the record budget). BurstsDrain is MCServerSessionTwoClientsBursts.cfg.
SPECIFICATION LiveSpec
CONSTANTS
 SlotCount = 2
 MaxSessions = 2
 MaxTokens = 2
 MaxStarts = 1
 MaxCreates = 1
 DisconnectQueueCapacity = 1
 SealsPerUpdate = 1
 Defect = "none"
 UnresetField = "replay_window"
PROPERTIES HandshakeResolves
