\* Reversed witness for StepPossibleIsEnabled (finding 5): the v1.1
\* StepPossible, whose refusal disjunct held only under "SendKick", while a
\* refusal now moves the refusal count (Broken = "StaleStepPossible"). In a
\* state where only a refusal can be taken, StepPossible is FALSE and
\* ENABLED <<Next>>_vars TRUE. Must violate StepPossibleIsEnabled.
SPECIFICATION Spec
CONSTANTS
    Scenario = "mixed"
    Broken = "StaleStepPossible"
    SendCapacity = 2
    OrderedCapacity = 2
    HoldCapacity = 2
    TransportCaps = {1, 2}
INVARIANTS
    StepPossibleIsEnabled
CHECK_DEADLOCK FALSE
