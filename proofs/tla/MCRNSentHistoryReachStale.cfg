\* MCRNSentHistory reach witness: the concurrent instance (MCRNSentHistoryWriters.cfg)
\* reaches a stale refusal, so its RingHoldsNewest and overflow counting are
\* exercised. Must fail NoStaleRefusal (a reach predicate, not a rule).
SPECIFICATION Spec

CONSTANTS
    N                 = 4
    Threshold         = 2
    MaxSeq            = 7
    MaxLoss           = 2
    Flight            = 2
    AckRange          = 4
    AckSlots          = 2
    Writers           = 2
    CountEveryUnacked = FALSE
    RefuseWhenFull    = FALSE
    WriteStale        = FALSE

INVARIANT NoStaleRefusal
