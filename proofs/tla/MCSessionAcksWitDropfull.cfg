\* MCSessionAcksWitDropfull: wit-dropfull, a reversed witness. Witness "dropfull" on the
\* committed instance; expected to violate AckedMeansSurfaced.
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq      = 4
    SentRing    = 4
    BatchCap    = 1
    Window      = 4
    MaxRanges   = 2
    DrainCap    = 4
    Burns       = TRUE
    Witness     = "dropfull"
    D2RPattern  = "arbitrary"
    R2DPattern  = "arbitrary"
    Capacity    = 2
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = TRUE
    BurstStart  = 3
    BurstLen    = 2

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked
