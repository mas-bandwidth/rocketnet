SPECIFICATION SafetySpec
CONSTANTS
    Scenario = "refused"
    Broken = "None"
    SendCapacity = 4
    OrderedCapacity = 2
    HoldCapacity = 2
    TransportCaps = {1}
INVARIANTS
    StepPossibleIsEnabled
    TypeOK
    BuffersBounded
    SequencedNeverBackwards
    NoSequencedDuplicate
    ReliableExactlyOnce
    OrderedExactlyOnceInOrder
    OrderedTraceUnchangedBySequenced
    SequencedNewestWins
    EpochWatermark
    TransportAckClearsResend
    AckedImpliesTransportArrival
    InTurnOneRule
    SequencedArrivedAccounted
    SupersederKept
CHECK_DEADLOCK FALSE
