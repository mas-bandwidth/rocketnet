\* MCRNIocpRefQueue at four cells: two producers, one consumer, six pushes, so the queue fills and wraps its cells. Must pass.
SPECIFICATION Spec

CONSTANTS
    Cap         = 4
    PosMod      = 32
    InitSlack   = 0
    Producers   = {p1, p2}
    Consumers   = {c1}
    MaxTok      = 6
    Ops         = 6
    DropRefused = FALSE

INVARIANTS
    TypeOK
    NoOverwrite
    NoPhantom
    WithinCapacity
    CellsMatchPositions
    InqIsCells
    RefusedNeverLost
    RefusalOnlyWhilePopStalled
