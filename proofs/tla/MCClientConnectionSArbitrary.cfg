\* MCClientConnectionSArbitrary.cfg: MCClientConnection safety with two
\* attempts and arbitrary loss.  The state space is over the 110 s per-
\* commit budget; the reduced replacement
\* MCClientConnectionReachSArbitrary.cfg reaches CONNECTED with a payload
\* under the same constants.
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 2
    Deadline         = 5
    ServerDeadline   = 3
    MaxAttempts      = 2
    MaxNonces        = 2
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = TRUE
    Disconnects      = TRUE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "arbitrary"
    S2CPattern       = "arbitrary"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = TRUE
    Reordering       = TRUE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    SafetyInvariants
PROPERTIES
    StepsForwardOrFails
    DisconnectIsTerminal
    TimeoutPairing
    AcceptedUnderLiveKeys
    NoSendOnArrival
