\* Three addresses with the XDP sink's rule: a zero mark is refused in a
\* walk that refused a forget (rocketnet_xdp_replay_sink_mark). Every
\* invariant, GreetedSlotHasEntry included.
SPECIFICATION MCSpec

CONSTANTS
    s1              = s1
    s2              = s2
    a1              = a1
    a2              = a2
    a3              = a3
    NONE            = NONE
    Slots           = {s1, s2}
    Addrs           = {a1, a2, a3}
    MaxHigh         = 0
    SkipWhileOwed   = TRUE
    ClearOnAccept   = TRUE
    ForgetRefusable = TRUE
    MarkSupersedes  = TRUE
    ForgetSupersedes = TRUE
    OweOnRefusal    = TRUE
    ScanWhenOwedOnly = TRUE
    ZeroMarkWaitsForForgets <- MCZeroMarkWaits

INVARIANTS
    TypeOK
    ForgetNeverLost
    OneIdentityPerSlot
    KernelHoldsMark
    DistinctUnlessOwed
    KernelEntryOwned
    GreetedSlotHasEntry
