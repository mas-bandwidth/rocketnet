\* MCRNXdpReplay reversed witness: the walk never forgets a released slot.
\* Must fail ForgetQueuedAfterWalk: after the walk that follows the release,
\* the kernel still holds the released address's entry and no forget of it
\* is pending, with room in the buffer. ForgetOwedUntilApplied cannot fail
\* here (the walk never clears the slot's seen record, its seen disjunct),
\* and ReleasedSlotForgetsItsReplyMac fails in the same state, so it is left
\* out; MCRNXdpReplayBrokenUnmarkedNotForgotten.cfg keeps the reply-MAC
\* witness. A reconnect no longer depends on the forget, since the new
\* session's first mark replaces the old entry, so
\* NewSessionNeverDroppedByOldMark holds here too and stays listed.
\* MarkNeverAhead restates the forget rule and is left out
\* (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1          = A1
    Addresses   = {A1}
    MaxSeq      = 5
    W           = 2
    Sessions    = 2
    MaxInFlight = 2
    ForgetCapacity = 1
    ForgetFailureBudget = 1
    MarkFailureBudget = 0
    HeldReplyBudget = 0
    WalkForgets <- WalkForgetsBroken

INVARIANTS
    TypeOK
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    NewSessionNeverDroppedByOldMark
    ForgetQueuedAfterWalk

PROPERTIES
    KernelNeverWrites
