\* push_mark that links a refused resend at its class's tail, as if it had
\* been sent now, where its due-now stamp is below every send time: the
\* numbers on the wire are no longer in order of last send, and the walk's
\* stop at the first number not due can leave due numbers behind (Ordered).
SPECIFICATION MCSpec

CONSTANTS
    W                 = 4
    SelfTailFix       = TRUE
    TailOnEnd         = TRUE
    UnlinkClearsClass = TRUE
    InsertSetsClass   = TRUE
    MarkOnUnlink      = TRUE
    MarkOnPushTail    = TRUE
    MarkInitNone      = TRUE
    RefusedTakesMark  = TRUE
    RefusedBeforeMark = FALSE
    ParkContract      = TRUE

INVARIANT Ordered
