\* MCRNResendTimingChunkLate: the rule at the defaults with the chunk first
\* sent at 9.8 s (tick 98), late in its block's first timeout, as a block
\* paced out by the send budget over longer than the timeout (1 MiB at the
\* default 1000 kbps). Each record is timed from its own first send.
SPECIFICATION Spec

CONSTANTS
    Interval    = 1
    RtoInitial  = 1
    RtoMin      = 1
    RtoMax      = 3
    Timeout     = 100
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    ChunkFirst  <- ChunkFirstLate

INVARIANTS
    TypeOK
    ConfigAccepted
    AttemptsBeforeTimeout
    ResendGapBounded
    SmallNeverHeldByChunk
