\* MCRNResendTimingChunkLate: the defaults (one tick is 500 ms) with the chunk
\* first sent at 9 s (tick 18), late in its block's first timeout, as a block
\* paced out by the send budget over longer than the timeout. Each record is
\* timed from its own first send.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 20
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    ChunkFirst  <- ChunkFirstLate
INVARIANTS
    TypeOK
    ConfigAccepted
    AttemptsBeforeTimeout
    ResendGapBounded
    NoDueRecordHeld
