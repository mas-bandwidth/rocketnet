\* MCRNPortableRx on BSD: the wake is event-only, so the idle wait returns
\* on the wake or its 1 ms timeout alone, never on socket readability
\* (IdleWait = "timeout"). The instance of MCRNPortableRx.cfg otherwise,
\* the guard timeouts still off (Timeout = FALSE); invariants and both
\* liveness properties, delivery resting on the idle wait's timeout.
SPECIFICATION SpecFair

CONSTANTS
    NumBanks       = 3
    Cap            = 2
    Budget         = 1
    MaxDatagrams   = 4
    MaxChaff       = 2
    HoldOnFull     = TRUE
    ReturnWhenRead = TRUE
    QuitBeforeWake = TRUE
    WakeOnReturn   = TRUE
    Timeout        = FALSE
    IdleWait       = "timeout"
    BoundedRead    = TRUE

INVARIANTS
    TypeOK
    ExclusiveOwnership
    CursorInBank
    ExactDelivery
    MainLockIsBrief
    ReadBudget

PROPERTIES
    EveryDatagramDelivered
    StopCompletes
