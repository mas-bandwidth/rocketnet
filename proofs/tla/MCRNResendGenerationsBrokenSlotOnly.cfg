\* The ack follows the slot without comparing the number it holds: a stale
\* packet for number n acks n + W, written by the same descriptor at a later
\* generation, and frees that generation's fragment (NamedGenerationOnly).
SPECIFICATION MCSpec

CONSTANTS
    W                 = 4
    N                 = 6
    D                 = 2
    GenMax            = 6
    CheckNumber       = FALSE
    WindowSlack       = 0

CHECK_DEADLOCK FALSE

INVARIANT NamedGenerationOnly
