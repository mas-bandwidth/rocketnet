\* Reversed witness: the start takes the found chunk (rn_send_store_take)
\* before the descriptor test, and on no descriptor gives it back with
\* rn_send_store_free_checked. The chunk's generation is bumped (or fresh
\* raised past it) and the cursor lowered to it. Must violate
\* RefuseLeavesLayout.
SPECIFICATION MCSpec
VIEW View

CONSTANTS
    N             = 3
    Q             = 4
    GenMod        = 3
    FreshGuard    = TRUE
    LowerCursor   = TRUE
    ChunkSkipZero = TRUE
    DescSkipZero  = TRUE
    KeepFreeSlot  = TRUE
    CountQueueFull = TRUE
    StartOrder    = "chunkfirst"
    CountMod      = 1
    RefuseExhausts = FALSE

INVARIANTS
    TypeOK

PROPERTIES
    RefuseLeavesLayout
