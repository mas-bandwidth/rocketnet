\* The passing control one step outside the half-range assumption (Slack = 1): a superseder refused at the watermark leaves the in-turn block, as rn_sequenced_in_turn does.
SPECIFICATION MCSpec

CONSTANTS
    Mod         = 8
    CounterMod  = 32
    Net         = 2
    MaxSeqSends = 5
    MaxOrdSends = 4
    Starts      = {0, 6}
    Slack       = 1
    Broken      = "none"

INVARIANTS
    TypeOK
    SequencedInOrder
    NothingSilent
    HoldAhead
    InTurnBlockFresh
    WatermarkAligned
    StaleKeepsInTurnBlock
