\* MCRNBankFifoLayoutHandoffMaxReadyAll: rocketnet_buffer_handoff_publish with
\* max_ready = N, which its assert refuses.  It passes: the producer always
\* holds one buffer, so at most N - 1 are ready and the ready ring of N never
\* overflows; the free_count test refuses first.
SPECIFICATION Spec

CONSTANTS
    N         = 3
    ArrLen    = 3
    ConsMax   = 1
    MaxReady  = 3
    MaxPub    = 8
    FreeSlack = 0
    HeadMod   = 3
    TailMod   = 3
    PushKind  = "fifo"
    PopKind   = "fifo"
    InitKind  = "loop"

INVARIANTS
    TypeOK
    InBounds
    CountsInRange
    ExactlyOnePlace
    ReadyMatches
