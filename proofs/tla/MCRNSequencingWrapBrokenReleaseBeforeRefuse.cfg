\* rn_sequenced_in_turn releases a superseded in-turn block before the watermark test: a superseder the watermark then refuses as stale drops the block (the code releases only after the watermark and room checks).
SPECIFICATION MCSpec

CONSTANTS
    Mod         = 8
    CounterMod  = 32
    Net         = 2
    MaxSeqSends = 5
    MaxOrdSends = 4
    Starts      = {0, 6}
    Slack       = 1
    Broken      = "releaseBeforeRefuse"

INVARIANT StaleKeepsInTurnBlock
