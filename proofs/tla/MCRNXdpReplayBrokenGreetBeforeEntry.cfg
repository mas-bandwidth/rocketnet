\* MCRNXdpReplay reversed witness: the commit greets a first session whose
\* zero mark the kernel refused, so its address has no entry when the
\* greeted client sends its sequence 1. With the kernel dropping a session
\* packet that has no entry (DROPPED_NO_SESSION), it must fail
\* LiveSessionNeverDroppedForNoEntry: the greeting hold is what keeps a live
\* session's packets clear of the no-session drop. MarkNeverAhead restates
\* the hold and is left out so the run reaches the drop
\* (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1                = A1
    Addresses         = {A1}
    MaxSeq            = 2
    W                 = 2
    Sessions          = 1
    MaxInFlight       = 1
    ForgetCapacity    = 1
    ForgetFailureBudget = 0
    HeldReplyBudget = 0
    MarkFailureBudget = 1
    HoldGreetingUntilMarked <- HoldGreetingUntilMarkedBroken

INVARIANTS
    TypeOK
    ForgetOwedUntilApplied
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    LiveSessionNeverDroppedForNoEntry

PROPERTIES
    KernelNeverWrites
