\* MCRNRttFilterStandard: the filter of the code with the sampling of m9.1: an
\* acknowledged packet whose number was already acknowledged by another copy
\* gives no sample. Two numbers and two packets in flight, outages up to 4
\* ticks, loss: the filter refuses exactly the samples a real owed silence
\* delayed, and no outage poisons the estimate.
SPECIFICATION Spec
CONSTANTS
    Probe     = 3
    RttLow    = 0
    RttHigh   = 1
    OutageMax = 4
    M         = 2
    P         = 2
    Rule      = "owed"
    FirstAck  = FALSE
    DupSample = FALSE
INVARIANTS
    TypeOK
    NoSampleAcrossSilence
    RefuseOnlyAfterOwedSilence
    OutageNeverPoisons
