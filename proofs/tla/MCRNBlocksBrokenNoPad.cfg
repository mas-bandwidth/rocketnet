\* Reversed witness: MCRNBlocksWrap.cfg with Pad <- NoPad (the sender never
\* pads a span that crosses a multiple of B). The block is placed at 7 and
\* its span runs past the ring's end. TLC must fail SpanInsideRing.

SPECIFICATION Spec

CONSTANTS
    W            = 4
    F            = 2
    B            = 8
    Small        = 2
    Units        <- MCUnits
    PlaceByIndex = TRUE
    RingStart    <- MCRingStartLate
    Pad          <- NoPad
    FwdPattern   = "arbitrary"
    Capacity     = 2
    MaxDelay     = 0
    Duplication  = TRUE
    Reordering   = TRUE
    BurstStart   = 1
    BurstLen     = 2

INVARIANTS
    TypeOK
    SpanInsideRing
