\* MCRNRioWorker reversed witness: create's inline drain, its bound spent
\* with closesocket refused and nothing posted or outstanding, leaks the
\* whole lane instead of abandoning the socket (AbandonUnposted FALSE, the
\* drain before rocketnet_server_rio_create_abandoned_sockets).  The
\* constants of MCRNRioWorkerInlineStopUnposted.cfg.  Must fail
\* LeakOnlyAfterStalls: the leak happens with nothing kernel owned.
SPECIFICATION Spec

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 0
    Cap             = 1
    View            = 1
    MaxDatagrams    = 1
    MaxSends        = 0
    DrainBatch      = 2
    StopDrainWaits  = 1
    InlineStop      = TRUE
    BoundedStopDrain = TRUE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE
    AbandonUnposted <- AbandonUnpostedBroken

INVARIANTS
    TypeOK
    LeakOnlyAfterStalls
