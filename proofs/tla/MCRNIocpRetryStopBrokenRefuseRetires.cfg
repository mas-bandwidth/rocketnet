\* MCRNIocpRetryStop reversed witness: a refused push retires the operation, as rocketnet_iocp_post_receive did before the retry. Two operations wait on the retry queue; one worker's pass claims position 0 and stalls before freeing the cell, the other takes position 1, is refused the repost again and pushes at position 2, which is cell 0 again. The push is refused with the queue not full and the receive is retired while the server runs. RetiredOnlyByStop falls. Must fail.
SPECIFICATION Spec

CONSTANTS
    NumOps          = 2
    Workers         = {w1, w2}
    Cap             = 2
    PosMod          = 16
    MaxFail         = 3
    MaxComplete     = 2
    StopSlack       = 0
    ClaimBeforeStop = FALSE
    RefuseRetires   = TRUE
    CheckBeforeCount = FALSE

INVARIANT RetiredOnlyByStop
