\* Reversed witness: MCRNReceiveAllowanceCredit.cfg with CreditBound = FALSE
\* (a standalone ack is credited whatever the server sent). A flooder's acks
\* are never refused. TLC must fail AcksBounded.

SPECIFICATION Spec

CONSTANTS
    Correct      = {c1}
    Flooders     = {f1}
    B            = 1
    Factor       = 2
    MaxPkt       = 2
    T            = 2
    Horizon      = 4
    FloodPerTick = 1
    MaxNet       = 3
    MaxBack      = 1
    MaxReconnect = 1
    Refill       = TRUE
    CapFull      = TRUE
    PerClient    = TRUE
    Monotone     = TRUE
    MaxElicit    = 3
    Kinds        = {"pay", "ack", "ka", "dc"}
    AckCredit    = TRUE
    Control      = TRUE
    CreditBound  = FALSE
    ServerAckSpends = TRUE
    c1 = c1
    f1 = f1

INVARIANTS
    TypeOK
    AcksBounded
