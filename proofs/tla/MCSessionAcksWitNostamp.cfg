\* MCSessionAcksWitNostamp.cfg: the reversed witness of the stamp. The send
\* pass ignores standalone_ack_time: a debt carried in by a send pass that found
\* no room is paid by the update ack decision, a new accept raises it again, and
\* the send pass sends a second standalone ack to the peer in the same update.
\* OneStandalonePerUpdate is violated. The gate instance constants
\* (MCSessionAcks.cfg) with AckTiming on; MCSessionAcksTiming.cfg passes it.
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq      = 4
    SentRing    = 4
    BatchCap    = 1
    Window      = 4
    MaxRanges   = 2
    DrainCap    = 4
    Burns       = TRUE
    Witness     = "nostamp"
    D2RPattern  = "arbitrary"
    R2DPattern  = "arbitrary"
    Capacity    = 2
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = TRUE
    BurstStart  = 3
    BurstLen    = 2
    AckTiming   <- MCAckTiming

INVARIANTS
    OneStandalonePerUpdate
