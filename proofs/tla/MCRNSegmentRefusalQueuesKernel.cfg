\* The io_uring code with two queues on a kernel that refuses every
\* segmented send: d1 is queue 0's only destination, d2, d3 and d4 are
\* queue 1's.  Each queue counts its own refusals, so queue 1 turns
\* segmentation off once two of its destinations refused (KernelFallback per
\* queue), and queue 0, whose one destination counts once however many of
\* its runs were in the kernel together, keeps segmenting
\* (NoFallbackOnFewerDests).
SPECIFICATION Spec

CONSTANTS
    Dests          = {"d1", "d2", "d3", "d4"}
    Refusing       = {}
    KernelSegments = FALSE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"
    Slot           <- SlotDistinct
    Queue          <- QueueSplit
    AcceptedRule   = "transport"
    FallbackScope  = "queue"
    InFlight       = 2
    PlainFails     = TRUE

INVARIANTS
    TypeOK
    NoFallbackAfterAccepted
    NothingDropped
    RefusalsBounded
    KernelFallback
    NoFallbackOnFewerDests
