\* The code with two queues on a kernel that refuses every segmented send:
\* d1 is queue 0's only destination, d2, d3 and d4 are queue 1's.  Each
\* queue counts its own refusing destinations, so queue 1 turns segmentation
\* off once two of its destinations refused, and queue 0, whose one
\* destination can never reach the threshold, keeps segmenting
\* (KernelFallback per queue).
SPECIFICATION Spec

CONSTANTS
    Dests          = {"d1", "d2", "d3", "d4"}
    Refusing       = {}
    KernelSegments = FALSE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"
    Slot           <- SlotDistinct
    Queue          <- QueueSplit
    AcceptedRule   = "transport"
    FlagScope      = "queue"

INVARIANTS
    TypeOK
    NoFallbackAfterAccepted
    NothingDropped
    RefusedOnce
    KernelFallback
