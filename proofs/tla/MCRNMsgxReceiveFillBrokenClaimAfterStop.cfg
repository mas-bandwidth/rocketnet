\* MCRNMsgxReceiveFill with ClaimAfterStop (the code before R69): main claims a ready bank after its stop, and the worker exits with that bank in main's hands, read by no later update and counted by nobody. Must fail StopCounted.
SPECIFICATION Spec
CONSTANTS
    Sockets = 2
    Capacity = 3
    Batch = 2
    Budget = 3
    Buffer = 3
    MaxArrivals = 7
    MaxErrors = 2
    ReadPastRoom = FALSE
    PublishOverReady = FALSE
    HoldWithoutPublish = FALSE
    ClaimAfterStop = TRUE
INVARIANTS TypeOK StopCounted
