\* MCRNClientLinkStop reach case, not a property of the code: a copy leaves
\* through a send that returns nothing, so it can fail or be lost on the
\* way, and a burst whose every sent copy is dropped never frees the slot.
\* Must fail BurstReachesServer.
SPECIFICATION FairSpec
CONSTANTS
    Copies = 3
    Defect = "none"
INVARIANTS
    TypeOK
    BurstAccounted
PROPERTIES
    BurstReachesServer
