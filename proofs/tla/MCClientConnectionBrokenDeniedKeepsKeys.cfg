\* Reversed witness: the pre-fix denial keeps the keys and the ephemeral.
\* TLC must fail KeysErasedWhenDown. Timeouts are off and disconnects are
\* off, so the violation is a denial from state 3, not a timeout.
SPECIFICATION SpecDeniedKeepsKeys
CONSTANTS
    SendInterval     = 1
    Timeout          = 0
    Deadline         = 0
    ServerDeadline   = 0
    MaxAttempts      = 1
    MaxNonces        = 1
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = TRUE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = FALSE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    KeysErasedWhenDown
