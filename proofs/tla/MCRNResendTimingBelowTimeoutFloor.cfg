\* MCRNResendTimingBelowTimeoutFloor: a configuration the attempts rule
\* alone accepts and the code refuses. At the 100 ms tick (TimeoutFloor <-
\* TimeoutFloorFine, 1000 ms = 10 ticks) a timeout of 8 ticks (800 ms) meets
\* MinAttempts x RtoInitial = 4 x 2 = 8 but is under the 1000 ms floor of
\* rocketnet_message_validate_config_internal. It must fail
\* TypedConfigAccepted (ConfigAccepted read in a state) at the initial state.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 2
    RtoMin      = 1
    RtoMax      = 2
    Timeout     = 8
    MaxBackoff  = 1
    MinAttempts = 4
    TimeoutFloor <- TimeoutFloorFine
INVARIANTS
    TypedConfigAccepted
