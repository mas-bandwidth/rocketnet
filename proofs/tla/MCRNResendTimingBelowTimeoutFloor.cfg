\* MCRNResendTimingBelowTimeoutFloor: a config the validation rule without
\* its 1000 ms floor accepts and sdk/rocketnet_config.cpp refuses (one tick
\* is 100 ms): message_resend_delay_initial_ms 200 (2), reliable timeout
\* 800 ms (8). Four sends of the initial delay fit (4 x 2 = 8), but 800 ms is
\* below 1000 ms, so the code returns ROCKETNET_STATUS_CONFIG_OUT_OF_RANGE.
\* It must fail ConfigAccepted, in the initial state.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 2
    RtoMin      = 1
    RtoMax      = 2
    Timeout     = 8
    MaxBackoff  = 1
    MinAttempts = 4
    TimeoutFloor <- TimeoutFloorFine
INVARIANT
    ConfigAccepted
