\* The skipped slot's accepted mark is not recorded (the walk before
\* RecordSkip): its session ends before the slot's record takes the
\* address, and the kernel entry is left with no owner (KernelEntryOwned).
SPECIFICATION MCSpec

CONSTANTS
    s1              = s1
    s2              = s2
    a1              = a1
    a2              = a2
    NONE            = NONE
    Slots           = {s1, s2}
    Addrs           = {a1, a2}
    MaxHigh         = 1
    SkipWhileOwed   = TRUE
    ClearOnAccept   = TRUE
    ForgetRefusable = TRUE
    MarkSupersedes  = TRUE
    ForgetSupersedes = TRUE
    OweOnRefusal    = TRUE
    ScanWhenOwedOnly = TRUE
    RecordSkip      <- MCRecordSkipBroken

INVARIANT KernelEntryOwned
