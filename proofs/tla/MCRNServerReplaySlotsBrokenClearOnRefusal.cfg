\* The forget pass clearing the record whether or not the sink queued the
\* forget: a refused forget is never asked for again (ForgetNeverLost).
SPECIFICATION MCSpec

CONSTANTS
    s1              = s1
    s2              = s2
    a1              = a1
    a2              = a2
    NONE            = NONE
    Slots           = {s1, s2}
    Addrs           = {a1, a2}
    MaxHigh         = 1
    SkipWhileOwed   = TRUE
    ClearOnAccept   = FALSE
    ForgetRefusable = TRUE

INVARIANT ForgetNeverLost
