\* MCRNReceiveAllowanceFlood: the credits against a flooder. One flooder,
\* B = 1 byte a tick at Factor 2, one maximum packet of 2, T = 2 ticks, five
\* ticks; the server sends it up to three session packets (eliciting, and its
\* own standalone acks); it sends any of the four kinds at any size, one a
\* tick; one step back of the time argument, one slot reuse: its acks stay
\* bounded by what the server sent it, and neither the bytes nor the control
\* tokens mint. The slots are per client in the code (one struct indexed by
\* the client), so the correct client's isolation is the control's and
\* MCRNReceiveAllowanceBrokenShared's. MCRNReceiveAllowanceBrokenFreeAcks
\* and ServerAckCredits are this file with one constant flipped.

SPECIFICATION Spec

CONSTANTS
    Correct      = {}
    Flooders     = {f1}
    B            = 1
    Factor       = 2
    MaxPkt       = 2
    T            = 2
    Horizon      = 5
    FloodPerTick = 1
    MaxNet       = 1
    MaxBack      = 1
    MaxReconnect = 1
    Refill       = TRUE
    CapFull      = TRUE
    PerClient    = TRUE
    Monotone     = TRUE
    MaxElicit    = 3
    Kinds        = {"pay", "ack", "ka", "dc"}
    AckCredit    = TRUE
    Control      = TRUE
    CreditBound  = TRUE
    ServerAckSpends = TRUE
    c1 = c1
    f1 = f1

INVARIANTS
    TypeOK
    NoMint
    AcksBounded
