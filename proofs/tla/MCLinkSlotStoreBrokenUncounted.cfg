\* MCLinkSlotStoreBrokenUncounted.cfg: reversed witness that drops a send to a full store without counting it in store_refused, failing StoreAccounts.
SPECIFICATION SpecSlotStore
CONSTANTS
    Packets     = {1, 2, 3, 4, 5}
    Capacity    = 1
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = FALSE
    Pattern     = "none"
    BurstStart  = 1
    BurstLen    = 2
    MaxSeq      = 5
    StoreSlots  = 2
    Defect      = "uncounted_full"
INVARIANT StoreAccounts
