\* MCRNAckPhaseBrokenSweepBeforeGather: reversed witness: update_end sweeps before it gathers, so a
\* keep-alive lands on an endpoint whose blocks nobody applied yet. Must fail.
SPECIFICATION Spec

CONSTANTS
    Clients           = {c1, c2}
    Threads           = {t1, t2}
    NoOwner           = none
    NoClient          = noclient
    ClientOrder       <- MCClientOrder
    MaxArrivals       = 3
    MaxUpdates        = 2
    MaxResets         = 1
    Capacity          = 2
    NoOwnerCheck      = FALSE
    GatherByClient    = FALSE
    SweepBeforeGather = TRUE
    ResetNoFlush      = FALSE
    SpillNoFlush      = FALSE
    CountsBeforeApply = FALSE
    DrainTaken        = FALSE
    TakeTwice         = FALSE
    c1 = c1
    c2 = c2
    t1 = t1
    t2 = t2

INVARIANTS
    TypeOK
    NoSendBeforeApply
