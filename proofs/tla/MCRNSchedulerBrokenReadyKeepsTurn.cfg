\* Reversed witness: MCRNSchedulerKeepsSending.cfg with ReadyRotate = FALSE
\* (the numbered channel keeps the ready list's head while it has more,
\* instead of rejoining the back). Channel 0 always has a message queued, so
\* it takes every number and channel 1's message is never numbered. TLC must
\* fail NoStarvation. The code pops the channel off the turns and rejoins it
\* at the back (rn_ordered_write: rn_ready_remove_named, then rn_ready_push).

SPECIFICATION Spec

CONSTANTS
    NC             = 2
    Msgs           <- MCMsgsKeepsSending
    Refill         <- MCRefill
    ULevel         = 2
    W              = 1
    Cap            = 1
    UPerTick       = 1
    MaxLoss        = 1
    ChannelFIFO    = TRUE
    RtxSendOrder   = TRUE
    UnreliableLast = TRUE
    StallEndsPass  = FALSE
    ReadyRotate    = FALSE

INVARIANTS
    TypeOK
    UnreliableNotBlockedByWindow
    ClassOrderBeforePriority

PROPERTIES
    NoStarvation
