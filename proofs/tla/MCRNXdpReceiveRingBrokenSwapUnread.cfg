\* MCRNXdpReceiveRing reversed witness: a receive call swaps although the
\* bank main holds has a retained tail it has not read (the call's budget
\* ended inside the bank). The tail is emptied with the bank. Must fail
\* StagedBeforeClaimInView.
SPECIFICATION Spec

CONSTANTS
    F1         = F1
    F2         = F2
    F3         = F3
    Frames     = {F1, F2, F3}
    RingSize   = 2
    PeekMax    = 2
    StageCap   = 2
    FillSize   = 6
    Budget     = 1
    MaxPackets = 4
    LockBatch  = 1
    SwapUnread <- SwapUnreadBroken

INVARIANTS
    TypeOK
    StagedBeforeClaimInView
