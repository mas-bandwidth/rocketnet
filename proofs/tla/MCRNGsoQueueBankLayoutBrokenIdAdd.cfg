\* Reversed witness: the id is turn * S + slot + q (IdRule "add"), whose
\* remainder is not the queue. Must violate RouteMatches.
SPECIFICATION Spec
CONSTANTS
    Q = 2
    NB = 3
    S = 3
    Stride = 4
    Threads = {1, 2}
    Dests = {"a", "b"}
    QueueOf <- MCQueueOf
    Demand = 2
    MaxFlush = 3
    Skew <- MCSkew
    ClaimCmp = "ge"
    ClaimRule = "cas"
    SlotRule = "check"
    IdRule = "add"
    FlushRule = "joined"
INVARIANT TypeOK
INVARIANT OneProducer
INVARIANT InBounds
INVARIANT NoSharedSlot
INVARIANT NoForeignWrite
INVARIANT RouteMatches
INVARIANT NoWorkerWrite
INVARIANT StagedMatches
