\* MCLinkEveryNthBrokenCounter.cfg: reversed witness with a send counter that does not count the send it drops: from the 3rd send on every send is dropped, failing EveryNthDropped.
SPECIFICATION SpecEveryNth
CONSTANTS
    Packets     = {1, 2, 3, 4, 5, 6}
    Capacity    = 6
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = FALSE
    Pattern     = "everynth"
    BurstStart  = 1
    BurstLen    = 3
    MaxSeq      = 6
    StoreSlots  = 1
    Defect      = "skip_lost"
INVARIANT EveryNthDropped
