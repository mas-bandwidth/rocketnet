\* MCLinkEveryNthBrokenCounter.cfg: reversed witness with a send counter that overruns MaxSeq failing MCPatternsTypeOK.
SPECIFICATION SpecEveryNth
CONSTANTS
    Packets     = {1, 2, 3, 4, 5, 6}
    Capacity    = 6
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = FALSE
    Pattern     = "everynth"
    BurstStart  = 1
    BurstLen    = 3
    MaxSeq      = 6
    Defect      = "overrun"
INVARIANTS
    MCPatternsTypeOK
    InFlightBounded
