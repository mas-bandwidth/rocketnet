\* MCRNSendReserveBrokenRoomFirst: the recompute reads the room before the counts, so a frame staged between is counted twice (ReserveKept).
SPECIFICATION Spec

CONSTANTS
    Fillers   = {f1, f2}
    Reserve   = 2
    MaxFree   = 4
    MaxOwn    = 1
    MaxClaims = 2
    MaxRetire = 2
    MaxPhases = 2
    Chunk     = 1
    GuardWidth = 2
    RoomOnly      = FALSE
    SplitClaim    = FALSE
    RoomFirst     = TRUE
    OwnCountFirst = FALSE
    NoRefresh     = FALSE
    NoReread      = FALSE
    IndexTest     = FALSE
    NoFallback    = FALSE
    BatchCount    = FALSE
    NoTailReturn  = FALSE

INVARIANTS
    ReserveKept
