\* The server's handshake deadline at the full size: three candidates {3, 2, 1}, W 2, the longest walk 6 Ticks and Budget = 6 = N * W; Deadline 3 Ticks, at the code's timing (Timed = FALSE), capacities {1, 3} each way, one loss and one attacker send: the walk ends inside the deadline (safety only). Over the 110 s case budget on two workers, so it is timeout debt run every night (NIGHTLY-DEBT.tsv); MCRNPathProbeDeadline.cfg is the per-PR check at two candidates.
