\* MCRNSendReserveCalls reversed witness: a reserve cut to half a stalled queue's room is kept, never computed again from the formula. The opens before Init saw a room of two (three frames still in flight), so the reserve starts at one, and an open after the transport retires them sees the whole staging of five and leaves it there. Must fail ReserveRestored.
SPECIFICATION Spec

CONSTANTS
    Clients   = {0, 1}
    NQ        = 1
    Reserve   = 2
    MaxFree   = 5
    SeenInit  = 2
    Chunk     = 1
    Guard     = 1
    RoomOnly     = FALSE
    NoRefresh    = FALSE
    AbortReturns = FALSE
    TailLeak     = FALSE
    MinRoom      = FALSE
    StickyReserve = TRUE
    OwnUnbounded  = FALSE

CONSTRAINT Bound

INVARIANTS
    ReserveRestored
