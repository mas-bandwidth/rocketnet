\* MCRNXdpReceiveRing control where the pending term binds: a pending
\* return of two under three frames and an RX ring of three, so one peek
\* could name more frames than the pending return holds and only the
\* term in receive_limit keeps it in bounds. Not the code's ratio
\* (ROCKETNET_XDP_RECV_QUEUE_SIZE equals ROCKETNET_XDP_FILL_FRAMES): it
\* checks the term as written. Must pass.
SPECIFICATION Spec

CONSTANTS
    Frames   = {1, 2, 3}
    RingSize = 3
    StageCap = 3
    PendCap  = 2
    FillSize = 6

INVARIANTS
    TypeOK
    FrameConservation
    StagingInBounds
    PendingInBounds
    ConsumerNotBehind
    PendingReturnedEachPass
    FillNeverEmptyWhileFramesFree

PROPERTIES
    ReceiveNeverStalls
