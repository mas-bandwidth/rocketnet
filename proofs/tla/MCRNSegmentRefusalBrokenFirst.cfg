\* Reversed witness: the iocp transport before the per-destination rule
\* (v1.1.0 to v1.1.7). The refused run is resent plain, but the first
\* refusal turns USO off for every destination, so the accepting destination
\* sends plain. Must violate OtherDestinationUnaffected.
SPECIFICATION Spec

CONSTANTS
    Dests          = {g, b}
    Refusing       = {b}
    KernelSegments = TRUE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "first"

INVARIANTS
    TypeOK
    OtherDestinationUnaffected
