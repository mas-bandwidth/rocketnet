\* MCRNPacketLease reversed witness: retired, as on main before the fix, which
\* reads the old entry's fields as plain loads and then rereads the state.  An
\* insert that claims the entry between the state load and the reread makes
\* the field reads and its stores unordered, a data race even when the reread
\* discards the entry.  Must fail NoRacyRead.
SPECIFICATION Spec

CONSTANTS
    Capacity          = 4
    Threads           = {1, 2}
    Frames            = {1, 2}
    Vals              = {1, 2}
    HashSpread        = 1
    MaxOps1           = 2
    MaxOps2           = 1
    MaxResets         = 2
    EpochLimit        = 2
    UsedLimit         = 2
    UseCas            = TRUE
    ConsumeCas        = TRUE
    BumpEpoch         = TRUE
    EpochLimited      = TRUE
    RetiredOn         = TRUE
    RetiredValidates  = TRUE
    OnWriting         = {"skip"}
    ValidCallers      = FALSE
    AtomicFields      = FALSE

INVARIANTS
    TypeOK
    NoRacyRead
