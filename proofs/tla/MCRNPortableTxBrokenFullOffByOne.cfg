\* MCRNPortableTx reversed witness: the full test one packet late
\* (count = capacity + 1).  A bank takes capacity + 1 packets and the extra
\* one lands in the next bank's first slot.  Must fail ExactSend.
SPECIFICATION Spec

CONSTANTS
    NumBanks          = 3
    Cap               = 2
    Batch             = 2
    MaxPackets        = 6
    FullSlack         = 1
    HeadMod           = 3
    TailMod           = 3
    QuitUnderLock     = TRUE
    PublishBeforeQuit = TRUE
    PublishUntilSent  = TRUE
    RetryOnIdle       = TRUE
    WakeOnPublish     = TRUE
    Timeout           = FALSE

INVARIANTS
    InBounds
    TypeOK
    ExactSend
