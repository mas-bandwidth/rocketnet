\* MCRNPortableTx reversed witness: the tail position head + count never
\* wraps (no modulus) while a head advance keeps its modulus, so a push
\* writes past the end of a three-entry array. One rule changed. Must fail
\* InBounds.
SPECIFICATION Spec

CONSTANTS
    NumBanks          = 3
    Cap               = 2
    Batch             = 2
    MaxPackets        = 6
    FullSlack         = 0
    HeadMod           = 3
    TailMod           = 0
    QuitUnderLock     = TRUE
    PublishBeforeQuit = TRUE
    PublishUntilSent  = TRUE
    RetryOnIdle       = TRUE
    WakeOnPublish     = TRUE
    Timeout           = FALSE

INVARIANTS
    InBounds
