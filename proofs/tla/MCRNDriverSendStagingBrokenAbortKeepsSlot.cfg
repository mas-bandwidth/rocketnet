\* MCRNDriverSendStaging reversed witness: io_abort_packet does not take a
\* withdrawn frame out of the staging (AbortReturnsSlot FALSE). A frame the
\* link simulator took, or one maintenance aborted, is also flushed, and
\* WithdrawnNeverStaged falls. Must fail.
SPECIFICATION Spec

CONSTANTS
    MaxFrames                = 4
    MaxStaged                = 3
    MaxBurst                 = 2
    DisconnectAdvancesStaged = TRUE
    XdpBuffers               = 3
    FinishRecordsRefusal     = TRUE
    AbortReturnsSlot         = FALSE

INVARIANTS
    WithdrawnNeverStaged
