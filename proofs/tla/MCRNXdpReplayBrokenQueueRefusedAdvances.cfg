\* MCRNXdpReplay reversed witness: the walk's cache advances on a mark the
\* pending buffer refused to queue. Must fail MarkOwedUntilApplied: the
\* cache reads the new value, nothing is pending, and the next walk takes
\* nothing, so the entry stays behind the mark for good
\* (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1                = A1
    Addresses         = {A1}
    MaxSeq            = 3
    W                 = 2
    Sessions          = 2
    MaxInFlight       = 1
    ForgetCapacity    = 1
    MarkFailureBudget <- MarkFailureBudgetOne
    AdvanceOnQueueRefusal <- AdvanceOnQueueRefusalBroken

INVARIANTS
    TypeOK
    ForgetOwedUntilApplied
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    MarkOwedUntilApplied

PROPERTIES
    KernelNeverWrites
