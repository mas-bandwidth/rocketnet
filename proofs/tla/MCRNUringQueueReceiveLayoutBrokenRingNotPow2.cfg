\* Reversed witness: a ring of three buffers, which create refuses: the
\* mask B - 1 = 2 folds entries 0 and 1 into entry 0, so create's adds
\* leave buffer 1 there twice over and the kernel takes it twice.  Must
\* violate NoDoubleTake.
SPECIFICATION MCSpec

CONSTANTS
    S           = 3
    B           = 3
    TailWrap    = 8
    MaxArrive   = 5
    MaxSegs     = 2
    DrainMax    = 2
    RoomRule    = "refresh"
    SlotRule    = "mod"
    ReleaseRule = "next"
    CounterWrap = 0

INVARIANTS
    NoDoubleTake
