\* MCRNResendTimingSeeded: the rule at the current defaults (one tick is
\* 100 ms): message_resend_delay_initial_ms and message_resend_delay_max_ms
\* 2000 ms (20), reliable_timeout 10 s (100), and the transport's round trip first reported at 200 ms
\* (SeedAt 2) and giving a 300 ms resend delay (SeedRto 3, about a 45 ms
\* round trip). One record: the seed sets the one estimate both delay
\* classes read, and a chunk beside it at a 2 s RtoMax runs past the
\* 110-second budget. A record unacked when the seed arrives is resent
\* within 300 ms of it, and every 300 ms after until its own ack is
\* sampled. The reversed witness is MCRNResendTimingBrokenUnseeded.cfg.
SPECIFICATION Spec

CONSTANTS
    RtoInitial  = 20
    RtoMin      = 1
    RtoMax      = 20
    Timeout     = 100
    MaxBackoff  = 1
    MinAttempts = 4
    SeedAt      <- SeedAtEarly
    SeedRto     <- SeedRtoMeasured

INVARIANTS
    TypeOK
    ConfigAccepted
    AttemptsBeforeTimeout
    ResendGapBounded
    SeededGapBounded
