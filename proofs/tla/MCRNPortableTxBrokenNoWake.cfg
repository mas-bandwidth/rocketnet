\* MCRNPortableTx reversed witness: a successful publish does not signal the
\* worker.  With no wait timeout the worker never takes the bank.  Must fail
\* EveryAcceptedSent.
SPECIFICATION SpecFair

CONSTANTS
    NumBanks          = 3
    Cap               = 2
    Batch             = 2
    MaxPackets        = 6
    FullSlack         = 0
    HeadMod           = 3
    TailMod           = 3
    QuitUnderLock     = TRUE
    PublishBeforeQuit = TRUE
    RetryOnIdle       = TRUE
    WakeOnPublish     = FALSE
    Timeout           = FALSE

INVARIANTS
    InBounds
    TypeOK

PROPERTIES
    EveryAcceptedSent
