\* MCRNServerStats reversed witness: the records entering the window's top
\* edge are never counted, the first incremental version's defect. Must
\* fail CountedIsWindow. The committed MCRNServerStats.cfg with one
\* constant flipped.
SPECIFICATION Spec

CONSTANTS
    N              = 6
    MaxSeq         = 14
    MaxWrites      = 8
    Late           = FALSE
    Reorder        = FALSE
    SeqTimes       = TRUE
    BrokenEntering = TRUE
    BrokenCrossing = FALSE
    BrokenAlias    = FALSE

INVARIANTS
    CountedIsWindow
    RetainedIsNewest

PROPERTIES
    LateNeverShrinks
