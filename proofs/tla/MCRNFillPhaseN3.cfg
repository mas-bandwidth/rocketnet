\* MCRNFillPhaseN3: the committed run at three fillers, two clients and
\* three main operations.
SPECIFICATION Spec

CONSTANTS
    Fillers      = {f1, f2, f3}
    Clients      = {c1, c2}
    NoOwner      = none
    MaxMain      = 3
    MaxFills     = 2
    LookFirst    = FALSE
    LoadStore    = FALSE
    ResetOnLeave = TRUE
    NoEpochLook  = FALSE
    NoRestore    = FALSE
    ScanOne      = FALSE
    Lines        = {l1, l2}
    LineOf       <- MCLineOf
    f1 = f1
    f2 = f2
    f3 = f3
    l1 = l1
    l2 = l2

INVARIANTS
    TypeOK
    Sound
    OneFiller
    NoFalseAlarm
