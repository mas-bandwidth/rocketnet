\* Reversed witness: the claim counter wraps at S + 1, as a counter too
\* narrow for the claims one fill can make would (CounterWrap 4); the refused
\* claims carry it round to 0 and slot 0 is handed out a second time in the
\* same fill. Every destination is on queue 0 so one producer takes all six
\* starts. Must violate NoSharedSlot.
SPECIFICATION Spec
CONSTANTS
    Q = 2
    NB = 3
    S = 3
    Stride = 4
    Threads = {1, 2}
    Dests = {0}
    Demand = 3
    MaxFlush = 1
    SkewSpan = 0
    ClaimCmp = "ge"
    BlindStore = FALSE
    CounterWrap = 4
    SlotRule = "check"
    IdRule = "mul"
    FlushRule = "joined"
INVARIANT TypeOK
INVARIANT OneProducer
INVARIANT InBounds
INVARIANT NoSharedSlot
INVARIANT NoForeignWrite
INVARIANT RouteMatches
INVARIANT NoWorkerWrite
