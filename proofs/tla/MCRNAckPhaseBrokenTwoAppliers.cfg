\* MCRNAckPhaseBrokenTwoAppliers: reversed witness: no one-thread-per-client check; two threads
\* each read a client's list from the head and apply it, a block twice. Must fail.
SPECIFICATION Spec

CONSTANTS
    Clients           = {c1, c2}
    Threads           = {t1, t2}
    NoOwner           = none
    NoClient          = noclient
    ClientOrder       <- MCClientOrder
    MaxArrivals       = 3
    MaxUpdates        = 2
    MaxResets         = 1
    Capacity          = 2
    NoOwnerCheck      = TRUE
    GatherByClient    = FALSE
    SweepBeforeGather = FALSE
    ResetNoFlush      = FALSE
    SpillNoFlush      = FALSE
    CountsBeforeApply = FALSE
    DrainTaken        = FALSE
    TakeTwice         = FALSE
    c1 = c1
    c2 = c2
    t1 = t1
    t2 = t2

INVARIANTS
    TypeOK
    ArrivalOrder
