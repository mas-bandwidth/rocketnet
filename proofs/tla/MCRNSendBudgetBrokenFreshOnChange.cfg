\* Reversed witness: MCRNSendBudget.cfg with KeepTokens replaced by FALSE (a
\* change of kbps between two positive values refills the bucket whole
\* instead of keeping its tokens, capped at the new depth). Spend the
\* bucket, change the kbps, spend the fresh bucket: more than the window's
\* budget plus one depth goes out. TLC must fail NeverOverspend.

SPECIFICATION Spec

CONSTANTS
    W             = 2
    Rate          = 1
    Depth         = 2
    MaxPkt        = 2
    RelSize       = 2
    UnrelSize     = 1
    UPerTick      = 2
    MaxRel        = 2
    MaxLoss       = 1
    CheckBudget   = TRUE
    ReliableFirst = TRUE
    RefundOnFail  = TRUE
    MaxFail       = 1
    KeepTokens    <- BrokenKeep

INVARIANTS
    TypeOK
    NeverOverspend
