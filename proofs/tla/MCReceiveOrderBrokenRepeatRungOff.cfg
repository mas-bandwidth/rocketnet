\* Reversed witness: RepeatRungRefuses <- MCRepeatRungOff (FALSE), the
\* request path before 2026-11-13: a request refused past the verify because
\* its client id already holds a slot, or denied because no slot is free,
\* holds nothing, so a second request for the same token in the same update
\* passes every cheap rung and is verified again.  One valid token could
\* spend every verify of every update.  RepeatSpendsNoVerify must fail with
\* TLC's counterexample; CheapRefusalsFirst and WorkBudgetOnlyForVerify still
\* hold.
SPECIFICATION MCSpec

CONSTANTS
    PosRestart   = 1
    PosVersion   = 2
    PosTimestamps = 3
    PosCompares  = 4
    PosCookie    = 5
    PosUsed      = 6
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 10
    PosKeypair   = 11
    RepeatRungRefuses <- MCRepeatRungOff

INVARIANTS
    TypeOK
    CheapRefusalsFirst
    WorkBudgetOnlyForVerify
    RepeatSpendsNoVerify
