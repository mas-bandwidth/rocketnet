\* The reference test one past max_refs: the write overruns the oldest
\* live reference (RefsIntact).
SPECIFICATION MCSpec

CONSTANTS
    Part         = "sent"
    P            = 3
    R            = 2
    MaxRefs      = 4
    Rq           = 3
    SerialMod    = 4
    MaxWrites    = 6
    MaxEvents    = 0
    EvictAtP     = TRUE
    RefTestExact = FALSE
    ResetEmpty   = TRUE
    ReceiptClamp = TRUE
    SerialSkip   = TRUE

INVARIANT RefsIntact
