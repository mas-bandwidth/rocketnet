\* Reversed witness: the worker writes position tail into slot
\* (tail + 1) % S while main reads position p from slot p % S, an index
\* off by one.  Must violate InOrder.
SPECIFICATION MCSpec

CONSTANTS
    S           = 3
    B           = 2
    TailWrap    = 4
    MaxArrive   = 4
    MaxSegs     = 2
    DrainMax    = 2
    RoomRule    = "refresh"
    SlotRule    = "plus1"
    ReleaseRule = "next"
    CounterWrap = 0

INVARIANTS
    TypeOK
    InOrder
