\* MCRNPacketLease: resolve continues its probe past an entry in phase 1 (OnWriting
\* = skip), checked for every invariant with changed copies and every schedule.
SPECIFICATION Spec

CONSTANTS
    Capacity          = 4
    Threads           = {1, 2}
    Frames            = {1, 2}
    Vals              = {1, 2}
    HashSpread        = 1
    MaxOps1           = 2
    MaxOps2           = 1
    MaxResets         = 2
    EpochLimit        = 2
    UsedLimit         = 2
    UseCas            = TRUE
    ConsumeCas        = TRUE
    BumpEpoch         = TRUE
    EpochLimited      = TRUE
    RetiredOn         = FALSE
    RetiredValidates  = FALSE
    OnWriting         = "skip"
    ValidCallers      = FALSE

INVARIANTS
    TypeOK
    NoWrongSuccess
    TakeOnce
    NoRacyRead
    InsertFindsSlot
    PublishedIntact
    ChainIntact
    ProbeBound

