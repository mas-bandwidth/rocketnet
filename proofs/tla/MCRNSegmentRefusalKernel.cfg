\* The gso code on a kernel that refuses every segmented send, two of a
\* destination's runs in one batch: each destination pays at most two
\* refusals and counts once, no refusal drops its run, and segmentation is
\* off for the transport once two destinations refused, never sooner.
SPECIFICATION Spec

CONSTANTS
    Dests          = {d1, d2, d3}
    Refusing       = {}
    KernelSegments = FALSE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"
    Slot           <- SlotDistinct
    Queue          <- QueueOne
    AcceptedRule   = "transport"
    FallbackScope  = "transport"
    InFlight       = 2
    PlainFails     = TRUE

INVARIANTS
    TypeOK
    NothingDropped
    RefusalsBounded
    KernelFallback
    NoFallbackOnFewerDests
