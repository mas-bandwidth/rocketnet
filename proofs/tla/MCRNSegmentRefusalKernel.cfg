\* The gso code on a kernel that refuses every segmented send: each
\* destination pays one refusal, no refusal drops its run, and segmentation
\* is off for the transport once two destinations refused, never sooner.
SPECIFICATION Spec

CONSTANTS
    Dests          = {d1, d2, d3}
    Refusing       = {}
    KernelSegments = FALSE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"
    Slot           <- SlotDistinct
    Queue          <- QueueOne
    AcceptedRule   = "transport"
    FallbackScope  = "transport"
    InFlight       = 1
    PlainFails     = TRUE

INVARIANTS
    TypeOK
    NothingDropped
    RefusalsBounded
    KernelFallback
    NoFallbackOnFewerDests
