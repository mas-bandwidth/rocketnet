\* The code on a kernel that refuses every segmented send: each
\* destination pays one refusal, nothing is dropped, and segmentation is
\* off for the transport once two destinations refused.
SPECIFICATION Spec

CONSTANTS
    Dests          = {d1, d2, d3}
    Refusing       = {}
    KernelSegments = FALSE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"

INVARIANTS
    TypeOK
    NothingDropped
    RefusedOnce
    KernelFallback
