\* Reversed witness: ClaimAtRequest <- MCTokenClaimRemoved (FALSE), the
\* request path before the token was claimed at the request.  One token
\* presented from two addresses buys two live half-open mappings, so
\* OneLiveMappingPerToken must fail with TLC's counterexample.
SPECIFICATION MCSpec

CONSTANTS
    PosRestart   = 1
    PosVersion   = 2
    PosTimestamps = 3
    PosCompares  = 4
    PosCookie    = 5
    PosUsed      = 6
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 10
    PosKeypair   = 11
    ClaimAtRequest <- MCTokenClaimRemoved

INVARIANTS
    TypeOK
    CheapRefusalsFirst
    OneLiveMappingPerToken
