\* No max_clients cap: three sources with distinct bits take three replies against max_clients 2.
SPECIFICATION MCSpec

CONSTANTS
    Sources      = {1, 2, 3}
    MaxClients   = 2
    Bits         = 4
    WordBits     = 2
    HashRange    = 8
    VerifyBudget = 1
    Broken       = "noglobal"

INVARIANT GlobalCapHeld
