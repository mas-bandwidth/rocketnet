\* Reversed witness: the io_uring transport before the per-destination
\* rule dropped the refused run instead of resending it plain. Must violate
\* NothingDropped.
SPECIFICATION Spec

CONSTANTS
    Dests          = {g, b}
    Refusing       = {b}
    KernelSegments = TRUE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "transport"
    Slot           <- SlotDistinct
    Queue          <- QueueOne
    AcceptedRule   = "transport"
    FallbackScope  = "transport"
    InFlight       = 1
    PlainFails     = FALSE

INVARIANTS
    TypeOK
    NothingDropped
