\* Spacing at K = 3: two loss bursts of either kind inside a window of one spacing collect at most two counted strikes, so nothing the path carries is ruled out (safety).
SPECIFICATION Spec

CONSTANTS
    ClientSet     = {2, 1}
    ServerList    = {2, 1}
    CapsUp        = {1, 2}
    CapsDown      = {1, 2}
    K             = 3
    MaxBursts     = 2
    BurstSpacings = 1
    AttackBudget  = 0
    Forger        = FALSE
    Timed         = TRUE
    Broken        = "none"

INVARIANTS
    TypeOK
    RaisedWithinPath
    ServerNeverAhead
    FailOnlyAtP0
    NeverAtRuledOut
    ReplyOnlyConnected
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate
    NoWrongRuleOut

PROPERTIES
    PNeverDecreases
    StrikeNeedsSmall
    StrikeNeedsSpacing
    ServerRaisesOnConfirm
    ClientRaisesOnAuthLarge
    NoProbeAfterDone
