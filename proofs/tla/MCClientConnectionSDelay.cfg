\* MCClientConnectionSDelay.cfg: MCClientConnection safety with KindLoss
\* "none", C2SPattern "first", S2CPattern "first" and a tick of latency.  At
\* Timeout 2 the idle timeout fires before the cookie-carrying request goes
\* out, so the case covers the handshake up to that timeout and never
\* CONNECTED.  The connected-with-a-payload reachability witness under these
\* constants is MCClientConnectionReachSDelay.cfg (Timeout 3).
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 2
    Deadline         = 4
    ServerDeadline   = 3
    MaxAttempts      = 1
    MaxNonces        = 2
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "first"
    S2CPattern       = "first"
    Capacity         = 2
    MaxDelay         = 1
    Duplication      = TRUE
    Reordering       = TRUE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    SafetyInvariants
PROPERTIES
    StepsForwardOrFails
    DisconnectIsTerminal
    TimeoutPairing
    AcceptedUnderLiveKeys
    NoSendOnArrival
