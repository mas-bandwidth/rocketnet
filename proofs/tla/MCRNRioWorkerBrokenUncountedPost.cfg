\* MCRNRioWorker reversed witness: a send post the kernel refuses is lost
\* uncounted, as if rocketnet_rio_post_phase freed the slot without
\* counting SEND_FAILED.  One staged send; the stop burst's post is
\* refused and the worker exits with it neither retired nor counted.  Must
\* fail StopSendsFinished.
SPECIFICATION Spec

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 1
    Cap             = 1
    View            = 2
    MaxDatagrams    = 0
    MaxSends        = 1
    DrainBatch      = 2
    StopDrainWaits  = 2
    InlineStop      = FALSE
    BoundedStopDrain = TRUE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE
    CountRefusedPost <- CountRefusedPostBroken

INVARIANTS
    TypeOK
    StopSendsFinished
