\* Reversed witness of the trace check: the record's add changes the
\* published word, as code that publishes before its last add would log.
\* Must violate TraceConsistent, at record 4.
SPECIFICATION TraceSpec

CONSTANTS
    Readers       = {1}
    Addrs         = {1, 2, 3}
    Cap           = 4
    MaxEntries    = 2
    HomeAt        = {7, 11, 12}
    MaxUpdates    = 1000000
    MaxRefused    = 1000000
    HalfPublished = FALSE
    NoRecheck     = FALSE
    LookupNoWrap  = FALSE
    TraceLog      <- BadLog

INVARIANTS
    TraceConsistent
