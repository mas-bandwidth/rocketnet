\* Reversed old rule: used-token history holds every connected token until expiry.
\* MCServerConnection: the committed run. Two clients contend for one slot
\* and reuse it after a disconnect or a timeout from either side.
\* README-ServerConnection.md lists the other runs as edits to this file.
SPECIFICATION Spec

CONSTANTS
    NumClients          = 3
    NumAddrs            = 3
    NumTokens           = 3
    MaxSlots            = 1
    MapCap              = 1
    HeldCapacity        = 2
    MaxAttempts         = 1
    MaxNonces           = 2
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 1
    HandshakeDeadline   = 0
    Disconnects         = FALSE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "own"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = TRUE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2

INVARIANTS
    ChurnNeverDenied

CHECK_DEADLOCK FALSE
