\* The passing control at capacity 0 .. 2 up and 3 down, the rest of MCRNPathProbe.cfg's instance; three candidates on both lists, one loss burst, one attacker send; the same checks. The capacities are fixed for a behaviour, so the split loses no behaviour; split on the down capacity on 2026-11-26 when the re-try took the case to 60 s and over, past 60% of the case budget on a loaded bench.
SPECIFICATION FairSpec

CONSTANTS
    ClientSet     = {3, 2, 1}
    ServerList    = {3, 2, 1}
    CapsUp        = {0, 1, 2}
    CapsDown      = {3}
    K             = 2
    MaxBursts     = 1
    AttackBudget  = 1
    AttackKinds   = {"replay", "probe", "reply"}
    Forger        = FALSE
    Timed         = TRUE
    LossBound     = TRUE
    MaxReuses     = 0
    ReuseCapsUp   = {}
    ReuseCapsDown = {}
    Broken        = "none"

INVARIANTS
    TypeOK
    RaisedWithinPath
    ServerNeverAhead
    NoWrongRuleOut
    FailOnlyAtP0
    NeverAtRuledOut
    NeverAboveRuled
    RuledIsTheNextStep
    ReplyOnlyConnected
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate

PROPERTIES
    PNeverDecreases
    StrikeNeedsSmall
    ServerRaisesOnConfirm
    ClientRaisesOnAuthLarge
    NoProbeAfterDone
    NoSkippedStep
    Converges
    ReachesBest
    FailsWhenP0NotCarried
