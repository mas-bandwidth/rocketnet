\* Any sink, without the XDP sink's zero-mark rule: a skipped slot's zero
\* mark is taken while its forget is refused, the slot moves again with
\* that skip forget refused too, and its Blocked session is greeted with no
\* kernel entry (GreetedSlotHasEntry).
SPECIFICATION MCSpec

CONSTANTS
    s1              = s1
    s2              = s2
    a1              = a1
    a2              = a2
    a3              = a3
    NONE            = NONE
    Slots           = {s1, s2}
    Addrs           = {a1, a2, a3}
    MaxHigh         = 0
    SkipWhileOwed   = TRUE
    ClearOnAccept   = TRUE
    ForgetRefusable = TRUE
    MarkSupersedes  = TRUE
    ForgetSupersedes = TRUE
    OweOnRefusal    = TRUE
    ScanWhenOwedOnly = TRUE

INVARIANT GreetedSlotHasEntry
