\* MCRNServerSendFairRounds: the rounds of one flush at the code's index
\* arithmetic. Four slots, slot 2 not connected, three frames a flush, up to
\* two frames due a slot, three flushes from every work.
SPECIFICATION Spec

CONSTANTS
    N        = 4
    K        = 3
    Mode     = "rounds"
    MaxTicks = 3
    Dark     = {}
    Conn     = {0, 1, 3}
    WorkMax  = 2

INVARIANTS
    TypeOK
    SameOrder
    OnlyLastWriters
    EndedWritesNothing
    CursorAsFullWalk
    VisitsBounded
