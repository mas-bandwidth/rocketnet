\* MCRNServerSendFairRounds: the rounds of one flush at the code's index arithmetic.
\* Four slots, slot 2 not connected, three frames a flush, up to two frames
\* due a slot.
SPECIFICATION Spec

CONSTANTS
    N       = 4
    K       = 3
    Conn    = {0, 1, 3}
    WorkMax = 2
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "rounds"
    Q1      = {}
    K1      = 0
    QueueRule = "perqueue"

INVARIANTS
    TypeOK
    FairService
    NoUnitWasted
    OtherClientUnaffected
    DarkTakesOnlyItsProbes
    SameOrder
    OnlyLastWriters
    EndedWritesNothing
    CursorAsFullWalk
    VisitsBounded
