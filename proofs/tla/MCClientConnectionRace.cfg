\* MCClientConnectionRace.cfg: the family race. A token naming both families on a host
\* with both, the IPv6 route broken (only IPv4 answers): the client commits to
\* IPv4 on its cookie and connects (Connects), and never sends a request with
\* a cookie on two families (OneRequestFamily).
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 0
    Deadline         = 0
    ServerDeadline   = 0
    MaxAttempts      = 1
    MaxNonces        = 1
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "firstkind"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
    RaceFamilies      <- MCBothFamilies
    ReachableFamilies <- MCIpv4Reachable
INVARIANTS
    SafetyInvariants
PROPERTIES
    Connects
