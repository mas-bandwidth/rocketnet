\* MCRNWriterFinishBrokenCountsBadBytes: reversed witness: a bad bytes_written on a start that found no capacity is counted as no
\* capacity (the defect fixed in fix/v1.1.x/writer-finish), and BadBytesNeverRefused falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Writers          = {w1, w2}
    Clients          = {c1, c2}
    NoOwner          = none
    Capacity         = 2
    MaxStarts        = 5
    SealAtFinish     = TRUE
    RefuseNoCapacity = TRUE
    CheckOwner       = TRUE
    Buffered         = FALSE
    RingRefuses      = FALSE
    Budgeted         = FALSE
    RestartAtFinish  = TRUE
    ValidateFirst    = FALSE

INVARIANTS
    TypeOK

PROPERTIES
    BadBytesNeverRefused
