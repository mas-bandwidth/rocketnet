\* Reversed witness: the push index hHead + hCount without the modulus,
\* so once hHead has moved a push lands past the ring and the receive is
\* lost.  Must violate HeldMatches.
SPECIFICATION MCSpec

CONSTANTS
    CqCap     = 4
    HeldCap   = 3
    Buffers   = 3
    Room      = 2
    Seg       = 1
    Budget    = 3
    MaxRecv   = 6
    MaxSends  = 2
    HoldRule  = TRUE
    HeldMod   = FALSE

INVARIANTS
    TypeOK
    HeldMatches
