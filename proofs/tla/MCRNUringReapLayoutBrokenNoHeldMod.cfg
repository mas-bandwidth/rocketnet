\* Reversed witness: the push index hHead[q] + hCount[q] without the
\* modulus, so once hHead[q] has moved a push lands past the queue's ring
\* and the receive is lost.  Must violate HeldMatches.
SPECIFICATION MCSpec

CONSTANTS
    CqCap     = 4
    Q         = 2
    HeldCap   = 2
    Buffers   = 3
    Room      = 2
    Seg       = 1
    Budget    = 3
    MaxRecv   = 6
    MaxSends  = 2
    HoldRule  = TRUE
    HeldMod   = FALSE
    TurnRule  = TRUE

INVARIANTS
    TypeOK
    HeldMatches
