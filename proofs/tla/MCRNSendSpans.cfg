\* MCRNSendSpans: the committed run, every rule on. The reversed witnesses
\* (FloorAtOldest, PadOnWrap, SpliceBoth each FALSE in turn) are the
\* MCRNSendSpansBroken*.cfg files beside this one.
\* VIEW View leaves out the dead span fields of descriptors that are not
\* live (RNSendSpans View); the witnesses run without it.
SPECIFICATION Spec
VIEW View

CONSTANTS
    SR            = 96
    Lengths       = {1, 32, 48, 96}
    Q             = 4
    FloorAtOldest = TRUE
    PadOnWrap     = TRUE
    SpliceBoth    = TRUE
    RefuseExhausts = FALSE
    LinkFirst     = FALSE
    CountMod      = 1
    UndoTail      = TRUE
    LinkClearsNext = TRUE

INVARIANTS
    TypeOK
    LiveSpansDisjoint
    SpanInsideRing
    Aligned
    HeadIsOldestStart
    ListInAllocationOrder
    EmptyIsZero
    FullAdmitsNothing
    IdleAdmitsAnyMessage
    LiveBetweenHeadAndTail
    SpansNeverExhaust
