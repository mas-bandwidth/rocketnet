\* MCRNIocpRetryStop reversed witness: pop_before tests the stop after its CAS. A pass claims the position at its stop and returns false without reposting it, and that retry is lost. RetryOwned falls. Must fail.
SPECIFICATION Spec

CONSTANTS
    NumOps          = 2
    Workers         = {w1, w2}
    Cap             = 2
    PosMod          = 16
    MaxFail         = 2
    MaxComplete     = 2
    StopSlack       = 0
    ClaimBeforeStop = TRUE

INVARIANT RetryOwned
