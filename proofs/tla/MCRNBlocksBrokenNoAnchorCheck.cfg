\* Reversed witness: MCRNBlocksForged.cfg with AnchorCheck <- AnchorCheckOff
\* (the receiver never compares a chunk's count with its anchor's). A forged
\* count of 2 opens the block's anchor; one correct chunk completes it and
\* two of its three fragments are delivered. TLC must fail NoPartialDelivery.

SPECIFICATION Spec

CONSTANTS
    W            = 4
    F            = 2
    B            = 8
    Small        = 2
    Units        <- MCUnits
    PlaceByIndex = TRUE
    Forge        <- ForgeOn
    AnchorCheck  <- AnchorCheckOff
    FwdPattern   = "arbitrary"
    Capacity     = 2
    MaxDelay     = 0
    Duplication  = TRUE
    Reordering   = TRUE
    BurstStart   = 1
    BurstLen     = 2

INVARIANTS
    TypeOK
    NoPartialDelivery
