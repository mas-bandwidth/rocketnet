\* Reversed witness: MCRNBlocksForged.cfg with AnchorCheck <- AnchorCheckOff
\* (the receiver never compares a chunk's count with its anchor's). A correct
\* chunk opens the block's anchor at count 3; a forged copy of another of its
\* fragments claiming count 2 arrives next, the chunks in reach its count, and
\* two of the three fragments are delivered. TLC must fail NoPartialDelivery.

SPECIFICATION Spec

CONSTANTS
    W            = 4
    F            = 2
    B            = 8
    Small        = 2
    Units        <- MCUnits
    PlaceByIndex = TRUE
    Forge        <- ForgeOn
    AnchorCheck  <- AnchorCheckOff
    FwdPattern   = "arbitrary"
    Capacity     = 2
    MaxDelay     = 0
    Duplication  = TRUE
    Reordering   = TRUE
    BurstStart   = 1
    BurstLen     = 2

INVARIANTS
    TypeOK
    NoPartialDelivery
