\* MCSessionAcksTiming.cfg: the receiver update in its steps (AckTiming): the
\* update ack decision, the message layer accepting what arrived, then the
\* send pass (TRANSPORT.md t15.4). SameUpdateAck and OneStandalonePerUpdate
\* hold beside every ack-window invariant. The gate instance constants with
\* three sequences, so the run fits its budget; the reversed witnesses are
\* MCSessionAcksWitLateorder.cfg and MCSessionAcksWitNostamp.cfg.
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq      = 3
    SentRing    = 4
    BatchCap    = 1
    Window      = 4
    MaxRanges   = 2
    DrainCap    = 4
    Burns       = TRUE
    Witness     = "none"
    D2RPattern  = "arbitrary"
    R2DPattern  = "arbitrary"
    Capacity    = 2
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = TRUE
    BurstStart  = 3
    BurstLen    = 2
    AckTiming   <- MCAckTiming

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked
    RepeatExact
    OneStandalonePerUpdate

PROPERTIES
    SameUpdateAck
