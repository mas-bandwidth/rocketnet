\* Reversed witness: MCRNScheduler.cfg with ChannelFIFO = FALSE (lost items
\* offered independently at their own levels). Once both of channel 0's
\* items (CONFIG and the MEDIUM message) are lost, RtxHeadBoost must fail.

SPECIFICATION Spec

CONSTANTS
    NC             = 2
    Msgs           <- MCMsgs
    ULevel         = 2
    W              = 2
    Cap            = 1
    UPerTick       = 1
    MaxLoss        = 2
    ChannelFIFO    = FALSE
    RtxSendOrder   = TRUE
    UnreliableLast = TRUE

INVARIANTS
    TypeOK
    RtxHeadBoost
