\* Partitioned arrival obligation; every datagram and state remains modeled.
SPECIFICATION SpecFair

CONSTANTS
    NumSlots           = 2
    BufferCap          = 1
    MaxDatagrams       = 3
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = FALSE
    SwapNeedsReady     = FALSE
    HandOffWaits       = FALSE
    FullWaitReadable   = FALSE
    StepDriven          = FALSE
    StepModeStartsThread = FALSE

INVARIANTS
    TypeOK
    NoReuseBeforeSent
    ExposedStable
    FreedOnlyAfterJoin
    HandOffNeverWaits
    FullWaitsOnWake
    NoReceiveStall
    SentToCommitted

PROPERTIES
    ArrivedLast
