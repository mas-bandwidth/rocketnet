\* MCRNXdpReceiveRing reversed witness: a try-acquire that missed the
\* worker's hold gives up the bank main holds instead of keeping it for the
\* retry. The bank then has no owner. Must fail BankOneOwner.
SPECIFICATION Spec

CONSTANTS
    F1         = F1
    F2         = F2
    F3         = F3
    Frames     = {F1, F2, F3}
    RingSize   = 2
    PeekMax    = 2
    StageCap   = 2
    FillSize   = 6
    Budget     = 1
    MaxPackets = 4
    SpinMax    = 2
    TryArrivals = 1
    Stall      = TRUE
    MissDropsBank <- MissDropsBankBroken

INVARIANTS
    TypeOK
    BankOneOwner
