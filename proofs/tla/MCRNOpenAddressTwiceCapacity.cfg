\* MCRNOpenAddress at the code's load factor: the clear-first erase (the
\* encryption map, the token index) with index_cells = 2 * capacity. Capacity
\* 4 (four keys, at most four live) in eight cells; homes chosen at Init from
\* every map of keys to cells.
SPECIFICATION Spec

CONSTANTS
    Keys       = {1, 2, 3, 4}
    N          = 8
    NoWrapTest = FALSE
    ClearLast  = FALSE
    MaxLive    = 4

INVARIANTS
    TypeOK
    Findable
    Unique
    EraseEnds
