\* Reversed witness: MCRNScheduler.cfg with StallEndsPass = TRUE (a stalled
\* window ends the update's pass, as a budget refusal does). Two numbers are
\* in flight (the window), a third message is queued and stalled, an
\* unreliable item has arrived and the budget has an item left: the update
\* ends and drops the unreliable item. The code ends the reliable phase there
\* (rn_endpoint_ordered_due false) and rn_endpoint_end_reliable starts the
\* unreliable phase, since no reliable packet waits on the budget. TLC must
\* fail UnreliableNotBlockedByWindow.

SPECIFICATION Spec

CONSTANTS
    NC             = 2
    Msgs           <- MCMsgs
    ULevel         = 2
    W              = 2
    Cap            = 1
    UPerTick       = 1
    MaxLoss        = 0
    ChannelFIFO    = TRUE
    RtxSendOrder   = TRUE
    UnreliableLast = TRUE
    StallEndsPass  = TRUE

INVARIANTS
    TypeOK
    UnreliableNotBlockedByWindow
