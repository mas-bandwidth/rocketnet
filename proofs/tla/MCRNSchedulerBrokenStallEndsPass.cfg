\* Reversed witness: MCRNScheduler.cfg with StallEndsPass = TRUE (a stalled
\* window ends the update's pass, as a budget refusal does). CONFIG and
\* channel 1's message are in flight (2 numbers, the window; channel 0 rejoined
\* the turns behind channel 1), channel 0's message is queued and stalled, an
\* unreliable item has arrived and the budget has an item left: the update
\* ends and drops the unreliable item.
\* The code ends the reliable phase there (rn_endpoint_ordered_due false) and
\* rn_endpoint_end_reliable starts the unreliable phase, since no reliable
\* packet waits on the budget. TLC must fail UnreliableNotBlockedByWindow.

SPECIFICATION Spec

CONSTANTS
    NC             = 2
    Msgs           <- MCMsgs
    Refill         <- MCNoRefill
    ULevel         = 2
    W              = 2
    Cap            = 1
    UPerTick       = 1
    MaxLoss        = 0
    ChannelFIFO    = TRUE
    RtxSendOrder   = TRUE
    UnreliableLast = TRUE
    StallEndsPass  = TRUE
    ReadyRotate    = TRUE

INVARIANTS
    TypeOK
    UnreliableNotBlockedByWindow
