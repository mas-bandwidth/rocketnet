\* MCRNDestroyWipeBrokenWipeEverySlot: reversed witness: the slots' destroy wipes every slot, writing a slot page the run never touched; fails ShutdownPeakWithinRun
SPECIFICATION Spec

CONSTANTS
    Pages              = {1, 2, 3, 4, 5, 6}
    Maps               = {1, 2}
    KeyPage            = 1
    RingPages          = {2}
    EntryPage          <- MCEntryPage
    SlotPage           <- MCSlotPage
    WipeWholeBlock     = FALSE
    WipeOnRemove       = TRUE
    WipeLiveAtDestroy  = TRUE
    WipeSlotOnRelease  = TRUE
    WipeSlotsAtDestroy = TRUE
    WipeEverySlot      = TRUE
    WipeRingOnLeave    = TRUE
    WipeRingAtDestroy  = TRUE

INVARIANTS
    TypeOK
    SecretsZeroAtFree
    ShutdownPeakWithinRun
    NoSecretOutsideLive
    RingCopyOnlyWhileWaiting
