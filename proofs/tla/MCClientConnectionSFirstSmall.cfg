\* MCClientConnectionSFirstSmall.cfg: MCClientConnection safety with
\* duplication and reordering on and loss on the first packet of each link
\* (C2SPattern and S2CPattern "first"), sized to the 110 s budget: one
\* nonce, one client id, no other clients and no application disconnects.
\* The full-environment cases with duplication (MCClientConnectionSFirst.cfg,
\* SFirstkind, SDelay) reach connected since the early send (TRANSPORT.md
\* t11 rule 7) and are bench debt; this case keeps duplicated and reordered
\* cookies and challenges, the arrivals the early send is bounded against,
\* in the required set.  MCClientConnectionReachSFirstSmall.cfg shows it
\* reaches connected through both early sends.
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 2
    Deadline         = 5
    ServerDeadline   = 3
    MaxAttempts      = 1
    MaxNonces        = 1
    MaxIds           = 1
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = FALSE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "first"
    S2CPattern       = "first"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = TRUE
    Reordering       = TRUE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    SafetyInvariants
PROPERTIES
    StepsForwardOrFails
    DisconnectIsTerminal
    TimeoutPairing
    AcceptedUnderLiveKeys
    NoSendOnArrival
