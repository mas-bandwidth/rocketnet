\* MCRNClientIo reversed witness: the wait of the second draft, which
\* returns on socket readable or the wake whatever the buffer holds.  With
\* the buffer full, no Free buffer and datagrams left in the socket, the
\* wait returns at once and the I/O thread spins until update returns a
\* buffer: FullWaitsOnWake falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    NumSlots           = 2
    BufferCap          = 1
    MaxDatagrams       = 3
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = FALSE
    SwapNeedsReady     = FALSE
    HandOffWaits       = FALSE
    FullWaitReadable   = TRUE
    StepDriven          = FALSE
    StepModeStartsThread = FALSE

INVARIANTS
    TypeOK
    NoReuseBeforeSent
    ExposedStable
    FreedOnlyAfterJoin
    HandOffNeverWaits
    FullWaitsOnWake
    NoReceiveStall
