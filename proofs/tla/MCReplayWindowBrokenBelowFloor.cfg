\* Below-floor mutation: the too-old check is omitted, so a sequence below
\* the floor is read from the ring instead of refused; must violate
\* BelowFloorIsRefused.
SPECIFICATION MCSpec

CONSTANTS
    Words             = 6
    WordBits          = 2
    ClearedWords      = 6
    MaxSeq            = 36
    GateBeforeAdvance = TRUE
    GateBeforeOpen    = TRUE
    MarkOnAdvance     = TRUE
    RefuseBelowFloor  = FALSE

INVARIANT BelowFloorIsRefused
