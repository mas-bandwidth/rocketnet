\* MCRNResendTimingBrokenSilenceOnGap: MCRNResendTimingFilterSparse with any
\* 1 s gap between acks ending a silence, the code of v1.1.0. The sparse
\* sender's ack above srtt ends a silence nothing owed and its sample is
\* refused, so its estimate can never rise. It must fail
\* RefuseOnlyAfterOwedSilence.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 10
    MaxBackoff  = 1
    MinAttempts = 4
    TimeoutOn    <- TimeoutOff
    Filter       <- FilterOn
    PriorAck     <- PriorAckOn
    Srtt         <- SrttUnderTick
    SilenceOnGap <- SilenceOnGapOn
INVARIANT
    RefuseOnlyAfterOwedSilence
