\* The passing control of the v1.0.0 walk: the forget pass scans the other
\* slots for every queued forget, owed or not. Every invariant, and the same
\* states as MCRNServerReplaySlots.cfg: the scan the code skips clears nothing.
SPECIFICATION MCSpec

CONSTANTS
    s1              = s1
    s2              = s2
    a1              = a1
    a2              = a2
    NONE            = NONE
    Slots           = {s1, s2}
    Addrs           = {a1, a2}
    MaxHigh         = 1
    SkipWhileOwed   = TRUE
    ClearOnAccept   = TRUE
    ForgetRefusable = TRUE
    MarkSupersedes  = TRUE
    ForgetSupersedes = TRUE
    OweOnRefusal    = TRUE
    ScanWhenOwedOnly = FALSE

INVARIANTS
    TypeOK
    ForgetNeverLost
    OneIdentityPerSlot
    KernelHoldsMark
    DistinctUnlessOwed
    GreetedSlotHasEntry
    KernelEntryOwned
