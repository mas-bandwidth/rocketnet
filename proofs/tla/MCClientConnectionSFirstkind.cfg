\* MCClientConnectionSFirstkind.cfg: MCClientConnection safety with first-
\* of-kind loss and a tick of latency.  At Timeout 2 the idle timeout fires
\* before the cookie-carrying request goes out, so the case covers the
\* handshake up to that timeout and never CONNECTED.  The connected-with-a-
\* payload reachability witness for this loss pattern is
\* MCClientConnectionReachSFirstkind.cfg, which raises the three timing
\* constants first-of-kind loss needs and turns the application branches off
\* to fit the budget.
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 2
    Deadline         = 4
    ServerDeadline   = 3
    MaxAttempts      = 1
    MaxNonces        = 2
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = TRUE
    Disconnects      = TRUE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "firstkind"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 1
    Duplication      = TRUE
    Reordering       = TRUE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    SafetyInvariants
PROPERTIES
    StepsForwardOrFails
    DisconnectIsTerminal
    TimeoutPairing
    AcceptedUnderLiveKeys
    NoSendOnArrival
