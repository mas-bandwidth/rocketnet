\* The passing control for the receive's liveness: one bank and the
\* receive refused up to three times; each time it is armed again (RecvRearms)
\* and the stop finishes.
SPECIFICATION MCLiveSpec

CONSTANTS
    U         = 1
    R         = 2
    K         = 2
    MaxRetry  = 2
    MaxAgain  = 0
    MaxRefuse = 0
    MaxRecvEnd = 3
    ExitRule  = "drained"
    RetryRule = "bounded"
    WakeRule  = "armed"
    ShutdownRule = "begin"
    RecvRule  = "backoff"

PROPERTIES
    StopFinishes
    RecvRearms
