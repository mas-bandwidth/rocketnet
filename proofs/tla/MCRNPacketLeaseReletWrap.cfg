\* MCRNPacketLeaseReletWrap: a frame whose lease was consumed is leased again
\* in the same epoch and the second lease is taken. One frame whose hash is
\* the last entry (HashSpread = 4: frame 4 hashes to 3), so the second
\* insert probes past the consumed entry of its first lease and wraps to
\* entry 0, and the take of the second lease probes past the first (frame
\* equal, ticket not) and wraps to it. TLC must violate NoReletTaken, and
\* that state is reached only with every safety invariant holding at every
\* state before it, so a violation of one of those on the way is reported
\* instead. A run that completes without a violation would mean a re-leased
\* frame is never taken under these constants.
SPECIFICATION Spec

CONSTANTS
    Capacity          = 4
    Threads           = {1, 2}
    Frames            = {4}
    Vals              = {1}
    HashSpread        = 4
    MaxOps1           = 4
    MaxOps2           = 1
    MaxResets         = 1
    EpochLimit        = 2
    TicketLimit       = 6
    ZeroRefused       = TRUE
    UsedLimit         = 2
    UseCas            = TRUE
    ConsumeCas        = TRUE
    BumpEpoch         = TRUE
    EpochLimited      = TRUE
    RetiredOn         = FALSE
    RetiredValidates  = FALSE
    OnWriting         = {"skip"}
    ValidCallers      = FALSE
    AtomicFields      = TRUE

INVARIANTS
    TypeOK
    NoWrongSuccess
    TakeOnce
    NoRacyRead
    InsertFindsSlot
    TicketsUnique
    PublishedIntact
    ChainIntact
    ProbeBound
    NoReletTaken
