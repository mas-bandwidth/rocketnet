\* MCRNAckPhaseBrokenTakeTwice: reversed witness: a second ack call for a client, its own
\* thread, hands the taken ids to the message layer again. Must fail.
SPECIFICATION Spec

CONSTANTS
    Clients           = {c1, c2}
    Threads           = {t1, t2}
    NoOwner           = none
    NoClient          = noclient
    ClientOrder       <- MCClientOrder
    MaxArrivals       = 3
    MaxUpdates        = 2
    MaxResets         = 1
    Capacity          = 2
    NoOwnerCheck      = FALSE
    GatherByClient    = FALSE
    SweepBeforeGather = FALSE
    ResetNoFlush      = FALSE
    SpillNoFlush      = FALSE
    CountsBeforeApply = FALSE
    DrainTaken        = FALSE
    TakeTwice         = TRUE
    c1 = c1
    c2 = c2
    t1 = t1
    t2 = t2

INVARIANTS
    TypeOK
    MessageOnce
