\* The passing control for liveness: with the worker and the kernel fair,
\* the stop finishes, and before it the work handed over is submitted.
\* No receive that ends on its own (MaxRecvEnd 0): datagrams still come,
\* before and after the stop, and MCRNUringQueueWorkerLiveRecv.cfg checks
\* the refused receive; with both here the case runs past its budget.
SPECIFICATION MCLiveSpec

CONSTANTS
    U         = 2
    R         = 2
    K         = 2
    MaxRetry  = 2
    MaxAgain  = 1
    MaxRefuse = 1
    MaxRecvEnd = 0
    ExitRule  = "drained"
    RetryRule = "bounded"
    WakeRule  = "armed"
    ShutdownRule = "begin"
    RecvRule  = "backoff"

PROPERTIES
    StopFinishes
    Drains
    ShutdownDrains
