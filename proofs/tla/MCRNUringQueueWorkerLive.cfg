\* The passing control for liveness: with the worker and the kernel fair,
\* the stop finishes, and before it the work handed over is submitted.
\* No full answer before the server is stopping (MaxAgain 0): from then on
\* they are unbounded, so the wait and its timer are still here, and with
\* datagrams in the model one before the stop takes the case past its budget.
SPECIFICATION MCLiveSpec

CONSTANTS
    U         = 2
    R         = 2
    K         = 2
    MaxRetry  = 2
    MaxAgain  = 0
    MaxRefuse = 1
    MaxRecvEnd = 1
    ExitRule  = "drained"
    RetryRule = "bounded"
    WakeRule  = "armed"
    ShutdownRule = "begin"
    RecvRule  = "backoff"

PROPERTIES
    StopFinishes
    Drains
    ShutdownDrains
