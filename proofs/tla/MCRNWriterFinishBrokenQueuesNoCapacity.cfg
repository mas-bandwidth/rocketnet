\* MCRNWriterFinishBrokenQueuesNoCapacity: reversed witness: the writer's finish queues a start that found no capacity, so the main thread's walk builds it
\* and NothingLeftForWalk falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Writers          = {w1, w2}
    Clients          = {c1, c2}
    NoOwner          = none
    Capacity         = 2
    MaxStarts        = 5
    SealAtFinish     = TRUE
    RefuseNoCapacity = FALSE
    CheckOwner       = TRUE
    Buffered         = FALSE
    RingRefuses      = FALSE

INVARIANTS
    TypeOK
    NothingLeftForWalk
