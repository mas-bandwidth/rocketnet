\* Reversed witness: the held receives copied from the first queue that
\* holds any, every time, as one line across the queues would be: a queue
\* whose source floods is copied again and again while another queue's
\* held receive waits.  Must violate TurnsTaken.
SPECIFICATION MCSpec

CONSTANTS
    CqCap     = 4
    Q         = 2
    HeldCap   = 2
    Buffers   = 3
    Room      = 2
    Seg       = 1
    Budget    = 3
    MaxRecv   = 6
    MaxSends  = 2
    HoldRule  = TRUE
    HeldMod   = TRUE
    TurnRule  = FALSE

INVARIANTS
    TypeOK
    TurnsTaken
