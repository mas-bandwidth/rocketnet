\* MCRNLiveFleetRun reversed witness: the heartbeat loop starts only once
\* every client is started (scripts/live-xdp-fleet before MM205), so the
\* arm's one touch of the heartbeat goes stale during the load, the listen
\* wait and the client starts. Must fail WatchdogKillsOnlyOnFault: with no
\* outside event the watchdog kills the healthy server before teardown.
SPECIFICATION Spec

CONSTANTS
    C1            = C1
    C2            = C2
    S1            = S1
    Clients       = {C1, C2}
    TestServer    = S1
    Cycles        = 2
    T             = 1
    WatchdogBound = 2
    DeadmanBound  = 5
    MaxClients    = 2
    MaxFaults     = 1
    HeartbeatFromArm <- HeartbeatFromArmBroken

INVARIANTS
    TypeOK
    XdpNeverOrphaned
    TeardownDetaches
    WatchdogKillsOnlyOnFault
    XdpOnlyUnderDeadman
    NoClientBeforeListen
    NoBenchServer
    ReconnectAfterTwoTimeouts
    ReconnectIntoFreedSlot
    NeverDenied
