\* Reversed witness: MCServerConnectionMove.cfg with a half-open mapping that
\* answers a request carrying its token (not its salt) under the request's
\* salt instead of its stored challenge. One client, two attempts: the first
\* leaves a half-open mapping at its address, the second presents the same
\* token under a new salt. TLC must fail StoredChallengeResent.
SPECIFICATION Spec

CONSTANTS
    ResendFromRequest <- MCResendFromRequest
    NumClients          = 1
    NumAddrs            = 2
    NumTokens           = 2
    MaxSlots            = 1
    MapCap              = 1
    HeldCapacity        = 2
    MaxAttempts         = 2
    MaxNonces           = 1
    MaxMoves            = 1
    SendInterval        = 1
    Timeout             = 0
    HandshakeDeadline   = 0
    Disconnects         = TRUE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "any"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2

PROPERTIES
    StoredChallengeResent
