\* MCServerStopSpread reversed witness: the drain ends at an unreachable start as at a full staging, so a burst whose destination has no link-layer address waits forever and the stop never finishes. Must fail StopFinishes.
SPECIFICATION FairSpec

CONSTANTS
    SlotCount   = 2
    MaxSessions = 4
    Burst       = 2
    BankSize    = 3
    RingSize    = 4
    SteadyCap   = 2
    Defect      = "unreachablestalls"

PROPERTY StopFinishes
