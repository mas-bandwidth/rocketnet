\* MCRNRioWorker reachability: create failed before it posted a receive,
\* closesocket is refused StopDrainWaits + 1 times, the drain abandons the
\* socket open (rio->socket = INVALID_SOCKET in
\* rocketnet_rio_create_failed_drain), one more pass drains and stops, and
\* the rest of the lane is freed.  The constants of
\* MCRNRioWorkerInlineStopUnposted.cfg.  Must fail NotReachedAbandonFreed.
SPECIFICATION Spec

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 0
    Cap             = 1
    View            = 1
    MaxDatagrams    = 1
    MaxSends        = 0
    DrainBatch      = 2
    StopDrainWaits  = 1
    InlineStop      = TRUE
    BoundedStopDrain = TRUE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    TypeOK
    NotReachedAbandonFreed
