\* MCSessionAcksWitSweepspends.cfg: the reversed witness of one standalone ack
\* an update. The update ack decision pays a debt raised at receive (a
\* keep-alive) although a payload from the same peer waits for the accept;
\* the accept raises the debt again and the send pass sends a second
\* standalone ack to the peer in the same update. OneStandalonePerUpdate is
\* violated. The gate instance constants (MCSessionAcks.cfg) with AckTiming
\* on; MCSessionAcksTiming.cfg passes it.
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq      = 4
    SentRing    = 4
    BatchCap    = 1
    Window      = 4
    MaxRanges   = 2
    DrainCap    = 4
    Burns       = TRUE
    Witness     = "sweepspends"
    D2RPattern  = "arbitrary"
    R2DPattern  = "arbitrary"
    Capacity    = 2
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = TRUE
    BurstStart  = 3
    BurstLen    = 2
    AckTiming   <- MCAckTiming

INVARIANTS
    OneStandalonePerUpdate
