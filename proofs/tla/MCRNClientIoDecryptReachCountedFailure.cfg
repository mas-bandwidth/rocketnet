\* MCRNClientIoDecrypt reach witness: with an integrity limit of two, a
\* forged session datagram update would accept by its state is counted as
\* an integrity failure and the session goes on (the branch of
\* rocketnet_client_integrity_failure short of the limit).  Every other
\* invariant holds on the way.  Must fail NoCountedFailure.
SPECIFICATION Spec

CONSTANTS
    BufferCap        = 2
    MaxDatagrams     = 3
    MaxSeq           = 1
    W                = 1
    MaxReplays       = 0
    MaxForged        = 1
    IntegrityLimit   = 2
    OpenBeforeReplay = FALSE
    SharedWindow     = FALSE
    NoRetire         = FALSE
    CountOnIo        = FALSE
    NoPayloadGate    = FALSE

INVARIANTS
    TypeOK
    CheapRefusalsFirst
    NoOpenWithoutKeys
    IoWindowWithinMain
    PayloadOpenedOnlyConnected
    AcceptedOnce
    SingleWriter
    ExposedStable
    NoReceiveStall
    RetiredZeroed
    NoCountedFailure
