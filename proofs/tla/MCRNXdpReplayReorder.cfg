\* MCRNXdpReplayReorder: the reordering control. One address, two sessions
\* and two packets in flight, so a genuine packet can sit on the wire behind
\* a later one of its session that userspace opens first, and the kernel
\* then meets it behind the raised mark; sequences are 1..4 and the replay
\* window is 2. FreshGenuineNeverDropped must hold for every reordering: the
\* kernel drops a genuine packet of its own session's mark only when the
\* userspace window refuses it too. MCRNXdpReplayInFlight.cfg also has two
\* packets in flight, with sequences 1..2, where no genuine packet falls W
\* behind a mark. Must pass.
SPECIFICATION Spec

CONSTANTS
    A1          = A1
    Addresses   = {A1}
    MaxSeq      = 4
    W           = 2
    Sessions    = 2
    MaxInFlight = 2
    ForgetCapacity = 1
    MarkFailureBudget = 0
    HeldReplyBudget = 0
    ForgetFailureBudget = 1

INVARIANTS
    TypeOK
    ForgetOwedUntilApplied
    MarkNeverAhead
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    LiveSessionNeverDroppedForNoEntry
    NewSessionNeverDroppedByOldMark
    ReleasedSlotForgetsItsReplyMac
    RetryNeverDeletesNewerMark
    MarkOwedUntilApplied
    ForgetQueuedAfterWalk

PROPERTIES
    KernelNeverWrites
