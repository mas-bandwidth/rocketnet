\* MCLinkReconfigureBrokenSetting.cfg: the reversed witness for
\* SendUsesForce. The owner's take clears the pending flag without copying
\* the record, so with nothing waiting a later send is still held to the old
\* setting.
SPECIFICATION Spec

CONSTANTS
    Packets     = {a, b}
    Capacity    = 2
    MaxDelay    = 1
    Duplication = FALSE
    Reordering  = FALSE
    Pattern     = "none"
    BurstStart  = 1
    BurstLen    = 2
    MaxSends    = 3
    Defect      = "stale"

INVARIANTS
    RCTypeOK
    SendUsesForce
