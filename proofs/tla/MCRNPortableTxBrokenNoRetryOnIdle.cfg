\* MCRNPortableTx reversed witness: portable_receive does not retry a deferred
\* publish.  A batch whose try failed stays in the producer while main only
\* receives.  Must fail EveryAcceptedSent.
SPECIFICATION SpecFair

CONSTANTS
    NumBanks          = 3
    Cap               = 2
    Batch             = 2
    MaxPackets        = 6
    FullSlack         = 0
    HeadMod           = 3
    TailMod           = 3
    QuitUnderLock     = TRUE
    PublishBeforeQuit = TRUE
    PublishUntilSent  = TRUE
    RetryOnIdle       = FALSE
    WakeOnPublish     = TRUE
    Timeout           = FALSE

INVARIANTS
    InBounds
    TypeOK

PROPERTIES
    EveryAcceptedSent
