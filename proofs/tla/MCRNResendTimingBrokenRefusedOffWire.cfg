\* MCRNResendTimingPacedRefused reversed witness: the code before the fix,
\* a refused resend put back among the never-sent numbers and planned as
\* ordered progress. With both records due, the first call's packet carries
\* the chunk and is refused; the second call plans only the small record,
\* the one retransmit, and the refused chunk is not among its picks. Must
\* fail RetryPlanned.
SPECIFICATION Spec
CONSTANTS
    RtoInitial     = 4
    RtoMin         = 1
    RtoMax         = 4
    Timeout        = 20
    MaxBackoff     = 1
    MinAttempts    = 4
    Chunk          <- ChunkInFlight
    Room           <- RoomTwo
    Pending        <- PendingLong
    RefuseResends  <- RefuseResendsOn
    RefusedOffWire <- RefusedOffWireOn
INVARIANTS
    TypeOK
    RetryPlanned
