\* The finding: the code's rules with a forget the sink refuses. The retried
\* forget of an address, applied after the address was marked for a session in
\* another slot, deletes that session's kernel entry (KernelHoldsMark).
SPECIFICATION MCSpec

CONSTANTS
    s1              = s1
    s2              = s2
    a1              = a1
    a2              = a2
    NONE            = NONE
    Slots           = {s1, s2}
    Addrs           = {a1, a2}
    MaxHigh         = 1
    SkipWhileOwed   = TRUE
    ClearOnAccept   = TRUE
    ForgetRefusable = TRUE

INVARIANT KernelHoldsMark
