\* Create without the sizing: a hub of more records than First..Last refuses a port 0 bind.
SPECIFICATION MCSpec

CONSTANTS
    Records      = 3
    First        = 4
    Last         = 5
    BindPorts    = {0, 1, 3}
    PlusOne      = TRUE
    BindCheck    = TRUE
    WrapToFirst  = TRUE
    BothFamilies = TRUE
    DualCheck    = TRUE
    FullCheck    = TRUE
    Sized        = FALSE
    HoldAll      = TRUE

INVARIANT HoldsEveryRecord
