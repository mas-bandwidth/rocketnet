\* MCRNWriterFinish: the committed run, the writer's finish as the code makes it, on a staged transport with no send budget.
SPECIFICATION Spec

CONSTANTS
    Writers          = {w1, w2}
    Clients          = {c1, c2}
    NoOwner          = none
    Capacity         = 2
    MaxStarts        = 5
    SealAtFinish     = TRUE
    RefuseNoCapacity = TRUE
    CheckOwner       = TRUE
    Buffered         = FALSE
    RingRefuses      = FALSE
    Budgeted         = FALSE
    RestartAtFinish  = TRUE
    ValidateFirst    = TRUE

INVARIANTS
    TypeOK
    OneWriter
    SealedInCall
    StagedQueuesNothing
    Accounted

PROPERTIES
    BadBytesNeverRefused
