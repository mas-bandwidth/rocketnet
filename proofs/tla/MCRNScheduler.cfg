\* MCRNScheduler: the code's instance, every guarding rule on. Two channels:
\* CONFIG (IMMEDIATE) at the head of channel 0, then a MEDIUM message on
\* channel 0 and one on channel 1 (every v1.1.x reliable message is MEDIUM).
\* MEDIUM unreliable items arriving one per update, a window of 2, a budget
\* of 1 item per update and 3 transport losses (channel 0's items can both
\* be lost after the earlier one was resent, resend FIFO order 2, 1): every
\* safety invariant, and NoStarvation under Spec. The MCRNSchedulerBroken*.cfg
\* files reverse the corresponding guarding rule.

SPECIFICATION Spec

CONSTANTS
    NC             = 2
    Msgs           <- MCMsgs
    Refill         <- MCNoRefill
    ULevel         = 2
    W              = 2
    Cap            = 1
    UPerTick       = 1
    MaxLoss        = 3
    ChannelFIFO    = TRUE
    RtxSendOrder   = TRUE
    UnreliableLast = TRUE
    StallEndsPass  = FALSE
    ReadyRotate    = TRUE

INVARIANTS
    TypeOK
    ReadyIsQueued
    FirstWriteInOrderPerChannel
    UnreliableNotBlockedByWindow
    ClassOrderBeforePriority
    RtxHeadBoost

PROPERTIES
    NoStarvation
