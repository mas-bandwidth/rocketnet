\* MCRNScheduler: the committed case. Every guarding rule on: two channels,
\* a LOW then an IMMEDIATE item on channel 0, a HIGH item on channel 1,
\* IMMEDIATE unreliable items arriving one per update, a window of 2, a budget
\* of 1 item per update and 2 transport losses: every safety invariant, and
\* NoStarvation under Spec. The MCRNSchedulerBroken*.cfg files reverse the
\* corresponding guarding rule.

SPECIFICATION Spec

CONSTANTS
    NC             = 2
    Msgs           <- MCMsgs
    ULevel         = 0
    W              = 2
    Cap            = 1
    UPerTick       = 1
    MaxLoss        = 2
    ChannelFIFO    = TRUE
    UnreliableLast = TRUE

INVARIANTS
    TypeOK
    FirstWriteInOrderPerChannel
    UnreliableNotBlockedByWindow
    ClassOrderBeforePriority
    RtxHeadBoost

PROPERTIES
    NoStarvation
