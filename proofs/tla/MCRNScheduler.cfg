\* MCRNScheduler: the committed case. Every guarding rule on: two channels,
\* a LOW then an IMMEDIATE item on channel 0, a HIGH item on channel 1,
\* IMMEDIATE unreliable items arriving one per update, a window of 2, a budget
\* of 1 item per update and 3 transport losses (channel 0's items can both
\* be lost after the earlier one was resent, resend FIFO order 2, 1): every
\* safety invariant, and NoStarvation under Spec. The MCRNSchedulerBroken*.cfg
\* files reverse the corresponding guarding rule.

SPECIFICATION Spec

CONSTANTS
    NC             = 2
    Msgs           <- MCMsgs
    ULevel         = 0
    W              = 2
    Cap            = 1
    UPerTick       = 1
    MaxLoss        = 3
    ChannelFIFO    = TRUE
    RtxSendOrder   = TRUE
    UnreliableLast = TRUE

INVARIANTS
    TypeOK
    FirstWriteInOrderPerChannel
    UnreliableNotBlockedByWindow
    ClassOrderBeforePriority
    RtxHeadBoost

PROPERTIES
    NoStarvation
