\* MCRNPortableTx reversed witness: the queue positions never wrap, so the
\* fourth exchange reads and writes past the end of a three-entry array.
\* Must fail InBounds.
SPECIFICATION Spec

CONSTANTS
    NumBanks          = 3
    Cap               = 2
    Batch             = 2
    MaxPackets        = 6
    FullSlack         = 0
    HeadMod           = 0
    TailMod           = 0
    QuitUnderLock     = TRUE
    PublishBeforeQuit = TRUE
    RetryOnIdle       = TRUE
    WakeOnPublish     = TRUE
    Timeout           = FALSE

INVARIANTS
    InBounds
