\* MCRNResendTimingPacedOff: MCRNResendTimingPacedSmall with the reliable timeout
\* off and a 6 s horizon (12): two rn_ordered_write calls an update, the small
\* record and the chunk on the wire and two of the chunk's block never sent. While
\* the probe holds the number that is not U the walk goes past it, and the
\* never-sent chunks are still sent.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 12
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    Room        <- RoomTwo
    Pending     <- PendingShort
    TimeoutOn   <- TimeoutOff
    TrackQuiet  <- TrackQuietOn
INVARIANTS
    TypeOK
    ConfigAccepted
    NoDueRecordHeld
    OffMeansNoStallEnd
    NoEndBeforeT
    SilenceEndsAtT
    DueMeansWritten
PROPERTIES
    ProbeOnlyU
