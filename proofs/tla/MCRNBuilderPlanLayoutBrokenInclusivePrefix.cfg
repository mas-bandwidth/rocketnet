\* MCRNBuilderPlanLayout reversed witness: the offset loop stores offset + n,
\* the bucket's end, instead of offset, its start.  A scatter writes one past
\* its bucket, into the next bucket's slot or past the array.  Must fail
\* NoOverlap.
SPECIFICATION Spec

CONSTANTS
    N            = 4
    Radix        = 2
    Channels     = {1, 2}
    Classes      = 2
    Levels       = 2
    MaxRecords   = 2
    Restore      = TRUE
    PrefixSum    = "inclusive"
    ScatterOrder = "forward"

INVARIANTS
    TypeOK
    NoOverlap
