\* The trace check's passing control: a hand-written record of one packet's
\* way through a queue is a behaviour of RNUringQueueSend.
SPECIFICATION TraceSpec

CONSTANTS
    NB         = 3
    S          = 2
    Dests      = {1, 2}
    MaxSeg     = 2
    Demand     = 3
    MaxFlush   = 3
    MaxEagain  = 1
    RetireRule = "cqe"
    EagainRule = "retry"
    TraceLog   <- GoodLog

INVARIANTS
    TraceConsistent
