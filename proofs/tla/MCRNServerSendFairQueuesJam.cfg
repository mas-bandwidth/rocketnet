\* MCRNServerSendFairQueuesJam: two send queues, the second full for good (K1 = 0);
\* slots 0 and 2 on the first with one frame a flush, 1 and 3 on the second. Its
\* slots are held every flush; the first queue's are written within ceil(2 / 1) = 2
\* flushes, the cursor never pinned on a held slot.
SPECIFICATION Spec

CONSTANTS
    N       = 4
    K       = 1
    Conn    = {0, 1, 2, 3}
    WorkMax = 1
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "rounds"
    Q1      = {1, 3}
    K1      = 0
    QueueRule = "perqueue"

INVARIANTS
    TypeOK
    FairService
    NoUnitWasted
    OtherClientUnaffected
    DarkTakesOnlyItsProbes
    SameOrder
    OnlyLastWriters
    EndedWritesNothing
    CursorAsFullWalk
    VisitsBounded
