\* MCRNResendTimingOffQuietFive: MCRNResendTimingOffQuiet with T = 5 ticks, the
\* three numbers on the wire (s, the chunk c and s2) so that the probe hold is
\* in force while the connection is quiet.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 12
    MaxBackoff  = 1
    MinAttempts = 4
    TimeoutOn   <- TimeoutOff
    TrackQuiet  <- TrackQuietOn
    SilenceT    <- SilenceFive
    Chunk       <- ChunkInFlight
    Third       <- ThirdOn
INVARIANTS
    TypeOK
    NoEndBeforeT
    SilenceEndsAtT
    OffMeansNoStallEnd
    NoDueRecordHeld
    DueMeansWritten
PROPERTIES
    ProbeOnlyU
