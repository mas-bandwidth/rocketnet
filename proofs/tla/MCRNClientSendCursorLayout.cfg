\* MCRNClientSendCursorLayout: four slots, a batch of two, a prefix consume
\* and the two family bits.  CursorAt = "slots" is the code's cursor.
SPECIFICATION Spec

CONSTANTS
    C        = 4
    B        = 2
    MaxTake  = 2
    CursorAt = "slots"

INVARIANTS
    TypeOK
    AtMostOnce
    ExactlyOnce
    InOrder
    NotAfterRelease
