\* MCRNClientSendCursorLayout: four slots, a batch of two, a prefix consume
\* and the two family bits.  CursorAt = "slots" and DropKept = FALSE are the
\* code.
SPECIFICATION Spec

CONSTANTS
    C        = 4
    B        = 2
    MaxTake  = 2
    CursorAt = "slots"
    DropKept = FALSE

INVARIANTS
    TypeOK
    AtMostOnce
    ExactlyOnce
    NoneLost
    InOrder
    NotAfterRelease
