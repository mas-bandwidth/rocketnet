\* MCClientConnectionCookieTrust.cfg: OnlyAuthenticatedRefreshes holds.
\* The client trusts only the server: a cookie's salt is in the clear, so in
\* requesting cookie (1) and sending connection request (2) nothing restarts
\* the receive clock; only the challenge does (TRANSPORT.md t11 rule 8,
\* t11.1). A responsive server and the idle timeout on, so cookies arrive
\* while the clock runs and the attempt can time out in either state.
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 3
    Deadline         = 0
    ServerDeadline   = 0
    MaxAttempts      = 1
    MaxNonces        = 1
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = FALSE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    SafetyInvariants
PROPERTIES
    OnlyAuthenticatedRefreshes
    TimeoutPairing
    StepsForwardOrFails
