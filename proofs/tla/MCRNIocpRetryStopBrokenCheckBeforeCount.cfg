\* MCRNIocpRetryStop reversed witness: the post tests stopping before it counts itself pending, as rocketnet_iocp_post_receive did before A01's fix. One worker completes the receive and its repost tests stopping false; stop is stored; the other worker sees nothing pending and exits while that post is admitted and not yet counted. AdmittedPostHoldsExit falls. Must fail.
SPECIFICATION Spec

CONSTANTS
    NumOps          = 1
    Workers         = {w1, w2}
    Cap             = 2
    PosMod          = 16
    MaxFail         = 1
    MaxComplete     = 1
    StopSlack       = 0
    ClaimBeforeStop = FALSE
    RefuseRetires   = FALSE
    CheckBeforeCount = TRUE

INVARIANT AdmittedPostHoldsExit
