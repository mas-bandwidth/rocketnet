\* MCRNServerMaintenanceSweep with two send queues (slots 0 and 2 on queue 0, 1 and 3 on queue 1): queue 0 may have no room in any update, queue 1 has one or two frames each update. The rule: a full queue holds its slot, the first slot held after the sweep's first frame starts the next update, and only every queue full ends the sweep. Every slot of queue 1 is served within N updates.
SPECIFICATION Spec
CONSTANTS
    N               = 4
    MaxRoom         = 2
    QueueCount      = 2
    MayJam          = {0}
    Unreachable     = {}
    Refused         = {}
    SkipUnreachable = TRUE
    SkipRefused     = TRUE
    QueueRule       = "perqueue"
INVARIANTS
    TypeOK
    BoundedWait
