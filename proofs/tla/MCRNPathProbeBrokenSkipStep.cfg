\* The walk skips a step: its candidate is the largest above P (the old largest-first order), so the first pair goes at 3, not at 2, the next size up.
SPECIFICATION Spec

CONSTANTS
    ClientSet     = {3, 2, 1}
    ServerList    = {3, 2, 1}
    CapsUp        = {3}
    CapsDown      = {3}
    K             = 2
    MaxBursts     = 0
    AttackBudget  = 0
    Forger        = FALSE
    Timed         = TRUE
    Broken        = "skipstep"

PROPERTY NoSkippedStep
