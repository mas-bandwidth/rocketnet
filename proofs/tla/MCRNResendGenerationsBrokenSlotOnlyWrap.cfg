\* The ack without the number comparison, with the generation wrapping
\* (GenMax = 2): a stale ack of number 0 unlinks slot 0, now holding number
\* 4, and marks 4 acked though only 0 was delivered. Under the wrap the
\* freed name can match an earlier write, so the case checks
\* AckedOnlyDelivered, which no reused name can satisfy. It shows that
\* MCRNResendGenerationsWrap.cfg would catch a missing number comparison.
SPECIFICATION MCSpec

CONSTANTS
    W                 = 4
    N                 = 6
    D                 = 2
    GenMax            = 2
    CheckNumber       = FALSE
    WindowSlack       = 0

CHECK_DEADLOCK FALSE

INVARIANT AckedOnlyDelivered
