\* MCRNXdpReceiveRing reversed witness: a fill ring of exactly the frames,
\* the server's shape before the ring was sized at twice them. A frame the
\* kernel took keeps its fill ring slot until the kernel's batch is used up,
\* so the worker's flush finds no slot and keeps the frame; the kernel then
\* finds the ring empty while the worker holds frames it would hand back.
\* Must fail FillNeverEmptyWhileFramesFree. PendingReturnedEachPass restates
\* the sizing and is broken at the first refused flush, before the ring is
\* empty; it is left out so the run reaches the drop.
SPECIFICATION Spec

CONSTANTS
    Frames   = {1, 2, 3}
    RingSize = 2
    PendCap  = 3
    StageCap = 3
    FillSize = 3

INVARIANTS
    TypeOK
    FrameConservation
    FillNeverEmptyWhileFramesFree
