\* Reversed witness: the start takes its descriptor (rn_region_descriptor_take)
\* before the store's find, and on no chunk gives it back with
\* rn_region_descriptor_release, the undo a programmer would write. The
\* descriptor's generation is bumped and the free stack moved. Must violate
\* RefuseLeavesLayout.
SPECIFICATION MCSpec
VIEW View

CONSTANTS
    N             = 3
    Q             = 4
    GenMod        = 3
    FreshGuard    = TRUE
    PushOnFree    = TRUE
    ScanFind      = FALSE
    ChunkSkipZero = TRUE
    DescSkipZero  = TRUE
    KeepFreeSlot  = TRUE
    CountQueueFull = TRUE
    StartOrder    = "descfirst"
    CountMod      = 1
    RefuseExhausts = FALSE

INVARIANTS
    TypeOK

PROPERTIES
    RefuseLeavesLayout
