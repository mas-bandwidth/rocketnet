\* MCRNResendTimingPacedRefused: MCRNResendTimingPacedSmall with the
\* transport free to refuse any call's packet that carries a record on the
\* wire. The refused resend goes back on the wire as its class's mark, due
\* at once, and the next call plans it as a retransmit (RetryPlanned). The
\* timing invariants are not claims about refused resends, so they are not
\* checked here.
SPECIFICATION Spec
CONSTANTS
    RtoInitial    = 4
    RtoMin        = 1
    RtoMax        = 4
    Timeout       = 20
    MaxBackoff    = 1
    MinAttempts   = 4
    Chunk         <- ChunkInFlight
    Room          <- RoomTwo
    Pending       <- PendingLong
    RefuseResends <- RefuseResendsOn
INVARIANTS
    TypeOK
    RetryPlanned
