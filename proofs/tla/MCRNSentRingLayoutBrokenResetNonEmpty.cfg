\* ref_head and ref_tail reset whenever the head moves, with entries still
\* live: the next write lands on their references (RefsIntact).
SPECIFICATION MCSpec

CONSTANTS
    Part         = "sent"
    P            = 3
    R            = 2
    MaxRefs      = 4
    Rq           = 3
    SerialMod    = 4
    MaxWrites    = 6
    MaxEvents    = 0
    EvictAtP     = TRUE
    RefTestExact = TRUE
    ResetEmpty   = FALSE
    ReceiptClamp = TRUE
    SerialSkip   = TRUE

INVARIANT RefsIntact
