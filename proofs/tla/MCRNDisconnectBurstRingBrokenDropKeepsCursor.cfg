\* The stop step's drop for room without resetting the cursor: every waiting
\* burst leaves and the cursor stays past the empty ring (CursorInRange).
SPECIFICATION MCSpec

CONSTANTS
    SteadyCap     = 2
    K             = 2
    Bursts        = 6
    SteadyCapExact = TRUE
    CursorWrapAt  = TRUE
    CursorDrops   = TRUE
    DropResetsCursor = FALSE
    Queues        = 1
    AbandonQueuePops = TRUE

INVARIANT CursorInRange
