\* The walk ends without probing P0 itself: a client whose path does not carry P0 never fails -14.
SPECIFICATION FairSpec

CONSTANTS
    ClientSet     = {2, 1}
    ServerList    = {2, 1}
    CapsUp        = {0, 1, 2}
    CapsDown      = {0, 1, 2}
    K             = 2
    MaxBursts     = 1
    AttackBudget  = 0
    AttackKinds   = {"replay", "probe", "reply"}
    Forger        = FALSE
    Timed         = TRUE
    LossBound     = TRUE
    MaxReuses     = 0
    ReuseCapsUp   = {}
    ReuseCapsDown = {}
    Broken        = "skiplast"

PROPERTY FailsWhenP0NotCarried
