\* The passing control of the rotation: one frame a flush for three
\* connections, five flushes, so a starved connection would show; no stall
\* and no refusal (MCRNSendRotation.cfg checks those).
SPECIFICATION MCSpec

CONSTANTS
    N           = 3
    Cap         = 1
    MaxFlush    = 5
    EnvStall    = FALSE
    EnvShortAck = FALSE
    EnvRefuse   = FALSE
    KeepDone    = TRUE
    StallGate   = TRUE
    FitsGate    = TRUE
    WriteFirst  = TRUE
    CursorNext  = TRUE
    CutCursor   = TRUE

INVARIANTS
    TypeOK
    NoAbort
    UnlistedPassEnded
    SkippedWritesNothing
    CursorAsFullWalk
    VisitsBounded
    ServedWhenCapacity
    BoundedWait
