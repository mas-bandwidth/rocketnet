\* MCRNRttFilterFirstAck: the code at the start of a connection, recorded as an
\* expected failure: the estimator seeded (m9.2) and no update has acknowledged a
\* packet yet (has_last_ack = 0). A number owed for Probe ticks with no ack is a
\* silence by m9.2, but the code tests has_last_ack first and ends none, so the
\* first ack, delayed by the outage, gives a sample: NoSampleAcrossSilence falls.
SPECIFICATION Spec
CONSTANTS
    Probe     = 3
    RttLow    = 0
    RttHigh   = 1
    OutageMax = 4
    M         = 2
    P         = 2
    Rule      = "owed"
    FirstAck  = TRUE
INVARIANT
    NoSampleAcrossSilence
