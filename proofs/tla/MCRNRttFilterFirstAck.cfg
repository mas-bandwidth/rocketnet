\* MCRNRttFilterFirstAck: the code at the start of a connection: the estimator
\* seeded (m9.2) and no update has acknowledged a packet yet (has_last_ack =
\* 0). A number owed for Probe ticks since its first send with no ack ends a
\* silence at the first ack, so a packet that waited out an outage gives no
\* sample, and the estimate is never poisoned.
SPECIFICATION Spec
CONSTANTS
    Probe     = 3
    RttLow    = 0
    RttHigh   = 1
    OutageMax = 4
    M         = 2
    P         = 2
    Rule      = "owed"
    FirstAck  = TRUE
    DupSample = FALSE
INVARIANTS
    TypeOK
    NoSampleAcrossSilence
    RefuseOnlyAfterOwedSilence
    OutageNeverPoisons
