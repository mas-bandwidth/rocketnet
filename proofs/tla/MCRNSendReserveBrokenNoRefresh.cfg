\* MCRNSendReserveBrokenNoRefresh: the budget stays as main opened it, so frames retired during the phase never reach the fill (NeverStarved).
SPECIFICATION Spec

CONSTANTS
    Fillers   = {f1, f2}
    Reserve   = 2
    MaxFree   = 4
    MaxOwn    = 1
    MaxClaims = 2
    MaxRetire = 2
    MaxPhases = 2
    RoomOnly      = FALSE
    SplitClaim    = FALSE
    RoomFirst     = FALSE
    OwnCountFirst = FALSE
    NoRefresh     = TRUE
    NoReread      = FALSE
    IndexTest     = FALSE

INVARIANTS
    NeverStarved
