\* Reversed witness: the gso transport before the per-destination rule.
\* Nothing is remembered, so the refusing destination refuses every run,
\* and two refusals with no accepted segmented send between them turn
\* segmentation off for every destination. Must violate
\* OtherDestinationUnaffected.
SPECIFICATION Spec

CONSTANTS
    Dests          = {g, b}
    Refusing       = {b}
    KernelSegments = TRUE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "consecutive"
    Slot           <- SlotDistinct
    Queue          <- QueueOne
    AcceptedRule   = "transport"
    FallbackScope  = "transport"
    InFlight       = 1
    PlainFails     = FALSE

INVARIANTS
    TypeOK
    OtherDestinationUnaffected
