\* MCRNXdpReplayInFlightRefusals: two packets in flight, as
\* MCRNXdpReplayInFlight.cfg, with one session in total (Sessions bounds
\* the run's sessions, at either of the two addresses) and one refused
\* forget and one refused mark anywhere in the run, so a duplicate or a
\* reordered send meets a forget or mark the kernel refused and retries.
\* Two addresses, sequences 1..2, the replay window 2.
SPECIFICATION Spec

CONSTANTS
    A1          = A1
    A2          = A2
    Addresses   = {A1, A2}
    MaxSeq      = 2
    W           = 2
    Sessions    = 1
    MaxInFlight = 2
    ForgetCapacity = 1
    MarkFailureBudget = 1
    HeldReplyBudget = 0
    ForgetFailureBudget = 1

INVARIANTS
    TypeOK
    ForgetOwedUntilApplied
    MarkNeverAhead
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    LiveSessionNeverDroppedForNoEntry
    NewSessionNeverDroppedByOldMark
    ReleasedSlotForgetsItsReplyMac
    RetryNeverDeletesNewerMark
    MarkOwedUntilApplied
    ForgetQueuedAfterWalk

PROPERTIES
    KernelNeverWrites
