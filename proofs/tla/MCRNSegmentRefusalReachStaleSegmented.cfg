\* Reach witness: on a kernel that refuses every segmented send, two
\* refusals turn segmentation off, and a run of the bank gathered before
\* that still leaves segmented (the flush reads FEATURE_SEGMENT once a
\* pass); it is refused and resent plain like any other.  Must violate
\* NoSegmentedAfterOff.
SPECIFICATION Spec

CONSTANTS
    Dests          = {d1, d2, d3}
    Refusing       = {}
    KernelSegments = FALSE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"
    Slot           <- SlotDistinct
    Queue          <- QueueOne
    AcceptedRule   = "transport"
    FallbackScope  = "transport"
    InFlight       = 1
    PlainFails     = FALSE

INVARIANTS
    TypeOK
    NoSegmentedAfterOff
