\* Reach witness: io_uring on a kernel that refuses every segmented send.
\* Refusals turn the queue's segmentation off, and a run of the bank it
\* holds, cut at the old max_segments, still leaves segmented (send_one
\* checks only the table); it is refused and resent plain like any other.
\* Must violate NoSegmentedAfterOff.
SPECIFICATION Spec

CONSTANTS
    Dests          = {d1, d2, d3}
    Refusing       = {}
    KernelSegments = FALSE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"
    Slot           <- SlotDistinct
    Queue          <- QueueOne
    AcceptedRule   = "transport"
    FallbackScope  = "queue"
    InFlight       = 2
    PlainFails     = FALSE

INVARIANTS
    TypeOK
    NoSegmentedAfterOff
