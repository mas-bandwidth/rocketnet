\* Create without the dual-stack refusal: an IPv4 endpoint and an IPv6 wildcard share a port.
SPECIFICATION MCSpec

CONSTANTS
    Records      = 3
    First        = 2
    Last         = 5
    BindPorts    = {0, 1, 2}
    PlusOne      = TRUE
    BindCheck    = TRUE
    WrapToFirst  = TRUE
    BothFamilies = TRUE
    DualCheck    = FALSE

INVARIANT OneIPv4Destination
