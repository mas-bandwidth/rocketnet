\* Reversed witness: decode without the bound check. A foreign id L * F reads
\* lane L, past the lanes array. Must fail LaneInRange.
SPECIFICATION Spec

CONSTANTS
    L         = 3
    F         = 2
    Dests     = {"d1", "d2", "d3"}
    HashOf    <- MCHashOf
    MaxStarts = 5
    Mode      = "NoBound"

INVARIANTS
    TypeOK
    LaneInRange
    FinishOwn
    NoReissue
    OneLanePerDest
