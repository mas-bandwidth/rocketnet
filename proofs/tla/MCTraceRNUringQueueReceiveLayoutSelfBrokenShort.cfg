\* Reversed witness of the trace check: record 3 of the good log leaves out
\* one variable, as an under-logged harness would write it.  Must violate
\* TraceConsistent, at record 3.
SPECIFICATION TraceSpec

CONSTANTS
    S           = 3
    B           = 4
    TailWrap    = 8
    MaxArrive   = 5
    MaxSegs     = 2
    DrainMax    = 2
    RoomRule    = "refresh"
    SlotRule    = "mod"
    ReleaseRule = "next"
    CounterWrap = 0
    TraceLog    <- ShortLog

INVARIANTS
    TraceConsistent
