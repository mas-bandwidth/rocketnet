\* The sweep before queues were judged one by one: it ends when the fewest free frames of any queue is 0, so with queue 0 full the slots of queue 1 are never served; BoundedWait must fail.
SPECIFICATION Spec
CONSTANTS
    N               = 4
    MaxRoom         = 2
    QueueCount      = 2
    MayJam          = {0}
    Unreachable     = {}
    Refused         = {}
    SkipUnreachable = TRUE
    SkipRefused     = TRUE
    QueueRule       = "minroom"
INVARIANTS
    TypeOK
    BoundedWait
