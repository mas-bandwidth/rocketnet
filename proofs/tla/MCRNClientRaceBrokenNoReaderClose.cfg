\* step or at its exit (a backend with no close operation), so the losing
\* family is closed only by destroy. Must fail LoserClosed: destroy's close
\* does not satisfy it.
SPECIFICATION FairSpec
CONSTANTS
 Defect = {"noreaderclose"}
INVARIANTS TypeOK
PROPERTIES LoserClosed
