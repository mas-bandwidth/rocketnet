\* MCRNRioWorker reversed witness: the stop pass closes the socket as soon
\* as the burst is committed, with the sends still in flight.  The close
\* cancels them and they retire failed.  Must fail StopSendsFinished.
SPECIFICATION Spec

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = FALSE
    Slices          = 1
    NumBanks        = 2
    Cap             = 1
    View            = 2
    MaxDatagrams    = 0
    MaxSends        = 1
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    TypeOK
    StopSendsFinished
