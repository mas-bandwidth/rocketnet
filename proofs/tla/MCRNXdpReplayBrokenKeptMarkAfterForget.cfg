\* MCRNXdpReplay reversed witness: a kept mark survives the forget the walk
\* queues for its address. Must fail ForgetOwedUntilApplied: the commit
\* applies the forget, then the kept mark of the released session, so the
\* released address holds an entry with no forget owed. MarkNeverAhead
\* carries ForgetOwedUntilApplied as a conjunct and is left out
\* (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1                = A1
    Addresses         = {A1}
    MaxSeq            = 3
    W                 = 2
    Sessions          = 2
    MaxInFlight       = 1
    ForgetCapacity    = 1
    MarkFailureBudget   <- MarkFailureBudgetOne
    ForgetDropsKeptMark <- ForgetDropsKeptMarkBroken

INVARIANTS
    TypeOK
    ForgetOwedUntilApplied
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped

PROPERTIES
    KernelNeverWrites
