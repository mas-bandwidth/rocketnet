\* MCRNClientIoStepDriven: caller-driven I/O with no thread, every rule on.  Checks the safety
\* invariants and, under SpecStepFair (SpecFair with the core actions fair on
\* the caller, StepBegin and StepEnd fair, and the main thread's reopen,
\* hand-off, expose, return and join strongly fair), the liveness properties.
SPECIFICATION SpecStepFair

CONSTANTS
    NumSlots           = 1
    BufferCap          = 1
    MaxDatagrams       = 2
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = FALSE
    SwapNeedsReady     = FALSE
    HandOffWaits       = FALSE
    FullWaitReadable   = FALSE
    StepDriven          = TRUE
    StepModeStartsThread = FALSE

INVARIANTS
    TypeOK
    NoReuseBeforeSent
    ExposedStable
    FreedOnlyAfterJoin
    HandOffNeverWaits
    FullWaitsOnWake
    NoReceiveStall
    DroppedAtDeadline
    NoIoThreadActionInStepMode

PROPERTIES
    HandedOffEventuallySent
    CommittedEventuallyHandedOff
    StopEventuallyJoins
    FilledEventuallyExposed
    ArrivedEventuallyDelivered
    DestroyCompletes
