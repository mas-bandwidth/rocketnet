\* MCClientConnectionForgedCookie.cfg: HandshakeNeverRewinds holds under
\* forgery. An observer of the request sends cookies echoing the attempt's
\* salt with a mac of its own (ForgeCookie), at any time in requesting
\* cookie (1) and sending connection request (2). The first cookie is kept
\* and a later one replaces only the latest, so once the client keeps the
\* server's cookie no step takes it away (TRANSPORT.md t11.1). A responsive
\* server and the idle timeout on, as in MCClientConnectionCookieTrust.cfg.
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 3
    Deadline         = 0
    ServerDeadline   = 0
    MaxAttempts      = 1
    MaxNonces        = 1
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = FALSE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
    Forgery          <- MCForgery
INVARIANTS
    SafetyInvariants
PROPERTIES
    HandshakeNeverRewinds
    OnlyAuthenticatedRefreshes
    StepsForwardOrFails
