\* Reversed witness: tail, head and exposed kept modulo 4 in place of the
\* code's 64-bit indexes: at the wrap the slot index tail % 3 jumps back
\* to 0, so a position lands on the slot of an older unread one.  Must
\* violate InOrder.
SPECIFICATION MCSpec

CONSTANTS
    S           = 3
    B           = 4
    TailWrap    = 8
    MaxArrive   = 5
    MaxSegs     = 2
    DrainMax    = 2
    RoomRule    = "refresh"
    SlotRule    = "mod"
    ReleaseRule = "next"
    CounterWrap = 4

INVARIANTS
    TypeOK
    InOrder
