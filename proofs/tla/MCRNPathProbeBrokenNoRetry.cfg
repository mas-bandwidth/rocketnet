\* A rule-out ends the walk for good, as before the re-try: under heavy loss (LossBound = FALSE) one burst of large packets rules out 2, which the path carries, P0's check passes once the burst ends, and the walk ends at 1, never reaching 2 (RetryReaches).
SPECIFICATION FairSpec

CONSTANTS
    ClientSet     = {2, 1}
    ServerList    = {2, 1}
    CapsUp        = {2}
    CapsDown      = {2}
    K             = 2
    MaxBursts     = 1
    AttackBudget  = 0
    AttackKinds   = {"replay", "probe", "reply"}
    Forger        = FALSE
    Timed         = TRUE
    LossBound     = FALSE
    MaxReuses     = 0
    ReuseCapsUp   = {}
    ReuseCapsDown = {}
    Broken        = "noretry"

PROPERTY RetryReaches
