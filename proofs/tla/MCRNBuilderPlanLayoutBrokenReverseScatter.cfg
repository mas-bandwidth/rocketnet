\* MCRNBuilderPlanLayout reversed witness: the scatter walks its input from
\* the end with the same post-increment offsets, so equal keys come out
\* reversed and the passes are no longer stable.  A channel's items leave in
\* the wrong order.  Must fail PlanSorted.
SPECIFICATION Spec

CONSTANTS
    N            = 4
    Radix        = 2
    Channels     = {1, 2}
    Classes      = 2
    Levels       = 2
    MaxRecords   = 2
    Restore      = TRUE
    PrefixSum    = "exclusive"
    ScatterOrder = "reverse"

INVARIANTS
    TypeOK
    PlanSorted
