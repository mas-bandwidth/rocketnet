\* The code on a kernel that refuses every segmented send, with both
\* destinations in one table entry: each refusal displaces the other, both
\* refusals count, and segmentation is off once two destinations refused.
\* RefusedOnce is not checked: a displaced destination pays again.
SPECIFICATION Spec

CONSTANTS
    Dests          = {d1, d2}
    Refusing       = {}
    KernelSegments = FALSE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"
    Slot           <- SlotShared
    Queue          <- QueueOne
    AcceptedRule   = "transport"
    FlagScope      = "queue"

INVARIANTS
    TypeOK
    NothingDropped
    KernelFallback
