\* MCRNResendTimingFilterSparse: MCRNResendTimingFilter for a sparse sender.
\* The previous message was acknowledged up to 1 s (2) before the small
\* record's first send, with nothing in flight since, and srtt is under one
\* tick, so an ack one tick after a send is above it. A silence ends only after
\* an ack was owed for 1 s, so a sample is refused only after an owed silence.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 10
    MaxBackoff  = 1
    MinAttempts = 4
    TimeoutOn   <- TimeoutOff
    Filter      <- FilterOn
    PriorAck    <- PriorAckOn
    Srtt        <- SrttUnderTick
INVARIANTS
    TypeOK
    NoSampleAcrossSilence
    RefuseOnlyAfterOwedSilence
    NoDueRecordHeld
