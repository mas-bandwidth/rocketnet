\* Reversed witness: MCRNWindow.cfg with HoldOrdered = FALSE (an ordered number
\* is delivered on arrival). TLC must fail OrderedDeliveredInOrder.

SPECIFICATION Spec

CONSTANTS
    W              = 2
    MaxNum         = 4
    NumMod         = 4
    BlockFirst     = 1
    BlockLen       = 2
    Ordered        = {0, 1, 2, 4}
    P              = 2
    MaxPerPacket   = 1
    MaxPid         = 3
    BlockUPrime    = TRUE
    KeepP6         = TRUE
    HalfRange      = TRUE
    HoldOrdered    = FALSE
    DropDuplicates = TRUE
    FwdPattern     = "alternate"
    RevPattern     = "alternate"
    Capacity       = 2
    MaxDelay       = 0
    Duplication    = FALSE
    Reordering     = FALSE
    BurstStart     = 1
    BurstLen       = 2

INVARIANTS
    TypeOK
    TablesBounded
    ReceiverNeverOutsideWindow
    NoSlotCollision
    AckedImpliesReceived
    DeliveredOnce
    OrderedDeliveredInOrder
    WireNumberReconstructs
    HeldIsUnreleasable

PROPERTIES
    EveryReliableAckedAndDelivered
