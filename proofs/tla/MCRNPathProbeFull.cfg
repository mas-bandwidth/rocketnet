\* The passing control at the full size, nightly timeout debt (over the 110 s case budget on two workers; MCRNPathProbe.cfg is the per-PR check at fewer capacities): three candidates on both lists, every path capacity 0 .. 3 each way, one loss burst inside a window of no spacing, one attacker send; every safety property and the liveness properties under fairness.
SPECIFICATION FairSpec

