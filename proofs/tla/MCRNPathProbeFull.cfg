INVARIANTS
    TypeOK
    RaisedWithinPath
    ServerNeverAhead
    NoWrongRuleOut
    FailOnlyAtP0
    NeverAtRuledOut
    ReplyOnlyConnected
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate

PROPERTIES
    PNeverDecreases
    StrikeNeedsSmall
    StrikeNeedsSpacing
    ServerRaisesOnConfirm
    ClientRaisesOnAuthLarge
    NoProbeAfterDone
    Converges
