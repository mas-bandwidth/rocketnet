\* Reversed witness: rn_span_link without span_next = RN_DESCRIPTOR_NONE,
\* as if the descriptor pool were clear. The carve (Reset) leaves a span
\* live at it with its links as dead bytes, so a span linked again on that
\* descriptor names a dead next. The refusal instance
\* (MCRNSendSpansRefuse.cfg) with LinkClearsNext = FALSE. Must violate
\* ListInAllocationOrder.
SPECIFICATION Spec

CONSTANTS
    SR            = 96
    Lengths       = {32, 96}
    Q             = 3
    FloorAtOldest = TRUE
    PadOnWrap     = TRUE
    SpliceBoth    = TRUE
    RefuseExhausts = FALSE
    LinkFirst     = FALSE
    CountMod      = 1
    UndoTail      = TRUE
    LinkClearsNext = FALSE

INVARIANTS
    TypeOK
    ListInAllocationOrder
