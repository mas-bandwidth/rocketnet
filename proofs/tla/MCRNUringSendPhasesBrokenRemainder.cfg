\* Reversed witness: a reaped send's phase taken as the remainder of its
\* slot by Size, not the quotient, so the wrong phase's pending count
\* falls.  Must violate PendingMatches.
SPECIFICATION MCSpec

CONSTANTS
    Phases       = 2
    Size         = 2
    MaxUpdates   = 4
    LateReap     = FALSE
    BaseRule     = TRUE
    QuotientRule = FALSE

INVARIANTS
    TypeOK
    PendingMatches
