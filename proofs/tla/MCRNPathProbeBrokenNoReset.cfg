\* A pair whose small probe was lost leaves the strikes as they are: a burst of large-only loss makes one strike, a burst of every packet loses the next pair's small probe, a second burst of large-only loss makes another, and K = 2 rules out a size the path carries (the instance of MCRNPathProbeLossRow.cfg at capacity 2 each way).
SPECIFICATION Spec

CONSTANTS
    ClientSet     = {2, 1}
    ServerList    = {2, 1}
    CapsUp        = {2}
    CapsDown      = {2}
    K             = 2
    MaxBursts     = 3
    AttackBudget  = 0
    Forger        = FALSE
    Timed         = TRUE
    Broken        = "noreset"

INVARIANT NoWrongRuleOut
