\* MCRNRioWorker reversed witness: main never wakes the worker when it
\* frees a bank.  A worker waiting with a full fill bank waits forever.
\* Must fail EveryDatagramConsumed.
SPECIFICATION SpecFair

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 2
    NumBanks        = 2
    Cap             = 2
    View            = 4
    MaxDatagrams    = 4
    MaxSends        = 0
    DrainBatch      = 2
    StopDrainWaits  = 2
    InlineStop      = FALSE
    BoundedStopDrain = TRUE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = FALSE

INVARIANTS
    TypeOK
    ExactDelivery

PROPERTIES
    EveryDatagramConsumed
