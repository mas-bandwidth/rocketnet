\* MCRNRioWorker reversed witness: main never wakes the worker when it
\* starts on a full bank.  Banks of one datagram: the worker fills its bank
\* before main starts on it and waits with it full.  The model's idle wait
\* has no timeout, so it waits forever; the code's wait times out after
\* 50 ms, so without the wake the next datagram waits up to 50 ms (about
\* three updates at 60 Hz) rather than forever, and while it waits its
\* slices stay unposted, so under load later arrivals can be dropped by the
\* kernel.  The wake is what removes that delay.  Must fail
\* EveryDatagramConsumed.
SPECIFICATION SpecFair

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 2
    Cap             = 1
    View            = 2
    MaxDatagrams    = 3
    MaxSends        = 0
    DrainBatch      = 2
    StopDrainWaits  = 2
    InlineStop      = FALSE
    BoundedStopDrain = TRUE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = FALSE

INVARIANTS
    TypeOK
    ExactDelivery

PROPERTIES
    EveryDatagramConsumed
