\* MCRNRioWorker reversed witness: main never wakes the worker when it
\* starts on a full bank.  Banks of one datagram: the worker fills its bank
\* before main starts on it, waits with it full and waits forever.
\* Must fail EveryDatagramConsumed.
SPECIFICATION SpecFair

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 2
    Cap             = 1
    View            = 2
    MaxDatagrams    = 3
    MaxSends        = 0
    DrainBatch      = 2
    StopDrainWaits  = 2
    InlineStop      = FALSE
    BoundedStopDrain = TRUE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = FALSE

INVARIANTS
    TypeOK
    ExactDelivery

PROPERTIES
    EveryDatagramConsumed
