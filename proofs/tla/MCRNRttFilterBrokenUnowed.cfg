\* MCRNRttFilterBrokenUnowed: MCRNRttFilterUnowed.cfg under v1.1.1's sampling, one
\* sample per acknowledged packet: the late copy is sampled and the estimate
\* reaches RttHigh + Probe (OutageNeverPoisons).
SPECIFICATION Spec
CONSTANTS
    Probe     = 3
    RttLow    = 0
    RttHigh   = 1
    OutageMax = 4
    M         = 2
    P         = 2
    Rule      = "owed"
    FirstAck  = FALSE
    DupSample = TRUE
    ReceiptPkts = FALSE
INVARIANT
    OutageNeverPoisons
