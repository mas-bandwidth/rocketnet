\* MCRNFillPhaseBrokenNoReset: reversed witness: main_end leaves the epoch;
\* a client filled by one thread and then, in the next fill phase, by
\* another is refused, and NoFalseAlarm falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Fillers      = {f1, f2}
    Clients      = {c1, c2}
    NoOwner      = none
    MaxMain      = 2
    MaxFills     = 2
    MaxTakes     = 0
    LookFirst    = FALSE
    LoadStore    = FALSE
    ResetOnLeave = FALSE
    NoEpochLook  = FALSE
    NoRestore    = FALSE
    ScanOne      = FALSE
    NoWindow     = FALSE
    NoMainWindow = FALSE
    TakeUncounted = FALSE
    OptedAtStart  = TRUE
    ArmedAtCreate = FALSE
    OwnerAtDecide = FALSE
    DepthMax      = 2
    Lines        = {0, 1}
    LineChoice   <- MCLineChoice
    f1 = f1
    f2 = f2
    f3 = f3

VIEW View

INVARIANTS
    TypeOK
    NoFalseAlarm
