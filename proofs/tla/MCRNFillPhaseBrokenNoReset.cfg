\* MCRNFillPhaseBrokenNoReset: reversed witness: main_end leaves the epoch;
\* a client filled by one thread and then, in the next fill phase, by
\* another is refused, and NoFalseAlarm falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Fillers      = {f1, f2}
    Clients      = {c1, c2}
    NoOwner      = none
    MaxMain      = 2
    MaxFills     = 2
    LookFirst    = FALSE
    LoadStore    = FALSE
    ResetOnLeave = FALSE
    NoEpochLook  = FALSE
    NoRestore    = FALSE
    ScanOne      = FALSE
    Lines        = {l1, l2}
    LineOf       <- MCLineOf
    f1 = f1
    f2 = f2
    f3 = f3
    l1 = l1
    l2 = l2

INVARIANTS
    TypeOK
    NoFalseAlarm
