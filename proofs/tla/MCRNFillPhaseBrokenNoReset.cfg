\* MCRNFillPhaseBrokenNoReset: reversed witness: main_end leaves the
\* owners set; a client filled by one thread and then, in the next fill
\* phase, by another is flagged, and NoFalseAlarm falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Fillers      = {f1, f2}
    Clients      = {c1}
    NoOwner      = none
    MaxMain      = 2
    MaxFills     = 2
    LookFirst    = FALSE
    LoadStore    = FALSE
    ResetOnLeave = FALSE
    StaleClaim   = FALSE
    NoEpochLook  = FALSE

INVARIANTS
    TypeOK
    NoFalseAlarm
