\* learn's insert probing P + 1 slots while the lookups probe P: an entry
\* placed at offset P is never found (TableIsMap).
SPECIFICATION MCSpec
VIEW View

CONSTANTS
    a1                = a1
    a2                = a2
    a3                = a3
    m1                = m1
    m2                = m2
    NOADDR            = NOADDR
    Addrs             = {a1, a2, a3}
    Macs              = {m1, m2}
    N                 = 4
    P                 = 2
    SkipOtherEntries  = TRUE
    EvictOldest       = TRUE
    InsertWindowExact = FALSE

INVARIANT TableIsMap
