\* MCRNSentMap reversed witness: one receipt-only packet an update
\* (ReceiptsPerUpdate = 1) at P = W. Must fail NoLiveEviction: the code's
\* open risk; the committed MCRNSentMap.cfg with ReceiptsPerUpdate changed.
SPECIFICATION Spec

CONSTANTS
    W            = 3
    P            = 3
    RTT          = 2
    RTO          = 2
    MaxNum       = 4
    MaxTime      = 6
    MaxPerPacket = 2
    ReceiptsPerUpdate = 1

INVARIANTS
    TypeOK
    MapBounded
    WindowBounded
    NoLiveEviction
