\* MCRNGsoHandoff reversed witness: the RX worker writes a datagram into the buffer main currently holds, as if it published over main's view. NoPublishWhileHeld falls. Must fail.
SPECIFICATION SpecFair

CONSTANTS
    RxCap            = 2
    TxCap            = 2
    MaxRx            = 4
    MaxTx            = 4
    PublishWhileHeld = TRUE
    MainBlocks       = FALSE
    FullDrops        = FALSE
    CarryBehind      = FALSE

INVARIANTS
    TypeOK
    RxOneOwner
    TxOneOwner
    TxQueuesDistinct
    NoPublishWhileHeld
    FreeIsEmpty
    SentOrHeld
    RxInOrder
    TxInOrder
    MainNeverWaits
    StopJoinsBeforeFree
    ExitSentAll

PROPERTIES
    StopCompletes
