\* Not the code: the loss assumption dropped, so one burst of large-only loss meets two pairs in a row whose small probes come back, collects K = 2 strikes and rules out a size the path carries; the bound on large-only loss is what NoWrongRuleOut needs.
SPECIFICATION Spec

CONSTANTS
    ClientSet     = {2, 1}
    ServerList    = {2, 1}
    CapsUp        = {2}
    CapsDown      = {2}
    K             = 2
    MaxBursts     = 1
    AttackBudget  = 0
    AttackKinds   = {"replay", "probe", "reply"}
    Forger        = FALSE
    Timed         = TRUE
    LossBound     = TRUE
    MaxReuses     = 0
    ReuseCapsUp   = {}
    ReuseCapsDown = {}
    Broken        = "unboundedburst"

INVARIANT NoWrongRuleOut
