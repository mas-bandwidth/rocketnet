\* Reach witness: on io_uring two of the refusing destination's runs go into
\* the kernel before the first answer, so it pays two refusals
\* (RefusalsBounded allows InFlight).  Must violate MCRefusedOnce.
SPECIFICATION Spec

CONSTANTS
    Dests          = {g, b}
    Refusing       = {b}
    KernelSegments = TRUE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"
    Slot           <- SlotDistinct
    Queue          <- QueueOne
    AcceptedRule   = "transport"
    FallbackScope  = "queue"
    InFlight       = 2
    PlainFails     = FALSE

INVARIANTS
    TypeOK
    MCRefusedOnce
