\* MCRNResendTimingBrokenCheckBeforeAcks: MCRNResendTiming.cfg with the
\* timeout checked before the update's acks (the model before revision 1.3).
\* A record unacked at its deadline update can no longer be acknowledged in
\* it, where the code (acks applied before rn_endpoint_tick) takes the ack
\* and keeps the connection. It must fail DeadlineUpdateTakesAcks.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 20
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    CheckBeforeAcks <- CheckBeforeAcksOn
INVARIANTS
    TypeOK
    DeadlineUpdateTakesAcks
