\* MCRNServerSendFairBrokenLiveFromZero: the live room of
\* MCRNServerSendFairLive.cfg with every flush starting at slot 0. The
\* window counts only flushes that had the full room, and the rotation bug
\* still starves the high slots across those flushes. Must fail FairService:
\* the live-room window still catches a rotation bug.
SPECIFICATION Spec

CONSTANTS
    N       = 5
    K       = 2
    Conn    = {0, 1, 2, 3, 4}
    WorkMax = 2
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "fromzero"
    Q1      = {}
    K1      = 0
    QueueRule = "perqueue"
    RoomMin <- MCRoomZero

INVARIANT FairService
