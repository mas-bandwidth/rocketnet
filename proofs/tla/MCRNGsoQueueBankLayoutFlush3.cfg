\* The control at three flushes, so a queue's producer turns over onto a bank
\* its worker returned: bench, over the 110 s per-case budget (32.2M distinct
\* states); MCRNGsoQueueBankLayout.cfg is the required control at two.
SPECIFICATION Spec
CONSTANTS
    Q = 2
    NB = 3
    S = 3
    Stride = 4
    Threads = {1, 2}
    Dests = {"a", "b"}
    QueueOf <- MCQueueOf
    Demand = 2
    MaxFlush = 3
    Skew <- MCSkew
    ClaimCmp = "ge"
    ClaimRule = "cas"
    SlotRule = "check"
    IdRule = "mul"
    FlushRule = "joined"
INVARIANT TypeOK
INVARIANT OneProducer
INVARIANT InBounds
INVARIANT NoSharedSlot
INVARIANT NoForeignWrite
INVARIANT RouteMatches
INVARIANT NoWorkerWrite
INVARIANT StagedMatches
