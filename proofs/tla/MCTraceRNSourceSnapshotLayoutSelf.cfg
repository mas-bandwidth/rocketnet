\* The trace check's passing control: a hand-written record of one update and
\* one reader's batch is a behaviour of RNSourceSnapshotLayout.
SPECIFICATION TraceSpec

CONSTANTS
    Readers       = {1}
    Addrs         = {1, 2, 3}
    Cap           = 4
    MaxEntries    = 2
    HomeAt        = {7, 11, 12}
    MaxUpdates    = 1000000
    MaxRefused    = 1000000
    HalfPublished = FALSE
    NoRecheck     = FALSE
    LookupNoWrap  = FALSE
    TraceLog      <- GoodLog

INVARIANTS
    TraceConsistent
