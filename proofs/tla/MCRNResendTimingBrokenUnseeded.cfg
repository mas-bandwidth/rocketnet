\* MCRNResendTimingBrokenUnseeded: the reversed witness of the seed, the
\* code before it. MCRNResendTimingSeeded.cfg with the transport's round
\* trip ignored (SeedRule = FALSE): the record first sent at 0 is lost, the
\* transport reports a round trip at 200 ms, and the record still waits the
\* 2 s initial delay, unsent at 600 ms where the seeded delay owes a resend
\* by 500 ms. It must fail SeededGapBounded.
SPECIFICATION Spec

CONSTANTS
    RtoInitial  = 20
    RtoMin      = 1
    RtoMax      = 20
    Timeout     = 100
    MaxBackoff  = 1
    MinAttempts = 4
    SeedAt      <- SeedAtEarly
    SeedRto     <- SeedRtoMeasured
    SeedRule    <- SeedRuleOff

INVARIANTS
    TypeOK
    ConfigAccepted
    SeededGapBounded
