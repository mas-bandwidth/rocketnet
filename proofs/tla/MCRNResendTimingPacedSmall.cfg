\* MCRNResendTimingPacedSmall: MCRNResendTimingPaced with the small record in
\* flight beside the chunk and two packets an update, two rn_ordered_write
\* calls for one packet each. When both records are due in one update each
\* takes one of its packets, ahead of the block's never-sent chunks.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 20
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    Room        <- RoomTwo
    Pending     <- PendingLong
INVARIANTS
    TypeOK
    ConfigAccepted
    AttemptsBeforeTimeout
    ResendGapBounded
    NoDueRecordHeld
    DueMeansWritten
