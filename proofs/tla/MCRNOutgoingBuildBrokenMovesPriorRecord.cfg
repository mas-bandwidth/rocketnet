\* MCRNOutgoingBuild reversed witness: each finish puts its record at the
\* front of the open frame and moves the committed records behind it (their
\* bytes moved with them). Must fail PriorRecordsUnmoved.
SPECIFICATION Spec

CONSTANTS
    N         = 6
    Cap       = 3
    NumFrames = 2
    MaxPackets = 1
    MaxAcks   = 1
    MaxFaults = 1
    Kind      <- MCKind
    Fits      <- MCFits
    Decl      <- MCDecl
    CopyStep  <- CopyStepDesign
    SharedQuota = TRUE
    Reserve   = TRUE
    MovePrior = TRUE
    ReuseCommitted = FALSE

INVARIANTS
    TypeOK
    PacketQuota
    BytesUnchangedInPlace
    NoCopy
    AcksNeverLost
    ModeOrder

PROPERTIES
    ReliableSentWithinOneUpdate
    PriorRecordsUnmoved
    FrameClosedOnlyByFullOrFlush
