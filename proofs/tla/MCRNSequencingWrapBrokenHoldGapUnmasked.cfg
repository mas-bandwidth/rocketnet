\* rn_channels_dispatch_sequenced computes the future-hold gap = ordering - held_ordering without the mask: past the wire wrap a newer future record is superseded by the older hold.
SPECIFICATION MCSpec

CONSTANTS
    Mod         = 8
    CounterMod  = 32
    Net         = 3
    MaxSeqSends = 5
    MaxOrdSends = 4
    Broken      = "holdGapUnmasked"

INVARIANT NewerNeverDiscarded
