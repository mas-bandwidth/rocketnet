\* MCRNIocpRefQueue reversed witness: positions and sequences wrap at 2 * Cap. A producer stalls between its sequence read and its CAS while the others advance enqueue a whole wrap; the stale CAS succeeds (ABA) and overwrites an unread reference. NoOverwrite falls. Must fail.
SPECIFICATION Spec

CONSTANTS
    Cap         = 2
    PosMod      = 4
    InitSlack   = 0
    Producers   = {p1, p2}
    Consumers   = {c1}
    MaxTok      = 5
    Ops         = 5
    DropRefused = FALSE

INVARIANT NoOverwrite
