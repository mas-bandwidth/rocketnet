\* MCServerStopSpread OPEN CODE DEFECT (MM080), not a reversed witness: the instance of MCServerStopSpreadSimulator.cfg under fairness, checked for StopFinishesWithoutRoom. The code drains the link simulator only while the fewest room over the queues is above 0 and tells the I/O to stop only when the simulator holds nothing, and nothing discards a held copy: once a queue jams while copies are held, the stop never finishes. Fails StopFinishesWithoutRoom for that reason until the code gains a terminal discard (send-queue-capacity follow-up); then the model gains it and this case passes.
SPECIFICATION FairSpec

CONSTANTS
    SlotCount   = 2
    MaxSessions = 2
    Burst       = 2
    BankSize    = 2
    QueueCount  = 2
    RingSize    = 4
    SteadyCap   = 2
    Simulator   = TRUE
    Defect      = "none"

PROPERTY StopFinishesWithoutRoom
