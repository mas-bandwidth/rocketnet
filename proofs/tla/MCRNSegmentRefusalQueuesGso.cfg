\* The gso code with two lanes: the destinations of MCRNSegmentRefusalQueues.cfg,
\* two of a destination's runs in one batch, and one FEATURE_SEGMENT bit for
\* the tier (FallbackScope "transport"): a lane that reaches the threshold
\* before any segmented send was accepted turns segmentation off for both
\* lanes, which the rule allows; once one was accepted on either lane,
\* neither lane turns it off.
SPECIFICATION Spec

CONSTANTS
    Dests          = {"d1", "d2", "d3", "d4"}
    Refusing       = {"d2", "d3"}
    KernelSegments = TRUE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"
    Slot           <- SlotDistinct
    Queue          <- QueueSplit
    AcceptedRule   = "transport"
    FallbackScope  = "transport"
    InFlight       = 2
    PlainFails     = TRUE

INVARIANTS
    TypeOK
    NoFallbackAfterAccepted
    NothingDropped
    RefusalsBounded
    KernelFallback
