\* MCRNSegmentRefusalQueues on the gso transport: the same two lanes (d1 on
\* lane 0; d2 and d3 refuse and d4 accepts on lane 1), each lane with its own
\* table and count, and one segment flag for the transport (FlagScope
\* "transport": gso->features, cleared for every lane, read by each lane's
\* flush).  Once d1's segmented send was accepted no lane's refusals turn the
\* flag off.
SPECIFICATION Spec

CONSTANTS
    Dests          = {"d1", "d2", "d3", "d4"}
    Refusing       = {"d2", "d3"}
    KernelSegments = TRUE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"
    Slot           <- SlotDistinct
    Queue          <- QueueSplit
    AcceptedRule   = "transport"
    FlagScope      = "transport"

INVARIANTS
    TypeOK
    NoFallbackAfterAccepted
    NothingDropped
    RefusedOnce
    KernelFallback
