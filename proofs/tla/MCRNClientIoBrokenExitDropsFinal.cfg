\* MCRNClientIo reversed witness: the I/O thread exits without sending the final
\* ring stop handed it, so the committed slots stop passed over are never sent.
\* Must fail StopSendsAll.
SPECIFICATION Spec

CONSTANTS
    NumSlots           = 2
    BufferCap          = 1
    MaxDatagrams       = 3
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = FALSE
    SwapNeedsReady     = FALSE
    HandOffWaits       = FALSE
    FullWaitReadable   = FALSE
    StepDriven          = FALSE
    StepModeStartsThread = FALSE
    ExitDropsFinal       <- ExitDropsFinalOn

INVARIANTS
    TypeOK
    StopSendsAll
