\* MCSessionAcksWitOverclaimSurfaced: wit-overclaim-surfaced, a reversed witness. Witness
\* "overclaim" on the committed instance with burns off, so no burned sequence
\* exists to be named; expected to violate SurfacedOnlyIfOpened: a reordered or
\* lost payload below the highest opened is named and its id surfaces.
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq      = 4
    SentRing    = 4
    BatchCap    = 1
    Window      = 4
    MaxRanges   = 2
    DrainCap    = 4
    Burns       = FALSE
    Witness     = "overclaim"
    D2RPattern  = "arbitrary"
    R2DPattern  = "arbitrary"
    Capacity    = 2
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = TRUE
    BurstStart  = 3
    BurstLen    = 2

INVARIANTS
    TypeOK
    SurfacedOnlyIfOpened
