\* A requeue unlinks the slot, which clears its stamp, and does not stamp it
\* again: a linked entry names generation 0 while its descriptor is live
\* (StampNamesOwner), and the ack then skips it on every packet.
SPECIFICATION MCSpec

CONSTANTS
    W                 = 4
    N                 = 6
    D                 = 2
    GenMax            = 6
    CheckNumber       = TRUE
    Restamp           = FALSE
    CompareGeneration = TRUE

CHECK_DEADLOCK FALSE

INVARIANT StampNamesOwner
