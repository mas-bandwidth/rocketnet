\* MCRNGsoHandoff reachability: a hard send error (EPERM, ENETUNREACH, an unroutable destination) drops a message, counted in SEND_DROPPED, while the server runs, before BeginShutdown. The code can do this (rocketnet_server_gso_flush); the model before txErrDropped could not, so DroppedOnlyAfterShutdown held of the model and not of the code. Must fail NotReachedErrorDropRunning. The instance of MCRNGsoHandoffLive.cfg.
SPECIFICATION SpecFair

CONSTANTS
    RxCap            = 2
    TxCap            = 2
    MaxRx            = 1
    MaxTx            = 3
    PublishWhileHeld = FALSE
    MainBlocks       = FALSE
    FullDrops        = FALSE
    CarryBehind      = FALSE

INVARIANTS
    TypeOK
    NotReachedErrorDropRunning
