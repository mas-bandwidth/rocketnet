\* MCRNPortableTx reversed witness: a head advance never wraps (no modulus
\* on head + 1) while the tail position keeps its modulus, so a pop reads
\* past the end of a three-entry array. One rule changed. Must fail InBounds.
SPECIFICATION Spec

CONSTANTS
    NumBanks          = 3
    Cap               = 2
    Batch             = 2
    MaxPackets        = 6
    FullSlack         = 0
    HeadMod           = 0
    TailMod           = 3
    QuitUnderLock     = TRUE
    PublishBeforeQuit = TRUE
    PublishUntilSent  = TRUE
    RetryOnIdle       = TRUE
    WakeOnPublish     = TRUE
    Timeout           = FALSE

INVARIANTS
    InBounds
