\* MCRNClientLinkStop reversed witness: stop drains at the caller's clock,
\* so copies inside their latency stay held while shutdown updates hold the
\* clock fixed. Must fail BurstArrives.
SPECIFICATION FairSpec
CONSTANTS
    Copies = 3
    Defect = "dueonly"
INVARIANTS
    TypeOK
    BurstAccounted
PROPERTIES
    BurstArrives
