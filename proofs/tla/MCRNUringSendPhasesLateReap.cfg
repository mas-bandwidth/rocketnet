\* The passing control under the flood: the code, two phases, every
\* completion reaped by the next receive call; start_packet never refuses.
SPECIFICATION MCSpec

CONSTANTS
    Phases       = 2
    Size         = 2
    MaxSegments  = 2
    MaxUpdates   = 4
    LateReap     = TRUE
    BaseRule     = TRUE
    QuotientRule = TRUE
    CountRule    = TRUE
    ResendRule   = TRUE

INVARIANTS
    TypeOK
    NoWriteWhileKernelOwned
    PendingMatches
    NeverRefusedUnderLateReap
