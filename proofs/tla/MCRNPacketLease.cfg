\* MCRNPacketLease: the code's rule without retired.  Insert, take and resolve
\* from two threads on a four-entry table whose frames all collide, two
\* resets, the epoch limit.  Every invariant, and the spin ends when every
\* thread is scheduled.
SPECIFICATION SpecFair

CONSTANTS
    Capacity          = 4
    Threads           = {1, 2}
    Frames            = {1, 2}
    Vals              = {1, 2}
    HashSpread        = 1
    MaxOps1           = 2
    MaxOps2           = 1
    MaxResets         = 2
    EpochLimit        = 2
    UsedLimit         = 2
    UseCas            = TRUE
    ConsumeCas        = TRUE
    BumpEpoch         = TRUE
    EpochLimited      = TRUE
    RetiredOn         = FALSE
    RetiredValidates  = FALSE
    OnWriting         = "spin"
    ValidCallers      = FALSE

INVARIANTS
    TypeOK
    NoWrongSuccess
    TakeOnce
    NoRacyRead
    InsertFindsSlot
    PublishedIntact
    ChainIntact
    ProbeBound

PROPERTIES
    SpinBounded
