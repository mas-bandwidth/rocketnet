\* MCSessionAcksLive: the liveness run (Spec: strong fairness on sends and receives,
\* eventual delivery per link; OpenedSurfacesOrLaps) on the committed instance.
SPECIFICATION Spec

CONSTANTS
    MaxSeq      = 4
    SentRing    = 4
    BatchCap    = 1
    Window      = 4
    MaxRanges   = 2
    DrainCap    = 4
    Burns       = TRUE
    Witness     = "none"
    D2RPattern  = "arbitrary"
    R2DPattern  = "arbitrary"
    Capacity    = 2
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = TRUE
    BurstStart  = 3
    BurstLen    = 2

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked

PROPERTIES
    OpenedSurfacesOrLaps
