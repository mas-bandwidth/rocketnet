\* A slot held also before the sweep's first frame: with queue 0 full for many updates the cursor stays on its slot, every update starts there, and a slot of queue 1 behind the one its single frame serves is never reached; BoundedWait must fail.
SPECIFICATION Spec
CONSTANTS
    N               = 4
    MaxRoom         = 2
    QueueCount      = 2
    MayJam          = {0}
    Unreachable     = {}
    Refused         = {}
    SkipUnreachable = TRUE
    SkipRefused     = TRUE
    QueueRule       = "holdfirst"
INVARIANTS
    TypeOK
    BoundedWait
