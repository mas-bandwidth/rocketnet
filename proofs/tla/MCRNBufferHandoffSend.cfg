\* MCRNBufferHandoff: the send rings (main produces, the I/O thread sends), every rule on. Must pass.
SPECIFICATION SpecFair

CONSTANTS
    N                 = 3
    Cap               = 2
    MaxItems          = 5
    MaxReady          = 2
    Direction         = "send"
    MainBlocks        = FALSE
    WorkUnderLock     = FALSE
    WriteAfterPublish = FALSE
    SkipWake          = FALSE
    ReleaseBeforeSent = FALSE
    DiscardOnStop     = FALSE
    DropFinal         = FALSE

INVARIANTS
    TypeOK
    OneOwner
    FreeIsEmpty
    ViewStable
    InOrder
    NoWorkUnderLock
    MainNeverWaits
    ExitSentAll

PROPERTIES
    StopSendsAll
