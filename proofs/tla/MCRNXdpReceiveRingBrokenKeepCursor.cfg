\* MCRNXdpReceiveRing reversed witness: a swap leaves the read cursor where
\* the last bank ended (no receive_read_index = 0), so main reads the bank
\* it claimed from there and skips the packets before it. Must fail
\* ConsumedInOrder.
SPECIFICATION Spec

CONSTANTS
    F1         = F1
    F2         = F2
    F3         = F3
    Frames     = {F1, F2, F3}
    RingSize   = 2
    PeekMax    = 2
    StageCap   = 2
    FillSize   = 6
    Budget     = 1
    MaxPackets = 4
    LockBatch  = 1
    KeepCursor <- KeepCursorBroken

INVARIANTS
    TypeOK
    ConsumedInOrder
