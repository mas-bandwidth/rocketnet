\* MCRNAckApplyPhaseBrokenNoGatherWhenFull: reversed witness (layout): a block
\* that finds the queue or the range store full is queued all the same, past
\* the end of the array.  Must fail InBounds.
SPECIFICATION Spec

CONSTANTS
    Clients             = {0, 1}
    Threads             = {main, g1, g2}
    Main                = main
    MaxBlock            = 2
    MaxRanges           = 1
    PendingCap          = 3
    RangesCap           = 2
    ExchangeTake        = TRUE
    CloseAppliesUntaken = TRUE
    CloseClearsClaim    = TRUE
    SettleOnlyReceiving = TRUE
    GatherWhenFull      = FALSE
    AdvanceTail         = TRUE

INVARIANTS
    TypeOK
    InBounds
