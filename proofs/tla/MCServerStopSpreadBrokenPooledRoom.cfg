\* MCServerStopSpread reversed witness: the stop before each burst's own queue was judged. The drain ends at a burst whose queue is full, and the stop step abandons only once the room summed over every queue is 0, so with one queue jammed and the other with room the bursts behind the jammed one are never sealed and the stop never finishes. Must fail StopFinishesWithoutRoom.
SPECIFICATION FairSpec

CONSTANTS
    SlotCount   = 2
    MaxSessions = 3
    Burst       = 2
    BankSize    = 2
    QueueCount  = 2
    RingSize    = 4
    SteadyCap   = 2
    Defect      = "pooledroom"

PROPERTY StopFinishesWithoutRoom
