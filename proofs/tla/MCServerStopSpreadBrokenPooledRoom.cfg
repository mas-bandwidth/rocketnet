\* MCServerStopSpread reversed witness: the stop before each burst's own queue was judged. The stop step abandons only once the room summed over every queue is 0 (and the drain has no pass over a full queue), so with one queue jammed and the other with room a burst on the jammed queue is never abandoned and the stop never finishes. TLC's trace fails on the pooled abandon alone. Must fail StopFinishesWithoutRoom.
SPECIFICATION FairSpec

CONSTANTS
    SlotCount   = 2
    MaxSessions = 3
    Burst       = 2
    BankSize    = 2
    QueueCount  = 2
    RingSize    = 4
    SteadyCap   = 2
    Simulator   = FALSE
    Defect      = "pooledroom"

PROPERTY StopFinishesWithoutRoom
