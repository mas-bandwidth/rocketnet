\* MCRNServerSendFairQueuesLive: the two queues of MCRNServerSendFairQueues.cfg
\* with the first queue's room read live (0 to 1 a flush, growing by one inside
\* it); the second queue's capacity stays K1. Every slot is written within
\* ceil(2 / 1) = 2 flushes that had its queue's full capacity.
SPECIFICATION Spec

CONSTANTS
    N       = 4
    K       = 1
    Conn    = {0, 1, 2, 3}
    WorkMax = 1
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "rounds"
    Q1      = {1, 3}
    K1      = 1
    QueueRule = "perqueue"
    RoomMin <- MCRoomZero

INVARIANTS
    TypeOK
    FairService
    NoUnitWasted
    OtherClientUnaffected
    DarkTakesOnlyItsProbes
    SameOrder
    OnlyLastWriters
    EndedWritesNothing
    CursorAsFullWalk
    VisitsBounded
