\* MCRNAckApplyPhaseBrokenLoadTake: reversed witness: the take reads the claim
\* and leaves it set (a load in place of the exchange), so a second thread
\* takes the same client in the same open phase.  Must fail OneTaker.
SPECIFICATION Spec

CONSTANTS
    Clients             = {0, 1}
    Threads             = {main, g1, g2}
    Main                = main
    MinBlock            = 1
    MaxBlock            = 2
    MaxRanges           = 1
    RangeCounts         = {0, 1}
    PendingCap          = 3
    RangesCap           = 2
    ExchangeTake        = FALSE
    CloseAppliesUntaken = TRUE
    CloseClearsClaim    = TRUE
    SettleOnlyReceiving = TRUE
    GatherWhenFull      = TRUE
    AdvanceTail         = TRUE
    DupGivesNothing     = TRUE

INVARIANTS
    TypeOK
    OneTaker
