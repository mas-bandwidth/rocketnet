\* The passing control with two payloads, so a duplicate replaces a record with different bytes.
SPECIFICATION MCSpec

CONSTANTS
    B        = 2
    Blocks   = 4
    MaxSeq   = 11
    Payloads = {1, 2}
    Broken   = "none"

INVARIANTS
    TypeOK
    SummariesExact
    GenerationsExact
    PiecesExact
    QueryIsReference
