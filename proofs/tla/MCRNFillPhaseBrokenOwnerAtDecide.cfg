\* MCRNFillPhaseBrokenOwnerAtDecide: reversed witness: the decide stores the
\* owner and the claim before the look, and a refused look puts them back in
\* three stores (the word to the lock's form, the owner, the word), the
\* code before the fix. A filler that claimed the client in an earlier phase
\* loads the word while another's claim shows in it, the other's look
\* refuses and puts the first back as owner, and the first loads the owner,
\* finds itself and takes the call as nested: NoFalseNest falls. Must fail.
SPECIFICATION Spec

CONSTANTS
    Fillers      = {f1, f2}
    Clients      = {c1, c2}
    NoOwner      = none
    MaxMain      = 2
    MaxFills     = 2
    MaxTakes     = 0
    LookFirst    = FALSE
    LoadStore    = FALSE
    ResetOnLeave = TRUE
    NoEpochLook  = FALSE
    NoRestore    = FALSE
    ScanOne      = FALSE
    NoWindow     = FALSE
    NoMainWindow = FALSE
    TakeUncounted = FALSE
    OptedAtStart  = TRUE
    ArmedAtCreate = FALSE
    OwnerAtDecide = TRUE
    KickAll       = FALSE
    FreshKept     = FALSE
    ShutOnEarly   = FALSE
    ScanFirst     = FALSE
    DepthMax      = 2
    Lines        = {0, 1}
    LineChoice   <- MCLineChoice
    f1 = f1
    f2 = f2
    f3 = f3

VIEW View

INVARIANTS
    TypeOK
    NoFalseNest
