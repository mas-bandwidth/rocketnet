\* The two-client gate case: MCServerSessionTwoClients.cfg's instance and
\* every invariant, with no liveness, so it fits the bounded budget. The
\* full control with HandshakeResolves and BurstsDrain is timeout debt, run
\* nightly. Two tokens, one run: a message layer's kick of one CONNECTED
\* client starts its disconnect burst while the other stays connected.
SPECIFICATION Spec
CONSTANTS
 SlotCount = 2
 MaxSessions = 2
 MaxTokens = 2
 MaxStarts = 1
 MaxCreates = 1
 DisconnectQueueCapacity = 1
 SealsPerUpdate = 1
 Defect = "none"
 UnresetField = "replay_window"
INVARIANTS TypeOK SlotOwnsItsSession StartOnlyFromStopped NoSendUnlessConnected ResetIsInit RecordIsCurrent SlotReuseObservesNothing NoClientWhileStopped StopDisconnectsAll DisconnectAllIsAtomic ReasonKeptWithinRun ResetTouchesOnlyItsSlot TokenAdmitsOnce NoReceiveUnlessRunning NoAdmitUnlessRunning MessageEndOnlyConnected DisconnectWorkBounded WaitingOnlyForEnded DisconnectQueueFinite DiscardedOnlyForEnded ConnIdNeverRepeats ConnIdLiveAndDistinct
