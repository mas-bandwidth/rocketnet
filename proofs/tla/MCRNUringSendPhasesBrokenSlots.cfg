\* Reversed witness: the submit counts the run's slots while the reap
\* retires one send, so one multi-slot run makes the phase's pending
\* count exceed its in-flight sends.  Must violate PendingMatches.
SPECIFICATION MCSpec

CONSTANTS
    Phases       = 2
    Size         = 2
    MaxSegments  = 2
    MaxUpdates   = 4
    LateReap     = FALSE
    BaseRule     = TRUE
    QuotientRule = TRUE
    CountRule    = FALSE
    ResendRule   = TRUE

INVARIANTS
    TypeOK
    PendingMatches
