\* MCRNGsoHandoff reversed witness: the RX claim leaves the most recently staged packet out of its view, as the worker-driven publish deferred a packet staged after it to the next update. StagedBeforeClaimInView falls. Must fail.
SPECIFICATION SpecFair

CONSTANTS
    RxCap            = 2
    TxCap            = 2
    MaxRx            = 4
    MaxTx            = 4
    PublishWhileHeld = FALSE
    MainBlocks       = FALSE
    FullDrops        = FALSE
    CarryBehind      = FALSE
    ClaimStale       <- ClaimStaleBroken

INVARIANTS
    TypeOK
    RxOneOwner
    TxOneOwner
    TxQueuesDistinct
    NoPublishWhileHeld
    StagedBeforeClaimInView
    RxBacksOff
    FreeIsEmpty
    SentOrHeld
    RxInOrder
    TxInOrder
    MainNeverWaits
    StopJoinsBeforeFree
    ExitSentAll

PROPERTIES
    StopCompletes
