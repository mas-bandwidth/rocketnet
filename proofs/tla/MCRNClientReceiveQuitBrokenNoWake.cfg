    Platform       = "linux"
    WaitTimeout    = "unreliable"
    WakeBeforeQuit = FALSE
    NoWake         = TRUE

INVARIANTS
    TypeOK
    WokenSeesQuit

PROPERTIES
    DestroyCompletes
