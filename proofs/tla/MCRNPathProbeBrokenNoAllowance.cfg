\* The server answers every probe of a mapping in one update: a replayed copy is answered beside the genuine probe.
SPECIFICATION Spec

CONSTANTS
    ClientSet     = {2, 1}
    ServerList    = {2, 1}
    CapsUp        = {2}
    CapsDown      = {2}
    K             = 2
    MaxBursts     = 0
    AttackBudget  = 1
    AttackKinds   = {"replay", "probe", "reply"}
    Forger        = FALSE
    Timed         = TRUE
    LossBound     = TRUE
    MaxReuses     = 0
    ReuseCapsUp   = {}
    ReuseCapsDown = {}
    Broken        = "noallowance"

INVARIANT OneReplyPerUpdate
