\* The server answers every probe of a mapping in one update: a replayed copy gets a second reply.
SPECIFICATION Spec

CONSTANTS
    Ceiling      = 3
    CapsUp       = {0, 1, 2, 3}
    CapsDown     = {0, 1, 2, 3}
    W            = 2
    MaxLoss      = 1
    AttackBudget = 1
    ClientList   <- ThreeStep
    ServerList   = {3, 2, 1}
    LateExpire   = FALSE
    Broken       = "noallowance"

INVARIANT OneReplyPerUpdate
