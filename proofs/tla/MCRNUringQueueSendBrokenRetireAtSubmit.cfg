\* Reversed witness: the worker retires its bank once every slot is
\* submitted, with runs still in the kernel; three flushes later the bank
\* is the producer again and the fill writes a slot the kernel owns.
\* Must violate NoWriteWhileKernelOwned.
SPECIFICATION MCSpec

CONSTANTS
    NB         = 3
    S          = 2
    Dests      = {1, 2}
    MaxSeg     = 2
    Demand     = 3
    MaxFlush   = 3
    MaxEagain  = 1
    RetireRule = "submitted"
    EagainRule = "retry"
    LockRule   = "try"

INVARIANTS
    TypeOK
    NoWriteWhileKernelOwned
