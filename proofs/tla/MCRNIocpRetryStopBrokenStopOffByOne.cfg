\* MCRNIocpRetryStop reversed witness: the stop test off by one (stop - position < 0). A pass claims the position at its stop, which its own refused repost pushed. PassBounded falls. Must fail.
SPECIFICATION Spec

CONSTANTS
    NumOps          = 1
    Workers         = {w1}
    Cap             = 2
    PosMod          = 16
    MaxFail         = 2
    MaxComplete     = 1
    StopSlack       = 1
    ClaimBeforeStop = FALSE

INVARIANT PassBounded
