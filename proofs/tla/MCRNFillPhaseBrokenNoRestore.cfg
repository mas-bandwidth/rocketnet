\* MCRNFillPhaseBrokenNoRestore: reversed witness: a refused look leaves
\* its claim in place; when the main operation it met is refused too, the
\* epoch stays, and the next filler of the client, honest, is refused:
\* NoFalseAlarm falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Fillers      = {f1, f2}
    Clients      = {c1, c2}
    NoOwner      = none
    MaxMain      = 2
    MaxFills     = 2
    LookFirst    = FALSE
    LoadStore    = FALSE
    ResetOnLeave = TRUE
    NoEpochLook  = FALSE
    NoRestore    = TRUE
    ScanOne      = FALSE
    OptedAtStart  = TRUE
    ArmedAtCreate = FALSE
    Lines        = {0, 1}
    LineChoice   <- MCLineChoice
    f1 = f1
    f2 = f2
    f3 = f3

INVARIANTS
    TypeOK
    NoFalseAlarm
