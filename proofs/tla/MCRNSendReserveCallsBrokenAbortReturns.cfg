    Clients   = {0, 1}
    NQ        = 1
    Reserve   = 3
    MaxFree   = 5
    SeenInit  = 100
    Chunk     = 1
    Guard     = 1
    RoomOnly     = FALSE
    NoRefresh    = FALSE
    AbortReturns = TRUE
    TailLeak     = FALSE
    MinRoom      = FALSE
    StickyReserve = FALSE
    OwnUnbounded  = FALSE

CONSTRAINT Bound

INVARIANTS
    ReserveKept
