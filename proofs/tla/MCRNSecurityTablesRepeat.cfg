\* MCRNSecurityTablesRepeat: RepeatSpec, the fixed code.  One sender with a
\* valid token is refused past the verify for a reason it does not choose
\* (its client id already holds a slot, or the server is full) every time;
\* nothing is charged, but its token is held for the rest of the update, so
\* it spends at most one verify an update and the honest client, with weak
\* fairness only, connects.
SPECIFICATION RepeatSpec

CONSTANTS
    None = None
    Addrs = {"A", "B"}
    Tokens = {"th", "te", "tf"}
    Expire <- MCExpire
    Cid <- MCCid
    MaxClock = 4
    CookieLife = 1
    RotatePeriod = 2
    MaxClients = 2
    HistoryCap = 2
    AdmittedCap = 2
    VerifyBudget = 2
    HandshakeDeadline = 4
    Rotation = TRUE
    AcceptPrevious = TRUE
    RefuseAdmittedAtResponse = TRUE
    RequestChecksExpiry = TRUE
    EvictLiveHistory = TRUE
    DeniedConsumesToken = FALSE
    CapVerifyBudget = TRUE
    PreviousOutlivesWindow = FALSE
    BindAtRequest = FALSE
    Holds <- MCHolds
    HoldUntilExpire = FALSE
    CheckCidAtResponse = TRUE

INVARIANTS
    FloodInvariants

PROPERTIES
    HonestConnectsUnderFlood

CHECK_DEADLOCK FALSE
