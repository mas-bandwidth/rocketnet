\* MCRNPortableTx: the rule.  The code's three banks of two packets, calls of
\* up to two packets (so a batch spans banks) and six packets in all, enough
\* to fill every bank, so a publish finds no free bank.  All invariants and
\* both liveness properties under SpecFair with no wait timeout.
SPECIFICATION SpecFair

CONSTANTS
    NumBanks          = 3
    Cap               = 2
    Batch             = 2
    MaxPackets        = 6
    FullSlack         = 0
    HeadMod           = 3
    TailMod           = 3
    QuitUnderLock     = TRUE
    PublishBeforeQuit = TRUE
    PublishUntilSent  = TRUE
    RetryOnIdle       = TRUE
    WakeOnPublish     = TRUE
    Timeout           = FALSE

INVARIANTS
    InBounds
    TypeOK
    ExclusiveOwnership
    FreeBanksEmpty
    ExactSend
    MainLockIsBrief
    QuitAfterFinalBank
    ExitSentAll
    StopDropsNothing

PROPERTIES
    EveryAcceptedSent
    StopCompletes
