\* MCRNLiveFleetRun reversed witness: arm starts no watchdog. Must fail XdpNeverOrphaned: after a server crash, an ssh drop
\* or the orchestrator dying without its trap, XDP stays attached past the
\* watchdog bound.
SPECIFICATION Spec

CONSTANTS
    C1            = C1
    C2            = C2
    S1            = S1
    Clients       = {C1, C2}
    TestServer    = S1
    Cycles        = 2
    T             = 1
    WatchdogBound = 2
    DeadmanBound  = 5
    MaxClients    = 2
    MaxFaults     = 1
    WatchdogPresent <- WatchdogPresentBroken

INVARIANTS
    TypeOK
    XdpNeverOrphaned
    TeardownDetaches
    WatchdogKillsOnlyOnFault
    XdpOnlyUnderDeadman
    NoClientBeforeListen
    NoBenchServer
    ReconnectAfterTwoTimeouts
    ReconnectIntoFreedSlot
    NeverDenied
