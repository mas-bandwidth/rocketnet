\* Refuse-once mutation: the advance moves the high-water mark but does not
\* set the ring bit, so a sequence that opened is accepted again; must
\* violate ReceivedIsRefused.
SPECIFICATION MCSpec

CONSTANTS
    Words             = 6
    WordBits          = 2
    ClearedWords      = 6
    MaxSeq            = 36
    GateBeforeAdvance = TRUE
    GateBeforeOpen    = TRUE
    MarkOnAdvance     = FALSE
    RefuseBelowFloor  = TRUE

INVARIANT ReceivedIsRefused
