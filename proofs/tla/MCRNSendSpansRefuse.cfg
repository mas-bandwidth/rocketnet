\* A smaller control for the refusal's action property (RefuseLeavesRing
\* reads Place for every length on every step, so the committed run keeps
\* only the invariant SpansNeverExhaust): two lengths, three descriptors,
\* and the refusal counter modulo 3 (the committed run drops it, CountMod = 1).
SPECIFICATION Spec

CONSTANTS
    SR            = 96
    Lengths       = {32, 96}
    Q             = 3
    FloorAtOldest = TRUE
    PadOnWrap     = TRUE
    SpliceBoth    = TRUE
    RefuseExhausts = FALSE
    LinkFirst     = FALSE
    CountMod      = 3
    UndoTail      = TRUE
    LinkClearsNext = TRUE

INVARIANTS
    TypeOK
    LiveSpansDisjoint
    SpanInsideRing
    Aligned
    HeadIsOldestStart
    ListInAllocationOrder
    EmptyIsZero
    FullAdmitsNothing
    IdleAdmitsAnyMessage
    LiveBetweenHeadAndTail
    SpansNeverExhaust

PROPERTIES
    RefuseLeavesRing
