\* MCServerConnection liveness: one client, one slot, a FIFO link that drops the first
\* packet of every kind, every deadline off. The client connects and the server is
\* never left waiting (Connects, ServerNotStranded).
SPECIFICATION Spec

CONSTANTS
    NumClients          = 1
    NumAddrs            = 1
    NumTokens           = 1
    MaxSlots            = 1
    MapCap              = 1
    HeldCapacity        = 2
    MaxAttempts         = 1
    MaxNonces           = 1
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 0
    HandshakeDeadline   = 0
    Disconnects         = FALSE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "own"
    History             = "kept"
    KindLoss            = "firstkind"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2

INVARIANTS
    SafetyInvariants

PROPERTIES
    Connects
    ServerNotStranded
