\* MCRNPortableRx: the rule.  Three banks, a socket read of up to two
\* datagrams, a receive budget of one (so the consumer tail is retained
\* across calls), four datagrams and two chaff datagrams, a whole read's
\* budget, so a read can end on its budget with nothing kept.  Invariants
\* and both liveness properties under SpecFair with no wait timeout.
SPECIFICATION SpecFair

CONSTANTS
    NumBanks       = 3
    Cap            = 2
    Budget         = 1
    MaxDatagrams   = 4
    MaxChaff       = 2
    HoldOnFull     = TRUE
    ReturnWhenRead = TRUE
    QuitBeforeWake = TRUE
    WakeOnReturn   = TRUE
    Timeout        = FALSE
    BoundedRead    = TRUE

INVARIANTS
    TypeOK
    ExclusiveOwnership
    CursorInBank
    ExactDelivery
    MainLockIsBrief
    ReadBudget

PROPERTIES
    EveryDatagramDelivered
    StopCompletes
