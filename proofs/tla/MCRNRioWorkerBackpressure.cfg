\* MCRNRioWorker with banks of one datagram and three datagrams, no sends:
\* the worker fills its bank before main starts on it, so it stops
\* dequeuing (backpressure) and waits for main's wake.  Every invariant and
\* the receive and stop liveness properties under SpecFair.
SPECIFICATION SpecFair

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 2
    Cap             = 1
    View            = 2
    MaxDatagrams    = 3
    MaxSends        = 0
    DrainBatch      = 2
    StopDrainWaits  = 2
    InlineStop      = FALSE
    BoundedStopDrain = TRUE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    StopSendsHanded
    StopSendsFinished
    TypeOK
    SlicesAccounted
    ExclusiveOwnership
    ExposedStable
    DeliveredByNextCall
    ExactDelivery
    FillPhaseOwnedByMain
    NoSendDuplicated
    FreedOnlyWhenDrained

PROPERTIES
    EveryDatagramConsumed
    StopCompletesUnlessRefused
