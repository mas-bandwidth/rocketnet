\* A one-entry client list does no probing: both ends stay at P0 and nothing new goes on the wire.
SPECIFICATION FairSpec

CONSTANTS
    ClientSet     = {2}
    ServerList    = {2, 1}
    CapsUp        = {0, 1, 2}
    CapsDown      = {0, 1, 2}
    K             = 2
    MaxBursts     = 1
    BurstSpacings = 0
    AttackBudget  = 1
    Forger        = FALSE
    Timed         = TRUE
    Broken        = "none"

INVARIANTS
    TypeOK
    RaisedWithinPath
    ServerNeverAhead
    FailOnlyAtP0
    NeverAtRuledOut
    ReplyOnlyConnected
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate
    NoWrongRuleOut

PROPERTIES
    PNeverDecreases
    StrikeNeedsSmall
    StrikeNeedsSpacing
    ServerRaisesOnConfirm
    ClientRaisesOnAuthLarge
    NoProbeAfterDone
    Converges
