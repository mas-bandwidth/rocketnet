\* MCRNIocpSendLease at four operations and four cells, so p & 3 picks the cell and positions go round the queue: two callers and one completion worker, every rule on. Must pass.
SPECIFICATION Spec

CONSTANTS
    NumOps        = 4
    Callers       = {t1, t2}
    Workers       = {w1}
    GenMax        = 1
    MaxLeases     = 6
    GenWrap       = FALSE
    RetireRefused = FALSE

INVARIANTS
    TypeOK
    StaleNeverNamesLease
    CellsMatchPositions
    QueueRefsCurrent
    OneOwner
    PacketIdsDecode
    RetiredOnlyAtGenMax
    RefusalOnlyWhilePopStalled
