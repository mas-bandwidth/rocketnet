\* MCRNSecurityTablesFlood: the failed-signature budget under a forged-request
\* flood, the fixed code (RefuseUnremembered FALSE, its definition in
\* RNSecurityTables.tla).  Two forgers against one table slot and a budget of
\* two spend the budget and fill the table; the honest client still connects.
\* The flood clock moves forward and steps back, and the window rolls over in
\* both directions (BackwardsRollover TRUE): FloodInvariants carries
\* FloodWindowBounded.
SPECIFICATION FloodSpec

CONSTANTS
    None = None
    Addrs = {"A", "B"}
    Tokens = {"th", "te", "tf"}
    Expire <- MCExpire
    Cid <- MCCid
    MaxClock = 4
    CookieLife = 1
    RotatePeriod = 2
    MaxClients = 2
    HistoryCap = 2
    AdmittedCap = 2
    VerifyBudget = 2
    HandshakeDeadline = 4
    Rotation = TRUE
    AcceptPrevious = TRUE
    RefuseAdmittedAtResponse = TRUE
    AdmitExpiredAtResponse = FALSE
    EvictLiveHistory = FALSE
    DeniedConsumesToken = FALSE
    CapVerifyBudget = TRUE
    PreviousOutlivesWindow = FALSE
    BindAtRequest = FALSE
    Holds <- MCHolds
    HoldUntilExpire = FALSE
    CheckCidAtResponse = TRUE

INVARIANTS
    FloodInvariants

PROPERTIES
    HonestConnectsUnderFlood

CHECK_DEADLOCK FALSE
