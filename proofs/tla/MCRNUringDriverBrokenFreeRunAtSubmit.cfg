\* MCRNUringDriver reversed witness: a segmented send run hands the slots
\* after its head back to the staging at Submit, as if the kernel had copied
\* their frames, while the run's one CQE is still to come.  Must fail
\* NoReuseWhileKernelOwned: a slot the staging holds free is one whose frame
\* the kernel still reads.
SPECIFICATION Spec

CONSTANTS
    Slots             = 2
    Buffers           = 2
    MaxSteps          = 2
    Budget            = 1
    Room              = 2
    ReapWithinRoom    = TRUE
    ResetWaitsForReap = TRUE
    ReapIntoFill      = TRUE
    BoundedReap       = TRUE
    RearmOnReceive    = TRUE
    RunRetiredByCqe   = FALSE

INVARIANTS
    TypeOK
    NoReuseWhileKernelOwned
    ExposedStable
    BufferReturnedAfterCopy
    FreedOnlyWhenDrained
