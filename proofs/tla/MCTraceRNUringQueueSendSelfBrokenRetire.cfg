\* Reversed witness of the trace check: the record retires the bank while
\* its run is pending, as code that recycles a bank before its last
\* completion would log.  Must violate TraceConsistent, at record 6.
SPECIFICATION TraceSpec

CONSTANTS
    NB         = 3
    S          = 2
    Dests      = {1, 2}
    MaxSeg     = 2
    Demand     = 3
    MaxFlush   = 3
    MaxEagain  = 1
    RetireRule = "cqe"
    EagainRule = "retry"
    TraceLog   <- BadLog

INVARIANTS
    TraceConsistent
