\* The window guard one past capacity (nxt < U + W + 1): number U + W is
\* written into the slot of number U while U is unacked, so U loses its
\* slot and can never be acked (WindowOwnsSlots).
SPECIFICATION MCSpec

CONSTANTS
    W                 = 4
    N                 = 6
    D                 = 2
    GenMax            = 6
    CheckNumber       = TRUE
    WindowSlack       = 1

CHECK_DEADLOCK FALSE

INVARIANT WindowOwnsSlots
