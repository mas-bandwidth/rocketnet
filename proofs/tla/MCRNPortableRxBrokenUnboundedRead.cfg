\* MCRNPortableRx reversed witness: a socket read counts only the datagrams
\* it keeps, so chaff (zero-length datagrams, refused sources) never fills
\* the bank and never ends the read, which takes more than Cap datagrams
\* before the worker tests quit again.  Must fail ReadBudget.
SPECIFICATION Spec

CONSTANTS
    NumBanks       = 3
    Cap            = 2
    Budget         = 1
    MaxDatagrams   = 1
    MaxChaff       = 3
    HoldOnFull     = TRUE
    ReturnWhenRead = TRUE
    QuitBeforeWake = TRUE
    WakeOnReturn   = TRUE
    Timeout        = FALSE
    BoundedRead    = FALSE

INVARIANTS
    TypeOK
    ExactDelivery
    ReadBudget
