\* MCRNRttFilterBrokenNoFilterPoisons: MCRNRttFilterStandard.cfg with no filter
\* (every acknowledged packet sampled): a number owed through an outage is
\* acknowledged late and the sample reaches RttHigh + Probe. Must fail
\* OutageNeverPoisons: the filter is what keeps the bound.
SPECIFICATION Spec
CONSTANTS
    Probe     = 3
    RttLow    = 0
    RttHigh   = 1
    OutageMax = 4
    M         = 2
    P         = 2
    Rule      = "none"
    FirstAck  = FALSE
    DupSample = FALSE
INVARIANT
    OutageNeverPoisons
