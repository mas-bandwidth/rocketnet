\* MCRNClientIoDecrypt reversed witness: the I/O thread opens a datagram
\* before its replay check, so a duplicate or too-old copy reaches the
\* AEAD and is refused by the replay check after it.  Must fail
\* CheapRefusalsFirst.
SPECIFICATION Spec

CONSTANTS
    BufferCap        = 2
    MaxDatagrams     = 4
    MaxSeq           = 3
    W                = 1
    MaxReplays       = 1
    MaxForged        = 1
    IntegrityLimit   = 1
    OpenBeforeReplay = TRUE
    SharedWindow     = FALSE
    NoRetire         = FALSE
    CountOnIo        = FALSE

INVARIANTS
    TypeOK
    CheapRefusalsFirst
    NoOpenWithoutKeys
    MirrorAgrees
    AcceptedOnce
    SingleWriter
    ExposedStable
    NoReceiveStall
