\* The code with two queues: destination d1 (queue 0) accepts segmentation;
\* on queue 1, destinations d2 and d3 refuse and d4 accepts.  Once d1's
\* segmented send was accepted, queue 1 keeps segmenting for d4 however many
\* of its own destinations refused (the transport-wide accepted flag).  A
\* fallback taken before any segmented send was accepted stays (the rule
\* allows it), so OtherDestinationUnaffected is not checked here.
SPECIFICATION Spec

CONSTANTS
    Dests          = {"d1", "d2", "d3", "d4"}
    Refusing       = {"d2", "d3"}
    KernelSegments = TRUE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"
    Slot           <- SlotDistinct
    Queue          <- QueueSplit
    AcceptedRule   = "transport"
    FlagScope      = "queue"

INVARIANTS
    TypeOK
    NoFallbackAfterAccepted
    NothingDropped
    RefusedOnce
    KernelFallback
