\* MCRNGsoRecvFill passing control: each call asks only for messages whose every segment fits, and no run is longer than the room made for it.
SPECIFICATION Spec

CONSTANTS
    Cap         = 4
    Seg         = 2
    MaxRun      = 2
    Batch       = 2
    MaxArrive   = 5
    SockCap     = 3
    VlenRule    = "room"

INVARIANTS
    TypeOK
    NoOverflow
    DropOnlyPastSeg
