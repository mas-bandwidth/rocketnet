\* Reversed witness: a refused fit exhausts the region, as
\* rn_region_send_refuse did in v1.0 (the send-side kick), so the store
\* leaves its region exhausted. Must violate StoreNeverExhausts (an action
\* property: the refusing start step sets the flag).
SPECIFICATION MCSpec
VIEW View

CONSTANTS
    N             = 3
    Q             = 4
    GenMod        = 3
    FreshGuard    = TRUE
    LowerCursor   = TRUE
    ChunkSkipZero = TRUE
    DescSkipZero  = TRUE
    KeepFreeSlot  = TRUE
    CountQueueFull = TRUE
    StartOrder    = "fit"
    CountMod      = 1
    RefuseExhausts = TRUE

INVARIANTS
    TypeOK

PROPERTIES
    StoreNeverExhausts
