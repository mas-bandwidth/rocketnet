\* MCRNServerSendFairQueuesLiveSkip: the two queues of
\* MCRNServerSendFairQueues.cfg with the first queue's room read live (0 to 1
\* a flush, growing by one inside it); the second queue's capacity stays K1.
\* Not a reversed witness: the code as it is. A slot held before any frame
\* of the flush was written does not hold the cursor
\* (rn_message_object_send_packets), so when the first queue's room is spent
\* at the start of one flush and full at the next, slot 2 is held and walked
\* past, then cut again behind slots 0 and 1: it waits ceil(2 / 1) = 2 flushes
\* that had the full room. Must fail FairService. Handed up as code-wrong
\* (MM057); README-RNSendRotation.md, revision 1.2.
SPECIFICATION Spec

CONSTANTS
    N       = 4
    K       = 1
    Conn    = {0, 1, 2, 3}
    WorkMax = 1
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "rounds"
    Q1      = {1, 3}
    K1      = 1
    QueueRule = "perqueue"
    RoomMin <- MCRoomZero

INVARIANT FairService
