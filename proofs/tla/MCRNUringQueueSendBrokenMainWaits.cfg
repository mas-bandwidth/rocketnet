\* Reversed witness: main acquires the handoff mutex instead of trying it,
\* as send_packets and idle did before round 1 (R49), so a publish while
\* the worker is inside its claim or retire blocks main on the worker.
\* Must violate MainNeverWaits.
SPECIFICATION MCSpec
VIEW MCSafetyView

CONSTANTS
    NB         = 3
    S          = 2
    Dests      = {1, 2}
    MaxSeg     = 2
    Demand     = 3
    MaxFlush   = 3
    MaxEagain  = 1
    RetireRule = "cqe"
    EagainRule = "retry"
    LockRule   = "wait"

INVARIANTS
    TypeOK
    MainNeverWaits
