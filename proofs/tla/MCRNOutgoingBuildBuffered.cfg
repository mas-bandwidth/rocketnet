\* MCRNOutgoingBuild control on the buffered transport (the server's own
\* payload ring): an aborted or dropped frame stays spent until the flush
\* empties the ring. Must pass every invariant, ReliableSentWithinOneUpdate,
\* PriorRecordsUnmoved and FrameClosedOnlyByFullOrFlush.
SPECIFICATION Spec

CONSTANTS
    N         = 6
    Cap       = 3
    NumFrames = 2
    MaxPackets = 1
    MaxAcks   = 1
    MaxFaults = 1
    Kind      <- MCKind
    Fits      <- MCFits
    Decl      <- MCDecl
    CopyStep  <- CopyStepDesign
    SharedQuota = TRUE
    Reserve   = TRUE
    MovePrior = FALSE
    ReuseCommitted = FALSE
    Buffered  = TRUE

INVARIANTS
    TypeOK
    PacketQuota
    BytesUnchangedInPlace
    NoCopy
    AcksNeverLost
    ModeOrder

PROPERTIES
    ReliableSentWithinOneUpdate
    PriorRecordsUnmoved
    FrameClosedOnlyByFullOrFlush
