\* Reversed witness: a drain stores head := the end of what it takes, so
\* the slots it hands main are free to the worker while main reads them
\* (the trace plant, ROCKETNET_URING_RECEIVE_QUEUE_PLANT).  Must violate
\* NoTornRead.
SPECIFICATION MCSpec

CONSTANTS
    S           = 3
    B           = 4
    TailWrap    = 8
    MaxArrive   = 5
    MaxSegs     = 2
    DrainMax    = 2
    RoomRule    = "refresh"
    SlotRule    = "mod"
    ReleaseRule = "take"
    CounterWrap = 0

INVARIANTS
    TypeOK
    NoTornRead
