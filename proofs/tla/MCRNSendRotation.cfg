\* The passing control of the write pass: two connections, three frames a
\* flush, windows that stall and budgets that refuse.
SPECIFICATION MCSpec

CONSTANTS
    N           = 2
    Cap         = 3
    MaxFlush    = 3
    EnvStall    = TRUE
    EnvShortAck = FALSE
    EnvRefuse   = TRUE
    EnvVain     = FALSE
    KeepDone    = TRUE
    StallGate   = TRUE
    FitsGate    = TRUE
    WriteFirst  = TRUE
    CursorNext  = TRUE
    CutCursor   = TRUE
    VainEnds    = TRUE

INVARIANTS
    TypeOK
    NoRefusalAbort
    AbortsBounded
    UnlistedPassEnded
    SkippedWritesNothing
    CursorAsFullWalk
    VisitsBounded
    ServedWhenCapacity
    BoundedWait
