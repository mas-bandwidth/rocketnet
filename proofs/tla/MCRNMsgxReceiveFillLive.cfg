    Sockets = 2
    Capacity = 3
    Batch = 2
    Budget = 3
    Buffer = 3
    CallCaps = {1, 3}
    MaxArrivals = 5
    MaxErrors = 1
    ReadPastRoom = FALSE
    ReadPastBudget = FALSE
    HoldWithoutMove = FALSE
    FreeNotReset = FALSE
    ReadOnlyLeft = FALSE
    StopCountSkipsWorker = FALSE
INVARIANTS TypeOK FreeIffShared NoSharedSlot FreeIsEmpty NoFullDrop BudgetKept Conserved StopCounted HeldOnlyWhenFull DeliveredByNextCall
PROPERTY AllConsumed StopEnds HoldOnlyWhenNowhere
