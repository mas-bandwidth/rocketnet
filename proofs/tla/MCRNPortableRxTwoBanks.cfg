\* MCRNPortableRx with two banks: the producer and one other, so every
\* publish waits for main to return its consumer.
SPECIFICATION SpecFair

CONSTANTS
    NumBanks       = 2
    Cap            = 2
    Budget         = 1
    MaxDatagrams   = 4
    HoldOnFull     = TRUE
    ReturnWhenRead = TRUE
    QuitBeforeWake = TRUE
    WakeOnReturn   = TRUE
    Timeout        = FALSE

INVARIANTS
    TypeOK
    ExclusiveOwnership
    CursorInBank
    ExactDelivery
    MainLockIsBrief

PROPERTIES
    EveryDatagramDelivered
    StopCompletes
