\* Reversed witness: freeing the newest span leaves the tail where it was
\* (v1.0.0 to v1.1.3), so a start aborted behind a live span keeps its bytes
\* until the older spans go. Must violate AbortReturnsRoom.
SPECIFICATION Spec

CONSTANTS
    SR            = 96
    Lengths       = {32, 96}
    Q             = 3
    FloorAtOldest = TRUE
    PadOnWrap     = TRUE
    SpliceBoth    = TRUE
    RefuseExhausts = FALSE
    LinkFirst     = FALSE
    CountMod      = 1
    UndoTail      = FALSE
    LinkClearsNext = TRUE

INVARIANTS
    TypeOK

PROPERTIES
    AbortReturnsRoom
