\* Reversed witness: MCRNReceiveAllowanceFlood.cfg with ServerAckSpends =
\* FALSE (the server's own standalone acks, which elicit nothing, are counted
\* as credit). A flooder's acks pass past what the server's eliciting packets
\* pay for. TLC must fail AcksBounded.

SPECIFICATION Spec

CONSTANTS
    Correct      = {}
    Flooders     = {f1}
    B            = 1
    Factor       = 2
    MaxPkt       = 2
    T            = 2
    Horizon      = 5
    FloodPerTick = 1
    MaxNet       = 1
    MaxBack      = 1
    MaxReconnect = 1
    Refill       = TRUE
    CapFull      = TRUE
    PerClient    = TRUE
    Monotone     = TRUE
    MaxElicit    = 3
    Kinds        = {"pay", "ack", "ka", "dc"}
    AckCredit    = TRUE
    Control      = TRUE
    CreditBound  = TRUE
    ServerAckSpends = FALSE
    c1 = c1
    f1 = f1

INVARIANTS
    TypeOK
    AcksBounded
