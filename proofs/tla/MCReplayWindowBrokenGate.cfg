\* Advance-before-gate mutation (OV-34): the open and the advance run before
\* the slot check, so a session packet on a mapping without a slot moves the
\* window; must violate NoAdvanceBeforeConnect.  GateBeforeOpen is FALSE as
\* well: a gate before the open is a gate before the advance.
SPECIFICATION MCSpec

CONSTANTS
    Words             = 6
    WordBits          = 2
    ClearedWords      = 6
    MaxSeq            = 36
    GateBeforeAdvance = FALSE
    GateBeforeOpen    = FALSE

INVARIANT NoAdvanceBeforeConnect
