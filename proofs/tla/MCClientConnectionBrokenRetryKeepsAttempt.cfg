\* Reversed witness: the pre-fix retry, which keeps the earlier attempt's
\* cookie and replay window (AppConnectKeepsAttempt, only in
\* SpecRetryKeepsAttempt). TLC must fail FreshAttemptFromFailure: the only
\* slot is held, the server denies the request that carries the cookie, and
\* the connect from the denied state starts attempt 2 still holding it.
SPECIFICATION SpecRetryKeepsAttempt
CONSTANTS
    SendInterval     = 1
    Timeout          = 0
    Deadline         = 0
    ServerDeadline   = 0
    MaxAttempts      = 2
    MaxNonces        = 1
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 1
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = FALSE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
PROPERTIES
    FreshAttemptFromFailure
