\* MCRNWriterFinishBrokenWalkDrops: the committed run with KeepLeft FALSE: send_packets clears the queued and held messages its capacity did not carry instead of leaving them for the next walk, and counts only what it carried (Accounted).
SPECIFICATION Spec

CONSTANTS
    Writers          = {w1, w2}
    Clients          = {c1, c2}
    NoOwner          = none
    Capacity         = 2
    MaxStarts        = 5
    SealAtFinish     = TRUE
    RefuseNoCapacity = TRUE
    CheckOwner       = TRUE
    Buffered         = FALSE
    RingRefuses      = FALSE
    Budgeted         = FALSE
    RestartAtFinish  = TRUE
    ValidateFirst    = TRUE
    KeepLeft         <- BrokenKeepLeft

INVARIANT
    Accounted
