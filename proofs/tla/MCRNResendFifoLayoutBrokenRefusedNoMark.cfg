\* push_mark that links a refused resend right before the mark but leaves
\* the mark where it was: the class's first number on the wire is not its
\* mark, so the walk of the numbers on the wire skips the refused resend
\* (MarkMatch).
SPECIFICATION MCSpec

CONSTANTS
    W                 = 4
    SelfTailFix       = TRUE
    TailOnEnd         = TRUE
    UnlinkClearsClass = TRUE
    InsertSetsClass   = TRUE
    MarkOnUnlink      = TRUE
    MarkOnPushTail    = TRUE
    MarkInitNone      = TRUE
    RefusedTakesMark  = FALSE
    RefusedBeforeMark = TRUE
    ParkContract      = TRUE

INVARIANT MarkMatch
