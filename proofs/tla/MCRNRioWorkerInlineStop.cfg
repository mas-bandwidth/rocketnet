\* MCRNRioWorker: create's failure path, the rule.  Stop before the worker
\* exists, five posted slices, one datagram, batches of two and one wait.
\* Every pass may have its closesocket refused.  The inline drain runs at
\* most two passes, drains every completion in one pass once closed, and
\* otherwise leaks: invariants, LeakOnlyAfterRefusal and StopCompletes with
\* no fairness on a refused closesocket.
SPECIFICATION SpecFair

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 5
    NumBanks        = 2
    Cap             = 2
    View            = 2
    MaxDatagrams    = 1
    MaxSends        = 0
    DrainBatch      = 2
    StopDrainWaits  = 1
    InlineStop      = TRUE
    BoundedStopDrain = TRUE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    TypeOK
    SlicesAccounted
    FreedOnlyWhenDrained
    StopSendsFinished
    LeakOnlyAfterRefusal

PROPERTIES
    StopCompletes
