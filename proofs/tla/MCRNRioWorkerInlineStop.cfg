\* MCRNRioWorker: create's failure path, the rule.  Stop before the worker
\* exists, five posted slices, one datagram, batches of two and one wait.
\* Every pass may have its closesocket refused, and the cancellations of a
\* closed socket arrive one at a time (CancelArrives).  The inline drain
\* runs until StopDrainWaits + 1 passes have stalled, drains every
\* completion that has arrived, and otherwise leaks: invariants, LeakOnlyAfterStalls and StopCompletes with
\* no fairness on a refused closesocket.
SPECIFICATION SpecFair

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 5
    Cap             = 2
    View            = 2
    MaxDatagrams    = 1
    MaxSends        = 0
    DrainBatch      = 2
    StopDrainWaits  = 1
    InlineStop      = TRUE
    BoundedStopDrain = TRUE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    TypeOK
    SlicesAccounted
    FreedOnlyWhenDrained
    StopSendsFinished
    LeakOnlyAfterStalls

PROPERTIES
    StopCompletes
