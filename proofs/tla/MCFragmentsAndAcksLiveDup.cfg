\* MCFragmentsAndAcksLiveDup: live-dup. The instance on which the old per-link
\* fairness failed: MaxSeq 1, one payload of two fragments, burns off, data link
\* "none", ack link "arbitrary" with duplication, reordering off;
\* OpenedSurfacesOrLaps only (README-FragmentsAndAcks.md).
SPECIFICATION Spec

CONSTANTS
    MaxSeq       = 1
    SentRing     = 4
    AggRing      = 2
    BatchCap     = 1
    Window       = 4
    MaxRanges    = 2
    Slots        = 1
    IdSpace      = 8
    FirstId      = 1
    StaleAhead   = 2
    StaleRule    = "code"
    MaxGen       = 1
    MaxCount     = 2
    Counts       = {2}
    Stride       = 2
    FinalBytes   = 1
    MaxPayload   = 5
    MaxFragment  = 3
    DrainCap     = 4
    DeliveredCap = 2
    DefectIds    = {}
    Burns        = FALSE
    Witness      = "none"
    D2RPattern   = "none"
    R2DPattern   = "arbitrary"
    Capacity     = 2
    MaxDelay     = 0
    Duplication  = TRUE
    Reordering   = FALSE
    BurstStart   = 3
    BurstLen     = 2

PROPERTIES
    OpenedSurfacesOrLaps
