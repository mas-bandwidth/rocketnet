\* MCRNIocpRetryStop liveness at two operations and two workers, the smallest instance that reaches the push wait: both operations wait on the retry queue, one worker's pass claims a cell and has not freed it, and the other worker's refused repost pushes onto that cell and waits for it (PushClaim is not enabled until PassTake frees the cell). Under the workers' fairness every retry is still reposted while running and every stop completes. Must pass.
SPECIFICATION SpecFair

CONSTANTS
    NumOps          = 2
    Workers         = {w1, w2}
    Cap             = 2
    PosMod          = 16
    MaxFail         = 3
    MaxComplete     = 2
    StopSlack       = 0
    ClaimBeforeStop = FALSE
    RefuseRetires   = FALSE

INVARIANTS
    TypeOK
    PassBounded
    RetryOwned
    PendingIsPosted
    RetiredOnlyByStop

PROPERTIES
    RetryResolves
    StopCompletes
