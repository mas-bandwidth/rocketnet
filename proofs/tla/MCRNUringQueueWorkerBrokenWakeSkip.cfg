\* Reversed witness: the worker sleeps without its wake read armed, so
\* main's eventfd write wakes nothing. Must violate StopFinishes.
SPECIFICATION MCLiveSpec

CONSTANTS
    U         = 2
    K         = 2
    MaxRetry  = 2
    MaxAgain  = 1
    ExitRule  = "drained"
    RetryRule = "bounded"
    WakeRule  = "skip"

PROPERTIES
    StopFinishes
