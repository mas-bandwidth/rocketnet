\* MCRNRttFilterBrokenSilenceOnGap: v1.1.0's rule, any Probe ticks with no
\* ack ends a silence whether or not an ack was owed: a sparse sender's
\* sample above srtt is refused with no outage behind it.
SPECIFICATION Spec
CONSTANTS
    Probe     = 3
    RttLow    = 0
    RttHigh   = 1
    OutageMax = 4
    M         = 2
    P         = 2
    Rule      = "gap"
    FirstAck  = FALSE
INVARIANT
    RefuseOnlyAfterOwedSilence
