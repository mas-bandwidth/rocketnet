\* MCRNRioWorker: the rule, send liveness.  No datagrams; two staged
\* sends.  Every invariant and the send and stop liveness properties under
\* SpecFair.
SPECIFICATION SpecFair

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 2
    NumBanks        = 3
    Cap             = 2
    View            = 4
    MaxDatagrams    = 0
    MaxSends        = 2
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    StopSendsHanded
    StopSendsFinished
    TypeOK
    SlicesAccounted
    ExclusiveOwnership
    ExposedStable
    ExactDelivery
    FillPhaseOwnedByMain
    NoSendDuplicated
    FreedOnlyWhenDrained

PROPERTIES
    EveryStagedSent
    StopCompletes
