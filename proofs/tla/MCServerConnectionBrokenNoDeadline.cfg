\* Reversed witness: MCServerConnectionDeadline.cfg with only the handshake
\* deadline off (the idle timeout stays on). The client that loses the race for
\* the one client id keeps re-sending its response; each one is ignored but
\* refreshes the half-open idle clock, so the mapping lives forever. Must fail
\* HalfOpenMappingDies.
SPECIFICATION Spec

CONSTANTS
    NumClients          = 2
    NumAddrs            = 2
    NumTokens           = 1
    MaxSlots            = 1
    MapCap              = 2
    HeldCapacity        = 2
    MaxAttempts         = 1
    MaxNonces           = 2
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 2
    HandshakeDeadline   = 0
    Disconnects         = FALSE
    DisconnectCopies    = 1
    SameId              = TRUE
    TokenChoice         = "any"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2

PROPERTIES
    HalfOpenMappingDies
