\* Reversed witness: Reset = FALSE (Connect binds a reused slot without
\* rn_region_carve), checked against ConnectStartsFresh alone, so a slot
\* that comes back with the ended connection's room, exhaustion or reason
\* is caught whether or not ReusedSlotStartsClean sees it. Two slots, two
\* clients. TLC must fail ConnectStartsFresh.
SPECIFICATION Spec

CONSTANTS
    Slots    = {s1, s2}
    Clients  = {c1, c2}
    Capacity = 3
    Reset    = FALSE
    CarryOn  = FALSE
    SendExhausts = FALSE
    TakeBeforeFit = FALSE
    CountExhausted = FALSE
    CountMod = 1

INVARIANTS
    TypeOK

PROPERTIES
    ConnectStartsFresh
