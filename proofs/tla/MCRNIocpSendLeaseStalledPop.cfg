\* MCRNIocpSendLease under the threads' fairness: a release push refused while a pop is stalled between its CAS and its sequence store retries until that store lands, and every release push is published. Two operations and two cells, two callers, one completion worker. Must pass.
SPECIFICATION SpecFair

CONSTANTS
    NumOps        = 2
    Callers       = {t1, t2}
    Workers       = {w1}
    GenMax        = 2
    MaxLeases     = 5
    GenWrap       = FALSE
    RetireRefused = FALSE

INVARIANTS
    RetiredOnlyAtGenMax
    RefusalOnlyWhilePopStalled

PROPERTIES
    ReleaseCompletes
