\* Scope witness: SealedFallFromHead is a one-queue rule. With several send
\* queues the burst at the head is passed for its full queue and the burst
\* behind it is sealed, so the sealed counts rise from the head to the tail
\* (SealedFallFromHead).
SPECIFICATION MCSpec

CONSTANTS
    SteadyCap     = 2
    K             = 2
    Bursts        = 6
    SteadyCapExact = TRUE
    CursorWrapAt  = TRUE
    CursorDrops   = TRUE
    DropResetsCursor = TRUE
    Queues        = 2
    AbandonQueuePops = TRUE

INVARIANT SealedFallFromHead
