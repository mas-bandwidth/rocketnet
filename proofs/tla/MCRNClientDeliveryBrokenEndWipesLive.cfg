\* MCRNClientDelivery reversed witness for the liveness: the reset zeroes the
\* batch counts, so a payload counted delivered never reaches the caller.
\* Must fail DeliveredReachesCaller.
SPECIFICATION FairSpec
CONSTANTS
    Cap = 3
    MaxIds = 4
    CallerDrains = TRUE
    Defect = "endwipes"
INVARIANTS
    TypeOK
PROPERTIES
    DeliveredReachesCaller
