\* MCRNRttFilterUnowed: the code, recorded as an expected failure of a bound the
\* rule does not give: when no reliable number is owed (the number was acked
\* by an earlier copy, or the packet carries receipts only), an outage is no
\* silence (m9.2), and the late ack of a packet that waited it out is sampled:
\* the estimate reaches RttHigh + Probe. The limit FIX-RTT-FILTER names for
\* unreliable-only traffic, reached here with a duplicate reliable copy.
SPECIFICATION Spec
CONSTANTS
    Probe     = 3
    RttLow    = 0
    RttHigh   = 1
    OutageMax = 4
    M         = 2
    P         = 2
    Rule      = "owed"
    FirstAck  = FALSE
INVARIANT
    OutageNeverPoisons
