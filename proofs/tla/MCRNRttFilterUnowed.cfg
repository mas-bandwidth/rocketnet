\* MCRNRttFilterUnowed: the code: a reliable number resent, its first copy
\* acknowledged, the second copy waiting out an outage with nothing owed. No
\* silence ends (m9.2), and the late acknowledgement of the copy acknowledges
\* nothing and gives no sample (m9.1): the estimate stays under RttHigh +
\* Probe.
SPECIFICATION Spec
CONSTANTS
    Probe     = 3
    RttLow    = 0
    RttHigh   = 1
    OutageMax = 4
    M         = 2
    P         = 2
    Rule      = "owed"
    FirstAck  = FALSE
    DupSample = FALSE
INVARIANT
    OutageNeverPoisons
