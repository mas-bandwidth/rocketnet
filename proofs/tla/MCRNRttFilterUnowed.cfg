\* MCRNRttFilterUnowed: the code, recorded as an expected failure against m9.1:
\* the code takes one sample per acknowledged packet, also from a copy whose
\* number another copy already acknowledged (rn_window_ack_on_ack samples
\* before it looks at the numbers), where m9.1 forbids sampling a number a
\* second time. Nothing is owed while that copy waits out an outage, so no
\* silence ends (m9.2), and its late ack reaches the estimate: srtt reaches
\* RttHigh + Probe. MCRNRttFilterStandard.cfg, the same instance with the
\* sampling of m9.1, keeps OutageNeverPoisons.
SPECIFICATION Spec
CONSTANTS
    Probe     = 3
    RttLow    = 0
    RttHigh   = 1
    OutageMax = 4
    M         = 2
    P         = 2
    Rule      = "owed"
    FirstAck  = FALSE
    DupSample = TRUE
INVARIANT
    OutageNeverPoisons
