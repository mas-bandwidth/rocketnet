\* MCRNAckApplyPhaseBrokenCloseSkipsUntaken: reversed witness: the gather does
\* not apply the clients nobody took, so their blocks never reach the batch.
\* Must fail Whole.
SPECIFICATION Spec

CONSTANTS
    Clients             = {0, 1}
    Threads             = {main, g1, g2}
    Main                = main
    MaxBlock            = 2
    MaxRanges           = 1
    PendingCap          = 3
    RangesCap           = 2
    ExchangeTake        = TRUE
    CloseAppliesUntaken = FALSE
    CloseClearsClaim    = TRUE
    SettleOnlyReceiving = TRUE
    GatherWhenFull      = TRUE
    AdvanceTail         = TRUE

INVARIANTS
    TypeOK
    Whole
