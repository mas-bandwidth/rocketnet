    N             = 3
    Q             = 4
    GenMod        = 3
    FreshGuard    = TRUE
    LowerCursor   = TRUE
    ChunkSkipZero = TRUE
    DescSkipZero  = TRUE
    KeepFreeSlot  = TRUE
    CountQueueFull = TRUE
    StartOrder    = "fit"
    CountMod      = 1
    RefuseExhausts = FALSE

INVARIANTS
    TypeOK
    NeverTouchPastFresh
    NoTakeWhileLive
    RefuseOnlyWhenNoneFree
    FreeCountExact
    CursorBelowFree
    LiveIsHeld
    StackExact
    DescCountExact
    HeldGenerationPositive

PROPERTIES
    RefuseLeavesLayout
    StoreNeverExhausts
