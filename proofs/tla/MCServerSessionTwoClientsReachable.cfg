\* Reachability witness for MCServerSessionTwoClients.cfg: the same instance
\* with the code's rules, checking NotTwoConnected. TLC must fail it: two
\* slots CONNECTED at once is reachable, so the multi-client invariants of the
\* passing control are not vacuous.
SPECIFICATION Spec
CONSTANTS
 SlotCount = 2
 MaxSessions = 2
 MaxTokens = 2
 MaxStarts = 1
 MaxCreates = 1
 DisconnectQueueCapacity = 1
 SealsPerUpdate = 1
 Defect = "none"
 UnresetField = "replay_window"
INVARIANT NotTwoConnected
