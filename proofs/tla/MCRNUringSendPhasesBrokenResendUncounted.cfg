\* Reversed witness: a refused run's resends are sent but not counted
\* pending in their phase, so the phase completes and its index is reset
\* while the kernel still owns the resent slots, and the next update's
\* start_packet hands one of them out.  Must violate NoWriteWhileKernelOwned.
SPECIFICATION MCSpec

CONSTANTS
    Phases       = 2
    Size         = 2
    MaxSegments  = 2
    MaxUpdates   = 4
    LateReap     = FALSE
    BaseRule     = TRUE
    QuotientRule = TRUE
    CountRule    = TRUE
    ResendRule   = FALSE

INVARIANTS
    TypeOK
    NoWriteWhileKernelOwned
