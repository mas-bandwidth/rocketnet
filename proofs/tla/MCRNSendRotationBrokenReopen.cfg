\* An ended pass reopens within the flush: a connection that wrote nothing
\* is off the writer list with its pass open (UnlistedPassEnded).
SPECIFICATION MCSpec

CONSTANTS
    N           = 3
    Cap         = 4
    MaxFlush    = 2
    EnvStall    = FALSE
    EnvShortAck = FALSE
    EnvRefuse   = TRUE
    EnvVain     = FALSE
    KeepDone    = FALSE
    StallGate   = TRUE
    FitsGate    = TRUE
    WriteFirst  = TRUE
    CursorNext  = TRUE
    CutCursor   = TRUE
    VainEnds    = TRUE

INVARIANT UnlistedPassEnded
