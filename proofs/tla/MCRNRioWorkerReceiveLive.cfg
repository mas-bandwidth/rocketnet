\* MCRNRioWorker: the rule, receive liveness.  No sends; three datagrams.
\* Every invariant and the receive and stop liveness properties under
\* SpecFair with no wait timeout for an idle worker.
SPECIFICATION SpecFair

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 2
    NumBanks        = 3
    Cap             = 2
    View            = 4
    MaxDatagrams    = 3
    MaxSends        = 0
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    StopSendsHanded
    StopSendsFinished
    TypeOK
    SlicesAccounted
    ExclusiveOwnership
    ExposedStable
    ExactDelivery
    FillPhaseOwnedByMain
    NoSendDuplicated
    FreedOnlyWhenDrained

PROPERTIES
    EveryDatagramConsumed
    StopCompletes
