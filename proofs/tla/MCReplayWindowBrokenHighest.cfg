\* Highest-mark mutation: the advance moves the high-water mark but does not
\* set the ring bit, so the mark is not itself received; must violate
\* HighestIsReceived.
SPECIFICATION MCSpec

CONSTANTS
    Words             = 6
    WordBits          = 2
    ClearedWords      = 6
    MaxSeq            = 36
    GateBeforeAdvance = TRUE
    GateBeforeOpen    = TRUE
    MarkOnAdvance     = FALSE
    RefuseBelowFloor  = TRUE

INVARIANT HighestIsReceived
