\* MCServerConnectionBrokenIpv6OnlyMatch.cfg: the reversed witness of MCServerConnectionDualFamily.cfg.
\* The server checks only the token's IPv6 address when its flag is set
\* (AddressMatch = "ipv6only"), so every request of the IPv4-only client is
\* ignored and it never connects: OneFamilyHostConnects fails.
SPECIFICATION Spec

CONSTANTS
    NumClients          = 1
    NumAddrs            = 1
    NumTokens           = 1
    MaxSlots            = 1
    MapCap              = 1
    HeldCapacity        = 1
    MaxAttempts         = 1
    MaxNonces           = 1
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 0
    HandshakeDeadline   = 0
    Disconnects         = FALSE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "own"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2
    TokenFamilies       <- MCTokenBothFamilies
    HostFamilies        <- MCHostIpv4Only
    ServedFamily        <- MCServedIpv4
    AddressMatch        <- MCMatchIpv6Only

INVARIANTS
    SafetyInvariants

PROPERTIES
    OneFamilyHostConnects
