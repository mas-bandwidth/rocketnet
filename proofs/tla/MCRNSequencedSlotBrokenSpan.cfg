\* Reversed witness: MCRNSequencedSlotW8.cfg without the accepted-span check
\* in rn_sequenced_block (the code before the fix). TLC must fail
\* NoSlotCollision: an orphan in-turn block keeps a descriptor live, and a
\* later number on its slot is refused as SLOT_COLLISION.
SPECIFICATION Spec
CONSTANTS W = 8
          MaxNum = 10
          CheckAcceptedSpan = FALSE
INVARIANTS TypeOK NoSlotCollision
CHECK_DEADLOCK FALSE
