\* Reversed witness: IdleRemoveReleasesClaim <- MCIdleRemoveLeavesClaim
\* (FALSE), the removal that leaves its token's claim behind.  A half-open
\* mapping leaves alone, its claim lives on with no mapping holding the
\* token, so ClaimHasMapping must fail with TLC's counterexample;
\* OneUnexpiredMappingPerToken still holds.
SPECIFICATION MCSpec

CONSTANTS
    PosRestart   = 1
    PosVersion   = 2
    PosTimestamps = 3
    PosCompares  = 4
    PosCookie    = 5
    PosUsed      = 6
    PosAdmitted  = 7
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 10
    PosKeypair   = 11
    IdleRemoveReleasesClaim <- MCIdleRemoveLeavesClaim

INVARIANTS
    TypeOK
    OneUnexpiredMappingPerToken
    ClaimHasMapping
