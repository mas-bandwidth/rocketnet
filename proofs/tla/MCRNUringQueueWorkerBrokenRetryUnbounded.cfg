\* Reversed witness: after the stop the worker never abandons, and a socket
\* that answers -EAGAIN forever holds it. Must violate StopFinishes.
SPECIFICATION MCLiveSpec

CONSTANTS
    U         = 2
    R         = 2
    K         = 2
    MaxRetry  = 2
    MaxAgain  = 1
    MaxRefuse = 1
    MaxRecvEnd = 0
    ExitRule  = "drained"
    RetryRule = "unbounded"
    WakeRule  = "armed"
    ShutdownRule = "begin"
    RecvRule  = "backoff"

PROPERTIES
    StopFinishes
