\* Reversed witness: the flush turns over while a claim is held and onto the
\* next bank whatever its owner (FlushRule "open"). Must violate NoWorkerWrite.
SPECIFICATION Spec
CONSTANTS
    Q = 2
    NB = 3
    S = 3
    Stride = 4
    Threads = {1, 2}
    Dests = {"a", "b"}
    QueueOf <- MCQueueOf
    Demand = 2
    MaxFlush = 3
    Skew <- MCSkew
    ClaimCmp = "ge"
    ClaimRule = "cas"
    SlotRule = "check"
    IdRule = "mul"
    FlushRule = "open"
INVARIANT TypeOK
INVARIANT OneProducer
INVARIANT InBounds
INVARIANT NoSharedSlot
INVARIANT NoForeignWrite
INVARIANT RouteMatches
INVARIANT NoWorkerWrite
INVARIANT StagedMatches
