\* Reversed witness: the flush turns over while a claim is held and onto the
\* next bank whatever its owner (FlushRule "open"): a claim held across three
\* turn-overs finishes into its bank after the bank is the producer again and
\* its slot is free for a new fill. Must violate NoForeignWrite. (The claim is
\* one fetch-add step, so no open flush falls between a start's producer read
\* and its add, and Start and Finish write only the producer: NoWorkerWrite
\* stays checked but can no longer fail.)
SPECIFICATION Spec
CONSTANTS
    Q = 2
    NB = 3
    S = 3
    Stride = 4
    Threads = {1, 2}
    Dests = {0, 1}
    Demand = 2
    MaxFlush = 3
    SkewSpan = 1
    ClaimCmp = "ge"
    BlindStore = FALSE
    CounterWrap = 0
    SlotRule = "check"
    IdRule = "mul"
    FlushRule = "open"
INVARIANT TypeOK
INVARIANT OneProducer
INVARIANT InBounds
INVARIANT NoSharedSlot
INVARIANT NoForeignWrite
INVARIANT RouteMatches
INVARIANT NoWorkerWrite
INVARIANT StagedMatches
