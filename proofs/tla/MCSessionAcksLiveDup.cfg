\* MCSessionAcksLiveDup: live-dup. The instance on which per-packet link fairness fails:
\* MaxSeq 1, burns off, data link "none", ack link "arbitrary" with duplication,
\* reordering off; OpenedSurfacesOrLaps only (README-SessionAcks.md).
SPECIFICATION Spec

CONSTANTS
    MaxSeq      = 1
    SentRing    = 4
    BatchCap    = 1
    Window      = 4
    MaxRanges   = 2
    DrainCap    = 4
    Burns       = FALSE
    Witness     = "none"
    D2RPattern  = "none"
    R2DPattern  = "arbitrary"
    Capacity    = 2
    MaxDelay    = 0
    Duplication = TRUE
    Reordering  = FALSE
    BurstStart  = 3
    BurstLen    = 2

PROPERTIES
    OpenedSurfacesOrLaps
