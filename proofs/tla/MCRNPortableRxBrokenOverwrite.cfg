\* MCRNPortableRx reversed witness: a refused publish does not keep the
\* full producer; the worker reads the socket into it anyway.  Must fail
\* ExactDelivery.
SPECIFICATION Spec

CONSTANTS
    NumBanks       = 3
    Cap            = 2
    Budget         = 1
    MaxDatagrams   = 4
    HoldOnFull     = FALSE
    ReturnWhenRead = TRUE
    QuitBeforeWake = TRUE
    WakeOnReturn   = TRUE
    Timeout        = FALSE

INVARIANTS
    TypeOK
    ExclusiveOwnership
    ExactDelivery
