\* Reversed witness for the deadline window and the binding: the committed
\* constants, with the strict BoundHasNoClaim.  B claims A's token in the
\* window and is accepted; A's stale mapping then opens a response, binding
\* the token to A, and the release of A's claim leaves B's.  The bound token
\* keeps a claim, so BoundHasNoClaim must fail with TLC's counterexample;
\* BoundHasNoOwnClaim still holds.
SPECIFICATION MCSpec

CONSTANTS
    PosRestart   = 1
    PosVersion   = 2
    PosTimestamps = 3
    PosCompares  = 4
    PosCookie    = 5
    PosUsed      = 6
    PosAdmitted  = 7
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 10
    PosKeypair   = 11

INVARIANTS
    TypeOK
    BoundTypeOK
    OneUnexpiredMappingPerToken
    BoundHasNoOwnClaim
    BoundHasNoClaim
