\* The untimed case, the code's untimed view: capacity 1 up and {1, 3} down (MCRNPathProbeLateUp3.cfg has capacity 3 up: the capacities are fixed for a behaviour, so the two cover {1, 3} each way between them, split on 2026-11-26 when the re-try took the one case to 67.6 s, over 60% of the case budget), one attacker send and no loss burst (MCRNPathProbeLateBurst.cfg has the burst: the two together are over the case budget untimed since the ladder, 107 s on space, and the Timed cases keep the combination); a pair's replies may arrive after it resolved, a late large reply raises P, and every safety property holds (loss-only rule-outs are not claimed here: a reply later than the interval counts as lost).
SPECIFICATION Spec

CONSTANTS
    ClientSet     = {3, 2, 1}
    ServerList    = {3, 2, 1}
    CapsUp        = {1}
    CapsDown      = {1, 3}
    K             = 2
    MaxBursts     = 0
    AttackBudget  = 1
    AttackKinds   = {"replay", "probe", "reply"}
    Forger        = FALSE
    Timed         = FALSE
    LossBound     = TRUE
    MaxReuses     = 0
    ReuseCapsUp   = {}
    ReuseCapsDown = {}
    Broken        = "none"

INVARIANTS
    TypeOK
    RaisedWithinPath
    ServerNeverAhead
    FailOnlyAtP0
    NeverAtRuledOut
    NeverAboveRuled
    RuledIsTheNextStep
    ReplyOnlyConnected
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate

PROPERTIES
    PNeverDecreases
    StrikeNeedsSmall
    ServerRaisesOnConfirm
    ClientRaisesOnAuthLarge
    NoProbeAfterDone
    NoSkippedStep
