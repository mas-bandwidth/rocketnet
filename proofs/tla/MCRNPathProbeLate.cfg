\* The untimed case, the code's untimed view: capacities {1, 3} each way, one attacker send and no loss burst (MCRNPathProbeLateBurst.cfg has the burst: the two together are over the case budget untimed since the ladder, 107 s on space, and the Timed cases keep the combination); a pair's replies may arrive after it resolved, a late large reply raises P, and every safety property holds (loss-only rule-outs are not claimed here: a reply later than the interval counts as lost).
