\* The per-PR untimed case, reduced from MCRNPathProbeLateFull.cfg (the same check with one attacker send, nightly timeout debt) only so it finishes inside the 110 s case budget: a pair's replies may arrive after it resolved, a late large reply raises P, and every safety property holds (loss-only rule-outs are not claimed here: a reply later than the interval counts as lost).
