\* The code's timing (Timed = FALSE): the client sends at every opportunity whatever is in flight, so a window can end with its probe or reply in flight and a reply arrive in a later window; responses are resent and the silence timeout may end the attempt at any time. Capacities 1 and 3 each way (a path that carries the first candidate, and one that carries only the last), one loss, one attacker send: every invariant (safety only).
SPECIFICATION Spec

CONSTANTS
    Ceiling      = 3
    CapsUp       = {1, 3}
    CapsDown     = {1, 3}
    W            = 2
    MaxLoss      = 1
    AttackBudget = 1
    ClientSet    = {3, 2, 1}
    ServerList   = {3, 2, 1}
    Timed        = FALSE
    Broken       = "none"

INVARIANTS
    TypeOK
    SlotAgrees
    ChosenIsCandidate
    CarriedBothWays
    CrossedBothWays
    ReplyOnlyProven
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate
