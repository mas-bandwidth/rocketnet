\* MCRNRioWorker: create's failure path, the rule, when create failed
\* before it posted a receive (Slices = 0: posted_receives is 0 with the
\* socket open, the only way rocketnet_rio_create_failed_drain reaches its
\* bound with nothing posted).  Every closesocket is refusable.  The drain
\* either closes and stops, or after StopDrainWaits + 1 refused passes
\* abandons the socket open, drains and stops, and create frees the rest
\* of the lane; it never leaks the lane with nothing kernel owned:
\* invariants, LeakOnlyAfterStalls and StopCompletes with no fairness on a
\* refused closesocket.
SPECIFICATION SpecFair

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 0
    Cap             = 1
    View            = 1
    MaxDatagrams    = 1
    MaxSends        = 0
    DrainBatch      = 2
    StopDrainWaits  = 1
    InlineStop      = TRUE
    BoundedStopDrain = TRUE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    TypeOK
    SlicesAccounted
    FreedOnlyWhenDrained
    StopSendsFinished
    LeakOnlyAfterStalls

PROPERTIES
    StopCompletes
