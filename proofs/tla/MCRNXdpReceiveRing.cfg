\* MCRNXdpReceiveRing: the design. Three receive banks, an RX ring of two,
\* a peek of up to two, a bank of two packets, one packet per receive call
\* (so a bank's tail carries its read cursor into the next call), four
\* packets in a behaviour and a fill ring of twice the frames
\* (ROCKETNET_XDP_FILL_RING_SIZE). The reversed witnesses are
\* MCRNXdpReceiveRingBrokenFillOfTheFrames.cfg,
\* MCRNXdpReceiveRingBrokenRefusedRefilled.cfg and
\* MCRNXdpReceiveRingBrokenDrainStale.cfg beside this one.
SPECIFICATION Spec

CONSTANTS
    F1         = F1
    F2         = F2
    F3         = F3
    Frames     = {F1, F2, F3}
    RingSize   = 2
    PeekMax    = 2
    StageCap   = 2
    FillSize   = 6
    Budget     = 1
    MaxPackets = 4

INVARIANTS
    TypeOK
    FrameConservation
    ConsumerNotBehind
    PendingReturnedEachPass
    FillNeverEmptyWhileFramesFree
    BankOneOwner
    StagedBeforeClaimInView

PROPERTIES
    ReceiveNeverStalls
