\* MCRNXdpReceiveRing: the design, with threads that may stop for any
\* length of time (Stall). Three receive banks, an RX ring of two, a peek of
\* up to two (so the worker looks at main's flag between two descriptors),
\* a bank of two packets, one packet per receive call (so a bank's tail
\* carries its read cursor into the next call), two further tries for the
\* mutex after a miss, four packets in a behaviour and a fill ring of twice
\* the frames (ROCKETNET_XDP_FILL_RING_SIZE). A stopped worker makes a claim
\* miss, so liveness here rests on SF_vars(Drain); the bound on a miss for
\* threads that do not stop is MCRNXdpReceiveRingBounded.cfg. The reversed
\* witnesses are the MCRNXdpReceiveRingBroken*.cfg files beside this one.
SPECIFICATION Spec

CONSTANTS
    F1         = F1
    F2         = F2
    F3         = F3
    Frames     = {F1, F2, F3}
    RingSize   = 2
    PeekMax    = 2
    StageCap   = 2
    FillSize   = 6
    Budget     = 1
    MaxPackets = 4
    SpinMax    = 2
    TryArrivals = 1
    Stall      = TRUE

INVARIANTS
    TypeOK
    FrameConservation
    ConsumerNotBehind
    PendingReturnedEachPass
    FillNeverEmptyWhileFramesFree
    BankOneOwner
    StagedBeforeClaimInView
    ConsumedInOrder
    ViewStable
    HeldBankStable
    PeekedFitsBank
    WantedOnlyInSpin

PROPERTIES
    ReceiveNeverStalls
    StagedEventuallyConsumed
