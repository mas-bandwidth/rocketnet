\* MCRNXdpReceiveRing: the design. Three frames, an RX ring of two, a peek
\* of up to two, a staging buffer of one packet, so a pass stops with a
\* peeked descriptor not taken, and a fill ring of twice the frames
\* (ROCKETNET_XDP_FILL_RING_SIZE). The reversed witnesses are
\* MCRNXdpReceiveRingBrokenNoCancel.cfg and
\* MCRNXdpReceiveRingBrokenFillOfTheFrames.cfg beside this one.
SPECIFICATION Spec

CONSTANTS
    F1       = F1
    F2       = F2
    F3       = F3
    Frames   = {F1, F2, F3}
    RingSize = 2
    PeekMax  = 2
    StageCap = 1
    FillSize = 6

INVARIANTS
    TypeOK
    FrameConservation
    ConsumerNotBehind
    PendingReturnedEachPass
    FillNeverEmptyWhileFramesFree

PROPERTIES
    ReceiveNeverStalls
