\* MCRNXdpReceiveRing: the design. Three frames, an RX ring of two, a
\* staging buffer and a pending return of three each (the code's ratio:
\* ROCKETNET_XDP_RECV_QUEUE_SIZE equals ROCKETNET_XDP_FILL_FRAMES), so the
\* staging buffer fills across passes and the peek is cut to its room, and a
\* fill ring of twice the frames (ROCKETNET_XDP_FILL_RING_SIZE). The reversed
\* witnesses are the MCRNXdpReceiveRingBroken*.cfg beside this one.
SPECIFICATION Spec

CONSTANTS
    Frames   = {1, 2, 3}
    RingSize = 2
    StageCap = 3
    PendCap  = 3
    FillSize = 6

INVARIANTS
    TypeOK
    FrameConservation
    StagingInBounds
    PendingInBounds
    ConsumerNotBehind
    PendingReturnedEachPass
    FillNeverEmptyWhileFramesFree

PROPERTIES
    ReceiveNeverStalls
