\* MCRNXdpReceiveRing reversed witness: a double swap. A claim is followed
\* by a second swap in the same receive call, which hands the bank just
\* claimed back to the worker before main has read it; its packets are
\* emptied with the bank. Must fail StagedBeforeClaimInView.
SPECIFICATION Spec

CONSTANTS
    F1         = F1
    F2         = F2
    F3         = F3
    Frames     = {F1, F2, F3}
    RingSize   = 2
    PeekMax    = 2
    StageCap   = 2
    FillSize   = 6
    Budget     = 1
    MaxPackets = 4
    SpinMax    = 2
    TryArrivals = 1
    Stall      = TRUE
    DoubleSwap <- DoubleSwapBroken

INVARIANTS
    TypeOK
    StagedBeforeClaimInView
