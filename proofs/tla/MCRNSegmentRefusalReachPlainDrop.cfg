\* Reach witness: the plain resend after a refusal fails with a hard error
\* and drops its packet, counted (rocketnet_server_gso_resend_plain; the
\* io_uring one-packet run that fails).  NothingDropped still holds: the
\* refusal itself dropped nothing.  Must violate NoPlainDrop.
SPECIFICATION Spec

CONSTANTS
    Dests          = {g, b}
    Refusing       = {b}
    KernelSegments = TRUE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"
    Slot           <- SlotDistinct
    Queue          <- QueueOne
    AcceptedRule   = "transport"
    FallbackScope  = "transport"
    InFlight       = 2
    PlainFails     = TRUE

INVARIANTS
    TypeOK
    NothingDropped
    NoPlainDrop
