\* MCRNPacketLease reversed witness: insert without if ( !ticket ) return
\* false, on a process whose ticket counter is exhausted from the start
\* (TicketLimit = 0). Two inserts publish leases with ticket 0. Must fail
\* TicketsUnique.
SPECIFICATION Spec

CONSTANTS
    Capacity          = 4
    Threads           = {1, 2}
    Frames            = {1, 2}
    Vals              = {1, 2}
    HashSpread        = 1
    MaxOps1           = 2
    MaxOps2           = 1
    MaxResets         = 2
    EpochLimit        = 2
    TicketLimit       = 0
    ZeroRefused       = FALSE
    UsedLimit         = 2
    UseCas            = TRUE
    ConsumeCas        = TRUE
    BumpEpoch         = TRUE
    EpochLimited      = TRUE
    RetiredOn         = FALSE
    RetiredValidates  = FALSE
    OnWriting         = {"skip"}
    ValidCallers      = FALSE
    AtomicFields      = TRUE

INVARIANTS
    TypeOK
    TicketsUnique
