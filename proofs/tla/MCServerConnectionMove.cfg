\* MCServerConnection address change: one client with two attempts that may move
\* to a second address. A sealed packet is looked up by its source address.
SPECIFICATION Spec

CONSTANTS
    NumClients          = 1
    NumAddrs            = 2
    NumTokens           = 2
    MaxSlots            = 1
    MapCap              = 1
    HeldCapacity        = 2
    MaxAttempts         = 2
    MaxNonces           = 1
    MaxMoves            = 1
    SendInterval        = 1
    Timeout             = 0
    HandshakeDeadline   = 0
    Disconnects         = TRUE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "any"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2

INVARIANTS
    SafetyInvariants

PROPERTIES
    PacketsReachOwnSlotOnly
    SessionNeverAnswered
