\* Reversed witness: MCRNRioWorkerGarbage.cfg with the prefilter left to main
\* (PrefilterInWorker FALSE): datagram 2 fails the prefilter but is banked,
\* taking room a player's datagram needs.  Must fail NoGarbageBanked.
SPECIFICATION Spec

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 2
    Cap             = 2
    View            = 4
    MaxDatagrams    = 4
    MaxSends        = 0
    DrainBatch      = 2
    StopDrainWaits  = 2
    InlineStop      = FALSE
    BoundedStopDrain = TRUE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE
    Garbage         <- MCGarbage
    PrefilterInWorker <- MCPrefilterOnMain

INVARIANTS
    StopSendsHanded
    StopSendsFinished
    TypeOK
    SlicesAccounted
    ExclusiveOwnership
    ExposedStable
    DeliveredByNextCall
    ExactDelivery
    FillPhaseOwnedByMain
    NoSendDuplicated
    FreedOnlyWhenDrained
    NoGarbageBanked
