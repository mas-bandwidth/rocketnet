\* MCLink: the committed run. Pattern "arbitrary" under Link!Fairness.
\* README-Link.md gives the other ten runs (the four deterministic
\* patterns, the WireFair-only runs and the reversed witness) as edits
\* to the SPECIFICATION, Pattern and PROPERTIES lines of this file.
SPECIFICATION Spec

CONSTANTS
    Packets     = {a, b}
    Capacity    = 3
    MaxDelay    = 1
    Duplication = TRUE
    Reordering  = TRUE
    Pattern     = "arbitrary"
    BurstStart  = 1
    BurstLen    = 2

INVARIANTS
    MCTypeOK
    InFlightBounded
    DeliveredWereSent
    WireCarriesOnlySent
    FirstSendLost

PROPERTIES
    ResentIsDelivered
