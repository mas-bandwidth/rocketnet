\* MCServerConnectionLossyBrokenSweep: reversed witness on the LossyTimers instance.
\* The sweep frees a timed-out slot and keeps its mapping.
SPECIFICATION Spec

CONSTANTS
    NumClients          = 1
    NumAddrs            = 1
    NumTokens           = 1
    MaxSlots            = 1
    MapCap              = 1
    HeldCapacity        = 2
    MaxAttempts         = 1
    MaxNonces           = 1
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 2
    HandshakeDeadline   = 2
    Disconnects         = TRUE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "own"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = FALSE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "arbitrary"
    S2CPattern          = "arbitrary"
    Capacity            = 2
    MaxDelay            = 0
    Duplication         = TRUE
    Reordering          = TRUE
    BurstStart          = 1
    BurstLen            = 2

INVARIANTS
    SlotMappingBijection
