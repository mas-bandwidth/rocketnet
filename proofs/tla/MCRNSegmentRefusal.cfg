\* The gso code: a destination whose route refuses segmentation and one that
\* accepts it. The refusal stays with its destination, which pays it once
\* (the flush handles each answer before the next send).
SPECIFICATION Spec

CONSTANTS
    Dests          = {g, b}
    Refusing       = {b}
    KernelSegments = TRUE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"
    Slot           <- SlotDistinct
    Queue          <- QueueOne
    AcceptedRule   = "transport"
    FallbackScope  = "transport"
    InFlight       = 1
    PlainFails     = TRUE

INVARIANTS
    TypeOK
    OtherDestinationUnaffected
    NothingDropped
    RefusalsBounded
    KernelFallback
    NoFallbackOnFewerDests
