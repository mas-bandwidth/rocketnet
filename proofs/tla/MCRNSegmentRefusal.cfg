\* The gso code: a destination whose route refuses segmentation and one that
\* accepts it, two of a destination's runs in one sendmmsg batch. The
\* refusal stays with its destination, which pays at most one refusal for
\* each run that was out with its first and counts once.
SPECIFICATION Spec

CONSTANTS
    Dests          = {g, b}
    Refusing       = {b}
    KernelSegments = TRUE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"
    Slot           <- SlotDistinct
    Queue          <- QueueOne
    AcceptedRule   = "transport"
    FallbackScope  = "transport"
    InFlight       = 2
    PlainFails     = TRUE

INVARIANTS
    TypeOK
    OtherDestinationUnaffected
    NothingDropped
    RefusalsBounded
    KernelFallback
    NoFallbackOnFewerDests
