\* MCRNXdpReceiveRing reversed witness: the first claim takes
\* free_index[free_head] as the worker's new bank without advancing
\* free_head or lowering free_count, so the bank is the producer and a
\* spare at once. Must fail BankOneOwner.
SPECIFICATION Spec

CONSTANTS
    F1         = F1
    F2         = F2
    F3         = F3
    Frames     = {F1, F2, F3}
    RingSize   = 2
    PeekMax    = 2
    StageCap   = 2
    FillSize   = 6
    Budget     = 1
    MaxPackets = 4
    LockBatch  = 1
    SpareKept <- SpareKeptBroken

INVARIANTS
    TypeOK
    BankOneOwner
