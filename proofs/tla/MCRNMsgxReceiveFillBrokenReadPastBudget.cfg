\* MCRNMsgxReceiveFill with ReadPastBudget (the drain before Stella's review of 4119919c7): a read asks for the batch whatever the budget leaves, and a socket's reads in a round pass the budget (3 with a batch of 2: 2 then 2). Must fail BudgetKept.
SPECIFICATION Spec
CONSTANTS
    Sockets = 2
    Capacity = 3
    Batch = 2
    Budget = 3
    Buffer = 3
    CallCaps = {1, 3}
    MaxArrivals = 7
    MaxErrors = 2
    ReadPastRoom = FALSE
    ReadPastBudget = TRUE
    HoldWithoutMove = FALSE
    FreeNotReset = FALSE
    ReadOnlyLeft = FALSE
    StopCountSkipsWorker = FALSE
INVARIANTS TypeOK BudgetKept
