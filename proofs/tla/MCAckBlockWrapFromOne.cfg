\* MCAckBlockWrapFromOne: the rule, with the session starting at 1 (the
\* production start), so highest sent runs from below Modulus/2 and a wire
\* zero with a first run reconstructs to 0 and is refused by the run bound.
\* MaxSeq 6 stops short of the wrap, which MCAckBlockWrap.cfg covers.
SPECIFICATION MCSpec

CONSTANTS
    Modulus         = 8
    Start           = 1
    MaxSeq          = 6
    BrokenHalfRange = FALSE
    RunBoundChecked = TRUE

INVARIANTS
    TypeOK
    EmptyRecognised
    LargestExact
    NeverRefusedHonest
    MalformedRefused
