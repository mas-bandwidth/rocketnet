\* MCRNAckApplyPhaseBrokenCloseKeepsClaim: reversed witness: the gather applies
\* an untaken client and leaves its claim set, so a claim stands after the
\* finish and a take outside the open phase would be accepted.  Must fail
\* ClaimOnlyOpen.
SPECIFICATION Spec

CONSTANTS
    Clients             = {0, 1}
    Threads             = {main, g1, g2}
    Main                = main
    MinBlock            = 1
    MaxBlock            = 2
    MaxRanges           = 1
    RangeCounts         = {0, 1}
    PendingCap          = 3
    RangesCap           = 2
    ExchangeTake        = TRUE
    CloseAppliesUntaken = TRUE
    CloseClearsClaim    = FALSE
    SettleOnlyReceiving = TRUE
    GatherWhenFull      = TRUE
    AdvanceTail         = TRUE
    DupGivesNothing     = TRUE

INVARIANTS
    TypeOK
    ClaimOnlyOpen
