\* MCRNXdpReceiveRing reversed witness: the instance of
\* MCRNXdpReceiveRingPendBinds.cfg with the peek asking for the staging
\* buffer's room alone (receive_limit without pending_return.available()).
\* The loop holds every peeked descriptor's frame, so a peek of three
\* fills a pending return of two past its end. Must fail PendingInBounds.
SPECIFICATION Spec

CONSTANTS
    Frames   = {1, 2, 3}
    RingSize = 3
    StageCap = 3
    PendCap  = 2
    FillSize = 6
    PeekPendingRoom <- PeekPendingRoomBroken

INVARIANTS
    TypeOK
    PendingInBounds
