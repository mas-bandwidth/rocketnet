\* The passing control at the small scale: gaps 1, 1, 1, then doubling, 2 and 4, to the cap 5, the count saturating at 6 (the first re-try at the cap), re-tries running 0 to 7 past their slot, to the time 60; the next re-try is always the design's first time after the call, and the count is its index to 6.
SPECIFICATION Spec

CONSTANTS
    First       = 1
    Flat        = 3
    Cap         = 5
    Saturate    = 6
    CounterMod  = 8
    MaxRun      = 7
    Horizon     = 60
    Broken      = "none"

INVARIANTS
    TypeOK
    NextIsTheDesigns
    CountSaturates
    GapIsTheDesigns
