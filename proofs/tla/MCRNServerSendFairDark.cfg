\* MCRNServerSendFairDark: a slot in probe hold (MESSAGES.md m9.3) beside two healthy
\* slots sharing two frames: the due test asks the walk's hold, so the dark
\* slot starts a frame only for its probe and no unit is charged to an
\* empty frame (m1.8).
SPECIFICATION Spec

CONSTANTS
    N       = 3
    K       = 2
    Conn    = {0, 1, 2}
    WorkMax = 2
    Dark    = {2}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "rounds"
    Q1      = {}
    K1      = 0
    QueueRule = "perqueue"

INVARIANTS
    TypeOK
    FairService
    NoUnitWasted
    OtherClientUnaffected
    DarkTakesOnlyItsProbes
    SameOrder
    OnlyLastWriters
    EndedWritesNothing
    CursorAsFullWalk
    VisitsBounded
