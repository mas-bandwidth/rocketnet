\* MCRNServerSendFairDark: two frames per update, two healthy clients offering
\* up to two frames each, and a third client held by probe pacing (two numbers
\* on the wire, no acknowledgement, U resent every two updates). Under the
\* due test of v1.1.1 the dark client starts a frame only for its due probe,
\* every unit charged is written, and the others keep their service.
SPECIFICATION Spec

CONSTANTS
    N       = 3
    K       = 2
    Work    = 2
    Dark    = {3}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Mode    = "fair"

INVARIANTS
    TypeOK
    FairService
    NoUnitWasted
    OtherClientUnaffected
    DarkTakesOnlyItsProbes
