\* MCRNServerSendFairDark: two clients share one frame per update and the
\* second never acknowledges, so it always has resends due. One frame per
\* connection per round: the first is still served every second update.
SPECIFICATION Spec

CONSTANTS
    N        = 2
    K        = 1
    Mode     = "fair"
    MaxTicks = 8
    Dark     = {2}
    Conn     = {}
    WorkMax  = 0

INVARIANTS
    TypeOK
    FairService
    OtherClientUnaffected
