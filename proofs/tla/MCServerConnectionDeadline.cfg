\* MCServerConnection handshake deadline: two clients share one token (one client
\* id) and one slot, the idle timeout and the handshake deadline on. The client
\* that loses the race keeps re-sending its response; the server ignores it (the
\* id is connected) but each one refreshes the half-open idle clock, so only the
\* handshake deadline, never refreshed, removes the mapping (HalfOpenMappingDies).
SPECIFICATION Spec

CONSTANTS
    NumClients          = 2
    NumAddrs            = 2
    NumTokens           = 1
    MaxSlots            = 1
    MapCap              = 2
    HeldCapacity        = 2
    MaxAttempts         = 1
    MaxNonces           = 2
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 2
    HandshakeDeadline   = 2
    Disconnects         = FALSE
    DisconnectCopies    = 1
    SameId              = TRUE
    TokenChoice         = "any"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2

INVARIANTS
    SafetyInvariants

PROPERTIES
    HalfOpenMappingDies
