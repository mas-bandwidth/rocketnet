SPECIFICATION SafetySpec
CONSTANTS
    Scenario = "promote"
    Broken = "None"
    SendCapacity = 4
    OrderedCapacity = 2
    HoldCapacity = 2
INVARIANTS
    TypeOK
    BuffersBounded
    SequencedNeverBackwards
    NoSequencedDuplicate
    ReliableExactlyOnce
    PromotedIsTwin
    PromotedNeverUnreliable
    OrderedExactlyOnceInOrder
    OrderedTraceUnchangedBySequenced
    SequencedNewestWins
    EpochWatermark
    TransportAckClearsResend
    AckedImpliesTransportArrival
CHECK_DEADLOCK FALSE
