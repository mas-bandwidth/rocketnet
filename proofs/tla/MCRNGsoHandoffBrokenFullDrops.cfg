\* MCRNGsoHandoff reversed witness: a full socket drops the rest of its refused batch and the worker goes on with the bank, as the flush did before it kept the rest. SentOrHeld falls. Must fail.
SPECIFICATION SpecFair

CONSTANTS
    RxCap            = 2
    TxCap            = 2
    MaxRx            = 4
    MaxTx            = 4
    PublishWhileHeld = FALSE
    MainBlocks       = FALSE
    FullDrops        = TRUE
    CarryBehind      = FALSE

INVARIANTS
    TypeOK
    RxOneOwner
    TxOneOwner
    TxQueuesDistinct
    NoPublishWhileHeld
    FreeIsEmpty
    SentOrHeld
    RxInOrder
    TxInOrder
    MainNeverWaits
    StopJoinsBeforeFree
    ExitSentAll

PROPERTIES
    StopCompletes
