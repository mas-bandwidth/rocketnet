\* MCRNRttFilterLive: the code, one number at a time (a sparse sender may
\* leave the wire empty for as long as it likes): once the path slows from 0
\* to 2 ticks and the bad intervals end, the estimate reaches 2.
SPECIFICATION LiveSpec
CONSTANTS
    Probe     = 3
    RttLow    = 0
    RttHigh   = 2
    OutageMax = 2
    M         = 1
    P         = 2
    Rule      = "owed"
    FirstAck  = FALSE
PROPERTY
    SlowPathRaisesEstimate
