\* MCRNBuilderPlanLayout reversed witness: a refused packet clears its items'
\* taken flags but does not step their groups' cursors back.  The refused
\* item is neither written nor still planned.  Must fail ChannelOrderKept.
SPECIFICATION Spec

CONSTANTS
    N            = 4
    Radix        = 2
    Channels     = {1, 2}
    Classes      = 2
    Levels       = 2
    MaxRecords   = 2
    Restore      = FALSE
    PrefixSum    = "exclusive"
    ScatterOrder = "forward"

INVARIANTS
    TypeOK
    ChannelOrderKept
