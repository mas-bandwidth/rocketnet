\* Reversed witness: MCRNReceiveAllowance.cfg with Refill = FALSE (the
\* allowance never refills). A client under 1x is refused once its sends pass
\* the capacity. TLC must fail UnderRateNeverRefused.

SPECIFICATION Spec

CONSTANTS
    Correct      = {c1}
    Flooders     = {f1}
    B            = 1
    Factor       = 2
    MaxPkt       = 2
    T            = 2
    Horizon      = 5
    FloodPerTick = 2
    MaxNet       = 3
    MaxBack      = 1
    MaxReconnect = 1
    Refill       = FALSE
    CapFull      = TRUE
    PerClient    = TRUE
    Monotone     = TRUE
    c1 = c1
    f1 = f1

INVARIANTS
    TypeOK
    UnderRateNeverRefused
