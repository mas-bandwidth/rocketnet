\* MCRNClientIoDecrypt reversed witness, liveness: the I/O thread keeps its
\* copy after it reads retired (no drop_keys at the top of the drain), so
\* once the session is retired the copy is never zeroed.  A forged datagram
\* at the limit of one, or a disconnect, retires it.  Must fail
\* RetiredEventuallyZeroed.
SPECIFICATION SpecFair

CONSTANTS
    BufferCap        = 2
    MaxDatagrams     = 2
    MaxSeq           = 1
    W                = 1
    MaxReplays       = 0
    MaxForged        = 1
    IntegrityLimit   = 1
    OpenBeforeReplay = FALSE
    SharedWindow     = FALSE
    NoRetire         = TRUE
    CountOnIo        = FALSE
    NoPayloadGate    = FALSE

PROPERTIES
    RetiredEventuallyZeroed
