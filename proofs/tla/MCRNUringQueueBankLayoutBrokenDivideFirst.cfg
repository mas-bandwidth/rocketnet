\* Reversed witness: finish divides the pointer's offset by the stride
\* before testing it, with C's truncation toward zero, so a pointer one
\* byte before slot 1 names slot 0, another thread's slot.  Must violate
\* NoForeignWrite.
SPECIFICATION MCSpec

CONSTANTS
    Q           = 2
    NB          = 2
    S           = 3
    Stride      = 2
    Threads     = {1, 2}
    Dests       = {1, 2, 3}
    QueueOf     <- MCQueueOf
    Demand      = 4
    MaxFlush    = 2
    Skew        <- MCSkew
    ClaimCmp    = "ge"
    CounterWrap = 0
    SlotRule    = "divide"
    IdRule      = "mul"

INVARIANTS
    TypeOK
    NoForeignWrite
