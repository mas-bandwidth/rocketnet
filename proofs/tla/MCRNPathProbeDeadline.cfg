\* The server's handshake deadline at the per-PR size: two candidates {2, 1} (Ceiling 2), W 2, so the longest walk is 4 Ticks and Budget = 4 = N * W; Deadline 3 Ticks, at the code's timing (Timed = FALSE: a Tick follows each send of the walk), with one loss and one attacker send. Reduced from three candidates (MCRNPathProbeDeadlineFull.cfg, the same check at the full size, nightly timeout debt) only so the case finishes inside the 110 s case budget on two workers: the walk ends inside the deadline, replies late or not (safety only).
SPECIFICATION Spec

CONSTANTS
    Ceiling      = 2
    CapsUp       = {1, 2}
    CapsDown     = {1, 2}
    W            = 2
    MaxLoss      = 1
    AttackBudget = 1
    Forger       = FALSE
    Deadline     = 3
    Budget       = 4
    ClientSet    = {2, 1}
    ServerList   = {2, 1}
    Timed        = FALSE
    Broken       = "none"

INVARIANTS
    TypeOK
    SlotAgrees
    WalkInsideDeadline
    NoTimeoutWhileProbing
