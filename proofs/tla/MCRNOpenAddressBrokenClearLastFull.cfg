\* MCRNOpenAddress reversed witness, historical: a clear-last index allowed
\* to fill, erased by the clear-last algorithm with no bound on its scan (the
\* erasers before their bounds). The scan finds no empty cell and circles.
\* Must fail EraseEnds. No current site can circle: client slots stop at
\* num_buckets cells, the held index at N - 1 and then fails (RNHeldOwnership
\* EraseBound), the sent index at cap and then a protocol violation; what
\* this still shows is why a clear-last index is sized never to fill.
\* MCRNOpenAddressClearLast.cfg with N = MaxLive = 4.
SPECIFICATION Spec

CONSTANTS
    Keys       = {1, 2, 3, 4}
    N          = 4
    NoWrapTest = FALSE
    ClearLast  = TRUE
    MaxLive    = 4
    CountFault = "none"

INVARIANTS
    TypeOK
    Findable
    Unique
    EraseEnds
    CountExact
    LiveBounded
