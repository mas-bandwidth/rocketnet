\* MCRNServerSendFairQueues: two send queues, one frame a flush each; slots 0 and 2
\* on the first, 1 and 3 on the second. A slot whose queue is spent is held and the
\* round goes on; every slot is written within ceil(2 / 1) = 2 flushes.
SPECIFICATION Spec

CONSTANTS
    N       = 4
    K       = 1
    Conn    = {0, 1, 2, 3}
    WorkMax = 1
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "rounds"
    Q1      = {1, 3}
    K1      = 1
    QueueRule = "perqueue"

INVARIANTS
    TypeOK
    FairService
    NoUnitWasted
    OtherClientUnaffected
    DarkTakesOnlyItsProbes
    SameOrder
    OnlyLastWriters
    EndedWritesNothing
    CursorAsFullWalk
    VisitsBounded
