    MaxAttempts         = 1
    MaxNonces           = 1
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 0
    HandshakeDeadline   = 2
    Disconnects         = TRUE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "own"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
