\* MCRNServerSendFairLive: the Walk ring with the capacity read live. Five
\* healthy slots, two frames a flush at most; each flush's room is anything
\* from 0 to 2 (in-place frames spent some, a staged transport's sends still
\* in flight) and may grow by one inside the flush. Every slot is written
\* within ceil(5 / 2) = 3 flushes that had the full room.
SPECIFICATION Spec

CONSTANTS
    N       = 5
    K       = 2
    Conn    = {0, 1, 2, 3, 4}
    WorkMax = 2
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "rounds"
    Q1      = {}
    K1      = 0
    QueueRule = "perqueue"
    RoomMin <- MCRoomZero

INVARIANTS
    TypeOK
    FairService
    NoUnitWasted
    OtherClientUnaffected
    DarkTakesOnlyItsProbes
    SameOrder
    OnlyLastWriters
    EndedWritesNothing
    CursorAsFullWalk
    VisitsBounded
