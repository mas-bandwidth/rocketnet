\* MCRNBankFifoLayoutLifoSend: the iocp server's send banks
\* (sdk/rocketnet_server_iocp_windows.cpp): the free stack
\* send_free[--send_free_count] from the literal { 1, 2, 0 }, the ready FIFO
\* of three, one bank at the send worker.
SPECIFICATION Spec

CONSTANTS
    N         = 3
    ArrLen    = 3
    ConsMax   = 1
    MaxReady  = 3
    MaxPub    = 8
    FreeSlack = 0
    HeadMod   = 3
    TailMod   = 3
    PushKind  = "lifo"
    PopKind   = "lifo"
    InitKind  = "literal"

INVARIANTS
    TypeOK
    InBounds
    CountsInRange
    ExactlyOnePlace
    ReadyMatches
