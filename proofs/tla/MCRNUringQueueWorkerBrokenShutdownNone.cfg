\* Reversed witness "stop never completes" (review finding E1): the transport
\* has no begin_shutdown, so once the server is stopping a held bank on a
\* socket that stays full is retried forever, uncounted, nothing is
\* abandoned, send_idle never turns true and the driver never asks the stop.
\* Must violate ShutdownDrains.
SPECIFICATION MCLiveSpec

CONSTANTS
    U         = 2
    R         = 2
    K         = 2
    MaxRetry  = 2
    MaxAgain  = 1
    MaxRefuse = 1
    MaxRecvEnd = 1
    ExitRule  = "drained"
    RetryRule = "bounded"
    WakeRule  = "armed"
    ShutdownRule = "none"
    RecvRule  = "backoff"

PROPERTIES
    ShutdownDrains
