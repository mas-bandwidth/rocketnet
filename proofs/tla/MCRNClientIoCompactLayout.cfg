\* MCRNClientIoCompactLayout: four frame slots, batches of up to three, seven
\* datagrams in all with any of each batch faulty, so batches compact, fill a
\* buffer partly and fully, and a published buffer's stale slots are reused.
SPECIFICATION Spec

CONSTANTS
    C        = 4
    B        = 3
    MaxIds   = 7
    Move     = TRUE
    RecordAt = "accepted"

INVARIANTS
    TypeOK
    RecordsExact
    RecordsDense
