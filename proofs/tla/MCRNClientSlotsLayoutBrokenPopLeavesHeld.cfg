\* Assign pops without moving the last held entry down: the held region gets a gap and a stale entry.
SPECIFICATION MCSpec

CONSTANTS
    N               = 3
    Ids             = {1, 2}
    MaxGen          = 5
    ReleaseGuard    = TRUE
    PopDecrements   = TRUE
    ReleaseGenCheck = TRUE
    AssignGenCheck  = TRUE
    HoldReleased    = TRUE
    PopMovesHeld    = FALSE

INVARIANT StackExact
