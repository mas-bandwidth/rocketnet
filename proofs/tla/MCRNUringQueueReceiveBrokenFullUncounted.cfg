\* Reversed witness: a datagram that finds the bank full is dropped without
\* counting BANK_FULL.  Must violate Accounted.
SPECIFICATION MCSpec

CONSTANTS
    S           = 2
    B           = 2
    SockCap     = 1
    MaxArrive   = 4
    DrainMax    = 2
    FullRule    = "lt"
    PublishRule = "after"
    ReleaseRule = "next"
    FullCount   = "silent"
    RearmRule   = "clear"

INVARIANTS
    TypeOK
    Accounted
