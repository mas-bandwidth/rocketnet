\* MCRNServerStats: the sent side with writes below the high-water mark, as
\* concurrent fill writers record out of order. The code stamps one fill
\* phase with one time, which the model's write-count clock does not, so
\* the spans are left to the in-order instance; counts and bounds hold.
SPECIFICATION Spec

CONSTANTS
    N              = 6
    MaxSeq         = 10
    MaxWrites      = 6
    Late           = FALSE
    Reorder        = TRUE
    SeqTimes       = TRUE
    BrokenEntering = FALSE
    BrokenCrossing = FALSE
    BrokenAlias    = FALSE

INVARIANTS
    TypeOK
    BaseFollowsHighest
    CountedIsWindow
    EligibleExact
    BoundsExact
    OrderedByTime
    RetainedIsNewest

PROPERTIES
    LateNeverShrinks
