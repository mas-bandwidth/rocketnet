\* Reversed witness: ReplaceAtRequest <- MCReplaceAtRequest (TRUE), a
\* request for another token that evicts its address's half-open mapping as
\* it starts, before any check has run.  A forged or otherwise refused
\* request then leaves the address with no mapping, so RefusalKeepsHalfOpen
\* must fail with TLC's counterexample; ClaimHasMapping still holds.
SPECIFICATION MCSpec

CONSTANTS
    PosRestart   = 1
    PosVersion   = 2
    PosTimestamps = 3
    PosCompares  = 4
    PosCookie    = 5
    PosUsed      = 6
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 10
    PosKeypair   = 11
    ReplaceAtRequest <- MCReplaceAtRequest

INVARIANTS
    TypeOK
    BoundTypeOK
    ClaimHasMapping
    RefusalKeepsHalfOpen
