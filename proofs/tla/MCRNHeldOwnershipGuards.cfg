\* MCRNHeldOwnership with the number-only release kept: the occupancy bound,
\* the drain's identity check and the bounded erase each still hold their
\* invariant (defence in depth). Must pass.
SPECIFICATION Spec

CONSTANTS
    W                 = 2
    Keys              = {1, 2, 3, 4}
    Homes             <- ZeroHome
    MaxNum            = 8
    MaxCount          = 2
    NumberOnlyRelease = TRUE
    NoOccupancyBound  = FALSE
    NoIdentityCheck   = FALSE
    UnboundedErase    = FALSE

INVARIANTS
    TypeOK
    HeldBound
    EraseEnds
    NoStaleDelivery
