\* The passing control: the code's rules, every safety invariant.
SPECIFICATION MCSpec

CONSTANTS
    U         = 2
    R         = 2
    K         = 2
    MaxRetry  = 2
    MaxAgain  = 1
    MaxRefuse = 1
    MaxRecvEnd = 2
    ExitRule  = "drained"
    RetryRule = "bounded"
    WakeRule  = "armed"
    ShutdownRule = "begin"
    RecvRule  = "backoff"

INVARIANTS
    TypeOK
    ExitDrained
    SeenOnlyAfterQuit
    RunsBounded
    BlockedHasTimer
    PacketsCoverRuns
    RecvNoSpin
    RecvWaitHasTimer
