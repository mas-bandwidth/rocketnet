\* MCRNUringDriver reversed witness: a receive buffer that carries a UDP_GRO
\* coalesced run of two datagrams goes back to the provided buffer ring once
\* its first segment is copied, while the second is still in the buffer to
\* copy.  Must fail BufferReturnedAfterCopy: the kernel may refill a buffer
\* whose datagrams are not all in a bank.
SPECIFICATION Spec

CONSTANTS
    Slots               = 2
    Buffers             = 2
    MaxSteps            = 2
    Budget              = 1
    ResetWaitsForReap   = TRUE
    ReapIntoFill        = TRUE
    BoundedReap         = TRUE
    RearmOnReceive      = TRUE
    RunRetiredByCqe     = TRUE
    ReturnAfterLastCopy <- MCReturnAfterFirstCopy

INVARIANTS
    TypeOK
    NoReuseWhileKernelOwned
    ExposedStable
    BufferReturnedAfterCopy
    FreedOnlyWhenDrained
