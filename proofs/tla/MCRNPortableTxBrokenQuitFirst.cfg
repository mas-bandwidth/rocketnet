\* MCRNPortableTx reversed witness: stop sets quit and the wake before it
\* publishes or drops the producer.  The worker exits on empty and quit, then
\* main publishes a bank nobody takes.  Must fail ExitSentAll.
SPECIFICATION Spec

CONSTANTS
    NumBanks          = 3
    Cap               = 2
    Batch             = 2
    MaxPackets        = 6
    FullSlack         = 0
    HeadMod           = 3
    TailMod           = 3
    QuitUnderLock     = TRUE
    PublishBeforeQuit = FALSE
    PublishUntilSent  = TRUE
    RetryOnIdle       = TRUE
    WakeOnPublish     = TRUE
    Timeout           = FALSE

INVARIANTS
    InBounds
    TypeOK
    ExitSentAll
