\* The flush without rocketnet_server_payload_ring_return_chunks' empty marks: a chunk slot no take returned is sent with the wire_bytes an earlier update left in it.
SPECIFICATION MCSpec

CONSTANTS
    Threads       = {t1}
    LineOf        <- MCOneLine
    Cap           = 2
    RingSize      = 2
    Stride        = 2
    WrongStride   = 1
    Chunk         = 2
    GuardLines    = 1
    MaxCount      = 3
    Clamp         = TRUE
    FullTest      = TRUE
    RecoverStride = TRUE
    ReturnClear   = FALSE
    LostClear     = TRUE

INVARIANT ExactSend
