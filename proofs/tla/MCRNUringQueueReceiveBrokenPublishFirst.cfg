\* Reversed witness: the worker publishes tail before it writes the slot, so
\* a drain between the two takes a slot that still holds an older datagram.
\* Must violate InOrder.
SPECIFICATION MCSpec

CONSTANTS
    S           = 2
    B           = 2
    SockCap     = 1
    MaxArrive   = 4
    DrainMax    = 2
    FullRule    = "lt"
    PublishRule = "before"
    ReleaseRule = "next"
    FullCount   = "count"
    RearmRule   = "clear"

INVARIANTS
    TypeOK
    InOrder
