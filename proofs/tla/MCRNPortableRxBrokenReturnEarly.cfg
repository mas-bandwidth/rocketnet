\* MCRNPortableRx reversed witness: main returns its consumer to the free
\* FIFO when a call budget ends, before the tail is copied.  Must fail
\* ExactDelivery.
SPECIFICATION Spec

CONSTANTS
    NumBanks       = 3
    Cap            = 2
    Budget         = 1
    MaxDatagrams   = 4
    MaxChaff       = 0
    HoldOnFull     = TRUE
    ReturnWhenRead = FALSE
    QuitBeforeWake = TRUE
    WakeOnReturn   = TRUE
    Timeout        = FALSE
    BoundedRead    = TRUE

INVARIANTS
    TypeOK
    ExclusiveOwnership
    ExactDelivery
