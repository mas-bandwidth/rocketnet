\* The passing control for liveness: with the worker and the kernel fair,
\* every published bank is sent and free again once the flushes stop.
SPECIFICATION MCLiveSpec

CONSTANTS
    NB         = 3
    S          = 2
    Dests      = {1, 2}
    MaxSeg     = 2
    Demand     = 3
    MaxFlush   = 2
    MaxEagain  = 1
    RetireRule = "cqe"
    EagainRule = "retry"
    LockRule   = "try"

PROPERTIES
    Drains
