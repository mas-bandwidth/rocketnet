\* Payload-on-open mutation: a payload is advanced into accepted_session as
\* soon as it opens, before anything accepts it, so the ack block names a
\* packet the endpoint never took in; must violate AckReportsOnlyProcessed.
\* The accept instance of MCReplayWindowAccept.cfg with PayloadAtAccept FALSE.
SPECIFICATION MCSpec

CONSTANTS
    Words             = 2
    WordBits          = 2
    ClearedWords      = 2
    MaxSeq            = 12
    GateBeforeAdvance = TRUE
    GateBeforeOpen    = TRUE
    MarkOnAdvance     = TRUE
    RefuseBelowFloor  = TRUE
    PayloadAtAccept   = FALSE
    Kinds             = {"eligible", "payload", "ignored"}

INVARIANT AckReportsOnlyProcessed
