\* MCRNIocpSendLease reversed witness: a refused release push is final and retires the operation, as rocketnet_iocp_release_send did before the retry. Caller t1 claims position 0 and stalls before storing its sequence; t2 pops position 1, stages and releases its operation, and the push at position 2 reads cell 0's sequence 1 and is refused with the queue not full. An operation below GenMax is retired for good. RetiredOnlyAtGenMax falls. Must fail.
SPECIFICATION Spec

CONSTANTS
    NumOps        = 2
    Callers       = {t1, t2}
    Workers       = {w1}
    GenMax        = 2
    MaxLeases     = 4
    GenWrap       = FALSE
    RetireRefused = TRUE

INVARIANT RetiredOnlyAtGenMax
