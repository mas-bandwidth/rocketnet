\* The server raises its P when it answers a large probe, without a confirm.
SPECIFICATION Spec

CONSTANTS
    ClientSet     = {2, 1}
    ServerList    = {2, 1}
    CapsUp        = {2}
    CapsDown      = {2}
    K             = 2
    MaxBursts     = 0
    AttackBudget  = 0
    AttackKinds   = {"replay", "probe", "reply"}
    Forger        = FALSE
    Timed         = TRUE
    LossBound     = TRUE
    MaxReuses     = 0
    ReuseCapsUp   = {}
    ReuseCapsDown = {}
    Broken        = "raiseonprobe"

PROPERTY ServerRaisesOnConfirm
