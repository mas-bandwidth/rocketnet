\* Reversed witness: ReplaceReleasesClaim <- MCReplaceKeepsClaim (FALSE), a
\* replacement that removes the half-open mapping without releasing its
\* token's claim.  The replaced token's claim lives on with no mapping
\* holding it, so ClaimHasMapping must fail with TLC's counterexample;
\* OneLiveMappingPerToken still holds.
SPECIFICATION MCSpec

CONSTANTS
    PosRestart   = 1
    PosVersion   = 2
    PosTimestamps = 3
    PosCompares  = 4
    PosCookie    = 5
    PosUsed      = 6
    PosAdmitted  = 7
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 10
    PosKeypair   = 11
    ReplaceReleasesClaim <- MCReplaceKeepsClaim

INVARIANTS
    TypeOK
    OneLiveMappingPerToken
    ClaimHasMapping
