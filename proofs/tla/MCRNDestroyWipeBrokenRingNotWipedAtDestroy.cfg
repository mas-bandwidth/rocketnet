    Pages              = {1, 2, 3, 4, 5, 6}
    Maps               = {1, 2}
    KeyPage            = 1
    RingPages          = {2}
    EntryPage          <- MCEntryPage
    SlotPage           <- MCSlotPage
    WipeWholeBlock     = FALSE
    WipeOnRemove       = TRUE
    WipeLiveAtDestroy  = TRUE
    WipeSlotOnRelease  = TRUE
    WipeSlotsAtDestroy = TRUE
    WipeEverySlot      = FALSE
    WipeRingOnLeave    = TRUE
    WipeRingAtDestroy  = FALSE

INVARIANTS
    TypeOK
    SecretsZeroAtFree
    ShutdownPeakWithinRun
    NoSecretOutsideLive
    RingCopyOnlyWhileWaiting
