\* MCServerStopSpread liveness: the same instance under fairness (the caller keeps polling, the transport finishes what it was handed); every stop finishes. Must pass.
SPECIFICATION FairSpec

CONSTANTS
    SlotCount   = 2
    MaxSessions = 4
    Burst       = 2
    BankSize    = 3
    RingSize    = 4
    SteadyCap   = 2
    Defect      = "none"

INVARIANTS
    TypeOK
    RingHolds
    FullBurstBeforeStopped

PROPERTIES
    StopFinishes
