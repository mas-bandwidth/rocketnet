\* MCRNRioWorker reversed witness: the worker dequeues every completion
\* whatever the fill bank has room for and drops the overflow (the old
\* caller-driven bank rule).  Four datagrams so the worker's bank can be
\* partly full when main has not started on it.  Must fail ExactDelivery.
SPECIFICATION Spec

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 2
    Cap             = 2
    View            = 4
    MaxDatagrams    = 4
    MaxSends        = 0
    DrainBatch      = 2
    StopDrainWaits  = 2
    InlineStop      = FALSE
    BoundedStopDrain = TRUE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = FALSE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    TypeOK
    ExactDelivery
