\* MCLinkReverseWindow.cfg: windows flushed at any count from 1 up over 6 numbered sends, each reversed when it holds two or more (a full window of 3 delivers 3,2,1).
SPECIFICATION SpecReverseWindow
CONSTANTS
    Packets     = {1, 2, 3, 4, 5, 6}
    Capacity    = 6
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = TRUE
    Pattern     = "none"
    BurstStart  = 1
    BurstLen    = 3
    MaxSeq      = 6
    StoreSlots  = 1
    Defect      = "none"
INVARIANTS
    MCPatternsTypeOK
    InFlightBounded
    WindowOrderReversed
