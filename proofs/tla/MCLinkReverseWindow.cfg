\* MCLinkReverseWindow.cfg: window reversal of size 3 over 6 numbered sends (delivers 3,2,1,6,5,4).
SPECIFICATION SpecReverseWindow
CONSTANTS
    Packets     = {1, 2, 3, 4, 5, 6}
    Capacity    = 6
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = TRUE
    Pattern     = "none"
    BurstStart  = 1
    BurstLen    = 3
    MaxSeq      = 6
    Defect      = "none"
INVARIANTS
    MCPatternsTypeOK
    InFlightBounded
    WindowOrderReversed
