\* Evict while pkt_tail - pkt_head > P: the write lands on the live head
\* (SlotsIntact).
SPECIFICATION MCSpec

CONSTANTS
    Part         = "sent"
    P            = 3
    R            = 2
    MaxRefs      = 4
    Rq           = 3
    SerialMod    = 4
    MaxWrites    = 6
    MaxEvents    = 0
    EvictAtP     = FALSE
    RefTestExact = TRUE
    ResetEmpty   = TRUE
    ReceiptClamp = TRUE
    SerialSkip   = TRUE

INVARIANT SlotsIntact
