\* MCRNBankFifoLayoutGsoStop: the gso transmit banks
\* (sdk/rocketnet_server_gso_linux.cpp) with the stop's final transfer: the
\* MCRNBankFifoLayout shape (free FIFO and ready FIFO of three, the literal
\* { 1, 2, 0 }, one bank at the worker), where take_send, once quit is stored
\* and nothing is ready, hands the worker the producer itself and leaves -1.
\* Eight publishes, so both queues wrap more than twice before the stop.
SPECIFICATION Spec

CONSTANTS
    N         = 3
    ArrLen    = 3
    ConsMax   = 1
    MaxReady  = 3
    MaxPub    = 8
    FreeSlack = 0
    HeadMod   = 3
    TailMod   = 3
    PushKind  = "fifo"
    PopKind   = "fifo"
    InitKind  = "literal"
    StopKind  = "code"

INVARIANTS
    TypeOK
    InBounds
    CountsInRange
    ExactlyOnePlace
    ReadyMatches
    FinalLast
