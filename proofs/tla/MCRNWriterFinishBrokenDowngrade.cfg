\* MCRNWriterFinishBrokenDowngrade: reversed witness: a large start finished at a size one packet carries is queued as an
\* unreliable message (the defect fixed in fix/v1.1.x/writer-finish), so it waits for the walk and
\* holds later small sends behind it, and StagedQueuesNothing falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Writers          = {w1, w2}
    Clients          = {c1, c2}
    NoOwner          = none
    Capacity         = 2
    MaxStarts        = 5
    SealAtFinish     = TRUE
    RefuseNoCapacity = TRUE
    CheckOwner       = TRUE
    Buffered         = FALSE
    RingRefuses      = FALSE
    Budgeted         = FALSE
    RestartAtFinish  = FALSE
    ValidateFirst    = TRUE

INVARIANTS
    TypeOK
    StagedQueuesNothing
