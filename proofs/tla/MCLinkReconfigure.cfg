\* MCLinkReconfigure.cfg: the live setting control. The caller hands a
\* change over while packets are in flight and the owner takes it at a later
\* uncontended pass; every send uses the setting last asked for unless a
\* change still waits, and a change drops nothing already in flight.
SPECIFICATION Spec

CONSTANTS
    Packets     = {a, b}
    Capacity    = 2
    MaxDelay    = 1
    Duplication = FALSE
    Reordering  = FALSE
    Pattern     = "none"
    BurstStart  = 1
    BurstLen    = 2
    MaxSends    = 3
    Defect      = "none"

INVARIANTS
    RCTypeOK
    LiveSettingHolds
