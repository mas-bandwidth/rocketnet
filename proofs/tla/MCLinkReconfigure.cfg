\* MCLinkReconfigure.cfg: the live setting control. The setting changes
\* while packets are in flight; every send uses the setting in force and a
\* change drops nothing already in flight.
SPECIFICATION Spec

CONSTANTS
    Packets     = {a, b}
    Capacity    = 2
    MaxDelay    = 1
    Duplication = FALSE
    Reordering  = FALSE
    Pattern     = "none"
    BurstStart  = 1
    BurstLen    = 2
    MaxSends    = 3
    Defect      = "none"

INVARIANTS
    RCTypeOK
    LiveSettingHolds
