\* Reversed witness for PromotedIsTwin: the route promotes an oversize code-1
\* send to code 2 instead of its sequenced twin, code 4 (Broken =
\* "PromoteSequencedToReliable"). The send stays reliable, so only the twin
\* rule sees it. Must violate PromotedIsTwin.
SPECIFICATION SafetySpec
CONSTANTS
    Scenario = "promote"
    Broken = "PromoteSequencedToReliable"
    SendCapacity = 4
    OrderedCapacity = 2
    HoldCapacity = 2
    TransportCaps = {1}
INVARIANTS
    TypeOK
    PromotedNeverUnreliable
    PromotedIsTwin
CHECK_DEADLOCK FALSE
