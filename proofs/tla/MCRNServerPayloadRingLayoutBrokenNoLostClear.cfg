\* A lost install that leaves its chunk's slots as they were: two threads on one line claim chunks, the second install loses, and the flush sends that chunk's slots with the wire_bytes an earlier update left in them.
SPECIFICATION MCSpec

CONSTANTS
    Threads       = {t1, t2}
    LineOf        <- MCOneLine
    Cap           = 4
    RingSize      = 4
    Stride        = 2
    WrongStride   = 1
    Chunk         = 2
    GuardLines    = 1
    MaxCount      = 5
    Clamp         = TRUE
    FullTest      = TRUE
    RecoverStride = TRUE
    ReturnClear   = TRUE
    LostClear     = FALSE

INVARIANT ExactSend
