    RxCap              = 2
    TxCap              = 2
    MaxRx              = 4
    MaxTx              = 4
    PublishWhileHeld   = FALSE
    MainBlocks         = FALSE
    FullDrops          = FALSE
    CarryBehind        = FALSE
    DropBeforeShutdown <- DropBeforeShutdownBroken

INVARIANTS
    FullSocketDropsOnlyAfterShutdown
