\* MCRNGsoHandoff reversed witness: the send worker counts refusals without the send_shutdown test, so a full socket's unsent rest is dropped while the server runs. FullSocketDropsOnlyAfterShutdown falls. Must fail.
SPECIFICATION SpecFair

