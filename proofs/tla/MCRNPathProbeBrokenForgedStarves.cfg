\* The allowance is spent before the open, as the code did: a forger at the client's address spends every update's allowance and the genuine probes are withheld.
SPECIFICATION FairSpec

CONSTANTS
    ClientSet     = {2, 1}
    ServerList    = {2, 1}
    CapsUp        = {2}
    CapsDown      = {2}
    K             = 2
    MaxBursts     = 0
    AttackBudget  = 0
    Forger        = TRUE
    Timed         = TRUE
    Broken        = "forgedspends"

PROPERTY ForgedNeverStarves
