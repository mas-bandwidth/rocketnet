\* MCRNUringDriver reversed witness: unbounded fill.  ReapWithinRoom =
\* FALSE reaps a receive CQE into the fill bank whether or not the bank has
\* room for its segments, as the code did before the room rule: a send reap
\* and a receive reap between two swaps put more in the bank than it holds
\* (the code then dropped the rest as RECEIVE_DROPPED_OVERFLOW).  Room = 1
\* with Segments = 2 so one coalesced receive overfills it.
\* Must fail FillWithinRoom.
SPECIFICATION Spec

CONSTANTS
    Slots             = 2
    Buffers           = 2
    MaxSteps          = 2
    Budget            = 1
    Room              = 1
    ReapWithinRoom    = FALSE
    ResetWaitsForReap = TRUE
    ReapIntoFill      = TRUE
    BoundedReap       = TRUE
    RearmOnReceive    = TRUE
    RunRetiredByCqe   = TRUE

INVARIANTS
    TypeOK
    FillWithinRoom
