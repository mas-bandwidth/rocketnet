\* Counters wrapping at 8, not a multiple of capacity 3: the slot sequence breaks at the wrap.
SPECIFICATION MCSpec

CONSTANTS
    Clients        = 1
    Capacity       = 3
    ServerCapacity = 3
    CounterMod     = 8
    MaxSent        = 9
    FullSlack      = 0
    ResetRestartsIndices = TRUE
    SlotBytes      = 4
    RedZoneBytes   = 4
    AlignBytes     = 4
    RedZoneInCarve = TRUE

INVARIANT RingIsQueue
