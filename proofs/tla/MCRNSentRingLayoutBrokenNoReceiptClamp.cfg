\* The read starts at receipt_visible_head without the clamp at
\* receipt_head: an overwritten cell is reported (ReadExact).
SPECIFICATION MCSpec

CONSTANTS
    Part         = "receipt"
    P            = 3
    R            = 2
    MaxRefs      = 4
    Rq           = 3
    SerialMod    = 4
    MaxWrites    = 6
    MaxEvents    = 8
    EvictAtP     = TRUE
    RefTestExact = TRUE
    ResetEmpty   = TRUE
    ReceiptClamp = FALSE
    SerialSkip   = TRUE

INVARIANT ReadExact
