\* MCRNReceiveAllowanceCredit: the credits for a correct client. One correct
\* client, B = 1 byte a tick at Factor 2, one maximum packet of 2, T = 2
\* ticks, three ticks; the server sends it up to two session packets
\* (eliciting, which it receives or loses, and the server's own standalone
\* acks); it sends all four kinds, its acks, keep-alives and disconnect at a
\* maximum packet each, up to two in flight; one slot reuse: never refused,
\* and the credits mint nothing. Time stepping back is the control's and
\* MCRNReceiveAllowanceFlood's. MCRNReceiveAllowanceBrokenNoAckCredit and
\* NoControl are this file with one constant flipped.

SPECIFICATION Spec

CONSTANTS
    Correct      = {c1}
    Flooders     = {}
    B            = 1
    Factor       = 2
    MaxPkt       = 2
    T            = 2
    Horizon      = 3
    FloodPerTick = 1
    MaxNet       = 2
    MaxBack      = 0
    MaxReconnect = 1
    Refill       = TRUE
    CapFull      = TRUE
    PerClient    = TRUE
    Monotone     = TRUE
    MaxElicit    = 2
    Kinds        = {"pay", "ack", "ka", "dc"}
    AckCredit    = TRUE
    Control      = TRUE
    CreditBound  = TRUE
    ServerAckSpends = TRUE
    c1 = c1
    f1 = f1

INVARIANTS
    TypeOK
    UnderRateNeverRefused
    Isolated
    NoMint
    AcksBounded
