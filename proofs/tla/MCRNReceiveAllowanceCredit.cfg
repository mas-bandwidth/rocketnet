\* MCRNReceiveAllowanceCredit: the credits' committed case. One correct client
\* and one flooder, B = 1 byte a tick at Factor 2, one maximum packet of 2,
\* T = 2 ticks, four ticks; the server sends each client up to three session
\* packets (eliciting, which a correct client receives or loses, and its own
\* standalone acks); every client sends all four kinds, the correct client's
\* acks and keep-alives at a maximum packet each; one flood packet a tick,
\* one step back, one slot reuse: every invariant.
\* MCRNReceiveAllowanceBrokenNoAckCredit, NoControl, FreeAcks and
\* ServerAckCredits are this file with one constant flipped.

SPECIFICATION Spec

CONSTANTS
    Correct      = {c1}
    Flooders     = {f1}
    B            = 1
    Factor       = 2
    MaxPkt       = 2
    T            = 2
    Horizon      = 4
    FloodPerTick = 1
    MaxNet       = 3
    MaxBack      = 1
    MaxReconnect = 1
    Refill       = TRUE
    CapFull      = TRUE
    PerClient    = TRUE
    Monotone     = TRUE
    MaxElicit    = 3
    Kinds        = {"pay", "ack", "ka", "dc"}
    AckCredit    = TRUE
    Control      = TRUE
    CreditBound  = TRUE
    ServerAckSpends = TRUE
    c1 = c1
    f1 = f1

INVARIANTS
    TypeOK
    UnderRateNeverRefused
    Isolated
    NoMint
    AcksBounded
