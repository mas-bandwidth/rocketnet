\* Reversed witness: MCRNConnectionMemoryRefuse.cfg with CountExhausted =
\* TRUE (a start refused because the receive side exhausted the region is
\* counted in the connection's send_refused, which rn_endpoint_start counts
\* only when the region's room_refusals moved). TLC must fail
\* RefusalLeavesStateUnchanged.
SPECIFICATION Spec

CONSTANTS
    Slots    = {s1, s2}
    Clients  = {c1, c2, c3}
    Capacity = 3
    Reset    = TRUE
    CarryOn  = FALSE
    SendExhausts = FALSE
    TakeBeforeFit = FALSE
    CountExhausted = TRUE
    CountMod = 3

INVARIANTS
    TypeOK

PROPERTIES
    RefusalLeavesStateUnchanged
