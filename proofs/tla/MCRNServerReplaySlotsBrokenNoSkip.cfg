\* The mark pass without the skip of a slot whose record names another
\* address: the reused slot is seen at its new address and the old address's
\* owed forget is lost (ForgetNeverLost).
SPECIFICATION MCSpec

CONSTANTS
    s1              = s1
    s2              = s2
    a1              = a1
    a2              = a2
    NONE            = NONE
    Slots           = {s1, s2}
    Addrs           = {a1, a2}
    MaxHigh         = 1
    SkipWhileOwed   = FALSE
    ClearOnAccept   = TRUE
    ForgetRefusable = TRUE

INVARIANT ForgetNeverLost
