\* The passing control: the code's rules, two queues of two banks of three
\* slots, two fill threads, claims past each bank refused, a caller's
\* pointer off by a byte either way, two flushes.
SPECIFICATION MCSpec

CONSTANTS
    Q           = 2
    NB          = 2
    S           = 3
    Stride      = 2
    Threads     = {1, 2}
    Dests       = {1, 2, 3}
    QueueOf     <- MCQueueOf
    Demand      = 4
    MaxFlush    = 2
    Skew        = {-1, 0, 1}
    ClaimCmp    = "ge"
    CounterWrap = 0
    SlotRule    = "check"
    IdRule      = "mul"

INVARIANTS
    TypeOK
    InBounds
    NoSharedSlot
    NoForeignWrite
    RouteMatches
    StagedMatches
