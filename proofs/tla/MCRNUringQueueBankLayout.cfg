\* The passing control: the code's rules, two queues of two banks of three
\* slots, two fill threads, claims past each bank refused, a caller's
\* pointer off by a byte either way, two flushes.
SPECIFICATION MCSpec

CONSTANTS
    Q           = 2
    NB          = 2
    S           = 3
    Stride      = 2
    Threads     = {1, 2}
    Dests       = {2, 3, 4}
    Demand      = 3
    MaxFlush    = 2
    MaxSkew     = 1
    ClaimCmp    = "ge"
    CounterWrap = 0
    SlotRule    = "check"
    IdRule      = "mul"

INVARIANTS
    TypeOK
    InBounds
    NoSharedSlot
    NoForeignWrite
    RouteMatches
    StagedMatches
