\* rn_sequenced_in_turn computes held_gap = sequencing - held->sequencing without the mask: past the wire wrap a newer in-turn record is superseded by the older block collecting.
SPECIFICATION MCSpec

CONSTANTS
    Mod         = 8
    CounterMod  = 32
    Net         = 2
    MaxSeqSends = 5
    MaxOrdSends = 4
    Starts      = {0, 6}
    Broken      = "blockGapUnmasked"

INVARIANT NewerNeverDiscarded
