\* MCRNXdpReceiveRing reversed witness: main leaves its flag raised when its
\* tries run out, so the worker stays off the mutex after the call that
\* missed, for as long as main takes to call again. A thread may stop
\* (Stall), which is what makes a claim miss. Must fail WantedOnlyInSpin.
SPECIFICATION Spec

CONSTANTS
    F1         = F1
    F2         = F2
    F3         = F3
    Frames     = {F1, F2, F3}
    RingSize   = 2
    PeekMax    = 2
    StageCap   = 2
    FillSize   = 6
    Budget     = 1
    MaxPackets = 4
    SpinMax    = 2
    TryArrivals = 1
    Stall      = TRUE
    StickyWant <- StickyWantBroken

INVARIANTS
    TypeOK
    WantedOnlyInSpin
