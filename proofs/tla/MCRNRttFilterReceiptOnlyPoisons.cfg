\* MCRNRttFilterReceiptOnlyPoisons: the code and the standard's rule. A
\* receipt-only packet sent with no reliable number owed waits out an
\* outage; no silence ends (nothing was owed, m9.2), and its acknowledgement
\* is sampled (ref_count 0 in rn_window_ack_on_ack), so the estimate moves
\* toward the outage. m9.1 requires that sample (one per acknowledged send,
\* receipt-only sends included, 9905e855). What must still hold, and does:
\* no sample from a packet that carried a reliable number is outage-sized
\* and above the estimate (NumberSamplesNeverPoison). A receipt-only
\* sample may already have raised it; the filter then takes a number's
\* sample only up to srtt. Reversed witness:
\* MCRNRttFilterBrokenNoFilterReceiptOnly.cfg.
SPECIFICATION Spec
CONSTANTS
    Probe     = 3
    RttLow    = 0
    RttHigh   = 1
    OutageMax = 4
    M         = 1
    P         = 1
    Rule      = "owed"
    FirstAck  = FALSE
    DupSample = FALSE
    ReceiptPkts = TRUE
INVARIANTS
    TypeOK
    NumberSamplesNeverPoison
