\* MCRNRttFilterReceiptOnlyPoisons: the code. A receipt-only packet sent
\* with no reliable number owed waits out an outage; no silence ends (nothing
\* was owed, m9.2), and its acknowledgement is sampled (ref_count 0 in
\* rn_window_ack_on_ack), so the estimate moves toward the outage
\* (OutageNeverPoisons). This is the code's behaviour, recorded: the bound
\* holds only for packets that carry a reliable number.
SPECIFICATION Spec
CONSTANTS
    Probe     = 3
    RttLow    = 0
    RttHigh   = 1
    OutageMax = 4
    M         = 1
    P         = 1
    Rule      = "owed"
    FirstAck  = FALSE
    DupSample = FALSE
    ReceiptPkts = TRUE
INVARIANT
    OutageNeverPoisons
