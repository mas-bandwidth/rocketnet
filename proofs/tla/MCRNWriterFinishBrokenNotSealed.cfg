\* MCRNWriterFinishBrokenNotSealed: reversed witness: the writer's finish leaves its packet open, unsealed, so the main thread's walk finishes it
\* and NothingLeftForWalk falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Writers          = {w1, w2}
    Clients          = {c1, c2}
    NoOwner          = none
    Capacity         = 2
    MaxStarts        = 5
    SealAtFinish     = FALSE
    RefuseNoCapacity = TRUE
    CheckOwner       = TRUE
    Buffered         = FALSE
    RingRefuses      = FALSE

INVARIANTS
    TypeOK
    NothingLeftForWalk
