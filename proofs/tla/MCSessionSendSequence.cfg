\* MCSessionSendSequence: the rule. Every session send takes its sequence in
\* one fetch-add; the ack baseline is the highest sealed sequence.
SPECIFICATION MCSpec

CONSTANTS
    MaxSeq = 5
    Fills  = {f1, f2}
    Broken = "none"

INVARIANTS
    TypeOK
    SequencesUnique
    NoZeroSequence
    BaselineIsHighestSealed
