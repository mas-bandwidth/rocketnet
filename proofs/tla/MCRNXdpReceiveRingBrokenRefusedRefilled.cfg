\* MCRNXdpReceiveRing reversed witness: a refused descriptor naming a frame
\* outside the receive region (a send frame, posted by a driver or kernel
\* defect) goes back to the fill ring like any dropped frame. Must fail
\* FillHoldsOnlyReceiveFrames: the kernel then receives into a frame the
\* send path owns. FrameConservation restates the ownership and is broken
\* at the take, when the worker holds the send frame for the fill ring,
\* before the fill ring holds it; it is left out so the run reaches the harm.
SPECIFICATION Spec

CONSTANTS
    F1       = F1
    F2       = F2
    F3       = F3
    Frames   = {F1, F2, F3}
    RingSize = 2
    PeekMax  = 2
    StageCap = 1
    FillSize = 6
    RefusedRefilled <- RefusedRefilledBroken

INVARIANTS
    TypeOK
    FillHoldsOnlyReceiveFrames
