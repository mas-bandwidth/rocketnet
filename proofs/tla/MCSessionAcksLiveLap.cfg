\* MCSessionAcksLiveLap: live-lap. The liveness run where the sender laps its
\* sent ring (MaxSeq 3 over SentRing 2, so sequence 3 overwrites the record
\* of 1) and the receiver's window slides (MaxSeq 3 over Window 2, so the
\* floor rises above 1), on lossy links: the ~Retained disjunct of
\* OpenedSurfacesOrLaps is reachable and the property still holds.
\* Duplication and reordering off, burns off, to stay inside the case budget.
SPECIFICATION Spec

CONSTANTS
    MaxSeq      = 3
    SentRing    = 2
    BatchCap    = 1
    Window      = 2
    MaxRanges   = 1
    DrainCap    = 3
    Burns       = FALSE
    Witness     = "none"
    D2RPattern  = "arbitrary"
    R2DPattern  = "arbitrary"
    Capacity    = 1
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = FALSE
    BurstStart  = 3
    BurstLen    = 2

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked
    RepeatExact

PROPERTIES
    OpenedSurfacesOrLaps
