\* MCRNConnectionMemory: the committed run. Three slots from one block, four
\* clients, three records of room; Reuse resets and an exhausted connection
\* does nothing but get kicked. Every invariant and property must hold.
SPECIFICATION Spec

CONSTANTS
    Slots    = {s1, s2, s3}
    Clients  = {c1, c2, c3, c4}
    Capacity = 3
    Reset    = TRUE
    CarryOn  = FALSE

INVARIANTS
    TypeOK
    UsedBounded
    ExhaustedReasonNamed
    ReusedSlotStartsClean

PROPERTIES
    ExhaustionOnlyLeadsToDisconnect
    NoCrossSlotEffect
    ExhaustedEventuallyFree
