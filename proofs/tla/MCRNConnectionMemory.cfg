\* MCRNConnectionMemory: the committed run. Three slots from one block, four
\* clients, three records of room; Reuse resets and an exhausted connection
\* does nothing but get kicked; a send with no room is refused and changes
\* nothing. Every invariant and property must hold. CountMod = 1 drops the
\* refusal count for the budget; MCRNConnectionMemoryRefuse.cfg checks it.
SPECIFICATION Spec

CONSTANTS
    Slots    = {s1, s2, s3}
    Clients  = {c1, c2, c3, c4}
    Capacity = 3
    Reset    = TRUE
    CarryOn  = FALSE
    SendExhausts = FALSE
    TakeBeforeFit = FALSE
    CountMod = 1

INVARIANTS
    TypeOK
    UsedBounded
    ExhaustedReasonNamed
    ReusedSlotStartsClean

PROPERTIES
    SendNeverEnds
    ExhaustionOnlyLeadsToDisconnect
    RefusalLeavesStateUnchanged
    NoCrossSlotEffect
    ExhaustedEventuallyFree
