\* MCRNServerSendFairBrokenFixedWindow: the live room of
\* MCRNServerSendFairLive.cfg with the fixed-capacity window, every flush
\* counted. A flush with less room serves fewer slots, so a slot with work
\* waits ceil(5 / 2) = 3 flushes. Must fail FairService.
SPECIFICATION Spec

CONSTANTS
    N       = 5
    K       = 2
    Conn    = {0, 1, 2, 3, 4}
    WorkMax = 2
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "rounds"
    Q1      = {}
    K1      = 0
    QueueRule = "perqueue"
    RoomMin <- MCRoomZero
    CountsAllFlushes <- MCCountsAll

INVARIANT FairService
