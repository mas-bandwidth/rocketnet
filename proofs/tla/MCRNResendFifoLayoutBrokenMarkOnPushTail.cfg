\* push_tail that never starts a class's sent part: the first number sent
\* leaves the mark at NONE, so the walk of the numbers on the wire finds none
\* and the walk of the numbers not on the wire runs past them (MarkMatch).
SPECIFICATION MCSpec

CONSTANTS
    W                 = 4
    SelfTailFix       = TRUE
    TailOnEnd         = TRUE
    UnlinkClearsClass = TRUE
    InsertSetsClass   = TRUE
    MarkOnUnlink      = TRUE
    MarkOnPushTail    = FALSE
    MarkInitNone      = TRUE
    RefusedTakesMark  = TRUE
    RefusedBeforeMark = TRUE
    ParkContract      = TRUE

INVARIANT MarkMatch
