\* MCRNClientReceiveQuit: the committed run on linux (condition variable
\* wait and wake), every rule on.  The wait's timeout is not assumed to
\* fire (no fairness on WaitTimesOut), so DestroyCompletes holds on the
\* wake alone.
SPECIFICATION SpecFair

CONSTANTS
    Platform       = "linux"
    WaitTimeout    = "unreliable"
    WakeBeforeQuit = FALSE
    NoWake         = FALSE

INVARIANTS
    TypeOK
    WokenSeesQuit

PROPERTIES
    DestroyCompletes
