\* Move only version after crypto; every other rung keeps the healthy position.
\* Restoring PosVersion to 2 restores the healthy order. CheapRefusalsFirst must fail.
SPECIFICATION MCSpec

CONSTANTS
    PosRestart   = 1
    PosVersion   = 12
    PosTimestamps = 3
    PosCompares  = 4
    PosCookie    = 5
    PosUsed      = 6
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 10
    PosKeypair   = 11

INVARIANTS
    TypeOK
    CheapRefusalsFirst
