\* MCLinkWireFairFirst.cfg: MCLink Pattern "first" under SpecWireFair, checking LinkDelivers.
SPECIFICATION SpecWireFair
CONSTANTS
    Packets     = {a, b}
    Capacity    = 3
    MaxDelay    = 1
    Duplication = TRUE
    Reordering  = TRUE
    Pattern     = "first"
    BurstStart  = 1
    BurstLen    = 2
INVARIANTS
    MCTypeOK
    InFlightBounded
    DeliveredWereSent
    WireCarriesOnlySent
    FirstSendLost
PROPERTIES
    LinkDelivers
