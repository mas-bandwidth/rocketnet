\* MCRNClientIoDecrypt reach witness: the challenge, sequences 1 and 2, then
\* a copy of 1, which the I/O thread's replay check refuses as too old (the
\* window of width 1 has moved past it).  No forged datagram, so the four
\* datagrams fit the case budget.  Every other invariant holds on the way.
\* Must fail NoTooOldRefusal.
SPECIFICATION Spec

CONSTANTS
    BufferCap        = 2
    MaxDatagrams     = 4
    MaxSeq           = 2
    W                = 1
    MaxReplays       = 1
    MaxForged        = 0
    IntegrityLimit   = 1
    OpenBeforeReplay = FALSE
    SharedWindow     = FALSE
    NoRetire         = FALSE
    CountOnIo        = FALSE
    NoPayloadGate    = FALSE

INVARIANTS
    TypeOK
    CheapRefusalsFirst
    NoOpenWithoutKeys
    IoWindowWithinMain
    PayloadOpenedOnlyConnected
    AcceptedOnce
    SingleWriter
    ExposedStable
    NoReceiveStall
    RetiredZeroed
    NoTooOldRefusal
