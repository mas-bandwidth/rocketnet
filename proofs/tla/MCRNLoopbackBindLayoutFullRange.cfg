\* The passing control with more records than ports in the range: every rule on, every invariant.
SPECIFICATION MCSpec

CONSTANTS
    Records      = 3
    First        = 4
    Last         = 5
    BindPorts    = {0, 1, 4}
    PlusOne      = TRUE
    BindCheck    = TRUE
    WrapToFirst  = TRUE
    BothFamilies = TRUE
    DualCheck    = TRUE
    FullCheck    = TRUE
    Sized        = FALSE
    HoldAll      = FALSE

INVARIANTS
    TypeOK
    OneEndpointPerFamilyPort
    BoundExact
    LookupIsWalk
    OneIPv4Destination
    EphemeralInRange
    EphemeralPortFree
    RefusesOnlyWhenFull
    NoPortZero
    NextPortInRange
    DestroyFindsOwnEntry
    RegisteredCount
    HoldsEveryRecord
