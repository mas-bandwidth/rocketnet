\* MCRNSourceSnapshotLayout reversed witness: the reader announces the slot it loaded and holds it with no re-check. Its load is two publishes old, the writer's scan missed the announcement, and the writer clears the slot under it. WriterNeverWritesAnnounced falls. Must fail.
SPECIFICATION Spec

CONSTANTS
    Readers       = {1}
    Addrs         = {1, 2, 3}
    Cap           = 4
    MaxEntries    = 2
    HomeAt        = {7, 11, 12}
    MaxUpdates    = 3
    MaxRefused    = 1
    HalfPublished = FALSE
    NoRecheck     = TRUE
    LookupNoWrap  = FALSE

INVARIANT WriterNeverWritesAnnounced
