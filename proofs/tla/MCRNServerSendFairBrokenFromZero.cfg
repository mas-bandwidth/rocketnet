\* MCRNServerSendFairBrokenFromZero: the reversed witness where the pass
\* starts at index 1 every update. The low indices spend the capacity and a
\* higher index waits past ceil(N / K) updates, so FairService falls.
SPECIFICATION Spec

CONSTANTS
    N        = 3
    K        = 1
    Mode     = "fromzero"
    MaxTicks = 9


INVARIANTS
    TypeOK
    FairService
