\* MCRNServerSendFairBrokenFromZero: the reversed witness where the pass
\* starts at client 1 every update. The low indices spend the capacity and a
\* higher index waits past ceil(N / K) updates, so FairService falls.
SPECIFICATION Spec

CONSTANTS
    N       = 3
    K       = 1
    Work    = 1
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Mode    = "fromzero"

INVARIANTS
    TypeOK
    FairService
