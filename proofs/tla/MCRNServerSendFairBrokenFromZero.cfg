\* MCRNServerSendFairBrokenFromZero: every flush starts at slot 0, so with one frame a flush
\* the low slots take the capacity and slot 2 starves (FairService).
SPECIFICATION Spec

CONSTANTS
    N       = 3
    K       = 1
    Conn    = {0, 1, 2}
    WorkMax = 1
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "fromzero"

INVARIANT
    FairService
