\* A slot whose skip mark still names an address it has left is marked at
\* its new address and the skip mark overwritten (KeepSkipOwner FALSE):
\* the left address's entry loses its owner (KernelEntryOwned).
SPECIFICATION MCSpec

CONSTANTS
    s1              = s1
    s2              = s2
    a1              = a1
    a2              = a2
    a3              = a3
    NONE            = NONE
    Slots           = {s1, s2}
    Addrs           = {a1, a2, a3}
    MaxHigh         = 0
    SkipWhileOwed   = TRUE
    ClearOnAccept   = TRUE
    ForgetRefusable = TRUE
    MarkSupersedes  = TRUE
    ForgetSupersedes = TRUE
    OweOnRefusal    = TRUE
    ScanWhenOwedOnly = TRUE
    KeepSkipOwner   <- MCKeepSkipOwnerBroken

INVARIANT KernelEntryOwned
