\* MCClientConnectionServerAcks.cfg: the committed run (MCClientConnection.cfg)
\* with the server's standalone ack (type 8) on the wire.  "firstkind" loses
\* the first keep-alive, so an authenticated ack reaches the client in
\* sending connection response (3) as well as connected (4).  The ack
\* refreshes the receive clock and moves nothing else (AckNeverMovesState);
\* every rule and the liveness of the committed run still hold.
SPECIFICATION Spec

CONSTANTS
    SendInterval     = 1
    Timeout          = 0
    Deadline         = 0
    ServerDeadline   = 0
    MaxAttempts      = 1
    MaxNonces        = 1
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "firstkind"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
    ServerAcks       <- MCServerAcks

INVARIANTS
    SafetyInvariants
    KeysErasedWhenDown

PROPERTIES
    AckNeverMovesState
    StepsForwardOrFails
    DisconnectIsTerminal
    TimeoutPairing
    AcceptedUnderLiveKeys
    PayloadOnlyWhenConnected
    NoSendOnArrival
    Connects
    ServerNotStranded
