\* MCRNRioWorker with two banks and four datagrams of which 2 and 3 fail the
\* prefilter, no sends: the worker refuses them on dequeue (they take no bank
\* room, their slices are re-posted) and delivers 1 and 4 in order under
\* backpressure.  Every invariant with NoGarbageBanked, and the receive and
\* stop liveness properties under SpecFair.
SPECIFICATION SpecFair

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 2
    Cap             = 2
    View            = 4
    MaxDatagrams    = 4
    MaxSends        = 0
    DrainBatch      = 2
    StopDrainWaits  = 2
    InlineStop      = FALSE
    BoundedStopDrain = TRUE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE
    Garbage         <- MCGarbage

INVARIANTS
    StopSendsHanded
    StopSendsFinished
    TypeOK
    SlicesAccounted
    ExclusiveOwnership
    ExposedStable
    DeliveredByNextCall
    ExactDelivery
    FillPhaseOwnedByMain
    NoSendDuplicated
    FreedOnlyWhenDrained
    NoGarbageBanked

PROPERTIES
    EveryDatagramConsumed
    StopCompletesUnlessRefused
