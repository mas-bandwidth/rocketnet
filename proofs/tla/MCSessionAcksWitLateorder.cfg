\* MCSessionAcksWitLateorder.cfg: the reversed witness of the same-update ack
\* (TRANSPORT.md t15.4). The order before the fix: no send pass, so the debt
\* the message layer raises by accepting a payload after the update ack decision
\* waits for the next update. SameUpdateAck is violated. The gate instance
\* constants (MCSessionAcks.cfg) with AckTiming on; MCSessionAcksTiming.cfg passes it.
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq      = 4
    SentRing    = 4
    BatchCap    = 1
    Window      = 4
    MaxRanges   = 2
    DrainCap    = 4
    Burns       = TRUE
    Witness     = "lateorder"
    D2RPattern  = "arbitrary"
    R2DPattern  = "arbitrary"
    Capacity    = 2
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = TRUE
    BurstStart  = 3
    BurstLen    = 2
    AckTiming   <- MCAckTiming

PROPERTIES
    SameUpdateAck
