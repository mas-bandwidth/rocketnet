\* MCRNRttFilterReceiptOnly: the code with receipt-only packets (no reliable
\* number, sampled through the same filter) beside one reliable number, and
\* acknowledgement batches that match nothing: the filter still refuses
\* exactly the samples a real owed silence delayed.
SPECIFICATION Spec
CONSTANTS
    Probe     = 3
    RttLow    = 0
    RttHigh   = 1
    OutageMax = 4
    M         = 1
    P         = 2
    Rule      = "owed"
    FirstAck  = FALSE
    DupSample = FALSE
    ReceiptPkts = TRUE
INVARIANTS
    TypeOK
    NoSampleAcrossSilence
    RefuseOnlyAfterOwedSilence
    NumberSamplesNeverPoison
