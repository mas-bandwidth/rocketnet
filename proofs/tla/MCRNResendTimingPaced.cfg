\* MCRNResendTimingPaced: the defaults (one tick is 500 ms) in the product's
\* shape: one packet an update, written by one rn_ordered_write call for one
\* packet, and a block whose other 42 chunks are numbered with the chunk and
\* never sent, so its first pass (21 s) outlasts the 10 s timeout. No small
\* record. The chunk is first sent at tick 0 and may be lost on every send:
\* it is resent each time it falls due, ahead of the never-sent chunks.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 20
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    Room        <- RoomOne
    Pending     <- PendingLong
    Small       <- SmallOff
INVARIANTS
    TypeOK
    ConfigAccepted
    AttemptsBeforeTimeout
    ResendGapBounded
    NoDueRecordHeld
    DueMeansWritten
