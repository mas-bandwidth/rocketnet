\* MCRNBankFifoLayoutGsoStop reversed witness: take_send's final branch
\* taken while banks are still ready (the quit test before the ready test).
\* The worker's send side ends with the producer and the ready banks are
\* never sent.  Must fail FinalLast.
SPECIFICATION Spec

CONSTANTS
    N         = 3
    ArrLen    = 3
    ConsMax   = 1
    MaxReady  = 3
    MaxPub    = 8
    FreeSlack = 0
    HeadMod   = 3
    TailMod   = 3
    PushKind  = "fifo"
    PopKind   = "fifo"
    InitKind  = "literal"
    StopKind  = "early"

INVARIANTS
    TypeOK
    FinalLast
