\* MCRNPortableTxFourBanks: the rule with four banks, so the queues wrap at a
\* modulus of four.  The same invariants and liveness properties.
SPECIFICATION SpecFair

CONSTANTS
    NumBanks          = 4
    Cap               = 2
    Batch             = 2
    MaxPackets        = 6
    FullSlack         = 0
    HeadMod           = 4
    TailMod           = 4
    QuitUnderLock     = TRUE
    PublishBeforeQuit = TRUE
    RetryOnIdle       = TRUE
    WakeOnPublish     = TRUE
    Timeout           = FALSE

INVARIANTS
    InBounds
    TypeOK
    ExclusiveOwnership
    FreeBanksEmpty
    ExactSend
    MainLockIsBrief
    QuitAfterFinalBank
    ExitSentAll

PROPERTIES
    EveryAcceptedSent
    StopCompletes
