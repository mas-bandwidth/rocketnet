\* Reversed witness: MCServerConnectionMove.cfg with three attempts and the
\* silent rung for a bound token's replacement removed (BoundReplaceSilent
\* FALSE). One client connects with one token, later leaves a half-open
\* mapping at that address under the other, and comes back with the first.
\* TLC must fail BoundTokenNeverReplaces.
SPECIFICATION Spec

CONSTANTS
    BoundReplaceSilent <- MCBoundReplaceSilent
    NumClients          = 1
    NumAddrs            = 2
    NumTokens           = 2
    MaxSlots            = 1
    MapCap              = 1
    HeldCapacity        = 2
    MaxAttempts         = 3
    MaxNonces           = 1
    MaxMoves            = 1
    SendInterval        = 1
    Timeout             = 0
    HandshakeDeadline   = 0
    Disconnects         = TRUE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "any"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2

PROPERTIES
    BoundTokenNeverReplaces
