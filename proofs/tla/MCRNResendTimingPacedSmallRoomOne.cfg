\* MCRNResendTimingPacedSmall at one packet an update: the recorded limit of
\* NoDueRecordHeld, an expected failure and not a bug. With the small record
\* and the chunk both due and room for one packet, the call writes one of
\* them and the update ends with the other due; the code holds it for the
\* next update in the same way. NoDueRecordHeld, ResendGapBounded and
\* AttemptsBeforeTimeout are claims for a packet per due record in every
\* update. Must fail NoDueRecordHeld.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 20
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    Room        <- RoomOne
    Pending     <- PendingLong
INVARIANTS
    TypeOK
    NoDueRecordHeld
