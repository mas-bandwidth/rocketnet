\* MCRNResendTimingOffQuiet: the reliable timeout off (one tick is 500 ms), the
\* small record alone, a 6 s horizon (12), and the transport's silence timeout
\* at T = 3 ticks in the model: quiet counts the ticks with nothing heard, and an
\* update that begins at T ends the connection. Ends are reachable; every end
\* comes after T ticks of silence, and none later than T.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 12
    MaxBackoff  = 1
    MinAttempts = 4
    TimeoutOn   <- TimeoutOff
    TrackQuiet  <- TrackQuietOn
INVARIANTS
    TypeOK
    NoEndBeforeT
    SilenceEndsAtT
    OffMeansNoStallEnd
    NoDueRecordHeld
    DueMeansWritten
