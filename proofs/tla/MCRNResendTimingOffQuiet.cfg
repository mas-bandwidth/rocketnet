\* MCRNResendTimingOffQuiet: the reliable timeout off (one tick is 500 ms), the
\* small record alone, a 6 s horizon (12), and the ticks since the other side
\* was last heard tracked to 5: nothing ends the connection, so no end comes before a
\* silence timeout T of 3, 4 or 5 ticks.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 12
    MaxBackoff  = 1
    MinAttempts = 4
    TimeoutOn   <- TimeoutOff
    TrackQuiet  <- TrackQuietOn
INVARIANTS
    TypeOK
    NoEndBeforeT
    OffMeansNoStallEnd
