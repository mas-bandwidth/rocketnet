\* Reversed witness: the count before 7c8280b2, every refused answer
\* counted (Mode "everyanswer").  The refusing destination's two runs in
\* the kernel together each count, and the queue turns plain with one
\* refusing destination and none accepted.  Must violate
\* NoFallbackOnFewerDests.
SPECIFICATION Spec

CONSTANTS
    Dests          = {g, b}
    Refusing       = {b}
    KernelSegments = TRUE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "everyanswer"
    Slot           <- SlotDistinct
    Queue          <- QueueOne
    AcceptedRule   = "transport"
    FallbackScope  = "queue"
    InFlight       = 2
    PlainFails     = FALSE

INVARIANTS
    TypeOK
    NoFallbackOnFewerDests
