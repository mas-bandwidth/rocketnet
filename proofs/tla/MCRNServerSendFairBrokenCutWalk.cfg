\* MCRNServerSendFairBrokenCutWalk: two send queues of one frame a flush. A cut in a
\* later round leaves the walk's cursor (the one held before that writer's first
\* visit) instead of the held slot's: the slot held in the first round is passed
\* again and waits behind slots already written this flush. Must fail FairService.
SPECIFICATION Spec

CONSTANTS
    N       = 4
    K       = 1
    Conn    = {0, 1, 2, 3}
    WorkMax = 1
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "rounds"
    Q1      = {1, 3}
    K1      = 1
    QueueRule = "cutwalk"

INVARIANTS
    FairService
