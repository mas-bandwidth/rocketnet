\* MCClientConnectionRetryFromFailure.cfg: FreshAttemptFromFailure holds.
\* A connect from a failure state starts a fresh attempt and carries no key,
\* cookie, client index, replay or timer state of the earlier
\* one. A responsive server of one slot that another client may take, the
\* idle timeout (3) and the total deadline (5) on, and a second connect: the
\* client reaches -1, -2, -3, -4, -5 and -7 and connects again from each
\* (README-ClientConnection.md). The cookie restarts no clock, so -4 needs
\* the deadline past the timeout and -7 needs it inside the timeout of a
\* late challenge: Timeout 2 with Deadline 3 misses -4, with Deadline 4
\* misses -7; Timeout 3 with Deadline 5 reaches both.
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 3
    Deadline         = 5
    ServerDeadline   = 0
    MaxAttempts      = 2
    MaxNonces        = 2
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = TRUE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = FALSE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    SafetyInvariants
PROPERTIES
    FreshAttemptFromFailure
    DisconnectIsTerminal
    TerminalAbsorbing
    StepsForwardOrFails
