\* MCRNIocpEndpoints reversed witness: a post tests stopping before it counts itself pending, as rocketnet_iocp_post_receive did before A01's fix. Endpoint 0's receive is refused into the retry queue; worker 1 takes it and tests stopping false; stop is stored; worker 0, seeing nothing pending, exits; worker 1's post then lands on endpoint 0's socket, whose port has no drainer. ExitedOnlyDrained falls. Must fail.
SPECIFICATION Spec

CONSTANTS
    E               = 2
    R               = 1
    RepostOnOwner   = TRUE
    CancelOwnSocket = TRUE
    CountFirst      = FALSE

INVARIANT ExitedOnlyDrained
