\* The refusal count's control: two slots, three clients, three records of
\* room, the count modulo 3 so a start counted twice is seen. Every rule
\* on; every invariant and property of MCRNConnectionMemory.cfg must hold.
SPECIFICATION Spec

CONSTANTS
    Slots    = {s1, s2}
    Clients  = {c1, c2, c3}
    Capacity = 3
    Reset    = TRUE
    CarryOn  = FALSE
    SendExhausts = FALSE
    TakeBeforeFit = FALSE
    CountExhausted = FALSE
    CountMod = 3

INVARIANTS
    TypeOK
    UsedBounded
    ExhaustedReasonNamed
    ReusedSlotStartsClean

PROPERTIES
    SendNeverEnds
    ExhaustionOnlyLeadsToDisconnect
    RefusalLeavesStateUnchanged
    ConnectStartsFresh
    NoCrossSlotEffect
    ExhaustedEventuallyFree
