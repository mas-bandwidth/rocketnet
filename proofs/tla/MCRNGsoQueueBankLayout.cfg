\* The passing control: the code's rules, two queues of three banks of three
\* slots, two fill threads making two starts each per fill, a caller's pointer
\* off by a byte either way, two flushes (MCRNGsoQueueBankLayoutFlush3.cfg is
\* the same at three, a bench case over the per-case budget).
SPECIFICATION Spec
CONSTANTS
    Q = 2
    NB = 3
    S = 3
    Stride = 4
    Threads = {1, 2}
    Dests = {0, 1}
    Demand = 2
    MaxFlush = 2
    SkewSpan = 1
    ClaimCmp = "ge"
    ClaimRule = "cas"
    SlotRule = "check"
    IdRule = "mul"
    FlushRule = "joined"
INVARIANT TypeOK
INVARIANT OneProducer
INVARIANT InBounds
INVARIANT NoSharedSlot
INVARIANT NoForeignWrite
INVARIANT RouteMatches
INVARIANT NoWorkerWrite
INVARIANT StagedMatches
