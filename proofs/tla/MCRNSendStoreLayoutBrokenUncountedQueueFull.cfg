    N             = 3
    Q             = 4
    GenMod        = 3
    FreshGuard    = TRUE
    LowerCursor   = TRUE
    ChunkSkipZero = TRUE
    DescSkipZero  = TRUE
    KeepFreeSlot  = TRUE
    CountQueueFull = FALSE
    StartOrder    = "fit"
    CountMod      = 3
    RefuseExhausts = FALSE

INVARIANTS
    TypeOK

PROPERTIES
    RefuseLeavesLayout
