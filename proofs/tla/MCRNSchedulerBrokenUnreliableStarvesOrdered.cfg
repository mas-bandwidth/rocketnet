\* Reversed witness: MCRNScheduler.cfg with UnreliableLast = FALSE (the
\* unreliable class is offered first). One unreliable item arrives with every
\* update and the budget is one item, so every update spends it on the
\* unreliable item and no queued reliable item is ever first-written. TLC
\* must fail NoStarvation. ClassOrderBeforePriority is the safety face of the
\* same flaw and is left out, so the failure checked is the liveness one.

SPECIFICATION Spec

CONSTANTS
    NC             = 2
    Msgs           <- MCMsgs
    ULevel         = 0
    W              = 2
    Cap            = 1
    UPerTick       = 1
    MaxLoss        = 1
    ChannelFIFO    = TRUE
    UnreliableLast = FALSE

INVARIANTS
    TypeOK
    FirstWriteInOrderPerChannel
    UnreliableNotBlockedByWindow

PROPERTIES
    NoStarvation
