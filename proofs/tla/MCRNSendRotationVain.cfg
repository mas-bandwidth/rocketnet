\* The passing control of the vain ordered write: two connections, three
\* frames a flush, ordered paths the due test answers due for a walk that
\* finds nothing (an ended connection: rn_ordered_write returns 0), with
\* budget refusals (stalls are left to MCRNSendRotation.cfg, to keep the
\* case inside the budget). Each vain write aborts one frame and ends the
\* reliable path: no abort for a refusal decided before a frame, and at
\* most one per connection per flush.
SPECIFICATION MCSpec

CONSTANTS
    N           = 2
    Cap         = 3
    MaxFlush    = 3
    EnvStall    = FALSE
    EnvShortAck = FALSE
    EnvRefuse   = TRUE
    EnvVain     = TRUE
    KeepDone    = TRUE
    StallGate   = TRUE
    FitsGate    = TRUE
    WriteFirst  = TRUE
    CursorNext  = TRUE
    CutCursor   = TRUE
    VainEnds    = TRUE

INVARIANTS
    TypeOK
    NoRefusalAbort
    AbortsBounded
    UnlistedPassEnded
    SkippedWritesNothing
    CursorAsFullWalk
    VisitsBounded
    ServedWhenCapacity
    BoundedWait
