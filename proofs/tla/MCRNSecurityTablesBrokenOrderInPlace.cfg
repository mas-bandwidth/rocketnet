\* Reversed witness: RewriteMovesToTail <- MCRewriteInPlace, a token's
\* expired claim rewritten where it sits instead of moved to the order
\* list's tail. TLC must fail OrderIsDeadlineOrder: th is claimed at clock
\* 0 (deadline 2), te at clock 1 (deadline 3), and at clock 2 th's expired
\* claim is rewritten at the head with deadline 4, ahead of te's 3.
SPECIFICATION ClaimsSpec

CONSTANTS
    None = None
    Addrs = {"A", "B"}
    Tokens = {"th", "te", "tf"}
    Expire <- MCExpire
    Cid <- MCCid
    MaxClock = 4
    CookieLife = 1
    RotatePeriod = 2
    MaxClients = 2
    HistoryCap = 2
    AdmittedCap = 2
    VerifyBudget = 2
    HandshakeDeadline = 2
    Rotation = TRUE
    AcceptPrevious = TRUE
    RefuseAdmittedAtResponse = TRUE
    RequestChecksExpiry = TRUE
    EvictLiveHistory = TRUE
    DeniedConsumesToken = FALSE
    CapVerifyBudget = TRUE
    PreviousOutlivesWindow = FALSE
    BindAtRequest = FALSE
    Holds <- MCHolds
    ClaimTokens <- MCClaimControlTokens
    HoldUntilExpire = FALSE
    CheckCidAtResponse = TRUE
    RewriteMovesToTail <- MCRewriteInPlace

INVARIANTS
    OrderIsDeadlineOrder

CHECK_DEADLOCK FALSE
