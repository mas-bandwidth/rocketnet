\* MCRNClientIocp passing control with a kernel that never delivers the
\* aborts after Close: destroy gives up its stalled drain and leaks, never
\* frees, and both liveness properties hold through the leak.
SPECIFICATION Spec

CONSTANTS
    Buffers        = 2
    MaxDatagrams   = 2
    FreeWaitsDrain = TRUE
    DrainOnlyReady = TRUE
    KernelStalls   = TRUE
    GiveUp         = TRUE

INVARIANTS
    TypeOK
    NeverCopiedWhilePosted
    FreedOnlyWhenDrained

PROPERTIES
    PostedDrainAfterClose
    CloseEventuallyFrees
