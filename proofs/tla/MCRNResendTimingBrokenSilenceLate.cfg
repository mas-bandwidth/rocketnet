\* MCRNResendTimingBrokenSilenceLate: MCRNResendTimingOffQuiet with the
\* transport ending the connection one update late, at T + 1: a live
\* connection passes T ticks of silence, so SilenceEndsAtT falls.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 12
    MaxBackoff  = 1
    MinAttempts = 4
    TimeoutOn   <- TimeoutOff
    TrackQuiet  <- TrackQuietOn
    SilenceAt   <- SilenceLate
INVARIANT
    SilenceEndsAtT
