\* MCServerConnectionServesBothFamilies.cfg: one server whose config names
\* both families serves both. Client 1 is IPv4-only, client 2 is IPv6-only,
\* and each token names both families. BothFamiliesConnect passes.
SPECIFICATION Spec

CONSTANTS
    NumClients          = 2
    NumAddrs            = 2
    NumTokens           = 2
    MaxSlots            = 2
    MapCap              = 2
    HeldCapacity        = 2
    MaxAttempts         = 1
    MaxNonces           = 2
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 0
    HandshakeDeadline   = 0
    Disconnects         = FALSE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "own"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2
    TokenFamilies       <- MCTokenBothFamilies
    ClientHost          <- MCHostSplit
    ConfiguredFamilies  <- MCConfiguredBoth

INVARIANTS
    SafetyInvariants

PROPERTIES
    BothFamiliesConnect
