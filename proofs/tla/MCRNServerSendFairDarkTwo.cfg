\* MCRNServerSendFairDarkTwo: two dark slots and one healthy slot sharing one frame a
\* flush: the healthy slot keeps its rotation and no unit is charged to an
\* empty frame.
SPECIFICATION Spec

CONSTANTS
    N       = 3
    K       = 1
    Conn    = {0, 1, 2}
    WorkMax = 2
    Dark    = {1, 2}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "rounds"

INVARIANTS
    TypeOK
    FairService
    NoUnitWasted
    OtherClientUnaffected
    DarkTakesOnlyItsProbes
    SameOrder
    OnlyLastWriters
    EndedWritesNothing
    CursorAsFullWalk
    VisitsBounded
