\* MCRNServerSendFairDarkTwo: two dark clients and one healthy client sharing
\* one frame per update: the healthy client keeps its rotation and no unit is
\* charged to an empty frame.
SPECIFICATION Spec

CONSTANTS
    N       = 3
    K       = 1
    Work    = 2
    Dark    = {2, 3}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Mode    = "fair"

INVARIANTS
    TypeOK
    FairService
    NoUnitWasted
    OtherClientUnaffected
    DarkTakesOnlyItsProbes
