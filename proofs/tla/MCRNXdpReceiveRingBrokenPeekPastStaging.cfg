\* MCRNXdpReceiveRing reversed witness: the peek asks for the pending
\* return's room alone, without the staging buffer's room (receive_limit
\* without receive_capacity). The loop reads every peeked descriptor, so a
\* peek into a nearly full staging buffer stages past its end. Must fail
\* StagingInBounds.
SPECIFICATION Spec

CONSTANTS
    F1       = F1
    F2       = F2
    F3       = F3
    Frames   = {F1, F2, F3}
    RingSize = 2
    StageCap = 3
    PendCap  = 3
    FillSize = 6
    PeekStagingRoom <- PeekStagingRoomBroken

INVARIANTS
    TypeOK
    StagingInBounds
