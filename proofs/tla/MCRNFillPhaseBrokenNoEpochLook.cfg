\* MCRNFillPhaseBrokenNoEpochLook: reversed witness: the look reads
\* main_calls only; a call that loaded the epoch before a main operation
\* ended claims with the old stamp and goes in, and a filler of the new
\* phase claims over that stamp unflagged: OneFiller falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Fillers      = {f1, f2}
    Clients      = {c1}
    NoOwner      = none
    MaxMain      = 2
    MaxFills     = 2
    LookFirst    = FALSE
    LoadStore    = FALSE
    ResetOnLeave = TRUE
    StaleClaim   = FALSE
    NoEpochLook  = TRUE

INVARIANTS
    TypeOK
    OneFiller
