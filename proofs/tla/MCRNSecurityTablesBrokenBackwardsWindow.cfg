\* Reversed witness: BackwardsRollover <- MCNoBackwardsRollover (FALSE), the
\* code before 2026-10-24 (rocketnet_signature_verify_budget_decay rolled the
\* window over only when `current_timestamp >= window_start + window`).  A
\* forger spends the budget in a window begun at clock 2; the host clock steps
\* back to 0, and the forger's source is still refused with the clock before
\* the window's start: FloodWindowBounded fails.
SPECIFICATION FloodSpec

CONSTANTS
    None = None
    Addrs = {"A", "B"}
    Tokens = {"th", "te", "tf"}
    Expire <- MCExpire
    Cid <- MCCid
    MaxClock = 4
    CookieLife = 1
    RotatePeriod = 2
    MaxClients = 2
    HistoryCap = 2
    AdmittedCap = 2
    VerifyBudget = 2
    HandshakeDeadline = 4
    Rotation = TRUE
    AcceptPrevious = TRUE
    RefuseAdmittedAtResponse = TRUE
    AdmitExpiredAtResponse = FALSE
    EvictLiveHistory = FALSE
    DeniedConsumesToken = FALSE
    CapVerifyBudget = TRUE
    PreviousOutlivesWindow = FALSE
    BindAtRequest = FALSE
    Holds <- MCHolds
    HoldUntilExpire = FALSE
    CheckCidAtResponse = TRUE
    BackwardsRollover <- MCNoBackwardsRollover

INVARIANTS
    FloodWindowBounded

CHECK_DEADLOCK FALSE
