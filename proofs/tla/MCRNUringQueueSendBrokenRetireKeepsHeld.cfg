\* Reversed witness: WorkerRetire appends the bank to the free queue without
\* clearing worker, so the same bank sits in both free and worker.
\* Must violate BanksPartition.
SPECIFICATION MCSpec
VIEW MCSafetyView

CONSTANTS
    NB         = 3
    S          = 2
    Dests      = {1, 2}
    MaxSeg     = 2
    Demand     = 3
    MaxFlush   = 3
    MaxEagain  = 1
    RetireRule = "dup"
    EagainRule = "retry"
    LockRule   = "try"

INVARIANTS
    TypeOK
    BanksPartition
