\* The walk without either supersede rule, as it was before them: a forget the
\* sink refused, retried after its address was marked for a session in another
\* slot, deletes that session's kernel entry (KernelHoldsMark).
SPECIFICATION MCSpec

CONSTANTS
    s1              = s1
    s2              = s2
    a1              = a1
    a2              = a2
    NONE            = NONE
    Slots           = {s1, s2}
    Addrs           = {a1, a2}
    MaxHigh         = 1
    SkipWhileOwed   = TRUE
    ClearOnAccept   = TRUE
    ForgetRefusable = TRUE
    MarkSupersedes  = FALSE
    ForgetSupersedes = FALSE

INVARIANT KernelHoldsMark
