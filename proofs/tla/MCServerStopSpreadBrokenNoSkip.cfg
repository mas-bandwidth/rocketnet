\* MCServerStopSpread reversed witness: the drain seals the entry at the cursor even when it is already complete. A burst abandoned at an unreachable start, whose destination is then learned again, is sealed past its burst. Must fail SealedWithinBurst.
SPECIFICATION Spec

CONSTANTS
    SlotCount   = 2
    MaxSessions = 4
    Burst       = 3
    BankSize    = 3
    RingSize    = 4
    SteadyCap   = 2
    Defect      = "noskip"

INVARIANT SealedWithinBurst
