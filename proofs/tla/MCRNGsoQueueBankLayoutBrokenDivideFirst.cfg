\* Reversed witness: finish divides the pointer's offset before checking it
\* (SlotRule "divide"), so a pointer a byte early truncates into the slot
\* before. Must violate NoForeignWrite.
SPECIFICATION Spec
CONSTANTS
    Q = 2
    NB = 3
    S = 3
    Stride = 4
    Threads = {1, 2}
    Dests = {0, 1}
    Demand = 2
    MaxFlush = 3
    SkewSpan = 1
    ClaimCmp = "ge"
    ClaimRule = "cas"
    SlotRule = "divide"
    IdRule = "mul"
    FlushRule = "joined"
INVARIANT TypeOK
INVARIANT OneProducer
INVARIANT InBounds
INVARIANT NoSharedSlot
INVARIANT NoForeignWrite
INVARIANT RouteMatches
INVARIANT NoWorkerWrite
INVARIANT StagedMatches
