\* MCRNIocpRefQueue with one consumer and the code's sizing: four cells, at most four operations live, two producers, six operations released, so positions pass a whole round of the cells. This is retry_receives under one completion worker, the count the IOCP server runs on a wildcard bind with no count asked (on a specific bind the default is ROCKETNET_IOCP_DEFAULT_COMPLETION_WORKERS, 2, sdk/rocketnet_network_threads.h, and every worker pops: MCRNIocpRefQueueRefusedTwoConsumers.cfg): the worker is the only pop, so while it stalls between its CAS and its store the positions past it hold at most the other three operations and never reach its cell. No push is ever refused. Must pass.
SPECIFICATION Spec

CONSTANTS
    Cap         = 4
    PosMod      = 32
    InitSlack   = 0
    Producers   = {p1, p2}
    Consumers   = {c1}
    MaxTok      = 6
    Ops         = 4
    DropRefused = FALSE

INVARIANTS
    TypeOK
    NoOverwrite
    NoPhantom
    WithinCapacity
    CellsMatchPositions
    InqIsCells
    RefusedNeverLost
    RefusalOnlyWhilePopStalled
    NeverRefused
