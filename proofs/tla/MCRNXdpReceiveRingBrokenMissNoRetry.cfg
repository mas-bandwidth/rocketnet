\* MCRNXdpReceiveRing reversed witness: a lost swap. After a try-acquire
\* that missed the worker's hold, main skips the queue on every later call
\* instead of retrying, as it did for a queue whose swap request stayed
\* pending with nothing servicing it. The packets the worker stages are
\* never consumed. Must fail StagedEventuallyConsumed. Main stops for good,
\* so the run ends when the arrivals do: the deadlock check is off.
SPECIFICATION Spec

CONSTANTS
    F1         = F1
    F2         = F2
    F3         = F3
    Frames     = {F1, F2, F3}
    RingSize   = 2
    PeekMax    = 2
    StageCap   = 2
    FillSize   = 6
    Budget     = 1
    MaxPackets = 4
    LockBatch  = 1
    MissNoRetry <- MissNoRetryBroken

INVARIANTS
    TypeOK

PROPERTIES
    StagedEventuallyConsumed
