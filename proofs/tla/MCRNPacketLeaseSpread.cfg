\* MCRNPacketLeaseSpread: the code's rule with retired, frames that hash
\* apart (HashSpread = 4: frames 3 and 4 hash to entries 2 and 3), so a
\* probe from entry 3 wraps to entry 0, and the ticket counter exhausted
\* after three tickets (TicketLimit = 3), so a fourth insert gets ticket 0
\* and is refused. Every invariant.
SPECIFICATION Spec

CONSTANTS
    Capacity          = 4
    Threads           = {1, 2}
    Frames            = {3, 4}
    Vals              = {1, 2}
    HashSpread        = 4
    MaxOps1           = 3
    MaxOps2           = 1
    MaxResets         = 2
    EpochLimit        = 2
    TicketLimit       = 3
    ZeroRefused       = TRUE
    UsedLimit         = 2
    UseCas            = TRUE
    ConsumeCas        = TRUE
    BumpEpoch         = TRUE
    EpochLimited      = TRUE
    RetiredOn         = TRUE
    RetiredValidates  = TRUE
    OnWriting         = {"skip"}
    ValidCallers      = FALSE
    AtomicFields      = TRUE

INVARIANTS
    TypeOK
    NoWrongSuccess
    TakeOnce
    NoRacyRead
    InsertFindsSlot
    TicketsUnique
    PublishedIntact
    ChainIntact
    ProbeBound
