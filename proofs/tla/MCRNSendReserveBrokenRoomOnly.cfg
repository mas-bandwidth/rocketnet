\* MCRNSendReserveBrokenRoomOnly: the budget is the whole room, so the game's packets take the frames the protocol needs (ReserveKept).
SPECIFICATION Spec

CONSTANTS
    Fillers   = {f1, f2}
    Reserve   = 2
    MaxFree   = 4
    MaxOwn    = 1
    MaxClaims = 2
    MaxRetire = 2
    MaxPhases = 2
    Chunk     = 1
    GuardWidth = 2
    SharedLine = FALSE
    RoomOnly      = TRUE
    SplitClaim    = FALSE
    RoomFirst     = FALSE
    OwnCountFirst = FALSE
    NoRefresh     = FALSE
    NoReread      = FALSE
    IndexTest     = FALSE
    NoFallback    = FALSE
    BatchCount    = FALSE
    NoTailReturn  = FALSE
    NoRetry       = FALSE
    NamePlain     = FALSE

INVARIANTS
    ReserveKept
