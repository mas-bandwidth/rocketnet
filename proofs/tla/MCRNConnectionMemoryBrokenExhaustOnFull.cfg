\* Reversed witness: MCRNConnectionMemory.cfg with SendExhausts = TRUE (a send
\* that finds no room exhausts the region, as rn_region_send_refuse did in
\* v1.0, and the owner kicks the connection). TLC must fail SendNeverEnds,
\* an action property, at the refusing start step.
SPECIFICATION Spec

CONSTANTS
    Slots    = {s1, s2, s3}
    Clients  = {c1, c2, c3, c4}
    Capacity = 3
    Reset    = TRUE
    CarryOn  = FALSE
    SendExhausts = TRUE
    TakeBeforeFit = FALSE
    CountMod = 1

INVARIANTS
    TypeOK

PROPERTIES
    SendNeverEnds
