\* Reversed witness: ReplaceNeedsUnboundToken <- MCReplaceIgnoresBinding
\* (FALSE), the used rung checking a replacing request only against its own
\* address's binding.  A binds t1 by a response that is then denied, so its
\* mapping stays half-open; A replaces it with t2; A's next request, for t1,
\* bound to A, passes the used rung and replaces A's mapping for t2.  A
\* replay of a token that already connected has displaced a handshake in
\* flight, so ReplaceOnlyUnboundToken must fail with TLC's counterexample.
SPECIFICATION MCSpec

CONSTANTS
    PosRestart   = 1
    PosVersion   = 2
    PosTimestamps = 3
    PosCompares  = 4
    PosCookie    = 5
    PosUsed      = 6
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 10
    PosKeypair   = 11
    ReplaceNeedsUnboundToken <- MCReplaceIgnoresBinding

INVARIANTS
    TypeOK
    BoundTypeOK
    ReplaceOnlyUnboundToken
