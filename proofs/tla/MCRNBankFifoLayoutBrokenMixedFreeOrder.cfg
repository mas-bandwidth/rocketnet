\* MCRNBankFifoLayout reversed witness: the free queue pushed as a stack
\* (free[free_count++]) and popped as a FIFO (free[free_head++]).  A push
\* lands on a live free position.  Must fail ExactlyOnePlace.
SPECIFICATION Spec

CONSTANTS
    N         = 3
    ArrLen    = 3
    ConsMax   = 1
    MaxReady  = 3
    MaxPub    = 8
    FreeSlack = 0
    HeadMod   = 3
    TailMod   = 3
    PushKind  = "lifo"
    PopKind   = "fifo"
    InitKind  = "literal"

INVARIANTS
    TypeOK
    ExactlyOnePlace
