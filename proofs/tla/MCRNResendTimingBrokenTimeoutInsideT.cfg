\* MCRNResendTimingBrokenTimeoutInsideT: MCRNResendTimingOffQuiet with the code
\* before v1.1.0, the reliable timeout timed from the first send whatever the
\* configuration (here 6 s). It must fail NoEndBeforeT: the timeout ends a
\* connection whose peer was heard inside T - 1.
SPECIFICATION Spec
CONSTANTS
    RtoInitial     = 4
    RtoMin         = 1
    RtoMax         = 4
    Timeout        = 12
    MaxBackoff     = 1
    MinAttempts    = 4
    TimeoutOn      <- TimeoutOff
    TrackQuiet     <- TrackQuietOn
    TimeoutWhenOff <- TimeoutWhenOffOn
INVARIANT
    NoEndBeforeT
