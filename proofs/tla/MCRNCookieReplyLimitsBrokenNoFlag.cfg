\* The reply sets its bit but not the dirty flag: the update skips the clear and a stale bit refuses a source no reply of the next update explains.
SPECIFICATION MCSpec

CONSTANTS
    Sources      = {1, 2, 3}
    Bound        = 2
    Factor       = 2
    WordBits     = 2
    HashRange    = 8
    VerifyBudget = 1
    Broken       = "noflag"

INVARIANT RefusalHasCause
