\* MCRNPortableTx reversed witness: the tail position wraps at banks - 1, not
\* banks.  The first bank the worker returns lands in the wrong array position
\* and the queue reads a stale entry.  Must fail ExclusiveOwnership.
SPECIFICATION Spec

CONSTANTS
    NumBanks          = 3
    Cap               = 2
    Batch             = 2
    MaxPackets        = 6
    FullSlack         = 0
    HeadMod           = 3
    TailMod           = 2
    QuitUnderLock     = TRUE
    PublishBeforeQuit = TRUE
    PublishUntilSent  = TRUE
    RetryOnIdle       = TRUE
    WakeOnPublish     = TRUE
    Timeout           = FALSE

INVARIANTS
    InBounds
    TypeOK
    ExclusiveOwnership
