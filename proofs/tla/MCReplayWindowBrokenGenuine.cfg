\* Genuine-acceptance mutation: the long-skip branch leaves two words
\* uncleared, so a stale bit refuses a genuine sequence; must violate
\* GenuineIsAccepted.  The same fault is MCReplayWindowBrokenLongSkip.cfg's.
SPECIFICATION MCSpec

CONSTANTS
    Words             = 6
    WordBits          = 2
    ClearedWords      = 4
    MaxSeq            = 36
    GateBeforeAdvance = TRUE
    GateBeforeOpen    = TRUE
    MarkOnAdvance     = TRUE
    RefuseBelowFloor  = TRUE

INVARIANT GenuineIsAccepted
