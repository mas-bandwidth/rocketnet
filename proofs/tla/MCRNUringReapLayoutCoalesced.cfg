\* The passing control with coalesced receives: two datagrams per receive
\* and a bank of three, so a bank holding one receive has no room for the
\* next (the code's num_packets + MAX_SEGMENTS <= BANK_SIZE); every
\* invariant and the action property.
SPECIFICATION MCSpec

CONSTANTS
    CqCap     = 4
    HeldCap   = 3
    Buffers   = 3
    Room      = 3
    Seg       = 2
    Budget    = 3
    MaxRecv   = 6
    MaxSends  = 2
    HoldRule  = TRUE
    HeldMod   = TRUE

INVARIANTS
    TypeOK
    HeldMatches
    InOrder
    BankWithinRoom

PROPERTIES
    SendsNotBehindRoom
