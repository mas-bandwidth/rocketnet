\* The re-try under heavy loss (LossBound = FALSE): bursts of large packets may meet any number of pairs whose small probes come back, so a size the path carries is ruled out (NoWrongRuleOut is not claimed), and the re-try reaches it once the loss ends (RetryReaches, in MCRNPathProbeHeavyLossRetry.cfg); three candidates on both lists, a path of capacity 2 up and 3 down (MCRNPathProbeHeavyLossUp3.cfg has capacity 3 up; WaitEnds and RetryReaches at this instance are MCRNPathProbeHeavyLossRetry.cfg, split off on 2026-11-26 when this case reached 71.7 s, over 60% of the case budget), two loss bursts, one attacker send; every other safety property and the liveness properties under fairness. ReachesBest is not claimed: a burst may also fail P0's own check, -14, as before the re-try.
SPECIFICATION FairSpec

CONSTANTS
    ClientSet     = {3, 2, 1}
    ServerList    = {3, 2, 1}
    CapsUp        = {2}
    CapsDown      = {3}
    K             = 2
    MaxBursts     = 2
    AttackBudget  = 1
    AttackKinds   = {"replay", "probe", "reply"}
    Forger        = FALSE
    Timed         = TRUE
    LossBound     = FALSE
    MaxReuses     = 0
    ReuseCapsUp   = {}
    ReuseCapsDown = {}
    Broken        = "none"

INVARIANTS
    TypeOK
    RaisedWithinPath
    ServerNeverAhead
    FailOnlyAtP0
    NeverAtRuledOut
    NeverAboveRuled
    RuledIsTheNextStep
    ReplyOnlyConnected
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate

PROPERTIES
    PNeverDecreases
    StrikeNeedsSmall
    ServerRaisesOnConfirm
    ClientRaisesOnAuthLarge
    NoProbeAfterDone
    NoSkippedStep
    Converges
