\* MCRNOpenAddress, the clear-last erase (client slots, the held index, the
\* sent index): four keys in five cells, at most N - 1 live, as twice-capacity
\* sizing guarantees. The reversed witness MCRNOpenAddressBrokenClearLastFull.cfg
\* is this file with MaxLive = N.
SPECIFICATION Spec

CONSTANTS
    Keys       = {1, 2, 3, 4}
    N          = 5
    NoWrapTest = FALSE
    ClearLast  = TRUE
    MaxLive    = 4

INVARIANTS
    TypeOK
    Findable
    Unique
    EraseEnds
