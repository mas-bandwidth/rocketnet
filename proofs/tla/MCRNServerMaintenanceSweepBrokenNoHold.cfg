\* A held slot passed over as a served one: a slot of queue 1 whose single frame the slot before it takes is held, the cursor moves past it, and the next update starts where this one did, so that slot is passed over in every update; BoundedWait must fail.
SPECIFICATION Spec
CONSTANTS
    N               = 4
    MaxRoom         = 2
    QueueCount      = 2
    MayJam          = {0}
    Unreachable     = {}
    Refused         = {}
    SkipUnreachable = TRUE
    SkipRefused     = TRUE
    QueueRule       = "nohold"
INVARIANTS
    TypeOK
    BoundedWait
