\* Every strike counts, spaced or not: one burst of large-only loss shorter than a spacing collects K strikes and rules out a size the path carries.
SPECIFICATION Spec

CONSTANTS
    ClientSet     = {2, 1}
    ServerList    = {2, 1}
    CapsUp        = {2}
    CapsDown      = {2}
    K             = 2
    MaxBursts     = 1
    BurstSpacings = 0
    AttackBudget  = 0
    Forger        = FALSE
    Timed         = TRUE
    Broken        = "unspacedstrike"

INVARIANT NoWrongRuleOut
