\* MCRNGsoRecvFill reach witness, the code's rule: a three-segment run read into a buffer with room for one two-segment message loses a segment, which the code counts in RECEIVE_DROPPED_OVERFLOW. NoOverflow falls. Must fail.
SPECIFICATION Spec

CONSTANTS
    Cap         = 4
    Seg         = 2
    MaxRun      = 3
    Batch       = 2
    MaxArrive   = 5
    SockCap     = 3
    VlenRule    = "room"

INVARIANTS
    TypeOK
    NoOverflow
