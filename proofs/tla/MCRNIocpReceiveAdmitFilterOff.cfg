\* MCRNIocpReceiveAdmit before the filter is published: every datagram meets only the capacity check and main filters it. The bounds and the counts hold; garbage may take slots, which is why the filter is published at create. Must pass.
SPECIFICATION Spec

CONSTANTS
    Capacity      = 3
    MaxArrivals   = 7
    FilterOn      = FALSE
    BankFirst     = FALSE
    UncountedFull = FALSE
    CheckPastEnd  = FALSE

INVARIANTS
    TypeOK
    InBounds
    Accounted
    EveryDropCounted
