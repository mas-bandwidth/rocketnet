\* MCSessionAcksTimingLive.cfg: OpenedSurfacesOrLaps with the accept deferred
\* to the message layer step (AckTiming): a payload is named by a block only
\* once accepted, and it still surfaces or laps. MCSessionAcksLiveSmall.cfg
\* constants.
SPECIFICATION Spec

CONSTANTS
    MaxSeq      = 2
    SentRing    = 4
    BatchCap    = 1
    Window      = 4
    MaxRanges   = 2
    DrainCap    = 4
    Burns       = TRUE
    Witness     = "none"
    D2RPattern  = "arbitrary"
    R2DPattern  = "arbitrary"
    Capacity    = 1
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = FALSE
    BurstStart  = 3
    BurstLen    = 2
    AckTiming   <- MCAckTiming

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked
    RepeatExact

PROPERTIES
    OpenedSurfacesOrLaps
