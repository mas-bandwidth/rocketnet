\* Reachability under the wrap: with GenMax = 2 one descriptor writes two
\* numbers at the same generation (NoGenerationReuse violated), so
\* MCRNResendGenerationsWrap.cfg is not vacuous about the wrap.
SPECIFICATION MCSpec

CONSTANTS
    W                 = 4
    N                 = 6
    D                 = 2
    GenMax            = 2
    CheckNumber       = TRUE
    WindowSlack       = 0

CHECK_DEADLOCK FALSE

INVARIANT NoGenerationReuse
