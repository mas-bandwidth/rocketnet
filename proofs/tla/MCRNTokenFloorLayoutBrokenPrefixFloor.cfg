\* A scan that breaks at an expired slot still raises the floor to the
\* minimum of the slots it read: the floor rises without a full scan.
SPECIFICATION MCSpec

CONSTANTS
    Cap     = 3
    Tokens  = {1, 2, 3, 4}
    MaxTime = 4
    Life    = 3
    Broken  = "prefixfloor"

INVARIANT NoLiveEvictionWhileExpired
