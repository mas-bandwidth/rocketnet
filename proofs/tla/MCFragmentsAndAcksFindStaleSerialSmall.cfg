\* MCFragmentsAndAcksFindStaleSerialSmall: find-stale-serial-small. The standard's
\* serial comparison on the stale-small instance; passes (README-FragmentsAndAcks.md).
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq       = 6
    SentRing     = 4
    AggRing      = 2
    BatchCap     = 1
    Window       = 4
    MaxRanges    = 2
    Slots        = 1
    IdSpace      = 8
    FirstId      = 1
    StaleAhead   = 1
    StaleRule    = "serial"
    MaxGen       = 3
    MaxCount     = 3
    Counts       = {2}
    Stride       = 2
    FinalBytes   = 1
    MaxPayload   = 5
    MaxFragment  = 3
    DrainCap     = 4
    DeliveredCap = 2
    DefectIds    = {}
    Burns        = TRUE
    Witness      = "none"
    D2RPattern   = "arbitrary"
    R2DPattern   = "arbitrary"
    Capacity     = 2
    MaxDelay     = 0
    Duplication  = FALSE
    Reordering   = FALSE
    BurstStart   = 3
    BurstLen     = 2

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    DeliveredExact
    DeliveredOnce
    CompleteDelivers
    ArenaBounded
    StaleOnlyIfOlder
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked
