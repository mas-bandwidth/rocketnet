\* MCReplayWindow: the committed run, the rule. README-ReplayWindow.md
\* gives the reversed witnesses as one-line edits to the CONSTANTS below:
\* ClearedWords = 4 (the defective long skip, MCReplayWindowBrokenLongSkip.cfg)
\* and GateBeforeAdvance = FALSE with GateBeforeOpen = FALSE (the
\* open-advance-then-check witness, MCReplayWindowBrokenGate.cfg), each of
\* which TLC must reject.
SPECIFICATION MCSpec

CONSTANTS
    Words             = 6
    WordBits          = 2
    ClearedWords      = 6
    MaxSeq            = 36
    GateBeforeAdvance = TRUE
    GateBeforeOpen    = TRUE
    MarkOnAdvance     = TRUE
    RefuseBelowFloor  = TRUE

INVARIANTS
    TypeOK
    WindowIsTruth
    GenuineIsAccepted
    AckReportsOnlyReceived
    ReceivedIsRefused
    BelowFloorIsRefused
    HighestIsReceived
    NoAdvanceBeforeConnect
    AckReportsOnlyProcessed
    NoOpenBeforeConnect

PROPERTIES
    Monotone
