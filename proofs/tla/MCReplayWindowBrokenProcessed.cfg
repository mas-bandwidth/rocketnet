\* Processed-ack mutation: the open and the advance run before the slot
\* check, so the ack block names a packet nothing processed; must violate
\* AckReportsOnlyProcessed.  The same order is
\* MCReplayWindowBrokenGate.cfg's.
SPECIFICATION MCSpec

CONSTANTS
    Words             = 6
    WordBits          = 2
    ClearedWords      = 6
    MaxSeq            = 36
    GateBeforeAdvance = FALSE
    GateBeforeOpen    = FALSE
    MarkOnAdvance     = TRUE
    RefuseBelowFloor  = TRUE

INVARIANT AckReportsOnlyProcessed
