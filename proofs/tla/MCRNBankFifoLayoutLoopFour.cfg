\* MCRNBankFifoLayoutLoopFour: four banks, the free FIFO filled by the loop,
\* one bank at the consumer: rocketnet_xdp_buffer_exchange_t
\* (sdk/rocketnet_server_socket_linux.cpp) and rocketnet_buffer_handoff_t
\* (sdk/rocketnet_buffer_handoff.h) at N = 4 with no max_ready limit.
SPECIFICATION Spec

CONSTANTS
    N         = 4
    ArrLen    = 4
    ConsMax   = 1
    MaxReady  = 4
    MaxPub    = 10
    FreeSlack = 0
    HeadMod   = 4
    TailMod   = 4
    PushKind  = "fifo"
    PopKind   = "fifo"
    InitKind  = "loop"

INVARIANTS
    TypeOK
    InBounds
    CountsInRange
    ExactlyOnePlace
    ReadyMatches
