\* MCRNPacketLeaseRelet: a frame whose lease was consumed is leased again in
\* the same epoch.  One frame, so every insert names the same frame: insert,
\* take (which is also finish and abort in the code), then insert again is
\* the only way to spend three operations.  TLC must violate NoRelet, and
\* that state is reached only with ChainIntact, TakeOnce and
\* NoWrongSuccess holding at every state before it, so a violation of one
\* of those on a re-leased frame is reported instead.  A run that completes
\* without a violation would mean a consumed frame is never re-leased
\* under these constants.
SPECIFICATION Spec

CONSTANTS
    Capacity          = 4
    Threads           = {1, 2}
    Frames            = {1}
    Vals              = {1}
    HashSpread        = 1
    MaxOps1           = 3
    MaxOps2           = 1
    MaxResets         = 1
    EpochLimit        = 2
    UsedLimit         = 2
    UseCas            = TRUE
    ConsumeCas        = TRUE
    BumpEpoch         = TRUE
    EpochLimited      = TRUE
    RetiredOn         = FALSE
    RetiredValidates  = FALSE
    OnWriting         = {"skip"}
    ValidCallers      = FALSE
    AtomicFields      = TRUE

INVARIANTS
    TypeOK
    NoWrongSuccess
    TakeOnce
    NoRacyRead
    InsertFindsSlot
    PublishedIntact
    ChainIntact
    ProbeBound
    NoRelet
