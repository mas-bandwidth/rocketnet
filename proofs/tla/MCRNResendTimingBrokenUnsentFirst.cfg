\* MCRNResendTimingPaced reversed witness: the walk before the fix, each
\* class walked from its head with its never-sent numbers first. Every call's
\* one packet is planned for a never-sent chunk of the block, so the chunk,
\* lost at tick 0 and due from its delay on, is not resent before the block's
\* first pass ends at tick 42, and at its timeout (tick 20) it has been sent
\* once. Must fail AttemptsBeforeTimeout.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 20
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    Room        <- RoomOne
    Pending     <- PendingLong
    Small       <- SmallOff
    UnsentFirst <- UnsentFirstOn
INVARIANTS
    TypeOK
    AttemptsBeforeTimeout
