\* MCRNSendReserveBrokenNoTailReturn: a frame the transport refuses takes its line's tail and gives back its own claim only, so the tail's claims stay with no frame for them and a later claim is refused with room past every hold (NeverStarved).
SPECIFICATION Spec

CONSTANTS
    Fillers   = {f1, f2}
    Reserve   = 2
    MaxFree   = 4
    MaxOwn    = 1
    MaxClaims = 2
    MaxRetire = 2
    MaxPhases = 2
    Chunk     = 2
    GuardWidth = 0
    SharedLine = FALSE
    RoomOnly      = FALSE
    SplitClaim    = FALSE
    RoomFirst     = FALSE
    OwnCountFirst = FALSE
    NoRefresh     = FALSE
    NoReread      = FALSE
    IndexTest     = FALSE
    NoFallback    = FALSE
    BatchCount    = FALSE
    NoTailReturn  = TRUE
    NoRetry       = FALSE
    NamePlain     = FALSE

INVARIANTS
    NeverStarved
