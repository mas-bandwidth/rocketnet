\* the class bit never cleared: unlink leaves it and insert_after ORs the new
\* class in, so a slot that changed class unlinks from the other sequence
\* (ListsMatch).
SPECIFICATION MCSpec

CONSTANTS
    W                 = 4
    SelfTailFix       = TRUE
    TailOnEnd         = TRUE
    UnlinkClearsClass = FALSE
    InsertSetsClass   = FALSE
    MarkOnUnlink      = TRUE
    MarkOnPushTail    = TRUE
    MarkInitNone      = TRUE

INVARIANT ListsMatch
