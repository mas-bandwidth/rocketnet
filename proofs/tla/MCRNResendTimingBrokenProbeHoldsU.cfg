\* MCRNResendTimingBrokenProbeHoldsU: MCRNResendTimingOffLive with a probe that
\* holds U too, so a stalled path is never probed. It must fail
\* EveryReliableAcked: the sends of the bad interval are lost and nothing is sent
\* after it.
SPECIFICATION LiveSpec
CONSTANTS
    RtoInitial  = 2
    RtoMin      = 1
    RtoMax      = 2
    Timeout     = 8
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    TimeoutOn   <- TimeoutOff
    GoodFrom    <- GoodFromMid
    ProbeMode   <- ProbeHoldsU
PROPERTY
    EveryReliableAcked
