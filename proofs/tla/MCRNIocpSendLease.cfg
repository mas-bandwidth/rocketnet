    NumOps        = 2
    Callers       = {t1, t2}
    Workers       = {w1}
    GenMax        = 2
    MaxLeases     = 8
    GenWrap       = FALSE
    RetireRefused = FALSE

INVARIANTS
    TypeOK
    StaleNeverNamesLease
    CellsMatchPositions
    QueueRefsCurrent
    OneOwner
    PacketIdsDecode
    RetiredOnlyAtGenMax
    RefusalOnlyWhilePopStalled
