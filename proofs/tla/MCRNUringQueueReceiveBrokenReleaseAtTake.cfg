\* Reversed witness: a drain releases the slots it takes as it takes them
\* (head := the new exposed end), so the worker writes a slot main is still
\* reading: the bank handed to main while still being written.  Must violate
\* NoTornRead.
SPECIFICATION MCSpec

CONSTANTS
    S           = 2
    B           = 2
    SockCap     = 1
    MaxArrive   = 4
    DrainMax    = 2
    FullRule    = "lt"
    PublishRule = "after"
    ReleaseRule = "take"
    FullCount   = "count"
    RearmRule   = "clear"

INVARIANTS
    TypeOK
    NoTornRead
