\* MCRNSchedulerKeepsSending: a channel that keeps sending. CONFIG at the head
\* of channel 0, two MEDIUM messages on channel 0 queued again whenever acked
\* (Refill), one MEDIUM message on channel 1. A window of 1, so the turns
\* decide which channel gets each number; a budget of 1 item per update, one
\* unreliable item per update and 1 transport loss. Every guarding rule on:
\* channel 1's message is numbered and first-written although channel 0
\* always has a message queued. The passing control of
\* MCRNSchedulerBrokenReadyKeepsTurn.cfg. FirstWriteInOrderPerChannel is
\* checked on the finite scenarios only (under Refill an ordering repeats).

SPECIFICATION Spec

CONSTANTS
    NC             = 2
    Msgs           <- MCMsgsKeepsSending
    Refill         <- MCRefill
    ULevel         = 2
    W              = 1
    Cap            = 1
    UPerTick       = 1
    MaxLoss        = 1
    ChannelFIFO    = TRUE
    RtxSendOrder   = TRUE
    UnreliableLast = TRUE
    StallEndsPass  = FALSE
    ReadyRotate    = TRUE

INVARIANTS
    TypeOK
    ReadyIsQueued
    UnreliableNotBlockedByWindow
    ClassOrderBeforePriority
    RtxHeadBoost

PROPERTIES
    NoStarvation
