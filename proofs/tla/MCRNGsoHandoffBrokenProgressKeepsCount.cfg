\* MCRNGsoHandoff reversed witness: after shutdown an attempt that sent part of the held bank leaves the retry count where it was instead of zeroing it (the reset in rocketnet_server_gso_send_step deleted, its return kept), so attempts that sent nothing on either side of it add up and the tail is dropped with fewer than RetryBound + 1 in a row. TailDroppedOnlyWhenStalled falls. Must fail.
SPECIFICATION SpecFair

CONSTANTS
    RxCap              = 2
    TxCap              = 2
    MaxRx              = 1
    MaxTx              = 2
    PublishWhileHeld   = FALSE
    MainBlocks         = FALSE
    FullDrops          = FALSE
    CarryBehind        = FALSE
    ProgressKeepsCount <- ProgressKeepsCountBroken

INVARIANTS
    TailDroppedOnlyWhenStalled
