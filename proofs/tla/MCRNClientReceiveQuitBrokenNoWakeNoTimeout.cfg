\* MCRNClientReceiveQuit reversed witness: a wait with no timeout and no
\* wake (stop makes no wake on linux, and the wait never times out).  A
\* thread that entered its wait before stop never returns from it, so
\* the join never returns: DestroyCompletes falls.  Must fail.
SPECIFICATION SpecFair

CONSTANTS
    Platform       = "linux"
    WaitTimeout    = "none"
    WakeBeforeQuit = FALSE
    NoWake         = TRUE

INVARIANTS
    TypeOK
    WokenSeesQuit

PROPERTIES
    DestroyCompletes
