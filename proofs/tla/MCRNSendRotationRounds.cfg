\* The passing control of the writer list: three connections, four frames
\* a flush, so later rounds visit only the connections that wrote, from
\* every start of work and budget refusal; one flush.
SPECIFICATION MCSpec

CONSTANTS
    N           = 3
    Cap         = 4
    MaxFlush    = 1
    EnvStall    = FALSE
    EnvShortAck = FALSE
    EnvRefuse   = TRUE
    EnvVain     = FALSE
    KeepDone    = TRUE
    StallGate   = TRUE
    FitsGate    = TRUE
    WriteFirst  = TRUE
    CursorNext  = TRUE
    CutCursor   = TRUE
    VainEnds    = TRUE

INVARIANTS
    TypeOK
    NoRefusalAbort
    AbortsBounded
    UnlistedPassEnded
    SkippedWritesNothing
    CursorAsFullWalk
    VisitsBounded
    ServedWhenCapacity
    BoundedWait
