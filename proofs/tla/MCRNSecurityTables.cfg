\* MCRNSecurityTables: the code's run.  Every switch in the code's
\* position; README-RNSecurityTables.md lists each reversed witness as
\* committed variants of this file.
SPECIFICATION Spec

CONSTANTS
    None = None
    Addrs = {"A", "B"}
    Tokens = {"th", "te", "tf"}
    Expire <- MCExpire
    Cid <- MCCid
    MaxClock = 4
    CookieLife = 1
    RotatePeriod = 2
    MaxClients = 2
    HistoryCap = 2
    AdmittedCap = 2
    VerifyBudget = 2
    HandshakeDeadline = 4
    Rotation = TRUE
    AcceptPrevious = TRUE
    RefuseAdmittedAtResponse = TRUE
    RequestChecksExpiry = TRUE
    EvictLiveHistory = TRUE
    DeniedConsumesToken = FALSE
    CapVerifyBudget = TRUE
    PreviousOutlivesWindow = FALSE
    BindAtRequest = FALSE
    Holds <- MCHolds
    HoldUntilExpire = FALSE
    CheckCidAtResponse = TRUE

INVARIANTS
    SafetyInvariants

PROPERTIES
    DeniedTokenStaysUsable
    RotationWindow
    PreviousBoundedToOnePeriod
    InFlightCookieSurvivesRotation

CHECK_DEADLOCK FALSE
