\* The cursor set to the connection just served, not the next: under one
\* frame a flush the same connection is served every time (BoundedWait).
SPECIFICATION MCSpec

CONSTANTS
    N           = 3
    Cap         = 1
    MaxFlush    = 5
    EnvStall    = FALSE
    EnvShortAck = FALSE
    EnvRefuse   = FALSE
    EnvVain     = FALSE
    KeepDone    = TRUE
    StallGate   = TRUE
    FitsGate    = TRUE
    WriteFirst  = TRUE
    CursorNext  = FALSE
    CutCursor   = TRUE
    VainEnds    = TRUE

INVARIANT BoundedWait
