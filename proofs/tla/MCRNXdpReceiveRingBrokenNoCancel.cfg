\* MCRNXdpReceiveRing reversed witness: the pass releases the descriptors it
\* took and never cancels the rest. Must fail FrameConservation: the next
\* release hands the kernel a descriptor that was never read, and its frame
\* is held twice or by no one. ConsumerNotBehind restates the cancel rule
\* and is broken at the first short pass, before any frame is lost; it is
\* left out so the run reaches the harm.
SPECIFICATION Spec

CONSTANTS
    F1       = F1
    F2       = F2
    F3       = F3
    Frames   = {F1, F2, F3}
    RingSize = 2
    PeekMax  = 2
    StageCap = 1
    FillSize = 6
    CancelUnconsumed <- CancelUnconsumedBroken

INVARIANTS
    TypeOK
    FrameConservation
