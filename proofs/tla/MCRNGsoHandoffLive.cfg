\* MCRNGsoHandoff liveness: every rule on, StopCompletes and ShutdownCompletes under the fairness of SpecFair, with every invariant. Must pass. One datagram and two staged packets (three until the hard-error drop, with which three took 81 s): the transmit side's shutdown, retry bound, full socket and a hard-error drop are what the properties are about, and the fairness check of the full-size instance does not fit the run budget.
SPECIFICATION SpecFair

CONSTANTS
    RxCap            = 2
    TxCap            = 2
    MaxRx            = 1
    MaxTx            = 2
    PublishWhileHeld = FALSE
    MainBlocks       = FALSE
    FullDrops        = FALSE
    CarryBehind      = FALSE

INVARIANTS
    TypeOK
    RxOneOwner
    TxOneOwner
    TxQueuesDistinct
    NoPublishWhileHeld
    RxBacksOff
    FreeIsEmpty
    SentOrHeld
    RxAccounted
    RxInOrder
    TxInOrder
    MainNeverWaits
    StopJoinsBeforeFree
    ExitSentAll
    FullSocketDropsOnlyAfterShutdown
    RefusalsBounded

PROPERTIES
    StopCompletes
    ShutdownCompletes
