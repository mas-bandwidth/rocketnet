\* MCRNGsoHandoff liveness: every rule on, StopCompletes and ShutdownCompletes under the fairness of SpecFair, with every invariant. Must pass. One datagram and three staged packets: the transmit side's shutdown, retry bound and full socket are what the properties are about, and the fairness check of the full-size instance does not fit the run budget.
SPECIFICATION SpecFair

CONSTANTS
    RxCap            = 2
    TxCap            = 2
    MaxRx            = 1
    MaxTx            = 3
    PublishWhileHeld = FALSE
    MainBlocks       = FALSE
    FullDrops        = FALSE
    CarryBehind      = FALSE

INVARIANTS
    TypeOK
    RxOneOwner
    TxOneOwner
    TxQueuesDistinct
    NoPublishWhileHeld
    RxBacksOff
    FreeIsEmpty
    SentOrHeld
    RxInOrder
    TxInOrder
    MainNeverWaits
    StopJoinsBeforeFree
    ExitSentAll
    FullSocketDropsOnlyAfterShutdown
    RefusalsBounded

PROPERTIES
    StopCompletes
    ShutdownCompletes
