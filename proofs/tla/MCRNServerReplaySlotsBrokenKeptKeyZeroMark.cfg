\* The XDP sink's zero-mark rule with 7307f183e's exception: a zero mark
\* that replaces a kept mark of its key in place is taken although the
\* forget array is full. A skipped slot's zero mark is taken while its
\* forget is refused, the slot moves again with that skip forget refused
\* too, and its Blocked session, unmarked and not held, is greeted with no
\* kernel entry (GreetedSlotHasEntry).
SPECIFICATION MCSpec

CONSTANTS
    s1              = s1
    s2              = s2
    a1              = a1
    a2              = a2
    a3              = a3
    NONE            = NONE
    Slots           = {s1, s2}
    Addrs           = {a1, a2, a3}
    MaxHigh         = 0
    SkipWhileOwed   = TRUE
    ClearOnAccept   = TRUE
    ForgetRefusable = TRUE
    MarkSupersedes  = TRUE
    ForgetSupersedes = TRUE
    OweOnRefusal    = TRUE
    ScanWhenOwedOnly = TRUE
    ZeroMarkWaitsForForgets <- MCZeroMarkWaits
    KeptKeyZeroMarkWaits <- MCKeptKeyZeroMarkBroken

INVARIANT GreetedSlotHasEntry
