\* Reversed witness: the learn before, taking the first slot of its window
\* that is not LIVE, so another address's answered entry goes while a
\* never-used slot is free further on (EvictOnlyOldest).
SPECIFICATION MCSpec
VIEW View

CONSTANTS
    a1                = a1
    a2                = a2
    a3                = a3
    m1                = m1
    m2                = m2
    NOADDR            = NOADDR
    Addrs             = {a1, a2, a3}
    Macs              = {m1, m2}
    N                 = 4
    P                 = 2
    SkipOtherEntries  = TRUE
    EvictOldest       = TRUE
    InsertWindowExact = TRUE
    LearnTakesEmptyFirst = FALSE

INVARIANT EvictOnlyOldest
