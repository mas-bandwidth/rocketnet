\* MCClientConnectionSmallOrder.cfg: SmallOrderEndsAttempt holds. A server
\* with a half-open mapping may answer a request with a challenge sealed
\* under the handshake keys whose server ephemeral key is a small-order point
\* (ServerSmallOrder); the client that receives it in sending connection
\* request (2) ends the attempt at once in protocol violation (-10) with its
\* keys and ephemeral erased (TRANSPORT.md t7 rule 5, t11.2 step 4), and a
\* second connect from -10 is a fresh attempt (FreshAttemptFromFailure). A
\* responsive server, the idle timeout on, two attempts.
\* Reordering is on: the server sends its genuine challenge in the step that
\* opens the mapping, so on a FIFO wire the small-order challenge always
\* arrives behind it, in sending connection response (3), and the client
\* never meets it in 2. Measured: with Reordering FALSE the reversed witness
\* passed (exit 0, 34,529 distinct states).
\* Timeout is 2: with reordering, Timeout 3 is 5,253,040 distinct states
\* (4 min on 2 workers), past the 110 s budget; Timeout 2 is 939,986.
SPECIFICATION Spec
CONSTANTS
    SendInterval      = 1
    Timeout           = 2
    Deadline          = 0
    ServerDeadline    = 0
    MaxAttempts       = 2
    MaxNonces         = 2
    MaxIds            = 2
    MaxSlots          = 1
    Others            = 0
    OthersMayJoin     = FALSE
    Disconnects       = FALSE
    ServerMute        = FALSE
    ServerPayloads    = FALSE
    DisconnectCopies  = 2
    KindLoss          = "none"
    RepeatKeepAlive   = TRUE
    KeepAliveClock    = "keepalive"
    C2SPattern        = "none"
    S2CPattern        = "none"
    Capacity          = 2
    MaxDelay          = 0
    Duplication       = FALSE
    Reordering        = TRUE
    BurstStart        = 1
    BurstLen          = 2
    SmallOrderServer  <- MCSmallOrder
INVARIANTS
    SafetyInvariants
    KeysErasedWhenDown
    EphemeralErasedOutsideHandshake
PROPERTIES
    SmallOrderEndsAttempt
    FreshAttemptFromFailure
    DisconnectIsTerminal
    TerminalAbsorbing
    StepsForwardOrFails
