\* MCRNRioWorker reachability: the worker exits with a send of the stop
\* burst whose RIOSendEx the kernel refused, counted SEND_FAILED and never
\* completed (rocketnet_rio_post_phase).  The model before the refused post
\* could not reach it: every staged packet became kernel owned.  One staged
\* send.  Must fail NotReachedRefusedPostAtExit.
SPECIFICATION Spec

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 1
    NumBanks        = 2
    Cap             = 1
    View            = 2
    MaxDatagrams    = 0
    MaxSends        = 1
    DrainBatch      = 2
    StopDrainWaits  = 2
    InlineStop      = FALSE
    BoundedStopDrain = TRUE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    TypeOK
    NotReachedRefusedPostAtExit
