\* MCClientConnectionBrokenDeadlineInResponse.cfg: MCClientConnectionConnectClock.cfg
\* with the total deadline still bounding sending connection response (3), the
\* rule before revision 1.1. It must fail NoConnectClockAfterResponse.
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 3
    Deadline         = 3
    ServerDeadline   = 3
    MaxAttempts      = 1
    MaxNonces        = 1
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = TRUE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
    DeadlineInResponse <- DeadlineInResponseOn
PROPERTY
    NoConnectClockAfterResponse
