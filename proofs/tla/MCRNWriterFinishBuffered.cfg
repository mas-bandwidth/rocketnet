\* MCRNWriterFinishBuffered: a buffered transport (the in-memory and plain
\* socket ones). A start the ring had no slot for waits for the main thread's
\* send; none of those is refused and every one is accounted for. (The
\* capacity here is the ring's alone: the update's send limit and budget
\* still refuse, as in MCRNWriterFinish.)
SPECIFICATION Spec

CONSTANTS
    Writers          = {w1, w2}
    Clients          = {c1, c2}
    NoOwner          = none
    Capacity         = 2
    MaxStarts        = 5
    SealAtFinish     = TRUE
    RefuseNoCapacity = TRUE
    CheckOwner       = TRUE
    Buffered         = TRUE
    RingRefuses      = FALSE

INVARIANTS
    TypeOK
    OneWriter
    BufferedNeverRefuses
    Accounted
