\* MCRNXdpSendDrainBrokenNoClaim: reversed witness, a claimed staging buffer counted neither in the worker's pending nor in the drain's idle test; the failure is the drain's half (the model's Pass never runs with a claim and nothing else pending, so the worker's half cannot decide anything): the drain reads the last pass's send_pending false while the worker copies a buffer it just claimed, and cuts it off on a live NIC. Must fail NeverAbandonDraining.
