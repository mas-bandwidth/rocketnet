\* Reach witness, the code's rules at the control's instance: a flush keeps a
\* queue's staged producer while a free bank waits (the lane mutex's
\* try-acquire failed, or the transport is stopping). NoKeptProducer must fail.
SPECIFICATION Spec
CONSTANTS
    Q = 2
    NB = 3
    S = 3
    Stride = 4
    Threads = {1, 2}
    Dests = {0, 1}
    Demand = 2
    MaxFlush = 2
    SkewSpan = 1
    ClaimCmp = "ge"
    ClaimRule = "cas"
    SlotRule = "check"
    IdRule = "mul"
    FlushRule = "joined"
INVARIANT TypeOK
INVARIANT NoKeptProducer
