\* MCRNSimFaults: the committed run, the design. Two clients and the
\* server, one client crash, one server crash and one clean disconnect,
\* six sessions, one step of true time with the clocks at the design's
\* extremes. The reversed witnesses are
\* MCRNSimFaultsBrokenRestartKeepsSession.cfg and
\* MCRNSimFaultsBrokenCrashedSends.cfg beside this one.
SPECIFICATION LiveSpec

CONSTANTS
    C1               = C1
    C2               = C2
    S0               = S0
    Clients          = {C1, C2}
    Server           = S0
    MaxSessions      = 6
    MaxClientCrashes = 1
    MaxServerCrashes = 1
    MaxDisconnects   = 1
    MaxTime          = 1
    MaxInFlight      = 2
    Scale            = 200
    Offset           <- MCOffset
    Rate             <- MCRate
    OffsetBound      = 50
    DriftBound       = 1

INVARIANTS
    TypeOK
    CrashedEndpointSilent
    RestartIsFresh
    DeliverOnlyToLiveGeneration
    LiveSessionOnCurrentIncarnation
    SkewBounded

PROPERTIES
    ClockMonotone
    EveryLiveClientConnects
