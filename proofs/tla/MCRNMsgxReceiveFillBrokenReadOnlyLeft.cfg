\* MCRNMsgxReceiveFill with ReadOnlyLeft (the ready-slot rule before the receive handoff): main reads only a bank the worker has left, so a datagram committed before a call waits for a later one. Must fail DeliveredByNextCall.
SPECIFICATION Spec
CONSTANTS
    Sockets = 2
    Capacity = 3
    Batch = 2
    Budget = 3
    Buffer = 3
    CallCaps = {1, 3}
    MaxArrivals = 7
    MaxErrors = 2
    ReadPastRoom = FALSE
    ReadPastBudget = FALSE
    HoldWithoutMove = FALSE
    FreeNotReset = FALSE
    ReadOnlyLeft = TRUE
    StopCountSkipsWorker = FALSE
INVARIANTS TypeOK DeliveredByNextCall
