\* MCRNXdpReceiveRing reversed witness: after a batch boundary the worker
\* stages into the bank it read at the start of its pass instead of reading
\* the producer again under the new hold. Main's swap came in between, so
\* the worker appends to the bank main now holds. Must fail HeldBankStable.
SPECIFICATION Spec

