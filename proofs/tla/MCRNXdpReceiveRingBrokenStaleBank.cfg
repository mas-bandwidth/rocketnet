\* MCRNXdpReceiveRing reversed witness: after it let go of the mutex for
\* main, the worker stages into the bank it read at the start of its pass
\* instead of reading the producer again under the new hold. Main's swap
\* came in between, so the worker appends to the bank main now holds. Must
\* fail HeldBankStable.
SPECIFICATION Spec

CONSTANTS
    F1         = F1
    F2         = F2
    F3         = F3
    Frames     = {F1, F2, F3}
    RingSize   = 2
    PeekMax    = 2
    StageCap   = 2
    FillSize   = 6
    Budget     = 1
    MaxPackets = 4
    SpinMax    = 2
    TryArrivals = 1
    Stall      = TRUE
    StaleBank <- StaleBankBroken

INVARIANTS
    TypeOK
    HeldBankStable
