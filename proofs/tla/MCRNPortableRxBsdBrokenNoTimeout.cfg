\* MCRNPortableRx reversed witness on BSD: the idle wait returns on the wake
\* alone, with neither readability nor a timeout. A datagram that reaches
\* the socket while the worker waits idle, with no bank for main to return,
\* is never read: EveryDatagramDelivered fails, showing that on BSD delivery
\* rests on the 1 ms timeout. Must fail.
SPECIFICATION SpecFair

CONSTANTS
    NumBanks       = 3
    Cap            = 2
    Budget         = 1
    MaxDatagrams   = 4
    MaxChaff       = 2
    HoldOnFull     = TRUE
    ReturnWhenRead = TRUE
    QuitBeforeWake = TRUE
    WakeOnReturn   = TRUE
    Timeout        = FALSE
    ReadableWake   = FALSE
    BoundedRead    = TRUE

INVARIANTS
    TypeOK

PROPERTIES
    EveryDatagramDelivered
