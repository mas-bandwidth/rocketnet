\* MCRNWriterFinishBrokenRingRefuses: reversed witness: on a buffered transport a start the ring had no slot for is marked as
\* having no capacity, so the writer's finish refuses it and BufferedNeverRefuses falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Writers          = {w1, w2}
    Clients          = {c1, c2}
    NoOwner          = none
    Capacity         = 2
    MaxStarts        = 5
    SealAtFinish     = TRUE
    RefuseNoCapacity = TRUE
    CheckOwner       = TRUE
    Buffered         = TRUE
    RingRefuses      = TRUE
    Budgeted         = FALSE
    RestartAtFinish  = TRUE
    ValidateFirst    = TRUE

INVARIANTS
    TypeOK
    BufferedNeverRefuses
