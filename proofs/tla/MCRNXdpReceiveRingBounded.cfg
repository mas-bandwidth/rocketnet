\* MCRNXdpReceiveRing: the bound on a missed claim, for threads that do not
\* stop (Stall FALSE). The worker takes a step between two of main's tries
\* and at most one packet arrives between two of them. Main's claim then
\* takes the mutex within its two further tries, in the call that asked
\* (ClaimWithinSpin); the worker is kept off the mutex only while main spins
\* (WantedOnlyInSpin); and no arrival is dropped for a full RX ring in that
\* time when the ring had room for a spin's arrivals (NoDropWhilePaused: an
\* RX ring of three, so a ring with one descriptor has that room). Weak
\* fairness of each thread is all the liveness properties need here
\* (SpecWeak): nothing rests on strong fairness of Drain. Five packets, so
\* the ring can fill behind a worker that is kept off the mutex.
SPECIFICATION SpecWeak

CONSTANTS
    F1         = F1
    F2         = F2
    F3         = F3
    Frames     = {F1, F2, F3}
    RingSize   = 3
    PeekMax    = 2
    StageCap   = 2
    FillSize   = 6
    Budget     = 1
    MaxPackets = 5
    SpinMax    = 2
    TryArrivals = 1
    Stall      = FALSE

INVARIANTS
    TypeOK
    FrameConservation
    ConsumerNotBehind
    PendingReturnedEachPass
    FillNeverEmptyWhileFramesFree
    BankOneOwner
    StagedBeforeClaimInView
    ConsumedInOrder
    ViewStable
    HeldBankStable
    PeekedFitsBank
    WantedOnlyInSpin
    ClaimWithinSpin
    NoDropWhilePaused

PROPERTIES
    ReceiveNeverStalls
    StagedEventuallyConsumed
