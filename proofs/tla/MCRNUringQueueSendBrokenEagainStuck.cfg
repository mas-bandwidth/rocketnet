\* Reversed witness: an eagain completion hands its slots back but leaves
\* its run counted pending, so the bank never retires and the worker never
\* takes the next ready bank.  Must violate Drains.  The handoff mutex has no
\* part in it, so LockRule "none" keeps the run inside its budget.
SPECIFICATION MCLiveSpec

CONSTANTS
    NB         = 3
    S          = 2
    Dests      = {1, 2}
    MaxSeg     = 2
    Demand     = 3
    MaxFlush   = 2
    MaxEagain  = 1
    RetireRule = "cqe"
    EagainRule = "stuck"
    LockRule   = "none"

PROPERTIES
    Drains
