\* The index is the hash unmasked: a key puts a source's bit outside the allocated bitmap.
SPECIFICATION MCSpec

CONSTANTS
    Sources      = {1, 2, 3}
    Bound        = 2
    Factor       = 2
    WordBits     = 2
    HashRange    = 8
    VerifyBudget = 1
    Broken       = "nomask"

INVARIANT IndexInRange
