\* MCRNBankFifoLayoutLifoExposed: the iocp server's receive banks and the rio
\* receive banks (sdk/rocketnet_server_iocp_windows.cpp,
\* sdk/rocketnet_server_rio_windows.cpp): four banks, the free stack filled by
\* the loop, the ready FIFO of four, and main exposing up to every ready bank
\* and returning them all to the stack at its next call.
SPECIFICATION Spec

CONSTANTS
    N         = 4
    ArrLen    = 4
    ConsMax   = 4
    MaxReady  = 4
    MaxPub    = 10
    FreeSlack = 0
    HeadMod   = 4
    TailMod   = 4
    PushKind  = "lifo"
    PopKind   = "lifo"
    InitKind  = "loop"

INVARIANTS
    TypeOK
    InBounds
    CountsInRange
    ExactlyOnePlace
    ReadyMatches
