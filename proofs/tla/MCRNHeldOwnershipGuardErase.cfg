\* MCRNHeldOwnership, the bounded erase on its own: the number-only release,
\* no occupancy bound and no identity check, so orphaned entries fill all 2W
\* cells, but the erase stops after one pass (EraseBound). Must pass EraseEnds.
\* MCRNHeldOwnershipBrokenNoGuardsErase.cfg with UnboundedErase FALSE.
SPECIFICATION Spec

CONSTANTS
    W                 = 2
    Keys              = {1, 2, 3, 4}
    Homes             <- ZeroHome
    MaxNum            = 8
    MaxCount          = 2
    NumberOnlyRelease = TRUE
    NoOccupancyBound  = TRUE
    NoIdentityCheck   = TRUE
    UnboundedErase    = FALSE

INVARIANTS
    EraseEnds
