\* Reversed witness: the client before W2-113 discards a challenge whose
\* server ephemeral key is a small-order point and stays in sending
\* connection request (2), so the attempt runs on to the server's next
\* challenge or to its deadline. TLC must fail SmallOrderEndsAttempt.
\* Reordering is on: the server sends its genuine challenge in the step that
\* opens the mapping, so on a FIFO wire the small-order challenge always
\* arrives behind it, in sending connection response (3), and the client
\* never meets it in 2. Measured: with Reordering FALSE the reversed witness
\* passed (exit 0, 34,529 distinct states).
SPECIFICATION Spec
CONSTANTS
    SendInterval      = 1
    Timeout           = 3
    Deadline          = 0
    ServerDeadline    = 0
    MaxAttempts       = 1
    MaxNonces         = 1
    MaxIds            = 2
    MaxSlots          = 1
    Others            = 0
    OthersMayJoin     = FALSE
    Disconnects       = FALSE
    ServerMute        = FALSE
    ServerPayloads    = FALSE
    DisconnectCopies  = 2
    KindLoss          = "none"
    RepeatKeepAlive   = TRUE
    KeepAliveClock    = "keepalive"
    C2SPattern        = "none"
    S2CPattern        = "none"
    Capacity          = 2
    MaxDelay          = 0
    Duplication       = FALSE
    Reordering        = TRUE
    BurstStart        = 1
    BurstLen          = 2
    SmallOrderServer  <- MCSmallOrder
    SmallOrderIgnored <- MCSmallOrderIgnored
INVARIANTS
    SafetyInvariants
PROPERTIES
    SmallOrderEndsAttempt
