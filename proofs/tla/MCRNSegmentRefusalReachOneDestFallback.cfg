\* The io_uring code with one refusing destination: its two runs in the
\* kernel together both come back refused, the second answer finds it in
\* the table and does not count, so the queue never turns plain on one
\* refusing destination.  Must pass; the code before, counting every
\* answer, is MCRNSegmentRefusalBrokenEveryAnswer.cfg.
SPECIFICATION Spec

CONSTANTS
    Dests          = {g, b}
    Refusing       = {b}
    KernelSegments = TRUE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"
    Slot           <- SlotDistinct
    Queue          <- QueueOne
    AcceptedRule   = "transport"
    FallbackScope  = "queue"
    InFlight       = 2
    PlainFails     = FALSE

INVARIANTS
    TypeOK
    RefusalsBounded
    NoFallbackOnFewerDests
