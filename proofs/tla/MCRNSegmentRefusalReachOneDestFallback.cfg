\* Reach witness for the code as it is (codewrong MM144): on io_uring the
\* refusing destination's two runs in the kernel together come back
\* refused, each answer counts, and the queue turns plain with one refusing
\* destination and none accepted.  Must violate NoFallbackOnFewerDests.
SPECIFICATION Spec

CONSTANTS
    Dests          = {g, b}
    Refusing       = {b}
    KernelSegments = TRUE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"
    Slot           <- SlotDistinct
    Queue          <- QueueOne
    AcceptedRule   = "transport"
    FallbackScope  = "queue"
    InFlight       = 2
    PlainFails     = FALSE

INVARIANTS
    TypeOK
    NoFallbackOnFewerDests
