\* MCRNSentMap reversed witness: a map one entry short of the window
\* (P = W - 1). Must fail NoLiveEviction: W first sends in one update evict
\* the first before its ack lands. The committed MCRNSentMap.cfg with P changed.
SPECIFICATION Spec

CONSTANTS
    W            = 3
    P            = 2
    RTT          = 2
    RTO          = 2
    MaxNum       = 4
    MaxTime      = 6
    MaxPerPacket = 2

INVARIANTS
    TypeOK
    MapBounded
    WindowBounded
    NoLiveEviction
