\* MCRNResendTimingOff: the reliable timeout off, the default of v1.1.0 (one tick
\* is 500 ms): resend delay initial and maximum 2000 ms (4), the minimum one
\* tick, a 6 s horizon (12), probe pacing at 1 s (2). Three numbers on the wire,
\* s, the chunk c and s2, so a hold with U in place and progress is seen; Walk
\* writes every number the walk reaches. Every send may be lost.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 12
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    Third       <- ThirdOn
    TimeoutOn   <- TimeoutOff
INVARIANTS
    TypeOK
    ConfigAccepted
    NoDueRecordHeld
    OffMeansNoStallEnd
    DueMeansWritten
PROPERTIES
    ProbeOnlyU
