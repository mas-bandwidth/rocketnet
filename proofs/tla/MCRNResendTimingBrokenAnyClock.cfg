\* MCRNResendTimingBrokenAnyClock: the reversed witness of
\* MCRNResendTimingRefusedChunk.cfg. The timeout fires on any unacked record on
\* the wire past its deadline (the model before it was matched to the code):
\* the small record's first send is refused at tick 0 while the chunk is sent,
\* the small record is first sent at tick 1, and at tick 8 the chunk's clock
\* (first send 0) ends the connection though U has stood 7 ticks. It must fail
\* TimeoutFromOldest.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 2
    RtoMin      = 1
    RtoMax      = 2
    Timeout     = 8
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    RefuseFor   <- RefuseForLong
    AnyClock    <- AnyClockOn
INVARIANTS
    TypeOK
    TimeoutFromOldest
