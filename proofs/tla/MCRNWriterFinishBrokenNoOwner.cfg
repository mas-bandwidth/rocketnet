\* MCRNWriterFinishBrokenNoOwner: reversed witness: no ownership check, so a
\* second writer starts or finishes on a client another writer already
\* touched in the same fill phase, and OneWriter falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Writers          = {w1, w2}
    Clients          = {c1, c2}
    NoOwner          = none
    Capacity         = 2
    MaxStarts        = 5
    SealAtFinish     = TRUE
    RefuseNoCapacity = TRUE
    CheckOwner       = FALSE
    Buffered         = FALSE
    RingRefuses      = FALSE

INVARIANTS
    TypeOK
    OneWriter
