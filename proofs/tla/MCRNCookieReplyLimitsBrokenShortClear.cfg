\* The update clears every word but the last: a bit from an earlier update refuses a source no reply of this update explains.
SPECIFICATION MCSpec

CONSTANTS
    Sources      = {1, 2, 3}
    MaxClients   = 2
    Bits         = 4
    WordBits     = 2
    HashRange    = 8
    VerifyBudget = 1
    Broken       = "shortclear"

INVARIANT RefusalHasCause
