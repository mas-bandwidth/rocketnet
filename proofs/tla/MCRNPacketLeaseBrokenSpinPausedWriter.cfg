\* MCRNPacketLease reversed witness: resolve waits for an entry being written (the code
\* before the skip fix) with only thread 1 scheduled.
\* Thread 2 claims an entry and stops before it stores active; thread 1's
\* resolve spins on that entry for ever.  Must fail ResolveCompletes.
SPECIFICATION SpecSolo

CONSTANTS
    Capacity          = 4
    Threads           = {1, 2}
    Frames            = {1, 2}
    Vals              = {1}
    HashSpread        = 1
    MaxOps1           = 2
    MaxOps2           = 1
    MaxResets         = 2
    EpochLimit        = 2
    UsedLimit         = 2
    UseCas            = TRUE
    ConsumeCas        = TRUE
    BumpEpoch         = TRUE
    EpochLimited      = TRUE
    RetiredOn         = FALSE
    RetiredValidates  = FALSE
    OnWriting         = {"spin"}
    ValidCallers      = TRUE
    AtomicFields      = TRUE

INVARIANTS
    TypeOK

PROPERTIES
    ResolveCompletes
