\* MCRNBufferHandoff reversed witness: the I/O thread frees a ring before it has sent it. FreeIsEmpty falls. Must fail.
SPECIFICATION SpecFair

CONSTANTS
    N                 = 3
    Cap               = 2
    MaxItems          = 5
    MaxReady          = 2
    Direction         = "send"
    MainBlocks        = FALSE
    WorkUnderLock     = FALSE
    WriteAfterPublish = FALSE
    SkipWake          = FALSE
    ReleaseBeforeSent = TRUE
    DiscardOnStop     = FALSE
    DropFinal         = FALSE

INVARIANTS
    TypeOK
    OneOwner
    FreeIsEmpty
    ViewStable
    InOrder
    NoWorkUnderLock
    MainNeverWaits
    ExitSentAll

PROPERTIES
    StopSendsAll
