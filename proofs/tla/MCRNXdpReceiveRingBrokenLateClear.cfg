\* MCRNXdpReceiveRing reversed witness: main leaves its flag raised after its
\* swap, until the call ends. The worker is kept off the mutex while main
\* reads, for longer than main's bounded spin, and the RX ring fills behind
\* it: the kernel drops an arrival although the ring had room for a spin's
\* arrivals when main raised the flag. Both threads keep running (Stall
\* FALSE). Must fail NoDropWhilePaused. WantedOnlyInSpin restates the rule
\* and is broken at the swap, before any packet is lost; it is left out so
\* the run reaches the drop.
SPECIFICATION SpecWeak

CONSTANTS
    F1         = F1
    F2         = F2
    F3         = F3
    Frames     = {F1, F2, F3}
    RingSize   = 3
    PeekMax    = 2
    StageCap   = 2
    FillSize   = 6
    Budget     = 1
    MaxPackets = 5
    SpinMax    = 2
    TryArrivals = 1
    Stall      = FALSE
    LateClear <- LateClearBroken

INVARIANTS
    TypeOK
    NoDropWhilePaused
