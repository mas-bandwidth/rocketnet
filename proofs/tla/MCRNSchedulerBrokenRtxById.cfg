\* Reversed witness: MCRNScheduler.cfg with RtxSendOrder = FALSE (a retransmit
\* group's head is its lost item with the lowest id, not the least recently
\* sent). On channel 0: CONFIG (item 1) and item 2 first-written, item 1 lost
\* and resent, then item 2 and item 1 lost. The resend FIFO is 2, 1, so the
\* code offers item 2 at the boosted level; this case offers item 1. Needs 3
\* losses. TLC must fail RtxHeadBoost.

SPECIFICATION Spec

CONSTANTS
    NC             = 2
    Msgs           <- MCMsgs
    ULevel         = 2
    W              = 2
    Cap            = 1
    UPerTick       = 1
    MaxLoss        = 3
    ChannelFIFO    = TRUE
    RtxSendOrder   = FALSE
    UnreliableLast = TRUE

INVARIANTS
    TypeOK
    RtxHeadBoost
