\* A full test one late: the first distinct key fills the one-entry buffer;
\* the next distinct key writes past it (InBounds).
SPECIFICATION MCSpec

CONSTANTS
    k1              = k1
    k2              = k2
    NONE            = NONE
    Keys            = {k1, k2}
    Vals            = {0, 1}
    M               = 1
    DeduplicateForgets = TRUE
    FullTestExact   = FALSE
    KeptSearchBound = TRUE
    CompactFromZero = TRUE

INVARIANT InBounds
