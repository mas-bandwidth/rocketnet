\* MCRNClientReceiveQuit on macOS and iOS (woken flag, then a mach
\* semaphore wait), every rule on.  The timeout is not assumed to fire:
\* the macOS hang was a 1 ms wait that did not time out.
SPECIFICATION SpecFair

