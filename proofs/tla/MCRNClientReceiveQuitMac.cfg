    Platform       = "mac"
    WaitTimeout    = "unreliable"
    WakeBeforeQuit = FALSE
    NoWake         = FALSE

INVARIANTS
    TypeOK
    WokenSeesQuit

PROPERTIES
    DestroyCompletes
