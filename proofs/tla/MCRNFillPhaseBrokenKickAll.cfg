\* MCRNFillPhaseBrokenKickAll: an update call that finds the update open finishes it and begins the next in the same call, whose not-received check ends every connection the finish just delivered to; must fail NoKickOnOpenUpdate.
SPECIFICATION Spec

CONSTANTS
    Fillers      = {f1, f2}
    Clients      = {c1, c2}
    NoOwner      = none
    MaxMain      = 2
    MaxFills     = 1
    MaxTakes     = 0
    LookFirst    = FALSE
    LoadStore    = FALSE
    ResetOnLeave = TRUE
    NoEpochLook  = FALSE
    NoRestore    = FALSE
    ScanOne      = FALSE
    NoWindow     = FALSE
    NoMainWindow = FALSE
    TakeUncounted = FALSE
    OptedAtStart  = TRUE
    ArmedAtCreate = FALSE
    OwnerAtDecide = FALSE
    KickAll       = TRUE
    FreshKept     = FALSE
    ShutOnEarly   = FALSE
    ScanFirst     = FALSE
    DepthMax      = 2
    Lines        = {0, 1}
    LineChoice   <- MCLineChoice
    f1 = f1
    f2 = f2
    f3 = f3

VIEW View

INVARIANTS
    NoKickOnOpenUpdate
