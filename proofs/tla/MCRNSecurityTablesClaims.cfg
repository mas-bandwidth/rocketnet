\* Focused three-token, two-slot claim table control. The handshake
\* deadline is 2 so claims made at clocks 0, 1 and 2 expire inside the
\* clock's range (at 4, with MaxClock 4, only clock-0 claims did).
SPECIFICATION ClaimsSpec

CONSTANTS
    None = None
    Addrs = {"A", "B"}
    Tokens = {"th", "te", "tf"}
    Expire <- MCExpire
    Cid <- MCCid
    MaxClock = 4
    CookieLife = 1
    RotatePeriod = 2
    MaxClients = 2
    HistoryCap = 2
    AdmittedCap = 2
    VerifyBudget = 2
    HandshakeDeadline = 2
    Rotation = TRUE
    AcceptPrevious = TRUE
    RefuseAdmittedAtResponse = TRUE
    RequestChecksExpiry = TRUE
    EvictLiveHistory = TRUE
    DeniedConsumesToken = FALSE
    CapVerifyBudget = TRUE
    PreviousOutlivesWindow = FALSE
    BindAtRequest = FALSE
    Holds <- MCHolds
    ClaimTokens <- MCClaimControlTokens
    HoldUntilExpire = FALSE
    CheckCidAtResponse = TRUE

INVARIANTS
    ClaimSafetyInvariants

CHECK_DEADLOCK FALSE
