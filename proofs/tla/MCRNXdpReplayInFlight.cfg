\* MCRNXdpReplayInFlight: the control with two packets in flight, so a
\* duplicate can arrive before its original, two sends can arrive in either
\* order, and the kernel can pass or drop one while the other waits across a
\* walk and commit. Two addresses, two sessions (so a reconnect meets
\* packets of the old session still in flight), sequences 1..2, the replay
\* window 2, no refusals: MCRNXdpReplayInFlightRefusals.cfg is the same with
\* one session and a refused forget and mark. The other controls keep one
\* packet in flight, where their larger budgets complete within the record
\* limit (README-RNXdpReplay.md).
SPECIFICATION Spec

CONSTANTS
    A1          = A1
    A2          = A2
    Addresses   = {A1, A2}
    MaxSeq      = 2
    W           = 2
    Sessions    = 2
    MaxInFlight = 2
    ForgetCapacity = 1
    MarkFailureBudget = 0
    HeldReplyBudget = 0
    ForgetFailureBudget = 0

INVARIANTS
    TypeOK
    ForgetOwedUntilApplied
    MarkNeverAhead
    MarksTakenFromTheTruth
    FreshGenuineNeverDropped
    LiveSessionNeverDroppedForNoEntry
    NewSessionNeverDroppedByOldMark
    ReleasedSlotForgetsItsReplyMac
    RetryNeverDeletesNewerMark
    MarkOwedUntilApplied

PROPERTIES
    KernelNeverWrites
