\* MCRNPortableTx reversed witness: the worker reads quit after it releases the
\* mutex, the race fixed in f0ee90fe.  Stop can publish the last bank and set
\* quit between the empty observation and the read.  Must fail ExitSentAll.
SPECIFICATION Spec

CONSTANTS
    NumBanks          = 3
    Cap               = 2
    Batch             = 2
    MaxPackets        = 6
    FullSlack         = 0
    HeadMod           = 3
    TailMod           = 3
    QuitUnderLock     = FALSE
    PublishBeforeQuit = TRUE
    RetryOnIdle       = TRUE
    WakeOnPublish     = TRUE
    Timeout           = FALSE

INVARIANTS
    InBounds
    TypeOK
    ExitSentAll
