\* MCRNServerSendFairBrokenHoldFirst: a slot held also before the flush's first frame.
\* With the second queue full for good, a flush that starts on its slot keeps the
\* cursor there, every flush starts there, and the first queue's slot after the one
\* its single frame serves is never written. Must fail FairService.
SPECIFICATION Spec

CONSTANTS
    N       = 4
    K       = 1
    Conn    = {0, 1, 2, 3}
    WorkMax = 1
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "rounds"
    Q1      = {1, 3}
    K1      = 0
    QueueRule = "holdfirst"

INVARIANTS
    FairService
