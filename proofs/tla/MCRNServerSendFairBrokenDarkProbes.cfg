\* MCRNServerSendFairBrokenDarkProbes: the v1.1.0 due test again, checked against the dark
\* slot itself: it starts a frame in a flush in which its probe is not due
\* (DarkTakesOnlyItsProbes).
SPECIFICATION Spec

CONSTANTS
    N       = 3
    K       = 2
    Conn    = {0, 1, 2}
    WorkMax = 2
    Dark    = {2}
    Short   = {}
    Delay   = 2
    DueRule = "head"
    Budget  = "first"
    Mode    = "rounds"
    Q1      = {}
    K1      = 0
    QueueRule = "perqueue"

INVARIANT
    DarkTakesOnlyItsProbes
