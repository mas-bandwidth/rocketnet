\* MCRNServerSendFairBrokenDarkProbes: the v1.1.0 due test again, checked
\* against the dark client itself: it starts a frame in an update in which
\* its probe is not due, so DarkTakesOnlyItsProbes falls.
SPECIFICATION Spec

CONSTANTS
    N       = 3
    K       = 2
    Work    = 2
    Dark    = {3}
    Short   = {}
    Delay   = 2
    DueRule = "head"
    Mode    = "fair"

INVARIANT
    DarkTakesOnlyItsProbes
