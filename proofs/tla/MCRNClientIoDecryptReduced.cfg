\* MCRNClientIoDecryptReduced: the required control inside the 110-second
\* case budget, every rule on, three datagrams in a behaviour instead of
\* four (the challenge and two more).  MCRNClientIoDecrypt.cfg, the full
\* instance, is bench debt over that budget.  Two branches this instance
\* cannot take have reach witnesses of their own: the too-old replay (it
\* needs sequences 1 and 2 and a copy of 1: MCRNClientIoDecryptReachTooOld.cfg)
\* and an integrity failure short of the limit (the limit is one here:
\* MCRNClientIoDecryptReachCountedFailure.cfg).
SPECIFICATION SpecFair

CONSTANTS
    BufferCap        = 2
    MaxDatagrams     = 3
    MaxSeq           = 3
    W                = 1
    MaxReplays       = 1
    MaxForged        = 1
    IntegrityLimit   = 1
    OpenBeforeReplay = FALSE
    SharedWindow     = FALSE
    NoRetire         = FALSE
    CountOnIo        = FALSE
    NoPayloadGate    = FALSE

INVARIANTS
    TypeOK
    CheapRefusalsFirst
    NoOpenWithoutKeys
    IoWindowWithinMain
    PayloadOpenedOnlyConnected
    AcceptedOnce
    SingleWriter
    ExposedStable
    NoReceiveStall
    RetiredZeroed

PROPERTIES
    GenuineEventuallyAccepted
    RetiredEventuallyZeroed
    PayloadsEventuallySeen
