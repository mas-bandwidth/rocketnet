\* MCRNClientIoDecryptReduced: the required control inside the 110-second
\* case budget, every rule on, three datagrams in a behaviour instead of
\* four (the challenge and two more).  MCRNClientIoDecrypt.cfg, the full
\* instance, is bench debt over that budget.  Every reachability the README
\* lists except the too-old replay (which needs sequences 1 and 2 and a copy
\* of 1) stays reachable here.
SPECIFICATION SpecFair

CONSTANTS
    BufferCap        = 2
    MaxDatagrams     = 3
    MaxSeq           = 3
    W                = 1
    MaxReplays       = 1
    MaxForged        = 1
    IntegrityLimit   = 1
    OpenBeforeReplay = FALSE
    SharedWindow     = FALSE
    NoRetire         = FALSE
    CountOnIo        = FALSE
    NoPayloadGate    = FALSE

INVARIANTS
    TypeOK
    CheapRefusalsFirst
    NoOpenWithoutKeys
    MirrorExact
    PayloadOpenedOnlyConnected
    AcceptedOnce
    SingleWriter
    ExposedStable
    NoReceiveStall

PROPERTIES
    GenuineEventuallyAccepted
    RetiredEventuallyZeroed
