\* Reachability, not a rule: under heavy loss (LossBound = FALSE) a burst of large packets rules out 2, which the path carries, and its re-try raises P to it; the case must violate NoRetryRaise, so the re-try's success is explored.
SPECIFICATION Spec

CONSTANTS
    ClientSet     = {2, 1}
    ServerList    = {2, 1}
    CapsUp        = {2}
    CapsDown      = {2}
    K             = 2
    MaxBursts     = 1
    AttackBudget  = 0
    AttackKinds   = {"replay", "probe", "reply"}
    Forger        = FALSE
    Timed         = TRUE
    LossBound     = FALSE
    MaxReuses     = 0
    ReuseCapsUp   = {}
    ReuseCapsDown = {}
    Broken        = "none"

PROPERTY NoRetryRaise
