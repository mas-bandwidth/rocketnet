\* MCRNResendTimingBrokenDueIgnoresHold: MCRNResendTimingOff with the due test
\* of v1.1.0, blind to probe pacing: it reads each class's FIFO head alone, so
\* once the probe holds the chunk or s2 past its delay while U waits its own,
\* it reports work in every update and the walk writes nothing (the frame the
\* server started is aborted). It must fail DueMeansWritten.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 12
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    Third       <- ThirdOn
    TimeoutOn   <- TimeoutOff
    DueRule     <- DueRuleOff
INVARIANT
    DueMeansWritten
