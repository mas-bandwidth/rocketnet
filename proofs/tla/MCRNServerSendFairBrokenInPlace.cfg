\* MCRNServerSendFairBrokenInPlace: the cursor stays on the slot just visited, so the
\* first slot keeps the capacity and the others starve (FairService).
SPECIFICATION Spec

CONSTANTS
    N       = 3
    K       = 1
    Conn    = {0, 1, 2}
    WorkMax = 1
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "inplace"

INVARIANT
    FairService
