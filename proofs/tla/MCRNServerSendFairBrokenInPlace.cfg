\* MCRNServerSendFairBrokenInPlace: the reversed witness where the cursor
\* stays on the client just visited, so it takes the capacity every update and
\* every later client starves: FairService falls.
SPECIFICATION Spec

CONSTANTS
    N       = 3
    K       = 1
    Work    = 1
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Mode    = "inplace"

INVARIANTS
    TypeOK
    FairService
