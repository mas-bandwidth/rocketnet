\* MCRNServerSendFairBrokenInPlace: the reversed witness where the first
\* client keeps the cursor and consumes the whole cap every update. Every
\* later client starves, so FairService falls.
SPECIFICATION Spec

CONSTANTS
    N        = 3
    K        = 1
    Mode     = "inplace"
    MaxTicks = 9


INVARIANTS
    TypeOK
    FairService
