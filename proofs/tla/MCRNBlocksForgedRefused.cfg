\* Reversed witness for NeverRefused: MCRNBlocksForged.cfg checked against
\* NeverRefused. A forged count reaches the receiver's anchor refusal
\* (MESSAGE_BAD_BLOCK), so the refusal is a reachable step and NeverRefused
\* in MCRNBlocks.cfg and MCRNBlocksWrap.cfg is not vacuous. TLC must fail
\* NeverRefused.

SPECIFICATION Spec

CONSTANTS
    W            = 4
    F            = 2
    B            = 8
    Small        = 2
    Units        <- MCUnits
    PlaceByIndex = TRUE
    Forge        <- ForgeOn
    FwdPattern   = "arbitrary"
    Capacity     = 2
    MaxDelay     = 0
    Duplication  = TRUE
    Reordering   = TRUE
    BurstStart   = 1
    BurstLen     = 2

INVARIANTS
    TypeOK
    NeverRefused
