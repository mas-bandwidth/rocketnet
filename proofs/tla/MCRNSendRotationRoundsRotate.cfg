\* The writer list across flushes: three connections, two frames a flush,
\* three flushes, so later rounds and capacity cuts start from every
\* cursor; no stall and no refusal.
SPECIFICATION MCSpec

CONSTANTS
    N           = 3
    Cap         = 2
    MaxFlush    = 3
    EnvStall    = FALSE
    EnvShortAck = FALSE
    EnvRefuse   = FALSE
    EnvVain     = FALSE
    KeepDone    = TRUE
    StallGate   = TRUE
    FitsGate    = TRUE
    WriteFirst  = TRUE
    CursorNext  = TRUE
    CutCursor   = TRUE
    VainEnds    = TRUE

INVARIANTS
    TypeOK
    NoRefusalAbort
    AbortsBounded
    UnlistedPassEnded
    SkippedWritesNothing
    CursorAsFullWalk
    VisitsBounded
    ServedWhenCapacity
    BoundedWait
