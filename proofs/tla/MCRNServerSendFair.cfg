\* MCRNServerSendFair: the committed run. Three healthy clients share one
\* frame per update; the pass rotates, so every client with work is written
\* within three updates, and no unit of the capacity goes to an empty frame.
SPECIFICATION Spec

CONSTANTS
    N       = 3
    K       = 1
    Work    = 1
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Mode    = "fair"

INVARIANTS
    TypeOK
    FairService
    NoUnitWasted
    OtherClientUnaffected
