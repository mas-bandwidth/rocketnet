\* MCRNServerSendFair: the smallest ring: three healthy slots share one frame a flush and offer
\* one each; every slot is written within ceil(3 / 1) = 3 flushes.
SPECIFICATION Spec

CONSTANTS
    N       = 3
    K       = 1
    Conn    = {0, 1, 2}
    WorkMax = 1
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "rounds"
    Q1      = {}
    K1      = 0
    QueueRule = "perqueue"

INVARIANTS
    TypeOK
    FairService
    NoUnitWasted
    OtherClientUnaffected
    DarkTakesOnlyItsProbes
    SameOrder
    OnlyLastWriters
    EndedWritesNothing
    CursorAsFullWalk
    VisitsBounded
