\* A walk that leaves a refused forget does not raise supersede_owed: the next
\* walk's forget pass skips the scan while two records name one address, and
\* the slot back at the address keeps a mark the commit deletes
\* (KernelHoldsMark).
SPECIFICATION MCSpec

CONSTANTS
    s1              = s1
    s2              = s2
    a1              = a1
    a2              = a2
    NONE            = NONE
    Slots           = {s1, s2}
    Addrs           = {a1, a2}
    MaxHigh         = 1
    SkipWhileOwed   = TRUE
    ClearOnAccept   = TRUE
    ForgetRefusable = TRUE
    MarkSupersedes  = TRUE
    ForgetSupersedes = TRUE
    OweOnRefusal    = FALSE
    ScanWhenOwedOnly = TRUE

INVARIANT KernelHoldsMark
