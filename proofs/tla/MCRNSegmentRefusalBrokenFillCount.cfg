\* Reversed witness: the table before, counting only a refusal that filled
\* an empty entry. With both destinations in one entry the second refusal
\* displaces the first and does not count, so a kernel that cannot segment
\* keeps segmentation on. Must violate KernelFallback.
SPECIFICATION Spec

CONSTANTS
    Dests          = {d1, d2}
    Refusing       = {}
    KernelSegments = FALSE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "fillcount"
    Slot           <- SlotShared
    Queue          <- QueueOne
    AcceptedRule   = "transport"
    FlagScope      = "queue"

INVARIANTS
    TypeOK
    KernelFallback
