\* MCClientConnectionAuthenticRefusals: an authenticated server's packets the
\* other runs leave out. A session packet that opens may be refused after its
\* replay mark (AuthenticRefusals), a challenge may carry a small order
\* ephemeral the client ignores (SmallOrderServer), and the server sends
\* standalone acks (ServerAcks, ServerAck). With the idle timeout 3 and the
\* total deadline 5 every attempt still resolves, and none of these moves
\* the client but an ack's refresh of the receive clock.
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 3
    Deadline         = 5
    ServerDeadline   = 0
    MaxAttempts      = 1
    MaxNonces        = 1
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = FALSE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
    AuthenticRefusals <- AuthenticOn
    SmallOrderServer  <- AuthenticOn
    ServerAcks        <- AuthenticOn
INVARIANTS
    SafetyInvariants
    KeysErasedWhenDown
    EphemeralErasedOutsideHandshake
PROPERTIES
    StepsForwardOrFails
    TimeoutPairing
    AcceptedUnderLiveKeys
    PayloadOnlyWhenConnected
    NoSendOnArrival
    OnlyAuthenticatedRefreshes
    HandshakeNeverRewinds
    AttemptResolves
