\* MCClientConnectionConnectClock.cfg: the connect clock (TRANSPORT.md t11
\* rule 6, revision 1.1). MCClientConnectionKeysErased.cfg with the idle
\* timeout equal to the total deadline, so the client can reach connection
\* response (3) with one tick of the deadline left and stay there for it.
\* Sending connection response never ends with the token expiry
\* (NoConnectClockAfterResponse). The state is reachable: the reversed
\* witness MCClientConnectionBrokenDeadlineInResponse.cfg differs only in
\* the deadline predicate and reaches it.
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 3
    Deadline         = 3
    ServerDeadline   = 3
    MaxAttempts      = 1
    MaxNonces        = 1
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = TRUE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    SafetyInvariants
    KeysErasedWhenDown
PROPERTIES
    NoConnectClockAfterResponse
