\* The re-try's liveness at MCRNPathProbeServerList.cfg's instance (server list {3, 1}, every capacity 0 .. 3 each way): the client's middle size, never answered, is re-tried for ever and every wait ends (WaitEnds), and RetryReaches holds with nothing carried to reach; with every invariant; split from MCRNPathProbeServerList.cfg on 2026-11-26, as MCRNPathProbeRetry.cfg.
SPECIFICATION FairSpec

CONSTANTS
    ClientSet     = {3, 2, 1}
    ServerList    = {3, 1}
    CapsUp        = {0, 1, 2, 3}
    CapsDown      = {0, 1, 2, 3}
    K             = 2
    MaxBursts     = 1
    AttackBudget  = 1
    AttackKinds   = {"replay", "probe", "reply"}
    Forger        = FALSE
    Timed         = TRUE
    LossBound     = TRUE
    MaxReuses     = 0
    ReuseCapsUp   = {}
    ReuseCapsDown = {}
    Broken        = "none"

INVARIANTS
    TypeOK
    RaisedWithinPath
    ServerNeverAhead
    FailOnlyAtP0
    NeverAtRuledOut
    NeverAboveRuled
    RuledIsTheNextStep
    ReplyOnlyConnected
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate
    NoWrongRuleOut

PROPERTIES
    WaitEnds
    RetryReaches
