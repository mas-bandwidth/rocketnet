\* MCRNMsgxReceiveFill with StopCountSkipsWorker: the stop leaves the worker's bank out of its count when the worker has moved on from main's bank, so what that bank holds is never handed to the server and never counted. Must fail StopCounted.
SPECIFICATION Spec
CONSTANTS
    Sockets = 2
    Capacity = 3
    Batch = 2
    Budget = 3
    Buffer = 3
    CallCaps = {1, 3}
    MaxArrivals = 7
    MaxErrors = 2
    ReadPastRoom = FALSE
    ReadPastBudget = FALSE
    HoldWithoutMove = FALSE
    FreeNotReset = FALSE
    ReadOnlyLeft = FALSE
    StopCountSkipsWorker = TRUE
INVARIANTS TypeOK StopCounted
