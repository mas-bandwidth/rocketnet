\* MCRNRttFilterBrokenGapNeverRises: MCRNRttFilterLive under v1.1.0's rule:
\* a sparse sender ends a silence at every ack, and a sample above srtt is
\* refused, so the estimate never rises to the slower path.
SPECIFICATION LiveSpec
CONSTANTS
    Probe     = 3
    RttLow    = 0
    RttHigh   = 2
    OutageMax = 2
    M         = 1
    P         = 2
    Rule      = "gap"
    FirstAck  = FALSE
PROPERTY
    SlowPathRaisesEstimate
