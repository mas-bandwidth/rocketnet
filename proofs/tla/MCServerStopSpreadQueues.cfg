\* MCServerStopSpread with two send queues: two slots, three connections (sessions 1 and 3 on queue 1, 2 on queue 0), bursts of two, a staging of two frames on each queue and a ring of four; either queue may jam. Every invariant, and only a burst bound for a jammed queue is ever abandoned for want of room. Must pass.
SPECIFICATION Spec

CONSTANTS
    SlotCount   = 2
    MaxSessions = 3
    Burst       = 2
    BankSize    = 2
    QueueCount  = 2
    RingSize    = 4
    SteadyCap   = 2
    Defect      = "none"

INVARIANTS
    TypeOK
    RingHolds
    SealedWithinBurst
    NoRefusedStart
    WithinBank
    RingIsOwed
    HeadNeverDone
    FullBurstBeforeStopped
    NoSendCutAtStop
    NoDropWhileRoomCanReturn
    EachBurstSettledOnce
    OnlyJammedQueuesDrop
