\* MCFragmentsAndAcksWitWalkskip: wit-walkskip, a reversed witness. Witness "walkskip"
\* on the bits instance: the walk skips the lowest set unacknowledged bit; expected
\* to violate WalkVisitsUnacked (README-FragmentsAndAcks.md).
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq       = 4
    SentRing     = 2
    AggRing      = 2
    BatchCap     = 1
    Window       = 4
    MaxRanges    = 2
    Slots        = 1
    IdSpace      = 8
    FirstId      = 1
    StaleAhead   = 2
    StaleRule    = "code"
    MaxGen       = 1
    MaxCount     = 3
    Counts       = {2, 3}
    Stride       = 2
    FinalBytes   = 1
    MaxPayload   = 5
    MaxFragment  = 3
    DrainCap     = 4
    DeliveredCap = 2
    DefectIds    = {}
    Burns        = TRUE
    Witness      = "walkskip"
    D2RPattern   = "arbitrary"
    R2DPattern   = "none"
    Capacity     = 1
    MaxDelay     = 0
    Duplication  = FALSE
    Reordering   = FALSE
    BurstStart   = 3
    BurstLen     = 2

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    DeliveredExact
    DeliveredOnce
    CompleteDelivers
    ArenaBounded
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked

