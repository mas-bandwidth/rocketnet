\* MCRNRioWorker reversed witness: send_packets opens the next phase while
\* its sends are still posted.  Three staged sends, so the rotation comes
\* back to phase 0.  Must fail FillPhaseOwnedByMain.
SPECIFICATION Spec

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 2
    NumBanks        = 3
    Cap             = 2
    View            = 4
    MaxDatagrams    = 0
    MaxSends        = 3
    SwitchOnIdle    = FALSE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    TypeOK
    FillPhaseOwnedByMain
