\* MCRNUringDriver liveness, the send side: the rule of MCRNUringDriver.cfg
\* under SpecFair, every slot handed to the kernel free again.
SPECIFICATION SpecFair

CONSTANTS
    Slots             = 2
    Buffers           = 2
    MaxSteps          = 2
    Budget            = 1
    Room              = 2
    ReapWithinRoom    = TRUE
    ResetWaitsForReap = TRUE
    ReapIntoFill      = TRUE
    BoundedReap       = TRUE
    RearmOnReceive    = TRUE
    RunRetiredByCqe   = TRUE

INVARIANTS
    TypeOK

PROPERTIES
    SubmittedEventuallyFree
