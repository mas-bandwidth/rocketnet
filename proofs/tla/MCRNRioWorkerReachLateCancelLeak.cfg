\* MCRNRioWorker reachability: create's inline drain leaks after a
\* closesocket that succeeded, because the cancelled receives reach the
\* completion queue after the last stalled pass.  The code can do this
\* (rocketnet_rio_create_failed_drain counts a pass that found no
\* cancellation yet as stalled), and the model before CancelArrives could
\* not: its close queued every cancellation at once.  The constants of
\* MCRNRioWorkerInlineStop.cfg.  Must fail NotReachedLateCancelLeak.
SPECIFICATION Spec

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 5
    NumBanks        = 2
    Cap             = 2
    View            = 2
    MaxDatagrams    = 1
    MaxSends        = 0
    DrainBatch      = 2
    StopDrainWaits  = 1
    InlineStop      = TRUE
    BoundedStopDrain = TRUE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    TypeOK
    NotReachedLateCancelLeak
