\* When Endpoint = "clientio", Start is the three-ring worst case
\* (ROCKETNET_CLIENT_IO_NUM_RINGS = 3): ring 0 half-sent (sending),
\* ring 1 ready (handedoff), ring 2 filling and handed over as final
\* by RequestStop. Other endpoints leave every ring empty.
SPECIFICATION FairSpec
CONSTANTS
 Endpoint = "clientio"
 NumWorkers = 1
 MaxGenerations = 2
 StuckWorker = 1
 Defect = "none"
INVARIANTS TypeOK CompletionMeansQuiescent FreedOnlyAfterJoin RetainedUntilQuiescent StoppedSocketDrained NoUnreadDiscard NoWakeAfterClose NoReuseBeforeComplete CallbackOnce NeverStartedComplete RequestNeverWaits PollNeverWaits StuckRemainsPending
PROPERTIES RequestReturns PollReturns DestroyCompletes
