\* Finish after a lease reset drops the event: FinishRecordsRefusal FALSE
\* sets silent instead of refused, and FinishAfterResetRecorded falls.
\* Must fail.
SPECIFICATION Spec

CONSTANTS
    MaxFrames                = 4
    MaxStaged                = 3
    MaxBurst                 = 2
    DisconnectAdvancesStaged = TRUE
    XdpBuffers               = 3
    FinishRecordsRefusal     = FALSE

INVARIANTS
    FinishAfterResetRecorded
