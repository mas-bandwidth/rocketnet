\* MCRNUringDriver reversed witness: stop at room.  HoldWithoutRoom <-
\* MCStopAtRoom (FALSE) leaves a receive CQE the fill bank has no room for
\* in cq and ends the call at it, as the code did before the hold: the CQ
\* is a FIFO, so the reap stopped there and a send CQE behind it waited for
\* a swap.  A send call ends with budget left and a send CQE in cq.
\* Must fail the action property NoCallEndsBehindRoom.
SPECIFICATION Spec

CONSTANTS
    Slots             = 2
    Buffers           = 2
    MaxSteps          = 2
    Budget            = 1
    Room              = 2
    ReapWithinRoom    = TRUE
    ResetWaitsForReap = TRUE
    ReapIntoFill      = TRUE
    BoundedReap       = TRUE
    RearmOnReceive    = TRUE
    RunRetiredByCqe   = TRUE
    HoldWithoutRoom   <- MCStopAtRoom

INVARIANTS
    TypeOK

PROPERTIES
    NoCallEndsBehindRoom
