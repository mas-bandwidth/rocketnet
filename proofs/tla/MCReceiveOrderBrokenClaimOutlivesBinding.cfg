\* Reversed witness: ResponseBind writes the binding but leaves its
\* request claim live; BoundHasNoOwnClaim must fail.
SPECIFICATION MCSpec

CONSTANTS
    PosRestart   = 1
    PosVersion   = 2
    PosTimestamps = 3
    PosCompares  = 4
    PosCookie    = 5
    PosUsed      = 6
    PosAdmitted  = 7
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 10
    PosKeypair   = 11
    ResponseBindReleasesClaim <- MCResponseBindLeavesClaim

INVARIANTS
    TypeOK
    BoundTypeOK
    BoundHasNoOwnClaim
