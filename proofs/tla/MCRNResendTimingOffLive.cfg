\* MCRNResendTimingOffLive: the reliable timeout off (one tick is 500 ms), resend
\* delay initial and maximum 1000 ms (2), a 4 s horizon (8). The small record and
\* the chunk; every send before tick 4 may be lost for ever, and a copy sent from
\* tick 4 on is acknowledged (GoodAck, strong fairness). After the last bad
\* interval every number is acknowledged: the probe holds the chunk while U is
\* stalled and progress releases it.
SPECIFICATION LiveSpec
CONSTANTS
    RtoInitial  = 2
    RtoMin      = 1
    RtoMax      = 2
    Timeout     = 8
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    TimeoutOn   <- TimeoutOff
    GoodFrom    <- GoodFromMid
INVARIANTS
    TypeOK
    NoDueRecordHeld
    OffMeansNoStallEnd
    DueMeansWritten
PROPERTIES
    EveryReliableAcked
