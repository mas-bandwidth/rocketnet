\* Reversed witness: the start takes a descriptor and links its span
\* (rn_span_link) before the floor test, and on no room undoes the link with
\* rn_span_unlink, which leaves span_tail past the span it unlinked. The
\* refusal instance (MCRNSendSpansRefuse.cfg) with LinkFirst = TRUE. Must
\* violate RefuseLeavesRing.
SPECIFICATION Spec

CONSTANTS
    SR            = 96
    Lengths       = {32, 96}
    Q             = 3
    FloorAtOldest = TRUE
    PadOnWrap     = TRUE
    SpliceBoth    = TRUE
    RefuseExhausts = FALSE
    LinkFirst     = TRUE
    CountMod      = 3
    UndoTail      = TRUE

INVARIANTS
    TypeOK

PROPERTIES
    RefuseLeavesRing
