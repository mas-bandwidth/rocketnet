\* A queued forget that leaves another slot's record of its address: that slot,
\* back at the address and holding the mark the commit deletes, is not marked
\* again (KernelHoldsMark).
SPECIFICATION MCSpec

CONSTANTS
    s1              = s1
    s2              = s2
    a1              = a1
    a2              = a2
    NONE            = NONE
    Slots           = {s1, s2}
    Addrs           = {a1, a2}
    MaxHigh         = 1
    SkipWhileOwed   = TRUE
    ClearOnAccept   = TRUE
    ForgetRefusable = TRUE
    MarkSupersedes  = TRUE
    ForgetSupersedes = FALSE

INVARIANT KernelHoldsMark
