\* MCServerStopSpread reversed witness: the stop step tells the I/O to stop once the ring is empty, without waiting for the transport to finish the sends it flushed (the stop before send_idle). A flushed disconnect packet is cut off. Must fail NoSendCutAtStop.
SPECIFICATION Spec

CONSTANTS
    SlotCount   = 2
    MaxSessions = 4
    Burst       = 2
    BankSize    = 3
    RingSize    = 4
    SteadyCap   = 2
    Defect      = "stopinflight"

INVARIANT NoSendCutAtStop
