\* MCRNResendTimingBrokenRefusedClock: the reversed witness of a refused first
\* send. The refusal records the first send and stamps the due-now sentinel (the
\* code before the fix), so the reliable timeout runs from the refusal: a record
\* refused at ticks 0 to 7 and then sent at 8, 12 and 16 has three sends at tick
\* 20 where MinAttempts are owed. It must fail AttemptsBeforeTimeout.
SPECIFICATION Spec
CONSTANTS
    RtoInitial   = 4
    RtoMin       = 1
    RtoMax       = 4
    Timeout      = 20
    MaxBackoff   = 1
    MinAttempts  = 4
    RefuseFor    <- RefuseForLong
    StampRefused <- StampRefusedOn
INVARIANTS
    TypeOK
    AttemptsBeforeTimeout
