\* MCRNRioWorker reversed witness: create's failure path retries the stop
\* pass forever (the old `while ( !rocketnet_server_rio_stopped( rio ) )`
\* loop).  A closesocket refused on every pass never stops and never
\* leaks.  The constants of MCRNRioWorkerInlineStop.cfg with
\* BoundedStopDrain FALSE.  Must fail StopCompletes.
SPECIFICATION SpecFair

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 5
    NumBanks        = 2
    Cap             = 2
    View            = 2
    MaxDatagrams    = 1
    MaxSends        = 0
    DrainBatch      = 2
    StopDrainWaits  = 1
    InlineStop      = TRUE
    BoundedStopDrain = FALSE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    TypeOK

PROPERTIES
    StopCompletes
