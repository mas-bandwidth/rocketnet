\* Reversed witness: v1.0's send-side kick (Broken = "SendKick"): the send
\* the full capacity cannot take ends the connection with
\* MESSAGE_MEMORY_EXHAUSTED. Must violate SendNeverEnds, an action property,
\* at the refusing start step.
SPECIFICATION Spec
CONSTANTS
    Scenario = "mixed"
    Broken = "SendKick"
    SendCapacity = 2
    OrderedCapacity = 2
    HoldCapacity = 2
    TransportCaps = {1, 2}
INVARIANTS
    TypeOK
PROPERTIES
    SendNeverEnds
CHECK_DEADLOCK FALSE
