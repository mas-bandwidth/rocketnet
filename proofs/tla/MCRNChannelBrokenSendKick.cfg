\* Reversed witness: v1.0's send-side kick (Broken = "SendKick"): the send
\* the full capacity cannot take ends the connection with
\* MESSAGE_MEMORY_EXHAUSTED. Must violate SendNeverEnds.
SPECIFICATION Spec
CONSTANTS
    Scenario = "mixed"
    Broken = "SendKick"
    SendCapacity = 2
    OrderedCapacity = 2
    HoldCapacity = 2
INVARIANTS
    TypeOK
    SendNeverEnds
CHECK_DEADLOCK FALSE
