\* Scope witness: PassFair is a one-queue rule. With several send queues the
\* burst at the head is passed for its full queue, the burst behind it is
\* sealed, and the pass ends with the head unsealed (PassFair).
SPECIFICATION MCSpec

CONSTANTS
    SteadyCap     = 2
    K             = 2
    Bursts        = 6
    SteadyCapExact = TRUE
    CursorWrapAt  = TRUE
    CursorDrops   = TRUE
    DropResetsCursor = TRUE
    Queues        = 2
    AbandonQueuePops = TRUE

INVARIANT PassFair
