\* MCRNPacketLease reversed witness: retired, as it was, which reads the old entry's
\* fields without rereading the state.  A concurrent insert that reuses the
\* entry races with the read.  Must fail NoRacyRead.
SPECIFICATION Spec

CONSTANTS
    Capacity          = 4
    Threads           = {1, 2}
    Frames            = {1, 2}
    Vals              = {1, 2}
    HashSpread        = 1
    MaxOps1           = 2
    MaxOps2           = 1
    MaxResets         = 2
    EpochLimit        = 2
    UsedLimit         = 2
    UseCas            = TRUE
    ConsumeCas        = TRUE
    BumpEpoch         = TRUE
    EpochLimited      = TRUE
    RetiredOn         = TRUE
    RetiredValidates  = FALSE
    OnWriting         = {"skip"}
    ValidCallers      = FALSE

INVARIANTS
    TypeOK
    NoRacyRead
