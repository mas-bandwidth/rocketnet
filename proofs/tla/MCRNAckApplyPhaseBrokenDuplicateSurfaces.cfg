\* MCRNAckApplyPhaseBrokenDuplicateSurfaces: reversed witness: a block the
\* client's endpoint has acknowledged already gives its id again when it is
\* applied (as if process_block marked acknowledged records a second time).
\* The shortest trace is the inline path: the same block applied twice while
\* the phase is closed publishes its id twice (README-RNAckApplyPhase.md). A
\* queued duplicate would publish it twice at the finish the same way. Must
\* fail Published.
SPECIFICATION Spec

CONSTANTS
    Clients             = {0, 1}
    Threads             = {main, g1, g2}
    Main                = main
    MinBlock            = 1
    MaxBlock            = 2
    MaxRanges           = 1
    RangeCounts         = {0, 1}
    PendingCap          = 3
    RangesCap           = 2
    ExchangeTake        = TRUE
    CloseAppliesUntaken = TRUE
    CloseClearsClaim    = TRUE
    SettleOnlyReceiving = TRUE
    GatherWhenFull      = TRUE
    AdvanceTail         = TRUE
    DupGivesNothing     = FALSE

INVARIANTS
    TypeOK
    Published
