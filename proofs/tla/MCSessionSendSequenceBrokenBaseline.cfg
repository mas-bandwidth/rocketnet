\* Reversed witness: the ack baseline read as the next sequence less one (the
\* code before 2026-10-29); a fill holding a taken, unsealed sequence moves
\* it, and BaselineIsHighestSealed must fail.
SPECIFICATION MCSpec

CONSTANTS
    MaxSeq = 5
    Fills  = {f1, f2}
    Broken = "baseline"

INVARIANT BaselineIsHighestSealed
