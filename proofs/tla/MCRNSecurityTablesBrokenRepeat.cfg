\* Reversed witness: RepeatRung <- MCNoRepeatRung (FALSE), the code before
\* 2026-11-13.  A refusal past the verify that charges nothing (a client id
\* already connected, a full server) holds nothing for the update, so the
\* sender's same request is verified again at once: it takes the whole work
\* budget before the honest request in every update, and
\* HonestConnectsUnderFlood fails.
SPECIFICATION RepeatSpec

CONSTANTS
    None = None
    Addrs = {"A", "B"}
    Tokens = {"th", "te", "tf"}
    Expire <- MCExpire
    Cid <- MCCid
    MaxClock = 4
    CookieLife = 1
    RotatePeriod = 2
    MaxClients = 2
    HistoryCap = 2
    AdmittedCap = 2
    VerifyBudget = 2
    HandshakeDeadline = 4
    Rotation = TRUE
    AcceptPrevious = TRUE
    RefuseAdmittedAtResponse = TRUE
    RequestChecksExpiry = TRUE
    EvictLiveHistory = TRUE
    DeniedConsumesToken = FALSE
    CapVerifyBudget = TRUE
    PreviousOutlivesWindow = FALSE
    BindAtRequest = FALSE
    Holds <- MCHolds
    HoldUntilExpire = FALSE
    CheckCidAtResponse = TRUE
    RepeatRung <- MCNoRepeatRung

INVARIANTS
    FloodInvariants

PROPERTIES
    HonestConnectsUnderFlood

CHECK_DEADLOCK FALSE
