\* MCRNGsoHandoff reversed witness: a message the kernel refuses with a hard error is dropped uncounted, as if rocketnet_server_gso_flush skipped it without adding its packets to SEND_DROPPED. SentOrHeld falls. Must fail. The instance of MCRNGsoHandoffLive.cfg.
SPECIFICATION SpecFair

