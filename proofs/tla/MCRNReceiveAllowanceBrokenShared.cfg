    MaxPkt       = 2
    T            = 2
    Horizon      = 5
    FloodPerTick = 2
    MaxNet       = 3
    MaxBack      = 1
    MaxReconnect = 1
    Refill       = TRUE
    CapFull      = TRUE
    PerClient    = FALSE
    Monotone     = TRUE
    MaxElicit    = 0
    Kinds        = {"pay"}
