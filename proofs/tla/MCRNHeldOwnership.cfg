\* MCRNHeldOwnership: the fixed code. A cancelled block frees only its own
\* descriptors, a held entry is checked by number and owner, the index holds
\* at most W entries and its erase stops after N cells. Every invariant holds.
SPECIFICATION Spec

CONSTANTS
    W                 = 2
    Keys              = {1, 2, 3, 4}
    Homes             <- AllHomes
    MaxNum            = 8
    MaxCount          = 2
    NumberOnlyRelease = FALSE
    NoOccupancyBound  = FALSE
    NoIdentityCheck   = FALSE
    UnboundedErase    = FALSE

INVARIANTS
    TypeOK
    ReleaseOwned
    HeldNamesLive
    HeldBound
    EraseEnds
    NoStaleDelivery
