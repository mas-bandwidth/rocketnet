\* MCLinkSlotStoreReorders.cfg: the slot store does not keep send order: send 1, send 2, receive 1, send 3 puts 3 in slot 0 ahead of 2, failing SurvivorsInOrder as the code does.
SPECIFICATION SpecSlotStore
CONSTANTS
    Packets     = {1, 2, 3, 4, 5}
    Capacity    = 1
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = FALSE
    Pattern     = "none"
    BurstStart  = 1
    BurstLen    = 2
    MaxSeq      = 5
    StoreSlots  = 2
    Defect      = "none"
INVARIANT SurvivorsInOrder
