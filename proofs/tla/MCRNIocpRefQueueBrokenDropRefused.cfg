\* MCRNIocpRefQueue reversed witness: a refused push drops its operation, as rocketnet_iocp_release_send and rocketnet_iocp_post_receive retire it today. Two cells, at most two operations live: a consumer claims position 0 and stalls before freeing the cell, the other pops position 1, and the push at position 2 reads cell 0's sequence 1 and is refused with the queue not full. RefusedNeverLost falls. Must fail.
SPECIFICATION Spec

CONSTANTS
    Cap         = 2
    PosMod      = 32
    InitSlack   = 0
    Producers   = {p1}
    Consumers   = {c1, c2}
    MaxTok      = 3
    Ops         = 2
    DropRefused = TRUE

INVARIANT RefusedNeverLost
