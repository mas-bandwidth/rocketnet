\* Reach case, not a property of the code: the client I/O worker's exit
\* drains the socket in bounded reads and then closes it, and a datagram
\* that arrives after the drain's last read (or past DiscardCap) goes with
\* the close, unread and uncounted, as rocketnet_client_io_discard_at_stop
\* does. NoCloseLoss must fail, showing that gap is in the model.
SPECIFICATION Spec
CONSTANTS
 Endpoint = "clientio"
 NumWorkers = 1
 MaxGenerations = 2
 StuckWorker = 0
 Defect = "none"
INVARIANTS TypeOK NoCloseLoss
