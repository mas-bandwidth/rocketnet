\* MCFragmentsAndAcksBatchAtBound: the find-batchfull instance with
\* DeliveredCap at the delivered bound. DrainCap 4 and Slots 2 give
\* (N + min(N, Slots)) / 2 = 3, and DeliveredCap is 3. Reordering stays
\* on and Capacity stays 2, which is the schedule that drops a completion
\* below the bound. The ack link stays idle (AckLinkIdle): that schedule
\* sends no ack, and an ack step does not change reassembly, so the pass
\* of BatchFullNeverFires finishes inside the budget. The below-bound
\* witness is MCFragmentsAndAcksFindBatchFull.cfg.
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq       = 8
    SentRing     = 4
    AggRing      = 2
    BatchCap     = 1
    Window       = 4
    MaxRanges    = 2
    Slots        = 2
    IdSpace      = 8
    FirstId      = 1
    StaleAhead   = 2
    StaleRule    = "serial"
    MaxGen       = 4
    MaxCount     = 3
    Counts       = {2}
    Stride       = 2
    FinalBytes   = 1
    MaxPayload   = 5
    MaxFragment  = 3
    DrainCap     = 4
    DeliveredCap = 3
    DefectIds    = {}
    Burns        = FALSE
    Witness      = "none"
    D2RPattern   = "none"
    R2DPattern   = "none"
    Capacity     = 2
    MaxDelay     = 0
    Duplication  = FALSE
    Reordering   = TRUE
    BurstStart   = 3
    BurstLen     = 2

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    DeliveredExact
    DeliveredOnce
    CompleteDelivers
    ArenaBounded
    BatchFullNeverFires
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked

CONSTRAINTS
    AckLinkIdle
