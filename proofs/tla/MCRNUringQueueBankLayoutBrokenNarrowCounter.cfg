\* Reversed witness: the claim counter wraps at S + 1, as a counter too
\* narrow for the claims one fill can make would; the refused claims carry
\* it round to 0 and slot 0 is handed out a second time while it is
\* claimed.  Must violate NoSharedSlot.
SPECIFICATION MCSpec

CONSTANTS
    Q           = 2
    NB          = 2
    S           = 3
    Stride      = 2
    Threads     = {1, 2}
    Dests       = {1, 2, 3}
    QueueOf     <- MCQueueOf
    Demand      = 4
    MaxFlush    = 2
    Skew        = {-1, 0, 1}
    ClaimCmp    = "ge"
    CounterWrap = 4
    SlotRule    = "check"
    IdRule      = "mul"

INVARIANTS
    TypeOK
    NoSharedSlot
