\* A passing control for the claim's clip at the capacity: two threads on one line at an odd capacity of five, the ring exactly the capacity, a chunk of two and the guard for one line. Both threads can pass the guard at count 2 (5 - 2 >= 2); one claims base 2, and the other's claim then gets base 4, clipped to end 5 = base + 1, the one-slot claim that installs nothing. The even capacity of the main control never reaches it. Every rule on, every invariant.
SPECIFICATION MCSpec

CONSTANTS
    Threads       = {t1, t2}
    LineOf        <- MCOneLine
    Cap           = 5
    RingSize      = 5
    Stride        = 2
    WrongStride   = 1
    Chunk         = 2
    GuardLines    = 1
    MaxCount      = 6
    Clamp         = TRUE
    FullTest      = TRUE
    RecoverStride = TRUE
    ReturnClear   = TRUE
    LostClear     = TRUE

INVARIANTS
    TypeOK
    InBounds
    ExactSend
    HeldExclusive
    ChunksBelowCap
