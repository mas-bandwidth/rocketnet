\* MCRNUringDriver: the committed run, the rule: every invariant and the
\* action property; the liveness properties are checked by
\* MCRNUringDriverLiveSends.cfg and MCRNUringDriverLiveReceive.cfg, each
\* in its own run budget.  Two slots, two ring buffers, two datagrams, two
\* swaps and a budget of one CQE per call.  The reversed witnesses
\* are MCRNUringDriverBrokenResetBeforeReap.cfg,
\* MCRNUringDriverBrokenOneBank.cfg,
\* MCRNUringDriverBrokenUnboundedReap.cfg,
\* MCRNUringDriverBrokenNoRearmRetry.cfg,
\* MCRNUringDriverBrokenFreeRunAtSubmit.cfg,
\* MCRNUringDriverBrokenUnboundedFill.cfg and
\* MCRNUringDriverBrokenStopAtRoom.cfg beside this one.  Submit may
\* send the two slots as one segmented run.
SPECIFICATION SpecFair

CONSTANTS
    Slots             = 2
    Buffers           = 2
    MaxSteps          = 2
    Budget            = 1
    Room              = 2
    ReapWithinRoom    = TRUE
    ResetWaitsForReap = TRUE
    ReapIntoFill      = TRUE
    BoundedReap       = TRUE
    RearmOnReceive    = TRUE
    RunRetiredByCqe   = TRUE

INVARIANTS
    TypeOK
    NoReuseWhileKernelOwned
    ExposedStable
    BufferReturnedAfterCopy
    FreedOnlyWhenDrained
    ReapWithinBudget
    FillWithinRoom
    HeldStillFilled

PROPERTIES
    NoCallEndsBehindRoom
