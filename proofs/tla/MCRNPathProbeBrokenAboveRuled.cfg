\* A rule-out does not stop the walk: the server's list lacks the client's middle size, 2 is ruled out, and the broken walk goes on to 3, above the size ruled out.
SPECIFICATION Spec

CONSTANTS
    ClientSet     = {3, 2, 1}
    ServerList    = {3, 1}
    CapsUp        = {3}
    CapsDown      = {3}
    K             = 2
    MaxBursts     = 0
    AttackBudget  = 0
    Forger        = FALSE
    Timed         = TRUE
    Broken        = "aboveruled"

INVARIANT NeverAboveRuled
