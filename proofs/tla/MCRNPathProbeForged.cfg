\* A forger at the client's address sends packets without limit: they reach the open and fail, spend nothing, and the walk still reaches the largest carried size.
SPECIFICATION FairSpec

CONSTANTS
    ClientSet     = {3, 2, 1}
    ServerList    = {3, 2, 1}
    CapsUp        = {1, 3}
    CapsDown      = {1, 3}
    K             = 2
    MaxBursts     = 1
    AttackBudget  = 0
    Forger        = TRUE
    Timed         = TRUE
    Broken        = "none"

INVARIANTS
    TypeOK
    RaisedWithinPath
    OneReplyPerUpdate

PROPERTIES
    ForgedNeverStarves
    Converges
