\* A forger at the client's address sends probes without limit: its probes reach the open and fail, spend nothing, and the client connects whenever a candidate fits.
SPECIFICATION FairSpec

CONSTANTS
    Ceiling      = 3
    CapsUp       = {0, 1, 3}
    CapsDown     = {0, 1, 3}
    W            = 2
    MaxLoss      = 1
    AttackBudget = 0
    Forger       = TRUE
    Deadline     = 0
    Budget       = 0
    ClientSet    = {3, 2, 1}
    ServerList   = {3, 2, 1}
    Timed        = TRUE
    Broken       = "none"

INVARIANTS
    TypeOK
    SlotAgrees
    ReplyOnlyProven
    OneReplyPerUpdate

PROPERTIES
    ForgedNeverStarves
    Ends
