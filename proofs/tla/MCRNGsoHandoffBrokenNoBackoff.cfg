\* MCRNGsoHandoff reversed witness: after a stalled pass (a full bank or a failed receive) the RX worker goes straight back to poll and the receive mutex instead of sleeping 1ms, the full-bank spin. RxBacksOff falls. Must fail.
SPECIFICATION SpecFair

CONSTANTS
    RxCap            = 2
    TxCap            = 2
    MaxRx            = 4
    MaxTx            = 4
    PublishWhileHeld = FALSE
    MainBlocks       = FALSE
    FullDrops        = FALSE
    CarryBehind      = FALSE
    NoBackoff        <- NoBackoffBroken

INVARIANTS
    TypeOK
    RxOneOwner
    TxOneOwner
    TxQueuesDistinct
    NoPublishWhileHeld
    StagedBeforeClaimInView
    RxBacksOff
    FreeIsEmpty
    SentOrHeld
    RxInOrder
    TxInOrder
    MainNeverWaits
    StopJoinsBeforeFree
    ExitSentAll

PROPERTIES
    StopCompletes
