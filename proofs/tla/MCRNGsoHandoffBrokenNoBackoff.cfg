\* MCRNGsoHandoff reversed witness: after a stalled pass (a full buffer that cannot be published, or a failed receive) the RX worker goes straight back to poll instead of sleeping 1ms, the full-buffer spin. RxBacksOff falls. Must fail. Five datagrams: a stall needs a full worker buffer behind a waiting ready one with a datagram still arriving.
SPECIFICATION SpecFair

CONSTANTS
    RxCap            = 2
    TxCap            = 2
    MaxRx            = 5
    MaxTx            = 4
    PublishWhileHeld = FALSE
    MainBlocks       = FALSE
    FullDrops        = FALSE
    CarryBehind      = FALSE
    NoBackoff        <- NoBackoffBroken

INVARIANTS
    TypeOK
    RxOneOwner
    TxOneOwner
    TxQueuesDistinct
    NoPublishWhileHeld
    RxBacksOff
    FreeIsEmpty
    SentOrHeld
    RxInOrder
    TxInOrder
    MainNeverWaits
    StopJoinsBeforeFree
    ExitSentAll

PROPERTIES
    StopCompletes
