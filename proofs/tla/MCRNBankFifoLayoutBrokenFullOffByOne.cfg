\* MCRNBankFifoLayout reversed witness: the free test one late
\* (free_count == -1 instead of 0).  A publish at free_count = 0 pops a stale
\* free position.  Must fail ExactlyOnePlace.
SPECIFICATION Spec

CONSTANTS
    N         = 3
    ArrLen    = 3
    ConsMax   = 1
    MaxReady  = 3
    MaxPub    = 8
    FreeSlack = 1
    HeadMod   = 3
    TailMod   = 3
    PushKind  = "fifo"
    PopKind   = "fifo"
    InitKind  = "literal"

INVARIANTS
    TypeOK
    ExactlyOnePlace
