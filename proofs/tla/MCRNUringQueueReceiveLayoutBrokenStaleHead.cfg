\* Reversed witness: the worker never loads head again after its first
\* look says the bank is full, so it drops BANK_FULL while main has
\* released slots.  Must violate FullOnlyWhenFull.
SPECIFICATION MCSpec

CONSTANTS
    S           = 3
    B           = 4
    TailWrap    = 8
    MaxArrive   = 5
    MaxSegs     = 2
    DrainMax    = 2
    RoomRule    = "stale"
    SlotRule    = "mod"
    ReleaseRule = "next"
    CounterWrap = 0

INVARIANTS
    TypeOK
    FullOnlyWhenFull
