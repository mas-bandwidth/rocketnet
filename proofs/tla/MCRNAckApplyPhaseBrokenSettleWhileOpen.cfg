\* MCRNAckApplyPhaseBrokenSettleWhileOpen: reversed witness: the main thread
\* settles a client while the clients are open to the takers, so the main
\* thread and a taker both apply it.  Must fail OneTaker.
SPECIFICATION Spec

CONSTANTS
    Clients             = {0, 1}
    Threads             = {main, g1, g2}
    Main                = main
    MinBlock            = 1
    MaxBlock            = 2
    MaxRanges           = 1
    RangeCounts         = {0, 1}
    PendingCap          = 3
    RangesCap           = 2
    ExchangeTake        = TRUE
    CloseAppliesUntaken = TRUE
    CloseClearsClaim    = TRUE
    SettleOnlyReceiving = FALSE
    GatherWhenFull      = TRUE
    AdvanceTail         = TRUE

INVARIANTS
    TypeOK
    OneTaker
