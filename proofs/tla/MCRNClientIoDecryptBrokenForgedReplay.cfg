\* MCRNClientIoDecrypt reversed witness: a forged record whose sequence
\* update's window already holds is counted as an integrity failure (the
\* rule before the replay check came first), so at the limit of one it ends
\* a session rocketnet_client_open_session keeps.  Must fail
\* ReplayedForgeryNotCounted.
SPECIFICATION Spec

CONSTANTS
    BufferCap        = 2
    MaxDatagrams     = 4
    MaxSeq           = 3
    W                = 1
    MaxReplays       = 0
    MaxForged        = 1
    IntegrityLimit   = 1
    OpenBeforeReplay = FALSE
    SharedWindow     = FALSE
    NoRetire         = FALSE
    CountOnIo        = FALSE
    NoPayloadGate    = FALSE
    ForgedReplayFails = TRUE

INVARIANTS
    TypeOK
    CheapRefusalsFirst
    NoOpenWithoutKeys
    IoWindowWithinMain
    PayloadOpenedOnlyConnected
    AcceptedOnce
    SingleWriter
    ExposedStable
    NoReceiveStall
    RetiredZeroed

PROPERTIES
    ReplayedForgeryNotCounted
