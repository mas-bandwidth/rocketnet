    Cap       = 2
    PosMod    = 32
    InitSlack = 0
    Producers = {p1, p2}
    Consumers = {c1, c2}
    MaxTok    = 5

INVARIANTS
    TypeOK
    NoOverwrite
    NoPhantom
    WithinCapacity
    CellsMatchPositions
    InqIsCells
