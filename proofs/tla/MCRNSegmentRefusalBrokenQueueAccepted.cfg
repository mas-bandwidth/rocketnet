\* Reversed witness: the accepted flag is the queue's alone (AcceptedRule
\* "queue", the io_uring code before).  Destination d1's segmented send is
\* accepted on queue 0; d2 and d3 refuse on queue 1, whose own flag says none
\* was accepted, so queue 1 stops segmenting after an accepted send.  Must violate
\* NoFallbackAfterAccepted.
SPECIFICATION Spec

CONSTANTS
    Dests          = {"d1", "d2", "d3", "d4"}
    Refusing       = {"d2", "d3"}
    KernelSegments = TRUE
    Threshold      = 2
    MaxRuns        = 6
    Mode           = "perdest"
    Slot           <- SlotDistinct
    Queue          <- QueueSplit
    AcceptedRule   = "queue"

INVARIANTS
    TypeOK
    NoFallbackAfterAccepted
