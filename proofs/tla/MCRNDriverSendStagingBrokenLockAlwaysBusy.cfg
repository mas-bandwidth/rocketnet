\* MCRNDriverSendStaging reversed witness for the fairness assumption: weak
\* fairness on the whole publish step, busy tries of the handoff lock
\* included. A run whose every flush finds the lock held keeps the producer
\* staged forever, and XdpStagedEventuallyPublished falls. Must fail.
SPECIFICATION SpecFairLockAlwaysBusy

CONSTANTS
    MaxFrames                = 4
    MaxStaged                = 3
    MaxBurst                 = 2
    DisconnectAdvancesStaged = TRUE
    XdpBuffers               = 3
    FinishRecordsRefusal     = TRUE
    AbortDisarmsSlot         = TRUE

PROPERTIES
    XdpStagedEventuallyPublished
