\* MCRNBankFifoLayoutPosted reversed witness: the ready tail taken modulo the
\* array's ROCKETNET_CLIENT_IOCP_RECEIVES (4) while the head advances modulo
\* num_receives (3).  Must fail ReadyMatches.
SPECIFICATION Spec

