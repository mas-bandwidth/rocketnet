    N         = 3
    ArrLen    = 4
    ConsMax   = 3
    MaxReady  = 3
    MaxPub    = 8
    FreeSlack = 0
    HeadMod   = 3
    TailMod   = 4
    PushKind  = "fifo"
    PopKind   = "fifo"
    InitKind  = "posted"

INVARIANTS
    TypeOK
    ReadyMatches
