\* MCClientConnectionF8Terminal.cfg: TerminalAbsorbing holds.
\* A terminal state leaves only by connect, to 1, or by disconnect, to 0.
\* This instance reaches -2 on a silent server and may disconnect or connect
\* again. The full environment does not finish once the property holds.
SPECIFICATION Spec
CONSTANTS
    SendInterval     = 1
    Timeout          = 2
    Deadline         = 0
    ServerDeadline   = 0
    MaxAttempts      = 2
    MaxNonces        = 1
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = FALSE
    Disconnects      = TRUE
    ServerMute       = TRUE
    ServerPayloads   = FALSE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "none"
    S2CPattern       = "none"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = FALSE
    Reordering       = FALSE
    BurstStart       = 1
    BurstLen         = 2
PROPERTIES
    TerminalAbsorbing
