\* MCRNWindowBrokenNoAcksLand: the reversed witness of the liveness case.
\* MCRNWindow.cfg with the assumption AcksLand taken out of Fairness
\* (AcksLand <- NoAcksLand, which is TRUE). EveryReliableAckedAndDelivered
\* must fail: with the RTO abstract, the sender writes the oldest number
\* again until the P = 2 map has evicted the entry whose ack is on its way,
\* every ack it then receives names an evicted id (rn_window_ack_on_ack
\* ignores an id the map no longer holds), and the number is never acked.
\* This is the pattern MCRNSentMapReceiptEviction.cfg shows the code
\* reaching with receipt-only packets.

SPECIFICATION Spec

CONSTANTS
    W              = 2
    MaxNum         = 4
    NumMod         = 4
    BlockFirst     = 1
    BlockLen       = 2
    Ordered        = {0, 1, 2, 4}
    P              = 2
    MaxPerPacket   = 1
    MaxPid         = 3
    BlockUPrime    = TRUE
    KeepP6         = TRUE
    HalfRange      = TRUE
    HoldOrdered    = TRUE
    DropDuplicates = TRUE
    FwdPattern     = "alternate"
    RevPattern     = "alternate"
    Capacity       = 2
    MaxDelay       = 0
    Duplication    = FALSE
    Reordering     = FALSE
    BurstStart     = 1
    BurstLen       = 2
    AcksLand       <- NoAcksLand

INVARIANTS
    TypeOK

PROPERTIES
    EveryReliableAckedAndDelivered
