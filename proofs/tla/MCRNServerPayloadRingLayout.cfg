\* The passing control: three threads on one line at a capacity of four, the ring exactly the capacity, a chunk of two and the guard for one line, so the chunk branch, its clip, a lost install and the one-slot branch are reached: every rule on, every invariant.
SPECIFICATION MCSpec

CONSTANTS
    Threads       = {t1, t2, t3}
    LineOf        <- MCOneLine
    Cap           = 4
    RingSize      = 4
    Stride        = 2
    WrongStride   = 1
    Chunk         = 2
    GuardLines    = 1
    MaxCount      = 5
    Clamp         = TRUE
    FullTest      = TRUE
    RecoverStride = TRUE
    ReturnClear   = TRUE
    LostClear     = TRUE

INVARIANTS
    TypeOK
    InBounds
    ExactSend
    HeldExclusive
    ChunksBelowCap
