\* Reversed witness: the bank has room while tail - head <= S, so the
\* worker writes position head + S into the slot of position head, which
\* main has not finished reading.  Must violate NoOverwrite.
SPECIFICATION MCSpec

CONSTANTS
    S           = 2
    B           = 2
    SockCap     = 1
    MaxArrive   = 4
    DrainMax    = 2
    FullRule    = "le"
    PublishRule = "after"
    ReleaseRule = "next"
    FullCount   = "count"
    RearmRule   = "clear"

INVARIANTS
    TypeOK
    NoOverwrite
