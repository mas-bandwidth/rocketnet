\* Reversed witness: ClaimWriteRung <- MCClaimWriteAtCheck ("claim"), the
\* request path before the check/write split: the claim is written at its
\* check rung, before the signature verifies, so a request whose signature
\* then fails has held a claim.  ClaimOnlyAfterSignature must fail with
\* TLC's counterexample; OneUnexpiredMappingPerToken still holds.
SPECIFICATION MCSpec

CONSTANTS
    PosRestart   = 1
    PosVersion   = 2
    PosTimestamps = 3
    PosCompares  = 4
    PosCookie    = 5
    PosUsed      = 6
    PosAdmitted  = 7
    PosSignature = 8
    PosSeal      = 9
    PosSlots     = 10
    PosKeypair   = 11
    ClaimWriteRung <- MCClaimWriteAtCheck

INVARIANTS
    TypeOK
    CheapRefusalsFirst
    OneUnexpiredMappingPerToken
    ClaimOnlyAfterSignature
