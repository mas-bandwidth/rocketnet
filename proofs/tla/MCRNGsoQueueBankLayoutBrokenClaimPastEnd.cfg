\* Reversed witness: the claim refuses only an index past S (ClaimCmp "gt"),
\* so a claim is handed slot S. Must violate InBounds.
SPECIFICATION Spec
CONSTANTS
    Q = 2
    NB = 3
    S = 3
    Stride = 4
    Threads = {1, 2}
    Dests = {"a", "b"}
    QueueOf <- MCQueueOf
    Demand = 2
    MaxFlush = 3
    Skew <- MCSkew
    ClaimCmp = "gt"
    ClaimRule = "cas"
    SlotRule = "check"
    IdRule = "mul"
    FlushRule = "joined"
INVARIANT TypeOK
INVARIANT OneProducer
INVARIANT InBounds
INVARIANT NoSharedSlot
INVARIANT NoForeignWrite
INVARIANT RouteMatches
INVARIANT NoWorkerWrite
INVARIANT StagedMatches
