\* MCRNReceiveAllowance: the committed case. One correct client and one
\* flooder, a setting of B = 1 byte a tick at Factor 2, one maximum packet of
\* 2, a timeout of T = 2 ticks (delivery up to one tick late), five ticks, two
\* flood packets a tick, one step back of the server's time argument and one
\* slot reuse: every invariant. The byte allowance alone: the server sends
\* nothing (MaxElicit 0) and clients send payload only; the credits are
\* MCRNReceiveAllowanceCredit.cfg's. MCRNReceiveAllowanceBrokenNoRefill,
\* SmallCap, Shared and TimeBack are this file with one constant flipped.

SPECIFICATION Spec

CONSTANTS
    Correct      = {c1}
    Flooders     = {f1}
    B            = 1
    Factor       = 2
    MaxPkt       = 2
    T            = 2
    Horizon      = 5
    FloodPerTick = 2
    MaxNet       = 3
    MaxBack      = 1
    MaxReconnect = 1
    Refill       = TRUE
    CapFull      = TRUE
    PerClient    = TRUE
    Monotone     = TRUE
    MaxElicit    = 0
    Kinds        = {"pay"}
    AckCredit    = TRUE
    Control      = TRUE
    CreditBound  = TRUE
    ServerAckSpends = TRUE
    c1 = c1
    f1 = f1

INVARIANTS
    TypeOK
    UnderRateNeverRefused
    Isolated
    NoMint
    AcksBounded
