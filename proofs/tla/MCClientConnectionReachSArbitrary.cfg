\* the reversed reachability witness for the "arbitrary" loss pattern on
\* both links with two attempts, all constants unchanged from
\* MCClientConnectionSArbitrary.cfg.  SPECIFICATION SpecReach adds
\* ClientRecvPayloadWitness, so the ghost cPayloadDelivered is set once the
\* connected application is handed a payload; NotReached is its negation.
\* TLC must violate NotReached: a run that completes without a violation
\* would mean connected with a payload delivered is unreachable under these
\* constants.
SPECIFICATION SpecReach
CONSTANTS
    SendInterval     = 1
    Timeout          = 2
    Deadline         = 5
    ServerDeadline   = 3
    MaxAttempts      = 2
    MaxNonces        = 2
    MaxIds           = 2
    MaxSlots         = 1
    Others           = 0
    OthersMayJoin    = TRUE
    Disconnects      = TRUE
    ServerMute       = FALSE
    ServerPayloads   = TRUE
    DisconnectCopies = 2
    KindLoss         = "none"
    RepeatKeepAlive  = TRUE
    KeepAliveClock   = "keepalive"
    C2SPattern       = "arbitrary"
    S2CPattern       = "arbitrary"
    Capacity         = 2
    MaxDelay         = 0
    Duplication      = TRUE
    Reordering       = TRUE
    BurstStart       = 1
    BurstLen         = 2
INVARIANTS
    NotReached
