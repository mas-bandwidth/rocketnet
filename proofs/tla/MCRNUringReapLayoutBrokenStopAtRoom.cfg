\* Reversed witness: the reap before the hold.  A receive without room
\* stays at the head of the completion ring and the call ends there, so a
\* send completion behind it waits for a swap.  Must violate
\* SendsNotBehindRoom.
SPECIFICATION MCSpec

CONSTANTS
    CqCap     = 4
    HeldCap   = 3
    Buffers   = 3
    Room      = 2
    Seg       = 1
    Budget    = 3
    MaxRecv   = 6
    MaxSends  = 2
    HoldRule  = FALSE
    HeldMod   = TRUE

INVARIANTS
    TypeOK

PROPERTIES
    SendsNotBehindRoom
