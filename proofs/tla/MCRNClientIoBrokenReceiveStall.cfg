\* MCRNClientIo reversed witness: the one-step swap of the first draft,
\* where update returns the buffer it exposed only in the step that
\* exposes a Ready one.  With two buffers, once one is Exposed and the
\* other holds datagrams, the I/O thread cannot publish (no Free buffer)
\* and update cannot expose (no Ready buffer): NoReceiveStall falls.
\* Must fail.
SPECIFICATION Spec

CONSTANTS
    NumSlots           = 2
    BufferCap          = 1
    MaxDatagrams       = 3
    ReopenBeforeSent   = FALSE
    ReceiveIntoExposed = FALSE
    SwapNeedsReady     = TRUE
    HandOffWaits       = FALSE
    FullWaitReadable   = FALSE
    StepDriven          = FALSE
    StepModeStartsThread = FALSE

INVARIANTS
    TypeOK
    NoReuseBeforeSent
    ExposedStable
    FreedOnlyAfterJoin
    HandOffNeverWaits
    FullWaitsOnWake
    NoReceiveStall
