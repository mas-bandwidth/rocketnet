\* The refusal counter's control: every rule on, two chunks and three
\* descriptors (the pool's and the store's refusals are both reachable),
\* counters modulo 3 so a refusal counted twice or not at all is seen.
\* MCRNSendStoreLayout.cfg checks the layout at three chunks and four
\* descriptors with CountMod = 1 (the counters dropped) for its budget.
SPECIFICATION MCSpec
VIEW View

CONSTANTS
    N             = 2
    Q             = 3
    GenMod        = 3
    FreshGuard    = TRUE
    PushOnFree    = TRUE
    ScanFind      = FALSE
    ChunkSkipZero = TRUE
    DescSkipZero  = TRUE
    KeepFreeSlot  = TRUE
    CountQueueFull = TRUE
    StartOrder    = "fit"
    CountMod      = 3
    RefuseExhausts = FALSE

INVARIANTS
    TypeOK
    NeverTouchPastFresh
    NoTakeWhileLive
    RefuseOnlyWhenNoneFree
    FreeCountExact
    FreeStackExact
    ChoiceBounded
    LiveIsHeld
    StackExact
    DescCountExact
    HeldGenerationPositive

PROPERTIES
    RefuseLeavesLayout
    StoreNeverExhausts
