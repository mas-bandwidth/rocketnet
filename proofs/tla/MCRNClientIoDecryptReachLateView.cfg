\* MCRNClientIoDecrypt reach witness: the I/O thread's view of the payloads
\* word lags the store, so a payload passes raw after update stored it and
\* update opens it, as at BASE.  Every other invariant holds on the way.
\* Must fail NoLateRawPayload.
SPECIFICATION Spec

CONSTANTS
    BufferCap        = 2
    MaxDatagrams     = 4
    MaxSeq           = 3
    W                = 1
    MaxReplays       = 1
    MaxForged        = 1
    IntegrityLimit   = 1
    OpenBeforeReplay = FALSE
    SharedWindow     = FALSE
    NoRetire         = FALSE
    CountOnIo        = FALSE
    NoPayloadGate    = FALSE

INVARIANTS
    TypeOK
    CheapRefusalsFirst
    NoOpenWithoutKeys
    IoWindowWithinMain
    PayloadOpenedOnlyConnected
    AcceptedOnce
    SingleWriter
    ExposedStable
    NoReceiveStall
    NoLateRawPayload
