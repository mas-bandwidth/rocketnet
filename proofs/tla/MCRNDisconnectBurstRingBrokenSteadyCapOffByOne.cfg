\* The steady cap one late (count <= SteadyCap): a running server keeps
\* SteadyCap + 1 bursts waiting, and the stop's appends for every connected
\* client then write the last one over the waiting head (NoOverwrite).
SPECIFICATION MCSpec

CONSTANTS
    SteadyCap     = 2
    K             = 2
    Bursts        = 6
    SteadyCapExact = FALSE
    CursorWrapAt  = TRUE
    CursorDrops   = TRUE
    DropResetsCursor = TRUE

INVARIANT NoOverwrite
