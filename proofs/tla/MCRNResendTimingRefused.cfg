\* MCRNResendTimingRefused: the defaults (one tick is 500 ms), one record, its
\* first send refusable by finish_packet for 9 s (18 ticks) after it is offered
\* (rn_window_ack_packet_failed). A refused first send stays never sent, so its
\* reliable timeout runs from its one real first send. One record: with the
\* chunk beside it the refusals of both run past the 110-second budget, and the
\* classes' FIFOs do not interact in a refusal.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 20
    MaxBackoff  = 1
    MinAttempts = 4
    RefuseFor   <- RefuseForLong
INVARIANTS
    TypeOK
    ConfigAccepted
    AttemptsBeforeTimeout
    ResendGapBounded
    NoDueRecordHeld
    DueMeansWritten
