\* Reversed witness: the start takes the channel's ordering and sequencing
\* counters before the room is known (the code assigns them in
\* rn_channels_finish) and keeps them on the refusal (Broken =
\* "CountersAtStart"). Must violate RefusalLeavesStateUnchanged.
SPECIFICATION Spec
CONSTANTS
    Scenario = "mixed"
    Broken = "CountersAtStart"
    SendCapacity = 2
    OrderedCapacity = 2
    HoldCapacity = 2
    TransportCaps = {1, 2}
INVARIANTS
    TypeOK
PROPERTIES
    RefusalLeavesStateUnchanged
CHECK_DEADLOCK FALSE
