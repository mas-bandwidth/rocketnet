\* Reversed witness of the trace check: the record turns the producer over
\* without counting the turn, as code whose ids repeat across fills would
\* log. Must violate TraceConsistent, at record 4.
SPECIFICATION TraceSpec

CONSTANTS
    Q         = 1
    NB        = 2
    S         = 2
    Stride    = 2
    Threads   = {1}
    Dests     = {1}
    Demand    = 1
    MaxFlush  = 1
    SkewSpan  = 0
    ClaimCmp  = "ge"
    ClaimRule = "add"
    CounterWrap = 0
    SlotRule  = "check"
    IdRule    = "mul"
    FlushRule = "joined"
    TraceLog  <- BadLog

INVARIANTS
    TraceConsistent
