\* The passing control at the per-PR size: three candidates on both lists, capacities {0, 1, 3} up and {1, 3} down (a path that carries nothing above the control size, one that carries only P0, and one that carries every candidate, each way), reduced from MCRNPathProbeFull.cfg (every capacity 0 .. 3 each way, nightly timeout debt) only so the case finishes inside the 110 s case budget on two workers; one loss burst inside a window of no spacing, one attacker send; every safety property and the liveness properties under fairness.
SPECIFICATION FairSpec

CONSTANTS
    ClientSet     = {3, 2, 1}
    ServerList    = {3, 2, 1}
    CapsUp        = {0, 1, 3}
    CapsDown      = {1, 3}
    K             = 2
    MaxBursts     = 1
    BurstSpacings = 0
    AttackBudget  = 1
    Forger        = FALSE
    Timed         = TRUE
    Broken        = "none"

INVARIANTS
    TypeOK
    RaisedWithinPath
    ServerNeverAhead
    NoWrongRuleOut
    FailOnlyAtP0
    NeverAtRuledOut
    ReplyOnlyConnected
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate

PROPERTIES
    PNeverDecreases
    StrikeNeedsSmall
    StrikeNeedsSpacing
    ServerRaisesOnConfirm
    ClientRaisesOnAuthLarge
    NoProbeAfterDone
    Converges
    ReachesBest
    FailsWhenP0NotCarried
