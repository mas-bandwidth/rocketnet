\* The passing control: three candidates on both lists, every path capacity 0 .. 3 each way (a path that carries nothing above the control size, one that carries only P0, one that carries 2 and one that carries every candidate, each way), one loss burst, one attacker send; every safety property and the liveness properties under fairness.
SPECIFICATION FairSpec

CONSTANTS
    ClientSet     = {3, 2, 1}
    ServerList    = {3, 2, 1}
    CapsUp        = {0, 1, 2, 3}
    CapsDown      = {0, 1, 2, 3}
    K             = 2
    MaxBursts     = 1
    AttackBudget  = 1
    Forger        = FALSE
    Timed         = TRUE
    Broken        = "none"

INVARIANTS
    TypeOK
    RaisedWithinPath
    ServerNeverAhead
    NoWrongRuleOut
    FailOnlyAtP0
    NeverAtRuledOut
    ReplyOnlyConnected
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate

PROPERTIES
    PNeverDecreases
    StrikeNeedsSmall
    ServerRaisesOnConfirm
    ClientRaisesOnAuthLarge
    NoProbeAfterDone
    Converges
    ReachesBest
    FailsWhenP0NotCarried
