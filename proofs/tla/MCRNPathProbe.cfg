\* The passing control: three candidates on both lists, path capacity 0 .. 2 up and 0 .. 2 down (MCRNPathProbeDown3.cfg has 3 down, MCRNPathProbeUp3.cfg and MCRNPathProbeUp3Down3.cfg capacity 3 up: the four cover every path 0 .. 3 each way), one loss burst, one attacker send; every safety property and the liveness properties under fairness but the re-try's two (MCRNPathProbeRetry.cfg). The capacities are fixed for a behaviour, so the split loses no behaviour; split on the down capacity on 2026-11-26 when the re-try took the case to 60 s and over, past 60% of the case budget on a loaded bench.
SPECIFICATION FairSpec

CONSTANTS
    ClientSet     = {3, 2, 1}
    ServerList    = {3, 2, 1}
    CapsUp        = {0, 1, 2}
    CapsDown      = {0, 1, 2}
    K             = 2
    MaxBursts     = 1
    AttackBudget  = 1
    AttackKinds   = {"replay", "probe", "reply"}
    Forger        = FALSE
    Timed         = TRUE
    LossBound     = TRUE
    MaxReuses     = 0
    ReuseCapsUp   = {}
    ReuseCapsDown = {}
    Broken        = "none"

INVARIANTS
    TypeOK
    RaisedWithinPath
    ServerNeverAhead
    NoWrongRuleOut
    FailOnlyAtP0
    NeverAtRuledOut
    NeverAboveRuled
    RuledIsTheNextStep
    ReplyOnlyConnected
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate

PROPERTIES
    PNeverDecreases
    StrikeNeedsSmall
    ServerRaisesOnConfirm
    ClientRaisesOnAuthLarge
    NoProbeAfterDone
    NoSkippedStep
    Converges
    ReachesBest
    FailsWhenP0NotCarried
