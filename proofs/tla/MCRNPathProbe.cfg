\* The passing control: the three-step list on both ends, every path, every invariant and the liveness properties under fairness.
SPECIFICATION FairSpec

CONSTANTS
    Ceiling      = 3
    CapsUp       = {0, 1, 2, 3}
    CapsDown     = {0, 1, 2, 3}
    W            = 2
    MaxLoss      = 1
    AttackBudget = 1
    ClientList   <- ThreeStep
    ServerList   = {3, 2, 1}
    LateExpire   = FALSE
    Broken       = "none"

INVARIANTS
    TypeOK
    SlotAgrees
    ChosenIsCandidate
    CarriedBothWays
    CrossedBothWays
    ReplyOnlyProven
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate

PROPERTIES
    Ends
    NoHang
    ConnectsWhenFits
    FailsWhenNoneFits
