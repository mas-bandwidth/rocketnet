\* The passing control: three candidates on both lists, path capacity 0 .. 2 up and 0 .. 3 down (MCRNPathProbeUp3.cfg has capacity 3 up: the capacities are fixed for a behaviour, so the two cases cover every path 0 .. 3 each way between them, split on 2026-11-26 when the ladder took the sweep past 60% of the case budget), one loss burst, one attacker send; every safety property and the liveness properties under fairness.
SPECIFICATION FairSpec

CONSTANTS
    ClientSet     = {3, 2, 1}
    ServerList    = {3, 2, 1}
    CapsUp        = {0, 1, 2}
    CapsDown      = {0, 1, 2, 3}
    K             = 2
    MaxBursts     = 1
    AttackBudget  = 1
    Forger        = FALSE
    Timed         = TRUE
    Broken        = "none"

INVARIANTS
    TypeOK
    RaisedWithinPath
    ServerNeverAhead
    NoWrongRuleOut
    FailOnlyAtP0
    NeverAtRuledOut
    NeverAboveRuled
    ReplyOnlyConnected
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate

PROPERTIES
    PNeverDecreases
    StrikeNeedsSmall
    ServerRaisesOnConfirm
    ClientRaisesOnAuthLarge
    NoProbeAfterDone
    NoSkippedStep
    Converges
    ReachesBest
    FailsWhenP0NotCarried
