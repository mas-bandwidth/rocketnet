\* The passing control: the three-step list on both ends, every path, every invariant and the liveness properties under fairness.
SPECIFICATION FairSpec

CONSTANTS
    Ceiling      = 3
    CapsUp       = {0, 1, 2, 3}
    CapsDown     = {0, 1, 2, 3}
    W            = 2
    MaxLoss      = 1
    AttackBudget = 1
    Forger       = FALSE
    Deadline     = 0
    Budget       = 0
    ClientSet    = {3, 2, 1}
    ServerList   = {3, 2, 1}
    Timed        = TRUE
    Broken       = "none"

INVARIANTS
    TypeOK
    SlotAgrees
    ChosenIsCandidate
    CarriedBothWays
    CrossedBothWays
    ReplyOnlyProven
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate
    NoTimeoutWhileProbing

PROPERTIES
    Ends
    NoHang
    ConnectsWhenFits
    FailsWhenNoneFits
