\* MCServerConnectionLossyTimers: the timers run (idle timeout and handshake deadline on,
\* a client that may disconnect or vanish) with both links "arbitrary", duplication and
\* reordering, two packets in flight each way. Safety only: no fairness, no liveness.
SPECIFICATION Spec

CONSTANTS
    NumClients          = 1
    NumAddrs            = 1
    NumTokens           = 1
    MaxSlots            = 1
    MapCap              = 1
    HeldCapacity        = 2
    MaxAttempts         = 1
    MaxNonces           = 1
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 2
    HandshakeDeadline   = 2
    Disconnects         = TRUE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "own"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "arbitrary"
    S2CPattern          = "arbitrary"
    Capacity            = 2
    MaxDelay            = 0
    Duplication         = TRUE
    Reordering          = TRUE
    BurstStart          = 1
    BurstLen            = 2

INVARIANTS
    SafetyInvariants

PROPERTIES
    PacketsReachOwnSlotOnly
    SessionNeverAnswered
    ResponseNeverRefreshesConnected
