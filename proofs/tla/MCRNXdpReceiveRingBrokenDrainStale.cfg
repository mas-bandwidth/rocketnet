\* MCRNXdpReceiveRing reversed witness: a drain leaves the most recently
\* staged packet out of the claim's view, as the worker-driven publish
\* deferred a packet staged after it to the next update. Must fail
\* StagedBeforeClaimInView.
SPECIFICATION Spec

CONSTANTS
    F1       = F1
    F2       = F2
    F3       = F3
    Frames   = {F1, F2, F3}
    RingSize = 2
    PeekMax  = 2
    StageCap = 1
    FillSize = 6
    DrainStale <- DrainStaleBroken

INVARIANTS
    TypeOK
    StagedBeforeClaimInView
