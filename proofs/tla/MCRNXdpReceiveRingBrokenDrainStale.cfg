\* MCRNXdpReceiveRing reversed witness: a claim leaves the most recently
\* staged packet behind in the worker's next bank, as the pre-fix
\* worker-driven publish deferred a packet staged after it to a later
\* claim. Must fail StagedBeforeClaimInView.
SPECIFICATION Spec

CONSTANTS
    F1         = F1
    F2         = F2
    F3         = F3
    Frames     = {F1, F2, F3}
    RingSize   = 2
    PeekMax    = 2
    StageCap   = 2
    FillSize   = 6
    Budget     = 1
    MaxPackets = 4
    SpinMax    = 2
    TryArrivals = 1
    Stall      = TRUE
    DrainStale <- DrainStaleBroken

INVARIANTS
    TypeOK
    StagedBeforeClaimInView
