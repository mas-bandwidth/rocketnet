\* MCRNFillPhaseBrokenStaleClaim: reversed witness: the claim refuses only a
\* word stamped with the caller's own epoch; a call that loaded the epoch
\* before a main operation ended claims over the new phase's claim, its look
\* refuses it and leaves its old stamp, and a second filler in the phase
\* passes unflagged: OneFiller falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Fillers      = {f1, f2}
    Clients      = {c1}
    NoOwner      = none
    MaxMain      = 2
    MaxFills     = 2
    LookFirst    = FALSE
    LoadStore    = FALSE
    ResetOnLeave = TRUE
    StaleClaim   = TRUE
    NoEpochLook  = FALSE

INVARIANTS
    TypeOK
    OneFiller
