\* MCRNResendTiming reversed witness: the two delay classes in one resend FIFO
\* ordered by last send, walked from its head and stopped at the first record
\* not due (one tick is 500 ms, message_resend_delay_max 4 s so the resend
\* delay can exceed the chunk cap of 2.5 s). Both records are sent at 0, the
\* small record first; a sample moves rto above 5; at tick 5 the chunk is due
\* (its delay capped at 5) but the small record at the head is not, so the walk
\* stops and the update ends with the chunk unsent. Must fail NoDueRecordHeld.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 8
    Timeout     = 20
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    OneFifo     <- OneFifoTwoDelays
INVARIANTS
    TypeOK
    NoDueRecordHeld
