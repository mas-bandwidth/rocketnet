\* MCLinkSlotStore.cfg: the simulator's slot store, two slots and five sends: the store-full drop is counted and every packet handed out was sent, once.
SPECIFICATION SpecSlotStore
CONSTANTS
    Packets     = {1, 2, 3, 4, 5}
    Capacity    = 1
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = FALSE
    Pattern     = "none"
    BurstStart  = 1
    BurstLen    = 2
    MaxSeq      = 5
    StoreSlots  = 2
    Defect      = "none"
INVARIANTS
    MCPatternsTypeOK
    StoreAccounts
    DeliveredOnce
