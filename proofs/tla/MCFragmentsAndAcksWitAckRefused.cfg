\* MCFragmentsAndAcksWitAckRefused: wit-ackrefused, a reversed witness. The gate
\* instance of MCFragmentsAndAcks.cfg with Witness "ackrefused" (a fragment is
\* ack-eligible before reassembly judges it), so the pass and the violation are
\* on the same instance; expected to violate NamedOnlyIfAccepted
\* (README-FragmentsAndAcks.md).
SPECIFICATION SpecSafety

CONSTANTS
    MaxSeq       = 4
    SentRing     = 4
    AggRing      = 2
    BatchCap     = 1
    Window       = 4
    MaxRanges    = 2
    Slots        = 1
    IdSpace      = 8
    FirstId      = 1
    StaleAhead   = 2
    StaleRule    = "code"
    MaxGen       = 2
    MaxCount     = 2
    Counts       = {2}
    Stride       = 2
    FinalBytes   = 1
    MaxPayload   = 5
    MaxFragment  = 3
    DrainCap     = 4
    DeliveredCap = 2
    DefectIds    = {}
    Burns        = FALSE
    Witness      = "ackrefused"
    D2RPattern   = "none"
    R2DPattern   = "none"
    Capacity     = 2
    MaxDelay     = 0
    Duplication  = FALSE
    Reordering   = TRUE
    BurstStart   = 3
    BurstLen     = 2

INVARIANTS
    TypeOK
    SurfacedOnce
    SurfacedOnlyIfOpened
    BurnedNeverNamed
    AckedMeansSurfaced
    DeliveredExact
    DeliveredOnce
    CompleteDelivers
    ArenaBounded
    BitsCoverRing
    BitsMatchRing
    WalkVisitsUnacked
    NamedOnlyIfAccepted
