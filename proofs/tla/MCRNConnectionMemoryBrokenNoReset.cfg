\* Reversed witness: MCRNConnectionMemory.cfg with Reset = FALSE (Connect binds
\* a reused slot without rn_region_carve). TLC must fail ReusedSlotStartsClean.
SPECIFICATION Spec

CONSTANTS
    Slots    = {s1, s2, s3}
    Clients  = {c1, c2, c3, c4}
    Capacity = 3
    Reset    = FALSE
    CarryOn  = FALSE
    SendExhausts = FALSE
    TakeBeforeFit = FALSE
    CountExhausted = FALSE
    CountMod = 1

INVARIANTS
    TypeOK
    UsedBounded
    ExhaustedReasonNamed
    ReusedSlotStartsClean

PROPERTIES
    ExhaustionOnlyLeadsToDisconnect
    NoCrossSlotEffect
    ExhaustedEventuallyFree
