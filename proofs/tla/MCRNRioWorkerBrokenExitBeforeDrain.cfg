\* MCRNRioWorker reversed witness: the worker reports stopped right after
\* closing the socket, before the cancelled requests are dequeued.  Must
\* fail FreedOnlyWhenDrained.
SPECIFICATION Spec

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 2
    NumBanks        = 3
    Cap             = 2
    View            = 4
    MaxDatagrams    = 3
    MaxSends        = 1
    DrainBatch      = 2
    StopDrainWaits  = 2
    InlineStop      = FALSE
    BoundedStopDrain = TRUE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = FALSE
    WakeOnReturn    = TRUE

INVARIANTS
    TypeOK
    FreedOnlyWhenDrained
