\* MCRNSchedulerReservedLevels: the builder's contract at the priority levels
\* v1.1.x reserves (no caller sets them: every reliable message is MEDIUM and
\* only CONFIG is IMMEDIATE). Every guarding rule on: channel 0 queues a LOW
\* then an IMMEDIATE item, channel 1 a HIGH item, IMMEDIATE unreliable items
\* one per update, a window of 2, a budget of 2 items per update (so both of
\* channel 0's items are numbered and offered to the builder together) and
\* no transport loss (RtxHeadBoost is checked on the code's instance). The passing control of
\* MCRNSchedulerBrokenPerMessagePriority.cfg.

SPECIFICATION Spec

CONSTANTS
    NC             = 2
    Msgs           <- MCMsgsReserved
    Refill         <- MCNoRefill
    ULevel         = 0
    W              = 2
    Cap            = 2
    UPerTick       = 1
    MaxLoss        = 0
    ChannelFIFO    = TRUE
    RtxSendOrder   = TRUE
    UnreliableLast = TRUE
    StallEndsPass  = FALSE
    ReadyRotate    = TRUE

INVARIANTS
    TypeOK
    ReadyIsQueued
    FirstWriteInOrderPerChannel
    UnreliableNotBlockedByWindow
    ClassOrderBeforePriority
    RtxHeadBoost

PROPERTIES
    NoStarvation
