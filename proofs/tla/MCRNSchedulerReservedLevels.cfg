\* MCRNSchedulerReservedLevels: the builder's contract at the priority levels
\* v1.1.x reserves (no caller sets them: every reliable message is MEDIUM and
\* only CONFIG is IMMEDIATE). Every guarding rule on: channel 0 queues a LOW
\* then an IMMEDIATE item, channel 1 a HIGH item, IMMEDIATE unreliable items
\* one per update, a window of 2, a budget of 1 item per update and 3
\* transport losses. The passing control of
\* MCRNSchedulerBrokenPerMessagePriority.cfg.

SPECIFICATION Spec

CONSTANTS
    NC             = 2
    Msgs           <- MCMsgsReserved
    ULevel         = 0
    W              = 2
    Cap            = 1
    UPerTick       = 1
    MaxLoss        = 3
    ChannelFIFO    = TRUE
    RtxSendOrder   = TRUE
    UnreliableLast = TRUE

INVARIANTS
    TypeOK
    FirstWriteInOrderPerChannel
    UnreliableNotBlockedByWindow
    ClassOrderBeforePriority
    RtxHeadBoost

PROPERTIES
    NoStarvation
