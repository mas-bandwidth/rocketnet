\* The passing control for liveness: with the worker, main and the kernel
\* fair, a multishot that ended while the queue runs is armed again.
SPECIFICATION MCLiveSpec

CONSTANTS
    S           = 2
    B           = 2
    SockCap     = 1
    MaxArrive   = 4
    DrainMax    = 2
    FullRule    = "lt"
    PublishRule = "after"
    ReleaseRule = "next"
    FullCount   = "count"
    RearmRule   = "clear"

PROPERTIES
    Rearms
