\* MCRNDriverSendStaging reversed witness: io_abort_packet leaves a
\* withdrawn frame's slot armed (AbortDisarmsSlot FALSE) instead of zeroing
\* its byte count. A frame the link simulator took, or one maintenance
\* aborted, is handed to the driver by the next flush, and
\* WithdrawnNeverSent falls. Must fail.
SPECIFICATION Spec

CONSTANTS
    MaxFrames                = 4
    MaxStaged                = 3
    MaxBurst                 = 2
    DisconnectAdvancesStaged = TRUE
    XdpBuffers               = 3
    FinishRecordsRefusal     = TRUE
    AbortDisarmsSlot         = FALSE

INVARIANTS
    WithdrawnNeverSent
