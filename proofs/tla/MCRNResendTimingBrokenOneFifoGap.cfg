\* MCRNResendTiming reversed witness: MCRNResendTimingBrokenOneFifo.cfg checked
\* for the gap. The chunk held behind the small record waits past its delay's
\* bound, Min(RtoMax, ChunkCap). Must fail ResendGapBounded.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 8
    Timeout     = 20
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    OneFifo     <- OneFifoTwoDelays
INVARIANTS
    TypeOK
    ResendGapBounded
