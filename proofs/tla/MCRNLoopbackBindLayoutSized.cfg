\* The passing control of the sizing: more records than First..Last, so create lowers the range to hold them all.
SPECIFICATION MCSpec

CONSTANTS
    Records      = 3
    First        = 4
    Last         = 5
    BindPorts    = {0, 1, 3}
    PlusOne      = TRUE
    BindCheck    = TRUE
    WrapToFirst  = TRUE
    BothFamilies = TRUE
    DualCheck    = TRUE
    FullCheck    = TRUE
    Sized        = TRUE
    HoldAll      = TRUE

INVARIANTS
    TypeOK
    OneEndpointPerFamilyPort
    BoundExact
    LookupIsWalk
    OneIPv4Destination
    EphemeralInRange
    EphemeralPortFree
    RefusesOnlyWhenFull
    NoPortZero
    NextPortInRange
    DestroyFindsOwnEntry
    RegisteredCount
    HoldsEveryRecord
