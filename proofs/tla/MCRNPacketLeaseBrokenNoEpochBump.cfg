\* MCRNPacketLease reversed witness: reset leaves the epoch, so a lease of
\* the previous fill is still current.  Must fail NoWrongSuccess.
SPECIFICATION Spec

CONSTANTS
    Capacity          = 4
    Threads           = {1, 2}
    Frames            = {1, 2}
    Vals              = {1, 2}
    HashSpread        = 1
    MaxOps1           = 2
    MaxOps2           = 1
    MaxResets         = 2
    EpochLimit        = 2
    UsedLimit         = 2
    UseCas            = TRUE
    ConsumeCas        = TRUE
    BumpEpoch         = FALSE
    EpochLimited      = TRUE
    RetiredOn         = FALSE
    RetiredValidates  = FALSE
    OnWriting         = "spin"
    ValidCallers      = FALSE

INVARIANTS
    TypeOK
    NoWrongSuccess
