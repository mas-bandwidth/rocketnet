\* Reversed witness: MCRNSchedulerBrokenUnreliableStarvesOrdered.cfg's
\* constants (UnreliableLast = FALSE: the unreliable class is offered first),
\* checking only ClassOrderBeforePriority, the safety face of the same flaw.
\* Under the design order Write takes the first class with an item, so the
\* invariant holds by construction in every passing cfg; here the first write
\* of an unreliable item while a numbered reliable item waits sets classBad.
\* TLC must fail ClassOrderBeforePriority.

SPECIFICATION Spec

CONSTANTS
    NC             = 2
    Msgs           <- MCMsgs
    Refill         <- MCNoRefill
    ULevel         = 2
    W              = 2
    Cap            = 1
    UPerTick       = 1
    MaxLoss        = 1
    ChannelFIFO    = TRUE
    RtxSendOrder   = TRUE
    UnreliableLast = FALSE
    StallEndsPass  = FALSE
    ReadyRotate    = TRUE

INVARIANTS
    ClassOrderBeforePriority
