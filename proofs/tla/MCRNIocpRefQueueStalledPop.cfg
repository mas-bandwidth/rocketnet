\* MCRNIocpRefQueue at the code's sizing: two cells and at most two operations live, two producers, two consumers, four operations released. A push is refused only while a pop has claimed the cell's last round and not freed it; the refused push keeps its operation and retries, and under the threads' fairness every operation is queued and popped. Must pass.
SPECIFICATION SpecFair

CONSTANTS
    Cap         = 2
    PosMod      = 32
    InitSlack   = 0
    Producers   = {p1, p2}
    Consumers   = {c1, c2}
    MaxTok      = 4
    Ops         = 2
    DropRefused = FALSE

INVARIANTS
    TypeOK
    NoOverwrite
    NoPhantom
    WithinCapacity
    CellsMatchPositions
    InqIsCells
    RefusedNeverLost
    RefusalOnlyWhilePopStalled

PROPERTIES
    EveryOperationPopped
