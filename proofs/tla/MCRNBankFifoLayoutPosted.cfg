\* MCRNBankFifoLayoutPosted: the iocp client (sdk/rocketnet_client_iocp_windows.cpp):
\* num_receives = 3 buffers in an array of ROCKETNET_CLIENT_IOCP_RECEIVES = 4,
\* every buffer posted at init, completed in any order onto the ready FIFO
\* modulo num_receives, copied and posted again.
SPECIFICATION Spec

CONSTANTS
    N         = 3
    ArrLen    = 4
    ConsMax   = 3
    MaxReady  = 3
    MaxPub    = 8
    FreeSlack = 0
    HeadMod   = 3
    TailMod   = 3
    PushKind  = "fifo"
    PopKind   = "fifo"
    InitKind  = "posted"

INVARIANTS
    TypeOK
    InBounds
    CountsInRange
    ExactlyOnePlace
    ReadyMatches
