\* MCRNAckApplyPhase: the committed run, the deferred apply as the code makes it:
\* two blocks a client, any of them arriving again. Every block carries one
\* range, so the range store forces the early gather and the queue never fills;
\* MCRNAckApplyPhaseOneBlock.cfg takes blocks of no ranges and fills the queue.
\* (Both range counts with two blocks a client is past 3,000,000 distinct
\* states at three minutes.)
SPECIFICATION Spec

CONSTANTS
    Clients             = {0, 1}
    Threads             = {main, g1, g2}
    Main                = main
    MinBlock            = 1
    MaxBlock            = 2
    MaxRanges           = 1
    RangeCounts         = {1}
    PendingCap          = 3
    RangesCap           = 2
    ExchangeTake        = TRUE
    CloseAppliesUntaken = TRUE
    CloseClearsClaim    = TRUE
    SettleOnlyReceiving = TRUE
    GatherWhenFull      = TRUE
    AdvanceTail         = TRUE
    DupGivesNothing     = TRUE

INVARIANTS
    TypeOK
    OneTaker
    ClaimOnlyOpen
    ClosedEmpty
    Whole
    Published
    ChainWhole
    SegmentInOrder
    InBounds
