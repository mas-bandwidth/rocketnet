\* MCServerConnection timers: one client that may disconnect or vanish, the idle
\* timeout and the handshake deadline on. Every timer invariant is live, a gone
\* client's slot is freed and an abandoned half-open mapping dies.
SPECIFICATION Spec

CONSTANTS
    NumClients          = 1
    NumAddrs            = 1
    NumTokens           = 1
    MaxSlots            = 1
    MapCap              = 1
    HeldCapacity        = 2
    MaxAttempts         = 1
    MaxNonces           = 1
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 2
    HandshakeDeadline   = 2
    Disconnects         = TRUE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "own"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2

INVARIANTS
    SafetyInvariants

PROPERTIES
    TimedOutSlotFreed
    AbandonedMappingDies
    ServerNotStranded
