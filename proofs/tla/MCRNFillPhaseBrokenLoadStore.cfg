\* MCRNFillPhaseBrokenLoadStore: reversed witness: the lock is a load then
\* a store, not a compare-and-swap; two fillers both lock a client claimed
\* in an earlier phase, both pass, and OneFiller falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Fillers      = {f1, f2}
    Clients      = {c1, c2}
    NoOwner      = none
    MaxMain      = 2
    MaxFills     = 2
    LookFirst    = FALSE
    LoadStore    = TRUE
    ResetOnLeave = TRUE
    NoEpochLook  = FALSE
    NoRestore    = FALSE
    ScanOne      = FALSE
    Lines        = {l1, l2}
    LineOf       <- MCLineOf
    f1 = f1
    f2 = f2
    f3 = f3
    l1 = l1
    l2 = l2

INVARIANTS
    TypeOK
    OneFiller
