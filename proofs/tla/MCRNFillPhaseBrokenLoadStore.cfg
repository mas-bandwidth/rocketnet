\* MCRNFillPhaseBrokenLoadStore: reversed witness: the lock is a load then
\* a store, not a compare-and-swap; two fillers both lock a client claimed
\* in an earlier phase, both pass, and OneFiller falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Fillers      = {f1, f2}
    Clients      = {c1, c2}
    NoOwner      = none
    MaxMain      = 2
    MaxFills     = 2
    MaxTakes     = 0
    LookFirst    = FALSE
    LoadStore    = TRUE
    ResetOnLeave = TRUE
    NoEpochLook  = FALSE
    NoRestore    = FALSE
    ScanOne      = FALSE
    NoWindow     = FALSE
    NoMainWindow = FALSE
    TakeUncounted = FALSE
    OptedAtStart  = TRUE
    ArmedAtCreate = FALSE
    OwnerAtDecide = FALSE
    KickAll       = FALSE
    ShutOnEarly   = FALSE
    ScanFirst     = FALSE
    DepthMax      = 2
    Lines        = {0, 1}
    LineChoice   <- MCLineChoice
    f1 = f1
    f2 = f2
    f3 = f3

VIEW View

INVARIANTS
    TypeOK
    OneFiller
