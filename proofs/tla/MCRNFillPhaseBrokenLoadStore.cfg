\* MCRNFillPhaseBrokenLoadStore: reversed witness: the claim is a load
\* then a store, not a compare-and-swap; two fillers both load an unowned
\* client and both claim it unflagged, and OneFiller falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Fillers      = {f1, f2}
    Clients      = {c1}
    NoOwner      = none
    MaxMain      = 2
    MaxFills     = 2
    LookFirst    = FALSE
    LoadStore    = TRUE
    ResetOnLeave = TRUE

INVARIANTS
    TypeOK
    OneFiller
