\* Reversed witness: MCRNReceiveAllowance.cfg with CapFull = FALSE (the cap is
\* one tick of the rate, not the timeout's worth and a packet). The burst
\* after a silence is refused. TLC must fail UnderRateNeverRefused.

SPECIFICATION Spec

CONSTANTS
    Correct      = {c1}
    Flooders     = {f1}
    B            = 1
    Factor       = 2
    MaxPkt       = 2
    T            = 2
    Horizon      = 5
    FloodPerTick = 2
    MaxNet       = 3
    MaxBack      = 1
    MaxReconnect = 1
    Refill       = TRUE
    CapFull      = FALSE
    PerClient    = TRUE
    Monotone     = TRUE
    MaxElicit    = 0
    Kinds        = {"pay"}
    AckCredit    = TRUE
    Control      = TRUE
    CreditBound  = TRUE
    ServerAckSpends = TRUE
    c1 = c1
    f1 = f1

INVARIANTS
    TypeOK
    UnderRateNeverRefused
