\* MCRNPacketLease reversed witness: reset advances the epoch past the largest
\* value its shifted state word holds.  The word wraps, a published entry no
\* longer reads as current and the next insert overwrites it.  Must fail
\* PublishedIntact.
SPECIFICATION Spec

CONSTANTS
    Capacity          = 4
    Threads           = {1, 2}
    Frames            = {1, 2}
    Vals              = {1, 2}
    HashSpread        = 1
    MaxOps1           = 2
    MaxOps2           = 1
    MaxResets         = 2
    EpochLimit        = 2
    UsedLimit         = 2
    UseCas            = TRUE
    ConsumeCas        = TRUE
    BumpEpoch         = TRUE
    EpochLimited      = FALSE
    RetiredOn         = FALSE
    RetiredValidates  = FALSE
    OnWriting         = {"skip"}
    ValidCallers      = FALSE

INVARIANTS
    TypeOK
    PublishedIntact
