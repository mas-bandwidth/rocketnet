\* MCRNClientIocp reversed witness: Free follows Close at once.  The buffers
\* are freed while the kernel still owns posted receives whose abort
\* completions closesocket has not yet delivered, and FreedOnlyWhenDrained
\* falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Buffers        = 2
    MaxDatagrams   = 2
    FreeWaitsDrain = FALSE
    DrainOnlyReady = TRUE

INVARIANTS
    TypeOK
    NeverCopiedWhilePosted
    FreedOnlyWhenDrained
