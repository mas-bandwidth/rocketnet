\* MCRNResendTimingBrokenSilenceEarly: MCRNResendTimingOffQuiet with the
\* transport ending the connection one update early, at T - 1 ticks of
\* silence: NoEndBeforeT falls.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 12
    MaxBackoff  = 1
    MinAttempts = 4
    TimeoutOn   <- TimeoutOff
    TrackQuiet  <- TrackQuietOn
    SilenceAt   <- SilenceEarly
INVARIANT
    NoEndBeforeT
