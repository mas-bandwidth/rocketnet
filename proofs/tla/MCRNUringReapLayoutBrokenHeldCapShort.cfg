\* Reversed witness: a queue's hold ring one slot short of its provided
\* buffers.  With both of a queue's buffers held the next push overwrites
\* the oldest held receive.  Must violate HeldMatches.
SPECIFICATION MCSpec

CONSTANTS
    CqCap     = 4
    Q         = 2
    HeldCap   = 1
    Buffers   = 3
    Room      = 2
    Seg       = 1
    Budget    = 3
    MaxRecv   = 6
    MaxSends  = 2
    HoldRule  = TRUE
    HeldMod   = TRUE
    TurnRule  = TRUE

INVARIANTS
    TypeOK
    HeldMatches
