\* Reversed witness: a hold ring one slot short of the provided buffers.
\* With every buffer held the next push overwrites the oldest held
\* receive.  Must violate HeldMatches.
SPECIFICATION MCSpec

CONSTANTS
    CqCap     = 4
    HeldCap   = 2
    Buffers   = 3
    Room      = 2
    Seg       = 1
    Budget    = 3
    MaxRecv   = 6
    MaxSends  = 2
    HoldRule  = TRUE
    HeldMod   = TRUE

INVARIANTS
    TypeOK
    HeldMatches
