\* MCRNSendReserveCallsQueues: the code with two send queues (client 0 on queue 1, client 1 on queue 2) of three frames each, a reserve of one by the formula, and opens before Init that saw a room of one (two frames still in flight), so each reserve starts cut to none and comes back at the first open that sees the staging. One queue can run out while the other has room: a client's capacity answers for its own queue. Passes.
SPECIFICATION Spec

CONSTANTS
    Clients   = {0, 1}
    NQ        = 2
    Reserve   = 1
    MaxFree   = 3
    SeenInit  = 1
    Chunk     = 1
    Guard     = 1
    RoomOnly     = FALSE
    NoRefresh    = FALSE
    AbortReturns = FALSE
    TailLeak     = FALSE
    MinRoom      = FALSE
    StickyReserve = FALSE
    OwnUnbounded  = FALSE

CONSTRAINT Bound

INVARIANTS
    TypeOK
    ReserveKept
    NeverStarved
    ClaimsAreStarted
    OwnLeftCounts
    OwnWithinReserve
    NoHiddenRoom
    ReserveRestored
