\* The index < 0 refusal: source 3's address bytes cannot be written, so
\* rocketnet_server_protocol_cookie_reply_source_index returns -1 and its
\* request is withheld with no bit read or set. Every invariant of the
\* control holds for the other sources, and NoIndexOnlyUnwritable.
SPECIFICATION MCSpec

CONSTANTS
    Sources      = {1, 2, 3}
    Bound        = 2
    Factor       = 2
    WordBits     = 2
    HashRange    = 8
    VerifyBudget = 1
    Broken       = "none"
    Unwritable  <- MCUnwritable

INVARIANTS
    TypeOK
    IndexInRange
    OneReplyPerSource
    RefusalHasCause
    BitmapIsThisUpdate
    CleanIsEmpty
    FalseRefusalBound
    WorkBudgetOnlyVerifies
    NoIndexOnlyUnwritable
