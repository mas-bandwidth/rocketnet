\* MCRNBlocksForged: MCRNBlocks.cfg with Forge <- ForgeOn: the outside world
\* may put one record on the wire that copies a numbered record with another
\* count. The receiver refuses it, or refuses the correct chunks that meet
\* the anchor it opened, and nothing wrong or partial is ever delivered.

SPECIFICATION Spec

CONSTANTS
    W            = 4
    F            = 2
    B            = 8
    Small        = 2
    Units        <- MCUnits
    PlaceByIndex = TRUE
    Forge        <- ForgeOn
    FwdPattern   = "arbitrary"
    Capacity     = 2
    MaxDelay     = 0
    Duplication  = TRUE
    Reordering   = TRUE
    BurstStart   = 1
    BurstLen     = 2

INVARIANTS
    TypeOK
    SplitConsecutive
    NoPartialDelivery
    OneOrderingSlotPerBlock
    DeliveredEqualsSent
