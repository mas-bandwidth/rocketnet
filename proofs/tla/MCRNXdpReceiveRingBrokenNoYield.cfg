\* MCRNXdpReceiveRing reversed witness: the unbounded miss. The worker never
\* reads main's flag: it holds the mutex for its whole staging loop and takes
\* it whenever it is free, as it did before the flag, when its release and
\* re-acquire at a batch boundary were back to back and main's try never
\* queued. Both threads keep running (Stall FALSE) and main still spends
\* every try of its claim against a pass of two descriptors. Must fail
\* ClaimWithinSpin.
SPECIFICATION SpecWeak

CONSTANTS
    F1         = F1
    F2         = F2
    F3         = F3
    Frames     = {F1, F2, F3}
    RingSize   = 3
    PeekMax    = 2
    StageCap   = 2
    FillSize   = 6
    Budget     = 1
    MaxPackets = 5
    SpinMax    = 2
    TryArrivals = 1
    Stall      = FALSE
    NoYield <- NoYieldBroken

INVARIANTS
    TypeOK
    ClaimWithinSpin
