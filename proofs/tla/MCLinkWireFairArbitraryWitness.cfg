\* MCLinkWireFairArbitraryWitness.cfg: MCLink Pattern "arbitrary" under SpecWireFair, checking LinkDelivers (the reversed witness).
SPECIFICATION SpecWireFair
CONSTANTS
    Packets     = {a, b}
    Capacity    = 3
    MaxDelay    = 1
    Duplication = TRUE
    Reordering  = TRUE
    Pattern     = "arbitrary"
    BurstStart  = 1
    BurstLen    = 2
INVARIANTS
    MCTypeOK
    InFlightBounded
    DeliveredWereSent
    WireCarriesOnlySent
    FirstSendLost
PROPERTIES
    LinkDelivers
