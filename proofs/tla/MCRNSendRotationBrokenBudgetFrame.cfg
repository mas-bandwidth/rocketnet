\* A packet the budget refuses is written into a frame already started:
\* the frame is aborted (NoAbort).
SPECIFICATION MCSpec

CONSTANTS
    N           = 2
    Cap         = 2
    MaxFlush    = 2
    EnvStall    = FALSE
    EnvShortAck = FALSE
    EnvRefuse   = TRUE
    KeepDone    = TRUE
    StallGate   = TRUE
    FitsGate    = TRUE
    WriteFirst  = FALSE
    CursorNext  = TRUE
    CutCursor   = TRUE

INVARIANT NoAbort
