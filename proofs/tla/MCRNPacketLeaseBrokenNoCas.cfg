\* MCRNPacketLease reversed witness: insert claims its entry with a plain
\* store.  Two inserters take the same entry and the second overwrites the
\* first's published lease.  Must fail PublishedIntact.
SPECIFICATION Spec

CONSTANTS
    Capacity          = 4
    Threads           = {1, 2}
    Frames            = {1, 2}
    Vals              = {1, 2}
    HashSpread        = 1
    MaxOps1           = 2
    MaxOps2           = 1
    MaxResets         = 2
    EpochLimit        = 2
    UsedLimit         = 2
    UseCas            = FALSE
    ConsumeCas        = TRUE
    BumpEpoch         = TRUE
    EpochLimited      = TRUE
    RetiredOn         = FALSE
    RetiredValidates  = FALSE
    OnWriting         = {"skip"}
    ValidCallers      = FALSE
    AtomicFields      = TRUE

INVARIANTS
    TypeOK
    PublishedIntact
