\* MCRNClientIocp reversed witness: the kernel never delivers the aborts
\* after Close and destroy waits for them without bound (no
\* ROCKETNET_CLIENT_IOCP_DRAIN_WAITS give-up). Destroy never returns, and
\* CloseEventuallyFrees falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Buffers        = 2
    MaxDatagrams   = 2
    FreeWaitsDrain = TRUE
    DrainOnlyReady = TRUE
    KernelStalls   = TRUE
    GiveUp         = FALSE

INVARIANTS
    TypeOK
    FreedOnlyWhenDrained

PROPERTIES
    CloseEventuallyFrees
