\* The trace check's passing control: a hand-written record of one packet's
\* way through a queue's banks is a behaviour of RNGsoQueueBankLayout.
SPECIFICATION TraceSpec

CONSTANTS
    Q         = 1
    NB        = 2
    S         = 2
    Stride    = 2
    Threads   = {1}
    Dests     = {1}
    Demand    = 1
    MaxFlush  = 1
    SkewSpan  = 0
    ClaimCmp  = "ge"
    BlindStore = FALSE
    CounterWrap = 0
    SlotRule  = "check"
    IdRule    = "mul"
    FlushRule = "joined"
    TraceLog  <- GoodLog

INVARIANTS
    TraceConsistent
