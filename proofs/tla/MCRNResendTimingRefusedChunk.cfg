\* MCRNResendTimingRefusedChunk: a refused first send with the chunk beside it,
\* scaled down to fit the budget (one tick is 1 s: resend delay initial and
\* maximum 2 s (2), minimum 1 s (1), reliable timeout 8 s (8)). Either record's
\* first send may be refused for 6 ticks after it is offered. The small record
\* is U; while its first send is refused it is never on the wire and nothing
\* times out, though the chunk was sent at tick 0 and passes its own deadline
\* at tick 8 (rn_window_ack_check_timeout times U alone, and only on the wire).
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 2
    RtoMin      = 1
    RtoMax      = 2
    Timeout     = 8
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    RefuseFor   <- RefuseForLong
INVARIANTS
    TypeOK
    ConfigAccepted
    AttemptsBeforeTimeout
    ResendGapBounded
    NoDueRecordHeld
    DueMeansWritten
    TimeoutFromOldest
