\* MCRNRioWorker reversed witness: neither rule that keeps a draining
\* region from leaking.  Each stop pass dequeues one batch per queue (the
\* old "exactly one available batch per queue") and every failed pass
\* counts against the bound, whether or not it dequeued a completion (the
\* inline drain before CountStalledOnly).  With five cancelled slices,
\* batches of two and two counted passes, passes that each make progress
\* use up the bound and the inline drain leaks with counted passes that
\* dequeued a completion (countedbusy).  The constants of MCRNRioWorkerInlineStop.cfg with DrainLoop
\* and CountStalledOnly FALSE; MCRNRioWorkerInlineStopBatchPerPass.cfg is
\* the same with CountStalledOnly TRUE, which passes.  Must fail
\* LeakOnlyAfterStalls.
SPECIFICATION Spec

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 5
    NumBanks        = 2
    Cap             = 2
    View            = 2
    MaxDatagrams    = 1
    MaxSends        = 0
    DrainBatch      = 2
    StopDrainWaits  = 1
    InlineStop      = TRUE
    BoundedStopDrain = TRUE
    DrainLoop       = FALSE
    CountStalledOnly = FALSE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    TypeOK
    LeakOnlyAfterStalls
