\* MCRNRioWorker reversed witness: each stop pass dequeues one batch per
\* queue (the old "exactly one available batch per queue").  With five
\* cancelled slices, batches of two and two passes, the bounded inline
\* drain leaks after a closesocket that succeeded.  The constants of
\* MCRNRioWorkerInlineStop.cfg with DrainLoop FALSE.  Must fail
\* LeakOnlyAfterRefusal.
SPECIFICATION Spec

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 5
    NumBanks        = 2
    Cap             = 2
    View            = 2
    MaxDatagrams    = 1
    MaxSends        = 0
    DrainBatch      = 2
    StopDrainWaits  = 1
    InlineStop      = TRUE
    BoundedStopDrain = TRUE
    DrainLoop       = FALSE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE

INVARIANTS
    TypeOK
    LeakOnlyAfterRefusal
