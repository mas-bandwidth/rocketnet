\* find_state stopping at a forgotten (ANSWERED) slot of another address as
\* if it were empty, the tombstone treated as empty: a learned entry past it
\* is not found (TableIsMap).
SPECIFICATION MCSpec
VIEW View

CONSTANTS
    a1                = a1
    a2                = a2
    a3                = a3
    m1                = m1
    m2                = m2
    NOADDR            = NOADDR
    Addrs             = {a1, a2, a3}
    Macs              = {m1, m2}
    N                 = 4
    P                 = 2
    SkipOtherEntries  = FALSE
    EvictOldest       = TRUE
    InsertWindowExact = TRUE

INVARIANT TableIsMap
