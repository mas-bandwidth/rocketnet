\* Slot reuse: the connection ends in any state and its slot is given to a new one (the same client object connecting again, or a new client in the same server slot), once, over a path of capacity 1 or 3 each way chosen again at the reuse, so a connection that climbed to 3 is followed by one on a path that carries only 1 and the other way round; three candidates on both lists, one loss burst, one attacker send; ReuseStartsFresh and every safety property, within each connection, under Spec.
SPECIFICATION Spec

CONSTANTS
    ClientSet     = {3, 2, 1}
    ServerList    = {3, 2, 1}
    CapsUp        = {1, 3}
    CapsDown      = {1, 3}
    K             = 2
    MaxBursts     = 1
    AttackBudget  = 1
    AttackKinds   = {"replay", "probe", "reply"}
    Forger        = FALSE
    Timed         = TRUE
    LossBound     = TRUE
    MaxReuses     = 1
    ReuseCapsUp   = {1, 3}
    ReuseCapsDown = {1, 3}
    Broken        = "none"

INVARIANTS
    TypeOK
    ReuseStartsFresh
    RaisedWithinPath
    ServerNeverAhead
    NoWrongRuleOut
    FailOnlyAtP0
    NeverAtRuledOut
    NeverAboveRuled
    RuledIsTheNextStep
    ReplyOnlyConnected
    ReplyNoLarger
    ReplyOwnList
    OneReplyPerUpdate

PROPERTIES
    PNeverDecreases
    StrikeNeedsSmall
    ServerRaisesOnConfirm
    ClientRaisesOnAuthLarge
    NoProbeAfterDone
    NoSkippedStep
