\* MCRNClientIoDecrypt reversed witness: the I/O thread opens a payload
\* before update has entered connected and marks its own window with a
\* sequence update refuses by the state check, so a later copy of that
\* payload is dropped as already received.  PayloadOpenedOnlyConnected is
\* left out, so the mark itself is caught.  Must fail IoWindowWithinMain.
SPECIFICATION Spec

CONSTANTS
    BufferCap        = 2
    MaxDatagrams     = 4
    MaxSeq           = 3
    W                = 1
    MaxReplays       = 1
    MaxForged        = 1
    IntegrityLimit   = 1
    OpenBeforeReplay = FALSE
    SharedWindow     = FALSE
    NoRetire         = FALSE
    CountOnIo        = FALSE
    NoPayloadGate    = TRUE

INVARIANTS
    TypeOK
    CheapRefusalsFirst
    NoOpenWithoutKeys
    IoWindowWithinMain
    AcceptedOnce
    SingleWriter
    ExposedStable
    NoReceiveStall
