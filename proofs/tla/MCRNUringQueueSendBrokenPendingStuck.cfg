\* Reversed witness: an eagain completion hands its slots back to staged
\* without decrementing pend, so pend exceeds the bank's runs in the kernel
\* and completion queue.  Must violate PendingMatches.
SPECIFICATION MCSpec
VIEW MCSafetyView

CONSTANTS
    NB         = 3
    S          = 2
    Dests      = {1, 2}
    MaxSeg     = 2
    Demand     = 3
    MaxFlush   = 3
    MaxEagain  = 1
    RetireRule = "cqe"
    EagainRule = "stuck"
    LockRule   = "try"

INVARIANTS
    TypeOK
    PendingMatches
