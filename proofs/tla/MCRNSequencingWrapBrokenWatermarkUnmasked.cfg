SPECIFICATION MCSpec

CONSTANTS
    Mod         = 8
    CounterMod  = 32
    Net         = 3
    MaxSeqSends = 5
    MaxOrdSends = 4
    Broken      = "watermarkUnmasked"

INVARIANT NewerNeverDiscarded
