\* MCRNSendReserveBrokenNoRetry: a single claim taken back is refused with no retest, so two fillers refused by each other's claims are both refused with a frame left under the budget (NeverStarved).
SPECIFICATION Spec

CONSTANTS
    Fillers   = {f1, f2}
    Reserve   = 2
    MaxFree   = 4
    MaxOwn    = 1
    MaxClaims = 2
    MaxRetire = 2
    MaxPhases = 2
    Chunk     = 1
    GuardWidth = 2
    SharedLine = FALSE
    RoomOnly      = FALSE
    SplitClaim    = FALSE
    RoomFirst     = FALSE
    OwnCountFirst = FALSE
    NoRefresh     = FALSE
    NoReread      = FALSE
    IndexTest     = FALSE
    NoFallback    = FALSE
    BatchCount    = FALSE
    NoTailReturn  = FALSE
    NoRetry       = TRUE
    NameAll       = FALSE

INVARIANTS
    NeverStarved
