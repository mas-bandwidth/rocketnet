\* MCRNIocpRetryStop reversed witness: positions wrap at 2 * Cap. A pass stalls after capturing stop while another worker advances dequeue past it by more than half the wrap, so stop - position looks positive and the pass claims beyond its stop. PassBounded falls. Must fail.
SPECIFICATION Spec

CONSTANTS
    NumOps          = 1
    Workers         = {w1, w2}
    Cap             = 2
    PosMod          = 4
    MaxFail         = 5
    MaxComplete     = 1
    StopSlack       = 0
    ClaimBeforeStop = FALSE

INVARIANT PassBounded
