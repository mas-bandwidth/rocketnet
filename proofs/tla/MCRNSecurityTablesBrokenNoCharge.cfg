\* Reversed witness: ChargePastVerify <- MCNoChargePastVerify (FALSE), the
\* code before 2026-11-10.  A refusal past the verify records nothing, so
\* the sender is never refused before the verify: it takes the whole work
\* budget before the honest request in every update of the window, and
\* HonestConnectsUnderFlood fails.
SPECIFICATION ChargeSpec

CONSTANTS
    None = None
    Addrs = {"A", "B"}
    Tokens = {"th", "te", "tf"}
    Expire <- MCExpire
    Cid <- MCCid
    MaxClock = 4
    CookieLife = 1
    RotatePeriod = 2
    MaxClients = 2
    HistoryCap = 2
    AdmittedCap = 2
    VerifyBudget = 2
    HandshakeDeadline = 4
    Rotation = TRUE
    AcceptPrevious = TRUE
    RefuseAdmittedAtResponse = TRUE
    AdmitExpiredAtResponse = FALSE
    EvictLiveHistory = FALSE
    DeniedConsumesToken = FALSE
    CapVerifyBudget = TRUE
    PreviousOutlivesWindow = FALSE
    BindAtRequest = FALSE
    Holds <- MCHolds
    HoldUntilExpire = FALSE
    CheckCidAtResponse = TRUE
    ChargePastVerify <- MCNoChargePastVerify

INVARIANTS
    FloodInvariants

PROPERTIES
    HonestConnectsUnderFlood

CHECK_DEADLOCK FALSE
