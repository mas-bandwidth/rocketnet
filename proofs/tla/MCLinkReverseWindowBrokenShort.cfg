\* MCLinkReverseWindowBrokenShort.cfg: reversed witness that reverses only full windows: a short window flushed at the end of a send_packets is delivered in send order, failing WindowOrderReversed.
SPECIFICATION SpecReverseWindow
CONSTANTS
    Packets     = {1, 2, 3, 4, 5, 6}
    Capacity    = 6
    MaxDelay    = 0
    Duplication = FALSE
    Reordering  = TRUE
    Pattern     = "none"
    BurstStart  = 1
    BurstLen    = 3
    MaxSeq      = 6
    StoreSlots  = 1
    Defect      = "short_unreversed"
INVARIANTS
    WindowOrderReversed
