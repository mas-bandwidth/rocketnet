\* MCRNServerSendFairBrokenBudgetFrame: the v1.1.1 order: the frame is started before the
\* budget decides, the budget refuses the write and the frame is aborted with
\* its unit, and a healthy slot ends the flush with work left
\* (OtherClientUnaffected). This was the recorded code fault of
\* MCRNServerSendFairShort.cfg before v1.1.2.
SPECIFICATION Spec

CONSTANTS
    N       = 3
    K       = 2
    Conn    = {0, 1, 2}
    WorkMax = 2
    Dark    = {}
    Short   = {2}
    Delay   = 2
    DueRule = "shared"
    Budget  = "frame"
    Mode    = "rounds"
    Q1      = {}
    K1      = 0
    QueueRule = "perqueue"

INVARIANT
    OtherClientUnaffected
