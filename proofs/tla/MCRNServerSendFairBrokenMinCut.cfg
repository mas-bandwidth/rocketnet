\* MCRNServerSendFairBrokenMinCut: the pass before queues were judged one by one. The
\* capacity tested is the fewest of any queue, so with the second queue full for good
\* every flush is cut at its first connected slot and the first queue's slots are
\* never written. Must fail FairService.
SPECIFICATION Spec

CONSTANTS
    N       = 4
    K       = 1
    Conn    = {0, 1, 2, 3}
    WorkMax = 1
    Dark    = {}
    Short   = {}
    Delay   = 2
    DueRule = "shared"
    Budget  = "first"
    Mode    = "rounds"
    Q1      = {1, 3}
    K1      = 0
    QueueRule = "mincut"

INVARIANTS
    FairService
