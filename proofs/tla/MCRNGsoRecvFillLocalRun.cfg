\* MCRNGsoRecvFill passing control with runs past the room made for them (a local sender's segmented send, up to UDP_MAX_SEGMENTS): the code's rule drops no more than the segments the read messages carried past Seg.
SPECIFICATION Spec

CONSTANTS
    Cap         = 4
    Seg         = 2
    MaxRun      = 3
    Batch       = 2
    MaxArrive   = 5
    SockCap     = 3
    VlenRule    = "room"

INVARIANTS
    TypeOK
    DropOnlyPastSeg
