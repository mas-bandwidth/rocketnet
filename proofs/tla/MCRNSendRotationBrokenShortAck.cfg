\* An ack clears the stall without making room and the due test does not
\* ask whether the window can number the ready message: a frame is
\* started for nothing and aborted (NoRefusalAbort).
SPECIFICATION MCSpec

CONSTANTS
    N           = 2
    Cap         = 2
    MaxFlush    = 2
    EnvStall    = FALSE
    EnvShortAck = TRUE
    EnvRefuse   = FALSE
    EnvVain     = FALSE
    KeepDone    = TRUE
    StallGate   = TRUE
    FitsGate    = FALSE
    WriteFirst  = TRUE
    CursorNext  = TRUE
    CutCursor   = TRUE
    VainEnds    = TRUE

INVARIANT NoRefusalAbort
