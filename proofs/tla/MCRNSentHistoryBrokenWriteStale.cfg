\* MCRNSentHistory reversed witness: no stale refusal. A writer that stalled
\* while the other recorded a ring's worth of later sequences overwrites the
\* newer record in its slot. Must fail RingHoldsNewest. MCRNSentHistoryWriters.cfg
\* with one line changed.
SPECIFICATION Spec

CONSTANTS
    N                 = 4
    Threshold         = 2
    MaxSeq            = 7
    MaxLoss           = 2
    Flight            = 2
    AckRange          = 4
    AckSlots          = 2
    Writers           = 2
    CountEveryUnacked = FALSE
    RefuseWhenFull    = FALSE
    WriteStale        = TRUE

INVARIANTS
    TypeOK
    EveryEvictionClassified
    LostImpliesLaterAcked
    LargestAckedIsMaximum
    SendNeverRefused
    RingHoldsNewest
    EverySendTransmitted
