\* Reversed witness: the disconnect burst takes one sequence from the counter
\* and seals its Burst packets from it; a send that takes the next sequence
\* repeats one the burst seals, and SequencesUnique must fail.
SPECIFICATION MCSpec

CONSTANTS
    MaxSeq = 5
    Fills  = {f1, f2}
    Burst  = 2
    Broken = "burstone"

INVARIANT SequencesUnique
