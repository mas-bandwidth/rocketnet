\* MCRNRioWorker reversed witness: main reads only a bank the worker has
\* left, the old ready FIFO's rule, so a datagram the worker committed
\* before a call waits for a later call.  Must fail DeliveredByNextCall.
SPECIFICATION Spec

CONSTANTS
    DropHanded      = FALSE
    DrainSendsBeforeClose = TRUE
    Slices          = 2
    Cap             = 2
    View            = 4
    MaxDatagrams    = 3
    MaxSends        = 0
    DrainBatch      = 2
    StopDrainWaits  = 2
    InlineStop      = FALSE
    BoundedStopDrain = TRUE
    DrainLoop       = TRUE
    CountStalledOnly = TRUE
    SwitchOnIdle    = TRUE
    BoundedDequeue  = TRUE
    DrainBeforeExit = TRUE
    WakeOnReturn    = TRUE
    ReadOnlyLeft    <- ReadOnlyLeftBroken

INVARIANTS
    TypeOK
    ExactDelivery
    DeliveredByNextCall
