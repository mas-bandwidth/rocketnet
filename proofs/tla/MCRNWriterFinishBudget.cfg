\* MCRNWriterFinishBudget: the committed run on a staged transport with a send budget: the bucket may refuse a small start
\* while frames are left, or pay only a frame of its own (the whole-frame form).
SPECIFICATION Spec

CONSTANTS
    Writers          = {w1, w2}
    Clients          = {c1, c2}
    NoOwner          = none
    Capacity         = 2
    MaxStarts        = 5
    SealAtFinish     = TRUE
    RefuseNoCapacity = TRUE
    CheckOwner       = TRUE
    Buffered         = FALSE
    RingRefuses      = FALSE
    Budgeted         = TRUE
    RestartAtFinish  = TRUE
    ValidateFirst    = TRUE

INVARIANTS
    TypeOK
    OneWriter
    SealedInCall
    StagedQueuesNothing
    Accounted

PROPERTIES
    BadBytesNeverRefused
