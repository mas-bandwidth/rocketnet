\* MCServerStopSpread with the development link simulator: two send queues, two slots, two connections (session 1 on queue 1, session 2 on queue 0), bursts of two, a bank of two a queue and a ring of four; every sealed packet goes to the simulator, which drains into the staging only while every queue has room. Every invariant, and the I/O is never told to stop while the simulator holds a copy. Must pass.
SPECIFICATION Spec

CONSTANTS
    SlotCount   = 2
    MaxSessions = 2
    Burst       = 2
    BankSize    = 2
    QueueCount  = 2
    RingSize    = 4
    SteadyCap   = 2
    Simulator   = TRUE
    Defect      = "none"

INVARIANTS
    TypeOK
    RingHolds
    SealedWithinBurst
    NoRefusedStart
    WithinBank
    RingIsOwed
    HeadNeverDone
    FullBurstBeforeStopped
    NoSendCutAtStop
    NoDropWhileRoomCanReturn
    EachBurstSettledOnce
    OnlyJammedQueuesDrop
    NoCopyHeldAtStop
