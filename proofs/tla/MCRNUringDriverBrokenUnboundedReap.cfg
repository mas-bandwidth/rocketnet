\* MCRNUringDriver reversed witness: unbounded reap.  BoundedReap = FALSE
\* is the drain until empty: Reap has no budget guard, receive_packets ends
\* only with the cq empty and send_packets only once every send is reaped.
\* Must fail ReapWithinBudget: a call reaps more than Budget CQEs.
SPECIFICATION Spec

CONSTANTS
    Slots             = 2
    Buffers           = 2
    MaxSteps          = 2
    Budget            = 1
    ResetWaitsForReap = TRUE
    ReapIntoFill      = TRUE
    BoundedReap       = FALSE
    RearmOnReceive    = TRUE
    RunRetiredByCqe   = TRUE

INVARIANTS
    TypeOK
    NoReuseWhileKernelOwned
    ExposedStable
    BufferReturnedAfterCopy
    FreedOnlyWhenDrained
    ReapWithinBudget
