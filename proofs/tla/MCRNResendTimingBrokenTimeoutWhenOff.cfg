\* MCRNResendTimingBrokenTimeoutWhenOff: the reliable timeout off, but timed
\* from the first send as before v1.1.0 (6 s). It must fail OffMeansNoStallEnd.
SPECIFICATION Spec
CONSTANTS
    RtoInitial     = 4
    RtoMin         = 1
    RtoMax         = 4
    Timeout        = 12
    MaxBackoff     = 1
    MinAttempts    = 4
    TimeoutOn      <- TimeoutOff
    TimeoutWhenOff <- TimeoutWhenOffOn
INVARIANT
    OffMeansNoStallEnd
