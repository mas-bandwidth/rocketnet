\* Reversed witness "reusekeep": the server slot keeps its P across a reuse. A connection on a path of capacity 3 each way raises both ends to 3; it ends and the slot is given to a new connection on a path of capacity 1 down, whose server slot starts at the old P, 3: ReuseStartsFresh fails at the reuse (and RaisedWithinPath with it). Three candidates on both lists, no loss, no attacker.
SPECIFICATION Spec

CONSTANTS
    ClientSet     = {3, 2, 1}
    ServerList    = {3, 2, 1}
    CapsUp        = {3}
    CapsDown      = {1, 3}
    K             = 2
    MaxBursts     = 0
    AttackBudget  = 0
    AttackKinds   = {"replay", "probe", "reply"}
    Forger        = FALSE
    Timed         = TRUE
    LossBound     = TRUE
    MaxReuses     = 1
    ReuseCapsUp   = {3}
    ReuseCapsDown = {1, 3}
    Broken        = "reusekeep"

INVARIANTS
    TypeOK
    ReuseStartsFresh
