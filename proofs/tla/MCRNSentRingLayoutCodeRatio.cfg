\* The code's sizing: the reference ring is R * P, and the reference test
\* never fires (RefEvictionIdle) because the packet test always frees room first.
SPECIFICATION MCSpec
VIEW View

CONSTANTS
    Part         = "sent"
    P            = 3
    R            = 2
    MaxRefs      = 6
    Rq           = 3
    SerialMod    = 4
    MaxWrites    = 30
    MaxEvents    = 0
    EvictAtP     = TRUE
    RefTestExact = TRUE
    ResetEmpty   = TRUE
    ReceiptClamp = TRUE
    SerialSkip   = TRUE

INVARIANTS
    TypeOK
    RingBounded
    SlotsIntact
    RefsIntact
    OutcomesOwn
    RefEvictionIdle
