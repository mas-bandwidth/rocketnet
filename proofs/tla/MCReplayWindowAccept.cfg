\* MCReplayWindowAccept: the accept control.  A ring of 2 words of 2 bits
\* (W = 4) over sequences 1..12, three windows deep, with every packet kind:
\* an ack-eligible packet advanced into accepted_session on open, a payload
\* advanced only when Accept takes it (at once, later, or never), and a
\* packet ignored after the open that reaches replay_session alone.  Every
\* rule on; every invariant passes.
SPECIFICATION MCSpec

CONSTANTS
    Words             = 2
    WordBits          = 2
    ClearedWords      = 2
    MaxSeq            = 12
    GateBeforeAdvance = TRUE
    GateBeforeOpen    = TRUE
    MarkOnAdvance     = TRUE
    RefuseBelowFloor  = TRUE
    PayloadAtAccept   = TRUE
    Kinds             = {"eligible", "payload", "ignored"}

INVARIANTS
    TypeOK
    WindowIsTruth
    AcceptedIsTruth
    GenuineIsAccepted
    AckReportsOnlyReceived
    ReceivedIsRefused
    BelowFloorIsRefused
    HighestIsReceived
    OpenNeverAcceptedFirst
    NoAdvanceBeforeConnect
    AckReportsOnlyProcessed
    NoOpenBeforeConnect

PROPERTIES
    Monotone
