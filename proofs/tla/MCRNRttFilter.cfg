\* MCRNRttFilter: the code (v1.1.1), two numbers and two packets in flight,
\* outages up to 4 ticks, loss: the filter refuses exactly the samples a real
\* owed silence delayed, and the estimate is never poisoned.
SPECIFICATION Spec
CONSTANTS
    Probe     = 3
    RttLow    = 0
    RttHigh   = 1
    OutageMax = 4
    M         = 2
    P         = 2
    Rule      = "owed"
    FirstAck  = FALSE
INVARIANTS
    TypeOK
    NoSampleAcrossSilence
    RefuseOnlyAfterOwedSilence
