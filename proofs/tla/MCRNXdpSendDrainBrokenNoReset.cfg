\* MCRNXdpSendDrainBrokenNoReset: reversed witness, the stall count never restarts when the consumer moves; a ring that drains slowly is given up on. Must fail NeverAbandonDraining.
SPECIFICATION Spec

CONSTANTS
    RingSize  = 3
    Modulus   = 4
    BatchMax  = 2
    MaxFrames = 6
    Bound     = 3
    SlowGap   = 2
    Defect    = "noreset"

INVARIANTS
    TypeOK
    NeverAbandonDraining
