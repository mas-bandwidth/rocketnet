\* MCRNFillPhaseBrokenArmedAtCreate: the check is armed from create, so the calls of a game that never names a client enter it, and can be refused (NoCheckBeforeOptIn).
SPECIFICATION Spec

CONSTANTS
    Fillers      = {f1, f2}
    Clients      = {c1, c2}
    NoOwner      = none
    MaxMain      = 2
    MaxFills     = 2
    LookFirst    = FALSE
    LoadStore    = FALSE
    ResetOnLeave = TRUE
    NoEpochLook  = FALSE
    NoRestore    = FALSE
    ScanOne      = FALSE
    OptedAtStart  = FALSE
    ArmedAtCreate = TRUE
    Lines        = {0, 1}
    LineChoice   <- MCLineChoice
    f1 = f1
    f2 = f2
    f3 = f3

INVARIANTS
    NoCheckBeforeOptIn
