    LoadStore    = FALSE
    ResetOnLeave = TRUE
    NoEpochLook  = FALSE
    NoRestore    = FALSE
    ScanOne      = FALSE
    NoWindow     = FALSE
    NoMainWindow = FALSE
    TakeUncounted = FALSE
    OptedAtStart  = FALSE
