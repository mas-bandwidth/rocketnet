\* MCServerConnection history flushed: one token shared by two clients, two slots,
\* and no used-token history (History "none"). The checks at the response alone
\* keep one live connection per token (OneConnectionPerToken).
SPECIFICATION Spec

CONSTANTS
    NumClients          = 2
    NumAddrs            = 2
    NumTokens           = 1
    MaxSlots            = 2
    MapCap              = 2
    HeldCapacity        = 2
    MaxAttempts         = 1
    MaxNonces           = 2
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 0
    HandshakeDeadline   = 0
    Disconnects         = TRUE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "any"
    History             = "none"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2

INVARIANTS
    SafetyInvariants
