\* MCRNServerLinkStop reversed witness: a copy whose queue has no room is
\* discarded without waiting for the transport to be idle. Must fail
\* NoDropWhileRoomCanReturn.
SPECIFICATION FairSpec
CONSTANTS
    QueueCount = 2
    BankSize = 2
    Copies = 3
    Defect = "earlydiscard"
INVARIANTS
    TypeOK
    CopiesAccounted
    NoDropWhileRoomCanReturn
