\* MCRNSendReserveCallsBrokenOwnUnbounded: the Queues instance with an open that hands every acknowledged client its own frame, past the smallest queue's reserve: two own frames against a reserve of one, or of none while the reserve is cut (OwnWithinReserve).
SPECIFICATION Spec

CONSTANTS
    Clients   = {0, 1}
    NQ        = 2
    Reserve   = 1
    MaxFree   = 3
    SeenInit  = 1
    Chunk     = 1
    Guard     = 1
    RoomOnly     = FALSE
    NoRefresh    = FALSE
    AbortReturns = FALSE
    TailLeak     = FALSE
    MinRoom      = FALSE
    StickyReserve = FALSE
    OwnUnbounded  = TRUE

CONSTRAINT Bound

INVARIANTS
    OwnWithinReserve
