\* MCRNBufferHandoff reversed witness: the family race's commit leaves a held ring bound to the losing server, so items committed after it leave for that server. SentToCommitted falls. Must fail.
SPECIFICATION SpecFair

CONSTANTS
    N                 = 3
    Cap               = 2
    MaxItems          = 5
    MaxReady          = 2
    Direction         = "send"
    MainBlocks        = FALSE
    WorkUnderLock     = FALSE
    WriteAfterPublish = FALSE
    SkipWake          = FALSE
    ReleaseBeforeSent = FALSE
    DiscardOnStop     = FALSE
    DropFinal         = FALSE
    DestinationOverwrite = FALSE
    SkipRebind        = TRUE

INVARIANTS
    TypeOK
    OneOwner
    FreeIsEmpty
    ViewStable
    InOrder
    NoWorkUnderLock
    MainNeverWaits
    ExitSentAll
    SentToCommitted

PROPERTIES
    StopSendsAll
