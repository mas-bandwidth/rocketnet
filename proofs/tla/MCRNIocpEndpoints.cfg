\* MCRNIocpEndpoints: two endpoints of two receives, every rule on: invariants and EveryWorkerExits. Must pass.
\* Size: with a post as steps of its worker, three endpoints of two receives (the size before) explore 4,888,285 distinct states for safety alone, beyond the 110 s bounded record, so it is not a case; MCRNIocpEndpoints3x1.cfg keeps three endpoints with one receive each.
SPECIFICATION Spec

CONSTANTS
    E               = 2
    R               = 2
    RepostOnOwner   = TRUE
    CancelOwnSocket = TRUE
    CountFirst      = TRUE

INVARIANTS
    TypeOK
    OnOwnerSocket
    ExitedOnlyDrained
    DrainerLives

PROPERTIES
    EveryWorkerExits
