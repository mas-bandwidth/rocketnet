\* Reversed witness: one phase, the staging before the phases.  Its index
\* stays while a send is pending, so with the completions reaped one call
\* late the next update finds the phase full.  Must violate
\* NeverRefusedUnderLateReap.
SPECIFICATION MCSpec

CONSTANTS
    Phases       = 1
    Size         = 2
    MaxUpdates   = 4
    LateReap     = TRUE
    BaseRule     = TRUE
    QuotientRule = TRUE

INVARIANTS
    TypeOK
    NoWriteWhileKernelOwned
    PendingMatches
    NeverRefusedUnderLateReap
