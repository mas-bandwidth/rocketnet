\* MCLinkSpecNone.cfg: MCLink Pattern "none" under Spec, checking ResentIsDelivered.
SPECIFICATION Spec
CONSTANTS
    Packets     = {a, b}
    Capacity    = 3
    MaxDelay    = 1
    Duplication = TRUE
    Reordering  = TRUE
    Pattern     = "none"
    BurstStart  = 1
    BurstLen    = 2
INVARIANTS
    MCTypeOK
    InFlightBounded
    DeliveredWereSent
    WireCarriesOnlySent
    FirstSendLost
PROPERTIES
    ResentIsDelivered
