\* Reversed witness: the claim reads the counter and later stores load + 1
\* (BlindStore TRUE) instead of one fetch-add, so two threads that loaded
\* one index both get it.
\* Must violate NoSharedSlot.
SPECIFICATION Spec
CONSTANTS
    Q = 2
    NB = 3
    S = 3
    Stride = 4
    Threads = {1, 2}
    Dests = {0, 1}
    Demand = 2
    MaxFlush = 3
    SkewSpan = 1
    ClaimCmp = "ge"
    BlindStore = TRUE
    CounterWrap = 0
    SlotRule = "check"
    IdRule = "mul"
    FlushRule = "joined"
INVARIANT TypeOK
INVARIANT OneProducer
INVARIANT InBounds
INVARIANT NoSharedSlot
INVARIANT NoForeignWrite
INVARIANT RouteMatches
INVARIANT NoWorkerWrite
INVARIANT StagedMatches
