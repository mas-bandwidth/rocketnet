\* Reversed witness: the claim stores load + 1 without the compare
\* (ClaimRule "store"), so two threads that loaded one index both get it.
\* Must violate NoSharedSlot.
SPECIFICATION Spec
CONSTANTS
    Q = 2
    NB = 3
    S = 3
    Stride = 4
    Threads = {1, 2}
    Dests = {"a", "b"}
    QueueOf <- MCQueueOf
    Demand = 2
    MaxFlush = 3
    Skew <- MCSkew
    ClaimCmp = "ge"
    ClaimRule = "store"
    SlotRule = "check"
    IdRule = "mul"
    FlushRule = "joined"
INVARIANT TypeOK
INVARIANT OneProducer
INVARIANT InBounds
INVARIANT NoSharedSlot
INVARIANT NoForeignWrite
INVARIANT RouteMatches
INVARIANT NoWorkerWrite
INVARIANT StagedMatches
