\* MCRNSendReserveBrokenNameAll: every refusal counted SEND_RESERVE_REFUSED_TAILS_HELD, so a refusal whose read of the lines saw no other filler holding frames is counted on the tails row (TailsNamed).
SPECIFICATION Spec

CONSTANTS
    Fillers   = {f1, f2}
    Reserve   = 2
    MaxFree   = 4
    MaxOwn    = 1
    MaxClaims = 2
    MaxRetire = 2
    MaxPhases = 2
    Chunk     = 1
    GuardWidth = 2
    SharedLine = FALSE
    RoomOnly      = FALSE
    SplitClaim    = FALSE
    RoomFirst     = FALSE
    OwnCountFirst = FALSE
    NoRefresh     = FALSE
    NoReread      = FALSE
    IndexTest     = FALSE
    NoFallback    = FALSE
    BatchCount    = FALSE
    NoTailReturn  = FALSE
    NoRetry       = FALSE
    NameAll       = TRUE

INVARIANTS
    TailsNamed
