\* MCRNSendReserveBrokenNameAll: every refusal counted SEND_RESERVE_REFUSED_TAILS_HELD, so a refusal with no room for its frame past the reserve and every filler in flight (a true full) is counted on the tails row, which is then no lower bound (TailsNamed).
SPECIFICATION Spec

CONSTANTS
    Fillers   = {f1, f2}
    Reserve   = 2
    MaxFree   = 4
    MaxOwn    = 1
    MaxClaims = 2
    MaxRetire = 2
    MaxPhases = 2
    Chunk     = 1
    GuardWidth = 2
    SharedLine = FALSE
    RoomOnly      = FALSE
    SplitClaim    = FALSE
    RoomFirst     = FALSE
    OwnCountFirst = FALSE
    NoRefresh     = FALSE
    NoReread      = FALSE
    IndexTest     = FALSE
    NoFallback    = FALSE
    BatchCount    = FALSE
    NoTailReturn  = FALSE
    NoRetry       = FALSE
    NameAll       = TRUE

INVARIANTS
    TailsNamed
