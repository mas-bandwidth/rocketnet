\* MCServerConnection: the committed run. Two clients contend for one slot
\* and reuse it after a disconnect or a timeout from either side.
\* README-ServerConnection.md lists the other runs as edits to this file.
SPECIFICATION Spec

CONSTANTS
    NumClients          = 2
    NumAddrs            = 2
    NumTokens           = 2
    MaxSlots            = 2
    MapCap              = 2
    HeldCapacity        = 2
    MaxAttempts         = 1
    MaxNonces           = 1
    MaxMoves            = 0
    SendInterval        = 1
    Timeout             = 0
    HandshakeDeadline   = 0
    Disconnects         = TRUE
    DisconnectCopies    = 1
    SameId              = FALSE
    TokenChoice         = "any"
    History             = "kept"
    KindLoss            = "none"
    RepeatKeepAlive     = TRUE
    SweepRemovesMapping = TRUE
    HoldUntilExpire     = FALSE
    ClientIdCheckAtRequest  = TRUE
    ClientIdCheckAtResponse = TRUE
    AddressIsIdentity   = TRUE
    ExpiredTokens       = {}
    C2SPattern          = "none"
    S2CPattern          = "none"
    Capacity            = 1
    MaxDelay            = 0
    Duplication         = FALSE
    Reordering          = FALSE
    BurstStart          = 1
    BurstLen            = 2

INVARIANTS
    SafetyInvariants
    ChurnNeverDenied
    ExpiredTokenNeverMapped

PROPERTIES
    PacketsReachOwnSlotOnly
    SessionNeverAnswered
