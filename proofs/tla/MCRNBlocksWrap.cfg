\* MCRNBlocksWrap: MCRNBlocks.cfg with ring_next starting at 5 (the window
\* empty, earlier traffic acked). The single takes units 5..6; the block's
\* span of 5 units would cross 8 from 7, so rn_window_send_position pads to 8
\* and the block's offsets wrap to 0, 2, 4. Every invariant, the span inside
\* one lap and no refusal of a correct sender among them.

SPECIFICATION Spec

CONSTANTS
    W            = 4
    F            = 2
    B            = 8
    Small        = 2
    Units        <- MCUnits
    PlaceByIndex = TRUE
    RingStart    <- MCRingStartLate
    FwdPattern   = "arbitrary"
    Capacity     = 2
    MaxDelay     = 0
    Duplication  = TRUE
    Reordering   = TRUE
    BurstStart   = 1
    BurstLen     = 2

INVARIANTS
    TypeOK
    SplitConsecutive
    NoPartialDelivery
    OneOrderingSlotPerBlock
    DeliveredEqualsSent
    SpanInsideRing
    NeverRefused
