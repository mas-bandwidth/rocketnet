\* MCRNClientDelivery reversed witness: the update's packet budget is one
\* more than the batch (the static_asserts removed), so a packet can arrive
\* with no slot for its payload. Must fail SlotForNextPacket.
SPECIFICATION Spec
CONSTANTS
    Cap = 3
    Budget = 4
    MaxIds = 4
    CallerDrains = TRUE
    Defect = "countbeforeplace"
INVARIANTS
    TypeOK
    SlotForNextPacket
