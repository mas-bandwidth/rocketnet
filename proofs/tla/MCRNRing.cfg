\* MCRNRing: the committed run, every rule on. README-RNRing.md gives the
\* reversed witnesses (FloorAtUPrime, PadAtBoundary, IdleFloorAtP, Round16
\* each FALSE in turn) as the MCRNRingBroken*.cfg files beside this one.
SPECIFICATION Spec

CONSTANTS
    B              = 64
    Lengths        = {1, 32, 48}
    FragBytes      = 16
    BlockFragments = 2
    MaxBlocks      = 1
    MaxNumbers     = 6
    FloorAtUPrime  = TRUE
    PadAtBoundary  = TRUE
    IdleFloorAtP   = TRUE
    Round16        = TRUE

INVARIANTS
    TypeOK
    LiveSpansDisjoint
    SpanInsideRing
    Aligned
    IdleAdmitsAnyMessage

PROPERTIES
    EveryAdmissibleMessagePlaced
    NoRecordWaitsForever
