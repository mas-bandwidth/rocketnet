\* MCRNServerLinkStop reversed witness: the drain goes on only while the
\* fewest free frames of any queue are above 0 and never discards (the code
\* before the fix). Must fail StopFinishes.
SPECIFICATION FairSpec
CONSTANTS
    QueueCount = 2
    BankSize = 2
    Copies = 3
    Defect = "fewest"
INVARIANTS
    TypeOK
    CopiesAccounted
PROPERTIES
    StopFinishes
