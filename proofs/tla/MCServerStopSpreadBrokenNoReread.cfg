\* MCServerStopSpread reversed witness: the stop step abandons the waiting bursts without reading the room again after send_idle. A full staging whose frames all finish during the idle check reports idle with its room back, and the bursts are abandoned with room to send them. Must fail NoDropWhileRoomCanReturn.
SPECIFICATION Spec

CONSTANTS
    SlotCount   = 2
    MaxSessions = 4
    Burst       = 2
    BankSize    = 3
    QueueCount  = 1
    RingSize    = 4
    SteadyCap   = 2
    Simulator   = FALSE
    Defect      = "noreread"

INVARIANT NoDropWhileRoomCanReturn
