\* MCRNRing reversed witness: when nothing is outstanding the floor is the
\* last record's ring_start instead of p. Must fail IdleAdmitsAnyMessage (the
\* rule as a state predicate); with that line removed and TLC's -deadlock
\* flag, the same run fails the liveness property EveryAdmissibleMessagePlaced
\* instead (README-RNRing.md). The committed MCRNRing.cfg with one line
\* changed.
SPECIFICATION Spec

CONSTANTS
    B              = 64
    Lengths        = {1, 32, 48}
    FragBytes      = 16
    BlockFragments = 2
    MaxBlocks      = 1
    MaxNumbers     = 6
    FloorAtUPrime  = TRUE
    PadAtBoundary  = TRUE
    IdleFloorAtP   = FALSE
    Round16        = TRUE

INVARIANTS
    TypeOK
    LiveSpansDisjoint
    SpanInsideRing
    Aligned
    IdleAdmitsAnyMessage

PROPERTIES
    EveryAdmissibleMessagePlaced
    NoRecordWaitsForever
