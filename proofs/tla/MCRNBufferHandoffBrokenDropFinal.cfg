    Cap               = 2
    MaxItems          = 5
    MaxReady          = 2
    Direction         = "send"
    MainBlocks        = FALSE
    WorkUnderLock     = FALSE
    WriteAfterPublish = FALSE
    SkipWake          = FALSE
    ReleaseBeforeSent = FALSE
    DiscardOnStop     = FALSE
    DropFinal         = TRUE

INVARIANTS
    TypeOK
    OneOwner
    FreeIsEmpty
    ViewStable
    InOrder
    NoWorkUnderLock
    MainNeverWaits
    ExitSentAll

PROPERTIES
    StopSendsAll
