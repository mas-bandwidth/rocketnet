\* MCServerStopSpread: the disconnect ring and the stop spread across steps at two slots, four connections, bursts of three, a staging of three and a ring of four; every invariant. Must pass.
SPECIFICATION Spec

CONSTANTS
    SlotCount   = 2
    MaxSessions = 4
    Burst       = 3
    BankSize    = 3
    RingSize    = 4
    SteadyCap   = 2
    Defect      = "none"

INVARIANTS
    TypeOK
    RingHolds
    SealedWithinBurst
    NoRefusedStart
    WithinBank
    RingIsOwed
    HeadNeverDone
    FullBurstBeforeStopped
