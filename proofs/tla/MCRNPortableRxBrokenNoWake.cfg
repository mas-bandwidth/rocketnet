\* MCRNPortableRx reversed witness: main never signals the worker when it
\* frees a bank.  With no wait timeout a worker holding a full producer
\* waits forever.  Must fail EveryDatagramDelivered.
SPECIFICATION SpecFair

CONSTANTS
    NumBanks       = 3
    Cap            = 2
    Budget         = 1
    MaxDatagrams   = 4
    MaxChaff       = 0
    HoldOnFull     = TRUE
    ReturnWhenRead = TRUE
    QuitBeforeWake = TRUE
    WakeOnReturn   = FALSE
    Timeout        = FALSE
    BoundedRead    = TRUE

INVARIANTS
    TypeOK
    ExactDelivery

PROPERTIES
    EveryDatagramDelivered
