\* MCRNRioDriver reversed witness: Free follows Close at once.  The region
\* is deregistered and freed while closesocket's error completions are still
\* queued and the kernel still owns posted requests, and
\* FreedOnlyWhenDrained falls.  Must fail.
SPECIFICATION Spec

CONSTANTS
    Slots            = 2
    Slices           = 2
    MaxSteps         = 1
    SwitchWaitsDrain = TRUE
    FreeWaitsDrain   = FALSE
    ReceiveBounded   = TRUE
    RetryRefused     = TRUE

INVARIANTS
    TypeOK
    ReceiveCallBound
    NoReserveIntoPostedPhase
    OutstandingCounts
    CompletionsOwned
    ExposedStable
    RepostOnlyAfterCopy
    ReceiveDepthNeverShrinks
    FreedOnlyWhenDrained
