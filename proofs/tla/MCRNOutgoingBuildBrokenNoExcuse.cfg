\* MCRNOutgoingBuild reversed witness: the one-update deadline with no
\* excuse for a pass the transport cut (Excused <- ExcusedNever). The
\* write pass finds no frame or a packet fails at finish, the reliable
\* phase ends with the promised record still queued, and send_packets
\* returns. Must fail ReliableSentWithinOneUpdate.
SPECIFICATION Spec

CONSTANTS
    N         = 6
    Cap       = 3
    NumFrames = 2
    MaxPackets = 1
    MaxAcks   = 1
    MaxFaults = 1
    Kind      <- MCKind
    Fits      <- MCFits
    Decl      <- MCDecl
    CopyStep  <- CopyStepDesign
    SharedQuota = TRUE
    Reserve   = TRUE
    MovePrior = FALSE
    ReuseCommitted = FALSE
    Buffered  = FALSE
    Excused   <- ExcusedNever

INVARIANTS
    TypeOK
    PacketQuota
    BytesUnchangedInPlace
    NoCopy
    AcksNeverLost
    ModeOrder

PROPERTIES
    ReliableSentWithinOneUpdate
    PriorRecordsUnmoved
    FrameClosedOnlyByFullOrFlush
