\* init that leaves the marks as the memset left them, slot 0, where the
\* heads and tails are set to RN_RESEND_NONE: an empty class names slot 0 as
\* its first number on the wire (MarkMatch).
SPECIFICATION MCSpec

CONSTANTS
    W                 = 4
    SelfTailFix       = TRUE
    TailOnEnd         = TRUE
    UnlinkClearsClass = TRUE
    InsertSetsClass   = TRUE
    MarkOnUnlink      = TRUE
    MarkOnPushTail    = TRUE
    MarkInitNone      = FALSE

INVARIANT MarkMatch
