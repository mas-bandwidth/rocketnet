\* The passing control: the code's reap, hold and copy over two queues,
\* one datagram per receive and a bank of two; every invariant and the
\* action property.
SPECIFICATION MCSpec

CONSTANTS
    CqCap     = 4
    Q         = 2
    HeldCap   = 2
    Buffers   = 3
    Room      = 2
    Seg       = 1
    Budget    = 3
    MaxRecv   = 6
    MaxSends  = 2
    HoldRule  = TRUE
    HeldMod   = TRUE
    TurnRule  = TRUE

INVARIANTS
    TypeOK
    HeldMatches
    InOrder
    TurnsTaken
    BankWithinRoom

PROPERTIES
    SendsNotBehindRoom
