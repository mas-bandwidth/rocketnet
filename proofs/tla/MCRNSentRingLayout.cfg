\* The passing control of the packet and reference rings: every rule on, a
\* reference ring of four (below the code's ratio) so the reference test binds.
SPECIFICATION MCSpec
VIEW View

CONSTANTS
    Part         = "sent"
    P            = 3
    R            = 2
    MaxRefs      = 4
    Rq           = 3
    SerialMod    = 4
    MaxWrites    = 30
    MaxEvents    = 0
    EvictAtP     = TRUE
    RefTestExact = TRUE
    ResetEmpty   = TRUE
    ReceiptClamp = TRUE
    SerialSkip   = TRUE

INVARIANTS
    TypeOK
    RingBounded
    SlotsIntact
    RefsIntact
    OutcomesOwn
