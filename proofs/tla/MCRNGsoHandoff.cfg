\* MCRNGsoHandoff: the GSO worker/main bank handoff, every rule on, every invariant. Must pass. Five datagrams so the receive worker reaches a stall (a full buffer behind a waiting ready one, a datagram still arriving). The liveness properties are checked on the smaller MCRNGsoHandoffLive.cfg.
SPECIFICATION SpecFair

CONSTANTS
    RxCap            = 2
    TxCap            = 2
    MaxRx            = 5
    MaxTx            = 4
    PublishWhileHeld = FALSE
    MainBlocks       = FALSE
    FullDrops        = FALSE
    CarryBehind      = FALSE

INVARIANTS
    TypeOK
    RxOneOwner
    TxOneOwner
    TxQueuesDistinct
    NoPublishWhileHeld
    RxBacksOff
    FreeIsEmpty
    SentOrHeld
    RxAccounted
    RxInOrder
    TxInOrder
    MainNeverWaits
    StopJoinsBeforeFree
    ExitSentAll
    FullSocketDropsOnlyAfterShutdown
    RefusalsBounded
