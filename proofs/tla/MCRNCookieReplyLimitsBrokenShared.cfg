\* Cookie replies spend the handshake work budget: a cookie-valid request is refused before any verify ran.
SPECIFICATION MCSpec

CONSTANTS
    Sources      = {1, 2, 3}
    Bound        = 2
    Factor       = 2
    WordBits     = 2
    HashRange    = 8
    VerifyBudget = 1
    Broken       = "shared"

INVARIANT WorkBudgetOnlyVerifies
