\* MCRNResendTimingPacedSmall reversed witness: the walk before the fix, each
\* class walked from its head with its never-sent numbers first. With the
\* small record and the chunk both due, the first call writes the small
\* record and plans a never-sent chunk where the due chunk should be; the
\* second call writes that never-sent chunk, and the update ends with the
\* chunk due and unsent. Must fail NoDueRecordHeld.
SPECIFICATION Spec
CONSTANTS
    RtoInitial  = 4
    RtoMin      = 1
    RtoMax      = 4
    Timeout     = 20
    MaxBackoff  = 1
    MinAttempts = 4
    Chunk       <- ChunkInFlight
    Room        <- RoomTwo
    Pending     <- PendingLong
    UnsentFirst <- UnsentFirstOn
INVARIANTS
    TypeOK
    NoDueRecordHeld
