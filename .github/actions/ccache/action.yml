# The compiler cache on the fleet's self-hosted runners. Every CMake configure
# after this step compiles through ccache (CMake reads
# CMAKE_<LANG>_COMPILER_LAUNCHER from the environment), into one cache
# directory per host user that survives between jobs, so a job recompiles
# only the translation units its commit changed.
#
# Where the cache lives and how big it is belong to the runner, not to this
# file: the fleet record gives each runner host CCACHE_DIR (a directory on the
# machine's boot volume) and CCACHE_MAXSIZE (sized from that volume's free
# space) in the runner service's environment (nova-config machine set
# <machine> --runner_env, written by nova-fleet github-runners). A runner
# without them uses $HOME/.cache/rocketnet-ccache at 5G; a runner without
# ccache builds uncached and says so. Any other CCACHE_* setting in the
# runner's environment refuses the job: this file owns what makes a hit safe.
#
# What makes a hit safe, set here for every job:
# - each object is keyed on the compiler, every flag (so Debug, Release, the
#   sanitizers, coverage and the cross compilers never share an object) and
#   the preprocessed source or, in direct mode, every include file's content;
# - the compiler is identified by its content on Linux, and by `<compiler> -v`
#   on macOS, where /usr/bin/cc and /usr/bin/c++ are xcrun trampolines whose
#   content does not change when Xcode or the Command Line Tools do;
# - no sloppiness and no base_dir: paths stay absolute (tests locate their
#   corpora through __FILE__, which a relative rewrite would break), so a hit
#   needs the same work directory, which each runner keeps between jobs;
# - a compile that fails is never cached, so with -Werror a warning stays a
#   red build however warm the cache is.
#
# Each job writes its own statistics log (CCACHE_STATSLOG under RUNNER_TEMP),
# and .github/actions/ccache-stats prints that job's hit rate at its end; the
# shared counters are never zeroed, since other jobs on the host use them.
name: compiler cache
description: Route every CMake compile in this job through the host's ccache
runs:
  using: composite
  steps:
    - name: Compiler cache (ccache)
      shell: bash
      run: |
        set -euo pipefail
        host="$(uname -sm)"
        if [ -r /etc/os-release ]; then host="$host $(. /etc/os-release && echo "$ID-$VERSION_ID") $(getconf GNU_LIBC_VERSION 2>/dev/null | tr ' ' '-')"; fi
        echo "runner $RUNNER_NAME: $(getconf _NPROCESSORS_ONLN 2>/dev/null || echo '?') processors, $host"
        if ! command -v ccache >/dev/null 2>&1; then
          echo "CCACHE-ABSENT on $RUNNER_NAME: this job compiles uncached"
          exit 0
        fi
        unexpected="$(env | sed -n 's/^\(CCACHE_[A-Za-z_]*\)=.*/\1/p' | grep -v -x -E 'CCACHE_DIR|CCACHE_MAXSIZE' || true)"
        if [ -n "$unexpected" ]; then
          echo "CCACHE-REFUSED on $RUNNER_NAME: the runner's environment sets $(echo $unexpected); only CCACHE_DIR and CCACHE_MAXSIZE belong to the runner"
          exit 1
        fi
        dir="${CCACHE_DIR:-$HOME/.cache/rocketnet-ccache}"
        size="${CCACHE_MAXSIZE:-5G}"
        case "$(uname -s)" in
          Darwin) check='%compiler% -v' ;;
          *) check=content ;;
        esac
        mkdir -p "$dir"
        stats="$RUNNER_TEMP/ccache-stats.log"
        : > "$stats"
        {
          echo "CCACHE_DIR=$dir"
          echo "CCACHE_MAXSIZE=$size"
          echo "CCACHE_COMPILERCHECK=$check"
          echo "CCACHE_SLOPPINESS="
          echo "CCACHE_BASEDIR="
          echo "CCACHE_STATSLOG=$stats"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
        } >> "$GITHUB_ENV"
        echo "ccache $(ccache --version | head -1) at $dir, max $size, compiler check '$check'"
        CCACHE_DIR="$dir" CCACHE_MAXSIZE="$size" CCACHE_COMPILERCHECK="$check" CCACHE_SLOPPINESS= CCACHE_BASEDIR= \
          ccache --show-config | grep -E '\) (base_dir|cache_dir|compiler_check|direct_mode|hash_dir|max_size|run_second_cpp|sloppiness) ='
