# rocketnet CI: build the library and every tool the Makefile produces, then run the
# test suite, on ubuntu and macos — the two platforms the Makefile builds on.
#
# This is the family's standard shape (rocketnet's ci.yml is the sibling): make,
# then run bin/test directly. The Linux build links the XDP dataplane against
# libbpf/libxdp, so those dev packages are installed there; the XDP program
# itself (server_xdp) is embedded as a source tarball by the build and compiles
# on the target kernel, so compiling it needs a kernel with BTF and stays
# outside this workflow.
#
# The csharp-smoke job proves the C# binding on the same two platforms: the
# shared library target, the binding build, and the loopback smoke test with
# its negative controls.

name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:

      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake build-essential libbpf-dev libxdp-dev libcurl4-openssl-dev libsodium-dev xxd

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libsodium pkgconf || brew install libsodium pkg-config

      - name: Build
        run: make

      - name: Run tests
        run: ./bin/test

  # The C# binding smoke: build the shared library (the target the binding
  # loads at runtime), build the binding and its smoke test with the .NET 8
  # SDK (the binding's TFM floor), and run the smoke against the built
  # library. The smoke exits nonzero on any failure, which fails the job.

  csharp-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:

      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake build-essential libbpf-dev libxdp-dev libcurl4-openssl-dev libsodium-dev xxd

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libsodium pkgconf || brew install libsodium pkg-config

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the shared library
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target rocketnet_shared -j

      - name: Build the C# binding and smoke test
        run: dotnet build csharp/smoke -c Release

      - name: Run the smoke test
        run: ROCKETNET_LIBRARY_PATH=bin dotnet run --project csharp/smoke -c Release --no-build
