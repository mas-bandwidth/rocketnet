# rocketnet CI: THE PER-COMMIT GATE (#111).
#
# The split this file's existence rests on is DURATION-DEPENDENCE. Everything
# here gates and fits in minutes, including bounded TSAN. Duration-dependent
# discovery and multi-day acceptance belong to nightly-soak.yml and
# fuzz-nightly.yml, tracked in #124.
# The line is not "cheap here, expensive there": asan+ubsan is not cheap and
# it is here, because a sanitizer finding on THIS commit is what stops the
# defect from being merged. Anything that only finds what an hour finds is
# not a gate, it is a watch.
#
# AND THERE IS NOW A SECOND LINE, the law of 2026-09-13: the per-commit
# tier finishes in ONE TO TWO MINUTES. A leg that cannot is not argued down,
# it MOVES to a tier that does not run on every commit -- or it is split so
# that the work runs in parallel instead of in series. A gate nobody waits
# for is a gate nobody reads.
#
# What that law cost on 2026-09-13, named rather than assumed. THREE things
# left this file, and each went to a nightly tier UNCHANGED rather than
# shortened:
#
#   soak_sim (asan + ubsan + lsan, bounded)   297s, the biggest job here, to
#       nightly-soak.yml -- same job name, same seed, same iteration count.
#       At that point asan+ubsan over the whole suite and tsan over the
#       threaded transport both STAYED. What the estate learned the next
#       morning instead of on the commit is the STATEFUL simulator under the
#       sanitizers, and LSan.
#
#   windows-2025 / Debug                      136s, to nightly.yml, step for
#       step. Windows keeps its RELEASE row on every commit, because Release
#       is what ships and the optimizer is a different compiler. What waits
#       until morning is the second configuration -- the asserts Release
#       compiles out.
#
#   check_driver_extension.py, ON WINDOWS ONLY   42-48s on top of a 92s MSVC
#       floor, and the last thing holding this file above two minutes. It
#       builds an out-of-tree driver backend against the installed SDK: a
#       contract check on a fixed input, not a tripwire a commit is likely to
#       trip. THE SAME SCRIPT STILL GATES EVERY COMMIT ON LINUX AND MACOS,
#       where it costs 15s. What waits until morning is only "does the
#       out-of-tree backend still build under MSVC".
#
# A later exact receipt changed one of those facts: on 2026-10-26 the
# asan+ubsan functional suite was still inside its first full run after 164s.
# The per-commit sanitizer leg now runs exact reconnect-isolation,
# transport-ring-recovery and loopback-UDP cases, followed by the existing
# lifecycle, driver, sodium and XDP-negative controls. The exhaustive
# functional run moved without a weaker oracle to the existing
# nightly-leaks.yml job, which runs it daily at 06:20 UTC under the same
# asan+ubsan flags plus LSan. A red nightly has a commit range and the next
# morning's estate owner; it remains a required release gate, not an advisory
# replacement for the focused per-commit signal.
#
# Everything else that was over the line was SPLIT, not moved: tsan into two
# parallel legs, windows Release into (a), (b) and (c), every Linux and macOS row into
# four legs (2026-10-29), and the two platform selftests out of four duplicate matrix rows into
# one job per OS. Splitting costs runner-minutes and buys wall time; that is
# the trade the law asks for, and it takes nothing away from the gate.
#
# WHO READS THIS: the pull request. Every job below is a required-in-practice
# check on the PR that carries it, read by the human at the gate before merge
# -- which is why nothing here may be advisory. A job that cannot fail is not
# a gate, and a job whose failure nobody must answer for is decoration.
#
# The legs, and what each one exists to catch:
#
#   build-and-test          the suite on ubuntu and macos, in BOTH Debug and
#                           Release. Release-only bugs are real: the assert
#                           that fires in Debug is compiled out, and the
#                           optimizer is a different compiler. The ubuntu
#                           Release row runs as two parallel legs.
#   build-and-test-windows  nightly: the build and the unit suite under MSVC,
#                           Release, as three parallel legs. Per commit, happy
#                           path / windows runs the build, the unit suite and
#                           the happy path; Debug and functional are nightly.yml.
#   sanitizers              asan + ubsan over focused transport recovery,
#                           lifecycle, driver, sodium and XDP controls; the
#                           exhaustive functional suite is in nightly-leaks
#   fuzz-smoke              a bounded, deterministic replay of the committed
#                           regression corpus over the wire-facing parsers
#   big-endian              the whole suite COMPILED for s390x; RUN under
#                           qemu-user: the wire check, test_sodium and the
#                           88 byte cases (58 standard vectors, 30 XDP filter
#                           host cases; tools/bigendian/run_byte_cases.sh,
#                           counts held against docs/PLATFORMS.md). The full
#                           suite runs on s390x in nightly-bigendian-system
#   conformance             the standard in standard/ against the implementation
#   platform-selftests      soak_sim's instruments and the bench harnesses'
#                           abort paths, each against its own negative
#                           control -- once per OS, on the Release build,
#                           because neither is a build-type story
#   tsan                    the loopback soak and the lifecycle harness; the
#                           threaded transports run nightly (nightly.yml)
#   sodium-pinned           the system-sodium integration mode against a
#                           content-verified 1.0.20 reference
#
# The Linux build links the XDP dataplane against libbpf/libxdp, so those dev
# packages are installed there; the XDP program itself (server_xdp) is
# embedded as a source tarball by the build and compiles on the target kernel,
# so CI compiles the extracted archive unprivileged against its runner BTF.
# Attaching the program and exercising a real NIC stay outside this workflow.

name: CI

on:
  push:
    branches: [ main, sprint/rocketnet-proof ]
  pull_request:
  # Filtering push to main and sprint/rocketnet-proof means a feature branch no
  # longer runs the matrix twice -- once for the push, once for its PR.
  # sprint/rocketnet-proof is named by name, not by sprint/**: every worker
  # pushes a sprint/<card> branch, and a sprint/** filter would start this
  # matrix on every one of those pushes, dozens an hour, for work the pull
  # request filter already runs. sprint/rocketnet-proof is where v1.0 lands, by
  # direct land commits with no pull request to run them, so naming that branch
  # is what puts this gate on the landing. workflow_dispatch keeps a deliberate
  # way to run it on any other branch, which is the capability the filter would
  # otherwise silently remove.
  workflow_dispatch:
    inputs:
      full:
        description: "Run the nightly tier (every job and step) instead of the per-commit tier"
        type: boolean
        default: false
  # nightly-ci.yml calls this file with full: true each night. inputs.full is
  # the one switch between the tiers: unset on push and pull_request, so those
  # events run the per-commit tier.
  workflow_call:
    inputs:
      full:
        description: "Run the nightly tier (every job and step) instead of the per-commit tier"
        type: boolean
        default: false

# a superseded commit's run is not a gate on anything -- the gate is the head
# of the branch -- so it yields its runners to the run that replaced it
concurrency:
  # each main commit queues in its own group: pending runs on main are
  # replaced, not queued, so a burst of landings leaves every commit a verdict
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # main never cancels a run in progress: every merge gets a verdict.
  # Branches and PRs still cancel a superseded run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# TWO TIERS, ONE FILE (Glenn 2026-10-31: "Move everything that does not fit
# into 2 minute into nightly tests (no time limit)"). A per-commit run takes
# one minute ideally and two at most, wall clock from the push, queueing
# included. inputs.full selects the tier:
#
#   per-commit (push, pull_request, workflow_dispatch with full unset): the
#       jobs and steps below that fit. Every job carries
#       timeout-minutes: ${{ inputs.full && 7200 || 2 }}, so a per-commit job that
#       runs past two minutes fails; tools/check_ci_budget.py, run in the lint
#       job, refuses a per-commit job in any workflow without that bound.
#       The job count is sized to the pools that run it at once: the fleet's
#       macOS runners (self-hosted,macOS,ARM64,fleet), three Windows runners
#       (rocketnet-windows), and the shared Linux fleet (self-hosted,Linux,X64,fleet).
#   nightly (nightly-ci.yml, full: true, no time limit): every job and every
#       step in this file, the per-commit ones included. What runs only here:
#
#   macOS: Debug functional, checks and builds; Release unit, checks and
#       builds; happy path / macos; platform selftests / macos.
#       (Per commit: Debug unit, Release functional, which runs the
#       development functional suite, and Release functional_production.)
#   Linux: Debug checks and builds; Release functional's development suite
#       (Debug functional runs it per commit); Release builds' history budget
#       and no-XDP builds; platform selftests / linux.
#   Ubuntu 22.04 and 24.04: ubuntu 22.04 / Release and ubuntu 24.04 /
#       Release, the library and the unit suite built in a container of that
#       release (the fleet's runners are Ubuntu 26.04).
#   Windows: windows / Release legs (a), (b) and (c) whole (per commit,
#       happy path / windows builds the whole tree under MSVC and runs the
#       happy path, and windows / Release / unit runs the unit suite).
#   unit-case coverage (every registered unit case runs in some
#       configuration); the wide-channel unit cases (Linux Debug builds).
#   fuzz smoke NDEBUG, big endian s390x /
#       Release, pinned libsodium, backend example / go and csharp.
#   The instruction count gate's toolchain build: per commit the gate only
#       restores the pinned toolchain from the cache the nightly saves on
#       main, and fails naming the cold cache if it is missing.
#
# Nightly has no repository execution watchdog. GitHub imposes a five-day
# self-hosted job ceiling, represented by 7200 minutes below. The per-commit
# job bound remains two minutes; finite scenarios and hang oracles remain.
env:
  ROCKETNET_NIGHTLY_NO_TIMEOUT: ${{ inputs.full && '1' || '0' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:

  # EVERY ROW IS FOUR PARALLEL JOBS (2026-10-29). One job per row ran its
  # steps one after another though they share nothing: Linux Debug spent 141 s
  # over unit 30, ambient 26, functional 47, SDK consumers 17, contract 9,
  # family matrix 7 and memory plans 4 (main, run 40890503823). Glenn: "Move
  # anything that is not under 120s limit to nightly and/or release checks",
  # and serial only when it must be. Each row is now four jobs on four runners,
  # each building and then running one leg, each timed from its build:
  #
  #   unit        sodium, the unit suite (under strace on Linux), the purity
  #               and ambient config checks
  #   functional  the functional suites (auto ladder, portable pin, and the
  #               production library's on Release), the family matrix on
  #               macOS, the lifecycle binary
  #   transport_matrix  (Linux) the transport family matrix and its libxdp
  #               range check
  #   checks     the read-only gates and audits, the native transport
  #               contract, memory plans, the fuzz corpus replay on macOS
  #   builds      the extra builds and consumers: without XDP, without server
  #               libraries, the history budget, SDK install and relocation,
  #               the public header, C and C++ callers, the examples
  #
  # A step's condition names its leg (`matrix.leg == 'unit'`). A leg that
  # cannot fit the window moves to the nightly tier, not to a slower job.

  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }} / ${{ matrix.leg }}${{ matrix.shard && format(' ({0})', matrix.shard) || '' }}
    # Linux rows run on the fleet's organization runners (labels self-hosted,Linux,X64,fleet: Linux x64 gcc
    # hosts), provisioned by the fleet's provisioning repository (group_vars ci_apt_packages), which is why the
    # self-hosted apt step is skipped. macOS rows run on the fleet's macOS arm64 runners (labels
    # self-hosted,macOS,ARM64,fleet). matrix.os is the display name the check names carry (linux, macos);
    # runner is the label set runs-on uses.
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: ${{ inputs.full && 7200 || 2 }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos]
        build_type: [Debug, Release]
        leg: [unit, functional, checks, builds]
        # The per-commit tier runs eleven of the twenty rows: eight Linux rows
        # (the Release unit leg is two shard rows below, the second carrying
        # the builds leg's steps; the two transport_matrix rows are include
        # rows below) and three macOS rows (macOS Release
        # functional_production is the include row below). The nightly tier
        # runs all. Both tiers exclude the plain Linux Release unit row: its
        # two shard rows replace it.
        exclude: ${{ fromJSON(inputs.full && '[{"os":"linux","build_type":"Release","leg":"unit"}]' || '[{"os":"linux","build_type":"Release","leg":"unit"},{"os":"linux","build_type":"Debug","leg":"checks"},{"os":"linux","build_type":"Debug","leg":"builds"},{"os":"linux","build_type":"Release","leg":"builds"},{"os":"macos","build_type":"Debug","leg":"functional"},{"os":"macos","build_type":"Debug","leg":"checks"},{"os":"macos","build_type":"Debug","leg":"builds"},{"os":"macos","build_type":"Release","leg":"unit"},{"os":"macos","build_type":"Release","leg":"checks"},{"os":"macos","build_type":"Release","leg":"builds"}]') }}
        # dev: the ROCKETNET_DEV setting. Debug rows build the default
        # development library (ON); Release rows build the production library
        # (OFF), so every OS runs the suite both ways and the production
        # boundary checks read a production library. runner is the label set
        # runs-on uses. Every Linux fleet runner carries the VM tier the xdp
        # matrix cell needs (docs/TESTING.md, "The VM tier"), so the
        # functional rows select the fleet like every other row.
        include:
          - { build_type: Debug, dev: 'ON' }
          - { build_type: Release, dev: 'OFF' }
          - { os: linux, runner: '["self-hosted","Linux","X64","fleet"]' }
          # The Linux Release unit leg runs in two shards (test --shard i/2,
          # tests/suite_runner.h), as the Windows and ASan unit jobs do: one
          # row with the build, the sodium, purity and environment checks and
          # 118 s on a loaded fleet runner (PR run 43205065538). Shard 0/2
          # keeps the sodium, purity and environment checks and proves the
          # shards partition the suite; per commit shard 1/2 also runs the
          # builds leg's steps over the same production build (one Release
          # build and one runner instead of two, on a fleet where runners,
          # not cores, are what a per-commit run waits for). The nightly tier
          # runs the builds row on its own. A row added by include gets no
          # field from the include rows above, so each gives every field.
          - { os: linux, build_type: Release, leg: unit, shard: 0/2, dev: 'OFF', runner: '["self-hosted","Linux","X64","fleet"]' }
          - { os: linux, build_type: Release, leg: unit, shard: 1/2, with_builds: true, dev: 'OFF', runner: '["self-hosted","Linux","X64","fleet"]' }
          - { os: macos, runner: '["self-hosted","macOS","ARM64","fleet"]' }
          # The macOS Release functional row ran both suites in one job, 1m30
          # to 1m50 against the two-minute bound. The production library's
          # suite (functional_production) runs in this row of its own, on its
          # own runner; the functional row keeps the development suite. A leg
          # value outside the matrix adds a combination, and every field is
          # given here so it does not depend on the include rows above.
          - { os: macos, build_type: Release, leg: functional_production, dev: 'OFF', runner: '["self-hosted","macOS","ARM64","fleet"]' }
          # The Linux transport family matrix runs in a row of its own beside
          # each Linux functional row: its xdp cell's eleven cases in a guest
          # took 43 to 46 s (twelve, with the gateway change case, 62 s on a
          # loaded vision), which with the functional suite took Linux Debug
          # functional to the two-minute bound. The macOS matrix stays in its
          # functional row (about a second).
          - { os: linux, build_type: Debug, leg: transport_matrix, dev: 'ON', runner: '["self-hosted","Linux","X64","fleet"]' }
          - { os: linux, build_type: Release, leg: transport_matrix, dev: 'OFF', runner: '["self-hosted","Linux","X64","fleet"]' }
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/ccache

      # One SDK source list for the library and every vendoring application;
      # first, so a later red step cannot skip it.
      - name: Every SDK source is in cmake/RocketnetSources.cmake
        if: matrix.leg == 'checks'
        run: python3 tools/check_sdk_sources.py

      - name: Check header guards across all tracked headers
        if: matrix.leg == 'checks'
        run: python3 tools/check_header_guards.py

      - name: Every DST check is reached by the DST run
        if: matrix.leg == 'checks'
        run: |
          python3 tools/check_dst_checks_wired.py --self-test
          python3 tools/check_dst_checks_wired.py

      - name: Check the fleet's build dependencies are present
        run: |
          set -euo pipefail
          missing=0
          if [ "$RUNNER_OS" = "macOS" ]; then
            # darwin has no libbpf, libxdp or liburing; libsodium is the independent parity reference check_sodium.py loads
            for tool in cmake clang c++ xxd python3; do
              if ! command -v "$tool" >/dev/null 2>&1; then
                echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
                missing=1
              fi
            done
            if ! python3 -c "import ctypes.util, sys; sys.exit(0 if ctypes.util.find_library('sodium') else 1)"; then
              echo "TOOL-MISSING libsodium (any) (ctypes.util.find_library failed) on $RUNNER_NAME"
              missing=1
            fi
            exit "$missing"
          fi
          for tool in cmake gcc g++ clang xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      # System sodium is installed only as an independent parity reference;
      # the production targets compile the committed, namespaced vendor.
      # The Makefile IS the Release build -- it configures CMAKE_BUILD_TYPE=Release
      # and nothing else -- and it is the front door BUILDING.md sends a new
      # consumer through, so the Release rows go through it rather than around
      # it. A front door nothing opens rots. Debug has no Makefile spelling, so
      # those rows configure directly.

      - name: Build (Release, through the Makefile)
        timeout-minutes: 6
        if: matrix.build_type == 'Release'
        run: make ROCKETNET_DEV=${{ matrix.dev }}

      - name: Build (Debug)
        timeout-minutes: 4
        if: matrix.build_type == 'Debug'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DROCKETNET_DEV=${{ matrix.dev }}
          cmake --build build --parallel 8

      # The XDP packet blaster's manifest and oracle rules
      # (tools/test_xdp_packet_blaster.py over tools/xdp_packet_blaster_cases.json,
      # the blaster run --dry-run): no socket, root or clock, under a second.
      # The CMake target existed and nothing built it (VERIFY-3 A-10).
      - name: XDP packet blaster contract test
        if: runner.os == 'Linux' && matrix.build_type == 'Debug' && matrix.leg == 'unit'
        run: cmake --build build --target test_xdp_packet_blaster

      # bin/test_wide compiles the SDK again with ROCKETNET_MAX_CHANNELS=512 for
      # the cases that need a channel index of 256 or more (CMakeLists.txt).
      - name: Build the wide-channel unit suite
        timeout-minutes: 1
        if: runner.os == 'Linux' && matrix.build_type == 'Debug' && matrix.leg == 'builds'
        run: cmake --build build --target test_wide --parallel 8

      # Each job's window is everything after its build, one leg of the row
      # (Glenn 2026-10-29: "Move anything that is not under 120s limit to
      # nightly and/or release checks"; the legs run in parallel).
      - name: Start the job's timing (everything after the build)
        run: &start_unit_functional_timing |
          set -euo pipefail
          timing_receipt="$RUNNER_TEMP/rocketnet-unit-functional.start"
          rm -f "$timing_receipt"
          timing_python=python3
          command -v "$timing_python" >/dev/null 2>&1 || timing_python=python
          timing_start_ns=$($timing_python -c 'import time; print(time.clock_gettime_ns(time.CLOCK_MONOTONIC) if hasattr(time, "CLOCK_MONOTONIC") else time.monotonic_ns())')
          if [[ ! "$timing_start_ns" =~ ^[0-9]+$ ]]; then
            echo "CI_UNIT_FUNCTIONAL_TIMING=FAIL reason=invalid_start"
            exit 1
          fi
          printf '%s %s %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$timing_start_ns" > "$timing_receipt"

      - name: Check the floating-point floor on every compiler invocation
        if: matrix.leg == 'checks' && ( runner.os == 'Linux' )
        run: |
          bash tools/check_fp_contract.sh --self-test
          bash tools/check_fp_contract.sh
          cmake -DROCKETNET_OSS_FUZZ_BUILD_SCRIPT=tests/oss-fuzz/build.sh -P tools/check_oss_fuzz_fp_contract.cmake

      # clang-cl takes its own floor (/fp:precise and -Xclang -ffp-contract=off),
      # and the Windows rows that build with clang-cl are nightly. This
      # configures the tree for x64 Windows with the runner's clang under the
      # clang-cl name (the driver picks its mode from that name), so
      # rocketnet_check_fp_floor holds every target to the clang-cl floor on
      # each push. Configure only: nothing is compiled or linked.
      - name: Check the clang-cl floating-point floor (cross configure)
        if: matrix.leg == 'checks' && ( runner.os == 'Linux' )
        run: |
          set -euo pipefail
          if ! clang="$(command -v clang)"; then
            echo "TOOL-MISSING clang (any) (PATH) on $RUNNER_NAME"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/clang-cl-floor/bin"
          ln -sf "$clang" "$RUNNER_TEMP/clang-cl-floor/bin/clang-cl"
          cmake -S . -B "$RUNNER_TEMP/clang-cl-floor/build" \
            -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=AMD64 \
            "-DCMAKE_C_COMPILER=$RUNNER_TEMP/clang-cl-floor/bin/clang-cl" \
            "-DCMAKE_CXX_COMPILER=$RUNNER_TEMP/clang-cl-floor/bin/clang-cl" \
            -DCMAKE_C_COMPILER_TARGET=x86_64-pc-windows-msvc \
            -DCMAKE_CXX_COMPILER_TARGET=x86_64-pc-windows-msvc \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            | tee "$RUNNER_TEMP/clang-cl-floor/configure.log"
          grep -q 'Floating-point floor (clang-cl)' "$RUNNER_TEMP/clang-cl-floor/configure.log"

      # tools/check_no_thread_local.py exits 1 when a production build
      # (ROCKETNET_DEV=0) of sdk/ defines or touches thread-local storage. On
      # macOS a thread's first touch of any thread-local makes dyld allocate
      # the image's whole thread-local block, so one thread-local costs every
      # network thread an allocation. The source check reads every platform's
      # half, Windows included, through its preprocessor conditionals; the
      # production rows also run the compiler's own ROCKETNET_DEV=0
      # preprocessing of every sdk unit and read the built libraries'
      # sections and symbols. --self-test holds the red and green controls.
      - name: Check no thread-local storage in a production build
        if: matrix.leg == 'checks'
        # The four reads share nothing and run at once (tools/run_parallel.py):
        # the step takes its slowest, the preprocessing, not their sum.
        run: |
          set -euo pipefail
          commands=('python3 tools/check_no_thread_local.py --self-test' 'python3 tools/check_no_thread_local.py')
          if [ "${{ matrix.dev }}" = "OFF" ]; then
            libraries=(build/librocketnet.a)
            for shared in bin/librocketnet.so bin/librocketnet.dylib; do
              if [ -f "$shared" ]; then libraries+=("$shared"); fi
            done
            commands+=('python3 tools/check_no_thread_local.py --preprocess build/compile_commands.json')
            commands+=("python3 tools/check_no_thread_local.py --objects ${libraries[*]}")
          fi
          python3 tools/run_parallel.py "${commands[@]}"

      # Driver selection is runtime now (#106), so one build serves the whole
      # matrix. ./bin/test is the unit suite: no socket, no real driver, the
      # state machines and the in-memory simulator, parallel, bounded per commit. ./bin/functional is the driver matrix. On this unprivileged
      # runner the linux functional leg is the FALL made real -- xdp refused
      # for missing privilege, gso granted -- so the functional suite runs
      # over the gso driver here (and over the darwin msgx pump on macOS);
      # the pin tests (test_*_transport_server_io_pin) go red if a rung stops
      # granting, so a silent fall cannot hollow this leg out. The second
      # functional run pins the portable floor by env.

      # The sodium, purity and environment checks below run once per unit
      # leg: on the Linux Release leg, in shard 0/2 only.
      - name: Sodium known answers
        if: matrix.leg == 'unit' && matrix.shard != '1/2'
        run: ./bin/test_sodium

      # The committed sodium pair from its SHA-256 pinned inputs, byte for
      # byte, on the Linux and macOS Release unit legs; the
      # Windows (b) leg runs the same step (sodium/README.md, "Reproducing
      # the vendored inputs").
      - name: Reproduce the committed sodium pair
        if: matrix.build_type == 'Release' && matrix.leg == 'unit' && matrix.shard != '1/2'
        run: python3 tools/generate_sodium.py --inputs build/vendor-inputs --fetch --check

      - name: Sodium parity against the independent system library
        if: matrix.build_type == 'Release' && matrix.leg == 'unit' && matrix.shard != '1/2'
        run: |
          cmake --build build --target rocketnet_sodium_oracle --parallel 8
          python3 tools/check_sodium.py bin/librocketnet_sodium_oracle.${{ runner.os == 'macOS' && 'dylib' || 'so' }}

      - name: Replay the fuzz corpora without libFuzzer
        if: matrix.leg == 'checks' && ( runner.os == 'macOS' )
        run: |
          # the sixteen harnesses build in one parallel build and replay at once;
          # each replay's exit status is checked
          harnesses="rocketnet_fuzz rocketnet_fuzz_message rocketnet_fuzz_connect_token rocketnet_fuzz_receive_structured rocketnet_fuzz_token_private rocketnet_fuzz_round_trip rocketnet_fuzz_config rocketnet_fuzz_server_transport rocketnet_fuzz_client_transport rocketnet_fuzz_session rocketnet_fuzz_session_raw rocketnet_fuzz_xdp_frame rocketnet_fuzz_uring_recvmsg rocketnet_fuzz_gateway_netlink rocketnet_fuzz_endpoint rocketnet_fuzz_xdp_filter"
          targets=""
          for harness in $harnesses; do targets="$targets fuzz_replay_$harness"; done
          cmake --build build --target $targets --parallel 8
          pids=""
          for harness in $harnesses; do
            corpus="tests/fuzz/corpus${harness#rocketnet_fuzz}"
            "./bin/fuzz_replay_$harness" "$corpus"/* > "fuzz-replay-$harness.log" 2>&1 &
            pids="$pids $!:$harness"
          done
          failed=0
          for entry in $pids; do
            if ! wait "${entry%%:*}"; then echo "fuzz replay failed: ${entry#*:}"; cat "fuzz-replay-${entry#*:}.log"; failed=1; fi
          done
          exit $failed

      # Every seed generator runs through its replay driver, which ignores
      # LLVMFuzzerInitialize's return value as libFuzzer does: each must exit
      # 0 (every seed reaches its type or oracle). The two generators that
      # can withhold a seed must then exit 1 and print INCOMPLETE, so a
      # generator that only returned its failure would be seen to go on.
      # An empty input file stands in for a corpus, so a generator that does
      # not exit replays it and exits 0, which this step refuses. seed_harnesses
      # is every TARGETS harness whose source has a seed generator (it reads
      # ROCKETNET_FUZZ_SEED_DIR); tools/docs/check_fuzz_harnesses.py holds it
      # to exactly that set.
      - name: Run the fuzz seed generators
        if: matrix.leg == 'checks' && ( runner.os == 'macOS' )
        run: |
          seed_harnesses="rocketnet_fuzz rocketnet_fuzz_message rocketnet_fuzz_connect_token rocketnet_fuzz_receive_structured rocketnet_fuzz_token_private rocketnet_fuzz_round_trip rocketnet_fuzz_config rocketnet_fuzz_server_transport rocketnet_fuzz_client_transport rocketnet_fuzz_session rocketnet_fuzz_xdp_frame rocketnet_fuzz_uring_recvmsg rocketnet_fuzz_gateway_netlink rocketnet_fuzz_endpoint rocketnet_fuzz_xdp_filter"
          empty="$RUNNER_TEMP/fuzz-empty-input"
          : > "$empty"
          failed=0
          for harness in $seed_harnesses; do
            out="$RUNNER_TEMP/fuzz-seeds-$harness"
            rm -rf "$out" && mkdir -p "$out"
            if ROCKETNET_FUZZ_SEED_DIR="$out" ROCKETNET_FUZZ_SEED_FROM=tests/fuzz/corpus "./bin/fuzz_replay_$harness" "$empty" > "fuzz-seeds-$harness.log" 2>&1; then
              if [ -z "$(ls -A "$out")" ]; then echo "seed generator wrote nothing: $harness"; failed=1; fi
            else
              echo "seed generator failed: $harness"; cat "fuzz-seeds-$harness.log"; failed=1
            fi
          done
          for entry in rocketnet_fuzz_connect_token:seed_type_client_expired rocketnet_fuzz_receive_structured:seed_type_server_payload; do
            harness="${entry%%:*}"
            out="$RUNNER_TEMP/fuzz-seeds-withheld-$harness"
            rm -rf "$out" && mkdir -p "$out"
            status=0
            ROCKETNET_FUZZ_SEED_DIR="$out" ROCKETNET_FUZZ_WITHHOLD="${entry#*:}" "./bin/fuzz_replay_$harness" "$empty" > "fuzz-withheld-$harness.log" 2>&1 || status=$?
            if [ "$status" -ne 1 ] || ! grep -q INCOMPLETE "fuzz-withheld-$harness.log"; then
              echo "seed generator with ${entry#*:} withheld exited $status, not 1 with INCOMPLETE: $harness"; cat "fuzz-withheld-$harness.log"; failed=1
            fi
          done
          exit $failed

      # The cases this configuration runs, for the unit-case-coverage job
      # (tools/check_unit_case_coverage.py): every registered case must run in
      # at least one CI configuration. Nightly tier only, where every
      # configuration runs. `--list` names what a run in the same environment
      # starts (suite_list_cases), so the list and the run below both take
      # ROCKETNET_TEST_NIGHTLY from the tier: the nightly tier's unit cases
      # (the 1000-client per-client isolation case) run here, Debug included.
      - name: Save the registered unit cases
        if: inputs.full && matrix.leg == 'unit' && matrix.shard != '1/2'
        env:
          ROCKETNET_TEST_NIGHTLY: ${{ inputs.full && '1' || '0' }}
        run: mkdir -p unit-cases && ./bin/test --list > "unit-cases/${{ runner.os }}-${{ matrix.build_type }}.txt"

      - name: Upload the registered unit cases
        if: inputs.full && matrix.leg == 'unit' && matrix.shard != '1/2'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: unit-cases-${{ runner.os }}-${{ matrix.build_type }}
          path: unit-cases/
          if-no-files-found: error

      # On Linux the strace run below is this run: one suite run, not two.
      - name: Run unit tests (RSS telemetry, deterministic verdict)
        if: runner.os != 'Linux' && matrix.leg == 'unit'
        env:
          ROCKETNET_TEST_NIGHTLY: ${{ inputs.full && '1' || '0' }}
        run: ./bin/test

      # The unit suite opens no socket: ./bin/test runs under strace and the
      # check fails, naming the first opener, on any socket() call
      # (tools/check_unit_no_sockets.sh). The suite's output and verdict print
      # as in the plain run.
      - name: The shards partition the unit suite
        if: matrix.leg == 'unit' && matrix.shard == '0/2'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_test_shards.py --self-test
          python3 tools/check_test_shards.py ./bin/test 2

      # On the Linux Release leg each shard row runs its shard of the suite.
      - name: Run unit tests under strace (RSS telemetry, deterministic verdict, opens no socket)
        if: runner.os == 'Linux' && matrix.leg == 'unit'
        env:
          ROCKETNET_TEST_NIGHTLY: ${{ inputs.full && '1' || '0' }}
        run: |
          bash tools/test_check_unit_no_sockets.sh
          bash tools/check_unit_no_sockets.sh ./bin/test ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}

      # The unit suite reads no real time, sleep, thread, timed wait or
      # resolver: the check fails, naming file and line, on any such call in
      # the unit sources, the tests/*.h helpers they include and the sdk DEV
      # fixtures they call (tools/check_unit_purity.py); its self-test plants
      # each in a fixture tree.
      - name: Unit suite uses no real time, sleep, thread or resolver
        if: matrix.leg == 'unit' && matrix.shard != '1/2'
        run: |
          python3 tools/check_unit_purity.py --self-test
          python3 tools/check_unit_purity.py .

      - name: Ambient config isolation and passing output
        if: matrix.leg == 'unit' && matrix.shard != '1/2'
        run: python3 tools/check_test_environment.py ./bin/test ${{ matrix.dev == 'OFF' && '--production' || '' }}

      # The io_uring cases need RLIMIT_MEMLOCK for every runner of this user
      # on the host at once: the check prints the limit, the per-server need
      # on this kernel and PASS or FAIL before the suite runs
      # (tools/check_memlock.sh, docs/LINUX.md section 8).
      - name: Locked-memory limit covers the io_uring cases
        if: runner.os == 'Linux' && (matrix.leg == 'functional' || matrix.leg == 'transport_matrix')
        run: bash tools/check_memlock.sh

      # This run includes test_unit_case_memory, the row that enforces the unit
      # cases' measured RSS against their existing registry and fallback bound.
      # Every whole-suite run goes through tools/run_functional.sh <variant>:
      # its SKIPPED lines must be exactly the rows tests/functional/
      # expected_skips.txt lists for the leg (<os>-<variant>), each with a
      # reason, so a row that stops running here (io_uring, a documented host
      # requirement on Linux, docs/LINUX.md, among them) fails, naming it.
      # Per commit the Linux Release row runs functional_production only; the
      # development suite runs per commit on the Linux Debug row and on the
      # macOS Release row (the one macOS functional row per commit).
      - name: Run functional suite (auto ladder — the fall, on Linux; RSS enforced)
        if: matrix.leg == 'functional' && (inputs.full || matrix.build_type == 'Debug' || runner.os == 'macOS')
        # Nightly (full) Linux Debug only: scale 2, as nightly.yml scales its
        # TSan leg. test_loopback_transport_live_message_matrix's window takes
        # 27 s on a quiet host and 37-84 s on a 16-core fleet host at load
        # 70-139, and passed 120 s on the nightly hosts at load 140-198
        # (2026-11-11, cut while still sending, receipt loss 0). Per commit
        # the value is empty, which is scale 1 (tests/time_scale.h).
        env:
          ROCKETNET_TEST_CASE_TIME_SCALE: ${{ inputs.full && runner.os == 'Linux' && matrix.build_type == 'Debug' && '2' || '' }}
        run: |
          set -euo pipefail
          bash tools/run_functional.sh dev --log functional-auto.log ./bin/functional

      # The pinned pass per commit proves the pin is honoured; the whole
      # suite under the portable pin runs in the nightly tier (nightly.yml),
      # which every case too slow for this budget joins (Glenn 2026-10-29).
      - name: Run functional suite (portable rung pinned by env)
        if: matrix.leg == 'functional'
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: ./bin/functional --run test_transport_env_pin_is_honoured

      # functional_production links the production (ROCKETNET_DEV=OFF)
      # library, so it exists only on the Release rows; it runs the same
      # auto ladder and the same pinned-portable pass as the DEV suite. On
      # macOS it is the functional_production row's, beside the functional row.
      - name: Run functional_production suite (auto ladder, production library)
        if: matrix.build_type == 'Release' && ((matrix.leg == 'functional' && runner.os != 'macOS') || matrix.leg == 'functional_production')
        run: |
          set -euo pipefail
          bash tools/run_functional.sh prod --log functional-production-auto.log ./bin/functional_production

      - name: Run functional_production suite (portable rung pinned by env)
        if: matrix.build_type == 'Release' && ((matrix.leg == 'functional' && runner.os != 'macOS') || matrix.leg == 'functional_production')
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: ./bin/functional_production --run test_transport_env_pin_is_honoured

      # The production library's public client and server through create,
      # start, connect, update, disconnect and destroy over real sockets
      # (docs/BUILD-REFERENCE.md lists it as a production gate); built on
      # ROCKETNET_DEV=OFF only, under a second here.
      - name: "Functional: production client lifecycle"
        if: matrix.build_type == 'Release' && ((matrix.leg == 'functional' && runner.os != 'macOS') || matrix.leg == 'functional_production')
        run: ./bin/test_production_client_lifecycle

      # tests/functional/platform_primitives.cpp built standalone: the real
      # environment readers, the production library's status, simulator and
      # filter environment refusals (DEV=OFF), localhost lookup (DEV=ON), the
      # platform thread and its priority, the wake/wait pair. Nothing else
      # runs these checks. Both DEV settings run it: Debug rows build ON,
      # Release rows OFF, and the line it prints must name the DEV setting
      # this row built.
      - name: "Functional: platform primitives (standalone, both DEV settings)"
        if: matrix.leg == 'functional'
        shell: bash
        run: |
          set -euo pipefail
          ./bin/test_platform_primitives | tee platform-primitives.log
          want=0
          if [ "${{ matrix.dev }}" = ON ]; then want=1; fi
          if ! grep -q "^platform primitives OK: DEV=$want," platform-primitives.log; then
            echo "test_platform_primitives did not report DEV=$want (this row builds ROCKETNET_DEV=${{ matrix.dev }})"
            exit 1
          fi

      # The load harness's resource census (tests/load/load_census.h) is the
      # oracle behind load's and load_split's resource_baseline verdict; its
      # self-test plants a file left open, a reused descriptor number, the
      # random device and a thread left running.
      - name: "Functional: load harness census self-test"
        if: matrix.leg == 'functional'
        shell: bash
        run: |
          set -euo pipefail
          ./bin/test_load_census | tee load-census.log
          grep -qx 'test_load_census' load-census.log

      # THE TRANSPORT FAMILY MATRIX: every transport this OS builds, pinned by
      # env, on IPv4, on IPv6 and with an IPv4 client of an IPv6 wildcard
      # server, so a family regression on any one transport fails here.
      # test_transport_env_pin_is_honoured runs under the same pin and proves the
      # pinned transport is the one granted. tools/check_transport_matrix.py
      # refuses a driver row in sdk/rocketnet_drivers.inc with no cell on an
      # OS it builds for. A cell line is: server transport, client
      # transport, then case=card for each case expected to fail until that
      # card lands: the case fails, or prints a skip naming that card. An
      # expected failure that passes fails the step, so the mark is removed
      # as the card lands; any other skip fails. No cell holds a mark: the
      # in-memory loopback serves dual stack like the socket transports. The xdp
      # cell needs root, a namespace and a veth pair, so it runs every
      # rocketnet_test_xdp_veth_runs_here case (xdp_cases; the xdp server, the portable
      # client) as root inside a virtme-ng guest on the runner's own kernel,
      # never on the host; a case missing from xdp_cases, or one that skips,
      # fails the step; a runner with no VM tier fails the cell with one
      # VM-TIER-MISSING line naming what the host lacks (scripts/vm-tier-missing).
      # A client of auto sets no client pin, so that cell runs the client's
      # automatic order on the wire (gso on Linux, msgx on macOS, iocp on
      # Windows; TRANSPORTS.md "Client transports"). On Linux the matrix is
      # the transport_matrix row's, beside the functional row; on macOS it
      # runs in the functional row.
      - name: Transport family matrix (every transport on IPv4, IPv6 and dual stack)
        if: (matrix.leg == 'functional' && runner.os != 'Linux') || matrix.leg == 'transport_matrix'
        env:
          XDP_DEV: ${{ matrix.dev }}
          TRANSPORT_MATRIX_LINUX: |
            portable portable
            portable auto
            gso portable
            gso gso
            portable gso
            io_uring portable
            loopback loopback
            xdp portable
          TRANSPORT_MATRIX_MACOS: |
            portable portable
            portable auto
            portable msgx
            msgx portable
            msgx msgx
            loopback loopback
        run: |
          set +e -uo pipefail
          case "$RUNNER_OS" in
            Linux)   matrix=$TRANSPORT_MATRIX_LINUX;   functional=./bin/functional; functional_production=./bin/functional_production ;;
            macOS)   matrix=$TRANSPORT_MATRIX_MACOS;   functional=./bin/functional ;;
            Windows) matrix=$TRANSPORT_MATRIX_WINDOWS; functional=./bin/Release/functional.exe ;;
            *) echo "TRANSPORT-MATRIX no matrix for $RUNNER_OS"; exit 1 ;;
          esac
          socket_cases="test_loopback_transport_udp test_loopback_transport_ipv6 test_transport_dual_stack_ipv4_client test_transport_env_pin_is_honoured"
          xdp_cases="test_xdp_transport_max_size_both_ways_ipv4 test_xdp_transport_max_size_both_ways_ipv6 test_xdp_transport_keep_alive_before_first_payloads_ipv4 test_xdp_transport_keep_alive_before_first_payloads_ipv6 test_xdp_transport_gateway_change_while_serving test_xdp_transport_over_mtu_frame_refused_ipv4 test_xdp_transport_serves_both_families test_posix_hard_killed_client_xdp_ipv4_client_portable test_posix_hard_killed_client_xdp_ipv6_client_portable test_posix_send_to_closed_port_xdp_ipv4_client_portable test_posix_send_to_closed_port_xdp_ipv6_client_portable test_posix_client_server_gone_xdp_ipv4_client_portable test_posix_client_server_gone_xdp_ipv6_client_portable test_session_reconnect_isolation_xdp"
          # the other root-only xdp cases, in the same guest: the lifecycle
          # cells that fit the per-commit budget (about 2 s together, the
          # three 1000-cycle cells below take about 57 s and run nightly),
          # and the receive-weather pair, registered in development builds
          # only
          xdp_root_cases="test_xdp_transport_posix_init_term_1000 test_xdp_transport_posix_client_create_destroy_1000 test_xdp_transport_posix_connect_disconnect_1000"
          if [ "${XDP_DEV:-OFF}" = ON ]; then
            xdp_root_cases="$xdp_root_cases test_xdp_transport_linux_receive_weather_ipv4 test_xdp_transport_linux_receive_weather_ipv6"
          fi
          if [ "${ROCKETNET_NIGHTLY_NO_TIMEOUT:-0}" = 1 ]; then
            xdp_root_cases="$xdp_root_cases test_xdp_transport_posix_server_create_destroy_1000 test_xdp_transport_posix_server_restart_same_port_100 test_xdp_transport_posix_destroy_under_traffic_100"
          fi
          xdp_cases_run="$xdp_cases $xdp_root_cases"
          # The Release row builds the production library (ROCKETNET_DEV=OFF):
          # its own suite, functional_production, runs the xdp rows it
          # registers in the same guests (prod:<case>), so the library users
          # link is the one tested under root on a veth pair (inside the guest
          # the production suite leaves its XDP commit barrier down,
          # tests/functional/rocketnet_functional_tests.cpp). xdp_dev_only
          # names the rows only the development suite registers (the posix
          # client-fault cases: functional_production answers "unknown functional
          # test"); a row production stops registering fails by name (exit 2).
          xdp_dev_only="test_posix_hard_killed_client_xdp_ipv4_client_portable test_posix_hard_killed_client_xdp_ipv6_client_portable test_posix_send_to_closed_port_xdp_ipv4_client_portable test_posix_send_to_closed_port_xdp_ipv6_client_portable test_posix_client_server_gone_xdp_ipv4_client_portable test_posix_client_server_gone_xdp_ipv6_client_portable"
          if [ "${XDP_DEV:-OFF}" = OFF ]; then
            for case in $xdp_cases $xdp_root_cases; do
              case " $xdp_dev_only " in *" $case "*) ;; *) xdp_cases_run="$xdp_cases_run prod:$case" ;; esac
            done
          fi
          # every rocketnet_test_xdp_veth_runs_here row must be named in xdp_cases
          if [ -f scripts/transport-cells-repeat ]; then
            scripts/transport-cells-repeat --list --os linux > /dev/null || exit 1
          fi
          cell_cases() { if [ "$1" = xdp ]; then echo "$xdp_cases_run"; else echo "$socket_cases"; fi; }
          uring_offered=0
          if [ "$RUNNER_OS" = Linux ] && [ "$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo 0)" = 0 ]; then uring_offered=1; fi
          mkdir -p build
          logs=$(mktemp -d "$PWD/build/transport-matrix.XXXXXX")
          # each cell runs its cases in series; the cells run in parallel
          while read -r server client expected; do
            [ -n "$server" ] || continue
            if [ "$server" = io_uring ] && [ "$uring_offered" = 0 ]; then
              # an explicit skip with its reason, never a dropped cell
              for case in $socket_cases; do
                echo "this kernel disables io_uring" > "$logs/$server.$client.$case.log"
                echo skipped > "$logs/$server.$client.$case.rc"
              done
              continue
            fi
            if [ "$server" = xdp ]; then
              (
                # root, a namespace and a veth pair inside a guest of the
                # runner's own kernel; the host is never touched
                vm_kernel="$HOME/vm-kernels/vmlinuz-$(uname -r)"
                vm_missing=$(scripts/vm-tier-missing)
                if [ -n "$vm_missing" ]; then
                  for case in $xdp_cases_run; do
                    echo "VM-TIER-MISSING on $RUNNER_NAME: $vm_missing" > "$logs/$server.$client.$case.log"
                    echo 1 > "$logs/$server.$client.$case.rc"
                  done
                  exit 0
                fi
                vm_timeout=(timeout 120)
                nightly_no_timeout=0
                if [ "${ROCKETNET_NIGHTLY_NO_TIMEOUT:-0}" = 1 ]; then
                  vm_timeout=()
                  nightly_no_timeout=1
                fi
                # the cases run in series inside a guest; xdp_guests guests, each
                # its own VM with its own namespace and veth pair, run at once,
                # case n in guest n % xdp_guests (in series one guest took
                # about 60 s, most of the step)
                xdp_guests=3
                for guest in $(seq 0 $((xdp_guests - 1))); do
                  guest_cases=""
                  n=0
                  for case in $xdp_cases_run; do
                    if [ $((n % xdp_guests)) = "$guest" ]; then guest_cases="$guest_cases $case"; fi
                    n=$((n + 1))
                  done
                  # the guest's commands go in a script file, never on vng's
                  # command line: vng carries its guest command on the guest
                  # kernel's command line, which x86 cuts at 2048 bytes (the
                  # nightly repeat's one guest of 13 cases from a 77-byte
                  # runner path never booted). The script's first act writes
                  # its started marker; scripts/vm-boot-guard refuses a
                  # command line over 1900 bytes by name, and kills and boots
                  # again a guest with no marker after the boot deadline,
                  # which the nightly opt-in does not lift: it bounds the
                  # boot, never the cases
                  marker="$logs/$server.$client.vm$guest.started"
                  script="$logs/$server.$client.vm$guest.sh"
                  {
                    printf ': > %q\n' "$marker"
                    printf 'for case in %s; do\n' "$guest_cases"
                    printf '  suite=%q; name=$case\n' "$functional"
                    printf '  case "$name" in prod:*) suite=%q; name=${name#prod:} ;; esac\n' "$functional_production"
                    printf '  sudo env ROCKETNET_NIGHTLY_NO_TIMEOUT=%s "$suite" --run "$name" > %q.$case.log 2>&1\n' "$nightly_no_timeout" "$logs/$server.$client"
                    printf '  echo $? > %q.$case.rc\n' "$logs/$server.$client"
                    printf 'done\n'
                  } > "$script"
                  scripts/vm-boot-guard --marker "$marker" -- \
                  ${vm_timeout[@]+"${vm_timeout[@]}"} vng --run "$vm_kernel" --memory 1536M --cpus 2 --append "irqaffinity=0 isolcpus=1 nohz_full=1" --rwdir "$PWD" -- \
                    sh "${script#"$PWD"/}" \
                    > "$logs/$server.$client.vm$guest.log" 2>&1 &
                done
                wait
                for guest in $(seq 0 $((xdp_guests - 1))); do
                  echo "XDP-GUEST $guest: $(grep -a -o -m 1 'guest kernel command line [0-9]* bytes' "$logs/$server.$client.vm$guest.log")"
                done
                for case in $xdp_cases_run; do
                  [ -f "$logs/$server.$client.$case.rc" ] || { echo 1 > "$logs/$server.$client.$case.rc"; tail -n 5 "$logs"/"$server.$client".vm*.log > "$logs/$server.$client.$case.log"; }
                done
              ) &
              continue
            fi
            (
              for case in $socket_cases; do
                ROCKETNET_SERVER_TRANSPORT=$server ROCKETNET_CLIENT_TRANSPORT=${client#auto} "$functional" --run "$case" 2>&1 | tr -d '\r' > "$logs/$server.$client.$case.log"
                echo "${PIPESTATUS[0]}" > "$logs/$server.$client.$case.rc"
              done
            ) &
          done <<< "$matrix"
          wait
          failed=0
          while read -r server client expected; do
            [ -n "$server" ] || continue
            cases=$(cell_cases "$server")
            for case in $cases; do
              log="$logs/$server.$client.$case.log"
              # a cell that died before writing its result file fails by name
              if [ ! -f "$logs/$server.$client.$case.rc" ]; then
                echo "MISSING server=$server client=$client $case: no result file; its cell died before writing one"
                failed=1
                continue
              fi
              rc=$(cat "$logs/$server.$client.$case.rc")
              if [ "$server" = xdp ] && { [ "$rc" = skipped ] || grep -E '^SKIPPED .*: rocketnet_test_xdp_veth_runs_here$' "$log"; }; then
                echo "xdp veth case skipped in the VM tier: $case" >&2
                failed=1
                continue
              fi
              if [ "$rc" = skipped ]; then
                echo "SKIP server=$server client=$client $case: $(cat "$log")"
                continue
              fi
              card=""
              for x in $expected; do [ "${x%%=*}" = "$case" ] && card=${x#*=}; done
              ok=1
              [ "$rc" = 0 ] && grep -qx "${case#prod:}" "$log" && ! grep -q '\[SKIPPED' "$log" || ok=0
              if [ -n "$card" ] && { [ "$ok" = 1 ] || grep -q 'remove the marker' "$log"; }; then
                echo "XPASS server=$server client=$client $case: $card has landed; remove its expected-fail mark"
                failed=1
              elif [ -n "$card" ]; then
                echo "XFAIL server=$server client=$client $case (expected until $card lands)"
              elif [ "$ok" = 1 ]; then
                echo "PASS server=$server client=$client $case"
              else
                echo "FAIL server=$server client=$client $case (exit $rc)"
                tail -n 5 "$log" | sed 's/^/    /'
                failed=1
              fi
            done
          done <<< "$matrix"
          rm -rf "$logs"
          exit "$failed"

      - name: "Functional: lifecycle binary"
        if: matrix.leg == 'functional'
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: ./bin/test_lifecycle

      # THE TESTED libxdp RANGE. The AF_XDP providers rocketnet supports are
      # Ubuntu 22.04's stock libbpf 0.5 (no libxdp; the legacy bpf/xsk.h
      # path), libxdp 1.4 (Ubuntu 24.04) and libxdp 1.6 (Ubuntu 26.04).
      # sdk/rocketnet_server_socket_linux.cpp initializes the UMEM ring sizes
      # because libxdp 1.4 rejects zeroed ring sizes (1.6 accepts them), so
      # the same source serves every provider with no version switch. The
      # fleet's runners carry libxdp 1.6, and the transport family matrix's
      # xdp cell (above) runs every rocketnet_test_xdp_veth_runs_here case
      # against it in a guest of the runner's kernel; the nightly
      # distro-container job builds and unit-tests the library against 22.04's
      # libbpf 0.5 and 24.04's libxdp 1.4. This step records the libxdp the
      # cell ran against and refuses one outside the tested range, so a host
      # upgrade past 1.6 is tested before it is trusted.
      - name: The XDP cell ran against a libxdp in the tested range (1.4 to 1.6)
        if: runner.os == 'Linux' && matrix.leg == 'transport_matrix'
        run: |
          set -euo pipefail
          version=$(pkg-config --modversion libxdp)
          echo "libxdp $version on $RUNNER_NAME"
          case "$version" in
            1.4.*|1.5.*|1.6.*) ;;
            *) echo "LIBXDP-UNTESTED libxdp $version on $RUNNER_NAME is outside the tested range 1.4 to 1.6; test it, then widen this step and docs/LINUX.md section 1"; exit 1 ;;
          esac

      - name: Check test scaffolding boundary (red controls)
        if: matrix.leg == 'checks' && ( runner.os == 'Linux' && matrix.dev == 'OFF' )
        run: python3 tools/check_test_scaffolding_boundary.py --red-controls

      - name: Check production library boundary
        if: matrix.leg == 'checks' && matrix.dev == 'OFF'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            python3 tools/check_exports.py bin/librocketnet.dylib build/librocketnet.a
          else
            python3 tools/check_exports.py bin/librocketnet.so build/librocketnet.a
          fi

      # tools/check_hardening.py picks the format by magic and prints one PASS/FAIL
      # line per required property (ELF: BIND_NOW, GNU_RELRO, __stack_chk_fail,
      # GNU_STACK not executable; Mach-O: ___stack_chk_fail and ___stack_chk_guard
      # imported, no writable+executable segment) and INFO for CET, then one verdict
      # line. It reads the Release library the Makefile built (well under a second).
      - name: Check release hardening
        if: matrix.leg == 'checks' && matrix.build_type == 'Release'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            python3 tools/check_hardening.py bin/librocketnet.dylib
          else
            python3 tools/check_hardening.py bin/librocketnet.so
          fi

      # The other optimized configurations are hardened like Release: each
      # builds the shared library alone in its own directory and the same
      # checker reads it. The two share nothing and build at once
      # (tools/run_parallel.py).
      - name: Check RelWithDebInfo and MinSizeRel hardening
        if: matrix.leg == 'checks' && matrix.build_type == 'Release' && ( runner.os == 'Linux' )
        shell: bash
        run: |
          set -euo pipefail
          commands=()
          for config in RelWithDebInfo MinSizeRel; do
            dir="build-harden-$config"
            commands+=("cmake -S . -B '$dir' -DCMAKE_BUILD_TYPE=$config -DROCKETNET_DEV=OFF -DCMAKE_LIBRARY_OUTPUT_DIRECTORY='$PWD/$dir/bin' -DCMAKE_RUNTIME_OUTPUT_DIRECTORY='$PWD/$dir/bin'; cmake --build '$dir' --target rocketnet_shared --parallel 4; python3 tools/check_hardening.py '$dir/bin/librocketnet.so'")
          done
          python3 tools/run_parallel.py "${commands[@]}"

      - name: Check every driver row has transport matrix cells
        if: matrix.leg == 'checks' && ( runner.os == 'Linux' )
        run: python3 tools/check_transport_matrix.py

      # tools/check_platform_policy.py exits 1 when a docs/PLATFORMS.md row
      # does not match its named workflow (check_row) or when tests/functional/
      # holds a wildcard address literal outside WILDCARD_ALLOWED
      # (check_wildcard_binds). It reads files only, so one leg per Linux
      # row runs it.
      - name: Check the platform policy and tests/functional/ wildcard binds
        if: runner.os == 'Linux' && matrix.leg == 'checks'
        run: python3 tools/check_platform_policy.py

      # tools/check_tsan_flags.py exits 1 when a workflow compiles with
      # -fsanitize=thread below -O1, where tsan misses a struct copy's
      # memcpy write after an unordered read. It reads files only.
      - name: Check every tsan build compiles at -O1 or above
        if: runner.os == 'Linux' && matrix.leg == 'checks'
        run: |
          python3 tools/check_tsan_flags.py --self-test
          python3 tools/check_tsan_flags.py

      # The static source-audit binary reads the repository's own source,
      # header and doc files (no socket, no thread, no network), so one Linux
      # leg runs it beside the client/server-words check.
      - name: Run the source audit
        if: runner.os == 'Linux' && matrix.leg == 'checks'
        run: ./bin/source_audit

      # The config-env audit (tests/source_audit_config_env_names.cpp) reads
      # ROCKETNET_DEV code, so the Release (DEV=OFF) checks leg above compiles
      # it out. The Linux Debug unit leg builds DEV=ON on every commit: it runs
      # the audit there, and the case must have run.
      - name: Run the source audit in the development build (config-env names)
        if: runner.os == 'Linux' && matrix.leg == 'unit' && matrix.dev == 'ON'
        shell: bash
        run: |
          set -euo pipefail
          ./bin/source_audit | tee source-audit-dev.log
          grep -qx test_config_env_every_name_read_is_documented source-audit-dev.log

      - name: Check export source gate
        if: matrix.leg == 'checks' && ( runner.os == 'Linux' )
        run: python3 tools/test_check_exports.py

      # the 1.x C ABI against its recorded baseline, tools/abi_v1.txt (from
      # v1.1.0): exports, prototypes, callback typedefs, struct sizes, field
      # offsets, sizes and types, enumerator values and macro values; one
      # small C compile. test_check_abi.py plants each kind of change
      - name: Check the 1.x ABI baseline
        if: matrix.leg == 'checks' && ( runner.os == 'Linux' )
        run: |
          python3 tools/test_check_abi.py
          python3 tools/check_abi.py

      - name: Test the hardening checker's verdicts
        if: matrix.leg == 'checks' && ( runner.os == 'Linux' )
        run: python3 tools/test_check_hardening.py

      - name: Test the MSan gate's verdicts
        if: matrix.leg == 'checks' && ( runner.os == 'Linux' )
        run: python3 tools/test_run_msan.py

      - name: Test the static gate's verdicts
        if: matrix.leg == 'checks' && ( runner.os == 'Linux' )
        run: python3 tools/test_run_static.py

      - name: Test the tidy gate's verdicts
        if: matrix.leg == 'checks' && ( runner.os == 'Linux' )
        run: python3 tools/test_run_tidy.py

      - name: Test the Application Verifier runner's image name
        if: matrix.leg == 'checks' && ( runner.os == 'Linux' )
        run: python3 tools/test_appverif_run.py

      - name: Test the toolchain nightly's verdicts
        if: matrix.leg == 'checks' && ( runner.os == 'Linux' )
        run: python3 tools/test_check_toolchain_build.py

      - name: Test the real-load nightly's verdicts
        if: matrix.leg == 'checks' && ( runner.os == 'Linux' )
        run: python3 tools/test_real_load_report.py

      # rocketnet.h alone: plain C99/C11/C++11, standard includes only, one
      # extern "C" block, and a C and a C++ client and server built from only
      # the header and the prebuilt static library (seconds)
      - name: Check the public header is clean and self-contained
        if: runner.os == 'Linux' && matrix.build_type == 'Release' && (matrix.leg == 'builds' || (matrix.with_builds && !inputs.full))
        run: python3 tools/check_public_header.py --build build

      # The library is callable from a C and a C++ program through rocketnet.h
      # alone, against the development shared and static libraries, and the
      # production shared library exports only the reviewed list (so the
      # development token minting symbol stays out of it).
      - name: Check the library is callable from C and C++ through rocketnet.h
        if: (runner.os == 'Linux' || runner.os == 'macOS') && matrix.build_type == 'Release' && (matrix.leg == 'builds' || (matrix.with_builds && !inputs.full))
        run: python3 tools/check_dll_consumer.py --build build

      - name: Check the examples against the house rules
        if: runner.os == 'Linux' && matrix.build_type == 'Release' && (matrix.leg == 'builds' || (matrix.with_builds && !inputs.full))
        run: python3 tools/check_examples.py

      - name: Check larger history budget and reject undersized history
        if: inputs.full && runner.os == 'Linux' && matrix.build_type == 'Release' && (matrix.leg == 'builds' || (matrix.with_builds && !inputs.full))
        run: |
          cmake -S . -B build-history -DCMAKE_BUILD_TYPE=Release -DROCKETNET_HISTORY_PACKETS=32768 -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build-history/bin"
          cmake --build build-history --target test_lifecycle --parallel 8
          ./build-history/bin/test_lifecycle
          if cmake -S . -B build-history-invalid -DROCKETNET_HISTORY_PACKETS=256; then
            echo "undersized history was accepted"
            exit 1
          fi

      # the build is tolerant: a Linux build without a BPF-capable clang,
      # libbpf or libxdp, or with ROCKETNET_XDP=OFF, compiles the XDP
      # transport out. The library then carries no XDP code and no libbpf or
      # libxdp link, and a transport list naming xdp refuses it with
      # TRANSPORT_NOT_BUILT; the default build keeps all of it.
      - name: Build without XDP; XDP is compiled out, a pin of it refuses, and functional links
        if: inputs.full && runner.os == 'Linux' && matrix.build_type == 'Release' && (matrix.leg == 'builds' || (matrix.with_builds && !inputs.full))
        run: |
          python3 tools/test_check_xdp_compiled_out.py
          python3 tools/check_xdp_compiled_out.py --present bin/librocketnet.so build/librocketnet.a
          cmake -S . -B build-no-xdp -DCMAKE_BUILD_TYPE=Release -DROCKETNET_XDP=OFF -DROCKETNET_BUILD_EXAMPLES=OFF -DROCKETNET_BUILD_TOOLS=OFF \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build-no-xdp/bin" -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/build-no-xdp/bin"
          cmake --build build-no-xdp --target rocketnet rocketnet_shared test functional --parallel 8
          python3 tools/check_xdp_compiled_out.py --absent build-no-xdp/bin/librocketnet.so build-no-xdp/librocketnet.a
          # every case this build compiles in place of the XDP transport's
          # (#if !ROCKETNET_XDP), listed by the binary itself
          mkdir -p unit-cases
          ./build-no-xdp/bin/test --list | grep -E '^test_xdp_(compiled_out|disabled)_' > no-xdp-cases.txt
          test -s no-xdp-cases.txt
          while read -r case; do
            ./build-no-xdp/bin/test --run "$case"
            echo "$case" >> unit-cases/Linux-no-XDP.txt
          done < no-xdp-cases.txt
          ROCKETNET_SERVER_TRANSPORT=portable ./build-no-xdp/bin/functional --run test_transport_env_pin_is_honoured

      - name: Upload the no-XDP unit cases
        if: inputs.full && runner.os == 'Linux' && matrix.build_type == 'Release' && matrix.leg == 'builds'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: unit-cases-Linux-no-XDP
          path: unit-cases/
          if-no-files-found: error

      # The client build: liburing, libbpf and libxdp are server-only, so a
      # Linux build with ROCKETNET_XDP=OFF and ROCKETNET_IO_URING=OFF needs
      # none of their headers or libraries. CMAKE_IGNORE_PATH points the
      # find_path/find_library searches away from the system copies the fleet
      # host has installed, so the configure below (and the package consumer
      # check_package.py --client configures) runs as it would on a machine
      # without them. The shared library must carry no NEEDED entry for any
      # of the three, and the installed package must require none of them:
      # check_package.py --client asserts the installed RocketNetConfig and
      # then builds and runs a C client against both installed libraries.
      - name: Build Linux client without server libraries; package requires none of them
        timeout-minutes: 1
        if: runner.os == 'Linux' && matrix.build_type == 'Release' && (matrix.leg == 'builds' || (matrix.with_builds && !inputs.full))
        run: |
          cmake -S . -B build-no-server-libs -DCMAKE_BUILD_TYPE=Release -DROCKETNET_XDP=OFF -DROCKETNET_IO_URING=OFF \
            -DROCKETNET_BUILD_EXAMPLES=OFF -DROCKETNET_BUILD_TOOLS=OFF -DROCKETNET_BUILD_TESTS=OFF \
            "-DCMAKE_IGNORE_PATH=/usr/include;/usr/lib/x86_64-linux-gnu;/usr/lib/aarch64-linux-gnu;/usr/lib" \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build-no-server-libs/bin" -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/build-no-server-libs/bin"
          cmake --build build-no-server-libs --target rocketnet rocketnet_shared --parallel 8
          python3 tools/check_xdp_compiled_out.py --absent build-no-server-libs/bin/librocketnet.so build-no-server-libs/librocketnet.a
          if readelf -d build-no-server-libs/bin/librocketnet.so | grep -E 'NEEDED.*lib(uring|bpf|xdp)'; then
            echo "client library links a server library (liburing, libbpf or libxdp)"
            exit 1
          fi
          readelf -d build-no-server-libs/bin/librocketnet.so | grep NEEDED
          python3 tools/check_package.py build-no-server-libs --config Release --client

      # The cases only the wide build compiles, and the promotion case, whose
      # boundary channel is 300 there; each is recorded as it passes.
      - name: Wide-channel unit cases (ROCKETNET_MAX_CHANNELS=512)
        if: runner.os == 'Linux' && matrix.build_type == 'Debug' && matrix.leg == 'builds'
        run: |
          set -euo pipefail
          # Give sort and comm the same byte ordering on every runner.
          export LC_ALL=C
          mkdir -p unit-cases
          { comm -13 <(./bin/test --list | sort) <(./bin/test_wide --list | sort); echo test_unreliable_promotion_every_mode; } > wide-cases.txt
          test "$(wc -l < wide-cases.txt)" -ge 2
          while read -r case; do
            ./bin/test_wide --run "$case"
            echo "$case" >> unit-cases/Linux-wide.txt
          done < wide-cases.txt

      - name: Upload the wide-channel unit cases
        if: runner.os == 'Linux' && matrix.build_type == 'Debug' && matrix.leg == 'builds'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: unit-cases-Linux-wide
          path: unit-cases/
          if-no-files-found: error

      - name: Install and relocate the SDK; run C/C++ static/shared consumers
        if: (matrix.leg == 'builds' || (matrix.with_builds && !inputs.full))
        run: python3 tools/check_package.py build --config ${{ matrix.build_type }} --embedded

      # Prints both JSON lines on macOS. A nonzero exit is red here (the
      # assertion below requires exit 0 from the same runs) and the
      # assertion still runs after it, so its planned and live figures show.
      - name: Memory plans echo the allocator observation on macOS
        id: memory_echo
        if: runner.os == 'macOS' && matrix.leg == 'checks'
        run: |
          ./bin/transport_memory 1 1416 portable 1
          ./bin/transport_memory 1 1416 msgx 1

      - name: Memory plans against allocator observations
        if: ${{ matrix.leg == 'checks' && (success() || steps.memory_echo.outcome == 'failure') }}
        run: python3 tools/check_memory.py ./bin/transport_memory

      # The message matrix's receive oracle (tests/matrix_receive.h) held to
      # its named faults without a socket: duplicate, never-sent,
      # out-of-order, not-increasing, lost, and the 3/7 cross-mode order
      # (held before the sent report, named after it, no fault for a sender
      # that drove one mode). The --matrix pair itself needs a bench.
      - name: The matrix oracle's self-test
        if: matrix.leg == 'checks'
        run: ./bin/server --matrix --seed 7 --self-test-result "$RUNNER_TEMP/matrix-server-self-test.tsv"

      # The contract and the extension's build share nothing and run at once
      # (tools/run_parallel.py).
      - name: "Functional: native driver contract and external backend"
        if: matrix.leg == 'checks'
        run: python3 tools/run_parallel.py ./bin/test_transport 'python3 tools/check_driver_extension.py build --config ${{ matrix.build_type }}'

      - name: Enforce combined unit and functional timing
        env:
          CI_TIMING_ROW: ${{ format('{0}/{1}/{2}{3}', runner.os, matrix.build_type, matrix.leg, matrix.shard && format(' {0}', matrix.shard) || '') }}
        run: &enforce_unit_functional_timing |
          set -euo pipefail
          timing_receipt="$RUNNER_TEMP/rocketnet-unit-functional.start"
          if [[ ! -f "$timing_receipt" ]]; then
            echo "CI_UNIT_FUNCTIONAL_TIMING=FAIL reason=missing_start"
            exit 1
          fi
          if ! read -r timing_run_id timing_run_attempt timing_start_ns timing_extra < "$timing_receipt"; then
            rm -f "$timing_receipt"
            echo "CI_UNIT_FUNCTIONAL_TIMING=FAIL reason=invalid_or_stale_start"
            exit 1
          fi
          timing_record="$timing_run_id $timing_run_attempt $timing_start_ns"
          timing_bytes=$(wc -c < "$timing_receipt" | tr -d '[:space:]')
          rm -f "$timing_receipt"
          if [[ -n "${timing_extra:-}" ]] || [[ "$timing_run_id" != "$GITHUB_RUN_ID" ]] || \
             [[ "$timing_run_attempt" != "$GITHUB_RUN_ATTEMPT" ]] || [[ ! "$timing_start_ns" =~ ^[0-9]+$ ]] || \
             [[ ! "$timing_bytes" =~ ^[0-9]+$ ]] || (( timing_bytes != ${#timing_record} + 1 )); then
            echo "CI_UNIT_FUNCTIONAL_TIMING=FAIL reason=invalid_or_stale_start"
            exit 1
          fi
          timing_python=python3
          command -v "$timing_python" >/dev/null 2>&1 || timing_python=python
          timing_end_ns=$($timing_python -c 'import time; print(time.clock_gettime_ns(time.CLOCK_MONOTONIC) if hasattr(time, "CLOCK_MONOTONIC") else time.monotonic_ns())')
          if [[ ! "$timing_end_ns" =~ ^[0-9]+$ ]] || (( timing_end_ns <= timing_start_ns )); then
            echo "CI_UNIT_FUNCTIONAL_TIMING=FAIL reason=invalid_end"
            exit 1
          fi
          timing_elapsed_ms=$(( ( timing_end_ns - timing_start_ns + 999999 ) / 1000000 ))
          if [[ "${ROCKETNET_NIGHTLY_NO_TIMEOUT:-0}" == 1 ]]; then
            printf 'CI_UNIT_FUNCTIONAL_TIMING row=%s start_ns=%s end_ns=%s elapsed_ms=%s budget_ms=none\n' \
              "$CI_TIMING_ROW" "$timing_start_ns" "$timing_end_ns" "$timing_elapsed_ms"
            exit 0
          fi
          printf 'CI_UNIT_FUNCTIONAL_TIMING row=%s start_ns=%s end_ns=%s elapsed_ms=%s budget_ms=120000 ideal_ms=60000\n' \
            "$CI_TIMING_ROW" "$timing_start_ns" "$timing_end_ns" "$timing_elapsed_ms"
          if (( timing_elapsed_ms >= 120000 )); then
            echo "CI_UNIT_FUNCTIONAL_BUDGET=FAIL"
            exit 1
          fi
          if (( timing_elapsed_ms <= 60000 )); then
            echo "CI_UNIT_FUNCTIONAL_IDEAL=MET"
          else
            echo "CI_UNIT_FUNCTIONAL_IDEAL=MISSED"
          fi
          echo "CI_UNIT_FUNCTIONAL_BUDGET=PASS"

      # Linux: the embedded server_xdp.o is reproducible and equals a fresh
      # compile of the current sources; elsewhere: the listed inputs exist.
      - name: Embedded XDP object is reproducible and current
        if: matrix.leg == 'checks'
        run: python3 tools/check_xdp_archive.py

      - name: The build compiled and embedded the XDP program
        if: runner.os == 'Linux' && matrix.leg == 'checks'
        run: test -s build/generated/server_xdp.o

      # the provisioning script's selftest: the awk IRQ matcher held to the
      # C test's case set, transcribed, plus the R3/R7 enforcement functions
      # driven end to end in both modes against stubs replaying captured
      # xdp-tools output -- every fail site in both functions paired to a
      # driving case (the fail-site enumeration receipt on PR #110 is the
      # pairing), and the WHOLE SCRIPT driven door-to-fail by the selftest's
      # full-flow verify case. exit state asserts the UNMET/say distinction,
      # so fail-open consumer drift goes red here. needs no root; touches
      # only a private temp dir it creates and removes.

      - name: Provisioning script selftest
        if: runner.os == 'Linux' && matrix.leg == 'checks'
        run: bash scripts/rocketnet-provision selftest

      - if: always()
        uses: ./.github/actions/ccache-stats

  # Development-only unit files are in ./bin/test only when ROCKETNET_DEV=ON.
  # The Debug unit row runs them at -O0. This job runs the same suite from a
  # Release build, on its own runner, so the optimizer sees those cases on
  # every commit. timeout-minutes stays inside the two-minute per-commit
  # bound. The three compilers run the same binary in nightly-dst.yml.
  release-dev-unit:
    name: ubuntu-24.04 / Release / ROCKETNET_DEV=ON / unit
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: ${{ inputs.full && 7200 || 2 }}
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/ccache

      - name: Build the unit suite (Release, ROCKETNET_DEV=ON, GCC)
        timeout-minutes: 5
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DROCKETNET_DEV=ON
          cmake --build build --target test dst --parallel 8

      - name: Run unit tests (Release, ROCKETNET_DEV=ON)
        run: ./bin/test

      # The dst binary per commit: seeds 1-50 print the reference trace that
      # nightly-dst.yml pins (DST_REFERENCE_TRACE, the one copy; docs/DST.md),
      # about 7 s on an idle fleet host. The nightly runs the long ranges and
      # the fault schedules.
      - name: DST seeds 1-50 print the reference trace
        run: |
          set -euo pipefail
          trace=$(sed -n 's/^  DST_REFERENCE_TRACE: \([0-9a-f]*\)$/\1/p' .github/workflows/nightly-dst.yml)
          [ -n "$trace" ] || { echo "no DST_REFERENCE_TRACE in .github/workflows/nightly-dst.yml"; exit 1; }
          ./bin/dst --seeds 1-50 | tee dst-reference.log
          if grep -q '^FAIL' dst-reference.log; then echo "dst printed a FAIL line"; exit 1; fi
          want="PASS seeds=1-50 runs=50 trace=$trace"
          got=$(tail -n 1 dst-reference.log)
          [ "$got" = "$want" ] || { echo "TRACE-MISMATCH: want '$want' got '$got'"; exit 1; }

      - if: always()
        uses: ./.github/actions/ccache-stats

  # The windows leg (#81's baseline doctrine): the portable driver built with
  # MSVC — the first machine ever to compile the windows arm — and the full
  # test suite run on the runner, Debug and Release. /fp:precise comes from
  # CMakeLists.txt's MSVC branch, the family's floor per the -ffp-contract=off
  # policy. Sodium is compiled from the pinned vendor with the same CRT; the
  # multi-config generator puts binaries under bin/<config>. The #106
  # config and driver tests run here too -- setenv/unsetenv are shimmed
  # over _putenv_s in the test file, so the windows leg proves the env
  # engine and the portable rung on the one platform whose only rung is
  # portable -- EXCEPT the empty-value distinction, which windows cannot
  # represent: its CRT has no set-but-empty variable, so that one case is
  # not checked there. Tests windows does not build are not registered
  # there, so they are neither run nor printed:
  # the refused-destination and zero-length-chaff pump tests, whose
  # raw-socket injector is posix-only, and the gso/xdp and msgx rung
  # tests windows does not build.
  #
  # RELEASE ONLY, IN TWO PARALLEL LEGS (2026-09-13).
  #
  # The Debug row moved to nightly.yml under the same name, and so did the
  # out-of-tree driver backend check on THIS platform -- see below. Windows
  # keeps Release on every commit because Release is what ships and what the
  # optimizer rewrites.
  #
  # THE HISTORY IS WORTH KEEPING, because it is three measurements and each
  # one ruled out a cheaper answer than the last:
  #
  #   one row              174s.
  #   two legs             136s EACH, balanced to the second (52s and 51s of
  #                        checks). The floor beats a two-way split.
  #   three legs           (b) 116s and (c) 109s came inside; (a) was 137s --
  #                        one check on a 92s floor, while its two siblings in
  #                        the SAME RUN measured 71s and 81s of floor. A
  #                        fourth leg with zero checks would still have landed
  #                        at 92s. Splitting had done all it could.
  #
  # So the last cut is not a split. `tools/check_driver_extension.py` -- which
  # configures and builds an out-of-tree backend against the installed SDK, a
  # second MSVC build inside a check, 42-48s of it -- moved to nightly.yml.
  # It is a CONTRACT CHECK ON A FIXED INPUT: it asks whether the driver
  # extension surface still compiles and links for a consumer outside the
  # tree, which is a question about the shape of the API, not a tripwire that
  # a given commit is likely to trip.
  #
  # AND IT STILL GATES EVERY COMMIT, on Linux and macOS. Only the WINDOWS
  # spelling went nightly, where it cost 42s on top of a 92s floor; the same
  # script runs per commit in build-and-test's `Functional: native driver
  # contract and external backend` step, 15s there. What waits until morning is
  # specifically "does the out-of-tree backend still build under MSVC", and
  # nothing else. That is a much smaller hole than moving the check itself.
  #
  # With it gone the legs are ~67s of checks over a 71-92s floor, halved by
  # measured duration:
  #
  #   (a)  ~32s  the suite and sodium (13s), the full suite over IOCP (14s;
  #              moved to nightly.yml 2026-10-24, see leg (a) below),
  #              IOCP allocation and shutdown, the committed XDP fallback
  #              source, the serialization surface, memory plans
  #   (b)  ~35s  the library boundary (10s), install and relocate the SDK
  #              (12s), ambient config isolation (12s), the native driver
  #              contract itself (test_transport; transport control is inside functional)
  #
  # `Functional: native driver contract and external backend` was ONE step
  # running three commands. The two exes stay here as `Functional: native
  # driver contract`; the python
  # check is the thing that left. Same commands, same order, one of them on a
  # different clock.
  #
  # BOTH LEGS RUN THE FULL `cmake --build` rather than only their own targets.
  # Narrowing it would buy each leg perhaps fifteen seconds and would cost
  # "everything in the tree compiles under MSVC", which is coverage, not
  # duplication -- the one thing this file's header says a gate may never
  # trade away. No build directory is ever carried between jobs, because a
  # stale object is a green for the wrong reason; the Linux and macOS jobs
  # compile through ccache (.github/actions/ccache), which keys each object
  # on the compiler, the flags and the preprocessed source and so never
  # serves a stale one. The Windows jobs compile through it too: the Visual
  # Studio generator honours no compiler launcher, so the configure step
  # passes ROCKETNET_VS_CCACHE_GLOBALS (set by the action) as CMAKE_VS_GLOBALS
  # and MSBuild runs ccache under cl.exe's name; unset, the build is uncached.
  #
  # The doctrine the row itself carries (#81's baseline): the portable driver
  # built with MSVC, the full test suite run on the runner. /fp:precise comes
  # from CMakeLists.txt's MSVC branch, the family's floor per the
  # -ffp-contract=off policy. Sodium is compiled from the pinned vendor with
  # the same CRT; the multi-config generator puts binaries under bin/<config>.
  # The #106 config and driver tests run here too -- setenv/unsetenv are
  # shimmed over _putenv_s in the test file, so the windows leg proves the env
  # engine and the portable rung on the one platform whose only rung is
  # portable -- EXCEPT the empty-value distinction, which windows cannot
  # represent: its CRT has no set-but-empty variable, so that one case is
  # not checked there. Tests windows does not build are not registered
  # there, so they are neither run nor printed:
  # the refused-destination and zero-length-chaff pump tests, whose
  # raw-socket injector is posix-only, and the gso/xdp and msgx rung
  # tests windows does not build.

  build-and-test-windows:
    name: windows / Release (${{ matrix.leg }})
    # the fleet's native Windows runner (Windows x64 MSVC: Windows 11, VS 18 Community MSVC, CMake 4, Git Bash, Python 3.9;
    # label rocketnet-windows), never a hosted image
    runs-on: [self-hosted, Windows, X64, rocketnet-windows]
    defaults:
      run:
        shell: pwsh
    # captain's job-started hook waits up to 2 minutes for one of its three
    # shared build slots on a check-in run (Glenn 2026-10-24: --slots 3), inside
    # "Set up runner" (73 s on run 40890503823): the limit is that wait plus
    # the per-commit law. The nightly test window is measured without a cap.
    #
    # NIGHTLY TIER (2026-10-31). Leg (a) alone, narrowed to the unit suite's
    # targets, measured 143s on run 41240496784 (checkout 11s, configure 19s,
    # build 55s, unit suite 38s) and hit the two-minute bound; MSVC's floor
    # leaves no room for a suite. Per commit, happy path / windows builds the
    # whole tree under MSVC and runs the happy path (106s on the same run),
    # and windows / Release / unit builds the test target and runs test.exe.
    if: inputs.full
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      matrix:
        leg: [a, b, c]
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/ccache

      - name: Check committed XDP fallback source on Windows
        if: matrix.leg == 'a'
        # Uses the Python and CMake on the fleet Windows runner's job PATH.
        run: python tools/check_xdp_archive.py --committed-only

      # The same reproduction as the Linux and macOS Release legs, from a
      # Windows checkout (sodium/README.md, "Reproducing the vendored inputs").
      - name: Reproduce the committed sodium pair
        if: matrix.leg == 'b'
        run: python tools/generate_sodium.py --inputs build/vendor-inputs --fetch --check

      # leg (a) runs the suites on the default development library
      # (ROCKETNET_DEV=ON); leg (b) checks the production library
      # (ROCKETNET_DEV=OFF) as a consumer sees it.
      - name: Configure
        timeout-minutes: 2
        run: |
          set -euo pipefail
          cmake -B build -G "Visual Studio 18 2026" -A x64 -DROCKETNET_DEV=${{ matrix.leg == 'b' && 'OFF' || 'ON' }} "-DCMAKE_VS_GLOBALS=${ROCKETNET_VS_CCACHE_GLOBALS:-}"
        shell: bash

      - name: Build
        timeout-minutes: 6
        run: cmake --build build --config Release --parallel 8

      - name: Start combined unit and functional timing (development legs)
        if: matrix.leg != 'b'
        shell: bash
        run: *start_unit_functional_timing

      # rocketnet.h alone under MSVC cl, and a C and a C++ client and server
      # built from only the header and the prebuilt static library (seconds)
      - name: Check the public header is clean and self-contained
        if: matrix.leg == 'a'
        run: python tools/check_public_header.py --build build --config Release

      - name: Replay the fuzz corpora without libFuzzer
        if: matrix.leg != 'c'
        shell: bash
        run: |
          set -euo pipefail
          # the sixteen harnesses build in one parallel build and replay at once;
          # each replay's exit status is checked
          harnesses="rocketnet_fuzz rocketnet_fuzz_message rocketnet_fuzz_connect_token rocketnet_fuzz_receive_structured rocketnet_fuzz_token_private rocketnet_fuzz_round_trip rocketnet_fuzz_config rocketnet_fuzz_server_transport rocketnet_fuzz_client_transport rocketnet_fuzz_session rocketnet_fuzz_session_raw rocketnet_fuzz_xdp_frame rocketnet_fuzz_uring_recvmsg rocketnet_fuzz_gateway_netlink rocketnet_fuzz_endpoint rocketnet_fuzz_xdp_filter"
          targets=""
          for harness in $harnesses; do targets="$targets fuzz_replay_$harness"; done
          cmake --build build --config Release --target $targets --parallel 8
          pids=""
          for harness in $harnesses; do
            corpus="tests/fuzz/corpus${harness#rocketnet_fuzz}"
            "./bin/Release/fuzz_replay_$harness.exe" "$corpus"/* > "fuzz-replay-$harness.log" 2>&1 &
            pids="$pids $!:$harness"
          done
          failed=0
          for entry in $pids; do
            if ! wait "${entry%%:*}"; then echo "fuzz replay failed: ${entry#*:}"; cat "fuzz-replay-${entry#*:}.log"; failed=1; fi
          done
          exit $failed

      - name: Save the registered unit cases
        if: matrix.leg != 'c'
        shell: bash
        env:
          ROCKETNET_TEST_NIGHTLY: ${{ inputs.full && matrix.leg == 'a' && '1' || '0' }}
        run: |
          set -euo pipefail
          mkdir -p unit-cases && ./bin/Release/test.exe --list > "unit-cases/Windows-${{ matrix.leg }}.txt"

      - name: Upload the registered unit cases
        if: matrix.leg != 'c'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: unit-cases-Windows-${{ matrix.leg }}
          path: unit-cases/
          if-no-files-found: error

      # ---- leg (a): the suite as the runner executes it ----

      - name: Run tests
        if: matrix.leg == 'a'
        shell: bash
        env:
          ROCKETNET_TEST_NIGHTLY: ${{ inputs.full && '1' || '0' }}
        run: |
          set -euo pipefail
          ./bin/Release/test.exe
          ./bin/Release/test_sodium.exe

      # The shipped Windows sockets keep datagrams whole: each create (portable,
      # iocp, rio) sets IP_DONTFRAGMENT, and IPV6_DONTFRAG on IPv6, inline. The
      # unit case of the shared helper cannot see that, so the options are read
      # back from real loopback sockets here (tests/test_iocp.cpp; the whole
      # test_iocp run is nightly).
      - name: Windows sockets set don't-fragment (real sockets)
        if: matrix.leg == 'a'
        shell: bash
        run: |
          set -euo pipefail
          ./bin/Release/test_iocp.exe test_platform_socket_sets_dont_fragment test_iocp_transport_socket_sets_dont_fragment test_rio_transport_socket_sets_dont_fragment

      # MSVC Debug with ROCKETNET_DEV=ON: the only MSVC build with the library's
      # asserts and the debug CRT's heap checks on for the DEV-only Windows
      # cases (the Debug runs elsewhere here are DEV=OFF or leg (c)'s dialog
      # cases). The whole unit suite with the nightly tier; a debug-CRT report
      # fails its case (suite_crt_report_fails). Measured on captain: 169 s.
      - name: Unit suite, MSVC Debug, ROCKETNET_DEV=ON (nightly tier)
        if: matrix.leg == 'a'
        shell: bash
        env:
          ROCKETNET_TEST_NIGHTLY: '1'
        run: |
          set -euo pipefail
          cmake --build build --config Debug --target test --parallel 8
          ./bin/Debug/test.exe

      # Leg (c): a Windows test child that fails exits at once and never waits
      # on a window (suite_no_dialogs, tests/suite_runner.h; #201). Each
      # tests/windows_no_dialogs.cpp case runs alone in Release and in Debug
      # with a 30 s deadline and must exit nonzero, and the Debug assertion's
      # report must reach stderr. The negative control explicitly restores dialog
      # routing first: its Debug assertion must go to the dialog, so either it
      # is still waiting on the box after 10 s (a runner with a desktop, where
      # #201 took two hours) or, on this service runner with no desktop, it
      # exits nonzero with no report on stderr. Either way the report the fix keeps
      # would have been lost.
      - name: Windows failures exit without dialogs, with an explicit dialog control
        if: matrix.leg == 'c'
        shell: bash
        run: |
          set -euo pipefail
          set -uo pipefail
          cmake --build build --config Debug --target windows_no_dialogs || exit 1
          # runs one case alone; prints "exited <code> <seconds>" or "waiting <seconds>" (then kills it)
          run_case() {
            local config=$1 case=$2 limit=$3 log="$RUNNER_TEMP/no-dialogs-$1-$2"
            local start=$SECONDS
            "bin/$config/windows_no_dialogs.exe" --run "$case" > "$log.out" 2> "$log.err" &
            local pid=$!
            while kill -0 "$pid" 2>/dev/null && [ $(( SECONDS - start )) -lt "$limit" ]; do sleep 0.2; done
            if kill -0 "$pid" 2>/dev/null; then
              taskkill //F //T //PID "$(cat "/proc/$pid/winpid")" > /dev/null 2>&1 || kill -9 "$pid"
              wait "$pid" 2>/dev/null
              echo "waiting $(( SECONDS - start ))"
              return
            fi
            local code=0
            wait "$pid" || code=$?
            echo "exited $code $(( SECONDS - start ))"
          }
          failed=0
          for config in Release Debug; do
            for case in test_no_dialogs_abort test_no_dialogs_assert test_no_dialogs_invalid_parameter test_no_dialogs_access_violation test_no_dialogs_heap_overrun; do
              read -r state code seconds <<< "$(run_case "$config" "$case" 30)"
              stderr=$(head -n 3 "$RUNNER_TEMP/no-dialogs-$config-$case.err" 2>/dev/null | tr -d '\r' | tr '\n' '|')
              if [ "$config/$case" = Debug/test_no_dialogs_heap_overrun ] && ! grep -q "the debug CRT reported an error" "$RUNNER_TEMP/no-dialogs-$config-$case.err"; then
                echo "FAIL $config $case: the debug heap report did not end the case red"
                failed=1
              elif [ "$config/$case" = Debug/test_no_dialogs_assert ] && ! grep -q "Assertion failed" "$RUNNER_TEMP/no-dialogs-$config-$case.err"; then
                echo "FAIL $config $case: the assertion report did not reach stderr"
                failed=1
              elif [ "$state" = exited ] && [ "$code" != 0 ]; then
                echo "PASS $config $case exited $code (low byte of the status) in ${seconds} s; stderr: $stderr"
              else
                echo "FAIL $config $case: $state ${code} after ${seconds:-$code} s"
                failed=1
              fi
            done
          done
          read -r state code seconds <<< "$(run_case Debug test_no_dialogs_dialog_routing_restored 10)"
          if [ "$state" = waiting ]; then
            echo "PASS negative control: with dialog routing restored, the Debug assertion was still waiting on its dialog after $code s (killed)"
          elif [ "$state" = exited ] && [ "$code" != 0 ] && ! grep -q "Assertion failed" "$RUNNER_TEMP/no-dialogs-Debug-test_no_dialogs_dialog_routing_restored.err"; then
            echo "PASS negative control: with dialog routing restored, the Debug assertion went to a dialog this service runner cannot show (exited $code in $seconds s, no report on stderr)"
          else
            echo "FAIL negative control: with dialog routing restored, expected a waiting dialog or a nonzero exit without the assertion report on stderr; got $state $code after ${seconds:-$code} s"
            failed=1
          fi
          exit $failed

      # Leg (c), 2026-10-29: the functional suite is back on every commit, its
      # cases in parallel (tests/functional/main.cpp), the slowest RIO and IOCP x1000
      # cycles in the nightly tier. The note below is its history.
      - name: Run functional suite (parallel)
        if: matrix.leg == 'c'
        shell: bash
        run: |
          set -euo pipefail
          bash tools/run_functional.sh dev ./bin/Release/functional.exe

      # THE WINDOWS FUNCTIONAL SUITE IS NIGHTLY (2026-10-24). Per-commit
      # Windows runs the build and the unit suite (test.exe) only; the full
      # functional.exe takes about 223 s per run on the fleet Windows runner,
      # and leg (a) ran it twice (default, then ROCKETNET_SERVER_TRANSPORT=iocp)
      # inside this job's 3-minute bound, so the leg could not pass. The bound
      # is the per-commit law and is not raised; the suite moved instead,
      # unchanged, to nightly.yml, which is exempt from the time rule:
      #   windows / Debug (build-and-test-windows-debug): "Run functional
      #       suite" and "Functional suite with IOCP selected", the same two
      #       steps with the same pin and the same env-pin grep;
      #   windows / Release ASan (build-and-test-windows-asan): the Release
      #       functional.exe under default, iocp and rio.
      # The short per-case functional runs stay here: the lifecycle binary
      # below and leg (b)'s transport family matrix.

      - name: "Functional: lifecycle binary"
        if: matrix.leg == 'a'
        shell: bash
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: |
          set -euo pipefail
          ./bin/Release/test_lifecycle.exe

      - name: Memory plans against allocator observations
        if: matrix.leg == 'a'
        run: python tools/check_memory.py ./bin/Release/transport_memory.exe

      # ---- leg (b): the SDK as a consumer sees it, and the driver contract ----

      - name: Check production library boundary
        if: matrix.leg == 'b'
        run: python tools/check_exports.py bin/Release/rocketnet.dll build/Release/rocketnet.lib

      # DYNAMIC_BASE, NX_COMPAT, HIGH_ENTROPY_VA and a non-zero /GS SecurityCookie,
      # read from the PE with struct (no dumpbin, no vcvars); GUARD_CF and
      # CET_COMPAT are INFO lines, the owner's call
      - name: Check release hardening
        if: matrix.leg == 'b'
        run: python tools/check_hardening.py bin/Release/rocketnet.dll

      - name: Start combined unit and functional timing (production leg)
        if: matrix.leg == 'b'
        shell: bash
        run: *start_unit_functional_timing

      - name: Check the library is callable from C and C++ through rocketnet.h
        if: matrix.leg == 'b'
        run: python tools/check_dll_consumer.py --build build

      - name: Install and relocate the SDK; run C/C++ static/shared consumers
        if: matrix.leg == 'b'
        run: python tools/check_package.py build --config Release

      - name: Ambient config isolation and passing output
        if: matrix.leg == 'b'
        run: python tools/check_test_environment.py ./bin/Release/test.exe --production

      - name: "Functional: native driver contract"
        if: matrix.leg == 'b'
        run: |
          ./bin/Release/test_transport.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run functional_production suite (auto ladder, production library)
        if: matrix.leg == 'b'
        shell: bash
        run: |
          set -euo pipefail
          bash tools/run_functional.sh prod ./bin/Release/functional_production.exe

      - name: Run functional_production suite (portable rung pinned by env)
        if: matrix.leg == 'b'
        shell: bash
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: |
          set -euo pipefail
          ./bin/Release/functional_production.exe --run test_transport_env_pin_is_honoured

      # test_iocp.cpp's DEV=0 main on the production library: ordinary IOCP
      # and RIO constructors, real loopback datagrams, bounded shutdown
      # (CMakeLists.txt, test_windows_transports_production)
      - name: "Functional: production Windows transports"
        if: matrix.leg == 'b'
        shell: bash
        run: |
          set -euo pipefail
          ./bin/Release/test_windows_transports_production.exe

      # THE TRANSPORT FAMILY MATRIX: every transport this OS builds, pinned by
      # env, on IPv4, on IPv6 and with an IPv4 client of an IPv6 wildcard
      # server, so a family regression on any one transport fails here.
      # test_transport_env_pin_is_honoured runs under the same pin and proves the
      # pinned transport is the one granted. tools/check_transport_matrix.py
      # refuses a driver row in sdk/rocketnet_drivers.inc with no cell on an
      # OS it builds for. A cell line is: server transport, client
      # transport, then case=card for each case expected to fail until that
      # card lands: the case fails, or prints a skip naming that card. An
      # expected failure that passes fails the step, so the mark is removed
      # as the card lands; any other skip fails. xdp is Linux only; its cell
      # is in the Linux matrix.
      # A client of auto sets no client pin, so that cell runs the client's
      # automatic order on the wire (gso on Linux, msgx on macOS, iocp on
      # Windows; TRANSPORTS.md "Client transports").
      - name: Transport family matrix (every transport on IPv4, IPv6 and dual stack)
        if: matrix.leg == 'b'
        shell: bash
        env:
          TRANSPORT_MATRIX_WINDOWS: |
            portable portable
            portable auto
            iocp portable
            portable iocp
            rio portable
            loopback loopback
        run: |
          set -euo pipefail
          set +e -uo pipefail
          case "$RUNNER_OS" in
            Linux)   matrix=$TRANSPORT_MATRIX_LINUX;   functional=./bin/functional ;;
            macOS)   matrix=$TRANSPORT_MATRIX_MACOS;   functional=./bin/functional ;;
            Windows) matrix=$TRANSPORT_MATRIX_WINDOWS; functional=./bin/Release/functional.exe ;;
            *) echo "TRANSPORT-MATRIX no matrix for $RUNNER_OS"; exit 1 ;;
          esac
          cases="test_loopback_transport_udp test_loopback_transport_ipv6 test_transport_dual_stack_ipv4_client test_transport_env_pin_is_honoured"
          uring_offered=0
          if [ "$RUNNER_OS" = Linux ] && [ "$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo 0)" = 0 ]; then uring_offered=1; fi
          mkdir -p build
          logs=$(mktemp -d "$PWD/build/transport-matrix.XXXXXX")
          # each cell runs its cases in series; the cells run in parallel
          while read -r server client expected; do
            [ -n "$server" ] || continue
            if [ "$server" = io_uring ] && [ "$uring_offered" = 0 ]; then
              # an explicit skip with its reason, never a dropped cell
              for case in $cases; do
                echo "this kernel disables io_uring" > "$logs/$server.$client.$case.log"
                echo skipped > "$logs/$server.$client.$case.rc"
              done
              continue
            fi
            (
              for case in $cases; do
                ROCKETNET_SERVER_TRANSPORT=$server ROCKETNET_CLIENT_TRANSPORT=${client#auto} "$functional" --run "$case" 2>&1 | tr -d '\r' > "$logs/$server.$client.$case.log"
                echo "${PIPESTATUS[0]}" > "$logs/$server.$client.$case.rc"
              done
            ) &
          done <<< "$matrix"
          wait
          failed=0
          while read -r server client expected; do
            [ -n "$server" ] || continue
            for case in $cases; do
              log="$logs/$server.$client.$case.log"
              # a cell that died before writing its result file fails by name
              if [ ! -f "$logs/$server.$client.$case.rc" ]; then
                echo "MISSING server=$server client=$client $case: no result file; its cell died before writing one"
                failed=1
                continue
              fi
              rc=$(cat "$logs/$server.$client.$case.rc")
              if [ "$rc" = skipped ]; then
                echo "SKIP server=$server client=$client $case: $(cat "$log")"
                continue
              fi
              card=""
              for x in $expected; do [ "${x%%=*}" = "$case" ] && card=${x#*=}; done
              ok=1
              [ "$rc" = 0 ] && grep -qx "$case" "$log" && ! grep -q '\[SKIPPED' "$log" || ok=0
              if [ -n "$card" ] && { [ "$ok" = 1 ] || grep -q 'remove the marker' "$log"; }; then
                echo "XPASS server=$server client=$client $case: $card has landed; remove its expected-fail mark"
                failed=1
              elif [ -n "$card" ]; then
                echo "XFAIL server=$server client=$client $case (expected until $card lands)"
              elif [ "$ok" = 1 ]; then
                echo "PASS server=$server client=$client $case"
              else
                echo "FAIL server=$server client=$client $case (exit $rc)"
                tail -n 5 "$log" | sed 's/^/    /'
                failed=1
              fi
            done
          done <<< "$matrix"
          rm -rf "$logs"
          exit "$failed"

      - name: Enforce combined unit and functional timing
        shell: bash
        env:
          CI_TIMING_ROW: ${{ format('{0}/Release/{1}', runner.os, matrix.leg) }}
        run: *enforce_unit_functional_timing

      - if: always()
        uses: ./.github/actions/ccache-stats

  # THE HAPPY PATH: the real server and client binaries as separate processes
  # over loopback, watched stage by stage. It is deliberately small -- connect,
  # one message of every reliability type, receipts, clean disconnect, clean
  # stop -- and it is its own job with NO needs, so it starts at once beside
  # build-and-test and adds nothing to the wall time of the per-commit gate.
  # The tools/happy_path Go tool is standard library only; nothing here needs
  # root and nothing selects XDP (the tool pins the portable transport).

  happy-path:
    name: happy path / ${{ matrix.os }}
    # every OS on the fleet: Linux and macOS on the fleet pools, Windows on rocketnet-windows
    runs-on: ${{ fromJSON(matrix.os == 'windows' && '["self-hosted","Windows","X64","rocketnet-windows"]' || startsWith(matrix.os, 'macos') && '["self-hosted","macOS","ARM64","fleet"]' || '["self-hosted","Linux","X64","fleet"]') }}
    # the Windows row waits for a captain build slot first (build-and-test-windows)
    timeout-minutes: ${{ inputs.full && 7200 || 2 }}
    # Git Bash on the Windows row: a bash command line (the workflow default)
    # is looked up on PATH there, where WSL's bash may come first; each step
    # sets -euo pipefail itself
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # macOS runs in the nightly tier: per commit the macOS runners hold
        # the two build-and-test rows. The runner comes from os in
        # runs-on, not from include rows: an include row that matches no
        # combination would add the macOS row back.
        os: ${{ fromJSON(inputs.full && '["linux","macos","windows"]' || '["linux","windows"]') }}
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/ccache

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ "$RUNNER_OS" = "Windows" ]; then
            # MSVC comes through CMake's Visual Studio generator; the job PATH carries cmake, python and Git Bash
            for tool in cmake python git; do
              if ! command -v "$tool" >/dev/null 2>&1; then
                echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
                missing=1
              fi
            done
            exit "$missing"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            # darwin has no libbpf, libxdp or liburing; libsodium is the independent parity reference check_sodium.py loads
            for tool in cmake clang c++ xxd python3; do
              if ! command -v "$tool" >/dev/null 2>&1; then
                echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
                missing=1
              fi
            done
            if ! python3 -c "import ctypes.util, sys; sys.exit(0 if ctypes.util.find_library('sodium') else 1)"; then
              echo "TOOL-MISSING libsodium (any) (ctypes.util.find_library failed) on $RUNNER_NAME"
              missing=1
            fi
            exit "$missing"
          fi
          for tool in cmake gcc g++ clang xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      # macOS: Go's build and module caches on the boot volume, under the
      # runner user's home, for every later step of this job. The fleet login's
      # go env puts them on an external volume, where a headless runner's first
      # open can wait forever on a macOS privacy approval nobody answers (the
      # v1.1.5 nightly: go test blocked 55 minutes in open() of the build cache
      # before compiling anything). The tool is standard library only, so a
      # cold module cache downloads nothing; a cold build cache compiles the
      # standard library once per host.
      - name: Go caches on the boot volume (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cache_root="$HOME/Library/Caches/rocketnet-ci"
          mkdir -p "$cache_root/go-build" "$cache_root/go-mod"
          echo "GOCACHE=$cache_root/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$cache_root/go-mod" >> "$GITHUB_ENV"

      - name: Check the fleet's Go is on PATH
        shell: bash
        run: |
          set -euo pipefail
          # tools/happy_path/go.mod says go 1.22: any Go at or above 1.23 builds it (the fleet pins 1.26 on Linux and macOS)
          if ! command -v go >/dev/null 2>&1; then
            echo "TOOL-MISSING go >= 1.23 (missing) on $RUNNER_NAME"
            exit 1
          fi
          got="$(go version)"
          echo "$got"
          echo "GOCACHE=$(go env GOCACHE) GOMODCACHE=$(go env GOMODCACHE)"
          minor="$(echo "$got" | sed -n 's/.* go1\.\([0-9][0-9]*\).*/\1/p')"
          if [ -z "$minor" ] || [ "$minor" -lt 23 ]; then
            echo "TOOL-MISSING go >= 1.23 $got on $RUNNER_NAME"; exit 1
          fi

      - name: Build (Linux and macOS, through the Makefile)
        timeout-minutes: 7
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          make

      - name: Configure (Windows)
        timeout-minutes: 2
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          cmake -B build -G "Visual Studio 18 2026" -A x64 "-DCMAKE_VS_GLOBALS=${ROCKETNET_VS_CCACHE_GLOBALS:-}"

      - name: Build (Windows)
        timeout-minutes: 6
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          cmake --build build --config Release --parallel 8

      # the two C programs share this directory with the Go tool, so name the
      # tool's .go file rather than the directory. Compiling the tool and its
      # tests is a toolchain step, bounded at five times its normal length;
      # running them below is a test step and carries no deadline.
      - name: Build happy_path and its tests
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          cd tools/happy_path
          exe=$(go env GOEXE)
          go test -c -o "$RUNNER_TEMP/happy_path.test$exe" happy_path.go happy_path_test.go
          go build -o "$RUNNER_TEMP/happy_path$exe" happy_path.go

      - name: Start combined unit and functional timing
        shell: bash
        run: *start_unit_functional_timing

      - name: Run happy_path
        shell: bash
        run: |
          set -euo pipefail
          cd tools/happy_path
          exe=$(go env GOEXE)
          # go test's own default per-commit; none in the nightly tier
          test_timeout=(-test.timeout=10m)
          if [ "${ROCKETNET_NIGHTLY_NO_TIMEOUT:-0}" = 1 ]; then
            test_timeout=(-test.timeout=0)
          fi
          "$RUNNER_TEMP/happy_path.test$exe" "${test_timeout[@]}"
          "$RUNNER_TEMP/happy_path$exe"

      - name: Enforce combined unit and functional timing
        shell: bash
        env:
          CI_TIMING_ROW: ${{ format('{0}/{1}/{2}', runner.os, github.job, matrix.os) }}
        run: *enforce_unit_functional_timing

      - if: always()
        uses: ./.github/actions/ccache-stats

  # THE WINDOWS UNIT SUITE PER COMMIT: test.exe under MSVC. It was a step of
  # happy path / windows, after that job's whole-tree build, and the two
  # together ran 1m43 to 2m07 against the two-minute bound. Its own job builds
  # only the test target, on its own runner, beside happy path / windows, and
  # it alone took 1m40 (build 36 s, suite 33 s), so the suite runs as two
  # shards (test.exe --shard i/2, tests/suite_runner.h): each case is in
  # exactly one shard, and shard 0 checks that on this build's test.exe
  # (tools/check_test_shards.py).
  windows-unit:
    name: windows / Release / unit (${{ matrix.shard }}/2)
    runs-on: [self-hosted, Windows, X64, rocketnet-windows]
    defaults:
      run:
        shell: pwsh
    timeout-minutes: ${{ inputs.full && 7200 || 2 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/ccache

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          # MSVC comes through CMake's Visual Studio generator; the job PATH carries cmake, python and Git Bash
          for tool in cmake python git; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure (Windows)
        timeout-minutes: 2
        run: |
          set -euo pipefail
          cmake -B build -G "Visual Studio 18 2026" -A x64 "-DCMAKE_VS_GLOBALS=${ROCKETNET_VS_CCACHE_GLOBALS:-}"
        shell: bash

      - name: Build the unit suite (Windows)
        timeout-minutes: 5
        run: cmake --build build --config Release --target test --parallel 8

      - name: Start combined unit and functional timing
        shell: bash
        run: *start_unit_functional_timing

      - name: The shards partition the unit suite
        if: matrix.shard == 0
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_test_shards.py --self-test
          python tools/check_test_shards.py ./bin/Release/test.exe 2

      - name: Run the unit suite (Windows, shard ${{ matrix.shard }} of 2)
        shell: bash
        # --enforce-rss: a case over its memory bound fails here; a plain run
        # only prints it, and per commit no other Windows job enforces it
        run: |
          set -euo pipefail
          ./bin/Release/test.exe --enforce-rss --shard ${{ matrix.shard }}/2

      - name: Enforce combined unit and functional timing
        shell: bash
        env:
          CI_TIMING_ROW: ${{ format('{0}/{1}/{2}', runner.os, github.job, matrix.shard) }}
        run: *enforce_unit_functional_timing

      - if: always()
        uses: ./.github/actions/ccache-stats

  # THE BACKEND EXAMPLES: the Go and C# backends in examples/backend/ that mint
  # connect tokens. Their unit tests mint every token
  # in standard/vectors/connect_token_v1.json from its fixed inputs and compare byte for
  # byte, so a change to the token format that the vectors record and the
  # backends do not follow goes red here. No sockets and no real time, so no C
  # build: each leg is a toolchain and seconds of tests, its own job with NO
  # needs, beside build-and-test. The end-to-end run (server, backend, client
  # over loopback) is the functional tier, in nightly-examples.yml. Linux only:
  # the backends are portable code and the token bytes are the same everywhere.

  backend-examples:
    name: backend example / ${{ matrix.backend }}
    # nightly tier: the token bytes are held per commit by standard
    # conformance against standard/vectors; the backends follow nightly
    if: inputs.full
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      matrix:
        backend: [go, csharp]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/ccache

      - name: Check the fleet's toolchain is on PATH
        run: |
          set -euo pipefail
          # examples/backend/go/go.mod says go 1.26; the C# projects target net10.0 (the fleet pins go 1.26 and .NET SDK 10)
          if [ "${{ matrix.backend }}" = "go" ]; then
            if ! command -v go >/dev/null 2>&1; then echo "TOOL-MISSING go >= 1.26 (missing) on $RUNNER_NAME"; exit 1; fi
            got="$(go version)"; echo "$got"
            minor="$(echo "$got" | sed -n 's/.* go1\.\([0-9][0-9]*\).*/\1/p')"
            if [ -z "$minor" ] || [ "$minor" -lt 26 ]; then echo "TOOL-MISSING go >= 1.26 $got on $RUNNER_NAME"; exit 1; fi
          else
            if ! command -v dotnet >/dev/null 2>&1; then echo "TOOL-MISSING dotnet SDK 10 (missing) on $RUNNER_NAME"; exit 1; fi
            if ! dotnet --list-sdks | grep -q '^10\.'; then echo "TOOL-MISSING dotnet SDK 10 ($(dotnet --list-sdks | tr '\n' ' ')) on $RUNNER_NAME"; exit 1; fi
          fi

      # Formatting, vet and compiling the tests are toolchain steps, bounded at
      # five times their normal length; the test run carries no deadline.
      - name: Vet and build the backend's unit tests (Go)
        if: matrix.backend == 'go'
        timeout-minutes: 1
        working-directory: examples/backend/go
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: the files above are not formatted"; exit 1; }
          go vet ./...
          go test -c -o "$RUNNER_TEMP/backend.test$(go env GOEXE)" .

      - name: Unit tests (Go)
        if: matrix.backend == 'go'
        working-directory: examples/backend/go
        shell: bash
        run: |
          set -euo pipefail
          timing_receipt="$RUNNER_TEMP/rocketnet-unit-functional.start"
          rm -f "$timing_receipt"
          timing_start_ns=$(python3 -c 'import time; print(time.clock_gettime_ns(time.CLOCK_MONOTONIC) if hasattr(time, "CLOCK_MONOTONIC") else time.monotonic_ns())')
          [[ "$timing_start_ns" =~ ^[0-9]+$ ]] || { echo "CI_UNIT_FUNCTIONAL_TIMING=FAIL reason=invalid_start"; exit 1; }
          printf '%s %s %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$timing_start_ns" > "$timing_receipt"
          # go test's own default per-commit; none in the nightly tier
          test_timeout=(-test.timeout=10m)
          if [ "${ROCKETNET_NIGHTLY_NO_TIMEOUT:-0}" = 1 ]; then
            test_timeout=(-test.timeout=0)
          fi
          "$RUNNER_TEMP/backend.test$(go env GOEXE)" "${test_timeout[@]}"

      - name: Build the backend and its unit tests (C#)
        if: matrix.backend == 'csharp'
        timeout-minutes: 1
        working-directory: examples/backend/csharp
        run: |
          set -euo pipefail
          dotnet build Backend -c Release
          dotnet build Tests -c Release

      - name: Unit tests (C#)
        if: matrix.backend == 'csharp'
        working-directory: examples/backend/csharp
        shell: bash
        run: |
          set -euo pipefail
          timing_receipt="$RUNNER_TEMP/rocketnet-unit-functional.start"
          rm -f "$timing_receipt"
          timing_start_ns=$(python3 -c 'import time; print(time.clock_gettime_ns(time.CLOCK_MONOTONIC) if hasattr(time, "CLOCK_MONOTONIC") else time.monotonic_ns())')
          [[ "$timing_start_ns" =~ ^[0-9]+$ ]] || { echo "CI_UNIT_FUNCTIONAL_TIMING=FAIL reason=invalid_start"; exit 1; }
          printf '%s %s %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$timing_start_ns" > "$timing_receipt"
          dotnet run --project Tests -c Release --no-build

      - name: Enforce combined unit and functional timing
        env:
          CI_TIMING_ROW: ${{ format('{0}/{1}/{2}', runner.os, github.job, matrix.backend) }}
        run: *enforce_unit_functional_timing

      - if: always()
        uses: ./.github/actions/ccache-stats

  # asan + ubsan over focused transport recovery, lifecycle, driver, sodium
  # and XDP controls per commit. The transport allocates arenas at create,
  # hands out interior pointers into frames, and reads bytes it did not write,
  # which is the shape of defect these two see and inspection does not. The
  # exhaustive functional suite runs unchanged under the same sanitizers plus
  # LSan in the scheduled nightly-leaks workflow.
  #
  # -fno-sanitize-recover=all: undefined behaviour ends the run rather than
  # printing and continuing, so the leg cannot go green over a warning nobody
  # read.
  #
  # LEAK DETECTION IS OFF HERE, deliberately and not silently: ASAN's leak
  # check is duration-independent in exactly the wrong way -- it reports at
  # exit, on a suite that creates and destroys transports, and its findings
  # are for the nightly leak pass (#124) where a human is reading them
  # against a known baseline. The per-commit gate takes asan's memory-safety
  # findings and ubsan's, both of which are immediate and unambiguous.

  # SPLIT INTO TWO PARALLEL LEGS. One job ran the unit suite, the
  # functional suite, three lifecycle binaries and a python control in series
  # on one runner. Each leg now pays the sanitizer build once in parallel and
  # builds only the targets it runs. The unit suite runs once.
  # The functional leg retains exact, real transport recovery cases plus the
  # lifecycle binaries and negative control with -fno-sanitize-recover=all;
  # the exhaustive functional suite is owned by nightly-leaks, unchanged.
  #
  # The 2026-10-26 exact candidate receipt supersedes the old 36s functional
  # estimate: the full functional suite exceeded 164s before finishing. The
  # focused per-commit replacement must still prove itself below the workflow's
  # strict 120s combined interval; no duration is inferred from selection.

  sanitizers:
    name: asan + ubsan (${{ matrix.leg }})
    runs-on: [self-hosted, Linux, X64, fleet]   # was ubuntu-24.04, then one host's rocketnet label; the fleet's org runners (see build-and-test's note)
    timeout-minutes: ${{ inputs.full && 7200 || 2 }}
    strategy:
      fail-fast: false
      matrix:
        # the unit leg in two shards (test --shard i/2, tests/suite_runner.h):
        # build 47 s plus 68 s of cases met the two-minute cap under fleet load
        # (v1.1.5's PR); shard 0/2 also lists the whole suite on full runs
        include:
          - leg: unit suite 0/2
            shard: 0/2
          - leg: unit suite 1/2
            shard: 1/2
          - leg: functional suite
            shard: none
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/ccache

      - name: Check the fleet's build dependencies are present
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure
        timeout-minutes: 2
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"

      - name: Build the sanitized unit suite
        timeout-minutes: 4
        if: startsWith(matrix.leg, 'unit suite')
        run: cmake --build build --target test --parallel 8

      - name: Build the sanitized functional suite and the lifecycle binaries
        timeout-minutes: 6
        if: matrix.leg == 'functional suite'
        run: cmake --build build --target functional test_lifecycle test_transport test_sodium --parallel 8

      - name: Start combined unit and functional timing (unit rows)
        if: startsWith(matrix.leg, 'unit suite')
        run: *start_unit_functional_timing

      - name: Save the registered unit cases
        if: inputs.full && matrix.shard == '0/2'
        env:
          ROCKETNET_TEST_NIGHTLY: ${{ inputs.full && '1' || '0' }}
        run: mkdir -p unit-cases && ./bin/test --list > "unit-cases/Linux-asan.txt"

      - name: Upload the registered unit cases
        if: inputs.full && matrix.shard == '0/2'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: unit-cases-Linux-asan
          path: unit-cases/
          if-no-files-found: error

      - name: Run unit tests
        if: startsWith(matrix.leg, 'unit suite')
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
          ROCKETNET_TEST_NIGHTLY: ${{ inputs.full && '1' || '0' }}
        run: ./bin/test --shard ${{ matrix.shard }}

      # the same locked-memory check as build-and-test; this leg does not
      # build transport_memory, so it checks the limit without measuring
      - name: Locked-memory limit covers the io_uring cases
        if: matrix.leg == 'functional suite'
        run: bash tools/check_memlock.sh

      - name: Start combined unit and functional timing (functional row)
        if: matrix.leg == 'functional suite'
        run: *start_unit_functional_timing

      - name: Run focused functional transport recovery under sanitizers
        if: matrix.leg == 'functional suite'
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          set -euo pipefail
          ./bin/functional --run test_session_reconnect_isolation_portable
          ./bin/functional --run test_transport_ring_exhaustion
          ./bin/functional --run test_loopback_transport_udp

      - name: "Functional binaries under sanitizers: lifecycle and driver contract"
        if: matrix.leg == 'functional suite'
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: |
          ./bin/test_lifecycle
          ./bin/test_transport

      - name: Sodium known answers under sanitizers
        if: matrix.leg == 'functional suite'
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ./bin/test_sodium

      - name: Inactive XDP index negative control
        if: matrix.leg == 'functional suite'
        run: python3 tools/check_xdp_guard_control.py

      - name: Enforce combined unit and functional timing
        env:
          CI_TIMING_ROW: ${{ format('{0}/{1}/{2}', runner.os, github.job, matrix.leg) }}
        run: *enforce_unit_functional_timing

      - if: always()
        uses: ./.github/actions/ccache-stats

  # THE FUZZ SMOKE -- a REPLAY, not a hunt.
  #
  # Discovery is the nightly's job (#124: hours, with the corpus persisted
  # between nights). What belongs on a per-commit gate is the property a
  # replay has and a hunt does not: the same inputs, in the same order, with
  # the same verdict, every run. So the gate below is every committed corpus
  # file, in every target's corpus, executed exactly once through its own
  # fuzz_replay_ harness under asan+ubsan, seconds, no randomness anywhere in
  # it. Each file in tests/fuzz/corpus* is a shape the wire can carry or a
  # shape a defect once had, and the harnesses carry oracles beyond memory
  # safety (base64 round-trip, the ladder's output range),
  # so a wrong ANSWER fails them too, not only a wrong access.
  #
  # The bounded fixed-seed mutation pass that used to run here is in
  # fuzz-nightly.yml: a per-commit gate is the deterministic replay, and
  # mutation belongs to the nightly's duration budget.

  fuzz-smoke:
    name: fuzz smoke (corpus replay)
    runs-on: [self-hosted, Linux, X64, fleet]   # was ubuntu-24.04, then one host's rocketnet label; the fleet's org runners (see build-and-test's note)
    timeout-minutes: ${{ inputs.full && 7200 || 2 }}
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/ccache

      - name: Check the fleet's build dependencies are present
        run: |
          set -euo pipefail
          missing=0
          if [ "$RUNNER_OS" = "macOS" ]; then
            # darwin has no libbpf, libxdp or liburing; libsodium is the independent parity reference check_sodium.py loads
            for tool in cmake clang c++ xxd python3; do
              if ! command -v "$tool" >/dev/null 2>&1; then
                echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
                missing=1
              fi
            done
            if ! python3 -c "import ctypes.util, sys; sys.exit(0 if ctypes.util.find_library('sodium') else 1)"; then
              echo "TOOL-MISSING libsodium (any) (ctypes.util.find_library failed) on $RUNNER_NAME"
              missing=1
            fi
            exit "$missing"
          fi
          for tool in cmake gcc g++ clang xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      # the library is built once with coverage instrumentation and the
      # sanitizers, then the harness links against it -- one parallel build
      # instead of one long single-file compile of the whole sdk

      - name: Configure the instrumented library
        timeout-minutes: 1
        run: >
          cmake -B build-fuzz
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"

      - name: Build the instrumented library
        timeout-minutes: 1
        run: cmake --build build-fuzz --target rocketnet --parallel 8

      # THE GATE: each committed input, once, in order, through its target's
      # replay driver. A replay driver given files runs exactly them and exits
      # -- no mutation, no seeded randomness, no clock.

      # the build is a toolchain step and carries a deadline at five times its
      # normal length; the replay is a test step and carries none
      - name: Build the sixteen replay drivers
        timeout-minutes: 3
        run: |
          # the sixteen harnesses, the Linux-only XDP filter harness among them, build in one parallel build and replay at once;
          # each replay's exit status is checked
          harnesses="rocketnet_fuzz rocketnet_fuzz_message rocketnet_fuzz_connect_token rocketnet_fuzz_receive_structured rocketnet_fuzz_token_private rocketnet_fuzz_round_trip rocketnet_fuzz_config rocketnet_fuzz_server_transport rocketnet_fuzz_client_transport rocketnet_fuzz_session rocketnet_fuzz_session_raw rocketnet_fuzz_xdp_frame rocketnet_fuzz_uring_recvmsg rocketnet_fuzz_gateway_netlink rocketnet_fuzz_endpoint rocketnet_fuzz_xdp_filter"
          targets=""
          for harness in $harnesses; do targets="$targets fuzz_replay_$harness"; done
          mkdir -p bin
          cmake --build build-fuzz --target $targets --parallel 8

      - name: Replay every committed fuzz corpus
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          # the sixteen harnesses replay at once; each replay's exit status is
          # checked
          harnesses="rocketnet_fuzz rocketnet_fuzz_message rocketnet_fuzz_connect_token rocketnet_fuzz_receive_structured rocketnet_fuzz_token_private rocketnet_fuzz_round_trip rocketnet_fuzz_config rocketnet_fuzz_server_transport rocketnet_fuzz_client_transport rocketnet_fuzz_session rocketnet_fuzz_xdp_frame rocketnet_fuzz_uring_recvmsg rocketnet_fuzz_gateway_netlink rocketnet_fuzz_endpoint rocketnet_fuzz_xdp_filter rocketnet_fuzz_session_raw"
          pids=""
          for harness in $harnesses; do
            corpus="tests/fuzz/corpus${harness#rocketnet_fuzz}"
            "./bin/fuzz_replay_$harness" "$corpus"/* > "fuzz-replay-$harness.log" 2>&1 &
            pids="$pids $!:$harness"
          done
          failed=0
          for entry in $pids; do
            if ! wait "${entry%%:*}"; then echo "fuzz replay failed: ${entry#*:}"; cat "fuzz-replay-${entry#*:}.log"; failed=1; fi
          done
          exit $failed

      - name: Exact-field oracle rejects memory-safe truncation
        run: python3 tools/check_fuzz_oracle.py build-fuzz

      # The replay and AEAD checks against the committed corpora
      # (tools/check_fuzz_mutants.py): each mutant removes one check from the
      # packet-open path, is linked ahead of the library and replayed; a
      # mutant no input tells from the library is a red, unless the tool
      # marks it EQUIVALENT or UNCOVERED with its reason (and a mark an
      # input now kills is red too). About 17 s at four jobs.
      - name: The committed corpora kill the replay and AEAD mutants
        run: python3 tools/check_fuzz_mutants.py --build build-fuzz --jobs 4

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: fuzz-smoke-crashes
          path: |
            crash-*
            oom-*
            timeout-*
            leak-*
          if-no-files-found: ignore

      - if: always()
        uses: ./.github/actions/ccache-stats

  # THE NDEBUG LEG: every fuzzer under tests/fuzz/ compiled with -DNDEBUG, so every
  # assertion in the harnesses is compiled out, and the corpora replayed. The
  # fuzz oracles deliberately do not rely on assert -- each fires its own
  # fprintf/abort helper (rocketnet_fuzz_require) -- so a bound that only
  # held inside an assert would go unguarded here and the replay would miss
  # it. This leg is what keeps those oracles NDEBUG-proof.

  fuzz-smoke-ndebug:
    name: fuzz smoke NDEBUG (every fuzzer, corpus replay)
    # nightly tier; fuzz smoke replays the corpora per commit
    if: inputs.full
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 7200
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/ccache

      - name: Check the fleet's build dependencies are present
        run: |
          set -euo pipefail
          missing=0
          if [ "$RUNNER_OS" = "macOS" ]; then
            # darwin has no libbpf, libxdp or liburing; libsodium is the independent parity reference check_sodium.py loads
            for tool in cmake clang c++ xxd python3; do
              if ! command -v "$tool" >/dev/null 2>&1; then
                echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
                missing=1
              fi
            done
            if ! python3 -c "import ctypes.util, sys; sys.exit(0 if ctypes.util.find_library('sodium') else 1)"; then
              echo "TOOL-MISSING libsodium (any) (ctypes.util.find_library failed) on $RUNNER_NAME"
              missing=1
            fi
            exit "$missing"
          fi
          for tool in cmake gcc g++ clang xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure the instrumented library
        timeout-minutes: 1
        run: >
          cmake -B build-fuzz
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"

      - name: Build the instrumented library
        timeout-minutes: 1
        run: cmake --build build-fuzz --target rocketnet_dev --parallel 8

      - name: Build every fuzzer with NDEBUG
        timeout-minutes: 2
        run: |
          harnesses="rocketnet_fuzz rocketnet_fuzz_connect_token rocketnet_fuzz_receive_structured rocketnet_fuzz_message rocketnet_fuzz_token_private rocketnet_fuzz_round_trip rocketnet_fuzz_config rocketnet_fuzz_server_transport rocketnet_fuzz_client_transport rocketnet_fuzz_session rocketnet_fuzz_session_raw rocketnet_fuzz_xdp_frame rocketnet_fuzz_uring_recvmsg rocketnet_fuzz_gateway_netlink rocketnet_fuzz_endpoint rocketnet_fuzz_xdp_filter"
          echo "NDEBUG_HARNESSES=$harnesses" >> "$GITHUB_ENV"
          for src in $harnesses; do
            if [ "$src" = rocketnet_fuzz_xdp_filter ]; then continue; fi
            clang++ -g -O1 -std=c++17 \
              -ffp-contract=off \
              -DROCKETNET_DEV=1 -DNDEBUG \
              -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer \
              -Isodium -Isdk -Itests "tests/fuzz/${src}.cpp" build-fuzz/librocketnet_dev.a \
              -lbpf -lxdp -luring -lpthread \
              -o "bin/${src}_ndebug"
          done
          # Every fuzzer means this one as well, built as fuzz-nightly.yml
          # builds it: the XDP filter harness links the filter program as
          # host C (CMake's rocketnet_xdp_filter_host).
          cmake --build build-fuzz --target rocketnet_xdp_filter_host --parallel 8
          xdp_host="$(find build-fuzz -name librocketnet_xdp_filter_host.a | head -n 1)"
          [ -n "$xdp_host" ] || { echo "librocketnet_xdp_filter_host.a was not built"; exit 1; }
          clang++ -g -O1 -std=c++17 -ffp-contract=off -DROCKETNET_DEV=1 -DNDEBUG \
            -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer \
            -Isodium -Isdk -Itests tests/fuzz/rocketnet_fuzz_xdp_filter.cpp "$xdp_host" build-fuzz/librocketnet_dev.a \
            -lbpf -lxdp -luring -lpthread -o bin/rocketnet_fuzz_xdp_filter_ndebug

      - name: Replay all corpora under NDEBUG
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          # every harness the build step built, each against its own corpus;
          # one failing replay never hides the rest (each is named, then the
          # step fails)
          failed=0
          for harness in $NDEBUG_HARNESSES; do
            corpus="tests/fuzz/corpus${harness#rocketnet_fuzz}"
            if ! "./bin/${harness}_ndebug" "$corpus"/* > "fuzz-ndebug-$harness.log" 2>&1; then
              echo "NDEBUG replay failed: $harness"
              tail -n 30 "fuzz-ndebug-$harness.log"
              failed=1
            fi
          done
          exit $failed

      # The connect token and receive/structured targets are built only in
      # this job, so their time-boxed mutation pass lives here, after the
      # replay: a copy of the seed corpus, a fixed seed, a few seconds.

      - name: Connect token mutation pass (time-boxed, fixed seed)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          cp -r tests/fuzz/corpus_connect_token "$RUNNER_TEMP/fuzz-corpus_connect_token"
          ./bin/rocketnet_fuzz_connect_token_ndebug "$RUNNER_TEMP/fuzz-corpus_connect_token" -seed=1 -max_total_time=5 -timeout=10 -rss_limit_mb=2048 -print_final_stats=1

      - name: Receive structured mutation pass (time-boxed, fixed seed)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          cp -r tests/fuzz/corpus_receive_structured "$RUNNER_TEMP/fuzz-corpus_receive_structured"
          ./bin/rocketnet_fuzz_receive_structured_ndebug "$RUNNER_TEMP/fuzz-corpus_receive_structured" -seed=1 -max_total_time=5 -timeout=10 -rss_limit_mb=2048 -print_final_stats=1

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: fuzz-smoke-ndebug-crashes
          path: |
            crash-*
            oom-*
            timeout-*
            leak-*
          if-no-files-found: ignore

      - if: always()
        uses: ./.github/actions/ccache-stats

  # THE BIG-ENDIAN LEG (#111), and the reason it was built before the bug it
  # was built for (#112).
  #
  # rocketnet writes wire bytes. Every machine the estate owns is
  # little-endian, so the entire byte-order half of this protocol -- the
  # bswaps, the network-order helpers, the address parses, the endian_fix
  # helpers a consumer calls -- is unexecuted code on every other leg in this
  # file. It was not under-tested, it was UNTESTED, and the failure mode is
  # silent: a wrong swap on a little-endian host is a no-op that passes
  # everything.
  #
  # This leg found three latent defects on its way in, none of which any
  # existing leg could ever have seen: #112 (rocketnet_endian_fix byte-swapped
  # the POINTER), #125 (every parsed IPv4 address reversed), #127 (ntohs and
  # htons swapping unconditionally, corrupting every port and every IPv6
  # group). It went red on each and green after each.
  #
  # Deliberately: cross-compile with the s390x toolchain
  # at native compiler speed and run under qemu-user, on real s390x
  # instructions against real big-endian memory. Compiling inside an emulated
  # s390x container would put the whole sdk build under emulation and cost the
  # per-commit budget for nothing this does not already prove.
  #
  # The s390x libraries come from ports.ubuntu.com through dpkg multiarch: the
  # same archive, the same signing keys, the same apt as every other leg here.
  # No third-party image, no downloaded tarball, no new supply chain.
  #
  # WHAT THIS LEG DOES NOT COVER, said plainly. It COMPILES the whole library
  # and the whole test suite for s390x and then DOES NOT RUN bin/test -- the
  # compile is the gate on that binary, which is not nothing, because that is
  # literally how #112 first went red -- and it runs the byte-order surface
  # with NO SOCKETS instead: tools/bigendian's wire check, which drives the
  # endian helpers, the wire read/write, address parsing, the prefilter, a
  # sealed packet's construction and opening, base64 and
  # the config parses, all in memory.
  #
  # SINCE v1.1.2 IT ALSO RUNS, under qemu-user and still with no socket, the
  # unit cases that judge bytes (tools/bigendian/run_byte_cases.sh): every
  # case of the standard's byte vectors (tests/test_unit_standard_*.cpp and
  # the connect token vectors), so a field written in host order fails here
  # rather than only in the nightly guest, and every case of the XDP filter
  # compiled as host C for s390x (tests/xdp_host/ takes the target's byte
  # order from the s390x kernel headers), so a conversion in the XDP program
  # that swaps whatever the byte order is fails here. The XDP program itself
  # is compiled for bpfeb against the s390x headers, and the object the
  # library embeds must be big-endian (cmake/CheckXdpObjectByteOrder.cmake
  # fails the build otherwise). These went in after the XDP program's three
  # length fields were found swapped unconditionally on a big-endian host,
  # which no leg could see: the filter cases were built on little-endian
  # hosts only, and this leg embedded a little-endian object.
  #
  # SO THE BIG-ENDIAN ASSERTIONS THAT GATE ARE THE WIRE CHECK'S. The matching
  # #if ROCKETNET_BIG_ENDIAN block in rocketnet_test_endian is compiled out on
  # every leg that runs the suite and never executed on the leg that builds it
  # for s390x: it is there for the day a real big-endian machine runs the
  # suite (#129), and until that day it is dead code, which is a thing to know
  # rather than a thing to discover.
  #
  # It does not RUN the socket-crossing transport tests, because under
  # qemu-user those report on the emulator rather than on the platform: a
  # UDP_SEGMENT burst is delivered unsegmented (the gso rung's disconnect
  # burst arrives as one datagram and refuses to open) and the portable
  # rung's receive loop stalls outright. Passing those off as a big-endian
  # result would be worse than not running them. #129 owns the remainder --
  # the full suite on real big-endian hardware -- and until then this leg
  # gates exactly what it can actually prove.

  big-endian:
    name: big endian s390x / ${{ matrix.build_type }}
    # Any Linux fleet runner: the runner role provisions the s390x cross
    # toolchain, the s390x multiarch libraries and qemu-user on every host.
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: ${{ inputs.full && 7200 || 2 }}
    strategy:
      fail-fast: false
      matrix:
        # per commit Debug; Release (29-66s) in the nightly tier
        build_type: ${{ fromJSON(inputs.full && '["Debug","Release"]' || '["Debug"]') }}
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/ccache

      - name: Check the s390x cross toolchain, libraries, and qemu are present
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake xxd pkg-config readelf clang s390x-linux-gnu-gcc s390x-linux-gnu-g++; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          # qemu-user-static installs qemu-s390x-static; qemu-user (Ubuntu
          # 26.04, which has no qemu-user-static) installs qemu-s390x, itself
          # a static binary. Either runs the leg; the step after uses $QEMU_S390X.
          qemu=""
          for tool in qemu-s390x-static qemu-s390x; do
            if command -v "$tool" >/dev/null 2>&1; then qemu=$(command -v "$tool"); break; fi
          done
          if [ -z "$qemu" ]; then
            echo "TOOL-MISSING qemu-s390x-static or qemu-s390x (any) (missing; package qemu-user-static or qemu-user) on $RUNNER_NAME"
            missing=1
          else
            echo "QEMU_S390X=$qemu" >> "$GITHUB_ENV"
          fi
          for lib in libsodium libbpf libxdp; do
            if ! PKG_CONFIG_LIBDIR=/usr/lib/s390x-linux-gnu/pkgconfig:/usr/share/pkgconfig pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (s390x) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          if [ ! -e /usr/lib/s390x-linux-gnu/libstdc++.so.6 ]; then
            echo "TOOL-MISSING libstdc++ (s390x) (no /usr/lib/s390x-linux-gnu/libstdc++.so.6) on $RUNNER_NAME"
            missing=1
          fi
          exit "$missing"

      # CMAKE_SYSTEM_NAME=Linux keeps the linux branch of CMakeLists.txt --
      # this leg builds the same library the ubuntu leg does, xdp dataplane
      # and all, not a reduced one. pkg-config is pointed at the s390x
      # multiarch tree so libsodium resolves for the target, not the host.

      - name: Configure
        timeout-minutes: 2
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/s390x-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_SYSTEM_PROCESSOR=s390x
          -DCMAKE_C_COMPILER=s390x-linux-gnu-gcc
          -DCMAKE_CXX_COMPILER=s390x-linux-gnu-g++
          -DCMAKE_LIBRARY_ARCHITECTURE=s390x-linux-gnu
          -DCMAKE_FIND_ROOT_PATH=/usr/lib/s390x-linux-gnu
          -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH
          -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH
          -DCMAKE_EXE_LINKER_FLAGS="-L/usr/lib/s390x-linux-gnu -Wl,-rpath-link,/usr/lib/s390x-linux-gnu"
          -DCMAKE_SHARED_LINKER_FLAGS="-L/usr/lib/s390x-linux-gnu -Wl,-rpath-link,/usr/lib/s390x-linux-gnu"

      # the whole library AND the whole suite, compiled for big-endian: a
      # byte-order break that the compiler can see is caught right here,
      # which is exactly how #112 announced itself the first time this leg
      # ran (__builtin_bswap64 handed a pointer does not compile).

      - name: Build the library and the suite for s390x
        timeout-minutes: 5
        run: cmake --build build --target rocketnet test test_sodium --parallel 8

      # The real XDP program for bpfeb, against the s390x kernel headers, the
      # way a big-endian build embeds it: a header or macro that only one byte
      # order has fails to compile here. Its ELF byte order is then read by
      # the same script the build runs on the embedded object, and the
      # negative control proves that script refuses an object in the build
      # machine's byte order (what the bare bpf target produces here).

      - name: Compile the XDP program for big-endian BPF and check its byte order
        run: |
          set -euo pipefail
          clang -D__linux__ -D__BPF__ -ffreestanding -ffp-contract=off -O2 -g -I/usr/include/s390x-linux-gnu -Isdk \
            -target bpfeb -c sdk/xdp/server_xdp.c -o build/server_xdp_bpfeb.o
          cmake -DOBJECT=build/server_xdp_bpfeb.o -DHEADER=build/server_xdp_bpfeb.h -DBYTE_ORDER=BIG_ENDIAN \
            -P cmake/CheckXdpObjectByteOrder.cmake
          clang -D__linux__ -D__BPF__ -ffreestanding -ffp-contract=off -O2 -I/usr/include/x86_64-linux-gnu -Isdk \
            -target bpf -c sdk/xdp/server_xdp.c -o build/server_xdp_build_machine.o
          if cmake -DOBJECT=build/server_xdp_build_machine.o -DHEADER=build/server_xdp_build_machine.h \
            -DBYTE_ORDER=BIG_ENDIAN -P cmake/CheckXdpObjectByteOrder.cmake; then
            echo "check failed: the byte-order check accepted a little-endian object for a big-endian library"
            exit 1
          fi

      - name: Build the big-endian wire check
        timeout-minutes: 1
        run: |
          s390x-linux-gnu-g++ -std=c++11 -Wall -ffp-contract=off -Isdk \
            tools/bigendian/wire_check.cpp build/librocketnet.a \
            -L/usr/lib/s390x-linux-gnu -Wl,-rpath-link,/usr/lib/s390x-linux-gnu \
            -lbpf -lxdp -lpthread \
            -o bin/wire_check

      # A LEG THAT CANNOT PROVE ITS OWN PREMISE IS NOT A GATE. If this ever
      # silently built for the host, every check below would pass for the
      # wrong reason and the endian path would go back to being unexecuted
      # code. So the artifact is interrogated before it is run: s390x, big
      # endian, out of the ELF header itself.

      - name: Prove the binaries are big-endian s390x
        run: |
          set -euo pipefail
          for binary in bin/test bin/wire_check bin/test_sodium; do
            readelf -h "$binary" | grep -E "Class|Data|Machine"
            readelf -h "$binary" | grep -q "2's complement, big endian"
            readelf -h "$binary" | grep -qi "s/390"
          done
          # the XDP object the library embeds: built (the leg provides clang,
          # libbpf and libxdp, so XDP is never compiled out here) and big-endian
          readelf -h build/generated/server_xdp.o | grep -E "Data|Machine"
          readelf -h build/generated/server_xdp.o | grep -q "2's complement, big endian"

      # QEMU_LD_PREFIX=/ points the emulated loader at the host filesystem,
      # where the multiarch tree already holds every s390x library these
      # binaries need; LD_LIBRARY_PATH adds the cross toolchain's own
      # libstdc++, which lives beside the compiler rather than in the
      # multiarch tree.

      - name: Start combined unit and functional timing
        run: *start_unit_functional_timing

      - name: Run the big-endian wire check
        env:
          QEMU_LD_PREFIX: /
          LD_LIBRARY_PATH: /usr/lib/s390x-linux-gnu:/usr/s390x-linux-gnu/lib
        run: |
          "$QEMU_S390X" ./bin/wire_check
          "$QEMU_S390X" ./bin/test_sodium

      # the standard's byte vectors and the XDP filter cases, one process per
      # case; a case named in their sources but not built fails the step
      - name: Run the byte vectors and the XDP filter cases on big-endian
        env:
          QEMU_LD_PREFIX: /
          LD_LIBRARY_PATH: /usr/lib/s390x-linux-gnu:/usr/s390x-linux-gnu/lib
        run: tools/bigendian/run_byte_cases.sh bin/test "$QEMU_S390X"

      - name: Enforce combined unit and functional timing
        env:
          CI_TIMING_ROW: ${{ format('{0}/{1}/{2}', runner.os, github.job, matrix.build_type) }}
        run: *enforce_unit_functional_timing

      - if: always()
        uses: ./.github/actions/ccache-stats

  # The standard in standard/ (RN-1, RN-2, RN-R). The checker reads each document as a DOCUMENT -- its
  # published tables, parsed as markdown, with no reference to the source tree
  # -- and compares every pinned row against the same constants as the
  # compiler expands them. A row deleted from the document fails as loudly as
  # a value that disagrees, because deleting the row would otherwise be the
  # cheapest way to pass.
  #
  # A failure means the document and the code disagree. Decide which is wrong
  # and fix that one. A specification nothing verifies drifts, and a drifted
  # spec is worse than none, because independent implementations are built on
  # it.

  # THE THREAD SANITIZER LEG. Everything else in this file is a single-threaded
  # story or leaves the threads to luck; this is the only leg that watches the
  # transport's concurrency directly. rocketnet spawns real threads -- the
  # client transport's receive thread behind an atomic-quit and a mutex, the
  # server's GSO worker threads on the linux gso rung, and the suite's own
  # multi-client hammer tests that pound a transport from several threads at
  # once -- and a data race in any of those is invisible to asan, ubsan and
  # inspection alike. tsan is the instrument that sees a race the run did not
  # happen to lose, so a race becomes a red on a commit rather than a heisenbug
  # in a soak months later.
  #
  # WHAT CARRIES THE THREADS, and what does not. bin/test is the unit suite
  # and starts no driver. bin/functional is the surface that used to live in
  # that run: on this linux runner the ladder falls to the gso rung (xdp
  # refused for privilege, gso granted), so the server's GSO worker threads
  # run, the client receive thread runs, and the hammer tests drive the
  # concurrent path on purpose. bin/soak adds the real-UDP loopback -- a
  # client and a server transport, each with its receive thread and its
  # socket, exchanging over the loopback -- bounded so the leg ends.
  # soak_sim is DELIBERATELY NOT here: it drives the protocol layer in memory
  # with no threads and no sockets, so under tsan it is a single-threaded
  # program with no race surface at all, and a leg that cannot find the thing
  # it names is decoration. The threaded soak is bin/soak.
  #
  # A REAL FINDING STOPS THE WORLD. halt_on_error=1 ends the run on the first
  # race, and there is NO suppressions file -- a blanket suppression is how a
  # race leg goes green while the race stays. If tsan reddens this leg, the
  # finding is the work: read it, and fix the race or prove it benign one
  # named site at a time. Do not add a suppression to get back to green.
  #
  # Both C and C++ flags are set (soak.c is C) so every translation unit that
  # touches shared state is instrumented; an uninstrumented unit is where tsan
  # goes quietly blind.

  # SPLIT INTO TWO PARALLEL LEGS (2026-09-13), not shortened. Measured on run
  # 34759562592 the single job was 149s: 30s to install, configure and build,
  # then 46s for the suite, 49s for the bounded loopback soak and 18s for the
  # lifecycle harness -- three sequential runs of the same instrument over
  # different surfaces, on one runner, for no reason but that they had always
  # been steps in one job. Split, each leg pays the 30s build once in parallel
  # and lands near 76s and 97s, so tsan stops being a per-commit wall. NOTHING
  # WAS DROPPED OR SHORTENED: the same three runs, the same halt_on_error, the
  # same ./bin/soak 20000 count, still per commit, still no suppressions file.
  # Each leg builds only the targets it runs, which is also why the second
  # build is not the full 16s.
  #
  # THE THREADED-TRANSPORT LEG MOVED TO nightly.yml (2026-10-22), unchanged:
  # the unit and functional suites under tsan, halt_on_error=1, no
  # suppressions. On the fleet's 16-core runner hosts it measured 345-454s
  # against this file's 3-minute law, and its live message matrix case (a
  # 50s tsan wall-clock bound, 35s alone) failed on the machine, not the
  # code, when the suite ran beside it. Per commit, tsan runs the loopback
  # soak and the lifecycle harness below; each night it runs the threaded
  # transports.

  tsan:
    name: tsan (${{ matrix.leg }})
    runs-on: [self-hosted, Linux, X64, fleet]   # was ubuntu-24.04, then one host's rocketnet label; the fleet's org runners (see build-and-test's note)
    timeout-minutes: ${{ inputs.full && 7200 || 2 }}
    strategy:
      fail-fast: false
      matrix:
        leg: [loopback soak]
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/ccache

      - name: Check the fleet's build dependencies are present
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      # setarch -R runs each tsan binary with address-space randomisation off FOR THAT PROCESS ONLY (no sysctl,
      # no root). gcc 13's tsan runtime (Ubuntu 24.04: the Linux x64 gcc 13 org runners) cannot map its shadow under the
      # kernel's default vm.mmap_rnd_bits=32 and dies "FATAL: ThreadSanitizer: unexpected memory mapping" before
      # main (measured on two Linux x64 gcc 13 hosts, 2026-10-13; the same binary passes under setarch -R). Hosted
      # images lower the sysctl instead; this works on both and changes nothing tsan observes.
      #
      # -O1, as the ThreadSanitizer documentation recommends. At -O0 a struct assignment
      # lowers to a memcpy, and tsan does not report a memcpy write that follows an
      # unordered plain read. With the packet lease's fields plain, its race in retired()
      # (test_lifecycle check_packet_lease_retired_race) is reported in every run at -O1
      # and in none at -O0 (measured 2026-10-31).

      - name: Configure
        timeout-minutes: 2
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -O1"
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -O1"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build the soak and the lifecycle harness
        timeout-minutes: 1
        if: matrix.leg == 'loopback soak'
        run: cmake --build build --target soak test_lifecycle --parallel 8

      - name: Start combined unit and functional timing
        if: matrix.leg == 'loopback soak'
        run: *start_unit_functional_timing

      - name: Run the bounded loopback soak under tsan (real transport threads)
        if: matrix.leg == 'loopback soak'
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: setarch "$(uname -m)" -R ./bin/soak 20000

      - name: "Functional binary under tsan: lifecycle"
        if: matrix.leg == 'loopback soak'
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: setarch "$(uname -m)" -R ./bin/test_lifecycle

      - name: Enforce combined unit and functional timing
        env:
          CI_TIMING_ROW: ${{ format('{0}/{1}/{2}', runner.os, github.job, matrix.leg) }}
        run: *enforce_unit_functional_timing

      - if: always()
        uses: ./.github/actions/ccache-stats

  # THE PINNED-SODIUM LEG.
  # Explicit system-sodium integration mode against a content-verified
  # 1.0.20 reference. Ordinary jobs use the pinned two-file vendor. Keeping
  # this older backend checks interoperability across supported deployments.
  sodium-pinned:
    name: pinned libsodium (built from source)
    # nightly tier
    if: inputs.full
    # Any Linux fleet runner: the cached prefix is built against the host's
    # glibc, so its key names the host's distribution, release, machine and
    # C library (the instruction gate's host key), and a prefix built on one
    # distro is never restored on another.
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 7200
    env:
      SODIUM_VERSION: "1.0.20"
      SODIUM_SHA256: "ebb65ef6ca439333c2bb41a0c1990587288da07f6c7fd07cb3a18cc18d30ce19"
      # a user-writable prefix: make install needs no sudo, and the cache save
      # reads a tree the runner user owns.
      SODIUM_PREFIX: ${{ github.workspace }}/sodium-pin
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/ccache

      - name: Check the fleet's build dependencies are present
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Read the host the prefix is built for
        id: host
        run: |
          set -euo pipefail
          . /etc/os-release
          libc="$(getconf GNU_LIBC_VERSION | tr ' ' '-')"
          host="${ID}-${VERSION_ID}-$(uname -m)-${libc}"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "pinned libsodium prefix for host $host on $RUNNER_NAME"

      - name: Restore the pinned sodium prefix
        id: sodium-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ env.SODIUM_PREFIX }}
          key: sodium-pin-${{ env.SODIUM_VERSION }}-${{ runner.os }}-${{ steps.host.outputs.host }}

      - name: Build the pinned libsodium from source (content-verified)
        timeout-minutes: 4
        if: steps.sodium-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/jedisct1/libsodium/releases/download/${SODIUM_VERSION}-RELEASE/libsodium-${SODIUM_VERSION}.tar.gz"
          curl -fsSL -o sodium.tar.gz "$url"
          echo "${SODIUM_SHA256}  sodium.tar.gz" | sha256sum -c -
          mkdir sodium-src
          tar xzf sodium.tar.gz -C sodium-src --strip-components=1
          cd sodium-src
          ./configure --prefix="${SODIUM_PREFIX}" --disable-dependency-tracking
          make -j"$(nproc)"
          make install

      # PROVE THE PREMISE: pkg-config, restricted to the pinned prefix, must
      # report exactly the pinned version. If it does not, the leg is finding
      # the wrong sodium and every check below would pass for the wrong reason.
      - name: Prove pkg-config resolves the pin
        env:
          PKG_CONFIG_LIBDIR: ${{ env.SODIUM_PREFIX }}/lib/pkgconfig
        run: |
          set -euo pipefail
          resolved="$(pkg-config --modversion libsodium)"
          echo "pkg-config resolves libsodium ${resolved} (pin is ${SODIUM_VERSION})"
          [ "$resolved" = "$SODIUM_VERSION" ]

      - name: Configure against the pinned sodium
        timeout-minutes: 1
        env:
          PKG_CONFIG_LIBDIR: ${{ env.SODIUM_PREFIX }}/lib/pkgconfig
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DROCKETNET_USE_SYSTEM_SODIUM=ON

      - name: Build the suite
        timeout-minutes: 2
        run: cmake --build build --target test --parallel 8

      - name: Start combined unit and functional timing
        run: *start_unit_functional_timing

      - name: Save the registered unit cases
        env:
          ROCKETNET_TEST_NIGHTLY: ${{ inputs.full && '1' || '0' }}
        run: mkdir -p unit-cases && LD_LIBRARY_PATH="${SODIUM_PREFIX}/lib" ./bin/test --list > "unit-cases/Linux-sodium-pinned.txt"

      - name: Upload the registered unit cases
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: unit-cases-Linux-sodium-pinned
          path: unit-cases/
          if-no-files-found: error

      - name: Run tests (auto ladder) against the pinned sodium
        env:
          ROCKETNET_TEST_NIGHTLY: ${{ inputs.full && '1' || '0' }}
        run: LD_LIBRARY_PATH="${SODIUM_PREFIX}/lib" ./bin/test

      - name: Vendor parity against the pinned backend
        run: |
          cmake --build build --target rocketnet_sodium_oracle --parallel 8
          python3 tools/check_sodium.py bin/librocketnet_sodium_oracle.so --reference "${SODIUM_PREFIX}/lib/libsodium.so"

      - name: Enforce combined unit and functional timing
        env:
          CI_TIMING_ROW: ${{ format('{0}/{1}', runner.os, github.job) }}
        run: *enforce_unit_functional_timing

      - if: always()
        uses: ./.github/actions/ccache-stats

  # THE SUPPORTED UBUNTU LTS RELEASES. Ubuntu 22.04 LTS and 24.04 LTS stay
  # supported (owner, 2026-11-09: "we still need to support Ubuntu 22.04
  # LTS"), and the fleet's runners are Ubuntu 26.04, so each older release is
  # built and tested in a rootless podman container of that release on a
  # fleet runner. scripts/distro-container-build installs the packages
  # docs/BUILDING.md names for the release, checks the AF_XDP provider the
  # configure picked (22.04: the legacy libbpf 0.5 path; 24.04: libxdp 1.4),
  # builds the tree, and runs the unit suite, test_xdp_compat on 22.04 and
  # tools/check_package.py. Nightly tier: the package install and a cold
  # build of the tree do not fit two minutes. The container shares the
  # host's kernel, so this qualifies the toolchain and userspace libraries,
  # not the 5.15 or 6.8 kernels (docs/DEPLOYING.md).
  distro-container:
    name: ubuntu ${{ matrix.release }} / container build and unit suite
    if: inputs.full
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      matrix:
        release: ['22.04', '24.04']
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Check a container runtime is present
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null 2>&1; then
            echo "TOOL-MISSING podman (any) (missing; package podman, with uidmap and a subuid/subgid range for $(id -un)) on $RUNNER_NAME"
            exit 1
          fi
          podman --version

      - name: Build and test in an Ubuntu ${{ matrix.release }} container
        run: >
          podman run --rm --network host
          --volume "$PWD:/src" --workdir /src
          docker.io/library/ubuntu:${{ matrix.release }}
          scripts/distro-container-build ${{ matrix.release }}

  # THE PLATFORM SELFTESTS, lifted out of build-and-test (2026-09-13).
  #
  # Both checks below used to be steps on all FOUR build-and-test rows --
  # ubuntu and macos, Debug and Release -- and together they were the largest
  # single cost in that matrix. Measured on run 34759562592:
  #
  #   ubuntu-24.04 / Debug     164s total, of which 49s soak_sim selftest + 23s bench selftest
  #   macos-15     / Debug     150s total, of which 48s soak_sim selftest + 29s bench selftest
  #   ubuntu-24.04 / Release   153s total, of which 10s soak_sim selftest + 24s bench selftest
  #   macos-15     / Release    87s total, of which  ~8s soak_sim selftest + ~22s bench selftest
  #
  # THE CUT IS THE DUPLICATION, NOT THE CHECK. Neither of these two is a
  # build-type story, so the Debug row and the Release row were running the
  # same assertions twice per OS:
  #
  #   benchmarks/selftest.sh drives `make -C bench`, which has its OWN Makefile and
  #   its own flags and never reads CMAKE_BUILD_TYPE -- so the Debug row and
  #   the Release row compiled and drove BIT-IDENTICAL harness binaries. That
  #   half was a literal duplicate.
  #
  #   scripts/soak-sim-selftest asserts the INSTRUMENTS: determinism at a
  #   pinned seed, the audit against its corruption control, the profile
  #   against its double-charge control. Those are properties of the
  #   simulator's accounting, not of the optimizer, and the script's own
  #   header tells the operator to "run make first" -- i.e. the Release
  #   build is the spelling it is written against. Running it a second time at
  #   -O0 asserted nothing the Release run had not, at five times the cost
  #   (49s vs 10s on ubuntu).
  #
  # So the per-OS pair runs ONCE, here, per commit, on the Release build --
  # every check kept, none moved to a nightly, none weakened. It is a separate
  # job rather than an `if: matrix.build_type == 'Release'` on the existing
  # rows because the ubuntu Release row was itself at 153s: pinning would have
  # left it there, and a parallel job takes the work off the critical path
  # instead of moving it along it.
  #
  # It keeps both OSes, because the two legs cover different harnesses: the
  # linux leg covers bench_gso (whose pps=0-on-a-GSO-less-host case is what
  # #98 item 5 filed) and bench_uring_system; the macOS leg covers the darwin
  # trio. benchmarks/selftest.sh reports a harness this host cannot build as
  # SKIPPED with the reason and fails if a BUILT harness got neither a leg nor
  # a skip, so dropping an OS here would silently drop its harnesses.

  platform-selftests:
    name: platform selftests / ${{ matrix.os }}
    # nightly tier: the soak and bench harness selftests are tool checks, not
    # the commit's code under test
    if: inputs.full
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      matrix:
        include:
          # the Linux platform selftest runs on the fleet bench; a host that
          # cannot build a harness reports it as SKIPPED and fails a built one
          - { os: linux, runner: '["self-hosted","Linux","X64","fleet"]' }
          - { os: macos, runner: '["self-hosted","macOS","ARM64","fleet"]' }
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/ccache

      - name: Check the fleet's build dependencies are present
        run: |
          set -euo pipefail
          missing=0
          if [ "$RUNNER_OS" = "macOS" ]; then
            # darwin has no libbpf, libxdp or liburing; libsodium is the independent parity reference check_sodium.py loads
            for tool in cmake clang c++ xxd python3; do
              if ! command -v "$tool" >/dev/null 2>&1; then
                echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
                missing=1
              fi
            done
            if ! python3 -c "import ctypes.util, sys; sys.exit(0 if ctypes.util.find_library('sodium') else 1)"; then
              echo "TOOL-MISSING libsodium (any) (ctypes.util.find_library failed) on $RUNNER_NAME"
              missing=1
            fi
            exit "$missing"
          fi
          for tool in cmake gcc g++ clang xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      # only soak_sim, not the whole tree: build-and-test already compiles
      # everything on both these OSes in both configurations, so a second full
      # build here would buy nothing and cost the budget this job exists to
      # protect. Release, because that is the build the selftest is written
      # against.

      - name: Build soak_sim and soak (Release)
        timeout-minutes: 2
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target soak_sim soak --parallel 8

      # soak_sim's instruments, each driven against its own negative control
      # (#99). The audit legs corrupt the simulator's index on purpose and
      # fail unless the audit aborts -- and prove, in the leg beside them,
      # that the same corruption is SILENT without it. The profile legs
      # double-charge the accounting on purpose and fail unless the profile
      # refuses to print shares.

      - name: soak_sim instrument selftest
        run: bash scripts/soak-sim-selftest

      # soak's command line and end-of-run summary: every argument refusal
      # exits 2 without a run, a --seconds 3 run ends inside 3..15 s with
      # every summary line, the positional iteration count keeps its meaning,
      # and a planted verify failure (ROCKETNET_SOAK_FAULT_VERIFY=1) goes red.
      # About 8 s of wall time.

      - name: soak argument and summary selftest
        run: bash scripts/soak-args-selftest

      # scripts/soak-per-transport's verdicts on logs it did not run (the
      # nightly gso red of 2026-11-12, cut and edited): a failure a stall can
      # cause on a stalled run is UNMEASURED with the watch's annotation; a
      # refusal with no stall, a verify or conservation failure, or a mixed
      # run stays red. Under a second, no build.

      - name: soak per transport verdict selftest
        run: bash scripts/soak-per-transport-selftest

      # scripts/vm-boot-guard on fake guests: a guest that never writes its
      # started marker is killed at a 2 s deadline with its whole process
      # group and booted again, three attempts, then fails by name; a guest
      # that writes it and runs past the deadline is never cut short; on
      # Linux, transport-cells-repeat's xdp cell under
      # ROCKETNET_NIGHTLY_NO_TIMEOUT=1 fails a never-booting guest's run by
      # name instead of waiting. About 50 s on Linux (2026-11-12, hetzner1).

      - name: VM boot deadline selftest
        run: bash scripts/vm-boot-guard-selftest

      # the bench harnesses' failure states (#98). Building them here is the
      # only place benchmarks/ is compiled by CI at all, which alone catches the
      # platform-only files rotting; the selftest then FORCES each abort path
      # -- a receive refused for a reason that is not an empty queue, a
      # persistently refused send, a full io_uring submission queue -- and
      # fails unless the harness goes red naming the call. Neither leg
      # measures anything: no number from a CI runner is ever published.

      - name: Build the bench harnesses (Linux)
        timeout-minutes: 1
        if: runner.os == 'Linux'
        run: make -C benchmarks bench_portable bench_gso bench_uring_system

      - name: Build the bench harnesses (macOS)
        timeout-minutes: 1
        if: runner.os == 'macOS'
        run: make -C benchmarks darwin

      - name: Bench harness failure-state selftest
        run: bash benchmarks/selftest.sh

      - name: Benchmark campaign result gate
        run: python3 benchmarks/test_campaign.py

      - if: always()
        uses: ./.github/actions/ccache-stats

  # THE INSTRUCTION COUNT GATE.
  # benchmarks/instruction_baseline.json names the gcc and valgrind it was
  # measured with, and counts are only comparable under exactly those. The job
  # never takes either from the host: tools/build_pinned_toolchain.sh builds
  # both from checksum-verified release source into ./pinned-toolchain, the
  # prefix is cached keyed by the two pins, the host OS and C library, and the
  # script itself, and the measurement runs with explicit paths into it. The
  # prefix's toolchain-id must equal the baseline's, so a host or distro gcc
  # reporting the same version is never compared. A
  # cold cache builds gcc (C and C++ only, one stage) and valgrind; a warm
  # cache restores the prefix and builds nothing.
  instruction-gate:
    name: instruction count gate
    # Any fleet runner: cachegrind counts instructions, not time, so the gate
    # needs a host the pinned toolchain's cache key names, not a quiet one.
    # Every Linux fleet runner is ubuntu-26.04 x86_64 glibc-2.43, and the
    # nightly on main saves that key. A host the key does not name misses,
    # and the per-commit tier refuses the cold cache by name.
    runs-on: [self-hosted, Linux, X64, fleet]
    # Per commit the gate restores the pinned toolchain and never builds it
    # (396s cold); the nightly tier builds it on a miss and saves it from
    # main, where every branch and pull request can restore it.
    timeout-minutes: ${{ inputs.full && 7200 || 2 }}
    steps:

      # the whole commit graph without trees or blobs past HEAD: the gate
      # refuses a baseline whose recorded commit is not an ancestor of HEAD
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Check the fleet's build dependencies are present
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake cc c++ make m4 curl tar xz bzip2 sha256sum sha512sum xxd pkg-config python3; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Read the pinned toolchain from the baseline
        id: pins
        run: |
          set -euo pipefail
          read -r gcc_version valgrind_version < <(python3 -c '
          import json
          b = json.load(open("benchmarks/instruction_baseline.json"))
          c, v = b["compiler_id"], b["valgrind_version"]
          assert c.startswith("GNU-") and v.startswith("valgrind-"), (c, v)
          print(c[len("GNU-"):], v[len("valgrind-"):])
          ')
          . /etc/os-release
          libc="$(getconf GNU_LIBC_VERSION | tr ' ' '-')"
          host="${ID}-${VERSION_ID}-$(uname -m)-${libc}"
          echo "gcc=$gcc_version" >> "$GITHUB_OUTPUT"
          echo "valgrind=$valgrind_version" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "pinned gcc $gcc_version, valgrind $valgrind_version, host $host on $RUNNER_NAME"

      - name: Restore the pinned toolchain
        id: toolchain-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: pinned-toolchain
          key: instruction-toolchain-gcc-${{ steps.pins.outputs.gcc }}-valgrind-${{ steps.pins.outputs.valgrind }}-${{ steps.pins.outputs.host }}-${{ hashFiles('tools/build_pinned_toolchain.sh') }}

      - name: Refuse a cold toolchain cache in the per-commit tier
        if: ${{ !inputs.full && steps.toolchain-cache.outputs.cache-hit != 'true' }}
        run: |
          echo "INSTRUCTION-TOOLCHAIN-COLD key=${{ steps.toolchain-cache.outputs.cache-primary-key }}"
          echo "The per-commit tier never builds the pinned toolchain. The nightly tier"
          echo "(nightly-ci.yml) builds and saves it on main; after a pin change lands,"
          echo "warm it now with: gh workflow run nightly-ci.yml --ref main"
          exit 1

      - name: Build the pinned toolchain from source (content-verified)
        if: inputs.full && steps.toolchain-cache.outputs.cache-hit != 'true'
        run: bash tools/build_pinned_toolchain.sh "$GITHUB_WORKSPACE/pinned-toolchain" "${{ steps.pins.outputs.gcc }}" "${{ steps.pins.outputs.valgrind }}"

      # saved as soon as it is built, so a red gate below never costs the next
      # run a rebuild
      - name: Save the pinned toolchain
        if: inputs.full && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: pinned-toolchain
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      # PROVE THE PREMISE: the prefix holds exactly the pins, or every number
      # below is measured with the wrong tools.
      - name: Prove the prefix holds the pins
        env:
          VALGRIND_LIB: ${{ github.workspace }}/pinned-toolchain/libexec/valgrind
        run: |
          set -euo pipefail
          tc="$GITHUB_WORKSPACE/pinned-toolchain"
          gcc_resolved="$("$tc/bin/g++" -dumpfullversion)"
          valgrind_resolved="$("$tc/bin/valgrind" --version)"
          echo "prefix holds gcc ${gcc_resolved} and ${valgrind_resolved}, toolchain-id $(cat "$tc/toolchain-id") (pins are ${{ steps.pins.outputs.gcc }} and valgrind-${{ steps.pins.outputs.valgrind }})"
          [ "$gcc_resolved" = "${{ steps.pins.outputs.gcc }}" ]
          [ "$valgrind_resolved" = "valgrind-${{ steps.pins.outputs.valgrind }}" ]

      - name: Test the instruction-count checker
        run: python3 tools/test_check_instructions.py

      # the pinned gcc's own libstdc++ by rpath, and the pinned valgrind's
      # cachegrind.h ahead of any the host carries
      - name: Build instruction_count (Release) with the pinned gcc
        timeout-minutes: 2
        run: |
          set -euo pipefail
          tc="$GITHUB_WORKSPACE/pinned-toolchain"
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$tc/bin/gcc" \
            -DCMAKE_CXX_COMPILER="$tc/bin/g++" \
            -DCMAKE_C_FLAGS="-I$tc/include" \
            -DCMAKE_CXX_FLAGS="-I$tc/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath,$tc/lib64"
          cmake --build build --target instruction_count --parallel 8

      - name: Run the cachegrind instruction gate with the pinned valgrind
        run: |
          set -euo pipefail
          status=0
          output="$(python3 tools/check_instructions.py --bin ./build/instruction_count --toolchain "$GITHUB_WORKSPACE/pinned-toolchain")" || status=$?
          printf '%s\n' "$output"
          [ "$status" -eq 0 ] || exit "$status"
          # the regions were isolated by cachegrind's client requests, as the
          # baseline was; the setup-subtraction fallback measures differently
          grep -qx 'isolation mode=client_requests' <<<"$output"

  # THE LINT JOB: every per-commit check that reads files and builds nothing
  # (or one small compile), in one job on one runner, so the per-commit tier
  # stays within the runners that can pick it up at once. Each check keeps its
  # own step and its own verdict.
  #
  #   workflows    every runs-on selects the fleet, every main commit gets its
  #                own concurrency group, and every per-commit job is bounded
  #                to two minutes (tools/check_ci_budget.py)
  #   formatting   clang-format 18 over every tracked C and C++ source
  #   standard     standard conformance and the witness ledger
  #   source       client/server words, no owned linked lists
  #   tools        the validation tools' own self-test suites
  lint:
    name: lint (workflows, format, standard, tool selftests)
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: ${{ inputs.full && 7200 || 2 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/ccache
        with:
          persist-credentials: false

      # Owner, 2026-10-18: "all CI should run on our fleet, not github." Refuses a GitHub-hosted runs-on label.
      # Each check below runs and reports whatever an earlier one did: GitHub
      # skips the rest of a job after a red step unless a step says otherwise,
      # and on 85 main commits one red format step hid 17 checks (VERIFY-3
      # A-11). This check holds every step of this job to that.
      - name: Every lint check runs on its own verdict
        if: ${{ !cancelled() }}
        run: python3 tools/check_independent_steps.py --self-test && python3 tools/check_independent_steps.py

      # The three workflow checkers below read workflows as lines; this holds
      # every workflow to the one shape they read (bare keys, two-space job
      # ids, four-space properties, block-form concurrency), so a spelling
      # GitHub accepts cannot carry a hosted runner, an unbounded job or a
      # shared main group past them (VERIFY-3 A-1).
      - name: Every workflow is in the shape the workflow checkers read
        if: ${{ !cancelled() }}
        run: python3 tools/check_workflow_shape.py --self-test && python3 tools/check_workflow_shape.py
      - name: Every runs-on selects the fleet
        if: ${{ !cancelled() }}
        run: sh .github/scripts/check-runs-on.sh --self-test && sh .github/scripts/check-runs-on.sh
      - name: Every main commit gets its own concurrency group
        if: ${{ !cancelled() }}
        run: sh .github/scripts/check-main-concurrency.sh --self-test && sh .github/scripts/check-main-concurrency.sh
      # release-check.yml's unreleased-wire-changes job runs git log over
      # tools/wire_paths.txt; a path that is gone would leave the gate silently.
      # --self-test plants a gone, an untracked, a doubled and a spaced path.
      - name: Every wire path is a tracked file
        if: ${{ !cancelled() }}
        run: |
          python3 tools/check_wire_paths.py --self-test
          python3 tools/check_wire_paths.py

      - name: Every LeakSanitizer suppression names a live function
        if: ${{ !cancelled() }}
        run: |
          python3 tools/check_lsan_supp.py --self-test
          python3 tools/check_lsan_supp.py

      # Every job a push or pull request runs is bounded to two minutes
      # (timeout-minutes: 2, or ${{ inputs.full && N || 2 }} in this file), so
      # a per-commit job that overruns fails instead of slowing the gate.
      # --self-test plants unbounded, over-budget and nightly-only jobs.
      - name: Every per-commit job is bounded to two minutes
        if: ${{ !cancelled() }}
        run: |
          python3 tools/check_ci_budget.py --self-test
          python3 tools/check_ci_budget.py

      # every tracked C and C++ source outside the vendored trees and generated
      # files must match .clang-format under clang-format 18 (tools/format/
      # check_format.sh); one unformatted file fails the job, `make format-check`
      # runs the same check locally
      - name: Check clang-format 18 is present
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if ! command -v clang-format-18 >/dev/null 2>&1; then echo "TOOL-MISSING clang-format-18 (missing) on $RUNNER_NAME"; exit 1; fi
          clang-format-18 --version
      - name: Test the format checker
        if: ${{ !cancelled() }}
        run: sh tools/format/test_check_format.sh
      - name: Every source is formatted
        if: ${{ !cancelled() }}
        run: sh tools/format/check_format.sh

      # tools/check_or_true.py: no `|| true` / `|| :` discards a status in
      # workflows, .github/scripts, scripts/ or tools/**/*.sh outside
      # tools/or_true_allowlist.txt (file, exact line, reason; a stale entry
      # is red). --self-test plants each spelling and the empty tree.
      - name: No or-true discards a status in CI shell code
        if: ${{ !cancelled() }}
        run: |
          python3 tools/check_or_true.py --self-test
          python3 tools/check_or_true.py

      # tools/check_continue_on_error.py: a job or step that continues on
      # error concludes success whatever it did; none outside
      # tools/continue_on_error_allowlist.txt (empty). --self-test plants a
      # step, a job, a composite action and the empty tree.
      - name: No continue-on-error hides a result
        if: ${{ !cancelled() }}
        run: |
          python3 tools/check_continue_on_error.py --self-test
          python3 tools/check_continue_on_error.py

      # tools/check_run_shell.py: every run step's shell stops on its first
      # failure (bash -euo pipefail, the workflow default; Git Bash with set
      # -euo pipefail on Windows; pwsh one command or $LASTEXITCODE checked
      # after each), and no `local|export x=$(...)` masks a status.
      # --self-test plants each shell, a mask and the empty tree.
      - name: Every run step stops on its first failure
        if: ${{ !cancelled() }}
        run: |
          python3 tools/check_run_shell.py --self-test
          python3 tools/check_run_shell.py

      # tools/check_scheduled_watched.py: the workflows with a cron equal the
      # nightly watch's --list (the watch itself excepted). Its --remote mode
      # (registered workflows against main, through the API) is not run
      # here; --self-test covers both modes on fixtures.
      - name: Every scheduled workflow is in the nightly watch's list
        if: ${{ !cancelled() }}
        run: |
          python3 tools/check_scheduled_watched.py --self-test
          python3 tools/check_scheduled_watched.py

      # tools/check_printed_compared.py: a step that prints trace=, hash= or
      # sha256= (or runs dst --seeds) writes it against a committed value,
      # or sits in a report-only job, or is in
      # tools/printed_values_allowlist.txt with a reason.
      - name: Every printed trace or hash is compared
        if: ${{ !cancelled() }}
        run: |
          python3 tools/check_printed_compared.py --self-test
          python3 tools/check_printed_compared.py

      # The self-tests of the checkers that have no step of their own
      # (tools/checkers.txt names this step for each). Fixtures and fakes
      # only: no build, no network; each plants its checker's violation and
      # its empty input. One line per suite; the suites run in parallel, each
      # into its own log, and a red one is named with its whole log. An empty
      # list is red.
      - name: Self-tests of the registered checkers
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/checker-selftests.txt"
          cat > "$list" <<'SUITES'
          python3 tools/test_check_dll_consumer.py -v
          python3 tools/test_check_driver_extension.py -v
          python3 tools/test_check_examples.py -v
          python3 tools/test_check_fuzz_oracle.py -v
          python3 tools/test_check_header_exports.py -v
          bash tools/test_check_memlock.sh
          python3 tools/test_check_memory.py -v
          bash tools/test_check_oss_fuzz_fp_contract.sh
          bash tools/test_run_xdp_filter_guest.sh
          python3 tools/test_check_package.py -v
          python3 tools/test_check_platform_policy.py -v
          python3 tools/test_check_public_header.py -v
          python3 tools/test_check_release_doc.py -v
          python3 tools/test_check_sdk_sources.py -v
          python3 tools/test_check_sodium.py -v
          python3 tools/test_check_test_scaffolding_boundary.py -v
          python3 tools/test_check_tla_ledger_merge.py -v
          python3 tools/test_check_transport_matrix.py -v
          python3 tools/test_check_xdp_archive.py -v
          python3 tools/test_check_xdp_guard_control.py -v
          python3 tools/test_run_backend_examples.py -v
          python3 tools/test_run_examples.py -v
          bash scripts/lan-proof-selftest
          SUITES
          logs="$RUNNER_TEMP/checker-selftests"
          mkdir -p "$logs"
          pids=()
          suites=()
          while IFS= read -r suite; do
            [ -n "$suite" ] || continue
            bash -c "$suite" > "$logs/${#suites[@]}.log" 2>&1 &
            pids+=("$!")
            suites+=("$suite")
          done < "$list"
          if [ "${#suites[@]}" -eq 0 ]; then echo "0 checker self-tests listed: nothing was run"; exit 1; fi
          failed=0
          for i in "${!pids[@]}"; do
            if wait "${pids[$i]}"; then
              echo "ok: ${suites[$i]}"
            else
              status=$?
              failed=$((failed + 1))
              echo "::group::FAIL (exit $status): ${suites[$i]}"
              cat "$logs/$i.log"
              echo "::endgroup::"
            fi
          done
          echo "checker self-tests: ${#suites[@]} run, $failed failed"
          [ "$failed" -eq 0 ]

      # tools/check_checkers.py: every tools/check_*, tools/run_*,
      # .github/scripts/*.sh and scripts/*-selftest has a row in
      # tools/checkers.txt whose self-test this or another workflow step
      # runs, and whose zero-input command (an empty directory or file) is
      # red. --self-test plants an unregistered checker, an unwired
      # self-test, a passing, unrunnable and crashing zero-input command.
      - name: Every checker is registered, its self-test runs, zero inputs are red
        if: ${{ !cancelled() }}
        run: |
          python3 tools/check_checkers.py --self-test
          python3 tools/check_checkers.py

      # The standard in standard/ (RN-1, RN-2, RN-R): its outline against
      # standard/STYLE.md, every pinned constant against the compiler, every
      # vector against its RN_STANDARD_VECTOR twin, the Appendix A indexes,
      # the cross-references and the normative language. Pending sections are
      # listed, not failed. One compile; well under ten seconds.
      - name: Verify the RocketNet standard against the implementation
        if: ${{ !cancelled() }}
        run: |
          python3 tools/conformance/test_check_rn_standard.py
          python3 tools/conformance/check_rn_standard.py

      # The witness ledger (docs/WITNESSES.tsv): each row's section, rule
      # text, code function and test still resolve, a unit witness is a
      # registered unit case, and the rows equal docs/WITNESSES.floor.tsv, so
      # a deleted or downgraded row is a deliberate two-file change. It does
      # not check that every MUST of the standard has a row. Its own unit
      # tests run first, then the ledger itself.
      - name: Verify the witness ledger against the standard and the tests
        if: ${{ !cancelled() }}
        run: |
          python3 tools/conformance/test_check_witnesses.py
          python3 tools/conformance/check_witnesses.py

      # tools/check_client_server_words.py exits 1 when a tracked file's path
      # or text names a client-to-client party outside its listed exceptions
      # (FILES_ALLOWED, SPANS_ALLOWED): rocketnet is client/server. Its tests
      # hold the red controls. It reads files only, so the lint job runs it.
      - name: Check client/server words
        if: ${{ !cancelled() }}
        run: |
          python3 tools/test_check_client_server_words.py
          python3 tools/check_client_server_words.py

      # tools/check_other_libraries.py exits 1 when a tracked file's path or
      # text names another network library, outside the dated records it
      # lists (RECORDS_ALLOWED): rocketnet stands on its own. Its tests hold
      # the red controls. It reads files only, so the lint job runs it.
      - name: Check rocketnet stands on its own
        if: ${{ !cancelled() }}
        run: |
          python3 tools/test_check_other_libraries.py
          python3 tools/check_other_libraries.py

      # tools/check_no_owned_linked_lists.py exits 1 when RocketNet owns a
      # pointer-linked or index-linked list: it lexes every tracked C/C++
      # source outside sodium/ and refuses a self-pointer member, a cursor
      # replaced by a field read through itself, or a field store followed by
      # the cursor move that makes it a chain. OS enumeration walks pass only
      # as rows of the "External ABI traversal sites" table of
      # docs/SEQUENCE-BUFFERS.md. --self-test holds the red and green controls.
      - name: Check no owned linked lists
        if: ${{ !cancelled() }}
        run: |
          python3 tools/check_no_owned_linked_lists.py --self-test
          python3 tools/check_no_owned_linked_lists.py

      # tools/check_byte_order.py exits 1 when the library (sdk/, the XDP
      # program included) swaps bytes whatever the host's byte order is
      # (__builtin_bswap*, bswap_*, _byteswap_*, a function named as a swap,
      # a hand-written shift swap) outside a byte-order preprocessor branch,
      # reads wire bytes through an integer pointer cast or a one-integer
      # memcpy outside its reasoned allow list, or converts netlink data
      # (host order) to network order. Such a swap is right on little-endian
      # and wrong on big-endian, where only a big-endian run sees it.
      # --self-test holds the red and green controls.
      - name: Check byte order in the library
        if: ${{ !cancelled() }}
        run: |
          python3 tools/check_byte_order.py --self-test
          python3 tools/check_byte_order.py

      # Every check has a planted violation (tools/planted_violations.tsv): every job of every
      # per-commit and scheduled workflow has a row, every row names a real step and carries
      # that step's own command. The plants themselves run nightly (planted-violations.yml);
      # this is the table's consistency only, no plant is run.
      - name: Every check has a planted violation in the table
        if: ${{ !cancelled() }}
        run: |
          python3 tools/planted_violations.py --self-test
          python3 tools/planted_violations.py --check-table

      # The validation-tool self-test suites the repository ships
      # (tools/test_check_frame_budget.py, test_check_server_calls.py,
      # test_check_split_load.py, test_check_test_environment.py,
      # test_profile_1000_load.py, test_release_version.py,
      # test_check_release_tsan.py, check_header_guards.py --self-test). Each is
      # self-contained -- fixtures only, no build, no network, no third-party
      # Python packages -- so every commit runs all of them, which covers their
      # tools, their dependencies and this file's own callers changing without
      # per-job path filters (this workflow does not filter jobs by path; its
      # header explains why). Each suite runs in its own step so no shell
      # pipeline can mask a refusal: the suite's own nonzero exit fails the
      # step, its full output is printed either way, and a suite that passes
      # having discovered no tests fails here too -- the runner's "Ran N tests"
      # line (the release-version suite's own count line) must name a positive
      # count. Seconds of wall time; the per-commit tier keeps it.
      - name: Test nightly execution policy
        if: ${{ !cancelled() }}
        run: python3 tools/test_nightly_timeout.py -v

      - name: Test the frame-budget checker's verdicts
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          output="$(python3 tools/test_check_frame_budget.py -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"

      - name: Test the server-calls checker's verdicts
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          output="$(python3 tools/test_check_server_calls.py -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"

      - name: Test the split-load checker's receipts
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          output="$(python3 tools/test_check_split_load.py -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"

      # Every refusal of the split-load merger is one its self-test notices:
      # each `raise ValueError(` turned into a no-op must turn the suite red
      # (review 5 O7: 68 of 104 could be deleted with every test green).
      # About 6 s at 4 jobs.
      - name: Every split-load refusal is tested
        if: ${{ !cancelled() }}
        run: |
          python3 tools/check_refusal_mutants.py --self-test
          python3 tools/check_refusal_mutants.py -j 4 tools/check_split_load.py tools/test_check_split_load.py

      - name: Test the test-environment checker's inventory
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          output="$(python3 tools/test_check_test_environment.py -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"

      - name: Test the 1000-client load profiler's provenance
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          output="$(python3 tools/test_profile_1000_load.py -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"

      - name: Test the release-version block and workflow
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          output="$(python3 tools/test_release_version.py 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^[1-9][0-9]* release version fixtures passed$' <<<"$output"

      - name: Test the release nightly-gates check
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          output="$(python3 tools/test_check_release_tsan.py -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"

      # The nightly watch's planted nights (no run, stale, cancelled, timed
      # out, hung, startup failure, all skipped, a 503) must each be red and
      # a clean night green, against a fake API.
      - name: Test the nightly watch's verdicts
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          output="$(python3 tools/test_check_nightly_dispositions.py -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"

      # The release and landing gates (tools/release_gates.txt): the release
      # and landing tools' fixture suites (no network), then the list itself
      # against the workflows: every workflow and job it names exists, and
      # every per-commit workflow has a gate row.
      - name: Test the release and landing tools; check the release gates list
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          for suite in tools/test_release.py tools/test_land.py; do
            output="$(python3 "$suite" -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
            printf '%s\n' "$output"
            grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"
          done
          python3 tools/check_release_gates.py --self-test
          python3 tools/check_release_gates.py

      # .github/rulesets/main.json (docs/branch-protection.md) requires exactly
      # the per-commit job names the workflows produce: a new or renamed
      # per-commit job, or a stale required name, is red here.
      - name: The main ruleset requires exactly the per-commit jobs
        if: ${{ !cancelled() }}
        run: |
          python3 tools/check_branch_protection.py --self-test
          python3 tools/check_branch_protection.py

      - name: Test the nightly TLA+ case planner
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          output="$(python3 tools/test_plan_tlc_nightly.py -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"

      - name: Test the TLA+ re-run comparer
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          output="$(python3 tools/test_compare_tlc_rerun.py -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"
          bash -n tools/tlc_rerun.sh

      - name: Test and check the TLA+ run records
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          output="$(python3 tools/test_check_tla_records.py -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"
          python3 tools/check_tla_records.py

      - name: Every TLC view is used where its justification holds
        if: ${{ !cancelled() }}
        run: python3 tools/check_tla_views.py --self-test && python3 tools/check_tla_views.py

      # Every pull request: the citation scan covers sdk/ and tests/, so a
      # rename there must fail here, not in the daily tlc.yml (VERIFY-6 A4/A5).
      - name: The nightly proof targets are the committed list
        if: ${{ !cancelled() }}
        run: bash proofs/cbmc/check_nightly_targets.sh --self-test && bash proofs/cbmc/check_nightly_targets.sh

      - name: Model coverage rows and citations are true
        if: ${{ !cancelled() }}
        run: python3 tools/test_check_tla_coverage.py && python3 tools/check_tla_coverage.py --all --actions-strict

      - name: Test and check the fuzz regression corpus
        if: ${{ !cancelled() }}
        run: |
          python3 tools/check_fuzz_regressions.py --selftest
          python3 tools/check_fuzz_regressions.py

      # The prefilter and message seeds generated from tests/pcapng: the
      # committed set must be exactly what the captures give (a renamed or
      # re-recorded capture left 119 seeds under old names from 2026-10-22
      # with no check to say so).
      - name: Test and check the pcapng fuzz seeds
        if: ${{ !cancelled() }}
        run: |
          python3 tools/pcapng_fuzz_seeds.py --selftest
          python3 tools/pcapng_fuzz_seeds.py --check

      - name: Test the unit-case coverage checker's verdicts
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          output="$(python3 tools/test_check_unit_case_coverage.py -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"

      - name: Test the header-guard checker's verdicts
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          output="$(python3 tools/check_header_guards.py --self-test -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"

      # tools/check_msvc_crt.py: no bare call MSVC deprecates (C4996, an error
      # under /WX) in a test, tool or example source MSVC compiles; three
      # reached Windows CI on 2026-11-12. --self-test plants each of the 218
      # names, the guard forms and an empty tree.
      - name: No CRT call MSVC deprecates where MSVC compiles it
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_msvc_crt.py --self-test
          python3 tools/check_msvc_crt.py

      # tools/check_fuzz_stats.py and tools/check_fuzz_coverage.py hold
      # fuzz-nightly.yml's legs and coverage jobs to their floor tables; their
      # self-tests plant each refusal and check the committed tables give
      # every harness a row, so a new harness without one fails here, per
      # commit, not on the night.
      - name: Test the fuzz floor checkers' verdicts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          output="$(python3 tools/check_fuzz_stats.py --self-test 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^check_fuzz_stats self-test: [1-9][0-9]* cases, 0 failed$' <<<"$output"
          output="$(python3 tools/check_fuzz_coverage.py --self-test 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^check_fuzz_coverage self-test: [1-9][0-9]* cases, 0 failed$' <<<"$output"

      # scripts/transport-cells-repeat drives nightly.yml's fifty-times cells:
      # a case list of blanks, a skipped io_uring cell and a failing case must
      # each fail it (fake ci.yml, fake functional binary, fake io_uring switch)
      - name: Test the transport cells repeat's verdicts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          output="$(bash tools/test_transport_cells_repeat.sh 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^ok: transport-cells-repeat self-test, [1-9][0-9]* cases$' <<<"$output"

      # tools/check_make_jobs.py: every make -j, cmake --build --parallel
      # and cmake --build -j in every tracked Makefile, workflow, shell,
      # Python and Go file names its job count (a bare one is unbounded under
      # the Makefile generator: exit 137 on the benches). --self-test plants
      # each spelling, an empty tree and a failed git listing.
      - name: Every parallel build names its job count
        if: ${{ !cancelled() }}
        run: |
          python3 tools/check_make_jobs.py --self-test
          python3 tools/check_make_jobs.py

      # tools/run_parallel.py runs a checks step's independent commands at
      # once: its self-test plants a red command, a red pipe stage, no
      # command, and two commands that only pass when run together.
      - name: Test the parallel step runner
        if: ${{ !cancelled() }}
        run: python3 tools/run_parallel.py --self-test

      # tools/replay_ci_steps.py runs a job's steps on a bench as the runner
      # would, before a dispatch; its self-test holds the if:, env, shell,
      # anchor and red-step rules to a fixture workflow.
      - name: Test the CI step replay
        if: ${{ !cancelled() }}
        run: python3 tools/replay_ci_steps.py --self-test

      # tools/check_package.py holds the installed SDK to a list of the files
      # it may hold (include/ is rocketnet.h alone); its self-test plants an
      # internal header, a platform header, a tool, a stray file, and a tree
      # with no header or no library (VERIFY-3 W2).
      - name: Test the installed-SDK file list
        if: ${{ !cancelled() }}
        run: python3 tools/check_package.py --self-test

      # tools/check_platform_policy.py plants each row it must refuse (tokens
      # from two runners, a step named by a prefix, an if: false or
      # inputs.full step or job, an unreadable if:, a transport no matrix
      # cell runs) and each wildcard bind, in scratch trees; the real-tree
      # check runs in the build-and-test checks row
      - name: Test the platform policy checker
        if: ${{ !cancelled() }}
        run: python3 tools/check_platform_policy.py --self-check

      # tools/check_suppressions.py: every NOLINT, cppcheck-suppress and
      # diagnostic pragma in sdk/ is listed with a reason in
      # tools/suppressions_reviewed.txt, and every listed one still exists. A
      # suppression hides a finding before the static gates' baselines see
      # it; static.yml's tidy gate runs the same check first.
      - name: Every in-source suppression in the library is reviewed
        if: ${{ !cancelled() }}
        run: |
          python3 tools/check_suppressions.py --self-test
          python3 tools/check_suppressions.py

      # tools/bigendian/run_byte_cases.sh refuses an empty list, a
      # registration its pattern cannot read and a count other than the one
      # docs/PLATFORMS.md states; its self-test plants each of those, an
      # unbuilt case and a failing case on a fake binary
      - name: Test and count the big-endian byte cases
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash tools/bigendian/test_run_byte_cases.sh
          bash tools/bigendian/run_byte_cases.sh --count

      # Every whole functional-suite run goes through tools/run_functional.sh,
      # which holds its SKIPPED lines to tests/functional/expected_skips.txt
      # both ways; --lint checks the list (a reason per predicate, names that
      # exist, every leg run, no unwrapped whole-suite run in a workflow)
      - name: Functional skips are held to the reviewed list
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_skips.py --self-test
          bash tools/test_run_functional.sh
          python3 tools/check_skips.py --lint

      - name: Test the mutation runner's generator and process cleanup; check the survivor baseline
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/mutation/run_mutants.py --self-test
          # the nightly's reviewed survivor baseline: it parses, its gap count is its
          # gap-ratchet, and every entry is still a mutant of the source as it is now
          python3 tools/mutation/run_mutants.py --check-baseline tools/mutation/survivors.tsv
          output="$(python3 tools/mutation/test_run_mutants.py -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"

      # The nightly tier runs its suites with ROCKETNET_TEST_KEEP_GOING=1
      # (nightly.yml): a failure no longer stops the run, so the summary must
      # name every failed case and the run must still exit 1.
      - name: Test the suite runner's keep-going mode
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          output="$(python3 tools/test_suite_keep_going.py -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran 3 tests' <<<"$output"

      # scripts/lan-proof and lan-proof-remote through fake tools: the dry
      # run, the row parser, the per-OS host facts, load and build. Opens no
      # socket and contacts no host; about 2 s (2026-11-12, vision). It ran
      # nowhere before (VERIFY-3 C-21).
      - name: Test the LAN proof driver
        if: ${{ !cancelled() }}
        run: bash scripts/lan-proof-selftest

      - if: always()
        uses: ./.github/actions/ccache-stats

  # Every registered unit case runs in at least one CI configuration. Each job
  # that runs the unit suite uploads `bin/test --list` (or, for a leg that
  # runs named cases, the cases it ran) as unit-cases-<configuration>; this
  # job fails on a registered case no configuration lists, on a listed case
  # the registration scan missed, and on a configuration with no list
  # (tools/check_unit_case_coverage.py). Nightly tier only: every
  # configuration runs there, the per-commit ones included, so "some CI
  # build" is any build of either tier.
  unit-case-coverage:
    name: unit-case coverage
    needs: [build-and-test, build-and-test-windows, sanitizers, sodium-pinned]
    if: ${{ inputs.full && !cancelled() }}
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 7200
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Download the registered unit cases
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: unit-cases-*
          path: unit-cases
          merge-multiple: true

      - name: Every registered unit case runs in at least one configuration
        run: |
          set -euo pipefail
          python3 tools/check_unit_case_coverage.py --repo . \
            --expect Linux-Debug Linux-Release macOS-Debug macOS-Release Linux-no-XDP Linux-wide \
                     Windows-a Windows-b Linux-asan Linux-sodium-pinned \
            -- unit-cases/*.txt
