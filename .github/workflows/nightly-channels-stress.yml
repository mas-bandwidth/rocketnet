# The nightly channel stress: bin/test_channels_1024 and bin/test_channels_10k
# (tests/test_channels_stress.cpp), the message layer at 1024 and at 10000
# channels, every delivery mode, over the in-memory loopback transport with the
# seeded link simulator, plus the memory plan at that channel count. Each
# binary compiles the SDK again with its ROCKETNET_MAX_CHANNELS, the way
# test_wide is built. They live here, not in ci.yml: the per-push tier stays
# at or under two minutes, and a nightly is exempt from that rule.
#
# One job per platform on the fleet runner labels ci.yml uses: the Linux fleet
# pool, the macOS Apple-silicon runner (rocketnet-macos) and the Windows runner
# (rocketnet-windows). A red night prints the failed check's file and line.

name: nightly-channels-stress

on:
  schedule:
    - cron: "45 9 * * *"
  workflow_dispatch:

jobs:
  channels-stress-linux:
    runs-on: ["self-hosted", "Linux", "X64", "fleet"]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Build
        run: make JOBS=4

      - name: Stress at 1024 channels
        run: ./bin/test_channels_1024

      - name: Stress at 10000 channels
        run: ./bin/test_channels_10k

  channels-stress-macos:
    runs-on: ["self-hosted", "macOS", "ARM64", "rocketnet-macos"]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Build
        run: make JOBS=4

      - name: Stress at 1024 channels
        run: ./bin/test_channels_1024

      - name: Stress at 10000 channels
        run: ./bin/test_channels_10k

  channels-stress-windows:
    runs-on: [self-hosted, Windows, X64, rocketnet-windows]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel 4 --target test_channels_1024 test_channels_10k

      - name: Stress at 1024 channels
        shell: bash
        run: ./bin/Release/test_channels_1024.exe

      - name: Stress at 10000 channels
        shell: bash
        run: ./bin/Release/test_channels_10k.exe
