# The nightly deep fuzz (#124's discovery half) runs longer campaigns per
# target and persists discovered inputs across nights. ci.yml gates each
# commit with corpus replay and a bounded full-count mutation campaign.
# Both fail on findings; this workflow adds duration and stateful targets.
#
# Separate workflow from ci.yml so it never blocks a pull request. A red night
# is a found bug, read by whoever is on the estate that morning, not a gate on
# a merge.
#
# ONE INSTRUMENTED LIBRARY, MANY TARGETS: the sdk is built once with
# fuzzer-no-link coverage plus asan+ubsan, and each target links the harness
# against that archive -- one parallel build instead of recompiling the whole
# sdk per target, exactly as ci.yml's fuzz-smoke does. The three targets are
# the one-binary stateless parser sweep (the smoke's own binary, run long
# here), the connect token ladder, and the stateful receive path.

name: Fuzz (nightly)

on:
  schedule:
    - cron: "17 7 * * *"   # daily at 07:17 UTC
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to fuzz each target"
        required: false
        default: "900"

permissions:
  contents: read

jobs:
  fuzz:
    name: nightly fuzz (${{ fromJSON(matrix.leg).target }})
    runs-on: [self-hosted, Linux, X64, fleet]
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
        # each row is a harness source under fuzz/ and the seed-corpus and
        # persisted-corpus directories that feed it. the stateless sweep keeps
        # its historic name (rocketnet_fuzz) and its historic seed dir
        # (fuzz/corpus); the two stateful targets carry their own.
        leg:
          - '{"target":"rocketnet_fuzz","source":"fuzz/rocketnet_fuzz.cpp","seeds":"fuzz/corpus"}'
          - '{"target":"rocketnet_fuzz_connect_token","source":"fuzz/rocketnet_fuzz_connect_token.cpp","seeds":"fuzz/corpus_connect_token"}'
          - '{"target":"rocketnet_fuzz_receive_structured","source":"fuzz/rocketnet_fuzz_receive_structured.cpp","seeds":"fuzz/corpus_receive_structured"}'
          - '{"target":"rocketnet_fuzz_message","source":"fuzz/rocketnet_fuzz_message.cpp","seeds":"fuzz/corpus_message"}'
    concurrency:
      group: fuzz-nightly-${{ matrix.ref }}-${{ fromJSON(matrix.leg).target }}
      cancel-in-progress: true
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ clang clang++ xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      # persist the discovered corpus across runs: restore the newest prior
      # cache for this target, save a fresh entry keyed by run id. cache
      # entries are immutable, so a unique key each run plus a prefix
      # restore-key gives a growing corpus.
      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: corpus/${{ fromJSON(matrix.leg).target }}
          key: fuzz-corpus-${{ fromJSON(matrix.leg).target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ fromJSON(matrix.leg).target }}-

      - name: Configure the instrumented library
        run: >
          cmake -B build-fuzz
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"

      - name: Build the instrumented library
        run: cmake --build build-fuzz --target rocketnet_dev --parallel

      - name: Build ${{ fromJSON(matrix.leg).target }}
        run: |
          set -euo pipefail
          mkdir -p bin
          clang++ -g -O1 -std=c++17 \
            -ffp-contract=off \
            -DROCKETNET_DEV=1 \
            -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer \
            -Isodium -Isdk -Itest "${{ fromJSON(matrix.leg).source }}" build-fuzz/librocketnet_dev.a \
            -lbpf -lxdp -luring -lpthread \
            -o "bin/${{ fromJSON(matrix.leg).target }}"

      - name: Fuzz ${{ fromJSON(matrix.leg).target }}
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          mkdir -p "corpus/${{ fromJSON(matrix.leg).target }}"
          T="${{ github.event.inputs.max_total_time || '900' }}"
          echo "fuzzing ${{ fromJSON(matrix.leg).target }} for ${T}s with the wire dictionary"
          ./"bin/${{ fromJSON(matrix.leg).target }}" \
            "corpus/${{ fromJSON(matrix.leg).target }}" "${{ fromJSON(matrix.leg).seeds }}" \
            -dict=fuzz/rocketnet.dict \
            -max_total_time="$T" -print_final_stats=1 -rss_limit_mb=4096 -timeout=25

      # libFuzzer writes a reproducer to the working dir on a crash; keep it.
      # GitHub expressions have no replace(): the artifact name's ref slug ('/' -> '-') is made here
      - name: Artifact name for the ref
        id: refslug
        if: failure()
        shell: bash
        env:
          REF: ${{ matrix.ref }}
        run: echo "slug=${REF//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashes-${{ fromJSON(matrix.leg).target }}-${{ steps.refslug.outputs.slug }}
          path: |
            crash-*
            oom-*
            timeout-*
            leak-*
          if-no-files-found: ignore

  # macOS Apple silicon on the fleet's darwin member, the same runner label
  # ci.yml's macOS rows use. Apple clang carries no libFuzzer runtime, so this
  # leg names the LLVM toolchain unpacked at $HOME/sdk/llvm through
  # ROCKETNET_FUZZ_CC/CXX: the same flags and the same darwin link set as
  # fuzz/Makefile (CoreFoundation and SystemConfiguration).
  fuzz-macos:
    name: nightly fuzz macOS (${{ fromJSON(matrix.leg).target }})
    runs-on: [self-hosted, macOS, ARM64, rocketnet-macos]
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
        leg:
          - '{"target":"rocketnet_fuzz","source":"fuzz/rocketnet_fuzz.cpp","seeds":"fuzz/corpus"}'
          - '{"target":"rocketnet_fuzz_connect_token","source":"fuzz/rocketnet_fuzz_connect_token.cpp","seeds":"fuzz/corpus_connect_token"}'
          - '{"target":"rocketnet_fuzz_receive_structured","source":"fuzz/rocketnet_fuzz_receive_structured.cpp","seeds":"fuzz/corpus_receive_structured"}'
          - '{"target":"rocketnet_fuzz_message","source":"fuzz/rocketnet_fuzz_message.cpp","seeds":"fuzz/corpus_message"}'
    concurrency:
      group: fuzz-nightly-macos-${{ matrix.ref }}-${{ fromJSON(matrix.leg).target }}
      cancel-in-progress: true
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Find the LLVM clang that carries libFuzzer
        shell: bash
        run: |
          set -euo pipefail
          LLVM_PREFIX="$HOME/sdk/llvm"
          if [ ! -x "$LLVM_PREFIX/bin/clang++" ] || ! ls "$LLVM_PREFIX"/lib/clang/*/lib/darwin/libclang_rt.fuzzer_osx.a >/dev/null 2>&1; then
            echo "TOOL-MISSING LLVM clang with libclang_rt.fuzzer_osx.a (any) ($LLVM_PREFIX) on $RUNNER_NAME"
            exit 1
          fi
          "$LLVM_PREFIX/bin/clang++" --version
          echo "ROCKETNET_FUZZ_CC=$LLVM_PREFIX/bin/clang" >> "$GITHUB_ENV"
          echo "ROCKETNET_FUZZ_CXX=$LLVM_PREFIX/bin/clang++" >> "$GITHUB_ENV"

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake xxd python3; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: corpus/${{ fromJSON(matrix.leg).target }}
          key: fuzz-corpus-macos-${{ fromJSON(matrix.leg).target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-macos-${{ fromJSON(matrix.leg).target }}-

      - name: Configure the instrumented library
        run: >
          cmake -B build-fuzz
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER="$ROCKETNET_FUZZ_CC"
          -DCMAKE_CXX_COMPILER="$ROCKETNET_FUZZ_CXX"
          -DCMAKE_C_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"

      - name: Build the instrumented library
        run: cmake --build build-fuzz --target rocketnet_dev --parallel

      - name: Build ${{ fromJSON(matrix.leg).target }}
        run: |
          set -euo pipefail
          mkdir -p bin
          "$ROCKETNET_FUZZ_CXX" -g -O1 -std=c++17 \
            -ffp-contract=off \
            -DROCKETNET_DEV=1 \
            -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer \
            -Isodium -Isdk -Itest "${{ fromJSON(matrix.leg).source }}" build-fuzz/librocketnet_dev.a \
            -lpthread \
            -framework CoreFoundation -framework SystemConfiguration \
            -o "bin/${{ fromJSON(matrix.leg).target }}"

      # libFuzzer starts its own RSS-polling thread before main and does not
      # tear it down, so LeakSanitizer reports that thread's frame on macOS
      # whatever the product does. Leaks stay on in the Linux leg; on this
      # leg they would turn every clean run red, so leak detection is off.
      - name: Fuzz ${{ fromJSON(matrix.leg).target }}
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          mkdir -p "corpus/${{ fromJSON(matrix.leg).target }}"
          T="${{ github.event.inputs.max_total_time || '900' }}"
          echo "fuzzing ${{ fromJSON(matrix.leg).target }} for ${T}s with the wire dictionary"
          ./"bin/${{ fromJSON(matrix.leg).target }}" \
            "corpus/${{ fromJSON(matrix.leg).target }}" "${{ fromJSON(matrix.leg).seeds }}" \
            -dict=fuzz/rocketnet.dict \
            -max_total_time="$T" -print_final_stats=1 -rss_limit_mb=4096 -timeout=25

      # GitHub expressions have no replace(): the artifact name's ref slug ('/' -> '-') is made here
      - name: Artifact name for the ref
        id: refslug
        if: failure()
        shell: bash
        env:
          REF: ${{ matrix.ref }}
        run: echo "slug=${REF//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashes-macos-${{ fromJSON(matrix.leg).target }}-${{ steps.refslug.outputs.slug }}
          path: |
            crash-*
            oom-*
            timeout-*
            leak-*
          if-no-files-found: ignore
