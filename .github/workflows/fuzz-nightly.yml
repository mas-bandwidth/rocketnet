# The nightly deep fuzz (#124's discovery half) runs longer campaigns per
# target and persists discovered inputs across nights. ci.yml gates each
# commit with corpus replay and a bounded full-count mutation campaign.
# Both fail on findings; this workflow adds duration and stateful targets.
#
# Separate workflow from ci.yml so it never blocks a pull request. A red night
# is a found bug, read by whoever is on the estate that morning, not a gate on
# a merge.
#
# ONE INSTRUMENTED LIBRARY, MANY TARGETS: the sdk is built once with
# fuzzer-no-link coverage plus asan+ubsan, and each target links the harness
# against that archive -- one parallel build instead of recompiling the whole
# sdk per target, exactly as ci.yml's fuzz-smoke does. The targets are every
# harness under fuzz/ (fuzz/README.md's table): the one-binary stateless
# parser sweep (the smoke's own binary, run long here), the message decoder,
# the connect token ladder and its private layouts, the stateful receive
# path, the wire round trip, the env config overlay, and the three pair
# targets (server transport, client transport, scripted session).
#
# TIME BUDGET: each leg fuzzes max_total_time seconds (900 by default) after
# a few minutes of build; timeout-minutes: 45 bounds a wedged leg. A manual
# dispatch longer than about 35 minutes per target must raise it.

name: Fuzz (nightly)

on:
  schedule:
    - cron: "17 7 * * *"   # daily at 07:17 UTC
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to fuzz each target"
        required: false
        default: "900"

permissions:
  contents: read

jobs:
  fuzz:
    name: nightly fuzz (${{ fromJSON(matrix.leg).target }})
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
        # each row is a harness source under fuzz/ and the seed-corpus and
        # persisted-corpus directories that feed it. the stateless sweep keeps
        # its historic name (rocketnet_fuzz) and its historic seed dir
        # (fuzz/corpus); every other target carries its own. dict is the
        # target's own dictionary under fuzz/dict/ where it has one, else the
        # shared wire dictionary, as oss-fuzz/build.sh picks.
        leg:
          - '{"target":"rocketnet_fuzz","source":"fuzz/rocketnet_fuzz.cpp","seeds":"fuzz/corpus","dict":"fuzz/dict/rocketnet_fuzz.dict"}'
          - '{"target":"rocketnet_fuzz_connect_token","source":"fuzz/rocketnet_fuzz_connect_token.cpp","seeds":"fuzz/corpus_connect_token","dict":"fuzz/dict/rocketnet_fuzz_connect_token.dict"}'
          - '{"target":"rocketnet_fuzz_receive_structured","source":"fuzz/rocketnet_fuzz_receive_structured.cpp","seeds":"fuzz/corpus_receive_structured","dict":"fuzz/dict/rocketnet_fuzz_receive_structured.dict"}'
          - '{"target":"rocketnet_fuzz_message","source":"fuzz/rocketnet_fuzz_message.cpp","seeds":"fuzz/corpus_message","dict":"fuzz/dict/rocketnet_fuzz_message.dict"}'
          - '{"target":"rocketnet_fuzz_token_private","source":"fuzz/rocketnet_fuzz_token_private.cpp","seeds":"fuzz/corpus_token_private","dict":"fuzz/dict/rocketnet_fuzz_token_private.dict"}'
          - '{"target":"rocketnet_fuzz_round_trip","source":"fuzz/rocketnet_fuzz_round_trip.cpp","seeds":"fuzz/corpus_round_trip","dict":"fuzz/dict/rocketnet_fuzz_round_trip.dict"}'
          - '{"target":"rocketnet_fuzz_config","source":"fuzz/rocketnet_fuzz_config.cpp","seeds":"fuzz/corpus_config","dict":"fuzz/dict/rocketnet_fuzz_config.dict"}'
          - '{"target":"rocketnet_fuzz_server_transport","source":"fuzz/rocketnet_fuzz_server_transport.cpp","seeds":"fuzz/corpus_server_transport","dict":"fuzz/dict/rocketnet_fuzz_server_transport.dict"}'
          - '{"target":"rocketnet_fuzz_client_transport","source":"fuzz/rocketnet_fuzz_client_transport.cpp","seeds":"fuzz/corpus_client_transport","dict":"fuzz/dict/rocketnet_fuzz_client_transport.dict"}'
          - '{"target":"rocketnet_fuzz_session","source":"fuzz/rocketnet_fuzz_session.cpp","seeds":"fuzz/corpus_session","dict":"fuzz/dict/rocketnet_fuzz_session.dict"}'
          - '{"target":"rocketnet_fuzz_differential","source":"fuzz/rocketnet_fuzz_differential.cpp","seeds":"fuzz/corpus_differential","dict":"fuzz/dict/rocketnet_fuzz_differential.dict"}'
    concurrency:
      group: fuzz-nightly-${{ matrix.ref }}-${{ fromJSON(matrix.leg).target }}
      cancel-in-progress: true
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ clang clang++ xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      # persist the discovered corpus across runs: restore the newest prior
      # cache for this target, save a fresh entry keyed by run id. cache
      # entries are immutable, so a unique key each run plus a prefix
      # restore-key gives a growing corpus.
      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: corpus/${{ fromJSON(matrix.leg).target }}
          key: fuzz-corpus-${{ fromJSON(matrix.leg).target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ fromJSON(matrix.leg).target }}-

      - name: Configure the instrumented library
        run: >
          cmake -B build-fuzz
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"

      - name: Build the instrumented library
        run: cmake --build build-fuzz --target rocketnet_dev --parallel

      - name: Check out the pinned netcode reference
        if: contains(fromJSON(matrix.leg).target, 'differential')
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/mas-bandwidth/netcode.git netcode-ref
          git -C netcode-ref checkout --quiet 1dd10f892f4742498a99a0bb5d9b1f8f6e94f26b

      - name: Build ${{ fromJSON(matrix.leg).target }}
        run: |
          set -euo pipefail
          mkdir -p bin
          EXTRA=""
          if [[ "${{ fromJSON(matrix.leg).target }}" == "rocketnet_fuzz_differential" ]]; then
            cc -O2 -DNDEBUG -ffp-contract=off -c netcode-ref/netcode.c -o bin/netcode_ref.o \
              -I netcode-ref -I sodium
            EXTRA="-Itools/differential -Inetcode-ref -DROCKETNET_DIFFERENTIAL_NETCODE_DIR bin/netcode_ref.o"
          fi
          clang++ -g -O1 -std=c++17 \
            -ffp-contract=off \
            -DROCKETNET_DEV=1 \
            -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer \
            -Isodium -Isdk $EXTRA "${{ fromJSON(matrix.leg).source }}" build-fuzz/librocketnet_dev.a \
            -lbpf -lxdp -luring -lpthread \
            -o "bin/${{ fromJSON(matrix.leg).target }}"

      - name: Fuzz ${{ fromJSON(matrix.leg).target }}
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          mkdir -p "corpus/${{ fromJSON(matrix.leg).target }}"
          T="${{ github.event.inputs.max_total_time || '900' }}"
          echo "fuzzing ${{ fromJSON(matrix.leg).target }} for ${T}s with ${{ fromJSON(matrix.leg).dict }}"
          ./"bin/${{ fromJSON(matrix.leg).target }}" \
            "corpus/${{ fromJSON(matrix.leg).target }}" "${{ fromJSON(matrix.leg).seeds }}" \
            -dict="${{ fromJSON(matrix.leg).dict }}" \
            -max_total_time="$T" -print_final_stats=1 -rss_limit_mb=4096 -timeout=25

      # libFuzzer writes a reproducer to the working dir on a crash; keep it.
      # GitHub expressions have no replace(): the artifact name's ref slug ('/' -> '-') is made here
      - name: Artifact name for the ref
        id: refslug
        if: failure()
        shell: bash
        env:
          REF: ${{ matrix.ref }}
        run: echo "slug=${REF//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashes-${{ fromJSON(matrix.leg).target }}-${{ steps.refslug.outputs.slug }}
          path: |
            crash-*
            oom-*
            timeout-*
            leak-*
          if-no-files-found: ignore

  # THE NDEBUG CAMPAIGN: the same eleven targets, but the library under them
  # is built Release (NDEBUG) as well as the harness, so rocketnet_assert is
  # compiled out (sdk/rocketnet_internal.h) and a bound that only an assert
  # holds is fuzzed the way a release build runs it. The fuzz job above
  # builds the library Debug, and ci.yml's fuzz-smoke-ndebug only replays the
  # corpora over a Debug library. tools/fuzz_ndebug.sh does the build, checks
  # that every sdk/ compile line carries -DNDEBUG and that no library object
  # references the assert callback, and fuzzes the target with the nightly's
  # flags; it exits 1 on a crash and names the reproducer.
  fuzz-ndebug:
    name: nightly fuzz NDEBUG (${{ matrix.target }})
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
        target:
          - rocketnet_fuzz
          - rocketnet_fuzz_connect_token
          - rocketnet_fuzz_receive_structured
          - rocketnet_fuzz_message
          - rocketnet_fuzz_token_private
          - rocketnet_fuzz_round_trip
          - rocketnet_fuzz_config
          - rocketnet_fuzz_server_transport
          - rocketnet_fuzz_client_transport
          - rocketnet_fuzz_session
          - rocketnet_fuzz_differential
    concurrency:
      group: fuzz-nightly-ndebug-${{ matrix.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake clang clang++ nm git pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: build-fuzz-ndebug/out/corpus/${{ matrix.target }}
          key: fuzz-corpus-ndebug-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-ndebug-${{ matrix.target }}-

      - name: Fuzz ${{ matrix.target }} with NDEBUG
        run: |
          set -euo pipefail
          T="${{ github.event.inputs.max_total_time || '900' }}"
          tools/fuzz_ndebug.sh --target "${{ matrix.target }}" --seconds "$T"

      - name: Artifact name for the ref
        id: refslug
        if: failure()
        shell: bash
        env:
          REF: ${{ matrix.ref }}
        run: echo "slug=${REF//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashes-ndebug-${{ matrix.target }}-${{ steps.refslug.outputs.slug }}
          path: |
            build-fuzz-ndebug/out/crashes/
            build-fuzz-ndebug/out/logs/
          if-no-files-found: ignore

  # macOS Apple silicon on the fleet's darwin member, the same runner label
  # ci.yml's macOS rows use. Apple clang carries no libFuzzer runtime, so this
  # leg names the LLVM toolchain unpacked at $HOME/sdk/llvm through
  # ROCKETNET_FUZZ_CC/CXX: the same flags and the same darwin link set as
  # fuzz/Makefile (CoreFoundation and SystemConfiguration).
  fuzz-macos:
    name: nightly fuzz macOS (${{ fromJSON(matrix.leg).target }})
    runs-on: [self-hosted, macOS, ARM64, rocketnet-macos]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
        leg:
          - '{"target":"rocketnet_fuzz","source":"fuzz/rocketnet_fuzz.cpp","seeds":"fuzz/corpus","dict":"fuzz/dict/rocketnet_fuzz.dict"}'
          - '{"target":"rocketnet_fuzz_connect_token","source":"fuzz/rocketnet_fuzz_connect_token.cpp","seeds":"fuzz/corpus_connect_token","dict":"fuzz/dict/rocketnet_fuzz_connect_token.dict"}'
          - '{"target":"rocketnet_fuzz_receive_structured","source":"fuzz/rocketnet_fuzz_receive_structured.cpp","seeds":"fuzz/corpus_receive_structured","dict":"fuzz/dict/rocketnet_fuzz_receive_structured.dict"}'
          - '{"target":"rocketnet_fuzz_message","source":"fuzz/rocketnet_fuzz_message.cpp","seeds":"fuzz/corpus_message","dict":"fuzz/dict/rocketnet_fuzz_message.dict"}'
          - '{"target":"rocketnet_fuzz_token_private","source":"fuzz/rocketnet_fuzz_token_private.cpp","seeds":"fuzz/corpus_token_private","dict":"fuzz/dict/rocketnet_fuzz_token_private.dict"}'
          - '{"target":"rocketnet_fuzz_round_trip","source":"fuzz/rocketnet_fuzz_round_trip.cpp","seeds":"fuzz/corpus_round_trip","dict":"fuzz/dict/rocketnet_fuzz_round_trip.dict"}'
          - '{"target":"rocketnet_fuzz_config","source":"fuzz/rocketnet_fuzz_config.cpp","seeds":"fuzz/corpus_config","dict":"fuzz/dict/rocketnet_fuzz_config.dict"}'
          - '{"target":"rocketnet_fuzz_server_transport","source":"fuzz/rocketnet_fuzz_server_transport.cpp","seeds":"fuzz/corpus_server_transport","dict":"fuzz/dict/rocketnet_fuzz_server_transport.dict"}'
          - '{"target":"rocketnet_fuzz_client_transport","source":"fuzz/rocketnet_fuzz_client_transport.cpp","seeds":"fuzz/corpus_client_transport","dict":"fuzz/dict/rocketnet_fuzz_client_transport.dict"}'
          - '{"target":"rocketnet_fuzz_session","source":"fuzz/rocketnet_fuzz_session.cpp","seeds":"fuzz/corpus_session","dict":"fuzz/dict/rocketnet_fuzz_session.dict"}'
    concurrency:
      group: fuzz-nightly-macos-${{ matrix.ref }}-${{ fromJSON(matrix.leg).target }}
      cancel-in-progress: true
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Find the LLVM clang that carries libFuzzer
        shell: bash
        run: |
          set -euo pipefail
          LLVM_PREFIX="$HOME/sdk/llvm"
          if [ ! -x "$LLVM_PREFIX/bin/clang++" ] || ! ls "$LLVM_PREFIX"/lib/clang/*/lib/darwin/libclang_rt.fuzzer_osx.a >/dev/null 2>&1; then
            echo "TOOL-MISSING LLVM clang with libclang_rt.fuzzer_osx.a (any) ($LLVM_PREFIX) on $RUNNER_NAME"
            exit 1
          fi
          "$LLVM_PREFIX/bin/clang++" --version
          echo "ROCKETNET_FUZZ_CC=$LLVM_PREFIX/bin/clang" >> "$GITHUB_ENV"
          echo "ROCKETNET_FUZZ_CXX=$LLVM_PREFIX/bin/clang++" >> "$GITHUB_ENV"

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake xxd python3; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: corpus/${{ fromJSON(matrix.leg).target }}
          key: fuzz-corpus-macos-${{ fromJSON(matrix.leg).target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-macos-${{ fromJSON(matrix.leg).target }}-

      - name: Configure the instrumented library
        run: >
          cmake -B build-fuzz
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER="$ROCKETNET_FUZZ_CC"
          -DCMAKE_CXX_COMPILER="$ROCKETNET_FUZZ_CXX"
          -DCMAKE_C_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"

      - name: Build the instrumented library
        run: cmake --build build-fuzz --target rocketnet_dev --parallel

      - name: Build ${{ fromJSON(matrix.leg).target }}
        run: |
          set -euo pipefail
          mkdir -p bin
          "$ROCKETNET_FUZZ_CXX" -g -O1 -std=c++17 \
            -ffp-contract=off \
            -DROCKETNET_DEV=1 \
            -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer \
            -Isodium -Isdk "${{ fromJSON(matrix.leg).source }}" build-fuzz/librocketnet_dev.a \
            -lpthread \
            -framework CoreFoundation -framework SystemConfiguration \
            -o "bin/${{ fromJSON(matrix.leg).target }}"

      # libFuzzer starts its own RSS-polling thread before main and does not
      # tear it down, so LeakSanitizer reports that thread's frame on macOS
      # whatever the product does. Leaks stay on in the Linux leg; on this
      # leg they would turn every clean run red, so leak detection is off.
      - name: Fuzz ${{ fromJSON(matrix.leg).target }}
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          mkdir -p "corpus/${{ fromJSON(matrix.leg).target }}"
          T="${{ github.event.inputs.max_total_time || '900' }}"
          echo "fuzzing ${{ fromJSON(matrix.leg).target }} for ${T}s with ${{ fromJSON(matrix.leg).dict }}"
          ./"bin/${{ fromJSON(matrix.leg).target }}" \
            "corpus/${{ fromJSON(matrix.leg).target }}" "${{ fromJSON(matrix.leg).seeds }}" \
            -dict="${{ fromJSON(matrix.leg).dict }}" \
            -max_total_time="$T" -print_final_stats=1 -rss_limit_mb=4096 -timeout=25

      # GitHub expressions have no replace(): the artifact name's ref slug ('/' -> '-') is made here
      - name: Artifact name for the ref
        id: refslug
        if: failure()
        shell: bash
        env:
          REF: ${{ matrix.ref }}
        run: echo "slug=${REF//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashes-macos-${{ fromJSON(matrix.leg).target }}-${{ steps.refslug.outputs.slug }}
          path: |
            crash-*
            oom-*
            timeout-*
            leak-*
          if-no-files-found: ignore

  # Windows x64 on the fleet's native Windows member, the runner label ci.yml's
  # Windows rows use. The libFuzzer runtime ships with the ClangCL toolset of
  # Visual Studio (VC/Tools/Llvm/x64, clang_rt.fuzzer-x86_64.lib beside the
  # AddressSanitizer runtime in clang's resource directory), the toolset
  # nightly.yml's windows-toolchains job builds with. MSVC cl's
  # /fsanitize=fuzzer has its own x64 runtime there too (clang_rt.fuzzer_MD),
  # but clang-cl is the same libFuzzer the Linux and macOS legs run and takes
  # -fsanitize=fuzzer-no-link for the library, so this leg uses clang-cl.
  # The library is built once through CMake with that toolset, instrumented
  # with /fsanitize=address -fsanitize=fuzzer-no-link, and each target is
  # compiled by clang-cl at the tree's warning floor (/W4 /WX and the strict
  # set CMakeLists.txt adds for clang-cl) and linked against it with
  # -fsanitize=fuzzer,address. The link set is the replay targets' one:
  # rocketnet_dev.lib alone, whose platform source names WS2_32, IPHLPAPI,
  # Qwave and winmm itself. Debug keeps the asserts, on the static release C
  # runtime (/MT) with the STL's ASan string and vector annotations off,
  # because Visual Studio's clang_rt.fuzzer-x86_64.lib is built that way and
  # its link refuses any object that differs (/failifmismatch on
  # RuntimeLibrary and annotate_string); clang-cl refuses AddressSanitizer
  # with a debug runtime.
  # No UndefinedBehaviorSanitizer: clang-cl links it only as the standalone
  # runtime, which cannot share a process with ASan's dynamic runtime.
  # The netcode differential target stays on the Linux leg.
  fuzz-windows:
    name: nightly fuzz Windows (${{ fromJSON(matrix.leg).target }})
    runs-on: [self-hosted, Windows, X64, rocketnet-windows]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
        leg:
          - '{"target":"rocketnet_fuzz","source":"fuzz/rocketnet_fuzz.cpp","seeds":"fuzz/corpus","dict":"fuzz/dict/rocketnet_fuzz.dict"}'
          - '{"target":"rocketnet_fuzz_connect_token","source":"fuzz/rocketnet_fuzz_connect_token.cpp","seeds":"fuzz/corpus_connect_token","dict":"fuzz/dict/rocketnet_fuzz_connect_token.dict"}'
          - '{"target":"rocketnet_fuzz_receive_structured","source":"fuzz/rocketnet_fuzz_receive_structured.cpp","seeds":"fuzz/corpus_receive_structured","dict":"fuzz/dict/rocketnet_fuzz_receive_structured.dict"}'
          - '{"target":"rocketnet_fuzz_message","source":"fuzz/rocketnet_fuzz_message.cpp","seeds":"fuzz/corpus_message","dict":"fuzz/dict/rocketnet_fuzz_message.dict"}'
          - '{"target":"rocketnet_fuzz_token_private","source":"fuzz/rocketnet_fuzz_token_private.cpp","seeds":"fuzz/corpus_token_private","dict":"fuzz/dict/rocketnet_fuzz_token_private.dict"}'
          - '{"target":"rocketnet_fuzz_round_trip","source":"fuzz/rocketnet_fuzz_round_trip.cpp","seeds":"fuzz/corpus_round_trip","dict":"fuzz/dict/rocketnet_fuzz_round_trip.dict"}'
          - '{"target":"rocketnet_fuzz_config","source":"fuzz/rocketnet_fuzz_config.cpp","seeds":"fuzz/corpus_config","dict":"fuzz/dict/rocketnet_fuzz_config.dict"}'
          - '{"target":"rocketnet_fuzz_server_transport","source":"fuzz/rocketnet_fuzz_server_transport.cpp","seeds":"fuzz/corpus_server_transport","dict":"fuzz/dict/rocketnet_fuzz_server_transport.dict"}'
          - '{"target":"rocketnet_fuzz_client_transport","source":"fuzz/rocketnet_fuzz_client_transport.cpp","seeds":"fuzz/corpus_client_transport","dict":"fuzz/dict/rocketnet_fuzz_client_transport.dict"}'
          - '{"target":"rocketnet_fuzz_session","source":"fuzz/rocketnet_fuzz_session.cpp","seeds":"fuzz/corpus_session","dict":"fuzz/dict/rocketnet_fuzz_session.dict"}'
    concurrency:
      group: fuzz-nightly-windows-${{ matrix.ref }}-${{ fromJSON(matrix.leg).target }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Find the clang-cl that carries libFuzzer
        run: |
          set -euo pipefail
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          vs=""
          if [ -x "$vswhere" ]; then
            vs=$("$vswhere" -latest -products '*' -property installationPath | tr -d '\r')
          fi
          clang_cl=""
          [ -n "$vs" ] && clang_cl="$(cygpath "$vs")/VC/Tools/Llvm/x64/bin/clang-cl.exe"
          if [ -z "$clang_cl" ] || [ ! -x "$clang_cl" ]; then
            echo "TOOL-MISSING clang-cl (Visual Studio ClangCL toolset, any) (VC/Tools/Llvm/x64/bin under ${vs:-no Visual Studio}) on $RUNNER_NAME"
            exit 1
          fi
          runtime="$(cygpath "$("$clang_cl" -print-resource-dir | tr -d '\r')")/lib/windows"
          if [ ! -f "$runtime/clang_rt.fuzzer-x86_64.lib" ] || [ ! -f "$runtime/clang_rt.asan_dynamic-x86_64.dll" ]; then
            echo "TOOL-MISSING clang-cl with clang_rt.fuzzer-x86_64.lib and clang_rt.asan_dynamic-x86_64.dll (any) ($runtime) on $RUNNER_NAME"
            exit 1
          fi
          "$clang_cl" --version
          echo "ROCKETNET_FUZZ_CLANG_CL=$clang_cl" >> "$GITHUB_ENV"
          echo "ROCKETNET_FUZZ_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      - name: Check the fleet's build dependencies are present
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: corpus/${{ fromJSON(matrix.leg).target }}
          key: fuzz-corpus-windows-${{ fromJSON(matrix.leg).target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-windows-${{ fromJSON(matrix.leg).target }}-

      # clang-cl's dash spellings, not /DWIN32 and /fsanitize: Git Bash
      # rewrites a leading-slash argument into a Windows path. The compiler
      # check builds a static library: linked as a program, its object carries
      # the fuzzer-no-link and ASan references the Visual Studio link has no
      # runtime for, and CMake calls the compiler broken.
      - name: Configure the instrumented library
        run: >
          cmake -B build-fuzz -T ClangCL -A x64
          -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          "-DCMAKE_C_FLAGS=-DWIN32 -D_WINDOWS -D_DISABLE_STRING_ANNOTATION -D_DISABLE_VECTOR_ANNOTATION -fsanitize=address -fsanitize=fuzzer-no-link"
          "-DCMAKE_CXX_FLAGS=-DWIN32 -D_WINDOWS -D_DISABLE_STRING_ANNOTATION -D_DISABLE_VECTOR_ANNOTATION -EHsc -fsanitize=address -fsanitize=fuzzer-no-link"

      - name: Build the instrumented library
        run: cmake --build build-fuzz --config Debug --target rocketnet_dev --parallel 4

      - name: Build ${{ fromJSON(matrix.leg).target }}
        run: |
          set -euo pipefail
          mkdir -p bin
          "$ROCKETNET_FUZZ_CLANG_CL" -nologo -Zi -O1 -MT -std:c++17 -EHsc -utf-8 -fp:precise \
            -W4 -WX -Wshadow -Wconversion -Wsign-conversion -Wcast-qual -Wformat=2 -Wundef -Wdouble-promotion \
            -DWIN32 -D_WINDOWS -D_DISABLE_STRING_ANNOTATION -D_DISABLE_VECTOR_ANNOTATION -DROCKETNET_DEV=1 \
            -fsanitize=fuzzer,address \
            -Isodium -Isdk -Itest "${{ fromJSON(matrix.leg).source }}" build-fuzz/Debug/rocketnet_dev.lib \
            -fuse-ld=lld "-Fe:bin/${{ fromJSON(matrix.leg).target }}.exe"
          cp "$ROCKETNET_FUZZ_RUNTIME_DIR/clang_rt.asan_dynamic-x86_64.dll" bin/

      # LeakSanitizer is not part of AddressSanitizer on Windows: the runtime
      # has no leak checker there and refuses detect_leaks=1 as unsupported, so
      # this leg runs without it; leaks stay checked on the Linux leg.
      - name: Fuzz ${{ fromJSON(matrix.leg).target }}
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -euo pipefail
          mkdir -p "corpus/${{ fromJSON(matrix.leg).target }}"
          T="${{ github.event.inputs.max_total_time || '900' }}"
          echo "fuzzing ${{ fromJSON(matrix.leg).target }} for ${T}s with ${{ fromJSON(matrix.leg).dict }}"
          ./"bin/${{ fromJSON(matrix.leg).target }}.exe" \
            "corpus/${{ fromJSON(matrix.leg).target }}" "${{ fromJSON(matrix.leg).seeds }}" \
            -dict="${{ fromJSON(matrix.leg).dict }}" \
            -max_total_time="$T" -print_final_stats=1 -rss_limit_mb=4096 -timeout=25

      # GitHub expressions have no replace(): the artifact name's ref slug ('/' -> '-') is made here
      - name: Artifact name for the ref
        id: refslug
        if: failure()
        env:
          REF: ${{ matrix.ref }}
        run: echo "slug=${REF//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashes-windows-${{ fromJSON(matrix.leg).target }}-${{ steps.refslug.outputs.slug }}
          path: |
            crash-*
            oom-*
            timeout-*
            leak-*
          if-no-files-found: ignore

  # MemorySanitizer over the same ten-target matrix, Linux only (row 262's
  # macOS and Windows cells are n and -: MSan is a Linux instrument). Every
  # linked object must be instrumented: the development library, vendored
  # sodium included, is configured with the MSan flags and the instrumented
  # libc++ headers exactly as tools/run_msan.sh does, and each target links
  # against that archive with -fsanitize=fuzzer-no-link,memory, origins
  # tracked, and the instrumented libc++.
  #
  # libFuzzer's engine is built here against that same libc++ and with MSan.
  # The engine clang ships (libclang_rt.fuzzer-<arch>.a) is compiled against
  # libstdc++, so a target whose objects use the instrumented libc++ cannot
  # resolve its std::__cxx11 references; forced to link anyway, its
  # uninstrumented std::string writes leave poison that the instrumented
  # libc++ then reports. Compiling compiler-rt/lib/fuzzer at the release
  # pinned by tools/build_msan_libcxx.sh, with the same libc++ headers and
  # the same MSan flags, gives an engine whose every write updates the shadow.
  # The source tarball is the one that script verifies, at its pinned sha256.
  #
  # A runner without /opt/msan-libcxx-<clang version> fails with a
  # TOOL-MISSING line naming it. Any MemorySanitizer report fails the leg;
  # tools/msan_known.txt belongs to the unit gate and is not an allowlist for
  # fuzzing. The corpus cache is separate from the asan leg's (corpus-msan/).
  fuzz-msan:
    name: nightly fuzz MSan (${{ fromJSON(matrix.leg).target }})
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
        leg:
          - '{"target":"rocketnet_fuzz","source":"fuzz/rocketnet_fuzz.cpp","seeds":"fuzz/corpus","dict":"fuzz/rocketnet.dict"}'
          - '{"target":"rocketnet_fuzz_connect_token","source":"fuzz/rocketnet_fuzz_connect_token.cpp","seeds":"fuzz/corpus_connect_token","dict":"fuzz/rocketnet.dict"}'
          - '{"target":"rocketnet_fuzz_receive_structured","source":"fuzz/rocketnet_fuzz_receive_structured.cpp","seeds":"fuzz/corpus_receive_structured","dict":"fuzz/rocketnet.dict"}'
          - '{"target":"rocketnet_fuzz_message","source":"fuzz/rocketnet_fuzz_message.cpp","seeds":"fuzz/corpus_message","dict":"fuzz/rocketnet.dict"}'
          - '{"target":"rocketnet_fuzz_token_private","source":"fuzz/rocketnet_fuzz_token_private.cpp","seeds":"fuzz/corpus_token_private","dict":"fuzz/dict/rocketnet_fuzz_token_private.dict"}'
          - '{"target":"rocketnet_fuzz_round_trip","source":"fuzz/rocketnet_fuzz_round_trip.cpp","seeds":"fuzz/corpus_round_trip","dict":"fuzz/dict/rocketnet_fuzz_round_trip.dict"}'
          - '{"target":"rocketnet_fuzz_config","source":"fuzz/rocketnet_fuzz_config.cpp","seeds":"fuzz/corpus_config","dict":"fuzz/dict/rocketnet_fuzz_config.dict"}'
          - '{"target":"rocketnet_fuzz_server_transport","source":"fuzz/rocketnet_fuzz_server_transport.cpp","seeds":"fuzz/corpus_server_transport","dict":"fuzz/dict/rocketnet_fuzz_server_transport.dict"}'
          - '{"target":"rocketnet_fuzz_client_transport","source":"fuzz/rocketnet_fuzz_client_transport.cpp","seeds":"fuzz/corpus_client_transport","dict":"fuzz/dict/rocketnet_fuzz_client_transport.dict"}'
          - '{"target":"rocketnet_fuzz_session","source":"fuzz/rocketnet_fuzz_session.cpp","seeds":"fuzz/corpus_session","dict":"fuzz/dict/rocketnet_fuzz_session.dict"}'
    concurrency:
      group: fuzz-nightly-msan-${{ matrix.ref }}-${{ fromJSON(matrix.leg).target }}
      cancel-in-progress: true
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Check the MSan-instrumented libc++
        id: msan-clang
        shell: bash
        run: |
          set -euo pipefail
          clang_version=$(clang++ -dumpversion)
          echo "version=$clang_version" >> "$GITHUB_OUTPUT"
          libcxx=/opt/msan-libcxx-"$clang_version"
          if [ ! -f "$libcxx/lib/libc++.so" ] || [ ! -f "$libcxx/include/c++/v1/__config_site" ]; then
            echo "TOOL-MISSING msan-libcxx $clang_version (no MSan-instrumented libc++ in $libcxx; bash tools/build_msan_libcxx.sh) on ${RUNNER_NAME:-$(hostname)}"
            exit 1
          fi
          echo "MSAN_LIBCXX=$libcxx" >> "$GITHUB_ENV"

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ clang clang++ xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      # the engine is C++ built against /opt/msan-libcxx-<clang version>,
      # and the fleet's runners do not share one clang (18.1.3 on
      # one Linux x64 host, 21.1.8 on another). An engine keyed
      # only by OS and arch is reused across them and fails to link, so the
      # clang version is part of the key and of the prefix restore-key.
      - name: Restore the MSan libFuzzer engine
        uses: actions/cache@v4
        with:
          path: .msan-libfuzzer
          key: msan-libfuzzer-${{ runner.os }}-${{ runner.arch }}-${{ steps.msan-clang.outputs.version }}-v1
          restore-keys: |
            msan-libfuzzer-${{ runner.os }}-${{ runner.arch }}-${{ steps.msan-clang.outputs.version }}-

      - name: Build the MSan libFuzzer engine
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .msan-libfuzzer/libFuzzer.a ]; then
            echo "using the cached MSan libFuzzer engine"
            exit 0
          fi
          version=$(clang++ -dumpversion)
          # the tarball and pins tools/build_msan_libcxx.sh verifies
          case "$version" in
            18.1.3) sha256=2929f62d69dec0379e529eb632c40e15191e36f3bd58c2cb2df0413a0dc48651 ;;
            21.1.8) sha256=4633a23617fa31a3ea51242586ea7fb1da7140e426bd62fc164261fe036aa142 ;;
            *) echo "TOOL-MISSING llvm-project source pin for clang $version (add it to tools/build_msan_libcxx.sh) on ${RUNNER_NAME:-$(hostname)}"; exit 1 ;;
          esac
          work=.msan-libfuzzer
          mkdir -p "$work"
          tarball="llvm-project-$version.src.tar.xz"
          curl -fsSL -o "$work/$tarball" "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$tarball"
          echo "$sha256  $work/$tarball" | sha256sum -c -
          tar -xJf "$work/$tarball" -C "$work"
          src="$work/llvm-project-$version.src/compiler-rt/lib/fuzzer"
          mkdir -p "$work/obj"
          for f in "$src"/Fuzzer*.cpp; do
            clang++ -O1 -g -std=c++17 -fPIC -ffp-contract=off \
              -fsanitize=memory -fsanitize-memory-track-origins=2 -fno-omit-frame-pointer \
              -nostdinc++ -isystem "$MSAN_LIBCXX/include/c++/v1" -I "$src" \
              -c "$f" -o "$work/obj/$(basename "${f%.cpp}").o"
          done
          ar rcs "$work/libFuzzer.a" "$work/obj"/*.o
          rm -rf "$work/llvm-project-$version.src" "$work/$tarball"

      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: corpus-msan/${{ fromJSON(matrix.leg).target }}
          key: fuzz-corpus-msan-${{ fromJSON(matrix.leg).target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-msan-${{ fromJSON(matrix.leg).target }}-

      - name: Configure the instrumented library
        run: >
          cmake -B build-fuzz-msan
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_FLAGS="-O1 -fsanitize=fuzzer-no-link,memory -fsanitize-memory-track-origins=2 -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-O1 -fsanitize=fuzzer-no-link,memory -fsanitize-memory-track-origins=2 -fno-omit-frame-pointer -nostdinc++ -isystem ${{ env.MSAN_LIBCXX }}/include/c++/v1"

      - name: Build the instrumented library
        run: cmake --build build-fuzz-msan --target rocketnet_dev --parallel

      - name: Build ${{ fromJSON(matrix.leg).target }}
        run: |
          set -euo pipefail
          mkdir -p bin
          clang++ -g -O1 -std=c++17 \
            -ffp-contract=off \
            -DROCKETNET_DEV=1 \
            -fsanitize=fuzzer-no-link,memory -fsanitize-memory-track-origins=2 -fno-omit-frame-pointer \
            -nostdinc++ -isystem "${{ env.MSAN_LIBCXX }}/include/c++/v1" \
            -Isodium -Isdk -Itest "${{ fromJSON(matrix.leg).source }}" build-fuzz-msan/librocketnet_dev.a \
            .msan-libfuzzer/libFuzzer.a \
            -stdlib=libc++ -L"${{ env.MSAN_LIBCXX }}/lib" -Wl,-rpath,"${{ env.MSAN_LIBCXX }}/lib" \
            -lbpf -lxdp -luring -lpthread -lm \
            -o "bin/${{ fromJSON(matrix.leg).target }}"

      - name: Fuzz ${{ fromJSON(matrix.leg).target }}
        env:
          MSAN_OPTIONS: halt_on_error=1:print_stats=0
        run: |
          set -euo pipefail
          mkdir -p "corpus-msan/${{ fromJSON(matrix.leg).target }}"
          T="${{ github.event.inputs.max_total_time || '900' }}"
          echo "fuzzing ${{ fromJSON(matrix.leg).target }} for ${T}s under MSan with ${{ fromJSON(matrix.leg).dict }}"
          ./"bin/${{ fromJSON(matrix.leg).target }}" \
            "corpus-msan/${{ fromJSON(matrix.leg).target }}" "${{ fromJSON(matrix.leg).seeds }}" \
            -dict="${{ fromJSON(matrix.leg).dict }}" \
            -max_total_time="$T" -print_final_stats=1 -rss_limit_mb=4096 -timeout=25

      - name: Artifact name for the ref
        id: refslug
        if: failure()
        shell: bash
        env:
          REF: ${{ matrix.ref }}
        run: echo "slug=${REF//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashes-msan-${{ fromJSON(matrix.leg).target }}-${{ steps.refslug.outputs.slug }}
          path: |
            crash-*
            oom-*
            timeout-*
            leak-*
          if-no-files-found: ignore

  # Source coverage of the campaign, one job per OS after the matrix, on the
  # Linux and macOS runners. tools/fuzz_coverage.sh builds the replay drivers
  # with source-based coverage, runs them over each target's committed corpus
  # plus pseudo-random inputs, and appends its per-area table as Markdown to
  # the job summary through FUZZ_COV_SUMMARY (the script's default build dir is
  # per job, so Linux and macOS do not share one).
  coverage:
    name: nightly fuzz coverage (Linux)
    needs: fuzz
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 45
    steps:

      - uses: actions/checkout@v4

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ clang clang++ xxd pkg-config llvm-profdata llvm-cov; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Fuzz coverage
        run: CC=clang CXX=clang++ FUZZ_COV_SUMMARY="$GITHUB_STEP_SUMMARY" tools/fuzz_coverage.sh

  coverage-macos:
    name: nightly fuzz coverage (macOS)
    needs: fuzz-macos
    runs-on: [self-hosted, macOS, ARM64, rocketnet-macos]
    timeout-minutes: 45
    steps:

      - uses: actions/checkout@v4

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake xxd python3; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Fuzz coverage
        run: CC=clang CXX=clang++ FUZZ_COV_SUMMARY="$GITHUB_STEP_SUMMARY" tools/fuzz_coverage.sh
