# The static-analysis gate for the sdk.
#
# WHAT IT IS. Two jobs. The second, `static analysis (clang-tidy, cppcheck)`,
# runs tools/run_tidy.py under the same baseline rules (see the job). The
# first: the gcc -fanalyzer findings are compared against
# tools/static_baseline.txt. A finding that is present now but not in the
# baseline fails the pull request. A finding that is baselined but gone also
# fails it: the baseline only shrinks, and the stale line is deleted in the
# same pull request that removes the finding. The report prints the baseline
# size per check.
#
# WHY IT IS A GATE AND NOT A WATCH. A defect this tool proves -- a null
# dereference, a lifetime mistake, an out-of-bounds read -- is a defect on
# THIS commit. Nothing here waits on a clock or finds only what an hour finds,
# so it runs per commit beside ci.yml, not in a nightly tier.
#
# WHAT IT COVERS. gcc -fanalyzer runs over the parser translation units: every
# sdk/*.cpp that includes rocketnet_read_write.h, plus the parser files named
# in the card (base64, fragment, message, ack, replay, connect_token). The
# analyzer walks these paths interprocedurally, which is where wire parsing
# defects live.
#
# No source file is changed by this card: the first baseline records the
# findings the tool already produces on this commit.

name: static analysis

on:
  push:
    # main and the branch v1.0 lands on, named by name: a sprint/** filter
    # would start this gate on every worker branch push as well.
    branches: [ main, sprint/rocketnet-proof ]
  pull_request:
  workflow_dispatch:

# a superseded commit's run is not a gate on anything -- the gate is the head
# of the branch -- so it yields its runners to the run that replaced it
concurrency:
  # each main commit queues in its own group: pending runs on main are
  # replaced, not queued, so a burst of landings leaves every commit a verdict
  group: static-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # main never cancels a run in progress: every merge gets a verdict.
  # Branches and PRs still cancel a superseded run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:

  static:
    name: static analysis (gcc -fanalyzer)
    # the same fleet runners ci.yml uses; a self-hosted runner comes
    # provisioned, so the apt step runs only for a hosted fallback
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 30
    steps:

      - uses: actions/checkout@v4

      - name: Fleet-runner lint
        run: python3 scripts/check-fleet-runners

      - name: Fleet-runner lint selftest
        run: bash scripts/check-fleet-runners-selftest

      - name: Install dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake build-essential libbpf-dev libxdp-dev libsodium-dev xxd

      # compile_commands.json is what run_static.py reads to rebuild the
      # parser files for gcc -fanalyzer with the exact per-file flags.
      - name: Configure with compile_commands.json
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run the static gate
        run: python3 tools/run_static.py

  # clang-tidy (checks from .clang-tidy) and cppcheck over every sdk/*.cpp,
  # rocketnet_tests.cpp included, compared with tools/tidy_baseline.txt and
  # tools/cppcheck_baseline.txt by tools/run_tidy.py. The same baseline rules
  # as the gcc job: a new finding fails, and a baselined finding that is gone
  # fails until its line is deleted (the baselines only shrink). The fleet
  # runners carry clang-tidy-18 and cppcheck 2.13; a runner without them
  # prints a TOOL-MISSING line and fails rather than passing unanalyzed.
  tidy:
    name: static analysis (clang-tidy, cppcheck)
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 15
    steps:

      - uses: actions/checkout@v4

      - name: Install dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake build-essential clang clang-tidy-18 cppcheck libbpf-dev libxdp-dev libsodium-dev xxd

      # the same Release configure the gcc job uses; run_tidy.py builds the
      # generated xdp header itself and analyzes the first compile command
      # of each sdk/*.cpp
      - name: Configure with compile_commands.json
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run the clang-tidy and cppcheck gate
        run: python3 tools/run_tidy.py --jobs 4
