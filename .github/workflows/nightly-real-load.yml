# The nightly real load: 1000 real clients against one real server, once per
# server transport, over the LAN. Each cell is one run of scripts/lan-proof
# (docs/LAN-PROOF.md): the server alone on its machine pinned to the cell's
# transport, the clients in shards of at most 250 on other machines, all
# traffic across the switch, the proof load of docs/LOAD_SPLIT.md, and the
# merger (tools/check_split_load.py --load proof) on the collected logs.
# Nothing else on main runs lan-proof: nightly-soak.yml's many-client load is
# colocated on one host.
#
# Cells, one at a time, in this order:
#   xdp        AF_XDP, bare metal on the XDP bench's test port (--xdp-uplink),
#              with the self-detach timer lan-proof arms before the attach
#   gso        Linux sockets, segmentation offload
#   io_uring   Linux io_uring
#   iocp       Windows, Linux clients; the server holds the Windows bench's
#   rio        exclusive CI lock for its whole life, as lan-proof does
#
# The machines come from files the fleet deploys on the runner, never from
# this repository: an inventory in scripts/lan-proof.inventory.example's form
# per group, in ~/nova-bench/real-load/ on the runner (inventory-xdp.tsv,
# inventory-linux.tsv for gso and io_uring, inventory-windows.tsv for iocp and
# rio) and xdp-uplink there, the XDP test port. A group without its file, or
# with a machine this runner cannot reach by non-interactive ssh, fails its
# cells by name (lan-proof: OWED ...); it is never a skip.
#
# Per cell, tools/real_load_report.py prints the server call times (p50, p99
# upper bounds and maximum from split_server_call; p999 when the harness
# prints it), connects, disconnects, messages each way and the merger's
# unreliable_lost. The rows go to the job summary and the artifact. A cell
# fails the night when fewer than every client connected, on any disconnect or
# timeout, when the proof cell is not PASS, or when the run left no server
# receipt. The call times are reported, never gated.
#
# Its last runs, from its branch (2026-10-31, run 41221699834): every cell red
# "lan-proof: OWED: this runner has no inventory ..." -- the fleet files were
# never deployed. Brought to main 2026-11-12 from branch nightly/real-load,
# where its cron never fired; it stays red by name until they are.

name: nightly-real-load

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Test execution has no repository wall-clock cap; GitHub still limits
# self-hosted jobs to five days.
env:
  ROCKETNET_NIGHTLY_NO_TIMEOUT: '1'

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  real-load:
    name: 1000 clients over the LAN, per server transport
    runs-on: [self-hosted, Linux, X64, rocketnet-quiet]
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    # keyed by the event as well as the ref: a dispatch never cancels or
    # displaces the scheduled night, and the night never cancels a dispatch
    # (lan-proof itself refuses a cell whose machines are busy)
    concurrency:
      group: nightly-real-load-${{ github.event_name }}-${{ matrix.ref }}
      cancel-in-progress: false
    env:
      DURATION: "300"
      CLIENTS: "1000"
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref == github.ref_name && github.sha || matrix.ref }}

      - name: Report unit cases
        run: |
          set -euo pipefail
          python3 tools/test_real_load_report.py -v

      - name: Run the cells
        run: |
          set -euo pipefail
          # a refused or failed cell does not end the loop: every cell runs,
          # and the Report step fails the night naming each one
          fleet="$HOME/nova-bench/real-load"
          head=$(git rev-parse HEAD)
          base="$RUNNER_TEMP/real-load"
          rm -rf "$base"
          mkdir -p "$base"
          echo "$head" > "$base/head.txt"
          index=0
          for cell in xdp gso io_uring iocp rio; do
            dir="$base/$cell"
            mkdir -p "$dir"
            case "$cell" in
              xdp) inventory_file=$fleet/inventory-xdp.tsv ;;
              gso|io_uring) inventory_file=$fleet/inventory-linux.tsv ;;
              iocp|rio) inventory_file=$fleet/inventory-windows.tsv ;;
            esac
            if [ ! -s "$inventory_file" ]; then
              echo "lan-proof: OWED: this runner has no inventory $inventory_file" | tee "$dir/lan-proof.console"
              continue
            fi
            cp "$inventory_file" "$base/$cell.inventory"
            # every machine answers ssh before anything is built
            unreachable=""
            while read -r label ssh_name _; do
              case "$label" in ''|\#*) continue ;; esac
              if ! timeout 30 ssh -o BatchMode=yes -o ConnectTimeout=10 "$ssh_name" true >/dev/null 2>&1; then
                unreachable="$unreachable $label"
              fi
            done < "$base/$cell.inventory"
            if [ -n "$unreachable" ]; then
              echo "lan-proof: OWED: no non-interactive ssh from this runner to$unreachable" | tee "$dir/lan-proof.console"
              continue
            fi
            extra=()
            if [ "$cell" = "xdp" ]; then
              xdp_uplink=""
              if [ -s "$fleet/xdp-uplink" ]; then
                xdp_uplink=$(head -n 1 "$fleet/xdp-uplink" | tr -d '[:space:]')
              fi
              if [ -z "$xdp_uplink" ]; then
                echo "lan-proof: OWED: this runner has no XDP test port in $fleet/xdp-uplink" | tee "$dir/lan-proof.console"
                continue
              fi
              extra=(--xdp-uplink "$xdp_uplink")
            fi
            index=$(( index + 1 ))
            # 16 hex digits: the start second, the cell index, the run number
            run_id=$(printf '%010x%02x%04x' "$(date +%s)" "$index" "$(( GITHUB_RUN_NUMBER % 65536 ))")
            echo "::group::cell $cell run $run_id"
            if ! scripts/lan-proof --inventory "$base/$cell.inventory" --cell "$cell" \
              --duration "$DURATION" --clients "$CLIENTS" --commit "$head" \
              --run-dir "$dir" --run-id "$run_id" "${extra[@]}" 2>&1 | tee "$dir/lan-proof.console"; then
              echo "lan-proof: cell $cell exited non-zero; the report names its reason"
            fi
            echo "::endgroup::"
          done

      - name: Report
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/real-load"
          if [ -f "$base/head.txt" ]; then head=$(cat "$base/head.txt"); else head=$(git rev-parse HEAD); fi
          status=0
          python3 tools/real_load_report.py --out "$base/report" --head "$head" \
            --date "$(date -u +%Y-%m-%dT%H:%MZ)" \
            xdp="$base/xdp" gso="$base/gso" io_uring="$base/io_uring" \
            iocp="$base/iocp" rio="$base/rio" || status=$?
          if [ -f "$base/report/real-load.md" ]; then cat "$base/report/real-load.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"

      - name: Upload the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: real-load-${{ github.run_id }}
          path: ${{ runner.temp }}/real-load
          retention-days: 90
          if-no-files-found: warn
