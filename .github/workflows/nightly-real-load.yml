# The nightly real load: 1000 real clients against one real server, once per
# server transport, over the LAN. Each cell is one run of scripts/lan-proof
# (docs/LAN-PROOF.md): the server alone on its machine pinned to the cell's
# transport, the clients in shards of at most 250 on other machines, all
# traffic across the switch, the proof load of docs/LOAD_SPLIT.md, and the
# merger (tools/check_split_load.py --load proof) on the collected logs. The
# load programs are tests/load/load_split.c over tests/load/load.c.
#
# Cells, one at a time, in this order:
#   xdp        AF_XDP, bare metal on the XDP bench's test port (--xdp-uplink),
#              with the self-detach timer lan-proof arms before the attach
#   gso        Linux sockets, segmentation offload
#   io_uring   Linux io_uring
#   iocp       Windows server, Linux clients; the server holds the Windows
#   rio        bench's exclusive CI lock for its whole life, as lan-proof does
# msgx, the macOS server transport, has no cell: no inventory names a macOS
# server machine yet.
#
# The coordinator here runs only ssh, scp, the merger and the report. The
# machines come from files the fleet deploys on the quiet runners, never from
# this repository: an inventory in scripts/lan-proof.inventory.example's form
# per group, in ~/nova-bench/real-load/ (inventory-xdp.tsv, inventory-linux.tsv
# for gso and io_uring, inventory-windows.tsv for iocp and rio) and
# xdp-uplink there, the XDP test port. A group without its file, or with a
# machine that does not answer non-interactive ssh, fails its cells by name.
#
# Per cell, tools/real_load_report prints the server call times (p99 and p999
# upper bounds and maximum for server_update and server_send_packets, from
# split_server_call), connects, disconnects, messages sent and received each
# way and the merger's unreliable_lost. The rows go to the job summary and the
# real-load artifact (TSV, JSON, Markdown, and every cell's run directory). A
# cell fails the night when fewer than every client connected, on any
# disconnect or timeout, or when the proof cell is not PASS. The call times
# are reported, never gated.
#
# Schedule: 03:00 UTC, before the other nightlies. Five cells of 300 seconds
# plus the builds on every machine take about an hour; lan-proof refuses a
# cell while any of its machines is busy (load at or above half its cores),
# so a host shared with another job fails that cell by name rather than
# measuring noise.

name: nightly-real-load

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-load:
    name: 1000 clients over the LAN, per server transport
    runs-on: [self-hosted, Linux, X64, fleet, rocketnet-quiet]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    concurrency:
      group: nightly-real-load
      cancel-in-progress: false
    env:
      DURATION: "300"
      CLIENTS: "1000"
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Report tool cases
        run: |
          if ! command -v go >/dev/null 2>&1; then echo "TOOL-MISSING go (any) (missing) on $RUNNER_NAME"; exit 1; fi
          cd tools/real_load_report && go test -count=1 ./... && go build -o "$RUNNER_TEMP/real_load_report" .

      - name: Run the cells
        shell: bash
        run: |
          # a refused or failed cell must not end the loop: every cell runs,
          # and the Report step fails the night by name
          set -u
          fleet="$HOME/nova-bench/real-load"
          head=$(git rev-parse HEAD)
          base="$RUNNER_TEMP/real-load"
          rm -rf "$base"
          mkdir -p "$base"
          echo "$head" > "$base/head.txt"
          index=0
          for cell in xdp gso io_uring iocp rio; do
            dir="$base/$cell"
            mkdir -p "$dir"
            case "$cell" in
              xdp) inventory_file=$fleet/inventory-xdp.tsv ;;
              gso|io_uring) inventory_file=$fleet/inventory-linux.tsv ;;
              iocp|rio) inventory_file=$fleet/inventory-windows.tsv ;;
            esac
            if [ ! -s "$inventory_file" ]; then
              echo "lan-proof: OWED: this runner has no inventory $inventory_file" | tee "$dir/lan-proof.console"
              continue
            fi
            cp "$inventory_file" "$base/$cell.inventory"
            # every machine answers ssh before anything is built
            unreachable=""
            while read -r label ssh_name _; do
              case "$label" in ''|\#*) continue ;; esac
              timeout 30 ssh -n -o BatchMode=yes -o ConnectTimeout=10 "$ssh_name" true >/dev/null 2>&1 ||
                unreachable="$unreachable $label"
            done < "$base/$cell.inventory"
            if [ -n "$unreachable" ]; then
              echo "lan-proof: OWED: no non-interactive ssh from this runner to$unreachable" | tee "$dir/lan-proof.console"
              continue
            fi
            extra=()
            if [ "$cell" = "xdp" ]; then
              xdp_uplink=$(head -n 1 "$fleet/xdp-uplink" 2>/dev/null | tr -d '[:space:]')
              if [ -z "$xdp_uplink" ]; then
                echo "lan-proof: OWED: this runner has no XDP test port in $fleet/xdp-uplink" | tee "$dir/lan-proof.console"
                continue
              fi
              extra=(--xdp-uplink "$xdp_uplink")
            fi
            index=$(( index + 1 ))
            # 16 hex digits: the start second, the cell index, the run number
            run_id=$(printf '%010x%02x%04x' "$(date +%s)" "$index" "$(( GITHUB_RUN_NUMBER % 65536 ))")
            echo "::group::cell $cell run $run_id"
            scripts/lan-proof --inventory "$base/$cell.inventory" --cell "$cell" \
              --duration "$DURATION" --clients "$CLIENTS" --commit "$head" \
              --run-dir "$dir" --run-id "$run_id" "${extra[@]}" 2>&1 | tee "$dir/lan-proof.console" ||
              echo "lan-proof: cell $cell exited non-zero; the report names its reason"
            echo "::endgroup::"
          done

      - name: Report
        if: always()
        shell: bash
        run: |
          set -u
          base="$RUNNER_TEMP/real-load"
          head=$(cat "$base/head.txt" 2>/dev/null || git rev-parse HEAD)
          status=0
          "$RUNNER_TEMP/real_load_report" --out "$base/report" --head "$head" \
            --date "$(date -u +%Y-%m-%dT%H:%MZ)" \
            xdp="$base/xdp" gso="$base/gso" io_uring="$base/io_uring" \
            iocp="$base/iocp" rio="$base/rio" || status=$?
          cat "$base/report/real-load.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit "$status"

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: real-load-${{ github.run_id }}
          path: ${{ runner.temp }}/real-load
          retention-days: 90
          if-no-files-found: warn
