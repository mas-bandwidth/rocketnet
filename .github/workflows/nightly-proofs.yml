# Nightly CBMC proofs. The nightly proofs take minutes to hours. A failing
# proof records a failed job: this workflow is a gate on the night, and a
# red result must show as a failed run, never as a passing "not a gate"
# note. The arithmetic leaf proofs remain in cbmc.yml.
#
# One job per target, run side by side: each reader directory's proof.mk
# (make print-nightly-readers) and each of replay-near-4096's thirteen path
# partitions plus its completeness check (make print-replay-near-partitions).
# A red job is that target's own verdict, so a regression in one reader shows
# while a standing HOLD elsewhere stays red. The nightly opt-out removes
# repository execution caps; memory and symbolic proof bounds are unchanged.
# The schedule is before fuzz-nightly.yml, so a red night is on the estate
# when the morning starts.

name: Nightly proofs

on:
  schedule:
    - cron: "30 5 * * *"   # daily at 05:30 UTC
  workflow_dispatch:

permissions:
  contents: read

# Test execution has no repository wall-clock cap; GitHub still limits
# self-hosted jobs to five days.
env:
  ROCKETNET_NIGHTLY_NO_TIMEOUT: '1'

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  # The execution watchdogs the proofs run under: run_with_timeout.sh (every
  # replay-near partition below) and run_bounded.sh (the manual ack-run ESBMC
  # targets). Default mode still expires, the nightly opt-out keeps the exit
  # code past the old limit, and the memory limit holds in both modes. Its own
  # job, so a red watchdog does not stop the proofs and the proofs' red does
  # not hide it.
  watchdog:
    name: proof watchdog controls
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Proof watchdog controls pass
        run: python3 tools/test_proof_timeouts.py -v

  plan:
    name: nightly proof targets
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 7200
    outputs:
      readers: ${{ steps.list.outputs.readers }}
      partitions: ${{ steps.list.outputs.partitions }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: List the targets
        id: list
        run: |
          set -euo pipefail
          # the lists equal proofs/cbmc/NIGHTLY-TARGETS, or no matrix (VERIFY-6 A21)
          bash proofs/cbmc/check_nightly_targets.sh --self-test
          bash proofs/cbmc/check_nightly_targets.sh
          json() { python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))'; }
          readers="$(make -s -C proofs/cbmc print-nightly-readers | json)"
          partitions="$(make -s -C proofs/cbmc print-replay-near-partitions | json)"
          echo "readers=$readers" >> "$GITHUB_OUTPUT"
          echo "partitions=$partitions" >> "$GITHUB_OUTPUT"
          echo "readers: $readers"
          echo "partitions: $partitions"

  # proofs-connect_token executes seven harnesses. The nightly opt-in removes
  # their elapsed caps; each target retains its solver memory and proof bounds.
  reader:
    name: nightly ${{ matrix.target }}
    needs: plan
    runs-on: [self-hosted, Linux, X64, fleet, long]
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.readers) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # The fleet installs ESBMC only in ~/sdk/bin, which is not on the runner
      # service's PATH. Append it (never prepend) for this job's later steps,
      # so a system tool always wins over a copy there.
      - name: Append the fleet sdk tools to the end of PATH
        run: echo "PATH=$PATH:$HOME/sdk/bin" >> "$GITHUB_ENV"

      - name: Check the pinned tools are present
        run: |
          set -euo pipefail
          bash proofs/cbmc/check_tool_versions.sh --self-test
          bash proofs/cbmc/check_tool_versions.sh cbmc=CBMC cadical=CADICAL esbmc=ESBMC

      - name: Run ${{ matrix.target }}
        run: |
          set -o pipefail
          make -C proofs/cbmc ${{ matrix.target }} 2>&1 | tee proofs/cbmc/nightly-output.txt

      - name: Upload the proof output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: nightly-proofs-${{ matrix.target }}
          path: proofs/cbmc/nightly-output.txt
          if-no-files-found: ignore

  # A partition is two runs (the proof and its reachability control), without
  # an elapsed cap. Each run may take CBMC_REPLAY_MEMORY_KB (16 GB), so at
  # most four run at once on the long
  # runners, which share hosts.
  replay-near:
    name: nightly ${{ matrix.target }}
    needs: plan
    runs-on: [self-hosted, Linux, X64, fleet, long]
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.partitions) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Check the pinned tools are present
        run: |
          set -euo pipefail
          bash proofs/cbmc/check_tool_versions.sh --self-test
          bash proofs/cbmc/check_tool_versions.sh cbmc=CBMC cadical=CADICAL

      - name: Run ${{ matrix.target }}
        run: |
          set -o pipefail
          make -C proofs/cbmc ${{ matrix.target }} 2>&1 | tee proofs/cbmc/nightly-output.txt

      - name: Upload the proof output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: nightly-proofs-${{ matrix.target }}
          path: proofs/cbmc/nightly-output.txt
          if-no-files-found: ignore
