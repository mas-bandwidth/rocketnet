# Nightly CBMC proofs. The nightly proofs take minutes to hours. A failing
# proof records a failed job: this workflow is a gate on the night, and a
# red result must show as a failed run, never as a passing "not a gate"
# note. The per-commit proofs remain in cbmc.yml.
#
# The reader directories under proofs/cbmc each contribute a proof.mk to
# NIGHTLY; the nightly target runs every entry, plus replay-near-4096.
# The schedule is before fuzz-nightly.yml, so a red night is on the estate
# when the morning starts.

name: Nightly proofs

on:
  schedule:
    - cron: "30 5 * * *"   # daily at 05:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-proofs:
    name: nightly CBMC proofs
    runs-on: [self-hosted, Linux, X64, fleet, long]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Check the pinned tools are present
        shell: bash
        run: |
          set -euo pipefail
          pin() { awk -v k="$1" '$1==k {print $2}' proofs/cbmc/TOOL-VERSIONS; }
          check() {
            local tool="$1" want="$2" got
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool $want (missing) on $RUNNER_NAME"; exit 1
            fi
            got="$("$tool" --version 2>&1 | head -1)"
            echo "$tool: $got (pinned $want)"
            case "$got" in *"$want"*) ;; *) echo "TOOL-MISSING $tool $want (got: $got) on $RUNNER_NAME"; exit 1;; esac
          }
          check cbmc "$(pin CBMC)"
          check cadical "$(pin CADICAL)"
          check esbmc "$(pin ESBMC)"

      - name: Run the nightly proofs
        run: |
          set -o pipefail
          make -C proofs/cbmc nightly 2>&1 | tee proofs/cbmc/nightly-output.txt

      - name: Upload the proof output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-proofs
          path: proofs/cbmc/nightly-output.txt
          if-no-files-found: ignore
