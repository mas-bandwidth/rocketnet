# rocketnet release checks (#111, serialize's release-check.yml pattern).
#
# WHO READS THIS, per job, because the three have different readers and
# saying "the pull request" for all of them would be wrong.
# version-consistency is a per-commit gate read by the pull request, same as
# every job in ci.yml, and it is in this file rather than that one only
# because it is about the RELEASE rather than the build, exactly as serialize
# splits them. unreleased-wire-changes does NOT run on a pull request at all
# -- it is a push-to-main job, for the reason given above it -- so its reader
# is whoever watches main's runs, which today is the estate's notification
# email, and its failure is a statement about main rather than about any one
# PR. space-vendors-the-release is a release gate too: it runs on a v* tag
# push and on a manual dispatch, so its reader is whoever cuts the release.
#
# Three failures are guarded here, and they are different failures:
#
#   version-consistency     the version sites in the tree disagree with each
#                           other, or with the tag being built
#   unreleased-wire-changes main has drifted past the newest release with
#                           wire-affecting changes aboard and nothing says a
#                           release is owed
#   space-vendors-the-release
#                           the integrating application vendors another
#                           commit than the one being released, or vendors it
#                           with different bytes
#   space-builds-and-soaks-on-the-release
#                           the integrating application, built against the
#                           release, drops a frame, hitches, loses its server
#                           or its bots under a bounded real-time swarm
#
# The second is DORMANT TODAY and says so in its own output: rocketnet has no
# v* tags yet, so there is no newest release to compare against and the job
# exits green having reported exactly that. It is here rather than in the
# follow-up because the failure it catches happened in serialize -- four
# merged PRs including a wire change, every version check green because the
# version numbers still agreed with each other -- and the day rocketnet tags
# its first release (v1.0.0-preview-1) is the day this needs to already exist. A dormant job that announces
# its own dormancy is not a vacuous pass; a silent one would be.

name: Release Check

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      space_ref:
        description: the robotgamedevelopers/space branch or commit the soak builds (space builds and soaks on the release)
        required: false
        default: main

concurrency:
  # each main commit queues in its own group: pending runs on main are
  # replaced, not queued, so a burst of landings leaves every commit a verdict
  group: release-check-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # main never cancels a run in progress: every merge gets a verdict.
  # Branches and PRs still cancel a superseded run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:

  version-consistency:
    name: version consistency
    runs-on: [self-hosted, Linux, X64, fleet]
    steps:

      - uses: actions/checkout@v4

      # rocketnet's version lives in one header and in two branches of it:
      # the shipping version and the development version, selected by
      # ROCKETNET_DEV. BOTH branches are checked, because the one
      # that is not compiled today is the one that drifts.

      - name: Check the version sites agree
        run: |
          set -euo pipefail

          fail=0

          check_branch() {
            branch_name="$1"
            full="$2"
            major="$3"
            minor="$4"
            patch="$5"
            if [ -z "$full" ] || [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ]; then
              echo "::error::Could not extract the $branch_name version from sdk/rocketnet.h (FULL='$full', MAJOR/MINOR/PATCH='$major.$minor.$patch') — the version macros moved and this check did not follow."
              fail=1
              return
            fi
            echo "$branch_name: ROCKETNET_VERSION_FULL=$full  MAJOR.MINOR.PATCH=$major.$minor.$patch"
            if [ "$branch_name" = "development" ]; then
              # the development branch names itself rather than numbering
              # itself; its integers are the 255.255.255 sentinel
              if [ "$full" != "dev" ] || [ "$major.$minor.$patch" != "255.255.255" ]; then
                echo "::error::The development version must be \"dev\" with the 255.255.255 sentinel (got $full and $major.$minor.$patch)."
                fail=1
              fi
              return
            fi
            # Derive the optional prerelease from FULL; there is no public
            # prerelease macro in the final API.
            if [[ ! "$full" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z][0-9A-Za-z.-]*))?$ ]]; then
              echo "::error::Invalid shipping ROCKETNET_VERSION_FULL: $full"
              fail=1
              return
            fi
            numeric="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            prerelease="${BASH_REMATCH[5]:-}"
            echo "shipping prerelease: $prerelease"
            if [ "$numeric" != "$major.$minor.$patch" ]; then
              echo "::error::ROCKETNET_VERSION_FULL ($full) does not match ROCKETNET_VERSION_MAJOR/MINOR/PATCH ($major.$minor.$patch)."
              fail=1
            fi
          }

          # the two branches, in file order: the shipping one first
          shipping_full=$(awk '/#if !ROCKETNET_DEV/,/#else/' sdk/rocketnet.h | sed -nE 's/.*ROCKETNET_VERSION_FULL[[:space:]]+"([^"]+)".*/\1/p' | head -n1)
          shipping_major=$(awk '/#if !ROCKETNET_DEV/,/#else/' sdk/rocketnet.h | sed -nE 's/.*ROCKETNET_VERSION_MAJOR[[:space:]]+([0-9]+).*/\1/p' | head -n1)
          shipping_minor=$(awk '/#if !ROCKETNET_DEV/,/#else/' sdk/rocketnet.h | sed -nE 's/.*ROCKETNET_VERSION_MINOR[[:space:]]+([0-9]+).*/\1/p' | head -n1)
          shipping_patch=$(awk '/#if !ROCKETNET_DEV/,/#else/' sdk/rocketnet.h | sed -nE 's/.*ROCKETNET_VERSION_PATCH[[:space:]]+([0-9]+).*/\1/p' | head -n1)

          dev_full=$(awk '/#else \/\/\/? !ROCKETNET_DEV/,/#endif \/\/\/? !ROCKETNET_DEV/' sdk/rocketnet.h | sed -nE 's/.*ROCKETNET_VERSION_FULL[[:space:]]+"([^"]+)".*/\1/p' | head -n1)
          dev_major=$(awk '/#else \/\/\/? !ROCKETNET_DEV/,/#endif \/\/\/? !ROCKETNET_DEV/' sdk/rocketnet.h | sed -nE 's/.*ROCKETNET_VERSION_MAJOR[[:space:]]+([0-9]+).*/\1/p' | head -n1)
          dev_minor=$(awk '/#else \/\/\/? !ROCKETNET_DEV/,/#endif \/\/\/? !ROCKETNET_DEV/' sdk/rocketnet.h | sed -nE 's/.*ROCKETNET_VERSION_MINOR[[:space:]]+([0-9]+).*/\1/p' | head -n1)
          dev_patch=$(awk '/#else \/\/\/? !ROCKETNET_DEV/,/#endif \/\/\/? !ROCKETNET_DEV/' sdk/rocketnet.h | sed -nE 's/.*ROCKETNET_VERSION_PATCH[[:space:]]+([0-9]+).*/\1/p' | head -n1)

          check_branch "shipping" "$shipping_full" "$shipping_major" "$shipping_minor" "$shipping_patch"
          check_branch "development" "$dev_full" "$dev_major" "$dev_minor" "$dev_patch"

          case "${GITHUB_REF:-}" in
            refs/tags/*)
              tag_version="$GITHUB_REF_NAME"
              echo "release tag: $tag_version"
              if [ "$tag_version" != "$shipping_full" ]; then
                echo "::error::Tag $GITHUB_REF_NAME does not match the shipping version $shipping_full in sdk/rocketnet.h — bump the header as part of the release."
                fail=1
              fi
              ;;
          esac

          exit $fail

  # Version-site agreement cannot see the other failure mode: main drifting
  # past the newest release with wire-affecting changes aboard and nothing
  # announcing that a release is owed. Runs on push to main only -- on a PR it
  # would demand a version bump inside every wire-touching PR, which is not
  # the process. The release train is main's.

  unreleased-wire-changes:
    name: unreleased wire changes
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/')
    runs-on: [self-hosted, Linux, X64, fleet]
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags and full history: the whole job is a comparison against the newest tag

      - name: Compare main against the newest release tag
        run: |
          set -euo pipefail

          newest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$newest_tag" ]; then
            echo "DORMANT: rocketnet has no v* tags, so there is no release to have drifted from."
            echo "This job wakes by itself the day the first release is tagged."
            exit 0
          fi

          total=$(git rev-list --count "$newest_tag"..HEAD)
          echo "Newest tag: $newest_tag ($total commit(s) behind HEAD)"
          if [ "$total" -eq 0 ]; then
            echo "main is exactly at $newest_tag."
            exit 0
          fi

          # WIRE-AFFECTING PATHS: the standard itself, the shared wire
          # constants (the one file the sdk and the kernel program both
          # read), and the protocol layer that writes and reads packets.
          # Deliberately NOT the whole sdk: a gate that cries wolf on a
          # transport refactor is a gate people learn to merge past, and
          # this one exists because a real wire change once shipped
          # unannounced in a sibling.

          wire_log=$(git log --oneline "$newest_tag"..HEAD -- \
            standard/TRANSPORT.md standard/MESSAGES.md \
            sdk/rocketnet_wire.h \
            sdk/rocketnet_protocol.h sdk/rocketnet_protocol.cpp \
            sdk/rocketnet_connect_token.h sdk/rocketnet_connect_token.cpp)

          if [ -z "$wire_log" ]; then
            echo "main is $total commit(s) past $newest_tag, none of them wire-affecting. Fine."
            exit 0
          fi

          count=$(printf '%s\n' "$wire_log" | wc -l | tr -d ' ')
          {
            echo "## Unreleased wire-affecting changes"
            echo ""
            echo "main is **$total** commit(s) past **$newest_tag**, and **$count** touch wire-affecting paths:"
            echo ""
            echo '```'
            printf '%s\n' "$wire_log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          version=$(sed -nE 's/.*ROCKETNET_VERSION_FULL[[:space:]]+"(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)".*/\1/p' sdk/rocketnet.h | head -n1)
          if [ -z "$version" ]; then
            echo "::error::Could not extract the v-prefixed shipping version from sdk/rocketnet.h."
            exit 1
          fi
          tag_version="$newest_tag"
          if [ "$version" = "$tag_version" ]; then
            echo "::error::main carries $count wire-affecting commit(s) past $newest_tag and the shipping version is still $version — nothing announces that a release is owed. Bump the version and tag a release (or revert the wire change). The commit list is in the job summary."
            exit 1
          fi
          echo "::warning::main carries $count wire-affecting commit(s) past $newest_tag. The version is already bumped to $version — tag $version when the release is ready. The commit list is in the job summary."

  # The integrating application (robotgamedevelopers/space, private) vendors
  # rocketnet into game/ThirdParty/rocketnet/ with its own re-vendor script,
  # which archives five paths at a pinned commit and records the pin in
  # game/ThirdParty/rocketnet/VENDOR.md. A release of rocketnet is only real
  # if the application that ships it vendors exactly the commit being
  # released: a release built against another copy of the library is a release
  # nobody tested.
  #
  # This is a RELEASE GATE, not a per-commit check. It runs on a v* tag push
  # and on a manual dispatch, never on a pull request, so the one-minute CI
  # budget is untouched. The commit it checks is the one the run is on: the
  # tag's commit on a tag push, the dispatched ref's head on a dispatch.
  #
  # The token is a repository secret the owner adds. The gate reads it from
  # the environment, never as an argument, and never prints it. A missing
  # token is a failure that says so, never a skip: an unproven release is not
  # a release.

  space-vendors-the-release:
    name: space vendors the release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: [self-hosted, Linux, X64, fleet]
    env:
      SPACE_READ_TOKEN: ${{ secrets.SPACE_READ_TOKEN }}
    steps:

      - uses: actions/checkout@v4

      - name: Check the gate's own cases
        run: python3 tools/test_check_space_vendor.py

      - name: Prove the application vendors this commit byte for byte
        run: python3 tools/check_space_vendor.py --release "$GITHUB_SHA"

  # Vendoring the release byte for byte is not the same as running on it. This
  # job clones the integrating application, builds its dedicated server and
  # happy_path with its own Makefile, and holds eight headless bots on the
  # server for 90 seconds with scripts/bot_swarm.sh. The server pegs its loop
  # to real time and logs every dropped frame; tools/check_space_soak_log.py
  # fails the run on any dropped frame from the first frame on, any large
  # hitch, a server exit before the bound, a BOTS FAIL line or no client
  # connected. tools/space_release_soak.sh is the whole of it and runs the
  # same way on a bench.
  #
  # A release gate like the vendor job: a v* tag push and a manual dispatch,
  # never a pull request. It needs the vendor job, so a release that does not
  # vendor byte for byte stops there. It needs a fleet Linux runner with four
  # or more CPUs (space's dedicated server dies below four), passwordless sudo
  # (the swarm's veth pair and network namespace), Go, cmake and libcurl
  # headers. The timeout fits space's cold build plus the hold and
  # bot_swarm.sh's own ten-minute bound on happy_path. The multi-hour soak is
  # not this job.

  space-builds-and-soaks-on-the-release:
    name: space builds and soaks on the release
    needs: space-vendors-the-release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 60
    env:
      SPACE_READ_TOKEN: ${{ secrets.SPACE_READ_TOKEN }}
      SPACE_REF: ${{ inputs.space_ref || 'main' }}
    steps:

      - uses: actions/checkout@v4

      - name: Check the log check's own cases
        run: python3 tools/test_check_space_soak_log.py

      - name: Build space against this commit and hold eight bots for 90 seconds
        run: ROCKETNET_RELEASE="$GITHUB_SHA" tools/space_release_soak.sh "$SPACE_REF" 90
