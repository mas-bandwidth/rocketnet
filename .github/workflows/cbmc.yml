# The CBMC proofs that finish (proofs/cbmc/Makefile `all`), each night and
# on demand: the arithmetic leaves replay-delta-1-3, replay-far and
# reconstruct, then read-write, message-read, xdp-free-list and
# proofs-packet_open, with the paired `-reachability` control of each of the
# first six. NIGHTLY TIER (2026-10-31): 614-705s on the fleet, over the
# per-commit tier's two minutes. This workflow runs the default target only;
# replay-near-4096 runs nightly too, one job per partition (nightly-proofs.yml).
# Every target here runs on cbmc alone, so cbmc is the one tool checked: cadical
# (replay-near-4096) and ESBMC (the ack-run targets and the NIGHTLY readers) are
# checked by the workflows that run them.
#
# Budget: `make -C proofs/cbmc all` measured 685.59s (11:25.59) on the
# fleet Linux runner (vision, self-hosted Linux X64 fleet) at d5dd954f in
# proofs/cbmc/full-bounds-partition-results.md. This is historical timing,
# not an execution limit for the nightly.

name: CBMC

on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:

concurrency:
  # a nightly run on main is grouped by the commit it checks: a dispatch on the same
  # commit queues behind it, and a run on a newer commit is its own group
  group: cbmc-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # main never cancels a run in progress, so the night gets its verdict.
  # Branches and PRs still cancel a superseded run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Test execution has no repository wall-clock cap; GitHub still limits
# self-hosted jobs to five days.
env:
  ROCKETNET_NIGHTLY_NO_TIMEOUT: '1'

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  cbmc:
    name: cbmc (nightly proof set)
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 7200
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Check the pinned tool is present
        run: |
          set -euo pipefail
          pin() { awk -v k="$1" '$1==k {print $2}' proofs/cbmc/TOOL-VERSIONS; }
          check() {
            local tool="$1" want="$2" got
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool $want (missing) on $RUNNER_NAME"; exit 1
            fi
            got="$("$tool" --version 2>&1 | head -1)"
            echo "$tool: $got (pinned $want)"
            case "$got" in *"$want"*) ;; *) echo "TOOL-MISSING $tool $want (got: $got) on $RUNNER_NAME"; exit 1;; esac
          }
          check cbmc "$(pin CBMC)"

      # every bound the inventory, results and harness comments state for an
      # SDK constant equals the SDK's value (tools/check_cbmc_bounds.py); the
      # self-test plants stale statements and requires them refused
      - name: Check the stated proof bounds against the SDK
        run: |
          python3 tools/check_cbmc_bounds.py --self-test
          python3 tools/check_cbmc_bounds.py

      - name: Run the CBMC proofs
        run: make -C proofs/cbmc
