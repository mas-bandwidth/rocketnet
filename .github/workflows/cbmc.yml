# CBMC proofs of the arithmetic leaves that finish, each night and on
# demand. NIGHTLY TIER (2026-10-31): 614-705s on the fleet, over the
# per-commit tier's two minutes. This workflow runs the default target only.
# It does not run slow-unproved; replay-near-4096 runs nightly too
# (nightly-proofs.yml).
#
# Budget: `make -C proofs/cbmc all` measured 685.59s (11:25.59) on the
# fleet Linux runner (vision, self-hosted Linux X64 fleet) at d5dd954f in
# proofs/cbmc/full-bounds-partition-results.md. timeout-minutes is set
# above that measurement with margin and is never lowered below it.

name: CBMC

on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:

concurrency:
  # each main commit queues in its own group: pending runs on main are
  # replaced, not queued, so a burst of landings leaves every commit a verdict
  group: cbmc-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # main never cancels a run in progress: every merge gets a verdict.
  # Branches and PRs still cancel a superseded run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  cbmc:
    name: cbmc (arithmetic leaf proofs)
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Check the pinned tools are present
        shell: bash
        run: |
          set -euo pipefail
          pin() { awk -v k="$1" '$1==k {print $2}' proofs/cbmc/TOOL-VERSIONS; }
          check() {
            local tool="$1" want="$2" got
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool $want (missing) on $RUNNER_NAME"; exit 1
            fi
            got="$("$tool" --version 2>&1 | head -1)"
            echo "$tool: $got (pinned $want)"
            case "$got" in *"$want"*) ;; *) echo "TOOL-MISSING $tool $want (got: $got) on $RUNNER_NAME"; exit 1;; esac
          }
          check cbmc "$(pin CBMC)"
          check cadical "$(pin CADICAL)"
          check esbmc "$(pin ESBMC)"

      # every bound the inventory, results and harness comments state for an
      # SDK constant equals the SDK's value (tools/check_cbmc_bounds.py); the
      # self-test plants stale statements and requires them refused
      - name: Check the stated proof bounds against the SDK
        run: |
          python3 tools/check_cbmc_bounds.py --self-test
          python3 tools/check_cbmc_bounds.py

      - name: Run the CBMC proofs
        run: make -C proofs/cbmc
