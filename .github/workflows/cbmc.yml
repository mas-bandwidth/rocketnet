# CBMC proofs of the arithmetic leaves that finish, each night and on
# demand. NIGHTLY TIER (2026-10-31): 614-705s on the fleet, over the
# per-commit tier's two minutes. This workflow runs the default target only.
# It does not run slow-unproved; replay-near-4096 runs nightly too, one job
# per partition (nightly-proofs.yml).
#
# Budget: `make -C proofs/cbmc all` measured 685.59s (11:25.59) on the
# fleet Linux runner (vision, self-hosted Linux X64 fleet) at d5dd954f in
# proofs/cbmc/full-bounds-partition-results.md. This is historical timing,
# not an execution limit for the nightly.

name: CBMC

on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:

concurrency:
  # a nightly run on main is grouped by the commit it checks: a dispatch on the same
  # commit queues behind it, and a run on a newer commit is its own group
  group: cbmc-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # main never cancels a run in progress, so the night gets its verdict.
  # Branches and PRs still cancel a superseded run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Test execution has no repository wall-clock cap; GitHub still limits
# self-hosted jobs to five days.
env:
  ROCKETNET_NIGHTLY_NO_TIMEOUT: '1'

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  cbmc:
    name: cbmc (arithmetic leaf proofs)
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 7200
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # The fleet installs ESBMC only in ~/sdk/bin, which is not on the runner
      # service's PATH. Append it (never prepend) for this job's later steps,
      # so a system tool always wins over a copy there.
      - name: Append the fleet sdk tools to the end of PATH
        run: echo "PATH=$PATH:$HOME/sdk/bin" >> "$GITHUB_ENV"

      - name: Check the pinned tools are present
        run: |
          set -euo pipefail
          bash proofs/cbmc/check_tool_versions.sh --self-test
          bash proofs/cbmc/check_tool_versions.sh cbmc=CBMC cadical=CADICAL esbmc=ESBMC

      # every bound the inventory, results and harness comments state for an
      # SDK constant equals the SDK's value (tools/check_cbmc_bounds.py); the
      # self-test plants stale statements and requires them refused
      - name: Check the stated proof bounds against the SDK
        run: |
          python3 tools/check_cbmc_bounds.py --self-test
          python3 tools/check_cbmc_bounds.py

      - name: Run the CBMC proofs
        run: make -C proofs/cbmc
