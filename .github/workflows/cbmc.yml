# CBMC proofs of the arithmetic leaves that finish, on pull requests that
# touch the sdk. The job budget is five minutes. This workflow runs the
# default target only. It does not run slow-unproved.

name: CBMC

on:
  pull_request:
    paths:
      - 'sdk/**'
      - 'proofs/cbmc/**'
      - '.github/workflows/cbmc.yml'
  workflow_dispatch:

concurrency:
  group: cbmc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cbmc:
    name: cbmc (arithmetic leaf proofs)
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check the pinned CBMC is present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cbmc >/dev/null 2>&1; then
            echo "TOOL-MISSING cbmc (any) (missing) on $RUNNER_NAME"
            exit 1
          fi
          cbmc --version

      - name: Run the CBMC proofs
        run: make -C proofs/cbmc
