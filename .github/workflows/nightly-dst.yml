# The nightly deterministic simulation sweep (docs/DST.md) on Linux, macOS and Windows.
#
# One seed fixes a whole dst run: the wire's loss, duplication, delay, jitter and
# reordering, the keys, and the mocked clock. The same seeds and options must
# print the same trace on every OS, or a failing seed found on one OS cannot be
# replayed on another. Each leg builds Release dst and test, runs every
# test_dst_ unit case `test --list` names, each by --run, runs
# `dst --seeds 1-50` and fails unless its
# PASS line carries DST_REFERENCE_TRACE below, then requires every check to
# pass over the fixed range 1-2050, then runs one named short step per fault
# schedule (seeds 1-50; a schedule that fires zero times fails its step), then
# sweeps a longer seed range sized from a measurement on that OS
# to about twenty minutes. The reference range 1-50 stays fixed; only the
# sweep start rolls, derived from the run number, so consecutive nights cover
# different ranges of the same length, printed in the log with the replay line.
#
# A red night prints, per failing seed,
#   FAIL seed=<n> step=<s> check=<name> what=<detail>
#   replay: ./bin/dst --seeds <n>-<n> --shape full
# and the replay line reproduces the same schedule on any of the three OSes.
#
# The reference trace changes only when the harness or the library changes what
# a run does; a change that moves it updates DST_REFERENCE_TRACE and docs/DST.md
# in the same commit, from three equal PASS lines (Linux, macOS, Windows). The
# fixed range 1-2050 and each schedule step compare their whole PASS line to a
# pin the same way (DST_FIXED_TRACE, DST_TRACE_<SCHEDULE>), so a run that
# diverges on one OS past seed 50 is red that night, not only printed; the pins
# move by the same rule, from three equal lines. The sweep's trace is not
# compared: its range rolls nightly and differs per OS
# (tools/printed_values_allowlist.txt). Every step after the build runs even
# when an earlier one is red (a red reference no longer skips the sweep).
#
# Nightlies are exempt from the two-minute rule. Each sweep is sized to about
# 1200 s from a Release measurement on that OS, and each range was run once
# at the commit that set DST_REFERENCE_TRACE:
#   Linux   10950 seeds PASS in 1384 s (0.13 s/seed)
#   macOS   13950 seeds PASS in 1218 s (0.087 s/seed)
#   Windows 5950 seeds  PASS in 1348 s (0.23 s/seed); 1273 s (0.21 s/seed) at 809ad504
# (run number 1 starts each sweep at seed 51, as measured; later runs roll).
# The fixed range 1-2050 adds about 270 s on Linux, 180 s on macOS and 430 s on
# Windows at those rates. These measurements size the finite seed workload;
# they do not cap how long a nightly run may take.
#
# The Release build is ROCKETNET_DEV=ON, so ./bin/test contains the
# development-only unit files. x86-64 GCC (dst-linux), x86-64 Clang
# (dst-linux-clang) and arm64 Clang (dst-macos) run that binary with no
# --run filter. The seed comparison on the existing legs is unchanged.
# Windows does not run the full unit suite.

name: nightly-dst

on:
  schedule:
    - cron: "45 10 * * *"
  workflow_dispatch:

env:
  ROCKETNET_NIGHTLY_NO_TIMEOUT: '1'
  DST_REFERENCE_TRACE: 255b8ae11ec099cb
  # The fixed range and each fault schedule are compared too, not only
  # printed (VERIFY-2 F-W6): equal on Linux, macOS and Windows in run
  # 43203428903 (2026-11-12, main 555eb5963), read from its log. Each step
  # compares its whole PASS line, so the OSes are compared every night.
  DST_FIXED_TRACE: 5ec8156775d05f45
  DST_TRACE_CLOCK_BACK: 4f7d5a3d680d4219
  DST_TRACE_SEQ_GAP: 35ac4c25b0c024cd
  DST_TRACE_SEQ_WRAP_31: 444b1661b8b0e519
  DST_TRACE_SEQ_WRAP_32: 5424687cb5956080
  DST_TRACE_BURST: 8886e97da96a007a
  DST_TRACE_DUP_STORM: 0cb3c5f598054026
  DST_TRACE_OUTAGE: a12bbb97ff73e3a6
  DST_TRACE_OUTAGE_PAST: e76d4e74b0627e5a
  DST_TRACE_SEND_FAIL: 22f3d51670f3beba

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:

  dst-linux:
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    env:
      DST_BIN: ./bin
      DST_EXE: ""
      DST_SWEEP_LENGTH: "10950"
      DST_RUN_NUMBER: "${{ github.run_number }}"
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref == github.ref_name && github.sha || matrix.ref }}

      - name: Build (Release, ROCKETNET_DEV=ON, GCC)
        id: build
        timeout-minutes: 7
        env:
          CC: gcc
          CXX: g++
        run: make ROCKETNET_DEV=ON

      - name: The test_dst_ unit cases
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          # every registered test_dst_ case, as the binary itself lists them (--list), never a
          # hand-kept copy of the names that goes stale as cases are added
          list="$("$DST_BIN/test$DST_EXE" --list | tr -d '\r')"
          cases="$(printf '%s\n' "$list" | awk '/^test_dst_/')"
          [ -n "$cases" ] || { echo "check failed: test --list names no test_dst_ case"; exit 1; }
          n=0
          for c in $cases; do
            "$DST_BIN/test$DST_EXE" --run "$c"
            n=$((n + 1))
          done
          echo "test_dst_ unit cases: $n run"

      - name: Run the unit suite (Release, ROCKETNET_DEV=ON)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$DST_BIN/test$DST_EXE"

      - name: Seeds 1-50 print the reference trace
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$DST_BIN/dst$DST_EXE" --seeds 1-50 | tr -d '\r' | tee dst-reference.log
          if grep -q '^FAIL' dst-reference.log; then echo "dst printed a FAIL line on $RUNNER_OS"; exit 1; fi
          want="PASS seeds=1-50 runs=50 trace=$DST_REFERENCE_TRACE"
          got=$(tail -n 1 dst-reference.log)
          if [ "$got" != "$want" ]; then
            echo "TRACE-MISMATCH on $RUNNER_OS: want '$want' got '$got'"
            exit 1
          fi

      - name: Seeds 1-2050 pass every check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          "$DST_BIN/dst$DST_EXE" --seeds 1-2050 | tr -d '\r' | tee dst-fixed.log
          echo "seeds=1-2050 took $(( $(date +%s) - start ))s on $RUNNER_OS"
          if grep -q '^FAIL' dst-fixed.log; then echo "dst printed a FAIL line on $RUNNER_OS"; exit 1; fi
          want="PASS seeds=1-2050 runs=2050 trace=$DST_FIXED_TRACE"
          got=$(tail -n 1 dst-fixed.log)
          if [ "$got" != "$want" ]; then echo "TRACE-MISMATCH seeds=1-2050 on $RUNNER_OS: want '$want' got '$got'"; exit 1; fi

      - name: Schedule clock-back seeds 1-50
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$DST_BIN/dst$DST_EXE" --seeds 1-50 --schedule clock-back | tr -d '\r' | tee dst-schedule-clock-back.log
          if grep -q '^FAIL' dst-schedule-clock-back.log; then echo "dst schedule clock-back printed a FAIL line on $RUNNER_OS"; exit 1; fi
          line=$(tail -n 1 dst-schedule-clock-back.log)
          fired=$(printf '%s' "$line" | sed -n 's/.* schedule=clock-back fired=\([0-9][0-9]*\).*/\1/p')
          if [ -z "$fired" ] || [ "$fired" -eq 0 ]; then echo "SCHEDULE-NOT-FIRED clock-back fired=${fired:-missing} on $RUNNER_OS"; exit 1; fi
          want="PASS seeds=1-50 runs=50 trace=$DST_TRACE_CLOCK_BACK schedule=clock-back fired=50"
          if [ "$line" != "$want" ]; then echo "TRACE-MISMATCH schedule=clock-back on $RUNNER_OS: want '$want' got '$line'"; exit 1; fi
          echo "PASS schedule=clock-back seeds=1-50 fired=$fired"

      - name: Schedule seq-gap seeds 1-50
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$DST_BIN/dst$DST_EXE" --seeds 1-50 --schedule seq-gap | tr -d '\r' | tee dst-schedule-seq-gap.log
          if grep -q '^FAIL' dst-schedule-seq-gap.log; then echo "dst schedule seq-gap printed a FAIL line on $RUNNER_OS"; exit 1; fi
          line=$(tail -n 1 dst-schedule-seq-gap.log)
          fired=$(printf '%s' "$line" | sed -n 's/.* schedule=seq-gap fired=\([0-9][0-9]*\).*/\1/p')
          if [ -z "$fired" ] || [ "$fired" -eq 0 ]; then echo "SCHEDULE-NOT-FIRED seq-gap fired=${fired:-missing} on $RUNNER_OS"; exit 1; fi
          want="PASS seeds=1-50 runs=50 trace=$DST_TRACE_SEQ_GAP schedule=seq-gap fired=50"
          if [ "$line" != "$want" ]; then echo "TRACE-MISMATCH schedule=seq-gap on $RUNNER_OS: want '$want' got '$line'"; exit 1; fi
          echo "PASS schedule=seq-gap seeds=1-50 fired=$fired"

      - name: Schedule seq-wrap-31 seeds 1-50
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$DST_BIN/dst$DST_EXE" --seeds 1-50 --schedule seq-wrap-31 | tr -d '\r' | tee dst-schedule-seq-wrap-31.log
          if grep -q '^FAIL' dst-schedule-seq-wrap-31.log; then echo "dst schedule seq-wrap-31 printed a FAIL line on $RUNNER_OS"; exit 1; fi
          line=$(tail -n 1 dst-schedule-seq-wrap-31.log)
          fired=$(printf '%s' "$line" | sed -n 's/.* schedule=seq-wrap-31 fired=\([0-9][0-9]*\).*/\1/p')
          if [ -z "$fired" ] || [ "$fired" -eq 0 ]; then echo "SCHEDULE-NOT-FIRED seq-wrap-31 fired=${fired:-missing} on $RUNNER_OS"; exit 1; fi
          want="PASS seeds=1-50 runs=50 trace=$DST_TRACE_SEQ_WRAP_31 schedule=seq-wrap-31 fired=50"
          if [ "$line" != "$want" ]; then echo "TRACE-MISMATCH schedule=seq-wrap-31 on $RUNNER_OS: want '$want' got '$line'"; exit 1; fi
          echo "PASS schedule=seq-wrap-31 seeds=1-50 fired=$fired"

      - name: Schedule seq-wrap-32 seeds 1-50
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$DST_BIN/dst$DST_EXE" --seeds 1-50 --schedule seq-wrap-32 | tr -d '\r' | tee dst-schedule-seq-wrap-32.log
          if grep -q '^FAIL' dst-schedule-seq-wrap-32.log; then echo "dst schedule seq-wrap-32 printed a FAIL line on $RUNNER_OS"; exit 1; fi
          line=$(tail -n 1 dst-schedule-seq-wrap-32.log)
          fired=$(printf '%s' "$line" | sed -n 's/.* schedule=seq-wrap-32 fired=\([0-9][0-9]*\).*/\1/p')
          if [ -z "$fired" ] || [ "$fired" -eq 0 ]; then echo "SCHEDULE-NOT-FIRED seq-wrap-32 fired=${fired:-missing} on $RUNNER_OS"; exit 1; fi
          want="PASS seeds=1-50 runs=50 trace=$DST_TRACE_SEQ_WRAP_32 schedule=seq-wrap-32 fired=50"
          if [ "$line" != "$want" ]; then echo "TRACE-MISMATCH schedule=seq-wrap-32 on $RUNNER_OS: want '$want' got '$line'"; exit 1; fi
          echo "PASS schedule=seq-wrap-32 seeds=1-50 fired=$fired"

      - name: Schedule burst seeds 1-50
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$DST_BIN/dst$DST_EXE" --seeds 1-50 --schedule burst | tr -d '\r' | tee dst-schedule-burst.log
          if grep -q '^FAIL' dst-schedule-burst.log; then echo "dst schedule burst printed a FAIL line on $RUNNER_OS"; exit 1; fi
          line=$(tail -n 1 dst-schedule-burst.log)
          fired=$(printf '%s' "$line" | sed -n 's/.* schedule=burst fired=\([0-9][0-9]*\).*/\1/p')
          if [ -z "$fired" ] || [ "$fired" -eq 0 ]; then echo "SCHEDULE-NOT-FIRED burst fired=${fired:-missing} on $RUNNER_OS"; exit 1; fi
          want="PASS seeds=1-50 runs=50 trace=$DST_TRACE_BURST schedule=burst fired=50"
          if [ "$line" != "$want" ]; then echo "TRACE-MISMATCH schedule=burst on $RUNNER_OS: want '$want' got '$line'"; exit 1; fi
          echo "PASS schedule=burst seeds=1-50 fired=$fired"

      - name: Schedule dup-storm seeds 1-50
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$DST_BIN/dst$DST_EXE" --seeds 1-50 --schedule dup-storm | tr -d '\r' | tee dst-schedule-dup-storm.log
          if grep -q '^FAIL' dst-schedule-dup-storm.log; then echo "dst schedule dup-storm printed a FAIL line on $RUNNER_OS"; exit 1; fi
          line=$(tail -n 1 dst-schedule-dup-storm.log)
          fired=$(printf '%s' "$line" | sed -n 's/.* schedule=dup-storm fired=\([0-9][0-9]*\).*/\1/p')
          if [ -z "$fired" ] || [ "$fired" -eq 0 ]; then echo "SCHEDULE-NOT-FIRED dup-storm fired=${fired:-missing} on $RUNNER_OS"; exit 1; fi
          want="PASS seeds=1-50 runs=50 trace=$DST_TRACE_DUP_STORM schedule=dup-storm fired=50"
          if [ "$line" != "$want" ]; then echo "TRACE-MISMATCH schedule=dup-storm on $RUNNER_OS: want '$want' got '$line'"; exit 1; fi
          echo "PASS schedule=dup-storm seeds=1-50 fired=$fired"

      - name: Schedule outage seeds 1-50
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$DST_BIN/dst$DST_EXE" --seeds 1-50 --schedule outage | tr -d '\r' | tee dst-schedule-outage.log
          if grep -q '^FAIL' dst-schedule-outage.log; then echo "dst schedule outage printed a FAIL line on $RUNNER_OS"; exit 1; fi
          line=$(tail -n 1 dst-schedule-outage.log)
          fired=$(printf '%s' "$line" | sed -n 's/.* schedule=outage fired=\([0-9][0-9]*\).*/\1/p')
          if [ -z "$fired" ] || [ "$fired" -eq 0 ]; then echo "SCHEDULE-NOT-FIRED outage fired=${fired:-missing} on $RUNNER_OS"; exit 1; fi
          want="PASS seeds=1-50 runs=50 trace=$DST_TRACE_OUTAGE schedule=outage fired=50"
          if [ "$line" != "$want" ]; then echo "TRACE-MISMATCH schedule=outage on $RUNNER_OS: want '$want' got '$line'"; exit 1; fi
          echo "PASS schedule=outage seeds=1-50 fired=$fired"

      - name: Schedule outage-past seeds 1-50
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$DST_BIN/dst$DST_EXE" --seeds 1-50 --schedule outage-past | tr -d '\r' | tee dst-schedule-outage-past.log
          if grep -q '^FAIL' dst-schedule-outage-past.log; then echo "dst schedule outage-past printed a FAIL line on $RUNNER_OS"; exit 1; fi
          line=$(tail -n 1 dst-schedule-outage-past.log)
          fired=$(printf '%s' "$line" | sed -n 's/.* schedule=outage-past fired=\([0-9][0-9]*\).*/\1/p')
          if [ -z "$fired" ] || [ "$fired" -eq 0 ]; then echo "SCHEDULE-NOT-FIRED outage-past fired=${fired:-missing} on $RUNNER_OS"; exit 1; fi
          want="PASS seeds=1-50 runs=50 trace=$DST_TRACE_OUTAGE_PAST schedule=outage-past fired=50"
          if [ "$line" != "$want" ]; then echo "TRACE-MISMATCH schedule=outage-past on $RUNNER_OS: want '$want' got '$line'"; exit 1; fi
          echo "PASS schedule=outage-past seeds=1-50 fired=$fired"

      - name: Schedule send-fail seeds 1-50
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$DST_BIN/dst$DST_EXE" --seeds 1-50 --schedule send-fail | tr -d '\r' | tee dst-schedule-send-fail.log
          if grep -q '^FAIL' dst-schedule-send-fail.log; then echo "dst schedule send-fail printed a FAIL line on $RUNNER_OS"; exit 1; fi
          line=$(tail -n 1 dst-schedule-send-fail.log)
          fired=$(printf '%s' "$line" | sed -n 's/.* schedule=send-fail fired=\([0-9][0-9]*\).*/\1/p')
          if [ -z "$fired" ] || [ "$fired" -eq 0 ]; then echo "SCHEDULE-NOT-FIRED send-fail fired=${fired:-missing} on $RUNNER_OS"; exit 1; fi
          want="PASS seeds=1-50 runs=50 trace=$DST_TRACE_SEND_FAIL schedule=send-fail fired=50"
          if [ "$line" != "$want" ]; then echo "TRACE-MISMATCH schedule=send-fail on $RUNNER_OS: want '$want' got '$line'"; exit 1; fi
          echo "PASS schedule=send-fail seeds=1-50 fired=$fired"

      # the outage scenarios (docs/DST.md, "Outage scenarios"): every set over
      # seeds 1-50, 17450 rows; about 6 minutes on the macOS runner
      - name: Outage scenarios seeds 1-50
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$DST_BIN/dst$DST_EXE" --outage all --seeds 1-50 | tr -d '\r' | tee dst-outage.log
          if grep -q '^FAIL' dst-outage.log; then echo "dst outage printed a FAIL line on $RUNNER_OS"; exit 1; fi
          if ! tail -n 1 dst-outage.log | grep -q '^PASS outage=all seeds=1-50 rows=17450$'; then echo "dst outage did not print its PASS line on $RUNNER_OS"; exit 1; fi

      - name: Sweep the nightly seed range
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          length=$DST_SWEEP_LENGTH
          sweep_start=$(( 51 + (DST_RUN_NUMBER - 1) * length ))
          sweep_end=$(( sweep_start + length - 1 ))
          sweep="$sweep_start-$sweep_end"
          echo "DST sweep seeds=$sweep length=$length run_number=$DST_RUN_NUMBER replay: $DST_BIN/dst$DST_EXE --seeds $sweep"
          start=$(date +%s)
          "$DST_BIN/dst$DST_EXE" --seeds "$sweep" | tr -d '\r' | tee dst-sweep.log
          echo "seeds=$sweep took $(( $(date +%s) - start ))s on $RUNNER_OS"
          if grep -q '^FAIL' dst-sweep.log; then echo "dst printed a FAIL line on $RUNNER_OS"; exit 1; fi
          tail -n 1 dst-sweep.log | grep -q '^PASS seeds='

  dst-macos:
    runs-on: [self-hosted, macOS, ARM64, fleet]
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    env:
      DST_BIN: ./bin
      DST_EXE: ""
      DST_SWEEP_LENGTH: "13950"
      DST_RUN_NUMBER: "${{ github.run_number }}"
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref == github.ref_name && github.sha || matrix.ref }}

      - name: Build (Release, ROCKETNET_DEV=ON, Clang)
        id: build
        timeout-minutes: 11
        env:
          CC: clang
          CXX: clang++
        run: make ROCKETNET_DEV=ON

      - name: The test_dst_ unit cases
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          # every registered test_dst_ case, as the binary itself lists them (--list), never a
          # hand-kept copy of the names that goes stale as cases are added
          list="$("$DST_BIN/test$DST_EXE" --list | tr -d '\r')"
          cases="$(printf '%s\n' "$list" | awk '/^test_dst_/')"
          [ -n "$cases" ] || { echo "check failed: test --list names no test_dst_ case"; exit 1; }
          n=0
          for c in $cases; do
            "$DST_BIN/test$DST_EXE" --run "$c"
            n=$((n + 1))
          done
          echo "test_dst_ unit cases: $n run"

      - name: Run the unit suite (Release, ROCKETNET_DEV=ON)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$DST_BIN/test$DST_EXE"

      - name: Seeds 1-50 print the reference trace
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$DST_BIN/dst$DST_EXE" --seeds 1-50 | tr -d '\r' | tee dst-reference.log
          if grep -q '^FAIL' dst-reference.log; then echo "dst printed a FAIL line on $RUNNER_OS"; exit 1; fi
          want="PASS seeds=1-50 runs=50 trace=$DST_REFERENCE_TRACE"
          got=$(tail -n 1 dst-reference.log)
          if [ "$got" != "$want" ]; then
            echo "TRACE-MISMATCH on $RUNNER_OS: want '$want' got '$got'"
            exit 1
          fi

      - name: Seeds 1-2050 pass every check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          "$DST_BIN/dst$DST_EXE" --seeds 1-2050 | tr -d '\r' | tee dst-fixed.log
          echo "seeds=1-2050 took $(( $(date +%s) - start ))s on $RUNNER_OS"
          if grep -q '^FAIL' dst-fixed.log; then echo "dst printed a FAIL line on $RUNNER_OS"; exit 1; fi
          want="PASS seeds=1-2050 runs=2050 trace=$DST_FIXED_TRACE"
          got=$(tail -n 1 dst-fixed.log)
          if [ "$got" != "$want" ]; then echo "TRACE-MISMATCH seeds=1-2050 on $RUNNER_OS: want '$want' got '$got'"; exit 1; fi

      - name: Schedule clock-back seeds 1-50
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$DST_BIN/dst$DST_EXE" --seeds 1-50 --schedule clock-back | tr -d '\r' | tee dst-schedule-clock-back.log
          if grep -q '^FAIL' dst-schedule-clock-back.log; then echo "dst schedule clock-back printed a FAIL line on $RUNNER_OS"; exit 1; fi
          line=$(tail -n 1 dst-schedule-clock-back.log)
          fired=$(printf '%s' "$line" | sed -n 's/.* schedule=clock-back fired=\([0-9][0-9]*\).*/\1/p')
          if [ -z "$fired" ] || [ "$fired" -eq 0 ]; then echo "SCHEDULE-NOT-FIRED clock-back fired=${fired:-missing} on $RUNNER_OS"; exit 1; fi
          want="PASS seeds=1-50 runs=50 trace=$DST_TRACE_CLOCK_BACK schedule=clock-back fired=50"
          if [ "$line" != "$want" ]; then echo "TRACE-MISMATCH schedule=clock-back on $RUNNER_OS: want '$want' got '$line'"; exit 1; fi
          echo "PASS schedule=clock-back seeds=1-50 fired=$fired"

      - name: Schedule seq-gap seeds 1-50
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$DST_BIN/dst$DST_EXE" --seeds 1-50 --schedule seq-gap | tr -d '\r' | tee dst-schedule-seq-gap.log
          if grep -q '^FAIL' dst-schedule-seq-gap.log; then echo "dst schedule seq-gap printed a FAIL line on $RUNNER_OS"; exit 1; fi
          line=$(tail -n 1 dst-schedule-seq-gap.log)
          fired=$(printf '%s' "$line" | sed -n 's/.* schedule=seq-gap fired=\([0-9][0-9]*\).*/\1/p')
          if [ -z "$fired" ] || [ "$fired" -eq 0 ]; then echo "SCHEDULE-NOT-FIRED seq-gap fired=${fired:-missing} on $RUNNER_OS"; exit 1; fi
          want="PASS seeds=1-50 runs=50 trace=$DST_TRACE_SEQ_GAP schedule=seq-gap fired=50"
