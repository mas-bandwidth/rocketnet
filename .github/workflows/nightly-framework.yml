# NIGHTLY FRAMEWORK INTEGRATION: rocketnet main, vendored into the framework
# (robotgamedevelopers/framework, private, another organization) exactly the
# way the framework vendors it, then built and run. A break in the public API,
# in the source list the framework compiles (cmake/RocketnetSources.cmake), in
# the vendored path set or in behavior a real client and server depend on
# shows up the night it lands on main, not the day the framework next
# re-vendors.
#
# Each leg clones the framework read-only (push URL "no-push"; nothing here
# pushes) and runs the framework's own scripts/revendor_rocketnet.sh at
# rocketnet main, which copies sdk/, sodium/ and the cmake recipes into
# libraries/rocketnet/ and checks the copy with
# scripts/check_vendored_rocketnet.sh. It always vendors main, whatever ref
# this file runs from: the framework's script refuses a commit not on main.
# Then the framework builds the way its own ci.yml builds it on that OS,
# Release, and runs its unit tests and every smoke test that needs no
# credentials from outside the machine:
#
#   Linux    dist/test; scripts/smoke_test.sh (dedicated, listen, timeout,
#            singleplayer over the loopback transport), crash_smoke_test.sh,
#            log_smoke_test.sh; make backend and backend_smoke_test.sh (the
#            backend in its local env on 127.0.0.1, keys from a fresh
#            keygen); the production build (ROCKETNET_DEV=0) with
#            udp_allocation_test.sh (no system allocation after create over
#            real UDP) and production_smoke_test.sh.
#
# ACCESS. The framework is private and in another organization. The fleet's
# rocketnet runners clone it over git ssh with their host's own credential,
# so this job holds no secret. github.token reads rocketnet main for the
# re-vendor script's own fetch, as a scoped http.extraheader through git's
# GIT_CONFIG_* environment, never on a command line or in a clone's config.
#
# Windows: not yet. The Windows runner's host credential for the framework
# is not verified; the framework's own CI covers its Windows build.

name: nightly-framework

on:
  schedule:
    - cron: "50 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # the build cap on a shared fleet runner: cmake --build reads it, and the
  # Makefile defaults its JOBS to it (tools/check_make_jobs.sh)
  CMAKE_BUILD_PARALLEL_LEVEL: 4

concurrency:
  group: nightly-framework-${{ github.ref }}
  cancel-in-progress: false

jobs:

  linux:
    name: framework on rocketnet main (Linux)
    runs-on: [self-hosted, Linux, X64, fleet, rocketnet]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the fleet's build dependencies are present
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ make git go curl pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          if ! pkg-config --exists libcurl >/dev/null 2>&1; then
            echo "TOOL-MISSING libcurl (any) (pkg-config --exists failed) on $RUNNER_NAME"
            missing=1
          fi
          exit "$missing"

      - name: Vendor rocketnet main into the framework
        env:
          ROCKETNET_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          framework="$RUNNER_TEMP/framework"
          rm -rf "$framework"
          GIT_TERMINAL_PROMPT=0 git clone --quiet git@github.com:robotgamedevelopers/framework.git "$framework"
          git -C "$framework" remote set-url --push origin no-push
          git fetch --quiet origin main
          pin=$(git rev-parse origin/main)
          previous=$(sed -nE 's/^\| commit \| \*\*([0-9a-f]{40})\*\* \|$/\1/p' "$framework/libraries/rocketnet/VENDOR.md" 2>/dev/null || true)
          echo "framework $(git -C "$framework" rev-parse HEAD): vendoring rocketnet main $pin over ${previous:-nothing}"
          auth=$(printf 'x-access-token:%s' "$ROCKETNET_READ_TOKEN" | base64 | tr -d '\n')
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/mas-bandwidth/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
          GIT_TERMINAL_PROMPT=0 \
          ROCKETNET_REPO="$GITHUB_WORKSPACE" \
            bash "$framework/scripts/revendor_rocketnet.sh" "$pin"
          auth=
          bash "$framework/scripts/check_vendored_rocketnet.sh"
          echo "files the re-vendor changed under libraries/rocketnet:"
          git -C "$framework" status --porcelain -- libraries/rocketnet | sed 's/^/  /'
          echo "FRAMEWORK=$framework" >> "$GITHUB_ENV"
          {
            echo "### Framework at $(git -C "$framework" rev-parse --short HEAD) on rocketnet main $pin"
            echo ""
            echo "The framework had vendored ${previous:-nothing}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the framework (Release)
        run: |
          cd "$FRAMEWORK"
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -S . -B build > /dev/null
          make -C build -j"$CMAKE_BUILD_PARALLEL_LEVEL"

      - name: Framework unit tests
        run: cd "$FRAMEWORK/dist" && ./test

      - name: Smoke test (dedicated, listen, timeout, singleplayer)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: cd "$FRAMEWORK" && ./scripts/smoke_test.sh

      - name: Crash smoke test
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: cd "$FRAMEWORK" && ./scripts/crash_smoke_test.sh

      - name: Log smoke test
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: cd "$FRAMEWORK" && ./scripts/log_smoke_test.sh

      - name: Build the framework backend
        id: backend
        if: ${{ !cancelled() }}
        run: cd "$FRAMEWORK" && make backend

      - name: Backend smoke test (local backend, fresh keys)
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        timeout-minutes: 3
        run: cd "$FRAMEWORK" && ./scripts/backend_smoke_test.sh

      - name: Production build (ROCKETNET_DEV=0)
        id: production
        if: ${{ !cancelled() }}
        run: |
          cd "$FRAMEWORK"
          cmake -S . -B dev0/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
                -DCMAKE_C_FLAGS=-DROCKETNET_DEV=0 -DCMAKE_CXX_FLAGS=-DROCKETNET_DEV=0 > /dev/null
          make -C dev0/build -j"$CMAKE_BUILD_PARALLEL_LEVEL" launcher client server udp_allocations

      - name: UDP allocation test (production)
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        timeout-minutes: 3
        run: cd "$FRAMEWORK" && ./scripts/udp_allocation_test.sh

      - name: Production smoke test
        if: ${{ !cancelled() && steps.production.outcome == 'success' && steps.backend.outcome == 'success' }}
        timeout-minutes: 3
        run: cd "$FRAMEWORK" && ./scripts/production_smoke_test.sh
