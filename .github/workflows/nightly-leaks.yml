# THE NIGHTLY FULL-SUITE LEAK CHECK.
#
# The per-commit sanitizers job in ci.yml runs ./bin/test and ./bin/functional
# with ASAN_OPTIONS=detect_leaks=0 and enables LeakSanitizer only for
# ./bin/test_lifecycle, ./bin/test_driver, and ./bin/test_sodium. This workflow
# runs the full unit suite (default and portable-pinned) and the full
# functional suite under ASAN_OPTIONS=detect_leaks=1 with
# LSAN_OPTIONS=suppressions=tools/lsan.supp:print_suppressions=1.
#
# print_suppressions=1 prints every suppression that matches during the run so
# stale entries in tools/lsan.supp remain visible in the log.
#
# A red night here has a commit range and a bisect; whoever is on the estate
# that morning owns walking it back.

name: nightly-leaks

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leaks:
    name: asan + ubsan + lsan (full suite)
    runs-on: [self-hosted, Linux, X64, fleet]
    strategy:
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    concurrency:
      group: nightly-leaks-${{ matrix.ref }}
      cancel-in-progress: true
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests under LSan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
          LSAN_OPTIONS: suppressions=tools/lsan.supp:print_suppressions=1
        run: |
          set -o pipefail
          ./bin/test 2>&1 | tee test.log

      - name: Run unit tests with the driver pin preserved under LSan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
          LSAN_OPTIONS: suppressions=tools/lsan.supp:print_suppressions=1
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: |
          set -o pipefail
          ./bin/test 2>&1 | tee test_portable.log

      - name: Run functional suite under LSan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
          LSAN_OPTIONS: suppressions=tools/lsan.supp:print_suppressions=1
        timeout-minutes: 30
        run: |
          set -o pipefail
          ./bin/functional 2>&1 | tee functional.log

      - name: Upload leak logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-leaks-logs-${{ replace(matrix.ref, '/', '-') }}
          path: |
            test.log
            test_portable.log
            functional.log
          if-no-files-found: ignore

  # macOS has no LeakSanitizer runtime, so the Linux job above cannot cover
  # it. This job uses Apple clang's ASan+UBSan and TSan through the one
  # ROCKETNET_SANITIZE option, then checks leaks with the system leaks tool
  # on a plain Release build (MallocStackLogging=1, /usr/bin/leaks --atExit).
  # setarch has no macOS form, so the TSan legs run without the Linux
  # address-space-randomisation wrapper.
  macos-sanitizers-and-leaks:
    name: macOS ASan+UBSan, TSan and leaks
    runs-on: [self-hosted, macOS, ARM64, rocketnet-macos]
    timeout-minutes: 60
    steps:

      - uses: actions/checkout@v4

      - name: Check the member's macOS tools are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake clang c++ xxd python3; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          if [ ! -x /usr/bin/leaks ]; then
            echo "TOOL-MISSING leaks (any) (/usr/bin/leaks missing) on $RUNNER_NAME"
            missing=1
          fi
          exit "$missing"

      - name: Build ASan+UBSan
        run: |
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DROCKETNET_SANITIZE=address
          cmake --build build-asan --parallel 4

      - name: Run every suite under ASan+UBSan on every pin
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          ./bin/test
          ./bin/test_lifecycle
          ./bin/test_driver
          ./bin/test_msgx
          for server in portable msgx; do
            for client in portable msgx; do
              echo "functional pin $server/$client"
              ROCKETNET_SERVER_TRANSPORT=$server ROCKETNET_CLIENT_TRANSPORT=$client ./bin/functional
            done
          done

      - name: Build TSan
        run: |
          cmake -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DROCKETNET_SANITIZE=thread
          cmake --build build-tsan --parallel 4

      - name: Run the threaded suites under TSan on every pin
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          ./bin/test
          for server in portable msgx; do
            for client in portable msgx; do
              echo "functional pin $server/$client"
              ROCKETNET_SERVER_TRANSPORT=$server ROCKETNET_CLIENT_TRANSPORT=$client ./bin/functional
            done
          done

      - name: Build Release without sanitizers
        run: |
          cmake -B build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release --parallel 4

      - name: Leaks tool self-test
        run: python3 tools/macos/leaks_run.py --self-test

      - name: Run the suites under the leaks tool on every pin
        timeout-minutes: 30
        run: python3 tools/macos/leaks_run.py --matrix
