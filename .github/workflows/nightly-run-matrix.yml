# THE NIGHTLY RUN MATRIX: THE REQUIRED CELLS NO OTHER WORKFLOW RUNS.
#
# tools/verification_matrix.tsv declares every cell the tree can run, and
# tools/check_run_matrix.py (the lint job) refuses a cell past its owed date
# that no workflow runs. This file runs the cells that were owed: each server
# and client transport pinned over the whole functional suite in every build
# the suite ships in, the build types beyond Release and Debug, and the
# compile-time values and CMake options at their other settings. Every
# whole-suite run goes through tools/run_functional.sh, so each leg's skips
# are held to tests/functional/expected_skips.txt both ways.
#
# Like nightly.yml, a red night here is a gate that would have gone red on a
# commit: nightly-watch.yml reads this workflow (it is scheduled) and fails on
# any red job tools/nightly_dispositions.txt does not give to an owner.
#
# The schedule keeps clear of 02:00-02:30 UTC (the frame budget and client
# frame time measurements want a quiet fleet) and of the TLC records and CBMC
# runs around 05:00.
#
# Linux first. A pinned run of the xdp server needs root and a veth pair
# (inside the virtme-ng guest), so the xdp~portable cells are not here yet;
# their rows in the matrix name what they wait on.

name: nightly-run-matrix

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Test execution has no repository wall-clock cap; GitHub still limits
# self-hosted jobs to five days.
env:
  ROCKETNET_NIGHTLY_NO_TIMEOUT: '1'

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:

  # THE LINUX RELEASE TRANSPORT PINS: the whole functional suite, nightly tier
  # included, once per pair of ci.yml's TRANSPORT_MATRIX_LINUX (the per-commit
  # matrix runs only four socket cases per pair). portable~portable is
  # nightly.yml's linux-functional-nightly step; xdp~portable needs the guest.
  # A client of auto sets no client pin. Each step runs whatever the one
  # before it did, so one red pair does not hide the next.

  linux-pins-release:
    name: linux / Release transport pins
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 7200
    strategy:
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    concurrency:
      group: nightly-run-matrix-linux-pins-release-${{ github.event_name }}-${{ matrix.ref }}
      cancel-in-progress: true
    env:
      CMAKE_BUILD_TYPE: Release
      ROCKETNET_TEST_NIGHTLY: "1"
      ROCKETNET_TEST_KEEP_GOING: "1"
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Build (Release, through the Makefile)
        timeout-minutes: 10
        run: make -j8

      - name: Functional suite, gso~gso pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: gso
          ROCKETNET_CLIENT_TRANSPORT: gso
        run: bash tools/run_functional.sh dev-gso-gso ./bin/functional

      - name: Functional suite, gso~portable pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: gso
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: bash tools/run_functional.sh dev-gso-portable ./bin/functional

      - name: Functional suite, io_uring~portable pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: io_uring
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: bash tools/run_functional.sh dev-iouring-portable ./bin/functional

      - name: Functional suite, loopback~loopback pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: loopback
          ROCKETNET_CLIENT_TRANSPORT: loopback
        run: bash tools/run_functional.sh dev-loopback ./bin/functional

      - name: Functional suite, portable~auto pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
        run: bash tools/run_functional.sh dev-portable-auto ./bin/functional

      - name: Functional suite, portable~gso pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: gso
        run: bash tools/run_functional.sh dev-portable-gso ./bin/functional

  # THE LINUX DEBUG TRANSPORT PINS: the same pairs and portable~portable on a
  # Debug build, whose asserts Release compiles out. ci.yml's Debug row runs
  # the suite unpinned (auto~auto) on every commit.

  linux-pins-debug:
    name: linux / Debug transport pins
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 7200
    strategy:
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    concurrency:
      group: nightly-run-matrix-linux-pins-debug-${{ github.event_name }}-${{ matrix.ref }}
      cancel-in-progress: true
    env:
      CMAKE_BUILD_TYPE: Debug
      ROCKETNET_TEST_NIGHTLY: "1"
      ROCKETNET_TEST_KEEP_GOING: "1"
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Build the functional suite (Debug)
        timeout-minutes: 10
        run: |
          cmake -S . -B build-debug -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build-debug/bin" -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/build-debug/bin"
          cmake --build build-debug --target test functional --parallel 8

      - name: Functional suite, gso~gso pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: gso
          ROCKETNET_CLIENT_TRANSPORT: gso
        run: bash tools/run_functional.sh dev-gso-gso ./build-debug/bin/functional

      - name: Functional suite, gso~portable pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: gso
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: bash tools/run_functional.sh dev-gso-portable ./build-debug/bin/functional

      - name: Functional suite, io_uring~portable pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: io_uring
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: bash tools/run_functional.sh dev-iouring-portable ./build-debug/bin/functional

      - name: Functional suite, loopback~loopback pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: loopback
          ROCKETNET_CLIENT_TRANSPORT: loopback
        run: bash tools/run_functional.sh dev-loopback ./build-debug/bin/functional

      - name: Functional suite, portable~auto pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
        run: bash tools/run_functional.sh dev-portable-auto ./build-debug/bin/functional

      - name: Functional suite, portable~gso pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: gso
        run: bash tools/run_functional.sh dev-portable-gso ./build-debug/bin/functional

      - name: Functional suite, portable~portable pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: bash tools/run_functional.sh dev-portable ./build-debug/bin/functional

  # THE LINUX PRODUCTION TRANSPORT PINS: functional_production links the
  # production library (ROCKETNET_DEV=OFF), what customers ship, so each pair
  # runs on it too. auto~auto runs on every commit (ci.yml) and
  # portable~portable nightly (nightly.yml).

  linux-pins-production:
    name: linux / production transport pins
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 7200
    strategy:
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    concurrency:
      group: nightly-run-matrix-linux-pins-production-${{ github.event_name }}-${{ matrix.ref }}
      cancel-in-progress: true
    env:
      CMAKE_BUILD_TYPE: Release
      ROCKETNET_TEST_NIGHTLY: "1"
      ROCKETNET_TEST_KEEP_GOING: "1"
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Build the production functional suite (Release, ROCKETNET_DEV=OFF)
        timeout-minutes: 10
        run: |
          cmake -S . -B build-production -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" -DROCKETNET_DEV=OFF -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build-production/bin" -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/build-production/bin"
          cmake --build build-production --target functional_production --parallel 8

      - name: Production functional suite, gso~gso pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: gso
          ROCKETNET_CLIENT_TRANSPORT: gso
        run: bash tools/run_functional.sh prod-gso-gso ./build-production/bin/functional_production

      - name: Production functional suite, gso~portable pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: gso
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: bash tools/run_functional.sh prod-gso-portable ./build-production/bin/functional_production

      - name: Production functional suite, io_uring~portable pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: io_uring
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: bash tools/run_functional.sh prod-iouring-portable ./build-production/bin/functional_production

      - name: Production functional suite, loopback~loopback pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: loopback
          ROCKETNET_CLIENT_TRANSPORT: loopback
        run: bash tools/run_functional.sh prod-loopback ./build-production/bin/functional_production

      - name: Production functional suite, portable~auto pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
        run: bash tools/run_functional.sh prod-portable-auto ./build-production/bin/functional_production

      - name: Production functional suite, portable~gso pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: gso
        run: bash tools/run_functional.sh prod-portable-gso ./build-production/bin/functional_production

  # THE LINUX DEBUG PRODUCTION BUILD: ROCKETNET_DEV=OFF with
  # CMAKE_BUILD_TYPE=Debug is a combination CMakeLists.txt accepts, so the
  # production-only code paths run once with their asserts.

  linux-production-debug:
    name: linux / Debug production functional
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 7200
    strategy:
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    concurrency:
      group: nightly-run-matrix-linux-production-debug-${{ github.event_name }}-${{ matrix.ref }}
      cancel-in-progress: true
    env:
      CMAKE_BUILD_TYPE: Debug
      ROCKETNET_TEST_NIGHTLY: "1"
      ROCKETNET_TEST_KEEP_GOING: "1"
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Build the production functional suite (Debug, ROCKETNET_DEV=OFF)
        timeout-minutes: 10
        run: |
          cmake -S . -B build-production-debug -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" -DROCKETNET_DEV=OFF -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build-production-debug/bin" -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/build-production-debug/bin"
          cmake --build build-production-debug --target functional_production --parallel 8

      - name: Production functional suite (automatic transport order)
        run: bash tools/run_functional.sh prod ./build-production-debug/bin/functional_production

  # THE LINUX BUILD TYPES: CMakeLists.txt names four, and ROCKETNET_HARDEN
  # applies to the three optimized ones; Release and Debug run on every
  # commit, so the other two run both suites here. The optimizer level
  # changes timing and undefined-behaviour exposure in the transports.

  linux-build-types:
    name: linux / build types
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
        build: [MinSizeRel, RelWithDebInfo]
    concurrency:
      group: nightly-run-matrix-linux-build-types-${{ github.event_name }}-${{ matrix.ref }}-${{ matrix.build }}
      cancel-in-progress: true
    env:
      ROCKETNET_TEST_NIGHTLY: "1"
      ROCKETNET_TEST_KEEP_GOING: "1"
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Build both suites
        timeout-minutes: 10
        env:
          CMAKE_BUILD_TYPE: ${{ matrix.build }}
        run: |
          cmake -S . -B build-type -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build-type/bin" -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/build-type/bin"
          cmake --build build-type --target test functional --parallel 8

      - name: Unit suite
        run: ./build-type/bin/test

      - name: Functional suite (automatic transport order)
        if: ${{ !cancelled() }}
        run: bash tools/run_functional.sh dev ./build-type/bin/functional

  # THE LINUX COMPILE-TIME VALUES AND OPTIONS: each documented bound and each
  # CMake option at its other value builds both suites and runs them (the
  # external transport row, the unit suite alone). matrix.cfg.config is the
  # cell's config axis in tools/verification_matrix.tsv. A build with io_uring
  # or XDP compiled out runs the functional suite under a leg of its own
  # (tests/functional/expected_skips.txt): their rows leave the suite. @SRC@
  # in the flags is the checkout.

  linux-configs:
    name: linux / compile-time values and options
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
        cfg:
          - { config: "HISTORY_PACKETS=32768", flags: "-DROCKETNET_HISTORY_PACKETS=32768", variant: dev }
          - { config: "MAX_CLIENTS=32768", flags: "-DROCKETNET_MAX_CLIENTS=32768", variant: dev }
          - { config: "MAX_CLIENTS=512", flags: "-DROCKETNET_MAX_CLIENTS=512", variant: dev }
          - { config: "ROCKETNET_HARDEN=OFF", flags: "-DROCKETNET_HARDEN=OFF", variant: dev }
          - { config: "ROCKETNET_IO_URING=OFF", flags: "-DROCKETNET_IO_URING=OFF", variant: dev-nouring }
          - { config: "ROCKETNET_XDP=OFF", flags: "-DROCKETNET_XDP=OFF", variant: dev-noxdp }
          - { config: "ROCKETNET_XDP_MEMORY_MIB=non-default", flags: "-DROCKETNET_XDP_MEMORY_MIB=4096", variant: dev }
          - { config: "ROCKETNET_TRANSPORT_SOURCES=external", flags: "-DROCKETNET_TRANSPORT_SOURCES=@SRC@/tests/driver_extension/backend.cpp -DROCKETNET_TRANSPORT_REGISTRY_HEADER=@SRC@/tests/driver_extension/registry.inc", variant: none }
    concurrency:
      group: nightly-run-matrix-linux-configs-${{ github.event_name }}-${{ matrix.ref }}-${{ matrix.cfg.config }}
      cancel-in-progress: true
    env:
      CMAKE_BUILD_TYPE: Release
      ROCKETNET_TEST_NIGHTLY: "1"
      ROCKETNET_TEST_KEEP_GOING: "1"
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Build both suites
        timeout-minutes: 10
        env:
          CONFIG_FLAGS: ${{ matrix.cfg.flags }}
          VARIANT: ${{ matrix.cfg.variant }}
        run: |
          flags=${CONFIG_FLAGS//@SRC@/$PWD}
          # shellcheck disable=SC2086
          cmake -S . -B build-config -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" $flags -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build-config/bin" -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/build-config/bin"
          if [ "$VARIANT" = none ]; then
            cmake --build build-config --target test --parallel 8
          else
            cmake --build build-config --target test functional --parallel 8
          fi

      - name: Unit suite
        run: ./build-config/bin/test

      - name: Functional suite (automatic transport order)
        if: ${{ !cancelled() && matrix.cfg.variant == 'dev' }}
        run: bash tools/run_functional.sh dev ./build-config/bin/functional

      - name: Functional suite, io_uring compiled out
        if: ${{ !cancelled() && matrix.cfg.variant == 'dev-nouring' }}
        run: bash tools/run_functional.sh dev-nouring ./build-config/bin/functional

      - name: Functional suite, XDP compiled out
        if: ${{ !cancelled() && matrix.cfg.variant == 'dev-noxdp' }}
        run: bash tools/run_functional.sh dev-noxdp ./build-config/bin/functional

  # THE LINUX FUNCTIONAL SUITE ON A SYSTEM LIBSODIUM: ROCKETNET_USE_SYSTEM_SODIUM=ON
  # against the same content-verified 1.0.20 prefix ci.yml's sodium-pinned
  # leg builds (same cache key), so the functional suite runs on the other
  # crypto library too; the pinned leg runs the unit suite.

  linux-system-sodium:
    name: linux / functional on the pinned system libsodium
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 7200
    strategy:
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    concurrency:
      group: nightly-run-matrix-linux-system-sodium-${{ github.event_name }}-${{ matrix.ref }}
      cancel-in-progress: true
    env:
      CMAKE_BUILD_TYPE: Release
      ROCKETNET_TEST_NIGHTLY: "1"
      ROCKETNET_TEST_KEEP_GOING: "1"
      SODIUM_VERSION: "1.0.20"
      SODIUM_SHA256: "ebb65ef6ca439333c2bb41a0c1990587288da07f6c7fd07cb3a18cc18d30ce19"
      SODIUM_PREFIX: ${{ github.workspace }}/sodium-pin
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Read the host the prefix is built for
        id: host
        run: |
          . /etc/os-release
          libc="$(getconf GNU_LIBC_VERSION | tr ' ' '-')"
          host="${ID}-${VERSION_ID}-$(uname -m)-${libc}"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "pinned libsodium prefix for host $host on $RUNNER_NAME"

      - name: Restore the pinned sodium prefix
        id: sodium-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ env.SODIUM_PREFIX }}
          key: sodium-pin-${{ env.SODIUM_VERSION }}-${{ runner.os }}-${{ steps.host.outputs.host }}

      - name: Build the pinned libsodium from source (content-verified)
        timeout-minutes: 4
        if: steps.sodium-cache.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/jedisct1/libsodium/releases/download/${SODIUM_VERSION}-RELEASE/libsodium-${SODIUM_VERSION}.tar.gz"
          curl -fsSL -o sodium.tar.gz "$url"
          echo "${SODIUM_SHA256}  sodium.tar.gz" | sha256sum -c -
          mkdir sodium-src
          tar xzf sodium.tar.gz -C sodium-src --strip-components=1
          cd sodium-src
          ./configure --prefix="${SODIUM_PREFIX}" --disable-dependency-tracking
          make -j"$(nproc)"
          make install

      - name: Prove pkg-config resolves the pin
        env:
          PKG_CONFIG_LIBDIR: ${{ env.SODIUM_PREFIX }}/lib/pkgconfig
        run: |
          resolved="$(pkg-config --modversion libsodium)"
          echo "pkg-config resolves libsodium ${resolved} (pin is ${SODIUM_VERSION})"
          [ "$resolved" = "$SODIUM_VERSION" ]

      - name: Build the functional suite against the pinned sodium
        timeout-minutes: 10
        env:
          PKG_CONFIG_LIBDIR: ${{ env.SODIUM_PREFIX }}/lib/pkgconfig
        run: |
          cmake -S . -B build-sodium -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" -DROCKETNET_USE_SYSTEM_SODIUM=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build-sodium/bin" -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/build-sodium/bin"
          cmake --build build-sodium --target functional --parallel 8

      - name: Functional suite, ROCKETNET_USE_SYSTEM_SODIUM=ON
        env:
          LD_LIBRARY_PATH: ${{ env.SODIUM_PREFIX }}/lib
        run: bash tools/run_functional.sh dev ./build-sodium/bin/functional
