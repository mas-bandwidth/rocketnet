# The ACK run checks, each night, on the fleet's Linux long runners. Each
# check must show its verdict and each control must show its failure; a
# HOLD (out of memory, timeout, no verdict, a control that did not fail)
# fails its job, so a red night shows as red.
#
# Until 2026-11-12 this job ran ack-run-bound-8 (ESBMC, Z3) on studio and
# was red every night: ESBMC 8.5 encodes each write through a pointer with a
# symbolic offset into the 260 KB endpoint as a byte-level update of the
# whole object, the production visit makes one per newly acked record, and
# from the second such write the formula grows by tens of GB per write; Z3
# answered unknown ("SMT solver failed") after 79 minutes each night. The
# measurements are in proofs/cbmc/INVENTORY.md, "ACK run measurements"; not
# even run length 1 fits in 150 GB with Bitwuzla. In its place, the bound-8
# claim checked by running the production leaf on every case of the
# harness's finite state, empty and with live neighbours (51.3e9 cases),
# with its negative control, its vacuity plant and four planted bugs, each
# of which must fail. This is exhaustive native testing, not a symbolic
# proof; INVENTORY.md says what that does and does not cover. Measured: the
# whole set in 880 s wall, 6076 s CPU on 8 cores of an M5 Max; under 10 MB
# for the check, 121 MB peak for the compiler.

name: Nightly ACK proof

on:
  schedule:
    - cron: "0 7 * * *"   # daily at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exhaustive:
    name: ACK run exhaustive (bound 8)
    runs-on: [self-hosted, Linux, X64, fleet, long]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: ack-run-exhaustive-8
        run: |
          set -o pipefail
          make -C proofs/cbmc ack-run-exhaustive-8 2>&1 | tee proofs/cbmc/ack-run-exhaustive-8-output.txt

      - name: ack-run-exhaustive-negative-control
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          make -C proofs/cbmc ack-run-exhaustive-negative-control 2>&1 | tee proofs/cbmc/ack-run-exhaustive-negative-control-output.txt

      - name: ack-run-exhaustive-vacuity-plant
        if: ${{ !cancelled() }}
        run: make -C proofs/cbmc ack-run-exhaustive-vacuity-plant

      - name: ack-run-exhaustive-mutants
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          make -C proofs/cbmc ack-run-exhaustive-mutants 2>&1 | tee proofs/cbmc/ack-run-exhaustive-mutants-output.txt

      - name: Upload the output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: nightly-ack-exhaustive
          path: proofs/cbmc/ack-run-*-output.txt
          if-no-files-found: ignore
