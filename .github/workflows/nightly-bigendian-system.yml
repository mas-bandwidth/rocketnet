# Nightly full-system big-endian leg.
#
# ci.yml's big-endian leg cross-compiles for s390x and runs the wire check
# under qemu-user. It does not run the socket-crossing suite. Under qemu-user
# a UDP_SEGMENT burst arrives as one datagram, and the portable rung's
# receive loop stalls, so those results are the emulator's and not the
# platform's. This workflow boots a real s390x guest kernel under
# qemu-system-s390x and runs the unmodified suite there. The guest kernel
# owns the sockets.
#
# What it covers: ./bin/test, then ./bin/functional on the auto ladder, then
# ./bin/functional with the portable rung pinned. The guest image is Ubuntu
# 24.04 s390x, checked against the release SHA256SUMS and that file's GPG
# signature before the overlay is created. The suite is compiled inside the
# guest, so the toolchain matches the guest. Every compile carries
# -ffp-contract=off (the CMake target floor, and the same flag on the
# configure line). Every case that fails is then replayed alone, three times,
# in the same guest, each replay printing its own exit and seconds.
#
# What it does not cover: a physical big-endian machine, an attached xdp
# data plane (the guest does not grant one; the pin test still asserts the
# refusal), and the byte-order wire check, which stays on the per-commit
# leg. This is not a per-commit gate. A red night is a finding to read.
#
# Reader: whoever takes the run the next morning.
#
# Schedule: 15 11 * * * UTC. fuzz-nightly.yml is 07:17 UTC, nightly.yml is
# 08:40 UTC, and nightly-soak.yml is 09:00 UTC. Runs have no repository
# execution-time cap, so these workflows can overlap.

name: nightly big-endian system

on:
  schedule:
    - cron: "15 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Test execution has no repository wall-clock cap; GitHub still limits
# self-hosted jobs to five days.
env:
  ROCKETNET_NIGHTLY_NO_TIMEOUT: '1'

jobs:
  bigendian-system:
    name: s390x full system
    runs-on: [self-hosted, Linux, X64, fleet, long]
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    concurrency:
      group: nightly-bigendian-system-${{ matrix.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Check the fleet's qemu packages are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in qemu-system-s390x cloud-localds qemu-img; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify the s390x cloud image, boot the guest, and run the suite
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP:-/tmp}/bigendian-system"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cd "$WORK"

          BASE=https://cloud-images.ubuntu.com/releases/noble/release
          IMAGE=ubuntu-24.04-server-cloudimg-s390x.img
          # Pinned fingerprint of the UEC Image Automatic Signing Key.
          # Any other key is a failed verification, and the image is not used.
          PIN=D2EB44626FDDC30B513D5BB71A5D6C4C7DB87C81

          curl -fsSL -o SHA256SUMS "$BASE/SHA256SUMS"
          curl -fsSL -o SHA256SUMS.gpg "$BASE/SHA256SUMS.gpg"
          export GNUPGHOME="$WORK/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --keyid-format long --keyserver hkps://keyserver.ubuntu.com --recv-keys "$PIN"
          FP=$(gpg --batch --with-colons --fingerprint "$PIN" | awk -F: '/^fpr:/ {print $10; exit}')
          echo "signing-key fingerprint ${FP}"
          test "$FP" = "$PIN"
          gpg --batch --status-fd 1 --keyid-format long --verify SHA256SUMS.gpg SHA256SUMS | tee gpg-status.txt
          grep -q '^\[GNUPG:\] GOODSIG ' gpg-status.txt
          grep -q "^\[GNUPG:\] VALIDSIG ${PIN} " gpg-status.txt
          curl -fL --retry 3 -o "$IMAGE" "$BASE/$IMAGE"
          grep -F "*${IMAGE}" SHA256SUMS | sha256sum -c -

          qemu-img create -f qcow2 -F qcow2 -b "$WORK/$IMAGE" "$WORK/overlay.qcow2" 8G
          ssh-keygen -t ed25519 -f "$WORK/guest_key" -N "" -q
          chmod 600 "$WORK/guest_key"
          PUB=$(cat "$WORK/guest_key.pub")
          cat > "$WORK/user-data" << EOF
          #cloud-config
          hostname: be-guest
          resize_rootfs: true
          ssh_pwauth: false
          users:
            - name: runner
              sudo: ALL=(ALL) NOPASSWD:ALL
              groups: sudo
              shell: /bin/bash
              lock_passwd: true
              ssh_authorized_keys:
                - ${PUB}
          EOF
          printf 'instance-id: rn-be-1\nlocal-hostname: be-guest\n' > "$WORK/meta-data"
          cloud-localds "$WORK/seed.img" "$WORK/user-data" "$WORK/meta-data"

          PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')
          echo "guest ssh port ${PORT}"
          : > "$WORK/serial.log"
          qemu-system-s390x \
            -machine s390-ccw-virtio \
            -cpu max \
            -accel tcg,thread=multi \
            -m 49152 \
            -smp 4 \
            -display none \
            -serial file:"$WORK/serial.log" \
            -drive "file=$WORK/overlay.qcow2,if=none,id=hd0,format=qcow2,cache=writeback" \
            -device virtio-blk-ccw,drive=hd0,bootindex=1 \
            -drive "file=$WORK/seed.img,if=none,id=cidata,format=raw" \
            -device virtio-blk-ccw,drive=cidata \
            -netdev "user,id=net0,hostfwd=tcp:127.0.0.1:${PORT}-:22" \
            -device virtio-net-ccw,netdev=net0 \
            >"$WORK/qemu.log" 2>&1 &
          QEMU_PID=$!
          cleanup() {
            if [ -n "${QEMU_PID:-}" ] && kill -0 "$QEMU_PID" 2>/dev/null; then
              kill "$QEMU_PID" 2>/dev/null || true
              wait "$QEMU_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          SSH=(ssh -i "$WORK/guest_key" -p "$PORT"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o IdentitiesOnly=yes
            -o ConnectTimeout=5
            runner@127.0.0.1)
          SCP=(scp -i "$WORK/guest_key" -P "$PORT"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o IdentitiesOnly=yes)
          ok=0
          i=0
          while :; do
            i=$((i + 1))
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "qemu exited before ssh"
              tail -n 40 "$WORK/serial.log" || true
              exit 1
            fi
            if "${SSH[@]}" true 2>/dev/null; then
              ok=1
              echo "ssh up at try ${i}"
              break
            fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "ssh did not come up"
            tail -n 40 "$WORK/serial.log" || true
            exit 1
          fi

          "${SSH[@]}" 'uname -sn; date -u'
          tar -C "$GITHUB_WORKSPACE" --exclude .git --exclude build --exclude bin -cf "$WORK/src.tar" .
          "${SCP[@]}" "$WORK/src.tar" "runner@127.0.0.1:src.tar"
          "${SSH[@]}" 'mkdir -p ~/src && tar -C ~/src -xf ~/src.tar'
          "${SSH[@]}" 'sudo DEBIAN_FRONTEND=noninteractive apt-get update -y && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake pkg-config libbpf-dev libxdp-dev xxd python3 time'
          # TCG gives each case a fraction of a native CPU. Keep the Release
          # workloads unchanged, but opt their completion bounds into the
          # suites' stated 5x emulation scale.
          # The 1000-client scale fixtures reserve about 36 GiB of sparse
          # virtual plans while touching about 1 GiB. Give the guest 48 GiB
          # of addressable RAM so its normal allocation policy accepts those
          # plans; QEMU commits host pages on demand. Keep the suite RSS
          # assertions and the guest memory policy unchanged.
          # Bare --parallel launches every translation unit at once; keep
          # compiler concurrency bounded independently of test run time.
          "${SSH[@]}" 'cd ~/src && cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-ffp-contract=off -DCMAKE_CXX_FLAGS="-ffp-contract=off -DROCKETNET_TEST_EMULATED=1" && cmake --build build --target test functional --parallel 2' 2>&1 | tee "$WORK/build.log"
          "${SSH[@]}" 'cd ~/src && readelf -h bin/test && readelf -h bin/functional && readelf -h bin/test | grep -F -q "big endian" && readelf -h bin/test | grep -F -q "IBM S/390"'

          "${SSH[@]}" bash -s << 'GUEST'
          set +e
          export ROCKETNET_NIGHTLY_NO_TIMEOUT=1
          cd ~/src
          # The guest kernel's socket buffer ceiling is the stock 256 KiB, so
          # the 8 MiB receive buffer the suite asks for is clamped and a
          # receiver that the emulator stalls for a moment overflows. The
          # fleet hosts that run the native suite grant 4 MiB; give the guest
          # the same ceiling so it runs the suite on the same terms.
          sudo sysctl -w net.core.rmem_max=4194304 net.core.wmem_max=4194304
          uname -sn
          date -u
          rc=0
          /usr/bin/time -f UNIT_SEC=%e ./bin/test 2>&1 | tee unit.out
          u=${PIPESTATUS[0]}
          echo UNIT_EXIT:$u
          [ "$u" -eq 0 ] || rc=$u
          /usr/bin/time -f FUNC_AUTO_SEC=%e ./bin/functional 2>&1 | tee func_auto.out
          a=${PIPESTATUS[0]}
          echo FUNC_AUTO_EXIT:$a
          [ "$a" -eq 0 ] || rc=$a
          ROCKETNET_SERVER_TRANSPORT=portable ROCKETNET_CLIENT_TRANSPORT=portable /usr/bin/time -f FUNC_PORT_SEC=%e ./bin/functional 2>&1 | tee func_port.out
          p=${PIPESTATUS[0]}
          echo FUNC_PORT_EXIT:$p
          [ "$p" -eq 0 ] || rc=$p
          # Every case that failed in this run is replayed alone, three times,
          # on the quiet guest. A case that passes alone was timing under the
          # other work on the host; a case that fails alone is a defect to fix
          # at its cause. Each replay prints its own exit and seconds.
          # A runner-level failure prints "check failed: <case> exceeded|exit|signal ...".
          # A unit case's own check prints
          # "check failed: ( <condition> ), function <case>, file ..." and that
          # function is the registered case name. The functional suite prints
          # the same shape, but its function can be a helper shared by several
          # cases, so only the unit suite is named from it.
          replay() {
            label="$1"; bin="$2"; out="$3"; envs="$4"; from_function="$5"
            names=$(sed -n 's/^check failed: \(test_[a-z0-9_]*\) \(exceeded\|exit\|signal\).*/\1/p' "$out")
            if [ "$from_function" = 1 ]; then
              names="$names
          $(sed -n 's/^check failed: ( .* ), function \(test_[a-z0-9_]*\), file .*/\1/p' "$out")"
            fi
            names=$(printf '%s\n' "$names" | sed '/^$/d' | sort -u)
            if [ -z "$names" ]; then
              if grep -q 'check failed:' "$out"; then
                echo "REPLAY_NO_CASE_NAME:$label a check failed with no case name in it; replay that case by hand"
              fi
              return 0
            fi
            for name in $names; do
              if [ -x "./bin/$name" ]; then
                target="./bin/$name"
                args=""
              else
                target="$bin"
                args="--run $name"
              fi
              i=1
              while [ "$i" -le 3 ]; do
                echo "REPLAY_BEGIN:$label:$name RUN:$i"
                env $envs /usr/bin/time -f "REPLAY_CASE:$name RUN:$i EXIT:%x SEC:%e" $target $args
                echo "REPLAY_END:$label:$name RUN:$i"
                i=$((i+1))
              done
            done
          }
          replay unit ./bin/test unit.out "" 1
          replay func_auto ./bin/functional func_auto.out "" 0
          replay func_port ./bin/functional func_port.out "ROCKETNET_SERVER_TRANSPORT=portable ROCKETNET_CLIENT_TRANSPORT=portable" 0
          exit $rc
          GUEST

      - name: Preserve guest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: bigendian-system-diagnostics-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/bigendian-system/serial.log
            ${{ runner.temp }}/bigendian-system/qemu.log
            ${{ runner.temp }}/bigendian-system/build.log
          if-no-files-found: ignore
