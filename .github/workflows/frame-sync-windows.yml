# Measures the frame sync mechanisms on a windows runner, per issue #56 --
# the estate has no windows box, so the runner's shared VM stands in. Its
# numbers are the noisy-cloud-windows cell: exactly what a windows dedicated
# server on cheap cloud would see.

name: frame-sync-windows

on:
  workflow_dispatch:

jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:

      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: cl /O2 /nologo frame_sync_prototype.c winmm.lib

      - name: Measure quiet
        shell: cmd
        run: frame_sync_prototype.exe

      - name: Measure under load
        shell: cmd
        run: frame_sync_prototype.exe load
