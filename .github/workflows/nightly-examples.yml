name: Nightly examples

# The examples are programs over the real transport and the wall clock, so
# they are the functional tier, not the per-commit gate. This workflow builds
# and runs the whole series on the same Linux, macOS and Windows runners
# ci.yml uses, once a night and on demand, and never on a commit.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-examples
  cancel-in-progress: false

permissions:
  contents: read

# Test execution has no repository wall-clock cap; GitHub still limits
# self-hosted jobs to five days.
env:
  ROCKETNET_NIGHTLY_NO_TIMEOUT: '1'

jobs:
  examples:
    name: ${{ matrix.os }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, runner: '["self-hosted","Linux","X64","fleet"]' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ xxd pkg-config python3; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Check the examples against the house rules
        if: runner.os != 'Windows'
        run: python3 tools/check_examples.py

      - name: Run the examples
        if: runner.os != 'Windows'
        run: python3 tools/run_examples.py --build build

      # the backend pair: example_backend_server, a backend from
      # examples/backend/ (Go, then C#) minting the token, example_backend_client
      - name: Run the backend examples
        if: runner.os != 'Windows'
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_NOLOGO: 1
        run: python3 tools/run_backend_examples.py --build build

  examples-macos:
    name: macos-15
    runs-on: [self-hosted, macOS, ARM64, rocketnet-macos]
    timeout-minutes: 7200
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ "$RUNNER_OS" = "macOS" ]; then
            # darwin has no libbpf, libxdp or liburing; libsodium is the independent parity reference check_sodium.py loads
            for tool in cmake clang c++ xxd python3; do
              if ! command -v "$tool" >/dev/null 2>&1; then
                echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
                missing=1
              fi
            done
            if ! python3 -c "import ctypes.util, sys; sys.exit(0 if ctypes.util.find_library('sodium') else 1)"; then
              echo "TOOL-MISSING libsodium (any) (ctypes.util.find_library failed) on $RUNNER_NAME"
              missing=1
            fi
            exit "$missing"
          fi
          for tool in cmake gcc g++ clang xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Check the examples against the house rules
        run: python3 tools/check_examples.py

      - name: Run the examples
        run: python3 tools/run_examples.py --build build

      - name: Build universal and run the x86_64 slice under Rosetta 2
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-universal \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_BUILD_TYPE=Release -DROCKETNET_DEV=OFF
          cmake --build build-universal --config Release --clean-first --parallel 4
          lipo -info build-universal/librocketnet.a bin/librocketnet.dylib
          for arch in arm64 x86_64; do
            lipo -archs build-universal/librocketnet.a | tr ' ' '\n' | grep -qx "$arch"
            lipo -archs bin/librocketnet.dylib | tr ' ' '\n' | grep -qx "$arch"
            otool -l -arch "$arch" bin/librocketnet.dylib | grep -A4 LC_BUILD_VERSION | grep -q 'minos 12.0'
          done
          python3 tools/check_package.py build-universal --config Release
          python3 tools/check_dll_consumer.py --build build-universal
          if ! arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            echo "TOOL-MISSING Rosetta 2 (x86_64 translation) (arch -x86_64 refused) on $RUNNER_NAME"
            exit 1
          fi
          arch -x86_64 ./bin/test
          arch -x86_64 ./bin/test_lifecycle
          arch -x86_64 ./bin/functional
          # a pin covers every create in the process, so the suite's own
          # per-pump cases run unpinned above; the pinned cells run the
          # transport-matrix socket cases, as .github/workflows/ci.yml:322-373 does
          for transport in portable msgx; do
            for case in test_loopback_transport_udp test_loopback_transport_ipv6 \
                        test_transport_dual_stack_ipv4_client test_transport_env_pin_is_honoured; do
              env ROCKETNET_SERVER_TRANSPORT=$transport ROCKETNET_CLIENT_TRANSPORT=$transport \
                arch -x86_64 ./bin/functional --run "$case"
            done
          done

  examples-windows:
    name: windows-2025
    runs-on: [self-hosted, Windows, X64, rocketnet-windows]
    timeout-minutes: 7200
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run the examples (Windows)
        run: python tools/run_examples.py --build build --config Release
