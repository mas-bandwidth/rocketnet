name: Nightly examples

# The examples are programs over the real transport and the wall clock, so
# they are the functional tier, not the per-commit gate. This workflow builds
# and runs the whole series on the same Linux, macOS and Windows runners
# ci.yml uses, once a night and on demand, and never on a commit.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-examples
  cancel-in-progress: false

jobs:
  examples:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner && fromJSON(matrix.runner) || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, runner: '["self-hosted","Linux","X64","fleet"]' }
    steps:
      - uses: actions/checkout@v4

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ xxd pkg-config python3; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Check the examples against the house rules
        if: runner.os != 'Windows'
        run: python3 tools/check_examples.py

      - name: Run the examples
        if: runner.os != 'Windows'
        run: python3 tools/run_examples.py --build build

  examples-macos:
    name: macos-15
    # DISABLED: no darwin fleet runner registered for this repository; owed: a darwin runner registered for this repository
    if: false
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        run: brew install libsodium pkgconf || brew install libsodium pkg-config

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Check the examples against the house rules
        run: python3 tools/check_examples.py

      - name: Run the examples
        run: python3 tools/run_examples.py --build build

  macos-universal:
    name: macos-universal
    # The fleet's Apple-silicon member. Rosetta 2 runs the x86_64 slice; a
    # member without it fails at the first `arch -x86_64` rather than passing.
    runs-on: [self-hosted, macOS, ARM64, rocketnet-macos]
    steps:
      - uses: actions/checkout@v4

      - name: Configure universal
        run: >-
          cmake -S . -B build-universal
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_BUILD_TYPE=Release

      - name: Build universal
        run: cmake --build build-universal --config Release --parallel 4

      - name: Check both slices of the static and shared libraries
        run: |
          set -euo pipefail
          for library in build-universal/librocketnet.a bin/librocketnet.dylib; do
            lipo -info "$library" | tee "$library.lipo"
            grep -q arm64 "$library.lipo"
            grep -q x86_64 "$library.lipo"
          done

      - name: Run the x86_64 slice under Rosetta 2
        run: |
          set -euo pipefail
          arch -x86_64 ./bin/test
          arch -x86_64 ./bin/test_lifecycle
          arch -x86_64 ./bin/functional
          ROCKETNET_SERVER_TRANSPORT=portable ROCKETNET_CLIENT_TRANSPORT=portable arch -x86_64 ./bin/functional
          ROCKETNET_SERVER_TRANSPORT=msgx ROCKETNET_CLIENT_TRANSPORT=msgx arch -x86_64 ./bin/functional

  examples-windows:
    name: windows-2025
    # DISABLED: no Windows fleet runner registered for this repository; owed: the Windows fleet machine
    if: false
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run the examples (Windows)
        run: python tools/run_examples.py --build build --config Release
