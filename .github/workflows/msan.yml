# The MemorySanitizer leg: the portable (non-XDP, no io_uring) unit suite,
# built with clang -fsanitize=memory and origin tracking, with the vendored
# sodium compiled the same way (sodium/ is part of the build; the default
# config uses it, so every linked object is instrumented). tools/run_msan.sh
# is the one command. A clean run prints "MSan: clean". The script fails when a
# finding is not listed in tools/msan_known.txt, when a test crashes or fails,
# or when the run stops without a test fail line; a listed finding does not
# fail the script (MSan's exitcode is 0, so the suite runs every test). The
# C++ library is the MSan-instrumented libc++ the fleet installs under
# /opt/msan-libcxx-<clang version> (tools/build_msan_libcxx.sh); a runner
# without it fails with a TOOL-MISSING line. The job stays continue-on-error
# until it has gated green on the fleet for a while (after v1.0.0-preview-2).
name: msan

on:
  push:
    # main only: a feature branch runs msan once, for its PR, not twice
    # (push and pull_request refs are different concurrency groups).
    branches: [ main ]
  pull_request:

concurrency:
  # each main commit queues in its own group: pending runs on main are
  # replaced, not queued, so a burst of landings leaves every commit a verdict
  group: msan-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # main never cancels a run in progress: every merge gets a verdict.
  # Branches and PRs still cancel a superseded run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  msan:
    name: MemorySanitizer
    runs-on: [self-hosted, Linux, X64, fleet]
    continue-on-error: true
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake build-essential clang libbpf-dev libxdp-dev libsodium-dev xxd

      - name: Run the MSan gate
        run: bash tools/run_msan.sh
