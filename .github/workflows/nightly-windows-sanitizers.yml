# THE NIGHTLY WINDOWS clang-cl ADDRESSSANITIZER.
#
# nightly.yml's windows / Release ASan job runs the suites under MSVC
# AddressSanitizer in Release. This workflow adds the Windows check that job
# does not make, on the fleet's native Windows runner (label
# rocketnet-windows), in its own build directory:
#
#   clangcl-asan  clang-cl (Visual Studio's LLVM toolset, -T ClangCL) with
#                 -DROCKETNET_SANITIZE_ADDRESS=ON, in DEBUG, so the asserts
#                 Release compiles out stay in. clang-cl refuses
#                 AddressSanitizer with the debug CRT, so this leg links the
#                 release CRT (/MD, CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL);
#                 NDEBUG stays undefined. It runs test.exe and test_sodium.exe,
#                 test_lifecycle.exe (portable pins), test_iocp.exe, and
#                 functional.exe once per server transport: portable, iocp and
#                 rio (the client takes its automatic order).
#
# Every run step runs even when an earlier one is red, so a night shows all of
# them. The Debug figure of the per-case peak-RSS bound applies
# (ROCKETNET_TEST_MAX_CASE_RSS_MB=2048, as nightly.yml's windows / Debug job
# sets it). No suppression, no skipped case and no changed bound: a finding is
# a defect with its own card.
#
# The bench: every job on this runner takes one shared winlock slot through
# the runner's job-started hook, and a scheduled or dispatched job waits up to
# 50 minutes in "Set up job" for it. Each timeout covers that wait plus the
# steps.

name: nightly-windows-sanitizers

on:
  schedule:
    - cron: "10 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # the build cap on a shared fleet runner: cmake --build reads it, and the
  # Makefile defaults its JOBS to it (tools/check_make_jobs.sh)
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  windows-sanitizers:
    name: windows ${{ matrix.leg }}
    runs-on: [self-hosted, Windows, X64, rocketnet-windows]
    timeout-minutes: 220
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
        leg: [clangcl-asan]
    concurrency:
      group: nightly-windows-sanitizers-${{ matrix.ref }}-${{ matrix.leg }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    env:
      ROCKETNET_TEST_MAX_CASE_RSS_MB: 2048
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Find the clang-cl AddressSanitizer runtime
        if: matrix.leg == 'clangcl-asan'
        run: |
          set -euo pipefail
          vs=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath | tr -d '\r')
          clang_cl="$(cygpath "$vs")/VC/Tools/Llvm/x64/bin/clang-cl.exe"
          if [ ! -x "$clang_cl" ]; then
            echo "TOOL-MISSING clang-cl (Visual Studio ClangCL toolset, any) (VC/Tools/Llvm/x64/bin under ${vs:-no Visual Studio}) on $RUNNER_NAME"
            exit 1
          fi
          runtime="$(cygpath "$("$clang_cl" -print-resource-dir | tr -d '\r')")/lib/windows"
          if [ ! -f "$runtime/clang_rt.asan_dynamic-x86_64.dll" ]; then
            echo "TOOL-MISSING clang_rt.asan_dynamic-x86_64.dll (any) ($runtime) on $RUNNER_NAME"
            exit 1
          fi
          "$clang_cl" --version | head -1

      - name: Configure
        run: |
          set -euo pipefail
          case "${{ matrix.leg }}" in
            clangcl-asan) dir=build-asan-clangcl; extra=(-T ClangCL -DROCKETNET_SANITIZE_ADDRESS=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL) ;;
          esac
          echo "LEG_BUILD_DIR=$dir" >> "$GITHUB_ENV"
          echo "LEG_BIN=$dir/bin/Debug" >> "$GITHUB_ENV"
          # each leg writes its binaries under its own build directory, so no leg replaces another's (or bin/)
          cmake -B "$dir" -A x64 "${extra[@]}" "-DCMAKE_RUNTIME_OUTPUT_DIRECTORY=$PWD/$dir/bin" "-DCMAKE_LIBRARY_OUTPUT_DIRECTORY=$PWD/$dir/bin"

      - name: Build Debug
        id: build
        timeout-minutes: 30
        run: cmake --build "$LEG_BUILD_DIR" --config Debug

      # ---- clang-cl AddressSanitizer ----

      - name: Unit suite and sodium under ASan
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.leg == 'clangcl-asan' }}
        timeout-minutes: 20
        run: |
          set -o pipefail
          rc=0
          "$LEG_BIN/test.exe" 2>&1 | tr -d '\r' | tee unit.log || rc=1
          "$LEG_BIN/test_sodium.exe" 2>&1 | tr -d '\r' | tee sodium.log || rc=1
          exit "$rc"

      - name: Lifecycle suite under ASan (portable)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.leg == 'clangcl-asan' }}
        timeout-minutes: 15
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: |
          set -o pipefail
          "$LEG_BIN/test_lifecycle.exe" 2>&1 | tr -d '\r' | tee lifecycle.log

      - name: IOCP and RIO transport suite under ASan
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.leg == 'clangcl-asan' }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          "$LEG_BIN/test_iocp.exe" 2>&1 | tr -d '\r' | tee iocp.log

      - name: Functional suite under ASan, per server transport
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.leg == 'clangcl-asan' }}
        timeout-minutes: 120
        run: |
          set -o pipefail
          rc=0
          for server in portable iocp rio; do
            echo "::group::functional, server transport $server"
            ROCKETNET_SERVER_TRANSPORT=$server "$LEG_BIN/functional.exe" 2>&1 | tr -d '\r' | tee "functional-$server.log" || { echo "FAIL functional with server transport $server"; rc=1; }
            echo "::endgroup::"
          done
          exit "$rc"

      # GitHub expressions have no replace(): the artifact name's ref and leg slug is made here
      - name: Artifact name for the ref and leg
        id: slug
        if: failure()
        env:
          REF: ${{ matrix.ref }}
          LEG: ${{ matrix.leg }}
        run: |
          s="$REF-$LEG"; s=${s//\//-}
          echo "slug=$s" >> "$GITHUB_OUTPUT"

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: nightly-windows-sanitizers-logs-${{ steps.slug.outputs.slug }}
          path: |
            *.log
            logs/
          if-no-files-found: ignore
