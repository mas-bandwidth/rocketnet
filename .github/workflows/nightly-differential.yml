# The nightly differential: rocketnet's connect-token admission decision
# against netcode 1.02's (tools/differential/README.md), live against the
# pinned netcode source, over the case table and every file of
# tests/fuzz/corpus_connect_token. Beside it, the gate's self-test: the gate
# must pass on the tree and fail on each planted fault (a rung of the
# server's request ladder removed, a reference row altered or missing), so a
# green run here means the gate ran, compared rows, and can still fail.
#
# Its own workflow file so it merges cleanly beside the other nightly
# workflows; its `schedule:` makes it one the nightly watch reads
# (tools/check_nightly_dispositions.py). The differential fuzz target is a
# separate leg of fuzz-nightly.yml and works on the abstract case model; this
# job is the fixed gate. Neither blocks a pull request.

name: Differential (nightly)

on:
  schedule:
    - cron: "47 7 * * *"   # daily at 07:47 UTC, after the nightly fuzz starts
  workflow_dispatch:

permissions:
  contents: read

env:
  ROCKETNET_NIGHTLY_NO_TIMEOUT: '1'

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  differential:
    name: nightly differential (netcode 1.02 live, with self-test)
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    concurrency:
      group: nightly-differential-${{ github.event_name }}-${{ matrix.ref }}
      cancel-in-progress: false
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Check the fleet's build dependencies are present
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ git tar pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Check out the pinned netcode reference
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/mas-bandwidth/netcode.git netcode-ref
          git -C netcode-ref checkout --quiet 1dd10f892f4742498a99a0bb5d9b1f8f6e94f26b

      - name: 'Self-test: the gate passes stock and fails on every plant'
        env:
          DIFFERENTIAL_JOBS: '4'
        run: bash tools/differential/selftest.sh netcode-ref

      - name: The differential, live against netcode 1.02
        env:
          DIFFERENTIAL_BUILD_DIR: ${{ github.workspace }}/build-differential
          DIFFERENTIAL_JOBS: '4'
        run: |
          set -euo pipefail
          bash tools/differential/run.sh netcode-ref | tee differential.log
          grep -E '^differential: ' differential.log >> "$GITHUB_STEP_SUMMARY"
