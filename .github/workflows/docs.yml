# Reference documentation build gate.
#
# Runs MrDocs 2026.9.29 against the standalone compilation database in
# docs/mrdocs, verifies that the HTML reference pages build cleanly under
# build/docs/html, fails when `make docs-undocumented` prints any symbol of
# sdk/rocketnet.h without documentation, and uploads build/docs/html as a
# workflow artifact.

name: docs

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  # each main commit queues in its own group: pending runs on main are
  # replaced, not queued, so a burst of landings leaves every commit a verdict
  group: docs-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # main never cancels a run in progress: every merge gets a verdict.
  # Branches and PRs still cancel a superseded run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  docs:
    name: docs (MrDocs HTML reference build)
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Cache MrDocs 2026.9.29
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: build/mrdocs-2026.9.29
          key: mrdocs-2026.9.29-${{ runner.os }}-${{ runner.arch }}

      - name: Test undocumented symbol parser
        run: sh tools/docs/test_undocumented.sh

      - name: Build HTML reference documentation
        run: make docs

      - name: Build the library
        run: make build

      # Documentation links and executable examples are checked on every
      # commit after the library builds.
      - name: Check documentation gates
        run: |
          python3 tools/docs/test_check_links.py
          python3 tools/docs/check_links.py
          sh tools/docs/check_agents_md.sh all
          python3 tools/docs/check_getting_started.py
          python3 tools/docs/check_fuzz_harnesses.py

      # every public symbol carries its reference: a new function, field or
      # parameter without documentation fails the job
      - name: Refuse undocumented symbols
        run: |
          set +e
          make docs-undocumented > build/docs/undocumented.txt
          status=$?
          set -e
          cat build/docs/undocumented.txt
          count=$(wc -l < build/docs/undocumented.txt)
          if [ "$status" -ne 0 ] || [ "$count" -ne 0 ]; then
            echo "::error::make docs-undocumented printed $count undocumented symbol(s) (exit $status); document each one in sdk/rocketnet.h"
            exit 1
          fi

      - name: Upload HTML reference documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: rocketnet-docs-html
          path: build/docs/html
