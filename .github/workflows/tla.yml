name: TLA+ Model Check

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'tla/**'
      - 'sdk/**'
  schedule:
    - cron: '0 2 * * *'  # nightly at 02:00 UTC

permissions:
  contents: read

jobs:
  tla-check:
    name: Check committed TLA+ runs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download tla2tools.jar
        run: |
          URL="https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
          SHA256="936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88"
          curl -L "$URL" -o tla2tools.jar
          echo "$SHA256  tla2tools.jar" | sha256sum -c -

      - name: Run TLA+ check
        env:
          TLA2TOOLS_JAR: ${{ github.workspace }}/tla2tools.jar
        run: |
          python3 tools/check_tla_runs.py
