# THE NIGHTLY TIER FOR LEGS THAT GATE BUT DO NOT FIT THE PER-COMMIT BUDGET.
#
# This file exists because the per-commit tier
# (ci.yml) finishes in one to two minutes, and a leg that cannot is not argued
# down and is not shortened -- it moves to a tier that does not run on every
# commit.
#
# It is NOT nightly-soak.yml and it is NOT fuzz-nightly.yml, and the
# difference is worth keeping. Those two are DISCOVERY: they run the same
# instrument for longer than a gate can afford, and belief comes from
# duration. What lands here is the opposite -- an ordinary, bounded, fully
# deterministic gate that would pass or fail identically on the commit, and is
# here only because the runner it needs is slow. Nothing in this file should
# ever be justified by "it needs hours"; if it does, it belongs next door.
#
# A RED NIGHT HERE IS A GATE THAT WOULD HAVE GONE RED ON A COMMIT. That makes
# it different from a red soak, which is a finding to investigate. This one
# has a commit range and a bisect, and whoever is on the estate that morning
# owns walking it back.
#
# What is here, and why it is not on the gate:
#
#   windows-2025 / Debug    136s on run 34780374187, on a runner whose
#                           configure-and-build floor is 46s before a single
#                           check runs. Windows keeps its RELEASE row on every
#                           commit -- Release is what ships, and the optimizer
#                           is a different compiler -- so what moved here is
#                           the second configuration, whose distinct value is
#                           the asserts that Release compiles out. Every step
#                           came across unchanged.
#
#   linux / clang           the second Linux compiler. ci.yml's Linux
#                           build-and-test rows build both suites with the
#                           default compiler (gcc); this job builds and runs
#                           them with clang in Debug.

name: nightly

on:
  schedule:
    - cron: "40 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # THE LINUX SECOND COMPILER: clang, which no per-commit Linux row names --
  # ci.yml's Linux rows take the platform default (gcc) through the Makefile
  # or a plain cmake configure. This job builds the static and shared
  # libraries, the unit suite and the functional suite with clang and runs
  # both suites, so a warning, an error or a behavior that only clang shows
  # has a gate. Debug keeps the asserts, which Release compiles out.
  #
  # Measured with 16 build jobs: a clean clang Debug build takes under a
  # minute, the unit suite about 20s and the functional suite about 90s.

  linux-clang:
    name: linux / clang
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 30
    strategy:
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    concurrency:
      group: nightly-linux-clang-${{ matrix.ref }}
      cancel-in-progress: true
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Print compiler versions
        run: |
          clang --version | head -1
          clang++ --version | head -1

      - name: Configure (clang)
        run: cmake -B build-clang -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Build static and shared libraries, unit suite and functional suite (clang)
        run: cmake --build build-clang --parallel

      - name: Unit suite (clang)
        run: ./bin/test

      - name: Functional suite (clang)
        timeout-minutes: 20
        run: ./bin/functional

  # The windows Debug row, lifted from ci.yml's build-and-test-windows on
  # 2026-09-13, step for step. The doctrine it carries (#81's baseline): the
  # portable transport built with MSVC and the full test suite run on the runner.
  # /fp:precise comes from CMakeLists.txt's MSVC branch, the family's floor per
  # the -ffp-contract=off policy. Sodium is compiled from the pinned vendor
  # with the same CRT; the multi-config generator puts binaries under
  # bin/<config>. The #106 config and transport tests run here too -- setenv and
  # unsetenv are shimmed over _putenv_s in the test file -- EXCEPT the
  # empty-value distinction, which windows cannot represent: its CRT has no
  # set-but-empty variable, so that one case is not checked there. Tests
  # windows does not build are not registered there, so they are neither run
  # nor printed: the refused-destination and zero-length-chaff
  # pump tests, whose raw-socket injector is posix-only, and the gso/xdp
  # and msgx rung tests windows does not build.

  build-and-test-windows-debug:
    name: windows / Debug
    # the fleet's native Windows runner (Windows 11, MSVC; label rocketnet-windows), the one ci.yml's
    # build-and-test-windows runs on, never a hosted image
    runs-on: [self-hosted, Windows, X64, rocketnet-windows]
    # Debug only, by the owner's ruling of 2026-10-20: a Windows Debug run over the
    # per-case peak-RSS bound runs with that bound lifted, and the bound in code
    # stays. test/suite_runner.h:58 sets the bound to 698 MiB, measured on a Linux
    # Release build; test/suite_runner.h:89 reads this variable in its place. In
    # Debug on the fleet Windows runner test_swarm peaks near 750 MiB,
    # transport_loopback_* near 1480 MiB and functional cases up to about 940 MiB,
    # so 2048 covers each. Release jobs keep the 698 bound.
    env:
      ROCKETNET_TEST_MAX_CASE_RSS_MB: 2048
    strategy:
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    concurrency:
      group: nightly-windows-debug-${{ matrix.ref }}
      cancel-in-progress: true
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Check committed XDP fallback source on Windows
        # Uses the Python and CMake on the fleet Windows runner's job PATH.
        run: python tools/check_xdp_archive.py --committed-only

      - name: Configure
        run: cmake -B build -A x64 -DROCKETNET_DEV=OFF

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Run tests
        shell: bash
        run: |
          ./bin/Debug/test.exe
          ./bin/Debug/test_sodium.exe

      - name: IOCP allocation, completion lifetime, concurrency and shutdown
        timeout-minutes: 5
        run: ./bin/Debug/test_iocp.exe

      - name: Run functional suite
        timeout-minutes: 20
        shell: bash
        run: ./bin/Debug/functional.exe

      - name: Functional suite with IOCP selected
        timeout-minutes: 20
        shell: bash
        env:
          ROCKETNET_SERVER_TRANSPORT: iocp
        run: |
          set -o pipefail
          ./bin/Debug/functional.exe | tr -d '\r' | tee functional-iocp.log
          grep -qx 'test_transport_env_pin_is_honoured' functional-iocp.log

      - name: Run serialization surface (portable)
        shell: bash
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: |
          ./bin/Debug/test_serialize.exe
          ./bin/Debug/test_lifecycle.exe

      - name: Check production library boundary
        run: python tools/check_exports.py bin/Debug/rocketnet.dll build/Debug/rocketnet.lib

      - name: Install and relocate the SDK; run C/C++ static/shared consumers
        run: python tools/check_package.py build --config Debug

      - name: Ambient config isolation and passing output
        run: python tools/check_test_environment.py ./bin/Debug/test.exe

      - name: Memory plans against allocator observations
        run: python tools/check_memory.py ./bin/Debug/transport_memory.exe

      - name: Native transport contract and external backend
        run: |
          ./bin/Debug/test_transport.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./bin/Debug/test_transport_control.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_driver_extension.py build --config Debug

  # THE OUT-OF-TREE TRANSPORT BACKEND, UNDER MSVC. Lifted from ci.yml's
  # windows-2025 / Release leg (a) on 2026-09-13.
  #
  # tools/check_driver_extension.py configures and builds a transport backend
  # that lives OUTSIDE this tree against the installed SDK, and fails if the
  # extension surface a consumer compiles against has drifted. It is a
  # contract check on a fixed input -- "does this API still present itself to
  # someone outside the repo" -- not a tripwire a given commit is likely to
  # trip, which is what earns it a nightly clock rather than a per-commit one.
  #
  # WHAT DID NOT MOVE, so the hole is the right size in the reader's head: the
  # SAME SCRIPT still runs on EVERY COMMIT on Linux and macOS, inside
  # build-and-test's `Native transport contract and external backend` step, where
  # it costs 15s. What waits until morning is specifically the WINDOWS
  # spelling of it, which cost 42-48s on top of a 92s MSVC configure-and-build
  # floor and was, alone, the last thing holding ci.yml above two minutes.
  # A backend that breaks under MSVC but not under gcc or clang is the defect
  # this leg catches the next morning instead of on the commit; everything
  # else about the check still gates.
  #
  # A red here has a commit range and a bisect. Whoever is on the estate that
  # morning owns walking it back.

  windows-transport-extension:
    name: external transport backend / windows-2025
    # DISABLED: no Windows fleet runner registered for this repository; owed: the Windows fleet machine
    if: false
    runs-on: windows-2025
    strategy:
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    concurrency:
      group: nightly-windows-transport-extension-${{ matrix.ref }}
      cancel-in-progress: true
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Configure
        run: cmake -B build -A x64 -DROCKETNET_DEV=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: External transport backend
        run: python tools/check_driver_extension.py build --config Release

  # Windows MSVC AddressSanitizer over unit, lifecycle, IOCP/RIO transport and
  # functional suites (portable, iocp and rio transports) on the native Windows
  # fleet runner. Configured via -DROCKETNET_SANITIZE_ADDRESS=ON (adds
  # /fsanitize=address /Zi and link /DEBUG /INCREMENTAL:NO on every target and
  # stages clang_rt.asan_dynamic-x86_64.dll beside the built executables).
  # Measured on the Windows fleet member, one suite at a time: configure and
  # Release build from a clean tree 180 s, test.exe 62 s,
  # test_lifecycle.exe 3 s, test_iocp.exe 5 s, functional.exe 23 s
  # (default), 28 s (iocp) and 20 s (rio): about 5.5 minutes end to end.
  build-and-test-windows-asan:
    name: windows / Release ASan
    runs-on: [self-hosted, Windows, X64, rocketnet-windows]
    strategy:
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    concurrency:
      group: nightly-windows-asan-${{ matrix.ref }}
      cancel-in-progress: true
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Configure with AddressSanitizer
        run: cmake -B build -A x64 -DROCKETNET_SANITIZE_ADDRESS=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel 4

      - name: Run unit suite under ASan
        shell: bash
        run: ./bin/Release/test.exe

      - name: Run lifecycle suite under ASan
        shell: bash
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: ./bin/Release/test_lifecycle.exe

      - name: Run IOCP and RIO transport suite under ASan
        shell: bash
        run: ./bin/Release/test_iocp.exe

      - name: Run functional suite under ASan (default)
        timeout-minutes: 30
        shell: bash
        run: ./bin/Release/functional.exe

      - name: Run functional suite under ASan (ROCKETNET_SERVER_TRANSPORT=iocp)
        timeout-minutes: 30
        shell: bash
        env:
          ROCKETNET_SERVER_TRANSPORT: iocp
        run: ./bin/Release/functional.exe

      - name: Run functional suite under ASan (ROCKETNET_SERVER_TRANSPORT=rio)
        timeout-minutes: 30
        shell: bash
        env:
          ROCKETNET_SERVER_TRANSPORT: rio
        run: ./bin/Release/functional.exe

  # THE WINDOWS TOOLCHAIN MATRIX: clang-cl x64, built and tested, and an MSVC
  # ARM64 cross build, build-checked only.
  #
  # Game engines on Windows also build with clang-cl, so the LLVM toolset
  # builds the static and shared libraries, test.exe and functional.exe, runs
  # both suites, and runs the DLL consumer, package and export checks against
  # that build. Each build writes its binaries under its own build directory
  # (CMAKE_RUNTIME_OUTPUT_DIRECTORY), so neither replaces the MSVC x64
  # binaries in bin/. The ARM64 leg cross-builds the static and shared
  # libraries with MSVC, checks that rocketnet.dll is an ARM64 image and checks
  # its exports; nothing runs on ARM64 because no ARM64 runner exists.
  #
  # Measured on the fleet Windows runner, one job at a time: clang-cl configure
  # 14-17s, clean build 120-144s, test.exe 8s, functional.exe 20-25s, consumer,
  # package and export checks about 1 minute; ARM64 configure 12s, clean
  # library build 106s, image and export checks 1s; about 7 minutes in all.
  # The runner needs the Visual Studio LLVM toolset (clang-cl) and the MSVC
  # ARM64 build tools besides the MSVC x64 tools.

  windows-toolchains:
    name: windows / clang-cl x64 and MSVC ARM64 cross
    runs-on: [self-hosted, Windows, X64, rocketnet-windows]
    timeout-minutes: 45
    strategy:
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    concurrency:
      group: nightly-windows-toolchains-${{ matrix.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Configure clang-cl x64
        run: cmake -B build-clang -T ClangCL -A x64 -DROCKETNET_DEV=OFF "-DCMAKE_RUNTIME_OUTPUT_DIRECTORY=$PWD/build-clang/bin" "-DCMAKE_LIBRARY_OUTPUT_DIRECTORY=$PWD/build-clang/bin"

      - name: Build clang-cl x64
        run: cmake --build build-clang --config Release --parallel 4

      - name: Unit suite (clang-cl)
        run: ./build-clang/bin/Release/test.exe

      - name: Functional suite (clang-cl)
        timeout-minutes: 20
        run: ./build-clang/bin/Release/functional.exe

      - name: C and C++ consumers of the clang-cl libraries
        run: python tools/check_dll_consumer.py --build build-clang

      - name: Install and relocate the clang-cl SDK; run C/C++ static/shared consumers
        run: python tools/check_package.py build-clang --config Release

      - name: Production library boundary (clang-cl)
        run: python tools/check_exports.py build-clang/bin/Release/rocketnet.dll build-clang/Release/rocketnet.lib

      - name: Configure MSVC ARM64 cross build
        run: cmake -B build-arm64 -A ARM64 -DROCKETNET_DEV=OFF "-DCMAKE_RUNTIME_OUTPUT_DIRECTORY=$PWD/build-arm64/bin" "-DCMAKE_LIBRARY_OUTPUT_DIRECTORY=$PWD/build-arm64/bin"

      - name: Build the ARM64 static and shared libraries
        run: cmake --build build-arm64 --config Release --parallel 4 --target rocketnet rocketnet_shared rocketnet_dev rocketnet_shared_dev

      - name: rocketnet.dll is an ARM64 image with the production exports
        run: |
          set -o pipefail
          vs=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath | tr -d '\r')
          dumpbin=$(ls "$(cygpath "$vs")"/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe | tail -1)
          "$dumpbin" //nologo //headers build-arm64/bin/Release/rocketnet.dll | tr -d '\r' | tee arm64-headers.txt | grep -i machine
          grep -q 'AA64 machine (ARM64)' arm64-headers.txt
          python tools/check_exports.py build-arm64/bin/Release/rocketnet.dll build-arm64/Release/rocketnet.lib
