name: TLC records

on:
  push:
    # main and the branch v1.0 lands on, named by name: a sprint/** filter
    # would start this gate on every worker branch push as well.
    branches: [main, sprint/rocketnet-proof]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tlc-records-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stale:
    name: Model records are current
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Model coverage rows are true
        shell: bash
        run: python3 tools/check_tla_coverage.py --all
      - name: Coverage checker tests pass
        shell: bash
        run: python3 tools/test_check_tla_coverage.py
      - name: Check the fleet's Go is on PATH
        shell: bash
        run: |
          set -euo pipefail
          # The pinned runner's go.mod says go 1.26.6: that is a minimum, not an exact version (tlacheck records no Go
          # version in any fingerprint), so any Go at or above 1.26.6 builds it; the fleet declares its own patch.
          if ! command -v go >/dev/null 2>&1; then
            echo "TOOL-MISSING go >= 1.26.6 (missing) on $RUNNER_NAME"
            exit 1
          fi
          got="$(go version)"
          echo "$got"
          minor="$(echo "$got" | sed -n 's/.* go1\.\([0-9][0-9]*\)\.\([0-9][0-9]*\)[ -].*/\1/p')"
          patch="$(echo "$got" | sed -n 's/.* go1\.\([0-9][0-9]*\)\.\([0-9][0-9]*\)[ -].*/\2/p')"
          if [ -z "$minor" ] || [ "$minor" -lt 26 ] || { [ "$minor" -eq 26 ] && [ "$patch" -lt 6 ]; }; then
            echo "TOOL-MISSING go >= 1.26.6 $got on $RUNNER_NAME"; exit 1
          fi
      - name: Build the pinned public runner and check records
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          job=$(mktemp -d "$RUNNER_TEMP/rocketnet-tlc.XXXXXX")
          trap 'rm -rf "$job"' EXIT
          git -c credential.helper= clone --filter=blob:none --no-checkout https://github.com/mas-bandwidth/nova-tools.git "$job/runner"
          git -C "$job/runner" checkout --detach 0c97d5958bf2b3cb1ad24e6e1b58f5b04e70347a
          (cd "$job/runner" && go build -o "$job/tlacheck" ./tools/tlacheck)
          "$job/tlacheck" groups --root . --stale > "$job/stale.json"
          cat "$job/stale.json"
          test "$(cat "$job/stale.json")" = '[]'
      - name: Check required outcomes and explicit timeout debt
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          plan = {r['config']: r for r in csv.DictReader(Path('tla/CASES.tsv').open(), delimiter='\t')}
          runs = list(csv.DictReader(Path('tla/RUNS.tsv').open(), delimiter='\t'))
          for row in runs:
              case = plan[row['config']]
              assert row['mode'] == 'bounded', row['config'] + ': not a bounded measurement'
              assert row['jar_sha256'] == '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88', row['config'] + ': different JAR'
              if row['result'] != 'PASS':
                  assert case['gate'] == 'bench' and case['debt'] != '-' and row['exit'] == '124', row['config'] + ': failure without declared timeout debt'
          print('Required outcomes match; any unfinished cases are explicit timeout debt.')
          PY
      - name: TLA ledgers merge clean
        shell: bash
        run: |
          python3 tools/check_tla_ledger_merge.py
