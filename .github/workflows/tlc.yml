# Nightly TLC. The model checks run once a night, not per commit: a TLC
# case takes up to the runner's 110 s per-case limit, and the per-commit tier
# is bounded at two minutes. The job measures every stale-group case and each
# declared timeout-debt case again with the pinned runner and JAR, checks the
# committed records' outcomes and coverage rows, and fails the run on any
# case that does not reach its
# declared result. A model edit still commits fresh records where its author
# can run TLC (proofs/tla/README.md); the night catches what is left stale and
# retries committed FAIL/124 bench debt without treating a timeout as a proof.

name: TLC records

on:
  schedule:
    - cron: "0 5 * * *"   # daily at 05:00 UTC, before the nightly proofs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tlc-records
  cancel-in-progress: false

jobs:
  stale:
    name: Model records are current
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Model coverage rows are true
        shell: bash
        run: python3 tools/check_tla_coverage.py --all --actions-strict
      - name: Coverage checker tests pass
        shell: bash
        run: python3 tools/test_check_tla_coverage.py
      - name: Nightly case planner controls pass
        shell: bash
        run: python3 tools/test_plan_tlc_nightly.py
      - name: Check the fleet's Go is on PATH
        shell: bash
        run: |
          set -euo pipefail
          # The pinned runner's go.mod says go 1.26.6: that is a minimum, not an exact version (tlacheck records no Go
          # version in any fingerprint), so any Go at or above 1.26.6 builds it; the fleet declares its own patch.
          if ! command -v go >/dev/null 2>&1; then
            echo "TOOL-MISSING go >= 1.26.6 (missing) on $RUNNER_NAME"
            exit 1
          fi
          got="$(go version)"
          echo "$got"
          minor="$(echo "$got" | sed -n 's/.* go1\.\([0-9][0-9]*\)\.\([0-9][0-9]*\)[ -].*/\1/p')"
          patch="$(echo "$got" | sed -n 's/.* go1\.\([0-9][0-9]*\)\.\([0-9][0-9]*\)[ -].*/\2/p')"
          if [ -z "$minor" ] || [ "$minor" -lt 26 ] || { [ "$minor" -eq 26 ] && [ "$patch" -lt 6 ]; }; then
            echo "TOOL-MISSING go >= 1.26.6 $got on $RUNNER_NAME"; exit 1
          fi
      - name: Build the pinned public runner and check records
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          job=$(mktemp -d "$RUNNER_TEMP/rocketnet-tlc.XXXXXX")
          trap 'rm -rf "$job"' EXIT
          git -c credential.helper= clone --filter=blob:none --no-checkout https://github.com/mas-bandwidth/nova-tools.git "$job/runner"
          git -C "$job/runner" checkout --detach 0c97d5958bf2b3cb1ad24e6e1b58f5b04e70347a
          (cd "$job/runner" && go build -o "$job/tlacheck" ./tools/tlacheck)
          "$job/tlacheck" groups --root proofs --stale > "$job/stale.json"
          cat "$job/stale.json"
          plan="$job/plan"
          python3 tools/plan_tlc_nightly.py --stale "$job/stale.json" > "$plan"
          if [ ! -s "$plan" ]; then
            echo "TLC-PLAN no stale cases or recorded timeout debt"
            exit 0
          fi

          # the pinned JAR, from the fleet's tla play
          jar=/opt/tla/tla2tools.jar
          want=936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
          if [ ! -f "$jar" ] || [ "$(sha256sum "$jar" | cut -d' ' -f1)" != "$want" ]; then
            echo "TOOL-MISSING tla2tools.jar sha256 $want at $jar on $RUNNER_NAME"
            exit 1
          fi
          if ! command -v java >/dev/null 2>&1; then
            echo "TOOL-MISSING java on $RUNNER_NAME"
            exit 1
          fi

          # Each selected case keeps its index and cardinality within the full
          # group. Stale/debt overlap is run once; healthy siblings of current
          # debt are omitted. The pinned runner retains its 110 s case limit.
          parallel=$(( $(nproc) / 2 ))
          [ "$parallel" -ge 1 ] || parallel=1
          export TLACHECK="$job/tlacheck" TLC_JAR="$jar" TLC_JOB="$job"
          # shellcheck disable=SC2016  # the shard's own shell expands these
          xargs -P "$parallel" -L 1 bash -c '
            dir="$TLC_JOB/run-$0-$2"
            "$TLACHECK" run --root proofs --jar "$TLC_JAR" --group "$0" --shards "$1" --shard "$2" --workers 2 --dir "$dir" > "$dir.log" 2>&1 \
              || echo "$0 $2" >> "$TLC_JOB/failed"
          ' < "$plan"
          grep -h '^CASE' "$job"/run-*.log | sed 's/^/  /'
          if [ -s "$job/failed" ]; then
            echo "TLC-FAILED shards=$(wc -l < "$job/failed")"
            grep -h '^CASE FAIL' "$job"/run-*.log
            exit 1
          fi
          echo "TLC-PASS every selected stale/debt case reached its declared result; commit fresh records from a bench run"
      - name: Check required outcomes and explicit timeout debt
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          plan = {r['config']: r for r in csv.DictReader(Path('proofs/tla/CASES.tsv').open(), delimiter='\t')}
          runs = list(csv.DictReader(Path('proofs/tla/RUNS.tsv').open(), delimiter='\t'))
          for row in runs:
              case = plan[row['config']]
              assert row['mode'] == 'bounded', row['config'] + ': not a bounded measurement'
              assert row['jar_sha256'] == '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88', row['config'] + ': different JAR'
              if row['result'] != 'PASS':
                  assert case['gate'] == 'bench' and case['debt'] != '-' and row['exit'] == '124', row['config'] + ': failure without declared timeout debt'
          print('Required outcomes match; any unfinished cases are explicit timeout debt.')
          PY
      - name: TLA ledgers merge clean
        shell: bash
        run: |
          python3 tools/check_tla_ledger_merge.py
