# The nightly channel seed sweep: every functional channel case
# (tests/functional/channel_*.cpp) over a rolling range of 2000 simulator seeds.
# The range start is derived from the run number (run 1 starts at seed 1),
# so consecutive nights cover different ranges of the same length; the log
# prints the range with its replay line. Each functional case
# runs on one deterministic seed on the per-push tier (the pinned seed), so a
# case that holds only on that seed is green there; this sweep walks the other
# seeds so a seed-fragile case shows at night and not in a landing. It lives
# here, not in ci.yml, because the per-push tier stays at or under two minutes.
#
# A red night prints one line per failure, `FAIL seed=<n> case=<name>
# reason=<what>`, and replays with
#   ROCKETNET_CHANNEL_SEED=<n> ./bin/functional --run <name>
# The runner is the fleet's org runner, named the way nightly-soak.yml names it.

name: nightly-channel-seeds

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  channel-seed-sweep:
    runs-on: ["self-hosted", "Linux", "X64", "fleet", "long"]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ make xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build
        run: make

      - name: Sweep every channel case over a rolling seed range
        env:
          CHANNEL_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          length=2000
          sweep_start=$(( 1 + (CHANNEL_RUN_NUMBER - 1) * length ))
          sweep_end=$(( sweep_start + length - 1 ))
          echo "channel seed sweep seeds=$sweep_start-$sweep_end length=$length run_number=$CHANNEL_RUN_NUMBER replay: scripts/channel-seed-sweep --all --seeds $sweep_start-$sweep_end --timeout 120"
          scripts/channel-seed-sweep --all --seeds "$sweep_start-$sweep_end" --timeout 120 | tee channel-seed-sweep.log

      # GitHub expressions have no replace(): the artifact name's ref slug ('/' -> '-') is made here
      - name: Artifact name for the ref
        id: refslug
        if: failure()
        shell: bash
        env:
          REF: ${{ matrix.ref }}
        run: echo "slug=${REF//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload the sweep log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: channel-seed-sweep-log-${{ steps.refslug.outputs.slug }}
          path: channel-seed-sweep.log
          if-no-files-found: ignore
