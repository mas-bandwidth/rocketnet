# The nightly soak: the hostile-lite simulator soak (eight parallel clients,
# light loss where any failure to connect is a finding) and the real-UDP
# loopback soak, with finite scenarios and no harness execution deadline.
# A red night is a found bug.
# The same binaries run unbounded by hand for the multi-day soaks on real
# hardware: ./bin/soak_sim and ./bin/soak, and belief comes after days.
#
# The second job, `sanitized-soak`, arrived here on 2026-09-13 from ci.yml
# because the per-commit tier finishes in one to two minutes:
# at 297s it was the wall of the whole gate. It came across unchanged -- same
# name, same flags, same seed, same count -- because a leg that is too slow
# for the gate moves tiers, it does not get shortened to fit. Its own header
# below names what the per-commit tier still has without it.

name: nightly-soak

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Test execution has no repository wall-clock cap; GitHub still limits
# self-hosted jobs to five days.
env:
  ROCKETNET_NIGHTLY_NO_TIMEOUT: '1'

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    runs-on: [self-hosted, Linux, X64, fleet, long]
    timeout-minutes: 7200
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Check the fleet's build dependencies are present
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing libcurl; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build
        timeout-minutes: 6
        run: make

      - name: Tests
        run: ./bin/test

      # the wire's audit under the real soak, bounded: every receive
      # cross-checked against the reference full-array scan. Slow by
      # construction, which is why it is a bounded leg of the nightly rather
      # than the shape the long soak runs in.

      - name: Simulator wire audit (bounded, every receive cross-checked)
        run: ROCKETNET_SOAK_SIM_AUDIT=1 ./bin/soak_sim 100000

      - name: Simulator soak (eight clients, light loss, any failure is a finding)
        run: ./bin/soak_sim 10000000

      - name: UDP loopback soak
        run: ./bin/soak 200000

      # One 1000-client run per Linux server cell (load.c's header names each
      # pin): portable, gso, gso plain and io_uring on loopback, and xdp as
      # root inside a virtme-ng guest of the runner's own kernel, the shape of
      # ci.yml's transport matrix xdp cell: a veth pair, the far end in its
      # own namespace, the clients opened there. Each run must pass, name the
      # expected server transport, and end with the fd and thread counts it
      # started with. A runner with no VM tier fails the xdp cell.
      - name: Many-client load (1000 clients, every Linux server cell)
        run: |
          set -euo pipefail
          ulimit -n 65536 || ulimit -n "$(ulimit -Hn)"
          check_cell() {
            cell=$1; want=$2; line=$3
            echo "LOAD cell=$cell $line"
            case "$line" in *verdict=PASS*) ;; *) echo "LOAD cell=$cell FAIL"; return 1 ;; esac
            case "$line" in *"server_transport_io=$want "*) ;; *) echo "LOAD cell=$cell wrong server transport (want $want)"; return 1 ;; esac
            # each field must be present: sed -n ... p prints nothing for an
            # absent field, and an empty value fails rather than comparing equal
            fs=$(echo "$line" | sed -nE "s/.* fds_start=([0-9]+)( .*|$)/\1/p"); fe=$(echo "$line" | sed -nE "s/.* fds_end=([0-9]+)( .*|$)/\1/p")
            ts=$(echo "$line" | sed -nE "s/.* threads_start=([0-9]+)( .*|$)/\1/p"); te=$(echo "$line" | sed -nE "s/.* threads_end=([0-9]+)( .*|$)/\1/p")
            [ -n "$fs" ] && [ -n "$fe" ] && [ -n "$ts" ] && [ -n "$te" ] || { echo "LOAD cell=$cell FAIL the line lacks fds_start, fds_end, threads_start or threads_end"; return 1; }
            [ "$fs" = "$fe" ] && [ "$ts" = "$te" ] || { echo "LOAD cell=$cell fd or thread growth"; return 1; }
          }
          run_cell() {
            cell=$1; want=$2; shift 2
            out=$(mktemp)
            status=0
            env "$@" ./bin/load 1000 60 > "$out" || status=$?
            line=$(sed -n '/^load: connected/p' "$out" | tail -n 1)
            [ "$status" = 0 ] || { echo "LOAD cell=$cell $line"; echo "LOAD cell=$cell FAIL load exited $status"; return 1; }
            check_cell "$cell" "$want" "$line"
          }
          run_cell portable portable ROCKETNET_SERVER_TRANSPORT=portable ROCKETNET_CLIENT_TRANSPORT=portable
          run_cell gso gso ROCKETNET_SERVER_TRANSPORT=gso ROCKETNET_CLIENT_TRANSPORT=portable
          run_cell gso-plain gso ROCKETNET_SERVER_TRANSPORT=gso ROCKETNET_CLIENT_TRANSPORT=portable ROCKETNET_TEST_GSO_PLAIN=1
          # a fleet runner without io_uring fails the cell by name unless tools/io_uring_absent_runners.txt lists it
          gate=0
          scripts/io-uring-gate "LOAD cell=io_uring" || gate=$?
          case "$gate" in
            0) run_cell io_uring io_uring ROCKETNET_SERVER_TRANSPORT=io_uring ROCKETNET_CLIENT_TRANSPORT=portable ;;
            3) ;;
            *) exit 1 ;;
          esac
          vm_kernel="$HOME/vm-kernels/vmlinuz-$(uname -r)"
          if ! command -v vng >/dev/null || [ ! -r "$vm_kernel" ] || [ ! -w /dev/kvm ]; then
            echo "LOAD cell=xdp FAIL no VM tier on this runner: needs vng, a readable $vm_kernel and a writable /dev/kvm"
            exit 1
          fi
          # Size the guest from the plan and a measurement. The plan is the
          # lifecycle allocator peak, an upper bound on bytes requested; most
          # of it is never touched (UMEM, rings and pools are allocated whole
          # and filled by traffic). Two things must fit the guest: the
          # server's plan, requested as one block, which the guest kernel's
          # overcommit admits only if the guest holds it; and the memory the
          # run actually touches, its peak RSS. Measured on main at 8e792181
          # on a Linux fleet host (docs/LOAD.md): plan
          # total_public_required_bytes=49784521567 of which
          # server_public_required_bytes=19879337567; peak RSS 1701968 kB in
          # a 24G guest and 1687416 kB in a 64G guest; a 16G guest refuses
          # the server create (OUT_OF_MEMORY). need = server plan + 1000 x
          # the measured touched bytes per client (1742815232 / 1000), and
          # the guest is need * 5/4 + 1 GiB for the guest kernel, rounded up
          # to whole GiB: 27G. A runner with less MemAvailable than that
          # fails the cell by name.
          xdp_env="ROCKETNET_SERVER_TRANSPORT=xdp ROCKETNET_CLIENT_TRANSPORT=portable ROCKETNET_SERVER_NUM_XDP_QUEUES=1 ROCKETNET_SERVER_NUM_OS_CPUS=1"
          plan_out=$(mktemp)
          plan_status=0
          env $xdp_env LOAD_PLAN_ONLY=1 ./bin/load 1000 60 > "$plan_out" || plan_status=$?
          plan=$(sed -n '/^load_plan:/p' "$plan_out" | tail -n 1)
          echo "LOAD cell=xdp $plan"
          [ "$plan_status" = 0 ] || { echo "LOAD cell=xdp FAIL LOAD_PLAN_ONLY=1 ./bin/load exited $plan_status"; exit 1; }
          case "$plan" in *verdict=PASS*) ;; *) echo "LOAD cell=xdp FAIL no PASS plan line from LOAD_PLAN_ONLY=1 ./bin/load 1000 60"; exit 1 ;; esac
          plan_bytes=$(echo "$plan" | sed -E "s/.*total_public_required_bytes=([0-9]+).*/\1/")
          server_bytes=$(echo "$plan" | sed -E "s/.*server_public_required_bytes=([0-9]+).*/\1/")
          gib=$((1024 * 1024 * 1024))
          touched_per_client_bytes=1742815
          need_bytes=$(( server_bytes + 1000 * touched_per_client_bytes ))
          guest_gib=$(( (need_bytes * 5 / 4 + gib + gib - 1) / gib ))
          avail_kib=$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)
          {
            echo "### xdp load cell memory"
            echo "| plan total | server plan (one block) | need | guest | runner available |"
            echo "|---|---|---|---|---|"
            echo "| $plan_bytes | $server_bytes | $need_bytes | ${guest_gib} GiB | $((avail_kib / 1024)) MiB |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $((avail_kib * 1024)) -lt $((guest_gib * gib)) ]; then
            echo "LOAD cell=xdp FAIL runner has $((avail_kib / 1024)) MiB available, the guest needs ${guest_gib} GiB (server plan $server_bytes + 1000 x touched $touched_per_client_bytes = need $need_bytes, sized need*5/4+1GiB)"
            exit 1
          fi
          echo "LOAD cell=xdp guest_memory=${guest_gib}G plan_bytes=$plan_bytes server_bytes=$server_bytes need_bytes=$need_bytes runner_available_mib=$((avail_kib / 1024))"
          mkdir -p build
          guest=$(mktemp -d "$PWD/build/load-xdp.XXXXXX")
          cat > "$guest/run.sh" <<'GUEST'
          : > "$1/started"
          set -u
          cd "$2"
          mountpoint -q /sys/fs/bpf || mount -t bpf bpf /sys/fs/bpf
          ip netns add rnxdpload
          ip link add rnxdpload0 mtu 1500 type veth peer name rnxdpload1 mtu 1500
          ip link set rnxdpload1 netns rnxdpload
          ip addr add 10.77.3.1/24 dev rnxdpload0
          ip -n rnxdpload addr add 10.77.3.2/24 dev rnxdpload1
          ip link set rnxdpload0 up
          echo 2 > /sys/class/net/rnxdpload0/napi_defer_hard_irqs
          echo 200000 > /sys/class/net/rnxdpload0/gro_flush_timeout
          ip -n rnxdpload link set lo up
          ip -n rnxdpload link set rnxdpload1 up
          timed=""
          [ -x /usr/bin/time ] && timed="/usr/bin/time -v -o $1/xdp.time"
          $timed env ROCKETNET_SERVER_TRANSPORT=xdp ROCKETNET_CLIENT_TRANSPORT=portable \
              ROCKETNET_SERVER_NUM_XDP_QUEUES=1 ROCKETNET_SERVER_NUM_OS_CPUS=1 \
              LOAD_SERVER_ADDRESS=10.77.3.1:40411 LOAD_CLIENT_NETNS=/var/run/netns/rnxdpload \
              ./bin/load 1000 60 > "$1/xdp.out" 2> "$1/xdp.err"
          status=$?
          echo "$status" > "$1/xdp.exit"
          echo "guest load exit=$status"
          grep -E 'Maximum resident|Elapsed' "$1/xdp.time" 2>/dev/null
          grep -E '^(MemTotal|MemAvailable):' /proc/meminfo
          echo "guest dmesg tail:"
          dmesg | tail -n 50
          GUEST
          # the guest's first act (run.sh's first line) writes $guest/started:
          # scripts/vm-boot-guard refuses a guest kernel command line over
          # 1900 bytes, kills and boots again a guest that has not written the
          # marker in 120 s (three attempts) and bounds nothing once it has, so
          # the load run itself keeps no limit
          scripts/vm-boot-guard --marker "$guest/started" -- \
            vng --run "$vm_kernel" --memory "${guest_gib}G" --cpus 16 --append "irqaffinity=0 isolcpus=1 nohz_full=1" --rwdir "$PWD" -- \
            sudo env ROCKETNET_NIGHTLY_NO_TIMEOUT=1 sh "$guest/run.sh" "$guest" "$PWD" > "$guest/vm.log" 2>&1 || echo "vng exit=$?" >> "$guest/vm.log"
          # grep exits 1 on no match (fine) and 2 on an unreadable log (red)
          grep '^VM-BOOT-GUARD' "$guest/vm.log" || [ $? -eq 1 ]
          peak_kib=""
          if [ -f "$guest/xdp.time" ]; then
            peak_kib=$(sed -nE 's/.*Maximum resident set size \(kbytes\): ([0-9]+).*/\1/p' "$guest/xdp.time" | tail -n 1)
          fi
          echo "LOAD cell=xdp guest_peak_rss_kib=${peak_kib:-unknown} need_bytes=$need_bytes guest_memory=${guest_gib}G"
          if [ -n "${peak_kib:-}" ] && [ $((peak_kib * 1024)) -gt $(( 1000 * touched_per_client_bytes )) ]; then
            echo "LOAD cell=xdp WARN peak RSS is above the measured touched bytes; re-measure touched_per_client_bytes (docs/LOAD.md)"
          fi
          line=""
          if [ -f "$guest/xdp.out" ]; then
            line=$(grep '^load: connected' "$guest/xdp.out" | tail -n 1) || [ $? -eq 1 ]
          fi
          if [ -z "$line" ]; then
            for log in "$guest/vm.log" "$guest/xdp.err"; do
              if [ -f "$log" ]; then tail -n 60 "$log"; else echo "($log missing)"; fi
            done
          fi
          xdp_status=$(cat "$guest/xdp.exit" 2>/dev/null) || xdp_status="missing"
          [ "$xdp_status" = 0 ] || { echo "LOAD cell=xdp $line"; echo "LOAD cell=xdp FAIL load in the guest exited $xdp_status"; exit 1; }
          check_cell xdp xdp "$line"

      - name: XDP filter BPF_PROG_TEST_RUN in virtme-ng guest (18 cases, 0 skipped)
        if: runner.os == 'Linux'
        run: bash tools/run_xdp_filter_guest.sh --artifact-dir build/xdp-filter-guest

      # Path outages on real UDP sockets (scripts/outage-pair-real): two
      # namespaces joined by a veth pair with netem on each end, as root
      # inside a virtme-ng guest of the runner's own kernel like the xdp
      # cells above. Three outages of T - 1 (client->server, server->client,
      # both) must end neither side and deliver every accepted reliable
      # message once in order; one of T + 2 must end the server TIMED_OUT and
      # the client CONNECTION_TIMED_OUT before the path comes back.
      - name: Outages at T - 1 survive and at T + 2 time out (two namespaces, netem, virtme-ng guest)
        if: runner.os == 'Linux'
        run: bash scripts/outage-pair-real --vm --log-dir "$PWD/build/outage-pair-real"

      - name: Artifact name for the ref
        id: refslug
        if: always() && runner.os == 'Linux'
        env:
          REF: ${{ matrix.ref }}
        run: echo "slug=${REF//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload XDP filter guest artifacts
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: xdp-filter-guest-${{ steps.refslug.outputs.slug }}
          path: build/xdp-filter-guest
          if-no-files-found: ignore

  low-tick-load:
    name: low-tick load (${{ matrix.ref }} / 1000 clients / 10 Hz)
    runs-on: [self-hosted, Linux, X64, fleet, long]
    timeout-minutes: 7200
    env:
      # read by tools/check_nightly_dispositions.py: a DISCARDED night annotates UNMEASURED
      ROCKETNET_MAY_NOT_MEASURE: 'needs a host below half its cores in load at start and end; otherwise LOW_TICK DISCARDED'
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Build the named low-tick load case
        timeout-minutes: 8
        run: make -j4

      - name: Run the enabled low-tick load case on an idle host
        run: |
          set -euo pipefail
          cores=$(nproc)
          idle() { awk -v observed="$1" -v cores="$cores" 'BEGIN { exit !(observed < cores / 2.0) }'; }
          # wait for an idle host (the other nightly jobs finish) rather than
          # discarding the night: up to 120 minutes, checked each minute
          waited=0
          load_start=$(awk '{ print $1 }' /proc/loadavg)
          while ! idle "$load_start" && [ "$waited" -lt 120 ]; do
            echo "LOW_TICK waiting for an idle host: load_1m=$load_start cores=$cores waited=${waited}m"
            sleep 60
            waited=$((waited + 1))
            load_start=$(awk '{ print $1 }' /proc/loadavg)
          done
          echo "LOW_TICK host_load start load_1m=$load_start cores=$cores admission=below-half-cores waited=${waited}m"
          if ! idle "$load_start"; then
            echo "::error title=low-tick DISCARDED::the host was never idle enough in 120 minutes: load_1m=$load_start cores=$cores (no measurement tonight)"
            echo "LOW_TICK DISCARDED host was not idle enough at start: load_1m=$load_start cores=$cores"
            echo "::warning title=UNMEASURED::low-tick load DISCARDED: host load_1m=$load_start at start, not below $cores cores / 2; nothing measured"
            exit 1
          fi
          set +e
          ROCKETNET_TEST_VERBOSE=1 ROCKETNET_LOW_TICK_MEASURE=1 ./bin/functional --run test_server_receive_1000_clients_256kbps_10hz
          result=$?
          set -e
          load_end=$(awk '{ print $1 }' /proc/loadavg)
          echo "LOW_TICK host_load end load_1m=$load_end cores=$cores"
          # a failed case is a failure whatever the load: the end-of-run
          # discard applies only to a pass measured on a loaded host
          if [ "$result" -ne 0 ]; then
            echo "LOW_TICK FAIL the case exited $result (load_1m at end $load_end)"
            exit "$result"
          fi
          if ! idle "$load_end"; then
            echo "::error title=low-tick DISCARDED::a pass measured while load exceeded half the cores: load_1m=$load_end cores=$cores (no measurement tonight)"
            echo "LOW_TICK DISCARDED host/generator load exceeded half the available cores: load_1m=$load_end cores=$cores"
            echo "::warning title=UNMEASURED::low-tick load DISCARDED: host load_1m=$load_end at the end, not below $cores cores / 2; the case (exit $result) is not kept"
            exit 1
          fi
          echo "LOW_TICK PASS measured on an idle host"

  # Thirty minutes per Linux server cell under impairment, with flat fds,
  # threads and library bytes (resident memory is printed, not asserted: the
  # library is not responsible for the OS heap, tests/soak/soak.c
  # PROCESS_RESOURCES_MEMORY): scripts/soak-per-transport runs bin/soak
  # --seconds 1800 --assert-flat once per cell (portable, gso, gso plain,
  # io_uring, and xdp inside a virtme-ng guest of the runner's own kernel),
  # with loss, latency, jitter and duplication at both ends of the link
  # simulator (ROCKETNET_DEV_SERVER_* and ROCKETNET_DEV_CLIENT_*, written into
  # the transport configs soak creates from, and a cell fails when they leave
  # no drops or refused duplicates), and prints one PASS, FAIL or UNMEASURED line per cell (UNMEASURED: the
  # cell failed as a stall can make it, on a run its own log shows stalled). Five
  # cells of 30 minutes are about 152 minutes, past the two-minute rule as
  # every nightly is. A runner with no VM tier fails the xdp cell by name.
  soak-per-transport:
    name: soak per transport (${{ matrix.ref }} / 1800 s per cell)
    runs-on: [self-hosted, Linux, X64, fleet, long]
    timeout-minutes: 7200
    env:
      # read by tools/check_nightly_dispositions.py: a night whose only non-passing cells stalled annotates UNMEASURED
      ROCKETNET_MAY_NOT_MEASURE: 'needs a host that does not stall the soak process; a cell whose main loop stalled past the send-bank bound and failed only as a stall can make it is UNMEASURED (scripts/soak-per-transport)'
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Check the fleet's build dependencies are present
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build
        timeout-minutes: 6
        run: make

      # --assert-flat's own negative controls before the soaks lean on it:
      # an impaired clean run passes, an impairment not applied fails "link
      # impairment not observed", a leaked file fails on fds (60 s each)
      - name: --assert-flat selftest (clean, impairment not applied, leaked file)
        run: bash scripts/soak-args-selftest --flat

      - name: Soak per transport (1800 s per cell, impaired, flat fds, threads and library bytes)
        run: bash scripts/soak-per-transport --seconds 1800 --log-dir build/soak-per-transport

      # GitHub expressions have no replace(): the artifact name's ref slug ('/' -> '-') is made here
      - name: Artifact name for the ref
        id: refslug
        if: failure()
        env:
          REF: ${{ matrix.ref }}
        run: echo "slug=${REF//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload the per-transport soak logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: soak-per-transport-logs-${{ steps.refslug.outputs.slug }}
          path: build/soak-per-transport
          if-no-files-found: ignore

  soak-macos:
    name: soak (${{ matrix.ref }} / macos)
    runs-on: [self-hosted, macOS, ARM64, fleet]
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Check the fleet's build dependencies are present
        run: |
          set -euo pipefail
          missing=0
          if [ "$RUNNER_OS" = "macOS" ]; then
            # darwin has no libbpf, libxdp or liburing; libsodium is the independent parity reference check_sodium.py loads
            for tool in cmake clang c++ xxd python3; do
              if ! command -v "$tool" >/dev/null 2>&1; then
                echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
                missing=1
              fi
            done
            if ! python3 -c "import ctypes.util, sys; sys.exit(0 if ctypes.util.find_library('sodium') else 1)"; then
              echo "TOOL-MISSING libsodium (any) (ctypes.util.find_library failed) on $RUNNER_NAME"
              missing=1
            fi
            exit "$missing"
          fi
          for tool in cmake gcc g++ clang xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build
        timeout-minutes: 6
        run: make

      - name: Tests
        run: ./bin/test

      - name: Simulator wire audit (bounded, every receive cross-checked)
        run: ROCKETNET_SOAK_SIM_AUDIT=1 ./bin/soak_sim 100000

      - name: Simulator soak (eight clients, light loss, any failure is a finding)
        run: ./bin/soak_sim 10000000

      - name: UDP loopback soak
        run: ./bin/soak 200000

      - name: Per-transport impaired soaks (1800 s each, flat resources)
        run: |
          set -uo pipefail
          # the impairment at both ends of the link simulator, the names soak
          # writes into the transport configs it creates from (the values
          # scripts/soak-per-transport runs); --assert-flat fails a run they
          # leave no drops or refused duplicates in
          seconds=1800
          want_link="latency_ms=30 jitter_ms=20 loss_percent=5 duplicate_percent=2"
          mkdir -p build/soak-macos-per-transport
          failures=0
          summary() { awk -v key="$2" '$1 == "soak" && $2 == "summary:" && $3 == key { value = $4 } END { print value }' "$1"; }
          resources() { sed -nE "s/^soak resources: $2 start=([0-9-]+) end=([0-9-]+) peak=([0-9-]+)$/\1\/\2\/\3/p" "$1" | tail -n 1; }
          for transport in portable msgx; do
            log="build/soak-macos-per-transport/${transport}.log"
            if env ROCKETNET_SERVER_TRANSPORT="$transport" ROCKETNET_CLIENT_TRANSPORT="$transport" \
                ROCKETNET_DEV_SERVER_PACKET_LOSS_PERCENT=5 ROCKETNET_DEV_CLIENT_PACKET_LOSS_PERCENT=5 \
                ROCKETNET_DEV_SERVER_LATENCY_MS=30 ROCKETNET_DEV_CLIENT_LATENCY_MS=30 \
                ROCKETNET_DEV_SERVER_JITTER_MS=20 ROCKETNET_DEV_CLIENT_JITTER_MS=20 \
                ROCKETNET_DEV_SERVER_DUPLICATE_PERCENT=2 ROCKETNET_DEV_CLIENT_DUPLICATE_PERCENT=2 \
                ./bin/soak --seconds "$seconds" --assert-flat > "$log" 2>&1; then
              status=0
            else
              status=$?
            fi
            cat "$log"
            server=$(summary "$log" server_transport_io)
            client=$(summary "$log" client_transport_io)
            link_ok=1
            for end in server client; do
              grep -qx "soak link simulator: $end $want_link" "$log" || link_ok=0
            done
            if [ "$status" -eq 0 ] && [ "$server" = "$transport" ] && [ "$client" = "$transport" ] && [ "$link_ok" = 1 ]; then
              echo "SOAK cell=$transport PASS server=$server client=$client seconds=$seconds verified=$(summary "$log" verified) fds=$(resources "$log" fds) threads=$(resources "$log" threads) resident_bytes=$(resources "$log" resident_bytes) link=impaired missing=$(summary "$log" client_to_server_missing)/$(summary "$log" server_to_client_missing) duplicates_refused=$(summary "$log" duplicates_refused_at_server)/$(summary "$log" duplicates_refused_at_client) log=$log"
            else
              echo "SOAK cell=$transport FAIL exit=$status server=${server:-none} client=${client:-none} link_as_asked=$link_ok log=$log"
              failures=$((failures + 1))
            fi
          done
          exit "$failures"

      - name: Upload macOS per-transport soak logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: soak-macos-per-transport-logs-${{ strategy.job-index }}
          path: build/soak-macos-per-transport
          if-no-files-found: ignore

  soak-windows:
    name: soak (${{ matrix.ref }} / windows)
    # the fleet's native Windows runner (Windows 11, MSVC; label rocketnet-windows), the one ci.yml's
    # build-and-test-windows runs on, never a hosted image. Earlier manual qualification recorded:
    # configure 19s, Release build 114s (--parallel 4), Tests 12s, wire audit 23s, simulator
    # soak 561s, UDP loopback soak 339s; 1068s (about 18 minutes) in all. The portable, iocp and
    # rio server cells add 1800 s each, about 109 minutes in all. Those measurements
    # predate removal of the nightly elapsed caps; the finite scenarios are unchanged.
    runs-on: [self-hosted, Windows, X64, rocketnet-windows]
    defaults:
      run:
        shell: pwsh
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Configure (Windows)
        timeout-minutes: 2
        run: cmake -B build -A x64

      - name: Build (Windows)
        timeout-minutes: 4
        run: cmake --build build --config Release --parallel 8

      - name: Tests (Windows)
        shell: bash
        run: |
          set -euo pipefail
          ./bin/Release/test.exe

      - name: Simulator wire audit (Windows)
        shell: bash
        run: |
          set -euo pipefail
          ROCKETNET_SOAK_SIM_AUDIT=1 ./bin/Release/soak_sim.exe 100000

      - name: Simulator soak (Windows)
        shell: bash
        run: |
          set -euo pipefail
          ./bin/Release/soak_sim.exe 10000000

      - name: UDP loopback soak (Windows)
        shell: bash
        run: |
          set -euo pipefail
          ./bin/Release/soak.exe 200000

      - name: Portable transport soak under loss, jitter and duplication (Windows)
        shell: bash
        run: |
          set -euo pipefail
          set -uo pipefail
          # the portable server with the portable client, impaired at both
          # ends of the link simulator under the names soak writes into the
          # transport configs it creates (ROCKETNET_DEV_SERVER_* and
          # ROCKETNET_DEV_CLIENT_*); --assert-flat fails a run whose handles,
          # threads or library bytes grow, or whose impairment left no trace
          seconds=1800
          want_link="latency_ms=30 jitter_ms=20 loss_percent=5 duplicate_percent=2"
          mkdir -p build/soak-windows
          log=build/soak-windows/portable.log
          summary() { awk -v key="$2" '$1 == "soak" && $2 == "summary:" && $3 == key { value = $4 } END { print value }' "$1"; }
          resources() { sed -nE "s/^soak resources: $2 start=([0-9-]+) end=([0-9-]+) peak=([0-9-]+)$/\1\/\2\/\3/p" "$1" | tail -n 1; }
          if env ROCKETNET_SERVER_TRANSPORT=portable ROCKETNET_CLIENT_TRANSPORT=portable \
              ROCKETNET_DEV_SERVER_PACKET_LOSS_PERCENT=5 ROCKETNET_DEV_CLIENT_PACKET_LOSS_PERCENT=5 \
              ROCKETNET_DEV_SERVER_LATENCY_MS=30 ROCKETNET_DEV_CLIENT_LATENCY_MS=30 \
              ROCKETNET_DEV_SERVER_JITTER_MS=20 ROCKETNET_DEV_CLIENT_JITTER_MS=20 \
              ROCKETNET_DEV_SERVER_DUPLICATE_PERCENT=2 ROCKETNET_DEV_CLIENT_DUPLICATE_PERCENT=2 \
              ./bin/Release/soak.exe --seconds "$seconds" --assert-flat > "$log" 2>&1; then
            status=0
          else
            status=$?
          fi
          cat "$log"
          # soak.exe writes CRLF; the checks read a copy with LF endings
          lines=build/soak-windows/portable.lf
          tr -d '\r' < "$log" > "$lines"
          server=$(summary "$lines" server_transport_io)
          client=$(summary "$lines" client_transport_io)
          link_ok=1
          for end in server client; do
            grep -qx "soak link simulator: $end $want_link" "$lines" || link_ok=0
          done
          if [ "$status" -eq 0 ] && [ "$server" = portable ] && [ "$client" = portable ] && [ "$link_ok" = 1 ]; then
            echo "SOAK cell=portable PASS server=$server client=$client seconds=$seconds handles=$(resources "$lines" handles) threads=$(resources "$lines" threads) private_bytes=$(resources "$lines" private_bytes) library_bytes=$(resources "$lines" library_bytes) link=impaired missing=$(summary "$lines" client_to_server_missing)/$(summary "$lines" server_to_client_missing) duplicates_refused=$(summary "$lines" duplicates_refused_at_server)/$(summary "$lines" duplicates_refused_at_client) log=$log"
          else
            echo "SOAK cell=portable FAIL exit=$status server=${server:-none} client=${client:-none} link_as_asked=$link_ok log=$log"
            exit 1
          fi

      # The iocp and rio server cells: 1800 s of bin/soak each under loss,
      # latency, jitter and duplication at both ends of the link simulator
      # (ROCKETNET_DEV_SERVER_* and ROCKETNET_DEV_CLIENT_*, the values
      # scripts/soak-per-transport runs), held to flat handles, threads and
      # library bytes by --assert-flat (private bytes are printed, not
      # asserted: tests/soak/soak.c), which also fails a run the impairment
      # leaves no drops or refused duplicates in. The server transport is
      # pinned and the granted name and the applied link settings are checked
      # from the run's own lines.
      - name: Soak iocp and rio servers (Windows, 1800 s each, impaired, flat handles, threads and library bytes)
        shell: bash
        run: |
          set -euo pipefail
          set -uo pipefail
          seconds=1800
          want_link="latency_ms=30 jitter_ms=20 loss_percent=5 duplicate_percent=2"
          mkdir -p build/soak-windows
          failures=0
          summary() { awk -v key="$2" '$1 == "soak" && $2 == "summary:" && $3 == key { value = $4 } END { print value }' "$1"; }
          resources() { sed -nE "s/^soak resources: $2 start=([0-9-]+) end=([0-9-]+) peak=([0-9-]+)$/\1\/\2\/\3/p" "$1" | tail -n 1; }
          for transport in iocp rio; do
            log="build/soak-windows/${transport}.log"
            if env ROCKETNET_SERVER_TRANSPORT="$transport" ROCKETNET_CLIENT_TRANSPORT=portable \
                ROCKETNET_DEV_SERVER_PACKET_LOSS_PERCENT=5 ROCKETNET_DEV_CLIENT_PACKET_LOSS_PERCENT=5 \
                ROCKETNET_DEV_SERVER_LATENCY_MS=30 ROCKETNET_DEV_CLIENT_LATENCY_MS=30 \
                ROCKETNET_DEV_SERVER_JITTER_MS=20 ROCKETNET_DEV_CLIENT_JITTER_MS=20 \
                ROCKETNET_DEV_SERVER_DUPLICATE_PERCENT=2 ROCKETNET_DEV_CLIENT_DUPLICATE_PERCENT=2 \
                ./bin/Release/soak.exe --seconds "$seconds" --assert-flat > "$log" 2>&1; then
              status=0
            else
              status=$?
            fi
            cat "$log"
            # the soak log is CRLF: strip it once to an LF copy and read only that copy,
            # never a pipe out of tr, so an early-exiting grep cannot fail a cell under pipefail
            lf="$log.lf"
            tr -d '\r' < "$log" > "$lf"
            server=$(summary "$lf" server_transport_io)
            link_ok=1
            for end in server client; do
              grep -qx "soak link simulator: $end $want_link" "$lf" || link_ok=0
            done
            if [ "$status" -eq 0 ] && [ "$server" = "$transport" ] && [ "$link_ok" = 1 ]; then
              echo "SOAK cell=$transport PASS server=$server seconds=$seconds verified=$(summary "$lf" verified) handles=$(resources "$lf" handles) threads=$(resources "$lf" threads) private_bytes=$(resources "$lf" private_bytes) link=impaired missing=$(summary "$lf" client_to_server_missing)/$(summary "$lf" server_to_client_missing) duplicates_refused=$(summary "$lf" duplicates_refused_at_server)/$(summary "$lf" duplicates_refused_at_client) log=$log"
            else
              echo "SOAK cell=$transport FAIL exit=$status server=${server:-none} link_as_asked=$link_ok log=$log"
              failures=$((failures + 1))
            fi
          done
          exit "$failures"

      - name: Upload Windows soak logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: soak-windows-logs-${{ strategy.job-index }}
          path: build/soak-windows

  # THE SANITIZED SOAK. Bounded, seed-pinned soak_sim under asan + ubsan +
  # lsan. It lived on the per-commit gate (ci.yml) until 2026-09-13, where at
  # 297 seconds it WAS the wall: the whole per-commit tier finished when this
  # job finished, and the per-commit tier finishes in one
  # to two minutes. So it moved here, unchanged -- same job name, same flags,
  # same seed, same iteration count, same log handling -- rather than being
  # weakened to fit. A slower leg moves to a tier that does not run on every
  # commit; it does not get shortened until it is cheap and stops finding
  # things.
  #
  # WHAT THE PER-COMMIT GATE STILL HAS after the move, so the loss is named
  # rather than assumed: the `sanitizers` job runs asan + ubsan over the whole
  # suite on every commit, and `tsan` runs the threaded transport. What this
  # leg alone carries is the pairing of the STATEFUL simulator's hostile-lite
  # wire with the sanitizers, and LSan -- the one leak check the estate runs
  # against a leak-clean-by-construction harness, so a report here is a new
  # unfreed allocation rather than accounting noise. Those two now land the
  # next morning instead of on the commit. A red here is read by whoever is on
  # the estate that morning and bisected back to its commit.
  #
  # soak_sim is the RIGHT target and bin/soak (real UDP loopback) is not: the
  # simulator drives the protocol layer in memory against a seeded packet
  # simulator, with no sockets and no wall clock, so a pinned seed makes the
  # entire run reproducible bit for bit. The unsanitized, far deeper soak_sim
  # and bin/soak runs are the `soak` job above; this one is short and watched.
  #
  # Same asan+ubsan flags as ci.yml's `sanitizers` job. Output is verbose, so
  # it goes to a file and only the tail is surfaced on failure.

  sanitized-soak:
    name: soak_sim (asan + ubsan + lsan, bounded)
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Check the fleet's build dependencies are present
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure
        timeout-minutes: 1
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"

      - name: Build soak_sim
        timeout-minutes: 1
        run: cmake --build build --target soak_sim --parallel 8

      # bounded, seed-pinned. the sim's own iteration bound is the clock, not
      # wall time, so the run tries the same inputs on a slow morning as on a
      # fast one.

      - name: Run the bounded sanitized soak (seed pinned)
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ROCKETNET_SOAK_SIM_SEED: "1"
        run: |
          set -o pipefail
          if ./bin/soak_sim 600000 > soak_sim.log 2>&1; then
            echo "sanitized soak completed cleanly"
            tail -3 soak_sim.log
          else
            echo "sanitized soak FAILED (exit $?)"
            tail -80 soak_sim.log
            exit 1
          fi

      # GitHub expressions have no replace(): the artifact name's ref slug ('/' -> '-') is made here
      - name: Artifact name for the ref
        id: refslug
        if: failure()
        env:
          REF: ${{ matrix.ref }}
        run: echo "slug=${REF//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload the soak log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sanitized-soak-log-${{ steps.refslug.outputs.slug }}
          path: soak_sim.log
          if-no-files-found: ignore

  # Nightly validation of the six validation-tool self-test suites
  # (defense in depth: ci.yml runs them every commit; nightly re-runs them
  # against the current ref so a runner drift that only shows up on the
  # nightly host is caught there). Same shape as the per-commit job: each
  # suite its own step, full output printed, nonzero exit fails the step,
  # and a zero-discovered-tests pass fails the count line.
  validation-tool-selftests:
    name: validation tool selftests
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 7200
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Test the frame-budget checker's verdicts
        run: |
          set -euo pipefail
          output="$(python3 tools/test_check_frame_budget.py -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"

      - name: Test the server-calls checker's verdicts
        run: |
          set -euo pipefail
          output="$(python3 tools/test_check_server_calls.py -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"

      - name: Test the split-load checker's receipts
        run: |
          set -euo pipefail
          output="$(python3 tools/test_check_split_load.py -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"

      - name: Test the test-environment checker's inventory
        run: |
          set -euo pipefail
          output="$(python3 tools/test_check_test_environment.py -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"

      - name: Test the 1000-client load profiler's provenance
        run: |
          set -euo pipefail
          output="$(python3 tools/test_profile_1000_load.py -v 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^Ran [1-9][0-9]* tests' <<<"$output"

      - name: Test the release-version block and workflow
        run: |
          set -euo pipefail
          output="$(python3 tools/test_release_version.py 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^[1-9][0-9]* release version fixtures passed$' <<<"$output"
