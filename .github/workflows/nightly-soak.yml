# The nightly soak: the hostile-lite simulator soak (eight parallel clients,
# light loss where any failure to connect is a finding) and the real-UDP
# loopback soak, bounded to fit the runner. A red night is a found bug.
# The same binaries run unbounded by hand for the multi-day soaks on real
# hardware: ./bin/soak_sim and ./bin/soak, and belief comes after days.
#
# The second job, `sanitized-soak`, arrived here on 2026-09-13 from ci.yml
# because the per-commit tier finishes in one to two minutes:
# at 297s it was the wall of the whole gate. It came across unchanged -- same
# name, same flags, same seed, same count -- because a leg that is too slow
# for the gate moves tiers, it does not get shortened to fit. Its own header
# below names what the per-commit tier still has without it.

name: nightly-soak

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
        os:
          # the fleet's org runners (ci.yml build-and-test's note)
          - ubuntu-latest
    runs-on: [self-hosted, Linux, X64, fleet, long]
    timeout-minutes: 90
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing libcurl; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build
        if: runner.os != 'Windows'
        run: make

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -A x64

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Tests
        if: runner.os != 'Windows'
        run: ./bin/test

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./bin/Release/test.exe

      # the wire's audit under the real soak, bounded: every receive
      # cross-checked against the reference full-array scan. Slow by
      # construction, which is why it is a bounded leg of the nightly rather
      # than the shape the long soak runs in.

      - name: Simulator wire audit (bounded, every receive cross-checked)
        if: runner.os != 'Windows'
        run: ROCKETNET_SOAK_SIM_AUDIT=1 ./bin/soak_sim 100000

      - name: Simulator wire audit (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ROCKETNET_SOAK_SIM_AUDIT=1 ./bin/Release/soak_sim.exe 100000

      - name: Simulator soak (eight clients, light loss, any failure is a finding)
        if: runner.os != 'Windows'
        run: ./bin/soak_sim 10000000

      - name: Simulator soak (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./bin/Release/soak_sim.exe 10000000

      - name: UDP loopback soak
        if: runner.os != 'Windows'
        run: ./bin/soak 200000

      - name: UDP loopback soak (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./bin/Release/soak.exe 200000

      # One 1000-client run per Linux server cell (load.c's header names each
      # pin): portable, gso, gso plain and io_uring on loopback, and xdp as
      # root inside a virtme-ng guest of the runner's own kernel, the shape of
      # ci.yml's transport matrix xdp cell: a veth pair, the far end in its
      # own namespace, the clients opened there. Each run must pass, name the
      # expected server transport, and end with the fd and thread counts it
      # started with. A runner with no VM tier fails the xdp cell.
      - name: Many-client load (1000 clients, every Linux server cell)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          ulimit -n 65536 || ulimit -n "$(ulimit -Hn)"
          check_cell() {
            cell=$1; want=$2; line=$3
            echo "LOAD cell=$cell $line"
            case "$line" in *verdict=PASS*) ;; *) echo "LOAD cell=$cell FAIL"; return 1 ;; esac
            case "$line" in *"server_transport_io=$want "*) ;; *) echo "LOAD cell=$cell wrong server transport (want $want)"; return 1 ;; esac
            fs=$(echo "$line" | sed -E "s/.*fds_start=([0-9]+).*/\1/"); fe=$(echo "$line" | sed -E "s/.*fds_end=([0-9]+).*/\1/")
            ts=$(echo "$line" | sed -E "s/.*threads_start=([0-9]+).*/\1/"); te=$(echo "$line" | sed -E "s/.*threads_end=([0-9]+).*/\1/")
            [ "$fs" = "$fe" ] && [ "$ts" = "$te" ] || { echo "LOAD cell=$cell fd or thread growth"; return 1; }
          }
          run_cell() {
            cell=$1; want=$2; shift 2
            line=$(env "$@" ./bin/load 1000 60 | grep '^load: connected' | tail -n 1) || true
            check_cell "$cell" "$want" "$line"
          }
          run_cell portable portable ROCKETNET_SERVER_TRANSPORT=portable ROCKETNET_CLIENT_TRANSPORT=portable
          run_cell gso gso ROCKETNET_SERVER_TRANSPORT=gso ROCKETNET_CLIENT_TRANSPORT=portable
          run_cell gso-plain gso ROCKETNET_SERVER_TRANSPORT=gso ROCKETNET_CLIENT_TRANSPORT=portable ROCKETNET_TEST_GSO_PLAIN=1
          if [ "$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo 0)" = 0 ]; then
            run_cell io_uring io_uring ROCKETNET_SERVER_TRANSPORT=io_uring ROCKETNET_CLIENT_TRANSPORT=portable
          else
            echo "LOAD cell=io_uring [SKIPPED this kernel disables io_uring]"
          fi
          vm_kernel="$HOME/vm-kernels/vmlinuz-$(uname -r)"
          if ! command -v vng >/dev/null || [ ! -r "$vm_kernel" ] || [ ! -w /dev/kvm ]; then
            echo "LOAD cell=xdp FAIL no VM tier on this runner: needs vng, a readable $vm_kernel and a writable /dev/kvm"
            exit 1
          fi
          # Size the guest from the plan plus the measured run reserve: the xdp
          # cell's server and its 1000 clients share one process, so the guest
          # must hold the plan's create-only total plus what start, connect and
          # the shutdown wipe add on top. Measured at a40897f3 in an
          # unconstrained 48G guest (docs/LOAD.md): peak RSS 27397952 kB at
          # 1000 clients and 13703716 kB at 500, against plans of 18214470336
          # and 9108290368 bytes, so the reserve is 9841033 and 9848630 bytes
          # per client (peak = 1.54 x plan). A 16G guest is OOM-killed (exit
          # 137, anon-rss 15.9 GB) and a 24G guest is killed at the wipe. The
          # guest is need * 5/4 + 1 GiB for the guest kernel, rounded up to
          # whole GiB: 34G for the default profile, 7.9 GiB above the peak.
          xdp_env="ROCKETNET_SERVER_TRANSPORT=xdp ROCKETNET_CLIENT_TRANSPORT=portable ROCKETNET_SERVER_NUM_XDP_QUEUES=1 ROCKETNET_SERVER_NUM_OS_CPUS=1"
          plan=$(env $xdp_env LOAD_PLAN_ONLY=1 ./bin/load 1000 60 | grep '^load_plan:' | tail -n 1) || true
          echo "LOAD cell=xdp $plan"
          case "$plan" in *verdict=PASS*) ;; *) echo "LOAD cell=xdp FAIL no PASS plan line from LOAD_PLAN_ONLY=1 ./bin/load 1000 60"; exit 1 ;; esac
          plan_bytes=$(echo "$plan" | sed -E "s/.*total_public_required_bytes=([0-9]+).*/\1/")
          gib=$((1024 * 1024 * 1024))
          reserve_per_client_bytes=9848630
          need_bytes=$(( plan_bytes + 1000 * reserve_per_client_bytes ))
          guest_gib=$(( (need_bytes * 5 / 4 + gib + gib - 1) / gib ))
          avail_kib=$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)
          if [ $((avail_kib * 1024)) -lt $((guest_gib * gib)) ]; then
            echo "LOAD cell=xdp FAIL runner has $((avail_kib / 1024)) MiB available, the guest needs ${guest_gib} GiB (plan total_public_required_bytes=$plan_bytes + 1000 x reserve $reserve_per_client_bytes = need $need_bytes, sized need*5/4+1GiB)"
            exit 1
          fi
          echo "LOAD cell=xdp guest_memory=${guest_gib}G plan_bytes=$plan_bytes need_bytes=$need_bytes runner_available_mib=$((avail_kib / 1024))"
          mkdir -p build
          guest=$(mktemp -d "$PWD/build/load-xdp.XXXXXX")
          cat > "$guest/run.sh" <<'GUEST'
          set -u
          cd "$2"
          mountpoint -q /sys/fs/bpf || mount -t bpf bpf /sys/fs/bpf
          ip netns add rnxdpload
          ip link add rnxdpload0 mtu 1500 type veth peer name rnxdpload1 mtu 1500
          ip link set rnxdpload1 netns rnxdpload
          ip addr add 10.77.3.1/24 dev rnxdpload0
          ip -n rnxdpload addr add 10.77.3.2/24 dev rnxdpload1
          ip link set rnxdpload0 up
          echo 2 > /sys/class/net/rnxdpload0/napi_defer_hard_irqs
          echo 200000 > /sys/class/net/rnxdpload0/gro_flush_timeout
          ip -n rnxdpload link set lo up
          ip -n rnxdpload link set rnxdpload1 up
          timed=""
          [ -x /usr/bin/time ] && timed="/usr/bin/time -v -o $1/xdp.time"
          $timed env ROCKETNET_SERVER_TRANSPORT=xdp ROCKETNET_CLIENT_TRANSPORT=portable \
              ROCKETNET_SERVER_NUM_XDP_QUEUES=1 ROCKETNET_SERVER_NUM_OS_CPUS=1 \
              LOAD_SERVER_ADDRESS=10.77.3.1:40411 LOAD_CLIENT_NETNS=/var/run/netns/rnxdpload \
              ./bin/load 1000 60 > "$1/xdp.out" 2> "$1/xdp.err"
          echo "guest load exit=$?"
          grep -E 'Maximum resident|Elapsed' "$1/xdp.time" 2>/dev/null
          grep -E '^(MemTotal|MemAvailable):' /proc/meminfo
          echo "guest dmesg tail:"
          dmesg | tail -n 50
          GUEST
          timeout 300 vng --run "$vm_kernel" --memory "${guest_gib}G" --cpus 16 --append "irqaffinity=0 isolcpus=1 nohz_full=1" --rwdir "$PWD" -- \
            sudo sh "$guest/run.sh" "$guest" "$PWD" > "$guest/vm.log" 2>&1 || echo "vng exit=$? (124 is the 300 s timeout)" >> "$guest/vm.log"
          peak_kib=$(sed -nE 's/.*Maximum resident set size \(kbytes\): ([0-9]+).*/\1/p' "$guest/xdp.time" 2>/dev/null | tail -n 1) || true
          echo "LOAD cell=xdp guest_peak_rss_kib=${peak_kib:-unknown} need_bytes=$need_bytes guest_memory=${guest_gib}G"
          if [ -n "${peak_kib:-}" ] && [ $((peak_kib * 1024)) -gt "$need_bytes" ]; then
            echo "LOAD cell=xdp WARN peak RSS is above the measured need; re-measure reserve_per_client_bytes (docs/LOAD.md)"
          fi
          line=$(grep '^load: connected' "$guest/xdp.out" 2>/dev/null | tail -n 1) || true
          [ -n "$line" ] || tail -n 60 "$guest/vm.log" "$guest/xdp.err" 2>/dev/null || true
          check_cell xdp xdp "$line"

  # Thirty minutes per Linux server cell under impairment, with flat fds,
  # threads and resident memory: scripts/soak-per-transport runs bin/soak
  # --seconds 1800 --assert-flat once per cell (portable, gso, gso plain,
  # io_uring, and xdp inside a virtme-ng guest of the runner's own kernel),
  # with loss, latency, jitter and duplication at both ends through the link
  # simulator's env overlay, and prints one PASS or FAIL line per cell. Five
  # cells of 30 minutes are about 152 minutes, past the two-minute rule as
  # every nightly is. A runner with no VM tier fails the xdp cell by name.
  soak-per-transport:
    name: soak per transport (${{ matrix.ref }} / 1800 s per cell)
    runs-on: [self-hosted, Linux, X64, fleet, long]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build
        run: make

      - name: Soak per transport (1800 s per cell, impaired, flat fds, threads and memory)
        timeout-minutes: 170
        shell: bash
        run: bash scripts/soak-per-transport --seconds 1800 --log-dir build/soak-per-transport

      # GitHub expressions have no replace(): the artifact name's ref slug ('/' -> '-') is made here
      - name: Artifact name for the ref
        id: refslug
        if: failure()
        shell: bash
        env:
          REF: ${{ matrix.ref }}
        run: echo "slug=${REF//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload the per-transport soak logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soak-per-transport-logs-${{ steps.refslug.outputs.slug }}
          path: build/soak-per-transport
          if-no-files-found: ignore

  soak-macos:
    name: soak (${{ matrix.ref }} / macos-15)
    runs-on: [self-hosted, macOS, ARM64, rocketnet-macos]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ "$RUNNER_OS" = "macOS" ]; then
            # darwin has no libbpf, libxdp or liburing; libsodium is the independent parity reference check_sodium.py loads
            for tool in cmake clang c++ xxd python3; do
              if ! command -v "$tool" >/dev/null 2>&1; then
                echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
                missing=1
              fi
            done
            if ! python3 -c "import ctypes.util, sys; sys.exit(0 if ctypes.util.find_library('sodium') else 1)"; then
              echo "TOOL-MISSING libsodium (any) (ctypes.util.find_library failed) on $RUNNER_NAME"
              missing=1
            fi
            exit "$missing"
          fi
          for tool in cmake gcc g++ clang xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build
        run: make

      - name: Tests
        run: ./bin/test

      - name: Simulator wire audit (bounded, every receive cross-checked)
        run: ROCKETNET_SOAK_SIM_AUDIT=1 ./bin/soak_sim 100000

      - name: Simulator soak (eight clients, light loss, any failure is a finding)
        run: ./bin/soak_sim 10000000

      - name: UDP loopback soak
        run: ./bin/soak 200000

  soak-windows:
    name: soak (${{ matrix.ref }} / windows)
    # the fleet's native Windows runner (Windows 11, MSVC; label rocketnet-windows), the one ci.yml's
    # build-and-test-windows runs on, never a hosted image. Run by hand on that runner:
    # configure 19s, Release build 114s (--parallel 4), Tests 12s, wire audit 23s, simulator
    # soak 561s, UDP loopback soak 339s; 1068s (about 18 minutes) in all, inside the 90-minute bound.
    runs-on: [self-hosted, Windows, X64, rocketnet-windows]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Configure (Windows)
        run: cmake -B build -A x64

      - name: Build (Windows)
        run: cmake --build build --config Release --parallel

      - name: Tests (Windows)
        shell: bash
        run: ./bin/Release/test.exe

      - name: Simulator wire audit (Windows)
        shell: bash
        run: ROCKETNET_SOAK_SIM_AUDIT=1 ./bin/Release/soak_sim.exe 100000

      - name: Simulator soak (Windows)
        shell: bash
        run: ./bin/Release/soak_sim.exe 10000000

      - name: UDP loopback soak (Windows)
        shell: bash
        run: ./bin/Release/soak.exe 200000

      - name: Portable transport soak under loss, jitter and duplication (Windows)
        shell: bash
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: portable
          ROCKETNET_SERVER_SIMULATED_LOSS_PERCENT: 5
          ROCKETNET_CLIENT_SIMULATED_LOSS_PERCENT: 5
          ROCKETNET_SERVER_SIMULATED_LATENCY_MS: 30
          ROCKETNET_CLIENT_SIMULATED_LATENCY_MS: 30
          ROCKETNET_SERVER_SIMULATED_JITTER_MS: 20
          ROCKETNET_CLIENT_SIMULATED_JITTER_MS: 20
          ROCKETNET_SERVER_SIMULATED_DUPLICATE_PERCENT: 2
          ROCKETNET_CLIENT_SIMULATED_DUPLICATE_PERCENT: 2
        run: |
          set -eo pipefail
          mkdir -p build/soak-windows
          ./bin/Release/soak.exe --seconds 1800 --assert-flat 2>&1 | tee build/soak-windows/portable.log
          grep -Fx 'soak summary: server_transport_io portable' build/soak-windows/portable.log
          grep -Fx 'soak summary: client_transport_io portable' build/soak-windows/portable.log

      - name: Keep Windows transport soak log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-windows-portable-${{ github.run_id }}
          path: build/soak-windows/portable.log

  # THE SANITIZED SOAK. Bounded, seed-pinned soak_sim under asan + ubsan +
  # lsan. It lived on the per-commit gate (ci.yml) until 2026-09-13, where at
  # 297 seconds it WAS the wall: the whole per-commit tier finished when this
  # job finished, and the per-commit tier finishes in one
  # to two minutes. So it moved here, unchanged -- same job name, same flags,
  # same seed, same iteration count, same log handling -- rather than being
  # weakened to fit. A slower leg moves to a tier that does not run on every
  # commit; it does not get shortened until it is cheap and stops finding
  # things.
  #
  # WHAT THE PER-COMMIT GATE STILL HAS after the move, so the loss is named
  # rather than assumed: the `sanitizers` job runs asan + ubsan over the whole
  # suite on every commit, and `tsan` runs the threaded transport. What this
  # leg alone carries is the pairing of the STATEFUL simulator's hostile-lite
  # wire with the sanitizers, and LSan -- the one leak check the estate runs
  # against a leak-clean-by-construction harness, so a report here is a new
  # unfreed allocation rather than accounting noise. Those two now land the
  # next morning instead of on the commit. A red here is read by whoever is on
  # the estate that morning and bisected back to its commit.
  #
  # soak_sim is the RIGHT target and bin/soak (real UDP loopback) is not: the
  # simulator drives the protocol layer in memory against a seeded packet
  # simulator, with no sockets and no wall clock, so a pinned seed makes the
  # entire run reproducible bit for bit. The unsanitized, far deeper soak_sim
  # and bin/soak runs are the `soak` job above; this one is short and watched.
  #
  # Same asan+ubsan flags as ci.yml's `sanitizers` job. Output is verbose, so
  # it goes to a file and only the tail is surfaced on failure.

  sanitized-soak:
    name: soak_sim (asan + ubsan + lsan, bounded)
    runs-on: [self-hosted, Linux, X64, fleet]
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Check the fleet's build dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in cmake gcc g++ xxd pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "TOOL-MISSING $tool (any) (missing) on $RUNNER_NAME"
              missing=1
            fi
          done
          for lib in libbpf libxdp libsodium liburing; do
            if ! pkg-config --exists "$lib" >/dev/null 2>&1; then
              echo "TOOL-MISSING $lib (any) (pkg-config --exists failed) on $RUNNER_NAME"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"

      - name: Build soak_sim
        run: cmake --build build --target soak_sim --parallel

      # bounded, seed-pinned. the sim's own iteration bound is the clock, not
      # wall time, so the run tries the same inputs on a slow morning as on a
      # fast one.

      - name: Run the bounded sanitized soak (seed pinned)
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ROCKETNET_SOAK_SIM_SEED: "1"
        run: |
          set -o pipefail
          if ./bin/soak_sim 600000 > soak_sim.log 2>&1; then
            echo "sanitized soak completed cleanly"
            tail -3 soak_sim.log
          else
            echo "sanitized soak FAILED (exit $?)"
            tail -80 soak_sim.log
            exit 1
          fi

      # GitHub expressions have no replace(): the artifact name's ref slug ('/' -> '-') is made here
      - name: Artifact name for the ref
        id: refslug
        if: failure()
        shell: bash
        env:
          REF: ${{ matrix.ref }}
        run: echo "slug=${REF//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload the soak log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-soak-log-${{ steps.refslug.outputs.slug }}
          path: soak_sim.log
          if-no-files-found: ignore
