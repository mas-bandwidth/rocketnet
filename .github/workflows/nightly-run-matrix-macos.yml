# THE NIGHTLY RUN MATRIX ON MACOS: THE REQUIRED MACOS CELLS NO OTHER
# WORKFLOW RUNS.
#
# The macOS half of nightly-run-matrix.yml (read its header): each server and
# client transport pinned over the whole functional suite in Release, Debug
# and production builds, the build types beyond Release and Debug, the
# compile-time values at their other settings, and the suites on a system
# libsodium. Every whole-suite run goes through tools/run_functional.sh, so
# each leg's skips are held to tests/functional/expected_skips.txt both ways,
# and nightly-watch.yml reads this workflow like every scheduled one.
#
# Its own file for its own schedule and runners. The jobs run on the
# mac-bench runners (the macbooks and the mac minis), never on the Studio,
# whose screen is in use: no fleet label but mac-bench leaves it out. 08:00
# UTC is night where the owner is, and keeps clear of 02:00-02:30 UTC (the
# frame budget measurements) and of the TLC records and CBMC runs around
# 05:00.

name: nightly-run-matrix-macos

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Test execution has no repository wall-clock cap; GitHub still limits
# self-hosted jobs to five days.
env:
  ROCKETNET_NIGHTLY_NO_TIMEOUT: '1'

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:

  # THE MACOS RELEASE TRANSPORT PINS: the whole functional suite, nightly tier
  # included, once per pair of ci.yml's TRANSPORT_MATRIX_MACOS on the mac-bench
  # runners. portable~portable is nightly.yml's
  # macos-functional-nightly step; ci.yml runs only the socket cases per pair.

  macos-pins-release:
    name: macos / Release transport pins
    runs-on: [self-hosted, macOS, ARM64, mac-bench]
    timeout-minutes: 7200
    strategy:
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    concurrency:
      group: nightly-run-matrix-macos-pins-release-${{ github.event_name }}-${{ matrix.ref }}
      cancel-in-progress: true
    env:
      CMAKE_BUILD_TYPE: Release
      ROCKETNET_TEST_NIGHTLY: "1"
      ROCKETNET_TEST_KEEP_GOING: "1"
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Build (Release, through the Makefile)
        timeout-minutes: 10
        run: make -j8

      - name: Functional suite, loopback~loopback pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: loopback
          ROCKETNET_CLIENT_TRANSPORT: loopback
        run: bash tools/run_functional.sh dev-loopback ./bin/functional

      - name: Functional suite, msgx~msgx pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: msgx
          ROCKETNET_CLIENT_TRANSPORT: msgx
        run: bash tools/run_functional.sh dev-msgx-msgx ./bin/functional

      - name: Functional suite, msgx~portable pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: msgx
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: bash tools/run_functional.sh dev-msgx-portable ./bin/functional

      - name: Functional suite, portable~auto pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
        run: bash tools/run_functional.sh dev-portable-auto ./bin/functional

      - name: Functional suite, portable~msgx pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: msgx
        run: bash tools/run_functional.sh dev-portable-msgx ./bin/functional

  # THE MACOS DEBUG TRANSPORT PINS: the same pairs and portable~portable on a
  # Debug build, whose asserts Release compiles out.

  macos-pins-debug:
    name: macos / Debug transport pins
    runs-on: [self-hosted, macOS, ARM64, mac-bench]
    timeout-minutes: 7200
    strategy:
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    concurrency:
      group: nightly-run-matrix-macos-pins-debug-${{ github.event_name }}-${{ matrix.ref }}
      cancel-in-progress: true
    env:
      CMAKE_BUILD_TYPE: Debug
      ROCKETNET_TEST_NIGHTLY: "1"
      ROCKETNET_TEST_KEEP_GOING: "1"
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Build the functional suite (Debug)
        timeout-minutes: 10
        run: |
          cmake -S . -B build-debug -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build-debug/bin" -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/build-debug/bin"
          cmake --build build-debug --target test functional --parallel 8

      - name: Functional suite, loopback~loopback pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: loopback
          ROCKETNET_CLIENT_TRANSPORT: loopback
        run: bash tools/run_functional.sh dev-loopback ./build-debug/bin/functional

      - name: Functional suite, msgx~msgx pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: msgx
          ROCKETNET_CLIENT_TRANSPORT: msgx
        run: bash tools/run_functional.sh dev-msgx-msgx ./build-debug/bin/functional

      - name: Functional suite, msgx~portable pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: msgx
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: bash tools/run_functional.sh dev-msgx-portable ./build-debug/bin/functional

      - name: Functional suite, portable~auto pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
        run: bash tools/run_functional.sh dev-portable-auto ./build-debug/bin/functional

      - name: Functional suite, portable~msgx pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: msgx
        run: bash tools/run_functional.sh dev-portable-msgx ./build-debug/bin/functional

      - name: Functional suite, portable~portable pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: bash tools/run_functional.sh dev-portable ./build-debug/bin/functional

  # THE MACOS PRODUCTION TRANSPORT PINS: each pair on functional_production
  # (ROCKETNET_DEV=OFF). auto~auto runs on every commit (ci.yml) and
  # portable~portable nightly (nightly.yml).

  macos-pins-production:
    name: macos / production transport pins
    runs-on: [self-hosted, macOS, ARM64, mac-bench]
    timeout-minutes: 7200
    strategy:
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    concurrency:
      group: nightly-run-matrix-macos-pins-production-${{ github.event_name }}-${{ matrix.ref }}
      cancel-in-progress: true
    env:
      CMAKE_BUILD_TYPE: Release
      ROCKETNET_TEST_NIGHTLY: "1"
      ROCKETNET_TEST_KEEP_GOING: "1"
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Build the production functional suite (Release, ROCKETNET_DEV=OFF)
        timeout-minutes: 10
        run: |
          cmake -S . -B build-production -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" -DROCKETNET_DEV=OFF -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build-production/bin" -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/build-production/bin"
          cmake --build build-production --target functional_production --parallel 8

      - name: Production functional suite, loopback~loopback pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: loopback
          ROCKETNET_CLIENT_TRANSPORT: loopback
        run: bash tools/run_functional.sh prod-loopback ./build-production/bin/functional_production

      - name: Production functional suite, msgx~msgx pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: msgx
          ROCKETNET_CLIENT_TRANSPORT: msgx
        run: bash tools/run_functional.sh prod-msgx-msgx ./build-production/bin/functional_production

      - name: Production functional suite, msgx~portable pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: msgx
          ROCKETNET_CLIENT_TRANSPORT: portable
        run: bash tools/run_functional.sh prod-msgx-portable ./build-production/bin/functional_production

      - name: Production functional suite, portable~auto pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
        run: bash tools/run_functional.sh prod-portable-auto ./build-production/bin/functional_production

      - name: Production functional suite, portable~msgx pinned
        if: ${{ !cancelled() }}
        env:
          ROCKETNET_SERVER_TRANSPORT: portable
          ROCKETNET_CLIENT_TRANSPORT: msgx
        run: bash tools/run_functional.sh prod-portable-msgx ./build-production/bin/functional_production

  # THE MACOS BUILD TYPES AND COMPILE-TIME VALUES: MinSizeRel and
  # RelWithDebInfo, and each documented bound and CMake option at its other
  # value, build both suites and run them. matrix.cfg.config is the cell's
  # config axis in tools/verification_matrix.tsv (build types carry the build
  # type there). The fleet has few macOS runners, so two rows run at once.

  macos-configs:
    name: macos / build types, compile-time values and options
    runs-on: [self-hosted, macOS, ARM64, mac-bench]
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
        cfg:
          - { config: "MinSizeRel", build: MinSizeRel, flags: "" }
          - { config: "RelWithDebInfo", build: RelWithDebInfo, flags: "" }
          - { config: "HISTORY_PACKETS=32768", build: Release, flags: "-DROCKETNET_HISTORY_PACKETS=32768" }
          - { config: "MAX_CLIENTS=32768", build: Release, flags: "-DROCKETNET_MAX_CLIENTS=32768" }
          - { config: "MAX_CLIENTS=512", build: Release, flags: "-DROCKETNET_MAX_CLIENTS=512" }
          - { config: "ROCKETNET_HARDEN=OFF", build: Release, flags: "-DROCKETNET_HARDEN=OFF" }
    concurrency:
      group: nightly-run-matrix-macos-configs-${{ github.event_name }}-${{ matrix.ref }}-${{ matrix.cfg.config }}
      cancel-in-progress: true
    env:
      ROCKETNET_TEST_NIGHTLY: "1"
      ROCKETNET_TEST_KEEP_GOING: "1"
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Build both suites
        timeout-minutes: 10
        env:
          CMAKE_BUILD_TYPE: ${{ matrix.cfg.build }}
          CONFIG_FLAGS: ${{ matrix.cfg.flags }}
        run: |
          # shellcheck disable=SC2086
          cmake -S . -B build-config -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" $CONFIG_FLAGS -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build-config/bin" -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/build-config/bin"
          cmake --build build-config --target test functional --parallel 8

      - name: Unit suite
        run: ./build-config/bin/test

      - name: Functional suite (automatic transport order)
        if: ${{ !cancelled() }}
        run: bash tools/run_functional.sh dev ./build-config/bin/functional

  # THE MACOS SUITES ON A SYSTEM LIBSODIUM: ROCKETNET_USE_SYSTEM_SODIUM=ON
  # against the content-verified 1.0.20 that ci.yml's sodium-pinned leg
  # builds on Linux, built here from the same tarball for this macOS release
  # and machine. The library's install name is the prefix's absolute path, so
  # the suites load it with no loader variable.

  macos-system-sodium:
    name: macos / suites on the pinned system libsodium
    runs-on: [self-hosted, macOS, ARM64, mac-bench]
    timeout-minutes: 7200
    strategy:
      matrix:
        ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON(vars.ROCKETNET_NIGHTLY_REFS || '["main"]') }}
    concurrency:
      group: nightly-run-matrix-macos-system-sodium-${{ github.event_name }}-${{ matrix.ref }}
      cancel-in-progress: true
    env:
      CMAKE_BUILD_TYPE: Release
      ROCKETNET_TEST_NIGHTLY: "1"
      ROCKETNET_TEST_KEEP_GOING: "1"
      SODIUM_VERSION: "1.0.20"
      SODIUM_SHA256: "ebb65ef6ca439333c2bb41a0c1990587288da07f6c7fd07cb3a18cc18d30ce19"
      SODIUM_PREFIX: ${{ github.workspace }}/sodium-pin
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - name: Read the host the prefix is built for
        id: host
        run: |
          host="macos-$(sw_vers -productVersion)-$(uname -m)"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "pinned libsodium prefix for host $host on $RUNNER_NAME"

      - name: Restore the pinned sodium prefix
        id: sodium-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ env.SODIUM_PREFIX }}
          key: sodium-pin-${{ env.SODIUM_VERSION }}-${{ runner.os }}-${{ steps.host.outputs.host }}

      - name: Build the pinned libsodium from source (content-verified)
        timeout-minutes: 6
        if: steps.sodium-cache.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/jedisct1/libsodium/releases/download/${SODIUM_VERSION}-RELEASE/libsodium-${SODIUM_VERSION}.tar.gz"
          curl -fsSL -o sodium.tar.gz "$url"
          echo "${SODIUM_SHA256}  sodium.tar.gz" | shasum -a 256 -c -
          mkdir sodium-src
          tar xzf sodium.tar.gz -C sodium-src --strip-components=1
          cd sodium-src
          ./configure --prefix="${SODIUM_PREFIX}" --disable-dependency-tracking
          make -j8
          make install

      - name: Prove pkg-config resolves the pin
        env:
          PKG_CONFIG_LIBDIR: ${{ env.SODIUM_PREFIX }}/lib/pkgconfig
        run: |
          resolved="$(pkg-config --modversion libsodium)"
          echo "pkg-config resolves libsodium ${resolved} (pin is ${SODIUM_VERSION})"
          [ "$resolved" = "$SODIUM_VERSION" ]

      - name: Build both suites against the pinned sodium
        timeout-minutes: 10
        env:
          PKG_CONFIG_LIBDIR: ${{ env.SODIUM_PREFIX }}/lib/pkgconfig
        run: |
          cmake -S . -B build-sodium -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" -DROCKETNET_USE_SYSTEM_SODIUM=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build-sodium/bin" -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/build-sodium/bin"
          cmake --build build-sodium --target test functional --parallel 8

      - name: Unit suite, ROCKETNET_USE_SYSTEM_SODIUM=ON
        run: ./build-sodium/bin/test

      - name: Functional suite, ROCKETNET_USE_SYSTEM_SODIUM=ON
        if: ${{ !cancelled() }}
        run: bash tools/run_functional.sh dev ./build-sodium/bin/functional
